<!DOCTYPE html>
<body></body>
<script src="../testing.js"></script>

<script id="gbk_encoding" type=module>
  {
    const state = await testing.async();
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = 'encoding/gbk.nocharset.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      // GBK-encoded "中文" should be decoded to UTF-8
      testing.expectEqual('中文', iframe.contentDocument.getElementById('test').textContent);
      // document.characterSet should return canonical encoding name
      testing.expectEqual('GBK', iframe.contentDocument.characterSet);
      testing.expectEqual('GBK', iframe.contentDocument.charset);
      testing.expectEqual('GBK', iframe.contentDocument.inputEncoding);
    });
  }
</script>

<script id="content_type_header_charset" type=module>
  {
    const state = await testing.async();

    // Test charset from Content-Type HTTP header (no meta charset in file)
    // TestHTTPServer returns "text/html; charset=GB2312" for *.GB2312.html files
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = testing.BASE_URL + 'page/encoding/content_type.GB2312.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      // GB2312-encoded "中文" should be decoded to UTF-8 via Content-Type header charset
      testing.expectEqual('中文', iframe.contentDocument.getElementById('test').textContent);
    });
  }
</script>

<script id="unicode_label_falls_back_to_utf8" type=module>
  {
    const state = await testing.async();

    // The legacy "unicode" label maps to UTF-16LE, but HTML prescan maps
    // UTF-16 labels back to UTF-8 so ASCII pages stay readable.
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = 'encoding/unicode_label.nocharset.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      testing.expectEqual('Hello world', iframe.contentDocument.getElementById('title').textContent);
      testing.expectEqual(
        'This page is plain ASCII but declares charset=unicode.',
        iframe.contentDocument.getElementById('body').textContent,
      );
      testing.expectEqual('UTF-8', iframe.contentDocument.characterSet);
      testing.expectEqual('UTF-8', iframe.contentDocument.charset);
      testing.expectEqual('UTF-8', iframe.contentDocument.inputEncoding);
    });
  }
</script>

<script id="no_charset_fallback" type=module>
  {
    const state = await testing.async();

    // A file with non-UTF-8 bytes and no charset declaration anywhere. With
    // nothing to go on the fallback is windows-1252, the way Chrome 151 does
    // it, so the GBK bytes D6 D0 CE C4 come through as their 1252 characters
    // rather than as replacement characters.
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = 'encoding/no_charset.nocharset.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      const text = iframe.contentDocument.getElementById('test').textContent;
      testing.expectEqual('\u00D6\u00D0\u00CE\u00C4', text);
      testing.expectTrue(!text.includes('\uFFFD'));
      testing.expectEqual('windows-1252', iframe.contentDocument.characterSet);
    });
  }
</script>

<script id="default_encoding_is_windows_1252" type=module>

    await state.done(() => {

      testing.expectEqual('Ä', iframe.contentDocument.getElementById('test').textContent);

</script>

<script id="meta_x_user_defined_becomes_windows_1252" type=module>

    iframe.onload = () => { state.resolve(); }

<script id="anchor_href_encoding_with_ncr" type=module>
  {
    const state = await testing.async();

    // Test that anchor.href encodes unmappable characters as NCRs in non-UTF-8 documents.
    // When a character can't be represented in the document's encoding, it should become &#nnnnn;
    // Per WHATWG URL Standard, query strings use document encoding with NCR fallback.
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = 'encoding/gbk.nocharset.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      testing.expectEqual('GBK', iframe.contentDocument.characterSet);

      // Test 1: U+3D34 (㴴) - a Han character NOT in GBK, should become NCR &#15668;
      const anchor = iframe.contentDocument.createElement('a');
      iframe.contentDocument.body.appendChild(anchor);
      anchor.href = 'http://example.com/?q=\u3D34';
      // The NCR &#15668; percent-encoded is %26%2315668%3B
      testing.expectEqual('http://example.com/?q=%26%2315668%3B', anchor.href);

      // Test 2: U+4E2D (中) - IS in GBK, should encode to GBK bytes D6D0 then percent-encode
      const anchor2 = iframe.contentDocument.createElement('a');
      iframe.contentDocument.body.appendChild(anchor2);
      anchor2.href = 'http://example.com/?q=\u4E2D';
      // GBK encoding of 中 is D6 D0, percent-encoded as %D6%D0
      testing.expectEqual('http://example.com/?q=%D6%D0', anchor2.href);
    });
  }
</script>

<script id="meta_charset_past_the_prescan_window" type=module>
  {
    const state = await testing.async();

    // Chrome keeps scanning <head> for a charset with no byte ceiling: this
    // meta sits ~1130 bytes in and still decides the encoding. It does not
    // re-parse to get there -- it holds the decoded output back until the scan
    // settles, so text ahead of the meta comes out right too (measured against
    // headed Chrome 151).
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = 'encoding/late_meta.nocharset.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      testing.expectEqual('UTF-8', iframe.contentDocument.characterSet);
      testing.expectEqual('Ä', iframe.contentDocument.getElementById('test').textContent);
    });
  }
</script>

<script id="late_meta_charset_in_body_is_ignored" type=module>
  {
    const state = await testing.async();

    // The scan only outlives the 1024-byte window while it is still in the

    // UTF-8 bytes C3 84 read as their windows-1252 characters.
    const iframe = document.createElement('iframe');
    document.body.appendChild(iframe);
    iframe.src = 'encoding/late_meta_in_body.nocharset.html';
    iframe.onload = () => { state.resolve(); }

    await state.done(() => {
      testing.expectEqual('windows-1252', iframe.contentDocument.characterSet);
      testing.expectEqual('Ã„', iframe.contentDocument.getElementById('test').textContent);
    });
  }
</script>
