<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=xhr type=module>
  testing.expectEqual(0, XMLHttpRequest.UNSENT);
  testing.expectEqual(1, XMLHttpRequest.OPENED);
  testing.expectEqual(2, XMLHttpRequest.HEADERS_RECEIVED);
  testing.expectEqual(3, XMLHttpRequest.LOADING);
  testing.expectEqual(4, XMLHttpRequest.DONE);
  {
    const state = await testing.async();
    const req = new XMLHttpRequest();

    function cbk(event) {
      state.resolve(event)
    }

    req.onload = cbk;
    testing.expectEqual(cbk, req.onload);
    req.onload = cbk;

    req.open('GET', 'http://127.0.0.1:9582/xhr');
    testing.expectEqual(0, req.status);
    testing.expectEqual('', req.statusText);
    testing.expectEqual('', req.getAllResponseHeaders());
    testing.expectEqual(null, req.getResponseHeader('Content-Type'));
    testing.expectEqual('', req.responseText);
    testing.expectEqual('', req.responseURL);
    req.send();


    await state.done((event) => {
      testing.expectEqual('load', event.type);
      testing.expectEqual(true, event.loaded > 0);
      testing.expectEqual(true, event instanceof ProgressEvent);
      testing.expectEqual(200, req.status);
      testing.expectEqual('OK', req.statusText);
      testing.expectEqual('text/html; charset=utf-8', req.getResponseHeader('Content-Type'));
      testing.expectEqual('content-length: 100\r\ncontent-type: text/html; charset=utf-8\r\n', req.getAllResponseHeaders());
      testing.expectEqual(100, req.responseText.length);
      testing.expectEqual(req.responseText.length, req.response.length);
      testing.expectEqual('http://127.0.0.1:9582/xhr', req.responseURL);
    });
  }
</script>

<script id=xhr5 type=module>
  {
    const state = await testing.async();
    let records = [];
    const req5 = new XMLHttpRequest();
    req5.onreadystatechange = (e) => {
      records.push(req5.readyState);
      if (req5.readyState === XMLHttpRequest.DONE) {
        state.resolve({records: records, target: e.currentTarget});
      }
    }
    req5.open('GET', 'http://127.0.0.1:9582/xhr');
    req5.send();

    await state.done((result) => {
      const {records: records, target: target} = result;
      testing.expectEqual(4, records.length)
      testing.expectEqual(XMLHttpRequest.OPENED, records[0]);
      testing.expectEqual(XMLHttpRequest.HEADERS_RECEIVED, records[1]);
      testing.expectEqual(XMLHttpRequest.LOADING, records[2]);
      testing.expectEqual(XMLHttpRequest.DONE, records[3]);
      testing.expectEqual(req5, target);
    });
  }
</script>

<script id=xhr_abort type=module>
  {
    const state = await testing.async();
    const req = new XMLHttpRequest();
    let abortFired = false;
    let errorFired = false;
    let loadEndFired = false;

    req.onabort = () => { abortFired = true; };
    req.onerror = () => { errorFired = true; };
    req.onloadend = () => {
      loadEndFired = true;
      state.resolve();
    };

    req.open('GET', 'http://127.0.0.1:9582/xhr');
    req.send();
    req.abort();

    await state.done(() => {
      testing.expectEqual(true, abortFired);
      testing.expectEqual(true, errorFired);
      testing.expectEqual(true, loadEndFired);
      testing.expectEqual(XMLHttpRequest.UNSENT, req.readyState);
    });
  }
</script>

<script id=xhr_override_mime type=module>
  {
    // overrideMimeType is callable in state UNSENT (no open() yet)
    const req = new XMLHttpRequest();
    testing.expectEqual(0, req.readyState);
    req.overrideMimeType('text/xml');
  }

  {
    // overrideMimeType is callable in state OPENED
    const req = new XMLHttpRequest();
    req.open('GET', 'http://127.0.0.1:9582/xhr');
    testing.expectEqual(1, req.readyState);
    req.overrideMimeType('text/xml; charset=utf-8');
  }

  {
    // Invalid mime values must NOT throw; they fall back to
    // application/octet-stream per spec.
    const req = new XMLHttpRequest();
    req.overrideMimeType('!!!');
    req.overrideMimeType('');
    req.overrideMimeType('not a mime');
  }

</script>

<script id=xhr_override_mime_survives_open type=module>
  {

    req.send();
    await state.done(() => {
      testing.expectEqual(200, req.status);
    });
  }
</script>

<script id=xhr_timeout type=module>
  {
    // timeout property: default is 0
    const req = new XMLHttpRequest();
    testing.expectEqual(0, req.timeout);

    // timeout can be set and read back
    req.timeout = 5000;
    testing.expectEqual(5000, req.timeout);

    // request with timeout set succeeds normally when server responds in time
    const state = await testing.async();
    req.onload = (e) => { state.resolve(e) };
    req.open('GET', 'http://127.0.0.1:9582/xhr');
    req.send();

    });
  }

<script id=xhr_reuse type=module>
  {
    // Reusing the same XHR object from its own onload handler (open()+send()
    // again) must not leak: send() acquires a self-ref and each request's
    // terminal callback releases one. The second send() starts while the
    // first request's release is still pending (it runs after this load
    // dispatch), so both refs are briefly live. A regression here is caught
    // by the test runner's ArenaPool leak check at teardown.
    const state = await testing.async();

    const req = new XMLHttpRequest();
    let loads = 0;
    req.onload = () => {
      loads += 1;
      if (loads === 1) {
        // reuse the same object for a second request
        req.open('GET', 'http://127.0.0.1:9582/xhr');
        req.send();
      } else {
        state.resolve();
      }
    };
    req.open('GET', 'http://127.0.0.1:9582/xhr');
    req.send();

    await state.done(() => {
      testing.expectEqual(2, loads);
      testing.expectEqual(200, req.status);
    });
  }
</script>

<script id=xhr_upload type=module>
  {
    // upload is an XMLHttpRequestUpload (an XMLHttpRequestEventTarget) and
    // exposes addEventListener; htmx relies on this not throwing.
    const req = new XMLHttpRequest();
    testing.expectEqual('XMLHttpRequestUpload', req.upload.constructor.name);
    testing.expectEqual(true, req.upload instanceof XMLHttpRequestEventTarget);
    testing.expectEqual(true, req.upload instanceof EventTarget);
    testing.expectEqual('function', typeof req.upload.addEventListener);

    // The same instance is returned on every access so listeners stick.
    testing.expectEqual(req.upload, req.upload);

    let registered = false;
    req.upload.addEventListener('progress', () => { registered = true; });
    testing.expectEqual(false, registered);
  }
</script>

<script id=xhr_send_flag type=module>
  {
    // Per spec, calling send() while a request is already in flight throws
    // InvalidStateError (the "send() flag"). Without it, two concurrent
    // transfers race on the XHR's single response slot and one is left dangling
    // at teardown (the "release overflow" UAF).
    const state = await testing.async();
    const req = new XMLHttpRequest();
    req.onload = () => state.resolve();
    req.open('GET', 'http://127.0.0.1:9582/xhr');
    req.send();
    testing.expectError('InvalidStateError', () => req.send());

    await state.done(() => {
      // the first request was unaffected by the rejected second send()
      testing.expectEqual(200, req.status);
    });

    // a fresh open() clears the flag, so the object is reusable
    const state2 = await testing.async();
    req.onload = () => state2.resolve();
    req.open('GET', 'http://127.0.0.1:9582/xhr');
    req.send();
    await state2.done(() => testing.expectEqual(200, req.status));
  }
</script>

<script id=xhr_handler_order type=module>
  {
    // A handler property is an event listener: it takes its place in the
    // target's listener list when first set. Measured on a headed Chrome 150
    // (probe-g22e): every one of these is "al1,on,al2". Ours ran the handler
    // ahead of the list, and onreadystatechange -- read only on the internal
    // dispatch path -- did not run on a dispatchEvent at all.
    const order = (make, name, type) => {
      const log = [];
      const t = make();
      t.addEventListener(type, () => log.push('al1'));
      t[name] = () => log.push('on');
      t.addEventListener(type, () => log.push('al2'));
      t.dispatchEvent(new Event(type));
      return log.join(',');
    };

    for (const [name, type] of [
      ['onloadstart', 'loadstart'], ['onprogress', 'progress'], ['onabort', 'abort'],
      ['onerror', 'error'], ['onload', 'load'], ['ontimeout', 'timeout'],
      ['onloadend', 'loadend'], ['onreadystatechange', 'readystatechange'],
    ]) {
      testing.expectEqual('al1,on,al2', order(() => new XMLHttpRequest(), name, type), { desc: 'xhr.' + name });
    }
    for (const [name, type] of [['onprogress', 'progress'], ['onload', 'load']]) {
      testing.expectEqual('al1,on,al2', order(() => new XMLHttpRequest().upload, name, type), { desc: 'upload.' + name });
    }
  }
</script>

<script id=xhr_handler_this type=module>
  {
    // `this` inside a handler is the target it was set on, request or upload.
    const x = new XMLHttpRequest();
    let same = null;
    x.onload = function () { same = (this === x); };
    x.dispatchEvent(new Event('load'));
    testing.expectEqual(true, same, { desc: 'this is the request' });

    const u = x.upload;
    let sameUpload = null;
    u.onload = function () { sameUpload = (this === u); };
    u.dispatchEvent(new Event('load'));
    testing.expectEqual(true, sameUpload, { desc: 'this is the upload' });
  }
</script>

<script id=xhr_handler_reassignment type=module>
  {
    // Re-assigning swaps the function in place; clearing and setting again
    // appends at the end.
    const build = (clear) => {
      const log = [];
      const x = new XMLHttpRequest();
      x.addEventListener('load', () => log.push('al1'));
      x.onload = () => log.push('on-first');
      x.addEventListener('load', () => log.push('al2'));
      if (clear) x.onload = null;
      x.onload = () => log.push('on-second');
      x.dispatchEvent(new Event('load'));
      return log.join(',');
    };
    testing.expectEqual('al1,on-second,al2', build(false), { desc: 'reassign keeps the slot' });
    testing.expectEqual('al1,al2,on-second', build(true), { desc: 'clear then set appends' });
  }
</script>

<script id=xhr_handler_order_on_a_real_request type=module>
  {
    // The same ordering on the internal dispatch path, which used to pass the
    // handler by hand ahead of the list.
    const state = await testing.async();
    const log = [];
    const req = new XMLHttpRequest();
    req.addEventListener('readystatechange', () => log.push('rsc-al'));
    req.onreadystatechange = () => log.push('rsc-on');
    req.addEventListener('load', () => log.push('al1'));
    req.onload = () => log.push('on');
    req.addEventListener('load', () => log.push('al2'));
    req.addEventListener('loadend', () => state.resolve());
    req.open('GET', 'http://127.0.0.1:9582/xhr');
    req.send();

    await state.done(() => {
      // Collapse the readystatechange repeats: how many there are is a
      // different question from what order each pair runs in.
      const collapsed = log.filter((v, i) => v !== log[i - 1]);
      testing.expectEqual('rsc-al,rsc-on', collapsed.slice(0, 2).join(','), { desc: 'readystatechange pair' });
      testing.expectEqual('al1,on,al2', collapsed.slice(-3).join(','), { desc: 'load triple' });
    });
  }
</script>

<script id=xhr_request_headers type=module>
  {
    // setRequestHeader can add and merge author headers, but a Sec-* name is a
    // forbidden header name, so the author's client hint never reaches the
    // wire and the engine's own goes out instead.
    const state = await testing.async();
    const req = new XMLHttpRequest();
    req.onload = () => state.resolve();
    req.open('GET', 'http://127.0.0.1:9582/echo_headers');
    req.setRequestHeader('Accept-Language', 'fr');
    req.setRequestHeader('X-Multi', 'a');
    req.setRequestHeader('X-Multi', 'b');
    req.setRequestHeader('User-Agent', 'Mozilla/5.0 (X11; Linux x86_64)');
    req.setRequestHeader('Sec-Ch-Ua', '"Chromium";v="140"');
    req.send();

    await state.done(() => {
      const got = {};
      for (const line of req.responseText.trim().split('\n')) {
        const sep = line.indexOf(': ');
        got[line.slice(0, sep).toLowerCase()] = line.slice(sep + 2);
      }
      testing.expectEqual('fr', got['accept-language']);
      testing.expectEqual('a, b', got['x-multi']);
      testing.expectEqual(false, got['sec-ch-ua'] === '"Chromium";v="140"');
      testing.expectEqual(true, got['sec-ch-ua'].includes('Google Chrome'));
    });
  }
</script>

<script id=xhr_header_order type=module>
  {
    // Header ORDER is a fingerprint, not just the set. Measured on a headed
    // Chrome 151 against the same local echo server
    // (tools/fingerprint/results/regression-2026-08-20-probe-chrome.json, the
    // localHeaders step): a subresource leads with sec-ch-ua-platform and
    // User-Agent and only then repeats sec-ch-ua / sec-ch-ua-mobile, which is a
    // different order from the one a navigation uses.
    const state = await testing.async();
    const req = new XMLHttpRequest();
    req.onload = () => state.resolve();
    req.open('GET', 'http://127.0.0.1:9582/echo_headers');
    req.send();

    await state.done(() => {
      const names = req.responseText.trim().split('\n')
        .map(l => l.slice(0, l.indexOf(':')).toLowerCase());
      testing.expectEqual([
        'host', 'connection', 'sec-ch-ua-platform', 'user-agent', 'sec-ch-ua',
        'sec-ch-ua-mobile', 'accept', 'sec-fetch-site', 'sec-fetch-mode',
        'sec-fetch-dest', 'referer', 'accept-encoding', 'accept-language',
      ], names);
    });
  }
</script>

<!--
Production crash (release overflow on unrelated pooled objects): a re-send from
inside onerror stored a new transfer that httpErrorCallback then cleared once
the handler returned. The re-send was orphaned, so the later abort() found an
empty slot and never cancelled it, and the request ran on into a freed XHR.
Observable here without the crash: the orphaned re-send is never aborted, so it
delivers its response (onload) despite abort(). With the slot cleared before the
handler runs, abort() cancels the re-send and no load is delivered.
-->
<script id=xhr_resend_in_onerror_then_abort type=module>
  {
    const state = await testing.async();
    const req = new XMLHttpRequest();
    let loadFired = false;
    let abortFired = false;
    let resent = false;

    req.onload = () => { loadFired = true; };
    req.onabort = () => { abortFired = true; };
    req.onerror = () => {
      if (resent) {
        return;
      }
      resent = true;
      // Retry inside the error handler, like a reconnecting client. The slow
      // target keeps the retry in flight until the abort below.
      req.open('GET', 'http://127.0.0.1:9582/xhr/slow');
      req.send();
      // After the handler has returned to httpErrorCallback.
      setTimeout(() => {
        req.abort();
        // Long enough for the aborted-but-orphaned re-send to have delivered
        // /xhr/slow (100ms) if abort() failed to cancel it.
        setTimeout(() => state.resolve(), 250);
      }, 0);
    };

    // Nothing listens on port 1: a network error, not an HTTP one.
    req.open('GET', 'http://127.0.0.1:1/');
    req.send();

    await state.done(() => {
      testing.expectEqual(true, abortFired);
      // The aborted re-send must never deliver its response.
      testing.expectEqual(false, loadFired);
      testing.expectEqual(XMLHttpRequest.UNSENT, req.readyState);
    });
  }
</script>

<script id=xhr_event_order_and_header_names type=module>
  {
    // Three readings off a headless Chrome 151, all of them things the Akamai
    // sensor can see because it proxies send() and hooks readystatechange:
    //
    //   - loadstart fires inside send(), at readyState 1, before send()
    //     returns. It used to arrive with the response headers, at 2.
    //   - readyState 3 waits for the first body chunk, so responseText is
    //     already non-empty when it arrives. It used to be announced along with
    //     the headers, with nothing to read yet.
    //   - getAllResponseHeaders() answers from HEADERS_RECEIVED on, with every
    //     name lowercased and the lines sorted by name, per XHR §4.6.5.
    const state = await testing.async();
    const req = new XMLHttpRequest();
    const log = [];
    const note = (tag) => log.push(tag + ':' + req.readyState);

    let atHeaders = null, textAtLoading = null;
    for (const name of ['loadstart', 'progress', 'load']) {
      req.addEventListener(name, () => note(name));
    }
    req.onreadystatechange = () => {
      note('rsc');
      if (req.readyState === 2) atHeaders = req.getAllResponseHeaders();
      if (req.readyState === 3 && textAtLoading === null) textAtLoading = req.responseText;
    };
    req.addEventListener('load', () => state.resolve());

    req.open('GET', 'http://127.0.0.1:9582/xhr/headers_order');
    note('afterOpen');
    req.send();
    note('afterSend');

    await state.done(() => {
      testing.expectEqual(
        'rsc:1,afterOpen:1,loadstart:1,afterSend:1,rsc:2,rsc:3,progress:3,rsc:4,load:4',
        log.join(','),
      );
      const headers = 'a-first: yes\r\ncontent-length: 5\r\n' +
        'content-type: text/plain\r\nx-zed: last\r\n';
      testing.expectEqual(headers, atHeaders);
      testing.expectEqual(headers, req.getAllResponseHeaders());
      testing.expectEqual('hello', textAtLoading);
      // Case-insensitive lookup still finds the name as it came off the wire.
      testing.expectEqual('last', req.getResponseHeader('X-Zed'));
    });
  }
</script>

<script id=xhr_blob type=module>
  {
    const state = await testing.async();
    const req = new XMLHttpRequest();
    req.onload = () => { state.resolve() };
    req.open('GET', 'http://127.0.0.1:9582/xhr/binary');
    req.responseType = 'blob';
    req.send();

    await state.done(() => {
      testing.expectEqual(200, req.status);
      testing.expectEqual('blob', req.responseType);
      testing.expectEqual(true, req.response instanceof Blob);
      testing.expectEqual(7, req.response.size);
      // Per spec the blob response entity body is cached: the same object comes
      // back on every access.
      testing.expectEqual(req.response, req.response);
      testing.expectEqual('application/octet-stream', req.response.type);
    });

    testing.expectEqual([0, 0, 1, 2, 0, 0, 9], new Int8Array(await req.response.arrayBuffer()));
  }
</script>

<script id=xhr_blob_type type=module>
  {
    // The blob's type is the final MIME type with its parameters, not the
    // essence Mime.zig keeps. The spec re-serializes it ("text/html;charset=utf-8");
    // we report the header text as-is, lowercased by Blob.
    const state = await testing.async();

    const blobType = (path, override) => new Promise((resolve) => {
      const req = new XMLHttpRequest();
      req.onload = () => { resolve(req.response.type) };
      req.open('GET', 'http://127.0.0.1:9582' + path);
      req.responseType = 'blob';
      if (override !== undefined) {
        req.overrideMimeType(override);
      }
      req.send();
    });

    let types;
    Promise.all([
      blobType('/xhr'),
      blobType('/xhr/no_content_type'),
      blobType('/xhr', 'text/plain;charset=iso-8859-1'),
      blobType('/xhr', 'nonsense'),
    ]).then((t) => { types = t; state.resolve() });

    await state.done(() => {
      testing.expectEqual('text/html; charset=utf-8', types[0]);
      // Absent a Content-Type, "get a response MIME type" yields text/xml.
      testing.expectEqual('text/xml', types[1]);
      // overrideMimeType() wins over the response's own Content-Type.
      testing.expectEqual('text/plain;charset=iso-8859-1', types[2]);
      // An unparseable override is application/octet-stream.
      testing.expectEqual('application/octet-stream', types[3]);
    });
  }
</script>

<script id=prototype_shape>
  {
    // Chrome's own Object.getOwnPropertyNames(XMLHttpRequest.prototype) order,
    // measured on Chrome 151 over https (probes/expr-constructor-slot.js).
    // The order is not the spec's and not alphabetical -- it is Blink's, and
    // the interstitial this fork chases proxies XMLHttpRequest.prototype.send,
    // so this is a prototype a bot check has already got its hands on.
    testing.expectEqual(
      'onreadystatechange,readyState,timeout,withCredentials,upload,responseURL,' +
      'status,statusText,responseType,response,responseText,' +
      'UNSENT,OPENED,HEADERS_RECEIVED,LOADING,DONE,' +
      'abort,getAllResponseHeaders,getResponseHeader,open,overrideMimeType,send,' +
      'setRequestHeader,constructor,responseXML,setAttributionReporting,setPrivateToken',
      Object.getOwnPropertyNames(XMLHttpRequest.prototype).join(','),
    );
    for (const m of ['setAttributionReporting', 'setPrivateToken']) {
      const d = Object.getOwnPropertyDescriptor(XMLHttpRequest.prototype, m);
      testing.expectEqual('function', typeof d.value, { desc: m + ' is a method' });
      testing.expectEqual(1, d.value.length, { desc: m + ' arity' });
      testing.expectEqual(m, d.value.name, { desc: m + ' name' });
      testing.expectEqual(true, d.enumerable, { desc: m + ' enumerable' });
      testing.expectEqual(true, d.configurable, { desc: m + ' configurable' });
      testing.expectEqual(true, d.writable, { desc: m + ' writable' });
    }
  }
</script>

<script id=set_attribution_reporting>
  {
    // Every string below is Chrome 151's, measured. The order of the checks is
    // measured too: argument count, then "is it an object", then the dictionary
    // read (alphabetical, so eventSourceEligible before triggerEligible), and
    // only then the readyState gate -- a valid dictionary on an UNSENT request
    // still reaches the InvalidStateError.
    const pre = "Failed to execute 'setAttributionReporting' on 'XMLHttpRequest': ";
    const opened = () => { const x = new XMLHttpRequest(); x.open('GET', 'http://127.0.0.1:9582/xhr/headers_order'); return x; };
    const call = (fn) => { try { return 'ok:' + String(fn()); } catch (e) { return e.name + ': ' + e.message; } };

    testing.expectEqual('TypeError: ' + pre + '1 argument required, but only 0 present.',
      call(() => opened().setAttributionReporting()));
    for (const bad of [undefined, null, 5, 's']) {
      testing.expectEqual(
        'TypeError: ' + pre + "The provided value is not of type 'AttributionReportingRequestOptions'.",
        call(() => opened().setAttributionReporting(bad)), { desc: 'not an object: ' + String(bad) });
    }
    const required = (member) => 'TypeError: ' + pre + "Failed to read the '" + member +
      "' property from 'AttributionReportingRequestOptions': Required member is undefined.";
    testing.expectEqual(required('eventSourceEligible'), call(() => opened().setAttributionReporting({})));
    // An array is an object, so it gets as far as the dictionary read.
    testing.expectEqual(required('eventSourceEligible'), call(() => opened().setAttributionReporting([])));
    testing.expectEqual(required('eventSourceEligible'), call(() => opened().setAttributionReporting({ triggerEligible: true })));
    testing.expectEqual(required('triggerEligible'), call(() => opened().setAttributionReporting({ eventSourceEligible: true })));
    // Both members are booleans, so anything converts.
    testing.expectEqual('ok:undefined',
      call(() => opened().setAttributionReporting({ eventSourceEligible: 'x', triggerEligible: 0 })));

    const state = 'InvalidStateError: ' + pre + "The object's state must be OPENED.";
    testing.expectEqual(state,
      call(() => new XMLHttpRequest().setAttributionReporting({ eventSourceEligible: true, triggerEligible: false })));
    testing.expectEqual(state, call(() => {
      const x = opened(); x.send();
      return x.setAttributionReporting({ eventSourceEligible: true, triggerEligible: true });
    }));
    testing.expectError('Illegal invocation',
      () => XMLHttpRequest.prototype.setAttributionReporting.call({}, {}));
  }
</script>

<script id=set_private_token>
  {
    // Same shape, different dictionary: PrivateToken reads `operation` (an
    // enum) before `version`, both required, both measured on Chrome 151.
    const pre = "Failed to execute 'setPrivateToken' on 'XMLHttpRequest': ";
    const opened = () => { const x = new XMLHttpRequest(); x.open('GET', 'http://127.0.0.1:9582/xhr/headers_order'); return x; };
    const call = (fn) => { try { return 'ok:' + String(fn()); } catch (e) { return e.name + ': ' + e.message; } };

    testing.expectEqual('TypeError: ' + pre + '1 argument required, but only 0 present.',
      call(() => opened().setPrivateToken()));
    for (const bad of [undefined, null, 5, 's']) {
      testing.expectEqual('TypeError: ' + pre + "The provided value is not of type 'PrivateToken'.",
        call(() => opened().setPrivateToken(bad)), { desc: 'not an object: ' + String(bad) });
    }
    const required = (member) => 'TypeError: ' + pre + "Failed to read the '" + member +
      "' property from 'PrivateToken': Required member is undefined.";
    testing.expectEqual(required('operation'), call(() => opened().setPrivateToken({})));
    testing.expectEqual(required('operation'), call(() => opened().setPrivateToken([])));
    testing.expectEqual(required('version'), call(() => opened().setPrivateToken({ operation: 'token-request' })));
    testing.expectEqual(required('version'), call(() => opened().setPrivateToken({ operation: 'token-redemption' })));
    testing.expectEqual(required('version'), call(() => opened().setPrivateToken({ operation: 'send-redemption-record' })));
    testing.expectEqual(
      'TypeError: ' + pre + "Failed to read the 'operation' property from 'PrivateToken': " +
      "The provided value 'nope' is not a valid enum value of type OperationType.",
      call(() => opened().setPrivateToken({ operation: 'nope' })));
    testing.expectEqual('ok:undefined',
      call(() => opened().setPrivateToken({ version: 1, operation: 'token-request' })));
    testing.expectEqual('InvalidStateError: ' + pre + "The object's state must be OPENED.",
      call(() => new XMLHttpRequest().setPrivateToken({ version: 1, operation: 'token-request' })));
    testing.expectError('Illegal invocation',
      () => XMLHttpRequest.prototype.setPrivateToken.call({}, {}));
  }
</script>

<script id=xhr_blob_reopen type=module>
  {
    // open() discards the cached response, dropping the XHR's reference to the
    // blob. A blob the script is still holding has to survive that: the cache
    // and the JS wrapper each own a reference. Release without a matching
    // acquire (or a double release) frees the arena out from under `first`.
    const state = await testing.async();
    const req = new XMLHttpRequest();
    req.onload = () => { state.resolve() };
    req.open('GET', 'http://127.0.0.1:9582/xhr/binary');
    req.responseType = 'blob';
    req.send();
    await state.done(() => testing.expectEqual(200, req.status));

    const first = req.response;

    const state2 = await testing.async();
    req.onload = () => { state2.resolve() };
    req.open('GET', 'http://127.0.0.1:9582/xhr/binary');
    req.send();
    await state2.done(() => {
      testing.expectEqual(true, req.response instanceof Blob);
      // the second request parses a fresh blob, not the discarded one
      testing.expectEqual(false, req.response === first);
    });

    testing.expectEqual(7, first.size);
    testing.expectEqual([0, 0, 1, 2, 0, 0, 9], new Int8Array(await first.arrayBuffer()));
  }
</script>

<script id=xhr_json_reopen type=module>
  {
    // open() releases the persisted handle on the cached json response. That
    // handle is one v8 root, not ownership of the value, so a script holding
    // the parsed object must still be able to read it afterwards.
    const state = await testing.async();
    const req = new XMLHttpRequest();
    req.onload = () => { state.resolve() };
    req.open('GET', 'http://127.0.0.1:9582/xhr/json');
    req.responseType = 'json';
    req.send();
    await state.done(() => testing.expectEqual('9000!!!', req.response.over));

    const first = req.response;
    req.open('GET', 'http://127.0.0.1:9582/xhr/json');
    testing.expectEqual('9000!!!', first.over);
  }
</script>

<script id=xhr_forbidden_response_header type=module>
