<!DOCTYPE html>

<script id=fetch_basic type=module>
  {
    const state = await testing.async()
    const response = await fetch('http://127.0.0.1:9582/xhr');
    const text = await response.text();

    state.resolve();
    await state.done(() => {
      testing.expectEqual(200, response.status);
      testing.expectEqual(true, response.ok);
      testing.expectEqual('basic', response.type);
      testing.expectEqual('http://127.0.0.1:9582/xhr', response.url);
      testing.expectEqual(false, response.redirected);

      // Check headers
      const headers = response.headers;
      testing.expectEqual('text/html; charset=utf-8', headers.get('Content-Type'));
      testing.expectEqual('100', headers.get('content-length'));

      // Check text response

      testing.expectEqual(100, text.length);
    });
  }
</script>

<script id=fetch_network_error_message type=module>
  {
    // A network error's *wording* leaves the browser: Cloudflare's challenge
    // posts a probe into a worker that fetches cross-origin and reports
    // `String(e)` straight back to their server (tools/fingerprint/README.md,
    // "The worker was never released"). Measured against headless Chrome 151:
    // connection refused, DNS failure and a CORS rejection all reject with
    // exactly `TypeError: Failed to fetch`.
    const state = await testing.async();
    let name = '', message = '', str = '';
    try {
      await fetch('http://127.0.0.1:1/nothing-listens-here');
    } catch (e) {
      name = e.name;
      message = e.message;
      str = String(e);
    }
    state.resolve();

    await state.done(() => {
      testing.expectEqual('TypeError', name);
      testing.expectEqual('Failed to fetch', message);
      testing.expectEqual('TypeError: Failed to fetch', str);
    });
  }
</script>

<script id=fetch_readablestream_body_reject type=module>
  {
    const state = await testing.async();
    const url = "http://127.0.0.1:9582/echo_body";
    const opts = { method: "POST", duplex: "half" };

    let openRejected = false;
    try {
      const open = new ReadableStream({
        start(c) { c.enqueue(new TextEncoder().encode("x")); },
      });
      await fetch(url, { ...opts, body: open });
    } catch (e) {
      openRejected = e instanceof TypeError;
    }

    let lockedRejected = false;
    try {
      const locked = new ReadableStream({
        start(c) {
          c.enqueue(new TextEncoder().encode("x"));
          c.close();
        },
      });
      locked.getReader();
      await fetch(url, { ...opts, body: locked });
    } catch (e) {
      lockedRejected = e instanceof TypeError;
    }

    // A stream is single-use: draining it for one body must not leave it
    // looking like a valid (empty) body for the next request.
    const once = new ReadableStream({
      start(c) {
        c.enqueue(new TextEncoder().encode("x"));
        c.close();
      },
    });
    const first = await fetch(url, { ...opts, body: once });
    const firstText = await first.text();

    let reuseRejected = false;
    try {
      await fetch(url, { ...opts, body: once });
    } catch (e) {
      reuseRejected = e instanceof TypeError;
    }

    state.resolve();
    await state.done(() => {
      testing.expectEqual(true, openRejected);
      testing.expectEqual(true, lockedRejected);
      testing.expectEqual("x", firstText);
      testing.expectEqual(true, reuseRejected);
    });
  }
</script>

<script id=fetch_header_layers type=module>
  {
    const state = await testing.async();
    const headers = new Headers();
    headers.set('Accept-Language', 'fr');
    headers.append('X-Multi', 'a');
    headers.append('X-Multi', 'b');
    // Cookie and anything sec-* are forbidden request headers: the Request
    // guard drops them, so our own Sec-Ch-Ua survives.
    headers.append('Cookie', 'a=1');
    headers.append('Cookie', 'b=2');
    headers.set('Sec-Ch-Ua', '"Chromium";v="140"');
    headers.set('User-Agent', 'Mozilla/5.0 (X11; Linux x86_64)');
    const response = await fetch('http://127.0.0.1:9582/echo_headers', { headers });
    const text = await response.text();
    state.resolve();

    await state.done(() => {
      const got = {};
      for (const line of text.trim().split('\n')) {
        const sep = line.indexOf(': ');
        got[line.slice(0, sep).toLowerCase()] = line.slice(sep + 2);
      }
      testing.expectEqual('fr', got['accept-language']);
      testing.expectEqual('a, b', got['x-multi']);
      // Cookie is a forbidden request header name: the author's value never
      // reaches the wire, and only the jar's own cookies do.
      testing.expectEqual(undefined, got['cookie']);
      // A Sec-* name is forbidden the same way: the author's value never
      // reaches the wire, and the engine's own client hint goes out instead.
      // (User-Agent is deliberately not asserted here: it left the forbidden
      // list in 2016 and a page may legitimately set it. What this fork sends
      // is a Chrome user-agent, which is the whole point of the fork, so
      // upstream's "includes Lightpanda" assertions do not apply.)
      testing.expectEqual(false, got['sec-ch-ua'] === '"Chromium";v="140"');
      testing.expectEqual(true, got['sec-ch-ua'].includes('Google Chrome'));
    });
  }
</script>

<script id=fetch_redirect_authorization type=module>
  {
    // Authorization must not follow a cross-origin redirect; a custom header
    // is not stripped by the redirect itself (that is CORS's job, and it does
    // it by refusing the request outright -- see the second half).
    const state = await testing.async();

    // Authorization alone: once the hop strips it, nothing non-safelisted is
    // left, so the re-sent request needs no preflight and the echo shows what
    // actually went out.
    const auth = { Authorization: 'Bearer secret' };
    const same = await (await fetch('/redirect_same_echo_headers', { headers: auth })).text();
    const cross = await (await fetch('/redirect_cross_echo_headers', { headers: auth })).text();

    // A non-safelisted header that survives into the new origin turns the
    // re-sent request into one that needs a preflight, and `/echo_headers`
    // answers an OPTIONS with no Access-Control-Allow-*. Chrome fails this too
    // -- upstream does not, because its CORS gate is opt-in.
    let hopped = 'no-error';
    try {
      await fetch('/redirect_cross_echo_headers', { headers: { 'X-Hop': 'keep' } });
    } catch (e) {
      hopped = e.name;
    }

    state.resolve();

    await state.done(() => {
      const s = same.toLowerCase();
      const c = cross.toLowerCase();
      testing.expectEqual(true, s.includes('authorization: bearer secret'));
      testing.expectEqual(false, c.includes('authorization'));
      testing.expectEqual('TypeError', hopped);
    });
  }
</script>

<script id=fetch_resource_timing type=module>
  {
    // Every subresource a browser loads leaves a PerformanceResourceTiming
    // behind. Cloudflare's own api.js reads its own back and the page posts it
    // to the Turnstile widget, which is how the gap turned up: the field
    // arrived as a 1 035-byte entry on a real Chrome and `undefined` here,
    // because the resource buffer was never filled by anything
    // (tools/fingerprint/README.md, "the resource timing buffer never fills";
    // probes/expr-resource-timing.js measures it off the station).
    const state = await testing.async();
    // A route no other block in this file fetches: the entries accumulate
    // across every script in the document, so a shared one would not be alone.
    const url = 'http://127.0.0.1:9582/xhr/xml';
    // The entry is queued when the response completes, not when the promise
    // for the headers settles, so the body has to be read before looking.
    await (await fetch(url)).text();
    state.resolve();

    await state.done(() => {
      const entries = performance.getEntriesByName(url, 'resource');
      testing.expectEqual(1, entries.length);
      testing.expectEqual('resource', entries[0].entryType);
      testing.expectEqual('fetch', entries[0].initiatorType);
      testing.expectEqual(true, entries[0] instanceof PerformanceResourceTiming);
      // A subresource cannot have started before the navigation it belongs to.
      testing.expectEqual(true, entries[0].startTime > 0);
      testing.expectEqual(true, entries[0].duration >= 0);
      // getEntriesByType must agree with getEntriesByName about it.
      testing.expectEqual(true, performance.getEntriesByType('resource').includes(entries[0]));
    });
  }
</script>

<script id=fetch_request_mode_on_the_wire type=module>
  {
    // `RequestInit.mode` has to reach the wire, not just the Response. Chrome
    // reports the request's mode verbatim in Sec-Fetch-Mode -- four values, of
    // which three are reachable through fetch() -- and this engine used to send
    // `cors` for every one of them because Fetch.zig never passed the member
    // down to the transport (measured, the 24-case table in
    // tools/fingerprint/scratch/b118/fm-chrome.json).
    //
    // Same-origin on purpose: a same-origin no-cors response is `basic` and
    // readable in both engines (measured on example.com), so the echo can be
    // read back through the very mode under test.
    const state = await testing.async();
    const url = 'http://127.0.0.1:9582/echo_headers';
    const got = {};
    for (const mode of ['default', 'cors', 'no-cors', 'same-origin']) {
      for (const method of ['GET', 'POST']) {
        const init = { method };
        if (mode !== 'default') init.mode = mode;
        if (method === 'POST') {
          init.body = 'x';
          init.headers = { 'Content-Type': 'text/plain' };
        }
        const text = await (await fetch(url, init)).text();
        const seen = {};
        for (const line of text.trim().split('\n')) {
          const sep = line.indexOf(': ');
          seen[line.slice(0, sep).toLowerCase()] = line.slice(sep + 2);
        }
        got[`${mode}/${method}`] =
          `${seen['sec-fetch-mode']}${seen['origin'] === undefined ? '' : '+origin'}`;
      }
    }
    state.resolve();

    await state.done(() => {
      // Compared as one string so a red light names the cell that is wrong
      // rather than only saying `expected true got false`. Origin is in here
      // because it follows the mode too, and in a way that is easy to get
      // backwards: a same-origin GET names nobody whatever its mode, but ANY
      // non-GET names its origin -- including a no-cors one.
      const want = [
        'default/GET=cors', 'default/POST=cors+origin',
        'cors/GET=cors', 'cors/POST=cors+origin',
        'no-cors/GET=no-cors', 'no-cors/POST=no-cors+origin',
        'same-origin/GET=same-origin', 'same-origin/POST=same-origin+origin',
      ].join(' ');
      testing.expectEqual(want, Object.keys(got).map((k) => `${k}=${got[k]}`).join(' '));
    });
  }
</script>
