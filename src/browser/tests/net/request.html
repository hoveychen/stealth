<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=ctor_error_message>
  // An empty `e.message` is a reading no browser has, so it is worth more to a
  // detector than any wording difference. Blink names the interface and quotes
  // the input *as given*, not the resolved URL. Measured on Chrome 151; the
  // inputs here are absolute-but-unparseable so the readings do not depend on
  // the document base the way `new Request('')` does.
  const msg = (fn) => { try { fn(); return 'no throw'; } catch (e) { return `${e.name}: ${e.message}`; } };

  testing.expectEqual(
    "TypeError: Failed to construct 'Request': Failed to parse URL from http://[",
    msg(() => new Request('http://[')));
  // Verbatim: the scheme is not lower-cased on its way into the message.
  testing.expectEqual(
    "TypeError: Failed to construct 'Request': Failed to parse URL from HTTP://[?a",
    msg(() => new Request('HTTP://[?a')));

  const no_body = "TypeError: Failed to construct 'Request': Request with GET/HEAD method cannot have body.";
  testing.expectEqual(no_body, msg(() => new Request('https://example.com/a', { body: 'x' })));
  testing.expectEqual(no_body, msg(() => new Request('https://example.com/a', { method: 'HEAD', body: 'x' })));
  testing.expectEqual(no_body, msg(() => new Request(new Request('https://example.com/a'), { body: 'x' })));

  // The enum rejection quotes the value it was handed.
  testing.expectEqual(
    "TypeError: Failed to construct 'Request': Failed to read the 'duplex' property from 'RequestInit': The provided value 'full' is not a valid enum value of type RequestDuplex.",
    msg(() => new Request('https://example.com/a', { duplex: 'full' })));
  testing.expectEqual(
    "TypeError: Failed to construct 'Request': Failed to read the 'duplex' property from 'RequestInit': The provided value '' is not a valid enum value of type RequestDuplex.",
    msg(() => new Request('https://example.com/a', { duplex: '' })));

  // Backticks around `duplex`, and no full stop -- Blink's own inconsistency.
  testing.expectEqual(
    'TypeError: Failed to construct \'Request\': The `duplex` member must be specified for a request with a streaming body',
    msg(() => new Request('https://example.com/a', { method: 'POST', body: new ReadableStream() })));
</script>

<script id=body_methods type=module>
  const state = await testing.async();

  const req1 = new Request('https://example.com/api', {
    method: 'POST',
    body: 'Hello, World!',
    headers: { 'Content-Type': 'text/plain' }
  });
  const text1 = await req1.text();

  const req2 = new Request('https://example.com/api', {
    method: 'POST',
    body: '{"name": "test"}',
    headers: { 'Content-Type': 'application/json' }
  });
  const json2 = await req2.json();

  const req3 = new Request('https://example.com/api', {
    method: 'POST',
    body: 'binary data',
    headers: { 'Content-Type': 'application/octet-stream' }
  });
  const buffer3 = await req3.arrayBuffer();

  const req4 = new Request('https://example.com/api', {
    method: 'POST',
    body: 'blob content',
    headers: { 'Content-Type': 'text/plain' }
  });
  const blob4 = await req4.blob();

  const req5 = new Request('https://example.com/api', {
    method: 'POST',
    body: 'bytes'
  });
  const bytes5 = await req5.bytes();

  state.resolve();
  await state.done(() => {
    testing.expectEqual('Hello, World!', text1);

    testing.expectEqual('test', json2.name);

    testing.expectEqual(true, buffer3 instanceof ArrayBuffer);
    testing.expectEqual(11, buffer3.byteLength);

    testing.expectEqual(true, blob4 instanceof Blob);
    testing.expectEqual(12, blob4.size);
    testing.expectEqual('text/plain', blob4.type);

    testing.expectEqual(true, bytes5 instanceof Uint8Array);
    testing.expectEqual(5, bytes5.length);
  });
</script>

<script id=body_used type=module>
  const state = await testing.async();

  const req1 = new Request('https://example.com', { method: 'POST', body: 'hi' });
  const usedBefore1 = req1.bodyUsed;
  await req1.text();
  const usedAfter1 = req1.bodyUsed;

  // Re-consuming a used body rejects.
  let rejected1 = false;
  try { await req1.text(); } catch (e) { rejected1 = true; }

  // A request with no body is never "used".
  const req2 = new Request('https://example.com');
  const usedBefore2 = req2.bodyUsed;
  await req2.text();
  const usedAfter2 = req2.bodyUsed;

  // text() decodes as UTF-8, stripping a leading BOM.
  const req3 = new Request('https://example.com', { method: 'POST', body: '﻿hi' });
  const text3 = await req3.text();

  state.resolve();
  await state.done(() => {
    testing.expectFalse(usedBefore1);
    testing.expectTrue(usedAfter1);
    testing.expectTrue(rejected1);

    testing.expectFalse(usedBefore2);
    testing.expectFalse(usedAfter2);

    testing.expectEqual('hi', text3);
  });
</script>

<script id=buffer_source_bodies type=module>
  const state = await testing.async();

  // Every ArrayBufferView is a BufferSource, viewed as its raw bytes.
  const int8 = await new Request('https://example.com', { method: 'POST', body: new Int8Array([-1, 2]) }).bytes();
  const float32 = await new Request('https://example.com', { method: 'POST', body: new Float32Array([1]) }).bytes();
  const buf = new ArrayBuffer(4);
  new DataView(buf).setUint32(0, 0x41424344);
  const view = await new Request('https://example.com', { method: 'POST', body: new DataView(buf, 1, 2) }).text();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(2, int8.length);
    testing.expectEqual(255, int8[0]);
    testing.expectEqual(2, int8[1]);
    testing.expectEqual(4, float32.length);
    testing.expectEqual('BC', view);
  });
</script>

<script id=form_data type=module>
  const state = await testing.async();

  // An urlencoded body parses into a FormData.
  const req1 = new Request('https://example.com', {
    method: 'POST',
    body: 'a=1&b=hello+world&c=%26%3D&no_value',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
  });
  const fd1 = await req1.formData();

  // A FormData body round-trips through the multipart encoding.
  const src = new FormData();
  src.append('username', 'alice');
  src.append('note', 'two\r\nlines');
  src.append('a\tb', 'tabbed');
  src.append('username', 'bob');
  const req2 = new Request('https://example.com', { method: 'POST', body: src });
  const fd2 = await req2.formData();

  // A URLSearchParams body parses back (urlencoded default Content-Type).
  const req3 = new Request('https://example.com', {
    method: 'POST',
    body: new URLSearchParams({ x: 'y z' }),
  });
  const fd3 = await req3.formData();

  // A non-form Content-Type rejects with a TypeError.
  let rejected4 = false;
  const req4 = new Request('https://example.com', { method: 'POST', body: 'plain' });
  try { await req4.formData(); } catch (e) { rejected4 = e instanceof TypeError; }

  // So does re-consuming an already-used body.
  let rejected5 = false;
  try { await req1.formData(); } catch (e) { rejected5 = e instanceof TypeError; }

  // A missing Content-Type rejects (never throws synchronously) with a
  // TypeError.
  let rejected6 = false;
  const p6 = new Request('https://example.com', { method: 'POST' }).formData();
  const promised6 = p6 instanceof Promise;
  try { await p6; } catch (e) { rejected6 = e instanceof TypeError; }

  // A null body with a form Content-Type acts as an empty byte sequence and
  // resolves with an empty FormData.
  const req7 = new Request('https://example.com', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
  });
  const fd7 = await req7.formData();

  // A multipart Content-Type without a boundary rejects with a TypeError.
  let rejected8 = false;
  const req8 = new Request('https://example.com', {
    method: 'POST',
    body: 'x',
    headers: { 'Content-Type': 'multipart/form-data' },
  });
  try { await req8.formData(); } catch (e) { rejected8 = e instanceof TypeError; }

  // A part with an unquoted RFC 5987 filename* parameter parses; the
  // parameter itself is skipped.
  const req9 = new Request('https://example.com', {
    method: 'POST',
    body: '--B\r\nContent-Disposition: form-data; filename*=UTF-8\'\'a.jpg; name="n"\r\n\r\nv\r\n--B--\r\n',
    headers: { 'Content-Type': 'multipart/form-data; boundary=B' },
  });
  const fd9 = await req9.formData();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, fd1 instanceof FormData);
    testing.expectEqual('1', fd1.get('a'));
    testing.expectEqual('hello world', fd1.get('b'));
    testing.expectEqual('&=', fd1.get('c'));
    testing.expectEqual('', fd1.get('no_value'));

    testing.expectEqual(true, fd2 instanceof FormData);
    testing.expectEqual(2, fd2.getAll('username').length);
    testing.expectEqual('alice', fd2.getAll('username')[0]);
    testing.expectEqual('bob', fd2.getAll('username')[1]);
    testing.expectEqual('two\r\nlines', fd2.get('note'));
    testing.expectEqual('tabbed', fd2.get('a\tb'));

    testing.expectEqual('y z', fd3.get('x'));

    testing.expectEqual(true, rejected4);
    testing.expectEqual(true, rejected5);

    testing.expectEqual(true, promised6);
    testing.expectEqual(true, rejected6);
    testing.expectEqual(true, fd7 instanceof FormData);
    testing.expectEqual(0, [...fd7].length);
    testing.expectEqual(true, rejected8);
    testing.expectEqual('v', fd9.get('n'));
  });
</script>

<!-- A streaming request body. Vite's module-preload helper feature-tests for
     it on every page it ships, and a throw here takes the whole app bundle
     down with it: browserscan.net loses ~740 nodes and never hydrates.
     Every expectation was read off headed Chrome. -->
<script id=streamingBody>
  {
    const stream = () => new ReadableStream();

    // The exact shape of Vite's probe: `duplex` is read, and no Content-Type
    // is inferred for a stream.
    let duplexAccessed = false;
    const probe = new Request('https://example.com/a', {
      body: stream(),
      method: 'POST',
      get duplex() { duplexAccessed = true; return 'half'; },
    });
    testing.expectEqual(true, duplexAccessed);
    testing.expectEqual(false, probe.headers.has('Content-Type'));
    testing.expectEqual('POST', probe.method);
    testing.expectEqual(false, probe.bodyUsed);
    testing.expectEqual(true, probe.body instanceof ReadableStream);

    // `duplex` is mandatory for a streaming body, and 'half' is its only value.
    testing.expectError('TypeError', () => new Request('https://example.com/a', {
      body: stream(), method: 'POST',
    }));
    testing.expectError('TypeError', () => new Request('https://example.com/a', {
      body: stream(), method: 'POST', duplex: 'full',
    }));
    // …and a body still needs a method that can carry one.
    testing.expectError('TypeError', () => new Request('https://example.com/a', {
      body: stream(), method: 'GET', duplex: 'half',
    }));

    // A byte body is exposed as a stream too, and keeps its inferred type.
    const bytes = new Request('https://example.com/a', { body: 'hi', method: 'POST' });
    testing.expectEqual('text/plain;charset=UTF-8', bytes.headers.get('Content-Type'));
    testing.expectEqual(true, bytes.body instanceof ReadableStream);
  }
</script>

<script id=streamingBodyRead type=module>
  const state = await testing.async();

  // Reading a streaming body drains the stream.
  const closed = new ReadableStream({
    start(c) { c.enqueue(new TextEncoder().encode('ab')); c.close(); },
  });
  const request = new Request('https://example.com/a', {
    body: closed, method: 'POST', duplex: 'half',
  });
  const contentType = request.headers.get('Content-Type');
  const isStream = request.body instanceof ReadableStream;
  const text = await request.text();

  state.resolve();
  await state.done(() => {
    testing.expectEqual(null, contentType);
    testing.expectEqual(true, isStream);
    testing.expectEqual('ab', text);
    testing.expectEqual(true, request.bodyUsed);
  });
</script>

<script id=request_enum_member_refusal>
{
  // An enum member of a dictionary gets a nested sentence: the constructor's
  // prefix, then the member and the dictionary it was read from, then the value
  // and the enum type -- and the enum type alone comes without quotes
  // (measured on Chrome 151). All four used to answer "invalid argument".
  const cases = [
    ['cache', 'RequestCache'],
    ['credentials', 'RequestCredentials'],
    ['redirect', 'RequestRedirect'],
    ['priority', 'FetchPriority'],
  ];
  for (const [member, enum_type] of cases) {
    let err = null;
    try { new Request('/x', { [member]: 'nope' }); } catch (e) { err = `${e.name}: ${e.message}`; }
    testing.expectEqual(
      `TypeError: Failed to construct 'Request': Failed to read the '${member}' property from 'RequestInit': ` +
        `The provided value 'nope' is not a valid enum value of type ${enum_type}.`,
      err,
      { label: member },
    );
  }
}
</script>

<!-- The eleven members Chrome carries that this engine did not, against a
     headed Chrome 151 (probes/expr-misc-family-semantics.js). -->
<script id="request_added_members">
{
  const r = new Request('https://example.com/x');
  testing.expectEqual('', r.destination);
  // Not the empty string: that is what an explicit {referrer: ''} gives.
  testing.expectEqual('about:client', r.referrer);
  testing.expectEqual('', r.referrerPolicy);
  testing.expectEqual('cors', r.mode);
  testing.expectEqual('', r.integrity);
  testing.expectEqual(false, r.keepalive);
  testing.expectEqual('half', r.duplex);
  testing.expectEqual(false, r.isHistoryNavigation);
  testing.expectEqual('unknown', r.targetAddressSpace);
  testing.expectEqual(false, r.isReloadNavigation);
  testing.expectEqual('function', typeof r.textStream);

  testing.expectEqual('no-cors', new Request('https://example.com/x', { mode: 'no-cors' }).mode);
  testing.expectEqual('same-origin', new Request('https://example.com/x', { mode: 'same-origin' }).mode);
  // Two of the five modes the Fetch spec names are not constructible: `navigate`
  // is refused outright, and `websocket` is not even in the RequestMode IDL
  // enum, so it fails the same way a nonsense string does. Measured on Chrome
  // 151 (tools/fingerprint/scratch/b118/expr-fetch-mode-throw.js): both throw a
  // TypeError, where this engine used to hand back a Request carrying the value.
  testing.expectError('TypeError', () => new Request('https://example.com/x', { mode: 'navigate' }));
  testing.expectError('TypeError', () => new Request('https://example.com/x', { mode: 'websocket' }));
  testing.expectError('TypeError', () => new Request('https://example.com/x', { mode: 'nonsense' }));
  testing.expectEqual('', new Request('https://example.com/x', { referrer: '' }).referrer);
  testing.expectEqual(true, new Request('https://example.com/x', { keepalive: true }).keepalive);
  testing.expectEqual('sha256-x', new Request('https://example.com/x', { integrity: 'sha256-x' }).integrity);
  testing.expectEqual('no-referrer', new Request('https://example.com/x', { referrerPolicy: 'no-referrer' }).referrerPolicy);
  // A streaming body does not change the duplex Chrome reports.
  testing.expectEqual('half', new Request('https://example.com/x', { method: 'POST', body: 'b' }).duplex);

  // A request built from another one carries its settings over.
  const copied = new Request(new Request('https://example.com/x', { mode: 'no-cors', integrity: 'sha256-y' }));
  testing.expectEqual('no-cors', copied.mode);
  testing.expectEqual('sha256-y', copied.integrity);

  // textStream consumes the body, exactly as Response's does.
  const streamed = new Request('https://example.com/x', { method: 'POST', body: 'hi' });
  testing.expectEqual(true, streamed.textStream() instanceof ReadableStream);
  testing.expectEqual(true, streamed.bodyUsed);
  testing.expectError('TypeError', () => streamed.textStream());
}
</script>
