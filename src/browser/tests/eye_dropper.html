<!DOCTYPE html>
<head>
  <title>EyeDropper Test</title>
  <script src="testing.js"></script>
</head>

<script id=eye_dropper_shape>
  {
    const d = new EyeDropper();
    testing.expectEqual('[object EyeDropper]', Object.prototype.toString.call(d));
    testing.expectEqual('', Object.getOwnPropertyNames(d).join(','));
    testing.expectEqual(0, EyeDropper.length);
    testing.expectEqual('open',
      Object.getOwnPropertyNames(EyeDropper.prototype).filter((k) => k !== 'constructor').join(','));
    testing.expectEqual(0, EyeDropper.prototype.open.length);
    testing.expectTrue(d.open() instanceof Promise);
    d.open().catch(() => {});
  }
</script>

<script type=module id=eye_dropper_needs_a_gesture>
  let err;
  try { await new EyeDropper().open(); } catch (e) { err = e; }
  testing.expectEqual('NotAllowedError', err.name);
  testing.expectEqual(
    "Failed to execute 'open' on 'EyeDropper': EyeDropper::open() requires user gesture.",
    err.message);
</script>
