<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=navigator>
  // Navigator should be accessible from window
  testing.expectEqual(navigator, window.navigator);
  // The default user-agent is Chrome's own frozen string; the test runner adds
  // an "internal-tester" suffix so testing.js can still tell it apart.
  testing.expectEqual(true, navigator.userAgent.startsWith('Mozilla/5.0 ('));
  testing.expectEqual(true, navigator.userAgent.includes('AppleWebKit/537.36 (KHTML, like Gecko) Chrome/'));
  testing.expectEqual(false, navigator.userAgent.includes('Lightpanda'));
  testing.expectEqual('Netscape', navigator.appName);
  // appVersion is the user-agent minus "Mozilla/", not a version of its own.
  testing.expectEqual(navigator.userAgent.slice('Mozilla/'.length), navigator.appVersion);
  // One value, not one of a set: the claim is a constant and does not follow the
  // machine this binary was built on. See src/claimed_platform.zig. Which of the
  // two claims it is belongs to that constant, and the claimed_platform block
  // below is what pins it against the four other surfaces that name it.
  testing.expectEqual(true, ['MacIntel', 'Linux x86_64'].includes(navigator.platform));
  testing.expectEqual('en-US', navigator.language);
  testing.expectEqual(true, Array.isArray(navigator.languages));
  // A FrozenArray: frozen and not extensible on every read.
  testing.expectEqual(true, Object.isFrozen(navigator.languages));
  testing.expectEqual(false, Object.isExtensible(navigator.languages));
  testing.expectEqual(2, navigator.languages.length);
  testing.expectEqual('en-US', navigator.languages[0]);
  testing.expectEqual('en', navigator.languages[1]);
  testing.expectEqual(true, navigator.onLine);
  testing.expectEqual(true, navigator.cookieEnabled);
  // Read off the host now, so the literal that used to be here would only hold
  // on a machine with that core count. What still holds everywhere: a positive
  // integer, which is what a page can actually check. The exact value is
  // asserted against the host in Navigator.zig's own test.
  testing.expectEqual(true, navigator.hardwareConcurrency > 0);
  testing.expectEqual(true, Number.isInteger(navigator.hardwareConcurrency));
  testing.expectEqual(0, navigator.maxTouchPoints);
  // Fixed strings in every Chromium build; upstream left vendor empty, which
  // contradicts a Chrome user-agent sitting right next to it.
  testing.expectEqual('Google Inc.', navigator.vendor);
  testing.expectEqual('', navigator.vendorSub);
  testing.expectEqual('Gecko', navigator.product);
  testing.expectEqual('20030107', navigator.productSub);
  testing.expectEqual(true, navigator.pdfViewerEnabled);
  testing.expectEqual(false, navigator.javaEnabled());
  testing.expectEqual(false, navigator.webdriver);

  testing.expectEqual(null, navigator.doNotTrack);

  // GPC must be absent, not false. Per https://w3c.github.io/gpc/#javascript-property
  // the signal reflects an explicit user preference, and Chrome only defines
  // the property once one is set: measured on headed Chrome 150,
  // `'globalPrivacyControl' in navigator` is false. Absent reads the same way
  // to a GPC-compliant consent manager as an explicit false — no preference —
  // so this keeps the behaviour that made upstream stop returning true, while
  // dropping a name that isn't on Chrome's Navigator.prototype.
  testing.expectEqual(false, 'globalPrivacyControl' in navigator);
  testing.expectEqual(undefined, navigator.globalPrivacyControl);

  // Every Navigator attribute must be a native accessor on the prototype
  for (const name of [
    'userAgent', 'appName', 'appCodeName', 'appVersion', 'platform',
    'language', 'languages', 'onLine', 'cookieEnabled', 'hardwareConcurrency',
    'deviceMemory', 'maxTouchPoints', 'vendor', 'vendorSub', 'product',
    'productSub', 'pdfViewerEnabled', 'webdriver',
    'plugins', 'mimeTypes', 'connection', 'mediaDevices', 'doNotTrack',
  ]) {
    const desc = Object.getOwnPropertyDescriptor(Navigator.prototype, name);
    testing.expectEqual('function', typeof desc.get); // accessor on prototype
    testing.expectEqual(undefined, desc.value);        // not a data property
    testing.expectEqual(undefined, Object.getOwnPropertyDescriptor(navigator, name)); // not own
    testing.expectEqual(true, desc.get.toString().includes('[native code]'));
  }
</script>

<script id=navigator_plugins_named_presence>
  // No plugin is exposed, so PluginArray has no named properties at all.
  testing.expectEqual(false, 'anything' in navigator.plugins);
  testing.expectEqual(false, Object.hasOwn(navigator.plugins, 'anything'));
  testing.expectEqual(null, navigator.plugins.namedItem('anything'));

  // inherited members are still found by `in`
  testing.expectEqual(true, 'refresh' in navigator.plugins);
</script>

<script id=navigator_plugins_iterable>
  // WebIDL: indexed getter => @@iterator (Chrome: [...navigator.plugins] works)
  testing.expectEqual('function', typeof navigator.plugins[Symbol.iterator]);
  // Five, not upstream's zero: a plugin-less navigator is itself a signal, so
  // this fork ships the five entries a real Chrome reports (see the
  // navigator_plugins block below, which pins their names).
  testing.expectEqual(5, [...navigator.plugins].length);
</script>

<script id=navigator_native_descriptor_walk>
  // Mirror the bot-detection fingerprint: read every navigator property's
  // descriptor and call toString() on its value/getter. This must not throw.
  let obj = navigator;
  do {
    for (const name of Object.getOwnPropertyNames(obj)) {
      const d = Object.getOwnPropertyDescriptor(obj, name);
      if (d.value !== undefined) { d.value.toString(); }
      else if (d.get !== undefined) { d.get.toString(); }
    }
  } while (obj = Object.getPrototypeOf(obj));
  testing.expectEqual(null, navigator.doNotTrack);
</script>

<script id=permission_query type=module>
  {
    const state = await testing.async();
    const p = navigator.permissions.query({ name: 'notifications' });
    testing.expectTrue(p instanceof Promise);
    const status = await p;
    state.resolve();

    await state.done(() => {
      testing.expectEqual('prompt', status.state);
      testing.expectEqual('notifications', status.name);
    });
  }
</script>

<script id=storage_estimate type=module>
  {
    const state = await testing.async();

    const p = navigator.storage.estimate();
    testing.expectTrue(p instanceof Promise);

    const estimate = await p;
    state.resolve();

    await state.done(() =>{
      testing.expectEqual(0, estimate.usage);
      testing.expectEqual(10 * 1024 * 1024 * 1024, estimate.quota);
    });
  }
</script>

<script id=storage_quota_reads_as_a_normal_window type=module>
  {
    // The private-window probe every detector library uses reads the temporary
    // pool's quota and calls the browser incognito when it comes back under
    // twice the JS heap limit. A real Chrome's quota tracks free disk and
    // clears that bar by a wide margin; a small constant here reads as an
    // incognito window, which is what browserscan reported against us
    // ("Incognito mode -10%", the largest single deduction on that site).
    //
    // Measured on the reference headed Linux Chrome 151: all three quota
    // surfaces answer the same 10 GiB, and estimate() resolves with a plain
    // dictionary carrying quota, usage and usageDetails.
    const state = await testing.async();

    const estimate = await navigator.storage.estimate();
    const temporary = await new Promise((resolve, reject) => {
      navigator.webkitTemporaryStorage.queryUsageAndQuota((_, q) => resolve(q), reject);
    });
    const persistent = await new Promise((resolve, reject) => {
      navigator.webkitPersistentStorage.queryUsageAndQuota((_, q) => resolve(q), reject);
    });
    state.resolve();

    await state.done(() => {
      const quota = 10 * 1024 * 1024 * 1024;
      // One pool size, reported identically everywhere Chrome reports it.
      // Disagreeing with itself is its own signal.
      testing.expectEqual(quota, estimate.quota);
      testing.expectEqual(quota, temporary);
      testing.expectEqual(quota, persistent);
      // and over the bar the private-mode probe actually sets.
      testing.expectTrue(temporary > 2 * performance.memory.jsHeapSizeLimit);
      // A class instance with the values on its prototype JSON.stringify()s to
      // "{}", which is the same tell by another route.
      testing.expectEqual(
        ['quota', 'usage', 'usageDetails'],
        Object.getOwnPropertyNames(estimate),
      );
      testing.expectEqual(Object.prototype, Object.getPrototypeOf(estimate));
    });
  }
</script>

<script id=deviceMemory>
  // Quantised off the host's RAM, so the assertion is the quantisation rather
  // than a literal: a power of two, and never zero. Chrome 151 answers 16 on a
  // 24 GiB host, which is where the "floor, do not cap at 8" rule comes from
  // (Navigator.zig).
  const dm = navigator.deviceMemory;
  testing.expectEqual(true, dm > 0);
  testing.expectEqual(true, Number.isInteger(Math.log2(dm)) || dm < 1);
</script>

<script id=userAgentData>
  testing.expectEqual(true, navigator.userAgentData !== undefined);
  testing.expectEqual(false, navigator.userAgentData.mobile);
  // The hint's spelling of the same constant claim navigator.platform carries --
  // a different spelling of the same claim, which is itself a thing to get right.
  testing.expectEqual(
    navigator.platform === 'MacIntel' ? 'macOS' : 'Linux',
    navigator.userAgentData.platform,
  );

  // Chrome's own brand list, GREASE entry first. Derived from the same value
  // the Sec-Ch-Ua header carries, so the two cannot disagree.
  testing.expectEqual(3, navigator.userAgentData.brands.length);
  // GREASE first, then Chrome ahead of Chromium. Both the odd brand and the
  // order are measured from the Chrome 151 build being claimed, not carried
  // over: Chrome varies them per build precisely so servers cannot hardcode
  // the list, so a 150-era list beside a 151 user-agent is a mismatch.
  testing.expectEqual({brand: 'Not=A?Brand', version: "99"}, navigator.userAgentData.brands[0]);
  testing.expectEqual({brand: 'Google Chrome', version: "151"}, navigator.userAgentData.brands[1]);
  testing.expectEqual({brand: 'Chromium', version: "151"}, navigator.userAgentData.brands[2]);

  // The brand version has to be the one the user-agent string carries.
  testing.expectEqual(true, navigator.userAgent.includes('Chrome/151.'));

  // Same instance returned on repeated access. Chrome builds a fresh
  // NavigatorUAData per read and answers false here (measured on 151); matching
  // that would mean a new object, and a new entry in the identity map, for
  // every read a page makes, so this one stays as it is on purpose.
  testing.expectEqual(true, navigator.userAgentData === navigator.userAgentData);

  // Chrome's own order for these; a prototype's property order is one
  // getOwnPropertyNames() away from being read.
  testing.expectEqual(
    'brands,mobile,platform,getHighEntropyValues,toJSON,constructor',
    Object.getOwnPropertyNames(NavigatorUAData.prototype).join(','),
  );

  const json = navigator.userAgentData.toJSON();
  testing.expectEqual(false, json.mobile);
  testing.expectEqual(navigator.userAgentData.platform, json.platform);
  testing.expectEqual(true, Array.isArray(json.brands));
  testing.expectEqual('Not=A?Brand', json.brands[0].brand);
</script>

<script id=userAgentData_highEntropy type=module>
  {
    const state = await testing.async();
    const p = navigator.userAgentData.getHighEntropyValues(['architecture', 'platformVersion', 'fullVersionList']);
    testing.expectTrue(p instanceof Promise);
    const v = await p;
    // Chrome only returns what was asked for, plus the low-entropy set. Unknown
    // hints are ignored, and "formFactor" is not the name — it's "formFactors".
    const asked = await navigator.userAgentData.getHighEntropyValues(['formFactors', 'formFactor', 'nope']);
    const none = await navigator.userAgentData.getHighEntropyValues([]);
    state.resolve();

    await state.done(() => {
      // The keys come back in UADataValues' member order -- alphabetical --
      // not in the order the hints were listed. WebIDL builds the dictionary by
      // walking its own members, and Chrome 151 answers exactly this list for
      // the eight hints below. It is one JSON.stringify away from being read.
      testing.expectEqual(
        'architecture,brands,fullVersionList,mobile,platform,platformVersion',
        Object.keys(v).join(','),
      );
      testing.expectEqual('brands,formFactors,mobile,platform', Object.keys(asked).join(','));
      testing.expectEqual('brands,mobile,platform', Object.keys(none).join(','));

      testing.expectEqual(false, v.mobile);
      testing.expectEqual(navigator.userAgentData.platform, v.platform);
      testing.expectEqual(true, Array.isArray(v.brands));
      // The CPU the claim names, not the one this was built for: a UA reading
      // "Linux x86_64" beside an architecture of "arm" is a contradiction that
      // costs one call to find.
      testing.expectEqual(navigator.platform === 'MacIntel' ? 'arm' : 'x86', v.architecture);
      // The OS version, which is a per-claim value like the rest of them and not
      // a hint we get to decline: the macOS Chrome on the reference host answers
      // "26.6.2", and the Linux one answers the empty string -- measured on both,
      // Chrome 151. An empty platformVersion beside a macOS platform is a Linux
      // Chrome's answer under a Mac's claim.
      testing.expectEqual(
        navigator.platform === 'MacIntel' ? '26.6.2' : '',
        v.platformVersion,
      );

      // The high-entropy list carries four-part versions; uaFullVersion is the
      // browser brand's — the last entry. The user-agent's reduced version
      // zeroes everything after the major, so it deliberately does NOT equal
      // this one; a full version ending .0.0.0 is what would be anomalous.
      testing.expectEqual(3, v.fullVersionList.length);
      testing.expectEqual({brand: 'Not=A?Brand', version: '99.0.0.0'}, v.fullVersionList[0]);
      testing.expectEqual({brand: 'Google Chrome', version: '151.0.7922.174'}, v.fullVersionList[1]);
      testing.expectEqual({brand: 'Chromium', version: '151.0.7922.174'}, v.fullVersionList[2]);

      // Not requested, so not returned.
      testing.expectEqual(undefined, v.uaFullVersion);
      testing.expectEqual(undefined, v.wow64);
      testing.expectEqual(undefined, v.formFactors);
      testing.expectEqual(undefined, v.bitness);

      testing.expectEqual(['Desktop'], asked.formFactors);
      testing.expectEqual(undefined, asked.formFactor);
      testing.expectEqual(undefined, asked.nope);

      testing.expectEqual(['brands', 'mobile', 'platform'], Object.keys(none).sort());
    });
  }
</script>

<script id=claimed_platform type=module>
  {
    // Five surfaces name the platform, and a detector reads them together: the
    // user-agent token, navigator.platform, the Sec-Ch-Ua-Platform hint, the
    // architecture/bitness hints, and (in audio.html) which recorded audio
    // render comes back. Any two of them disagreeing is a cheaper tell than the
    // platform itself, so they all come from one constant.
    const state = await testing.async();
    const v = await navigator.userAgentData.getHighEntropyValues(['architecture', 'bitness']);
    state.resolve();

    // Each claim spells itself differently on each surface, so the test is a
    // table rather than one string: pick the column by navigator.platform, then
    // require every other surface to be in that same column. A claim half-flipped
    // fails here whichever half moved.
    const claims = {
      'MacIntel': {
        token: '(Macintosh; Intel Mac OS X 10_15_7)',
        hint: 'macOS',
        architecture: 'arm',
      },
      'Linux x86_64': {
        token: '(X11; Linux x86_64)',
        hint: 'Linux',
        architecture: 'x86',
      },
    };

    await state.done(() => {
      const claim = claims[navigator.platform];
      testing.expectEqual(true, claim !== undefined);
      testing.expectEqual(true, navigator.userAgent.includes(claim.token));
      testing.expectEqual(claim.hint, navigator.userAgentData.platform);
      testing.expectEqual(claim.architecture, v.architecture);
      testing.expectEqual('64', v.bitness);
      // appVersion is the user-agent minus "Mozilla/", so it carries the token too.
      testing.expectEqual(true, navigator.appVersion.includes(claim.token));
    });
  }
</script>

<script id=userAgentData_uaFullVersion type=module>
  {
    const state = await testing.async();
    const v = await navigator.userAgentData.getHighEntropyValues(['uaFullVersion']);
    state.resolve();
    await state.done(() => {
      testing.expectEqual('151.0.7922.174', v.uaFullVersion);
      // Same major as the brands and the user-agent string.
      testing.expectEqual(true, v.uaFullVersion.startsWith('151.'));
      testing.expectEqual(true, navigator.userAgent.includes('Chrome/151.'));
    });
  }
</script>

<script id=plugins>
  // Chrome's hardcoded PDF-viewer list. Values measured from Chrome 150, see
  // PluginArray.zig. An empty list next to pdfViewerEnabled === true is a
  // combination no real Chrome produces.
  testing.expectEqual(5, navigator.plugins.length);
  testing.expectEqual(
    ['PDF Viewer', 'Chrome PDF Viewer', 'Chromium PDF Viewer',
     'Microsoft Edge PDF Viewer', 'WebKit built-in PDF'],
    Array.from(navigator.plugins).map((p) => p.name),
  );
  testing.expectEqual('[object PluginArray]', Object.prototype.toString.call(navigator.plugins));
  testing.expectEqual('[object Plugin]', Object.prototype.toString.call(navigator.plugins[0]));

  // Every entry describes the same built-in viewer.
  for (const p of navigator.plugins) {
    testing.expectEqual('Portable Document Format', p.description);
    testing.expectEqual('internal-pdf-viewer', p.filename);
    testing.expectEqual(2, p.length);
    testing.expectEqual(['application/pdf', 'text/pdf'], Array.from(p).map((m) => m.type));
    testing.expectEqual(p, p[0].enabledPlugin);
  }

  // Lookups: by index, by item(), by name.
  testing.expectEqual(navigator.plugins[0], navigator.plugins.item(0));
  testing.expectEqual(navigator.plugins[0], navigator.plugins.namedItem('PDF Viewer'));
  testing.expectEqual(navigator.plugins[0], navigator.plugins['PDF Viewer']);
  testing.expectEqual(undefined, navigator.plugins[5]);
  testing.expectEqual(null, navigator.plugins.item(5));
  testing.expectEqual(null, navigator.plugins.namedItem('nope'));
  testing.expectEqual(undefined, navigator.plugins['nope']);
  testing.expectEqual('function', typeof navigator.plugins.refresh);

  // Stable across reads, and refresh() doesn't rebuild the list.
  testing.expectEqual(true, navigator.plugins === navigator.plugins);
  const firstPlugin = navigator.plugins[0];
  navigator.plugins.refresh();
  testing.expectEqual(true, firstPlugin === navigator.plugins[0]);

  // Chrome reports the indices *and* the names as own properties, but only the
  // indices are enumerable ([LegacyUnenumerableNamedProperties]) — so
  // Object.keys and JSON.stringify see numbers only. Attributes measured on
  // Chrome 150.
  testing.expectEqual(['0', '1', '2', '3', '4'], Object.keys(navigator.plugins));
  const pluginOwn = Object.getOwnPropertyNames(navigator.plugins);
  testing.expectEqual(true, pluginOwn.includes('0'));
  testing.expectEqual(true, pluginOwn.includes('PDF Viewer'));

  const indexDesc = Object.getOwnPropertyDescriptor(navigator.plugins, '0');
  testing.expectEqual(true, indexDesc.enumerable);
  testing.expectEqual(true, indexDesc.configurable);
  testing.expectEqual(false, indexDesc.writable);

  const nameDesc = Object.getOwnPropertyDescriptor(navigator.plugins, 'PDF Viewer');
  testing.expectEqual(false, nameDesc.enumerable);
  testing.expectEqual(true, nameDesc.configurable);
  testing.expectEqual(false, nameDesc.writable);

  // Chrome's exact serialisation: five numeric keys, each holding two.
  testing.expectEqual(
    '{"0":{"0":{},"1":{}},"1":{"0":{},"1":{}},"2":{"0":{},"1":{}},"3":{"0":{},"1":{}},"4":{"0":{},"1":{}}}',
    JSON.stringify(navigator.plugins),
  );
</script>

<script id=mimeTypes>
  testing.expectEqual(2, navigator.mimeTypes.length);
  testing.expectEqual('[object MimeTypeArray]', Object.prototype.toString.call(navigator.mimeTypes));
  testing.expectEqual('[object MimeType]', Object.prototype.toString.call(navigator.mimeTypes[0]));
  testing.expectEqual(['application/pdf', 'text/pdf'], Array.from(navigator.mimeTypes).map((m) => m.type));

  for (const m of navigator.mimeTypes) {
    testing.expectEqual('pdf', m.suffixes);
    testing.expectEqual('Portable Document Format', m.description);
    // Measured: both entries name the *first* plugin, and it is the very
    // object navigator.plugins[0] hands out.
    testing.expectEqual(navigator.plugins[0], m.enabledPlugin);
  }

  testing.expectEqual(navigator.mimeTypes[0], navigator.mimeTypes.item(0));
  testing.expectEqual(navigator.mimeTypes[0], navigator.mimeTypes.namedItem('application/pdf'));
  testing.expectEqual(navigator.mimeTypes[0], navigator.mimeTypes['application/pdf']);
  testing.expectEqual(undefined, navigator.mimeTypes[2]);
  testing.expectEqual(null, navigator.mimeTypes.item(2));
  testing.expectEqual(null, navigator.mimeTypes.namedItem('nope'));

  // Measured: a plugin's own MimeType objects are distinct from these.
  testing.expectEqual(false, navigator.plugins[0][0] === navigator.mimeTypes[0]);

  testing.expectEqual(['0', '1'], Object.keys(navigator.mimeTypes));
  const mimeOwn = Object.getOwnPropertyNames(navigator.mimeTypes);
  testing.expectEqual(true, mimeOwn.includes('application/pdf'));
  testing.expectEqual(
    false,
    Object.getOwnPropertyDescriptor(navigator.mimeTypes, 'application/pdf').enumerable,
  );

  // All three collections are iterable, like Chrome's.
  testing.expectEqual(5, Array.from(navigator.plugins).length);
  testing.expectEqual(2, Array.from(navigator.mimeTypes).length);
  testing.expectEqual(2, Array.from(navigator.plugins[0]).length);
</script>

<script id=getBattery type=module>
  {
    const state = await testing.async();
    testing.expectEqual('function', typeof navigator.getBattery);
    const p = navigator.getBattery();
    testing.expectTrue(p instanceof Promise);
    const b = await p;
    const again = await navigator.getBattery();
    state.resolve();

    // A desktop on mains power, which is what the reference Chrome reported.
    await state.done(() => {
      testing.expectEqual('[object BatteryManager]', Object.prototype.toString.call(b));
      testing.expectEqual(true, b instanceof EventTarget);
      testing.expectEqual(true, b.charging);
      testing.expectEqual(0, b.chargingTime);
      testing.expectEqual(Infinity, b.dischargingTime);
      testing.expectEqual(1, b.level);

      testing.expectEqual(
        ['charging', 'chargingTime', 'constructor', 'dischargingTime', 'level',
         'onchargingchange', 'onchargingtimechange', 'ondischargingtimechange',
         'onlevelchange'],
        Object.getOwnPropertyNames(BatteryManager.prototype).sort(),
      );

      // Chrome hands back the same object every call.
      testing.expectEqual(b, again);
    });
  }
</script>


<script id=sendBeacon>
  // Nothing is sent, but "queued" keeps callers off their sync-XHR fallback.
  testing.expectEqual(true, navigator.sendBeacon('/analytics'));
  testing.expectEqual(true, navigator.sendBeacon('/analytics', 'payload'));
  testing.expectEqual(true, navigator.sendBeacon('/analytics', new Blob(['x'])));
</script>
