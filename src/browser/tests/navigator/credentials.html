<!DOCTYPE html>
<script src="../testing.js"></script>

<!--
  The Credential Management family, measured on headed Chrome 150 over
  http://localhost (a secure origin, which is what exposes the WebAuthn statics).

  Sources: win20-chrome.json for every shape, win21 / win21b / win21c /
  win21d-chrome.json for the behaviours. Every prototype member list is Chrome's
  own `Object.getOwnPropertyNames` order rather than alphabetical — the order is
  itself a hashable surface — with `constructor` last, which is the one place
  V8 cannot follow Blink (it sorts it wherever the interface declares it).
-->

<script id=shapes>
  {
    const shapes = {
      Credential: ['id', 'type', 'constructor'],
      FederatedCredential: ['provider', 'protocol', 'name', 'iconURL', 'constructor'],
      PasswordCredential: ['password', 'name', 'iconURL', 'constructor'],
      PublicKeyCredential: ['rawId', 'response', 'authenticatorAttachment', 'getClientExtensionResults', 'toJSON', 'constructor'],
      IdentityCredential: ['token', 'isAutoSelected', 'configURL', 'constructor'],
      OTPCredential: ['code', 'constructor'],
      AuthenticatorResponse: ['clientDataJSON', 'constructor'],
      AuthenticatorAssertionResponse: ['authenticatorData', 'signature', 'userHandle', 'constructor'],
      AuthenticatorAttestationResponse: ['attestationObject', 'getAuthenticatorData', 'getPublicKey', 'getPublicKeyAlgorithm', 'getTransports', 'constructor'],
    };
    for (const [name, keys] of Object.entries(shapes)) {
      testing.expectEqual('function', typeof window[name], { label: name });
      testing.expectEqual(keys.join(','), Object.getOwnPropertyNames(window[name].prototype).join(','));
      testing.expectEqual(name, Object.prototype.toString.call(window[name].prototype).slice(8, -1));
    }

    // Prototype chains (measured): five credential types over Credential, two
    // responses over AuthenticatorResponse.
    for (const name of ['FederatedCredential', 'PasswordCredential', 'PublicKeyCredential', 'IdentityCredential', 'OTPCredential']) {
      testing.expectEqual(Credential.prototype, Object.getPrototypeOf(window[name].prototype), { label: name });
    }
    testing.expectEqual(AuthenticatorResponse.prototype, Object.getPrototypeOf(AuthenticatorAssertionResponse.prototype));
    testing.expectEqual(AuthenticatorResponse.prototype, Object.getPrototypeOf(AuthenticatorAttestationResponse.prototype));
    testing.expectEqual(Object.prototype, Object.getPrototypeOf(Credential.prototype));

    // Constructor arity: only the two constructible ones take an argument.
    testing.expectEqual(0, Credential.length);
    testing.expectEqual(1, FederatedCredential.length);
    testing.expectEqual(1, PasswordCredential.length);
    testing.expectEqual(0, PublicKeyCredential.length);
    testing.expectEqual(0, AuthenticatorResponse.length);

    // The statics, in Chrome's own order.
    testing.expectEqual(
      ['isConditionalMediationAvailable'],
      Object.getOwnPropertyNames(Credential).filter((k) => !['length', 'name', 'prototype'].includes(k)),
    );
    testing.expectEqual(
      [
        'getClientCapabilities', 'isConditionalMediationAvailable',
        'isUserVerifyingPlatformAuthenticatorAvailable', 'parseCreationOptionsFromJSON',
        'parseRequestOptionsFromJSON', 'signalAllAcceptedCredentials',
        'signalCurrentUserDetails', 'signalUnknownCredential',
      ],
      Object.getOwnPropertyNames(PublicKeyCredential).filter((k) => !['length', 'name', 'prototype'].includes(k)),
    );
    testing.expectEqual(['disconnect'], Object.getOwnPropertyNames(IdentityCredential).filter((k) => !['length', 'name', 'prototype'].includes(k)));
    testing.expectEqual(1, PublicKeyCredential.parseCreationOptionsFromJSON.length);
    testing.expectEqual(0, PublicKeyCredential.getClientCapabilities.length);
    testing.expectEqual(1, IdentityCredential.disconnect.length);
    testing.expectEqual(0, AuthenticatorAttestationResponse.prototype.getTransports.length);
  }
</script>

<script id=illegalConstructors>
  {
    // The seven that no script can build. Chrome distinguishes the two families:
    // a bare call on an unconstructible interface is "Illegal constructor",
    // while `new` on it names the interface (measured).
    for (const name of ['Credential', 'PublicKeyCredential', 'IdentityCredential', 'OTPCredential',
      'AuthenticatorResponse', 'AuthenticatorAssertionResponse', 'AuthenticatorAttestationResponse']) {
      let bare = null;
      try { window[name](); } catch (e) { bare = `${e.name}: ${e.message}`; }
      testing.expectEqual('TypeError: Illegal constructor', bare, { label: name });
      let withNew = null;
      try { new window[name](); } catch (e) { withNew = `${e.name}: ${e.message}`; }
      testing.expectEqual(`TypeError: Failed to construct '${name}': Illegal constructor`, withNew, { label: name });
    }

    // The two constructible ones refuse a bare call by naming the operator.
    for (const name of ['FederatedCredential', 'PasswordCredential']) {
      let bare = null;
      try { window[name]({}); } catch (e) { bare = `${e.name}: ${e.message}`; }
      testing.expectEqual(
        `TypeError: Failed to construct '${name}': Please use the 'new' operator, this DOM object constructor cannot be called as a function.`,
        bare,
        { label: name },
      );
    }
  }
</script>

<script id=federated>
  {
    const full = new FederatedCredential({
      id: 'user@example.com',
      provider: 'https://idp.example/',
      name: 'N',
      iconURL: 'https://i.example/i.png',
      protocol: 'openidconnect',
    });
    testing.expectEqual('[object FederatedCredential]', Object.prototype.toString.call(full));
    testing.expectEqual('user@example.com', full.id);
    testing.expectEqual('federated', full.type);
    // The origin, not the URL — the trailing slash is gone (measured).
    testing.expectEqual('https://idp.example', full.provider);
    testing.expectEqual('N', full.name);
    testing.expectEqual('https://i.example/i.png', full.iconURL);
    // Measured: the init's protocol is parsed and dropped, always reading "".
    testing.expectEqual('', full.protocol);
    testing.expectEqual([], Object.getOwnPropertyNames(full));
    testing.expectEqual(true, full instanceof Credential);

    const minimal = new FederatedCredential({ id: 'x', provider: 'https://idp.example' });
    testing.expectEqual(['x', 'federated', 'https://idp.example', '', ''],
      [minimal.id, minimal.type, minimal.provider, minimal.name, minimal.iconURL]);
    // A port survives; a path does not.
    testing.expectEqual('http://i.example:8080', new FederatedCredential({ id: 'x', provider: 'http://i.example:8080/x' }).provider);

    const refusals = [
      [() => new FederatedCredential(), "TypeError: Failed to construct 'FederatedCredential': 1 argument required, but only 0 present."],
      [() => new FederatedCredential({}), "TypeError: Failed to construct 'FederatedCredential': Failed to read the 'id' property from 'CredentialData': Required member is undefined."],
      [() => new FederatedCredential({ id: 'a' }), "TypeError: Failed to construct 'FederatedCredential': Failed to read the 'provider' property from 'FederatedCredentialInit': Required member is undefined."],
      // null is refused by dictionary name, not treated as an empty dictionary.
      [() => new FederatedCredential(null), "TypeError: Failed to construct 'FederatedCredential': The provided value is not of type 'FederatedCredentialInit'."],
      [() => new FederatedCredential(5), "TypeError: Failed to construct 'FederatedCredential': The provided value is not of type 'FederatedCredentialInit'."],
      [() => new FederatedCredential({ id: 'x', provider: 'not a url' }), "SyntaxError: Failed to construct 'FederatedCredential': 'not a url' is not a valid URL."],
      [() => new FederatedCredential({ id: 'x', provider: 'https://i.example', iconURL: 'not a url' }), "SyntaxError: Failed to construct 'FederatedCredential': 'not a url' is not a valid URL."],
    ];
    for (const [fn, expected] of refusals) {
      let err = null;
      try { fn(); } catch (e) { err = `${e.name}: ${e.message}`; }
      testing.expectEqual(expected, err);
    }
  }
</script>

<script id=password>
  {
    const full = new PasswordCredential({ id: 'u', password: 'p', name: 'N', iconURL: 'https://i.example/i.png' });
    testing.expectEqual('[object PasswordCredential]', Object.prototype.toString.call(full));
    testing.expectEqual(['u', 'password', 'p', 'N', 'https://i.example/i.png'],
      [full.id, full.type, full.password, full.name, full.iconURL]);
    testing.expectEqual([], Object.getOwnPropertyNames(full));

    const bare = new PasswordCredential({ id: 'u', password: 'p' });
    testing.expectEqual(['', ''], [bare.name, bare.iconURL]);

    const refusals = [
      [() => new PasswordCredential(), "TypeError: Failed to construct 'PasswordCredential': 1 argument required, but only 0 present."],
      [() => new PasswordCredential({}), "TypeError: Failed to construct 'PasswordCredential': Failed to read the 'id' property from 'CredentialData': Required member is undefined."],
      [() => new PasswordCredential({ id: 'a' }), "TypeError: Failed to construct 'PasswordCredential': Failed to read the 'password' property from 'PasswordCredentialData': Required member is undefined."],
      [() => new PasswordCredential({ id: 'u', password: '' }), "TypeError: Failed to construct 'PasswordCredential': 'password' must not be empty."],
      // Two overloads (form or dictionary), so a non-object fails resolution.
      [() => new PasswordCredential(5), "TypeError: Failed to construct 'PasswordCredential': Overload resolution failed."],
    ];
    for (const [fn, expected] of refusals) {
      let err = null;
      try { fn(); } catch (e) { err = `${e.name}: ${e.message}`; }
      testing.expectEqual(expected, err);
    }

    // A plain element is not refused: it goes to the dictionary overload, where
    // `element.id` satisfies `id` and the missing password is what's named.
    let divErr = null;
    try { new PasswordCredential(document.createElement('div')); } catch (e) { divErr = `${e.name}: ${e.message}`; }
    testing.expectEqual(
      "TypeError: Failed to construct 'PasswordCredential': Failed to read the 'password' property from 'PasswordCredentialData': Required member is undefined.",
      divErr,
    );

    // The HTMLFormElement overload reads the autocomplete tokens.
    const form = document.createElement('form');
    form.innerHTML = '<input name="username" autocomplete="username" value="u">' +
      '<input name="password" type="password" autocomplete="current-password" value="p">';
    document.documentElement.appendChild(form);
    const fromForm = new PasswordCredential(form);
    testing.expectEqual(['u', 'p', 'password'], [fromForm.id, fromForm.password, fromForm.type]);

    // A form that names no tokens is refused for `username` first (measured).
    const plain = document.createElement('form');
    plain.innerHTML = '<input name="u" value="x"><input name="p" type="password" value="y">';
    document.documentElement.appendChild(plain);
    let plainErr = null;
    try { new PasswordCredential(plain); } catch (e) { plainErr = `${e.name}: ${e.message}`; }
    testing.expectEqual(
      "TypeError: Failed to construct 'PasswordCredential': 'username' must be specified in the form's autocomplete attribute.",
      plainErr,
    );
  }
</script>

<script id=webauthnStatics type=module>
  {
    const state = await testing.async();
    // Chrome 150 on a Mac with a platform authenticator answers true to both of
    // these, and false to Credential's own copy, which asks about passwords.
    const results = {};
    try {
      results.credentialCMA = await Credential.isConditionalMediationAvailable();
      results.pkcCMA = await PublicKeyCredential.isConditionalMediationAvailable();
      results.uvpaa = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
      results.caps = await PublicKeyCredential.getClientCapabilities();
      results.signalOk = await PublicKeyCredential.signalUnknownCredential({ rpId: 'localhost', credentialId: 'AAAA' });
      try { await PublicKeyCredential.signalAllAcceptedCredentials({}); } catch (e) { results.signalAll = `${e.name}: ${e.message}`; }
      try { await PublicKeyCredential.signalCurrentUserDetails({}); } catch (e) { results.signalUser = `${e.name}: ${e.message}`; }
      try { await IdentityCredential.disconnect({}); } catch (e) { results.disconnect = `${e.name}: ${e.message}`; }
    } catch (e) {
      results.fatal = `${e.name}: ${e.message}`;
    }
    state.resolve();

    await state.done(() => {
      testing.expectEqual(undefined, results.fatal);
      testing.expectEqual(false, results.credentialCMA);
      testing.expectEqual(true, results.pkcCMA);
      testing.expectEqual(true, results.uvpaa);
      testing.expectEqual(undefined, results.signalOk);
      // 24 capability keys, alphabetical, two of them false (measured).
      testing.expectEqual(24, Object.keys(results.caps).length);
      testing.expectEqual(true, results.caps.userVerifyingPlatformAuthenticator);
      testing.expectEqual(false, results.caps['extension:cmtgKey']);
      testing.expectEqual(false, results.caps['extension:crossDeviceFallbackUrl']);
      testing.expectEqual(
        "TypeError: Failed to execute 'signalAllAcceptedCredentials' on 'PublicKeyCredential': Failed to read the 'allAcceptedCredentialIds' property from 'AllAcceptedCredentialsOptions': Required member is undefined.",
        results.signalAll,
      );
      testing.expectEqual(
        "TypeError: Failed to execute 'signalCurrentUserDetails' on 'PublicKeyCredential': Failed to read the 'displayName' property from 'CurrentUserDetailsOptions': Required member is undefined.",
        results.signalUser,
      );
      testing.expectEqual(
        "TypeError: Failed to execute 'disconnect' on 'IdentityCredential': Failed to read the 'configURL' property from 'IdentityProviderConfig': Required member is undefined.",
        results.disconnect,
      );
    });
  }
</script>

<script id=parseFromJSON>
  {
    // The refusals name the first missing required member in WebIDL's
    // alphabetical order, which is why `{challenge}` is refused for
    // pubKeyCredParams rather than for rp (measured).
    const refusals = [
      [() => PublicKeyCredential.parseCreationOptionsFromJSON(), "TypeError: Failed to execute 'parseCreationOptionsFromJSON' on 'PublicKeyCredential': 1 argument required, but only 0 present."],
      [() => PublicKeyCredential.parseCreationOptionsFromJSON(5), "TypeError: Failed to execute 'parseCreationOptionsFromJSON' on 'PublicKeyCredential': The provided value is not of type 'PublicKeyCredentialCreationOptionsJSON'."],
      [() => PublicKeyCredential.parseCreationOptionsFromJSON({}), "TypeError: Failed to execute 'parseCreationOptionsFromJSON' on 'PublicKeyCredential': Failed to read the 'challenge' property from 'PublicKeyCredentialCreationOptionsJSON': Required member is undefined."],
      [() => PublicKeyCredential.parseCreationOptionsFromJSON({ challenge: 'AAAA' }), "TypeError: Failed to execute 'parseCreationOptionsFromJSON' on 'PublicKeyCredential': Failed to read the 'pubKeyCredParams' property from 'PublicKeyCredentialCreationOptionsJSON': Required member is undefined."],
      [() => PublicKeyCredential.parseRequestOptionsFromJSON({}), "TypeError: Failed to execute 'parseRequestOptionsFromJSON' on 'PublicKeyCredential': Failed to read the 'challenge' property from 'PublicKeyCredentialRequestOptionsJSON': Required member is undefined."],
      [() => PublicKeyCredential.parseCreationOptionsFromJSON({ challenge: '!!!!', pubKeyCredParams: [], rp: {}, user: {} }), "EncodingError: Failed to execute 'parseCreationOptionsFromJSON' on 'PublicKeyCredential': 'challenge' contains invalid base64url data"],
    ];
    for (const [fn, expected] of refusals) {
      let err = null;
      try { fn(); } catch (e) { err = `${e.name}: ${e.message}`; }
      testing.expectEqual(expected, err);
    }

    const creation = PublicKeyCredential.parseCreationOptionsFromJSON({
      challenge: 'AAAA',
      rp: { id: 'localhost', name: 'r' },
      user: { id: 'AQID', name: 'u', displayName: 'U' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
    });
    // Chrome's own key order for the result: alphabetical, defaults filled in.
    testing.expectEqual(
      ['attestation', 'challenge', 'excludeCredentials', 'hints', 'pubKeyCredParams', 'rp', 'user'],
      Object.keys(creation),
    );
    testing.expectEqual('none', creation.attestation);
    testing.expectEqual('[object ArrayBuffer]', Object.prototype.toString.call(creation.challenge));
    testing.expectEqual(3, creation.challenge.byteLength);
    testing.expectEqual([], creation.excludeCredentials);
    testing.expectEqual([], creation.hints);
    testing.expectEqual(['name', 'displayName', 'id'], Object.keys(creation.user));
    testing.expectEqual('[object ArrayBuffer]', Object.prototype.toString.call(creation.user.id));
    testing.expectEqual([1, 2, 3], Array.from(new Uint8Array(creation.user.id)));

    const request = PublicKeyCredential.parseRequestOptionsFromJSON({ challenge: 'AAAA' });
    testing.expectEqual(['allowCredentials', 'challenge', 'hints', 'userVerification'], Object.keys(request));
    testing.expectEqual('preferred', request.userVerification);
    testing.expectEqual([], request.allowCredentials);
  }
</script>

<script id=container type=module>
  {
    const state = await testing.async();
    testing.expectEqual('function', typeof CredentialsContainer);
    testing.expectEqual('[object CredentialsContainer]', Object.prototype.toString.call(navigator.credentials));
    testing.expectEqual(
      ['create', 'get', 'preventSilentAccess', 'store', 'constructor'],
      Object.getOwnPropertyNames(CredentialsContainer.prototype),
    );
    testing.expectEqual([0, 0, 0, 1], [
      CredentialsContainer.prototype.create.length,
      CredentialsContainer.prototype.get.length,
      CredentialsContainer.prototype.preventSilentAccess.length,
      CredentialsContainer.prototype.store.length,
    ]);

    const r = {};
    const err = async (p) => { try { await p; return 'NO THROW'; } catch (e) { return `${e.name}: ${e.message}`; } };
    // Nothing is stored, so a password or federated request finds nothing.
    r.password = await navigator.credentials.get({ password: true });
    r.federated = await navigator.credentials.get({ federated: { providers: ['https://idp.example'] } });
    r.silent = await navigator.credentials.preventSilentAccess();
    // No credential type at all is a NotSupportedError, and `password: false`
    // counts as none (measured).
    r.empty = await err(navigator.credentials.get({}));
    r.noArg = await err(navigator.credentials.get());
    r.passwordFalse = await err(navigator.credentials.get({ password: false }));
    // Dictionary conversion outranks the algorithm's own checks.
    r.badMediation = await err(navigator.credentials.get({ password: true, mediation: 'nope' }));
    r.notDict = await err(navigator.credentials.get(5));
    r.publicKeyEmpty = await err(navigator.credentials.get({ publicKey: {} }));
    r.identityEmpty = await err(navigator.credentials.get({ identity: {} }));
    r.otpEmpty = await err(navigator.credentials.get({ otp: {} }));
    r.otpBad = await err(navigator.credentials.get({ otp: { transport: ['nope'] } }));

    // create() hands back a real credential for password and federated.
    const created = await navigator.credentials.create({ password: { id: 'u', password: 'p' } });
    r.createdBrand = Object.prototype.toString.call(created);
    r.createdFields = [created.id, created.type, created.password, created.name];
    const federated = await navigator.credentials.create({ federated: { id: 'x', provider: 'https://idp.example' } });
    r.federatedBrand = Object.prototype.toString.call(federated);
    r.federatedProvider = federated.provider;
    r.createEmpty = await err(navigator.credentials.create({}));
    r.createBoth = await err(navigator.credentials.create({ password: { id: 'u', password: 'p' }, federated: { id: 'x', provider: 'https://i.example' } }));
    r.createPasswordEmpty = await err(navigator.credentials.create({ password: {} }));
    r.createPublicKeyEmpty = await err(navigator.credentials.create({ publicKey: {} }));

    // store() type-checks its argument against Credential; a real one resolves.
    r.storeOk = await navigator.credentials.store(created);
    r.storeFederated = await navigator.credentials.store(federated);
    r.storeObject = await err(navigator.credentials.store({}));
    r.storeNull = await err(navigator.credentials.store(null));
    r.storeNoArg = await err(navigator.credentials.store());
    state.resolve();

    await state.done(() => {
      testing.expectEqual(null, r.password);
      testing.expectEqual(null, r.federated);
      testing.expectEqual(undefined, r.silent);
      const noType = 'NotSupportedError: No credential type was specified in the request.';
      testing.expectEqual(noType, r.empty);
      testing.expectEqual(noType, r.noArg);
      testing.expectEqual(noType, r.passwordFalse);
      testing.expectEqual(
        "TypeError: Failed to execute 'get' on 'CredentialsContainer': Failed to read the 'mediation' property from 'CredentialRequestOptions': The provided value 'nope' is not a valid enum value of type CredentialMediationRequirement.",
        r.badMediation,
      );
      testing.expectEqual(
        "TypeError: Failed to execute 'get' on 'CredentialsContainer': The provided value is not of type 'CredentialRequestOptions'.",
        r.notDict,
      );
      testing.expectEqual(
        "TypeError: Failed to execute 'get' on 'CredentialsContainer': Failed to read the 'publicKey' property from 'CredentialRequestOptions': Failed to read the 'challenge' property from 'PublicKeyCredentialRequestOptions': Required member is undefined.",
        r.publicKeyEmpty,
      );
      testing.expectEqual(
        "TypeError: Failed to execute 'get' on 'CredentialsContainer': Failed to read the 'identity' property from 'CredentialRequestOptions': Failed to read the 'providers' property from 'IdentityCredentialRequestOptions': Required member is undefined.",
        r.identityEmpty,
      );
      testing.expectEqual('NotSupportedError: Unsupported transport type for OTP Credentials', r.otpEmpty);
      testing.expectEqual(
        "TypeError: Failed to execute 'get' on 'CredentialsContainer': Failed to read the 'otp' property from 'CredentialRequestOptions': Failed to read the 'transport' property from 'OTPCredentialRequestOptions': The provided value 'nope' is not a valid enum value of type OTPCredentialTransportType.",
        r.otpBad,
      );

      testing.expectEqual('[object PasswordCredential]', r.createdBrand);
      testing.expectEqual(['u', 'password', 'p', ''], r.createdFields);
      testing.expectEqual('[object FederatedCredential]', r.federatedBrand);
      testing.expectEqual('https://idp.example', r.federatedProvider);
      const onlyOne = "NotSupportedError: Only exactly one of 'password', 'federated', and 'publicKey' credential types are currently supported.";
      testing.expectEqual(onlyOne, r.createEmpty);
      testing.expectEqual(onlyOne, r.createBoth);
      testing.expectEqual(
        "TypeError: Failed to execute 'create' on 'CredentialsContainer': Failed to read the 'password' property from 'CredentialCreationOptions': Failed to read the 'id' property from 'CredentialData': Required member is undefined.",
        r.createPasswordEmpty,
      );
      testing.expectEqual(
        "TypeError: Failed to execute 'create' on 'CredentialsContainer': Failed to read the 'publicKey' property from 'CredentialCreationOptions': Failed to read the 'challenge' property from 'PublicKeyCredentialCreationOptions': Required member is undefined.",
        r.createPublicKeyEmpty,
      );

      testing.expectEqual(undefined, r.storeOk);
      testing.expectEqual(undefined, r.storeFederated);
      const notCredential = "TypeError: Failed to execute 'store' on 'CredentialsContainer': parameter 1 is not of type 'Credential'.";
      testing.expectEqual(notCredential, r.storeObject);
      testing.expectEqual(notCredential, r.storeNull);
      testing.expectEqual(
        "TypeError: Failed to execute 'store' on 'CredentialsContainer': 1 argument required, but only 0 present.",
        r.storeNoArg,
      );
    });
  }
</script>
