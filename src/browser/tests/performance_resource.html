<!DOCTYPE html>
<head>
  <script src="testing.js"></script>
  <link rel="stylesheet" href="/styles/visibility.css">
  <link rel="preload" as="script" href="/src/browser/tests/shape.js">
  <script src="/served/compressed.js"></script>
</head>
<body>
  <img id="pic" src="/src/browser/tests/performance_resource.png">

  <!--
    Every subresource a browser loads leaves a `resource` PerformanceEntry
    behind, filed under an `initiatorType` that names *how* the load was
    started. The parser-driven ones are the half that matters on the station:
    Cloudflare's api.js is a `<script>`, not a fetch, so the entry the page
    posts to the Turnstile widget as `apiJsResourceTiming` — `undefined` here
    and a 1 035-byte object on a real Chrome — can only come from this path.

    The expected initiatorType strings are measured, not remembered:
    `tools/fingerprint/resource-timing-initiators.mjs` serves a page carrying
    one of each load kind and reads the buffer back off Chrome 151.
  -->

  <!-- No id: the runner asks every identified block for an assertion, and
       this one only defines a helper the blocks below share. -->
  <script>
    // Poll rather than listen: an <img> here answers `complete === true` even
    // while its bytes are in flight (nothing decodes, so every image is in the
    // "broken" state), and a <link rel=preload> has no element event at all
    // when the prescan started its fetch. The entry itself is the signal.
    window.waitForResourceEntry = async function (path) {
      const name = testing.ORIGIN + path;
      for (let i = 0; i < 100; i++) {
        const found = performance.getEntriesByName(name, 'resource');
        if (found.length > 0) return found;
        await new Promise((r) => setTimeout(r, 10));
      }
      return performance.getEntriesByName(name, 'resource');
    };
  </script>

  <script id=resource_entry_for_classic_script type=module>
    const state = await testing.async();
    // `<script src=testing.js>` in the head above, which every test page in
    // this tree carries: a classic parser-driven script.
    const entries = await waitForResourceEntry('/src/browser/tests/testing.js');
    state.resolve();
    await state.done(() => {
      testing.expectEqual(1, entries.length);
      testing.expectEqual('script', entries[0].initiatorType);
      testing.expectEqual('resource', entries[0].entryType);
      testing.expectEqual(true, entries[0] instanceof PerformanceResourceTiming);
      testing.expectEqual(true, entries[0].startTime > 0);
      testing.expectEqual(true, entries[0].duration >= 0);
      // The protocol the response actually arrived over. Reporting "" while
      // claiming a Chrome user agent says the connection had no version,
      // which no real one does.
      testing.expectEqual('http/1.1', entries[0].nextHopProtocol);
      // A <script src> with neither async nor defer blocks the parser, and
      // Chrome 151 says so in the entry.
      testing.expectEqual('blocking', entries[0].renderBlockingStatus);
      testing.expectEqual(200, entries[0].responseStatus);
      // Nothing was served from a cache, so the delivery is a plain fetch.
      testing.expectEqual('', entries[0].deliveryType);
    });
  </script>

  <script id=resource_entry_for_stylesheet type=module>
    const state = await testing.async();
    // `<link rel=stylesheet>` is "link" — the element that started it, not the
    // kind of bytes that came back. A sheet reached through `@import` would be
    // "css", which this engine cannot produce yet because it never follows an
    // @import in the first place.
    const entries = await waitForResourceEntry('/styles/visibility.css');
    state.resolve();
    await state.done(() => {
      testing.expectEqual(1, entries.length);
      testing.expectEqual('link', entries[0].initiatorType);
      testing.expectEqual('http/1.1', entries[0].nextHopProtocol);
      // A stylesheet holds up rendering until its rules are in, which is why
      // this engine fetches it synchronously in the first place.
      testing.expectEqual('blocking', entries[0].renderBlockingStatus);
    });
  </script>

  <script id=resource_entry_for_image type=module>
    const state = await testing.async();
    const entries = await waitForResourceEntry('/src/browser/tests/performance_resource.png');
    state.resolve();
    await state.done(() => {
      testing.expectEqual(1, entries.length);
      testing.expectEqual('img', entries[0].initiatorType);
      testing.expectEqual('http/1.1', entries[0].nextHopProtocol);
      // An image is fetched alongside rendering, never ahead of it.
      testing.expectEqual('non-blocking', entries[0].renderBlockingStatus);
      // The one-pixel PNG the test server answers every image path with.
      testing.expectEqual(true, entries[0].encodedBodySize > 0);
      testing.expectEqual(entries[0].encodedBodySize, entries[0].decodedBodySize);
    });
  </script>

  <script id=resource_entry_for_preload_link type=module>
    const state = await testing.async();
    // A `<link rel=preload as=script>` is filed under the *link* that asked
    // for it, even though what arrives is a script — measured on Chrome 151,
    // which also files only one entry when a later `<script src>` consumes the
    // preloaded response rather than a second one for the reuse.
    const entries = await waitForResourceEntry('/src/browser/tests/shape.js');
    state.resolve();
    await state.done(() => {
      testing.expectEqual(1, entries.length);
      testing.expectEqual('link', entries[0].initiatorType);
    });
  </script>

  <script id=resource_entry_reports_the_wire_size type=module>
    const state = await testing.async();
    // The two sizes are not the same number. `encodedBodySize` is what came off
    // the wire; `decodedBodySize` is what it became once the content-encoding
    // was undone. Reporting the decoded size for both says the response was
    // served uncompressed -- which, for a script a real site serves under
    // brotli, is a claim about the server that the server itself contradicts.
    //
    // Measured on Chrome 151 (tools/fingerprint/resource-timing-response-fields.mjs):
    // a br-encoded 7 046-byte body answered encodedBodySize 65 (the compressed
    // length) against decodedBodySize 7 046, and transferSize was the encoded
    // size plus the flat 300 bytes of header overhead.
    const entries = await waitForResourceEntry('/served/compressed.js');
    state.resolve();
    await state.done(() => {
      testing.expectEqual(1, entries.length);
      testing.expectEqual(72, entries[0].encodedBodySize);
      testing.expectEqual(1745, entries[0].decodedBodySize);
      testing.expectEqual(372, entries[0].transferSize);
      // The script really did run, so the body that got decoded is the body the
      // decoded size counts.
      testing.expectEqual(1, window.__compressed);
    });
  </script>

  <script id=resource_entry_quotes_the_response_labels type=module>
    const state = await testing.async();
    // `contentType` is the MIME essence -- the parameters dropped and the rest
    // lowercased -- and `contentEncoding` is the Content-Encoding header as it
    // was sent. Both measured on Chrome 151
    // (tools/fingerprint/resource-timing-response-fields.mjs): a sheet served
    // as `text/CSS; charset=UTF-8` filed `text/css`, and a br-encoded script
    // filed `br`.
    //
    // Answering "" for both is what this engine did, and it is a claim no
    // server makes: a response with a body has a type, and the whole point of
    // the Content-Encoding header is that something on the wire read it.
    const compressed = await waitForResourceEntry('/served/compressed.js');
    const sheet = await waitForResourceEntry('/styles/visibility.css');
    state.resolve();
    await state.done(() => {
      // Served as `text/javascript; charset=UTF-8`; the parameter is not part
      // of what the entry reports.
      testing.expectEqual('text/javascript', compressed[0].contentType);
      testing.expectEqual('gzip', compressed[0].contentEncoding);
      // No Content-Encoding on the sheet, so the field stays empty -- an empty
      // string here means "not encoded", which is true of this one.
      testing.expectEqual('text/css', sheet[0].contentType);
      testing.expectEqual('', sheet[0].contentEncoding);
    });
  </script>

  <script id=resource_entry_walks_the_connection type=module>
    const state = await testing.async();
    // The nine connection milestones were all zero, which reads as a load that
    // resolved no name, opened no socket and sent no request -- while
    // responseEnd said bytes arrived. Chrome 151 over plain HTTP fills seven of
    // the nine and leaves exactly two at zero: secureConnectionStart, because
    // there was no TLS handshake, and firstInterimResponseStart, because there
    // was no 1xx (measured, resource-timing-response-fields.mjs).
    const entries = await waitForResourceEntry('/served/compressed.js');
    state.resolve();
    await state.done(() => {
      const e = entries[0];
      // Not an assertion about wall-clock values -- those cannot be predicted
      // -- but about the order a load happens in, which is the part a reader
      // of the entry can check.
      const walk = [
        e.fetchStart, e.domainLookupStart, e.domainLookupEnd,
        e.connectStart, e.connectEnd, e.requestStart,
        e.responseStart, e.responseEnd,
      ];
      for (let i = 1; i < walk.length; i++) {
        testing.expectEqual(true, walk[i] >= walk[i - 1]);
      }
      // A round trip happened, so the response cannot have started at the
      // instant the fetch did. This is what fails when the milestones are
      // stamped with fetchStart instead of measured.
      testing.expectEqual(true, e.responseStart > e.fetchStart);
      // Chrome reports the same instant for both: this engine reads no
      // interim responses, so the final headers are the only headers.
      testing.expectEqual(e.responseStart, e.finalResponseHeadersStart);
      // The two Chrome leaves at zero over plain HTTP.
      testing.expectEqual(0, e.secureConnectionStart);
      testing.expectEqual(0, e.firstInterimResponseStart);
    });
  </script>

  <script id=xhr_and_fetch_entries_walk_the_connection_too type=module>
    const state = await testing.async();
    // The block above proves a SCRIPT entry walks the connection. It does not
    // prove an entry does, because the two do not share a code path:
    // `Frame.recordResourceTiming` says so in its own comment -- script, link
    // and img go through it and it calls `setConnectionMilestones`, while "XHR
    // and fetch call Performance directly" and build their `timing.Timing`
    // literal by hand. That literal never carried the connection walk, so both
    // reported seven of the nine milestones as 0 while responseEnd said bytes
    // had arrived.
    //
    // Measured against Chrome 151 on a two-origin fixture
    // (probes/expr-b86-subframe-milestones.js, both frames firing all four
    // initiator types at their own origin): Chrome leaves exactly
    // secureConnectionStart at zero over plain HTTP for xmlhttprequest, fetch,
    // script and img alike, and this engine left seven at zero for the first
    // two and matched Chrome on the last two.
    // No query string: the test server matches this path with an exact
    // compare, so `?anything` is an unknown file and takes the server's
    // `unreachable`. The two entries are told apart by initiatorType instead,
    // which is the field under test anyway.
    const url = testing.ORIGIN + '/served/compressed.js';
    await new Promise((resolve) => {
      const x = new XMLHttpRequest();
      x.open('GET', url);
      x.onloadend = resolve;
      x.send();
    });
    await fetch(url).then((r) => r.text());
    // One tick, so the entries are in the buffer rather than in flight.
    await new Promise((r) => setTimeout(r, 10));
    state.resolve();
    await state.done(() => {
      // One composed string rather than a pile of booleans: a bare
      // `expectEqual(true, ...)` prints "expected true, got false" and leaves
      // the reader to guess which of six checks it was, and the `desc` option
      // does not reach this runner's output.
      const report = [];
      for (const kind of ['xmlhttprequest', 'fetch']) {
        const e = performance.getEntriesByType('resource')
          .filter((r) => r.initiatorType === kind)[0];
        if (!e) { report.push(kind + ': no entry'); continue; }
        const walk = [
          e.fetchStart, e.domainLookupStart, e.domainLookupEnd,
          e.connectStart, e.connectEnd, e.requestStart,
          e.responseStart, e.responseEnd,
        ];
        let ordered = true;
        for (let i = 1; i < walk.length; i++) if (walk[i] < walk[i - 1]) ordered = false;
        report.push([
          kind,
          'ordered=' + ordered,
          // The one that fails when the walk is missing: with every milestone
          // at 0 the order check above passes vacuously, because 0 >= 0.
          'responseStartAfterFetch=' + (e.responseStart > e.fetchStart),
          'finalHeaders=' + (e.responseStart === e.finalResponseHeadersStart),
          // The two Chrome also leaves at zero over plain HTTP.
          'tlsZero=' + (e.secureConnectionStart === 0),
          'interimZero=' + (e.firstInterimResponseStart === 0),
        ].join(' '));
      }
      testing.expectEqual(
        'xmlhttprequest ordered=true responseStartAfterFetch=true finalHeaders=true tlsZero=true interimZero=true | ' +
        'fetch ordered=true responseStartAfterFetch=true finalHeaders=true tlsZero=true interimZero=true',
        report.join(' | '));
    });
  </script>

  <script id=an_iframe_element_leaves_a_resource_entry type=module>
    const state = await testing.async();
    // An <iframe> is a subresource load like any other and Chrome files it
    // under its own initiatorType. This engine recorded nothing at all for it:
    // measured on a fixture with one of every kind
    // (probes/b86-initiator-fixture.mjs + probes/expr-b86-initiator-set.js),
    // Chrome answers 7 entries --
    // `fetch:1 iframe:1 img:1 link:1 other:1 script:1 xmlhttprequest:1` --
    // and this engine answers the same set minus the iframe: 6 entries, and
    // 183 bytes of entry names against Chrome's 215, the 32 missing bytes
    // being that one URL.
    //
    // Corroborated off the live station rather than only off the fixture:
    // Chrome's pre-ticket top document on cf-scrapingcourse carries
    // `script:2 img:1 xhr:1 other:1 iframe:1` and this engine's carries the
    // same minus the iframe.
    const src = testing.ORIGIN + '/src/browser/tests/support/empty_frame.html';
    const frame = document.createElement('iframe');
    await new Promise((resolve) => {
      frame.onload = resolve;
      frame.onerror = resolve;
      frame.src = src;
      document.body.appendChild(frame);
    });
    // One tick, so the entry is in the buffer rather than in flight.
    await new Promise((r) => setTimeout(r, 20));
    state.resolve();
    await state.done(() => {
      const mine = performance.getEntriesByType('resource')
        .filter((e) => e.name === src);
      // Composed rather than asserted one boolean at a time: this runner does
      // not print the `desc` option, so a bare expectEqual(true, ...) would
      // say "expected true, got false" and nothing about which check it was.
      testing.expectEqual(
        'entries=1 initiatorType=iframe entryType=resource',
        'entries=' + mine.length +
        ' initiatorType=' + (mine[0] ? mine[0].initiatorType : '(none)') +
        ' entryType=' + (mine[0] ? mine[0].entryType : '(none)'));
      frame.remove();
    });
  </script>

  <script id=the_iframe_entry_is_on_the_parents_clock type=module>
    const state = await testing.async();
    // The entry the parent files for an <iframe> is a COPY of the child
    // document's own navigation timing, and a child document's timeline starts
    // at its own navigationStart -- so a copy that is not restated on the
    // parent's clock reports a subresource that began before the elements
    // above it in the parent were parsed. Measured on
    // probes/b86-initiator-fixture.mjs with probes/expr-b87-iframe-timebase.js:
    // this engine's parent entry read `start=2.4 end=5.7` while the child's own
    // navigation read `start=0.0 end=5.7` and the two time origins were 10.9ms
    // apart -- the child's numbers, verbatim. Chrome's read `start=55.6
    // end=69.4` against a child of `0.0 / 14.0` and an origin gap of 55.5,
    // which is the same numbers plus the gap.
    // Its own document, not support/empty_frame.html: the block above asserts
    // that exactly one entry carries that name.
    const src = testing.ORIGIN + '/src/browser/tests/support/empty_frame_clock.html';
    const frame = document.createElement('iframe');
    // Taken on the PARENT's clock immediately before the load can start. The
    // entry cannot honestly claim to have begun before this instant.
    const before = performance.now();
    await new Promise((resolve) => {
      frame.onload = resolve;
      frame.onerror = resolve;
      frame.src = src;
      document.body.appendChild(frame);
    });
    await new Promise((r) => setTimeout(r, 20));
    const after = performance.now();
    // The child's own view of the same load, to check the fix translated the
    // numbers rather than replacing them with the parent's own clock readings.
    const childNav = frame.contentWindow.performance.getEntriesByType('navigation')[0];
    state.resolve();
    await state.done(() => {
      const mine = performance.getEntriesByType('resource').filter((e) => e.name === src);
      const e = mine[0];
      // Composed into one string rather than asserted a boolean at a time: the
      // runner never prints `desc`, so a bare expectEqual(true, ...) says
      // "expected true, got false" and names none of the four checks.
      const span = e && childNav
        ? Math.abs((e.responseEnd - e.startTime) - (childNav.responseEnd - childNav.fetchStart))
        : NaN;
      testing.expectEqual(
        'startsAfterCreation=true endsBeforeRead=true ordered=true spanPreserved=true',
        'startsAfterCreation=' + (e ? e.startTime >= before : '(no entry)') +
        ' endsBeforeRead=' + (e ? e.responseEnd <= after : '(no entry)') +
        ' ordered=' + (e ? e.responseEnd >= e.startTime : '(no entry)') +
        // Translating shifts both ends by the same amount, so the load's
        // duration survives; overwriting them with the parent's `now()` would
        // not. 1ms of slack for the 0.1ms lattice both ends are snapped onto.
        ' spanPreserved=' + (span === span ? span < 1 : '(no entry)'));
      frame.remove();
    });
  </script>

  <script id=entries_carry_one_navigation_id type=module>
    const state = await testing.async();
    // Chrome 151 stamps every entry of a navigation with the same
    // `navigationId`, and a fresh one on the next navigation -- twenty
    // navigations across two tabs answered twenty different four-digit numbers,
    // all inside [1, 10000], each shared by that navigation's whole buffer
    // (measured; the oracle's api.js entry carries 9894).
    //
    // The property was missing outright here, which is the difference between
    // the oracle's 34-key entry and this engine's 33-key one.
    await waitForResourceEntry('/served/compressed.js');
    const resources = performance.getEntriesByType('resource');
    const nav = performance.getEntriesByType('navigation')[0];
    state.resolve();
    await state.done(() => {
      testing.expectEqual(true, resources.length > 1);
      const id = nav.navigationId;
      testing.expectEqual('number', typeof id);
      testing.expectEqual(true, id >= 1 && id <= 10000);
      // One navigation, one id -- a per-entry number would let a reader count
      // the loads by counting the ids.
      for (const e of resources) {
        testing.expectEqual(id, e.navigationId);
      }
      // Chrome's key counts and the slot navigationId sits in: straight after
      // duration, ahead of initiatorType, on both entry types.
      const resKeys = Object.keys(resources[0].toJSON());
      const navKeys = Object.keys(nav.toJSON());
      testing.expectEqual(34, resKeys.length);
      testing.expectEqual(48, navKeys.length);
      testing.expectEqual(4, resKeys.indexOf('navigationId'));
      testing.expectEqual(4, navKeys.indexOf('navigationId'));
    });
  </script>

  <script id=resource_entries_are_one_buffer type=module>
    const state = await testing.async();
    await waitForResourceEntry('/src/browser/tests/performance_resource.png');
    const all = performance.getEntriesByType('resource');
    state.resolve();
    await state.done(() => {
      // getEntriesByType has to agree with getEntriesByName about all of them:
      // one buffer, not a per-initiator list that only looks right one lookup
      // at a time.
      for (const path of ['/src/browser/tests/testing.js', '/styles/visibility.css', '/src/browser/tests/performance_resource.png']) {
        testing.expectEqual(true, all.some((e) => e.name === testing.ORIGIN + path));
      }
      testing.expectEqual(true, all.every((e) => e.entryType === 'resource'));
    });
  </script>

  <script id=entry_milestones_stay_on_the_clock_grid type=module>
    const state = await testing.async();
    await waitForResourceEntry('/src/browser/tests/performance_resource.png');
    const all = performance.getEntriesByType('resource');
    const nav = performance.getEntriesByType('navigation')[0];
    state.resolve();
    await state.done(() => {
      // Every milestone an entry exposes is a reading of the same clock
      // `performance.now()` reads, so every one of them lands on that clock's
      // 100us grid. Chrome 151 over a local server: 60 of 60 non-zero fields
      // across the navigation entry and four resource entries were whole
      // multiples of 0.1ms (tools/fingerprint/scratch/expr-entry-grid.js). A
      // milestone finer than that hands back the resolution the clamp exists
      // to withhold -- and `entry.requestStart * 10 % 1` is one expression.
      const FIELDS = ['startTime', 'fetchStart', 'domainLookupStart', 'domainLookupEnd',
        'connectStart', 'connectEnd', 'secureConnectionStart', 'requestStart',
        'responseStart', 'finalResponseHeadersStart', 'responseEnd', 'redirectStart',
        'redirectEnd', 'workerStart', 'domInteractive', 'domContentLoadedEventStart',
        'domContentLoadedEventEnd', 'domComplete', 'loadEventStart', 'loadEventEnd'];

      const offGrid = [];
      let checked = 0;
      for (const entry of [nav, ...all]) {
        if (!entry) continue;
        for (const f of FIELDS) {
          const v = entry[f];
          if (typeof v !== 'number' || v === 0) continue;
          checked++;
          // The lattice the value is spelled on is a dozen digits below the
          // grid, so a whole grid point survives this test comfortably.
          if (Math.abs(v * 10 - Math.round(v * 10)) > 1e-6) offGrid.push(f + '=' + v);
        }
      }
      testing.expectEqual(true, checked >= 20,
        { desc: 'enough non-zero milestones to be worth checking, got ' + checked });
      testing.expectEqual([], offGrid,
        { desc: 'every milestone is a whole multiple of the 100us grid' });
    });
  </script>
</body>
