<!DOCTYPE html>
<head>
  <script src="testing.js"></script>
  <link rel="stylesheet" href="/styles/visibility.css">
  <link rel="preload" as="script" href="/src/browser/tests/shape.js">
  <script src="/served/compressed.js"></script>
</head>
<body>
  <img id="pic" src="/src/browser/tests/performance_resource.png">

  <!--
    Every subresource a browser loads leaves a `resource` PerformanceEntry
    behind, filed under an `initiatorType` that names *how* the load was
    started. The parser-driven ones are the half that matters on the station:
    Cloudflare's api.js is a `<script>`, not a fetch, so the entry the page
    posts to the Turnstile widget as `apiJsResourceTiming` — `undefined` here
    and a 1 035-byte object on a real Chrome — can only come from this path.

    The expected initiatorType strings are measured, not remembered:
    `tools/fingerprint/resource-timing-initiators.mjs` serves a page carrying
    one of each load kind and reads the buffer back off Chrome 151.
  -->

  <!-- No id: the runner asks every identified block for an assertion, and
       this one only defines a helper the blocks below share. -->
  <script>
    // Poll rather than listen: an <img> here answers `complete === true` even
    // while its bytes are in flight (nothing decodes, so every image is in the
    // "broken" state), and a <link rel=preload> has no element event at all
    // when the prescan started its fetch. The entry itself is the signal.
    window.waitForResourceEntry = async function (path) {
      const name = testing.ORIGIN + path;
      for (let i = 0; i < 100; i++) {
        const found = performance.getEntriesByName(name, 'resource');
        if (found.length > 0) return found;
        await new Promise((r) => setTimeout(r, 10));
      }
      return performance.getEntriesByName(name, 'resource');
    };
  </script>

  <script id=resource_entry_for_classic_script type=module>
    const state = await testing.async();
    // `<script src=testing.js>` in the head above, which every test page in
    // this tree carries: a classic parser-driven script.
    const entries = await waitForResourceEntry('/src/browser/tests/testing.js');
    state.resolve();
    await state.done(() => {
      testing.expectEqual(1, entries.length);
      testing.expectEqual('script', entries[0].initiatorType);
      testing.expectEqual('resource', entries[0].entryType);
      testing.expectEqual(true, entries[0] instanceof PerformanceResourceTiming);
      testing.expectEqual(true, entries[0].startTime > 0);
      testing.expectEqual(true, entries[0].duration >= 0);
      // The protocol the response actually arrived over. Reporting "" while
      // claiming a Chrome user agent says the connection had no version,
      // which no real one does.
      testing.expectEqual('http/1.1', entries[0].nextHopProtocol);
      // A <script src> with neither async nor defer blocks the parser, and
      // Chrome 151 says so in the entry.
      testing.expectEqual('blocking', entries[0].renderBlockingStatus);
      testing.expectEqual(200, entries[0].responseStatus);
      // Nothing was served from a cache, so the delivery is a plain fetch.
      testing.expectEqual('', entries[0].deliveryType);
    });
  </script>

  <script id=resource_entry_for_stylesheet type=module>
    const state = await testing.async();
    // `<link rel=stylesheet>` is "link" — the element that started it, not the
    // kind of bytes that came back. A sheet reached through `@import` would be
    // "css", which this engine cannot produce yet because it never follows an
    // @import in the first place.
    const entries = await waitForResourceEntry('/styles/visibility.css');
    state.resolve();
    await state.done(() => {
      testing.expectEqual(1, entries.length);
      testing.expectEqual('link', entries[0].initiatorType);
      testing.expectEqual('http/1.1', entries[0].nextHopProtocol);
      // A stylesheet holds up rendering until its rules are in, which is why
      // this engine fetches it synchronously in the first place.
      testing.expectEqual('blocking', entries[0].renderBlockingStatus);
    });
  </script>

  <script id=resource_entry_for_image type=module>
    const state = await testing.async();
    const entries = await waitForResourceEntry('/src/browser/tests/performance_resource.png');
    state.resolve();
    await state.done(() => {
      testing.expectEqual(1, entries.length);
      testing.expectEqual('img', entries[0].initiatorType);
      testing.expectEqual('http/1.1', entries[0].nextHopProtocol);
      // An image is fetched alongside rendering, never ahead of it.
      testing.expectEqual('non-blocking', entries[0].renderBlockingStatus);
      // The one-pixel PNG the test server answers every image path with.
      testing.expectEqual(true, entries[0].encodedBodySize > 0);
      testing.expectEqual(entries[0].encodedBodySize, entries[0].decodedBodySize);
    });
  </script>

  <script id=resource_entry_for_preload_link type=module>
    const state = await testing.async();
    // A `<link rel=preload as=script>` is filed under the *link* that asked
    // for it, even though what arrives is a script — measured on Chrome 151,
    // which also files only one entry when a later `<script src>` consumes the
    // preloaded response rather than a second one for the reuse.
    const entries = await waitForResourceEntry('/src/browser/tests/shape.js');
    state.resolve();
    await state.done(() => {
      testing.expectEqual(1, entries.length);
      testing.expectEqual('link', entries[0].initiatorType);
    });
  </script>

  <script id=resource_entry_reports_the_wire_size type=module>
    const state = await testing.async();
    // The two sizes are not the same number. `encodedBodySize` is what came off
    // the wire; `decodedBodySize` is what it became once the content-encoding
    // was undone. Reporting the decoded size for both says the response was
    // served uncompressed -- which, for a script a real site serves under
    // brotli, is a claim about the server that the server itself contradicts.
    //
    // Measured on Chrome 151 (tools/fingerprint/resource-timing-response-fields.mjs):
    // a br-encoded 7 046-byte body answered encodedBodySize 65 (the compressed
    // length) against decodedBodySize 7 046, and transferSize was the encoded
    // size plus the flat 300 bytes of header overhead.
    const entries = await waitForResourceEntry('/served/compressed.js');
    state.resolve();
    await state.done(() => {
      testing.expectEqual(1, entries.length);
      testing.expectEqual(72, entries[0].encodedBodySize);
      testing.expectEqual(1745, entries[0].decodedBodySize);
      testing.expectEqual(372, entries[0].transferSize);
      // The script really did run, so the body that got decoded is the body the
      // decoded size counts.
      testing.expectEqual(1, window.__compressed);
    });
  </script>

  <script id=resource_entry_quotes_the_response_labels type=module>
    const state = await testing.async();
    // `contentType` is the MIME essence -- the parameters dropped and the rest
    // lowercased -- and `contentEncoding` is the Content-Encoding header as it
    // was sent. Both measured on Chrome 151
    // (tools/fingerprint/resource-timing-response-fields.mjs): a sheet served
    // as `text/CSS; charset=UTF-8` filed `text/css`, and a br-encoded script
    // filed `br`.
    //
    // Answering "" for both is what this engine did, and it is a claim no
    // server makes: a response with a body has a type, and the whole point of
    // the Content-Encoding header is that something on the wire read it.
    const compressed = await waitForResourceEntry('/served/compressed.js');
    const sheet = await waitForResourceEntry('/styles/visibility.css');
    state.resolve();
    await state.done(() => {
      // Served as `text/javascript; charset=UTF-8`; the parameter is not part
      // of what the entry reports.
      testing.expectEqual('text/javascript', compressed[0].contentType);
      testing.expectEqual('gzip', compressed[0].contentEncoding);
      // No Content-Encoding on the sheet, so the field stays empty -- an empty
      // string here means "not encoded", which is true of this one.
      testing.expectEqual('text/css', sheet[0].contentType);
      testing.expectEqual('', sheet[0].contentEncoding);
    });
  </script>

  <script id=resource_entry_walks_the_connection type=module>
    const state = await testing.async();
    // The nine connection milestones were all zero, which reads as a load that
    // resolved no name, opened no socket and sent no request -- while
    // responseEnd said bytes arrived. Chrome 151 over plain HTTP fills seven of
    // the nine and leaves exactly two at zero: secureConnectionStart, because
    // there was no TLS handshake, and firstInterimResponseStart, because there
    // was no 1xx (measured, resource-timing-response-fields.mjs).
    const entries = await waitForResourceEntry('/served/compressed.js');
    state.resolve();
    await state.done(() => {
      const e = entries[0];
      // Not an assertion about wall-clock values -- those cannot be predicted
      // -- but about the order a load happens in, which is the part a reader
      // of the entry can check.
      const walk = [
        e.fetchStart, e.domainLookupStart, e.domainLookupEnd,
        e.connectStart, e.connectEnd, e.requestStart,
        e.responseStart, e.responseEnd,
      ];
      for (let i = 1; i < walk.length; i++) {
        testing.expectEqual(true, walk[i] >= walk[i - 1]);
      }
      // A round trip happened, so the response cannot have started at the
      // instant the fetch did. This is what fails when the milestones are
      // stamped with fetchStart instead of measured.
      testing.expectEqual(true, e.responseStart > e.fetchStart);
      // Chrome reports the same instant for both: this engine reads no
      // interim responses, so the final headers are the only headers.
      testing.expectEqual(e.responseStart, e.finalResponseHeadersStart);
      // The two Chrome leaves at zero over plain HTTP.
      testing.expectEqual(0, e.secureConnectionStart);
      testing.expectEqual(0, e.firstInterimResponseStart);
    });
  </script>

  <script id=resource_entries_are_one_buffer type=module>
    const state = await testing.async();
    await waitForResourceEntry('/src/browser/tests/performance_resource.png');
    const all = performance.getEntriesByType('resource');
    state.resolve();
    await state.done(() => {
      // getEntriesByType has to agree with getEntriesByName about all of them:
      // one buffer, not a per-initiator list that only looks right one lookup
      // at a time.
      for (const path of ['/src/browser/tests/testing.js', '/styles/visibility.css', '/src/browser/tests/performance_resource.png']) {
        testing.expectEqual(true, all.some((e) => e.name === testing.ORIGIN + path));
      }
      testing.expectEqual(true, all.every((e) => e.entryType === 'resource'));
    });
  </script>
</body>
