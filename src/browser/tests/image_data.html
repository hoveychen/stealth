<!DOCTYPE html>
<script src="testing.js"></script>

<script id=constructor-basic>
  {
    const img = new ImageData(10, 20);
    testing.expectEqual(10, img.width);
    testing.expectEqual(20, img.height);
    testing.expectEqual("srgb", img.colorSpace);
    testing.expectEqual("rgba-unorm8", img.pixelFormat);
  }
</script>

<script id=data-property>
  {
    const img = new ImageData(2, 3);
    const data = img.data;
    testing.expectEqual(true, data instanceof Uint8ClampedArray);
    // 2 * 3 * 4 (RGBA) = 24 bytes
    testing.expectEqual(24, data.length);
  }
</script>

<script id=data-initialized-to-zero>
  {
    const img = new ImageData(2, 2);
    const data = img.data;
    for (let i = 0; i < data.length; i++) {
      testing.expectEqual(0, data[i]);
    }
  }
</script>

<script id=data-mutability>
  {
    const img = new ImageData(1, 1);
    const data = img.data;
    // Set pixel to red (RGBA)
    data[0] = 255;
    data[1] = 0;
    data[2] = 0;
    data[3] = 255;

    // Read back through the same accessor
    const data2 = img.data;
    testing.expectEqual(255, data2[0]);
    testing.expectEqual(0, data2[1]);
    testing.expectEqual(0, data2[2]);
    testing.expectEqual(255, data2[3]);
  }
</script>

<script id=constructor-with-settings>
  {
    const img = new ImageData(5, 5, { colorSpace: "srgb" });
    testing.expectEqual(5, img.width);
    testing.expectEqual(5, img.height);
    testing.expectEqual("srgb", img.colorSpace);
  }
</script>

</script>

<script id=single-pixel>
  {
    const img = new ImageData(1, 1);
    testing.expectEqual(4, img.data.length);
    testing.expectEqual(1, img.width);
    testing.expectEqual(1, img.height);
  }
</script>

<script id=structured-clone>
  {
    const img = new ImageData(2, 2);
    img.data[0] = 42;
    const clone = structuredClone(img);
    testing.expectEqual(2, clone.width);
    testing.expectEqual(2, clone.height);
    testing.expectEqual(42, clone.data[0]);
    clone.data[0] = 7;
    testing.expectEqual(42, img.data[0]);
  }
</script>

<script id=too-large>
  testing.expectError("IndexSizeError", () => new ImageData(2_147_483_648, 2_147_483_648));
</script>

<script id=settings-dictionary>
  {
    // `ImageDataSettings`, the dictionary this constructor shares with
    // createImageData and getImageData. Readings:
    // results/canvas-image-data-settings{,-2}.chrome.json.
    const threw = (f) => { try { f(); return null; } catch (e) { return `${e.name}: ${e.message}`; } };

    testing.expectEqual("display-p3", new ImageData(1, 1, { colorSpace: "display-p3" }).colorSpace);
    testing.expectEqual("rgba-unorm8", new ImageData(1, 1, { colorSpace: "display-p3" }).pixelFormat);
    testing.expectEqual("srgb", new ImageData(1, 1, { colorSpace: undefined }).colorSpace);
    testing.expectEqual("rgba-float16", new ImageData(1, 1, { pixelFormat: "rgba-float16" }).pixelFormat);

    // Two gates, as on getContext's own dictionary: a name outside the IDL enum
    // is a conversion failure that names the property, while one inside it that
    // no ImageData can be in names no property and says "of the type".
    testing.expectEqual(
      "TypeError: Failed to construct 'ImageData': Failed to read the 'colorSpace' property " +
        "from 'ImageDataSettings': The provided value 'nonesuch' is not a valid enum value of " +
        "type PredefinedColorSpace.",
      threw(() => new ImageData(1, 1, { colorSpace: "nonesuch" })));
    testing.expectEqual(
      "TypeError: Failed to construct 'ImageData': Failed to read the 'colorSpace' property " +
        "from 'ImageDataSettings': The provided value 'null' is not a valid enum value of " +
        "type PredefinedColorSpace.",
      threw(() => new ImageData(1, 1, { colorSpace: null })));
    testing.expectEqual(
      "TypeError: Failed to construct 'ImageData': The provided value 'rec2020' is not a valid " +
        "enum value of the type PredefinedColorSpace.",
      threw(() => new ImageData(1, 1, { colorSpace: "rec2020" })));
    // A member of PredefinedColorSpace no other colour API here takes, so it is
    // the one most easily given the wrong refusal of the two.
    testing.expectEqual(
      "TypeError: Failed to construct 'ImageData': The provided value 'display-p3-linear' is " +
        "not a valid enum value of the type PredefinedColorSpace.",
      threw(() => new ImageData(1, 1, { colorSpace: "display-p3-linear" })));
    testing.expectEqual(
      "TypeError: Failed to construct 'ImageData': Failed to read the 'pixelFormat' property " +
        "from 'ImageDataSettings': The provided value 'rgba-uint8' is not a valid enum value of " +
        "type ImageDataPixelFormat.",
      threw(() => new ImageData(1, 1, { pixelFormat: "rgba-uint8" })));

    // A non-object argument *is* refused here, which is where this dictionary
    // parts company with getContext's — that one takes the defaults.
    testing.expectEqual(
      "TypeError: Failed to construct 'ImageData': The provided value is not of type 'ImageDataSettings'.",
      threw(() => new ImageData(1, 1, "nope")));
    testing.expectEqual(
      "TypeError: Failed to construct 'ImageData': The provided value is not of type 'ImageDataSettings'.",
      threw(() => new ImageData(1, 1, 42)));
    // An array and a null are objects enough to be read as an empty dictionary.
    testing.expectEqual("srgb", new ImageData(1, 1, []).colorSpace);
    testing.expectEqual("srgb", new ImageData(1, 1, null).colorSpace);
  }
</script>

<script id=settings-members-live-on-the-prototype>
  {
    // Both are prototype getters, not own values: a page reads the descriptor
    // without ever building an ImageData.
    const colorSpace = Object.getOwnPropertyDescriptor(ImageData.prototype, "colorSpace");
    testing.expectEqual(true, typeof colorSpace.get === "function");
    testing.expectEqual(true, colorSpace.enumerable);
    testing.expectEqual(true, colorSpace.value === undefined);
    const pixelFormat = Object.getOwnPropertyDescriptor(ImageData.prototype, "pixelFormat");
    testing.expectEqual(true, typeof pixelFormat.get === "function");
    testing.expectEqual(
      true, Object.getOwnPropertyDescriptor(new ImageData(1, 1), "colorSpace") === undefined);
  }
</script>
