<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=visual_viewport>
  const vp = window.visualViewport;
  testing.expectEqual(vp, window.visualViewport);
  testing.expectEqual(0, vp.offsetLeft);
  testing.expectEqual(0, vp.offsetTop);
  testing.expectEqual(0, vp.pageLeft);
  testing.expectEqual(0, vp.pageTop);
  testing.expectEqual(1920, vp.width);
  testing.expectEqual(1080, vp.height);
  testing.expectEqual(1.0, vp.scale);
</script>

<!-- The three event-handler properties a viewport carries. Nothing resizes or
     scrolls here, so they never run, but a page that installs one and reads it
     back gets its function -- which is what the property is for. -->
<script id="visual_viewport_handlers">
{
  testing.expectEqual(null, visualViewport.onresize);
  testing.expectEqual(null, visualViewport.onscroll);
  testing.expectEqual(null, visualViewport.onscrollend);

  const handler = () => {};
  visualViewport.onresize = handler;
  testing.expectEqual(handler, visualViewport.onresize);
  visualViewport.onscrollend = handler;
  testing.expectEqual(handler, visualViewport.onscrollend);
  visualViewport.onresize = null;
  testing.expectEqual(null, visualViewport.onresize);
}
</script>
