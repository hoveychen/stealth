<!DOCTYPE html>
<script src="../testing.js"></script>

<!--
  A document served with COOP: same-origin and COEP: require-corp is
  cross-origin isolated, and says so.

  This is not a hypothetical pairing. The Cloudflare managed-challenge
  interstitial is served with both, and every realm of it -- the interstitial,
  its about:blank and about:srcdoc children, and the Turnstile widget document
  -- answers `crossOriginIsolated: true` on a reference Chrome 151, while the
  ordinary page that replaces it once the challenge clears answers false
  (measured, `tools/fingerprint/results/fopt-e3-oracle.json`). Answering false
  on a page that carries the headers is a one-property disagreement with the
  browser this engine claims to be, on exactly the page that is looking.

  The runner serves any test file whose name starts with
  `cross_origin_isolated` with those two headers; see `testHTTPHandler`.
-->

<script id="isolated_document">
  testing.expectEqual(true, window.crossOriginIsolated);
</script>

<script id="own_property_of_window">
  // Still an own accessor of the global rather than something inherited from
  // Window.prototype -- the shape must not change with the answer.
  testing.expectEqual(true, Object.prototype.hasOwnProperty.call(window, 'crossOriginIsolated'));
  const d = Object.getOwnPropertyDescriptor(window, 'crossOriginIsolated');
  testing.expectEqual('function', typeof d.get);
  testing.expectEqual(undefined, d.set);
</script>

<script id="child_frame_inherits">
  // A same-origin child of an isolated document is isolated too: it is served
  // from the same route, so it carries the headers itself, and an about:blank
  // child carries none and takes its parent's answer.
  const f = document.createElement('iframe');
  document.documentElement.appendChild(f);
  testing.expectEqual(true, f.contentWindow.crossOriginIsolated);
</script>

<script id="shared_array_buffer_is_exposed">
  // The constructor is behind cross-origin isolation, and this document has
  // it. Measured on a headed Chrome 151: on a page with crossOriginIsolated
  // false, `typeof SharedArrayBuffer` is "undefined" and it is not a window
  // own property (that reading is asserted in window_extras.html); on an
  // isolated one it is a function, own and non-enumerable, exactly as the
  // other constructors are.
  testing.expectEqual('function', typeof SharedArrayBuffer);
  testing.expectEqual(true, Object.prototype.hasOwnProperty.call(window, 'SharedArrayBuffer'));
  const sab = new SharedArrayBuffer(8);
  testing.expectEqual(8, sab.byteLength);
</script>

<script id="now_resolution_is_the_isolated_clamp">
  // Chrome clamps performance.now() to 100us, and to 5us in a cross-origin
  // isolated realm. The oracle arm of the challenge reads 0.004999995 off the
  // interstitial while an ordinary page reads 0.1 -- so the clamp is a second
  // reading of the same isolation bit, and a page that answers
  // `crossOriginIsolated: true` with a 100us clock disagrees with itself.
  //
  // Same shape as `performance.html #nowResolution`, which asserts the coarse
  // clamp on an ordinary page. Loose bound in the same way: every advance is a
  // whole clamp step, so the smallest positive one is the step, and anything
  // under 0.05 is the fine clamp rather than the coarse one.
  {
    const t = [];
    for (let i = 0; i < 3000; i++) t.push(performance.now());
    const deltas = [];
    for (let i = 1; i < t.length; i++) {
      const d = t[i] - t[i - 1];
      if (d > 0) deltas.push(d);
    }
    testing.expectEqual(true, deltas.length > 0);
    testing.expectEqual(true, Math.min(...deltas) < 0.05);
  }
</script>
