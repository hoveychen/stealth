<!DOCTYPE html>
<script>
  // Same as frame1.html, through `window.top` instead of `window.parent`: a
  // denied read on a cross-origin window throws whichever handle reaches it.
  function probe(fn) {
    try { return { value: String(fn()) }; } catch (e) { return { threw: e.name }; }
  }
  window.top.postMessage({
    url: location.toString(),
    document: probe(() => typeof window.top.document),
    postMessage: probe(() => typeof window.top.postMessage),
  }, '*')
</script>
