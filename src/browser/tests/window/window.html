<!DOCTYPE html>
<script src="../testing.js"></script>
<body></body>

<script id=window>
  testing.expectEqual(window, globalThis);
  testing.expectEqual(window, self);
  testing.expectEqual(window, window.self);
  testing.expectEqual(null, window.opener);

  testing.expectEqual(1080, innerHeight);
  testing.expectEqual(1920, innerWidth);
</script>

<script id=window-box>
  // The window box and its position on screen. Scripts read these bare, so an
  // absent one is a ReferenceError that takes the whole caller down rather than
  // producing a suspicious value — which is how CreepJS's screen panel died.
  testing.expectEqual(1920, window.outerWidth);
  testing.expectEqual(1167, window.outerHeight);

  // A window has a browser around the viewport -- a tab strip, an omnibox, a
  // bookmarks bar -- and `outerHeight - innerHeight` is how tall all of it is.
  // 87 CSS pixels, measured on Chrome 151: headed on macOS, and --headless=new
  // at four different --window-size values, which all answered the same 87. The
  // width of the browser is zero, so outerWidth and innerWidth agree.
  // Answering 0 to the height says the viewport is the whole window, which no
  // browser reports and Kasada reads nine times on x-hyatt.
  testing.expectEqual(0, outerWidth - innerWidth);
  testing.expectEqual(87, outerHeight - innerHeight);

  // Where the window sits: flush left, just below the menu bar. That is where
  // headed Chrome 151 was measured sitting on macOS (0, 33), and a window at
  // the very origin cannot exist on a platform that has a menu bar.
  testing.expectEqual(0, window.screenX);
  testing.expectEqual(33, window.screenY);

  // screenLeft/screenTop are the older aliases of screenX/screenY.
  testing.expectEqual(window.screenX, window.screenLeft);
  testing.expectEqual(window.screenY, window.screenTop);

  // The window is maximised on the display it claims to be on, which is the
  // arrangement headed Chrome was measured in: it starts at the usable area's
  // origin and fills it exactly. Every one of these is a cross-check a bot
  // check can make between two readings it takes anyway -- x-hyatt's reads
  // availHeight and availWidth alongside the four window numbers.
  testing.expectEqual(screen.availLeft, window.screenX);
  testing.expectEqual(screen.availTop, window.screenY);
  testing.expectEqual(screen.availWidth, window.outerWidth);
  testing.expectEqual(screen.availHeight, window.outerHeight);
  testing.expectEqual(screen.height, window.screenY + window.outerHeight);
  testing.expectEqual(screen.width, window.screenX + window.outerWidth);
</script>

<script id=load>
  let call1 = 0;
  let call2 = 0;
  window.onload = function(e) {
    testing.expectEqual(false, true); // should not be called
  }

  const fn = function(e) {
    call1 += 1;
    testing.expectEqual(window, this);
    testing.expectEqual(document, e.target);
    testing.expectEqual(window, e.currentTarget);
  };
  window.onload = fn;
  testing.expectEqual(fn, window.onload);

  window.addEventListener('load', (e) => {
    call2 += 1;
    testing.expectEqual(window, this);
    testing.expectEqual(document, e.target);
    testing.expectEqual(window, e.currentTarget);
  });

  window.addEventListener('load', function(e) {
    call2 += 1;
    testing.expectEqual(window, this);
    testing.expectEqual(document, e.target);
    testing.expectEqual(window, e.currentTarget);
  });

  // noop
  window.removeEventListener('load', fn);
  testing.onload(() => {
    testing.expectEqual(1, call1);
    testing.expectEqual(2, call2);
  });
</script>

<script id=btoa>
  testing.expectEqual('SGVsbG8gV29ybGQh', btoa('Hello World!'));
  testing.expectEqual('', btoa(''));
  testing.expectEqual('IA==', btoa(' '));
  testing.expectEqual('YQ==', btoa('a'));

<script id=atob>
  testing.expectEqual('Hello World!', atob('SGVsbG8gV29ybGQh'));
  testing.expectEqual('', atob(''));

  // atob must trim input
  testing.expectEqual('', atob(' '));
  testing.expectEqual(' ', atob('IA=='));
  testing.expectEqual(' ', atob(' IA=='));
  testing.expectEqual(' ', atob('IA== '));

  testing.expectEqual('a', atob('YQ=='));
  testing.expectEqual('ab', atob('YWI='));
  testing.expectEqual('abc', atob('YWJj'));
  testing.expectEqual('0123456789', atob('MDEyMzQ1Njc4OQ=='));
  testing.expectEqual('The quick brown fox jumps over the lazy dog', atob('VGhlIHF1aWNrIGJyb3duIGZveCBqdW1wcyBvdmVyIHRoZSBsYXp5IGRvZw=='));

  // atob must accept unpadded base64 (forgiving-base64 decode per HTML spec)
  testing.expectEqual('a', atob('YQ'));      // 2 chars, len%4==2, needs '=='
  testing.expectEqual('ab', atob('YWI'));    // 3 chars, len%4==3, needs '='
  testing.expectEqual('ceil', atob('Y2VpbA'));  // 6 chars, len%4==2, needs '=='

  // length % 4 == 1 must still throw
  testing.expectError('InvalidCharacterError', () => {
    atob('Y');
  });
</script>

<script id=base64_error_message>
  // The exception *text* is a reading too: a page gets `e.message` with plain
  // property access. Blink names the operation and the interface it was called
  // on, so the generic DOMException description is a tell. Measured against
  // Chrome 151: atob has two sentences, one for "not base64" and a separate one
  // for "not even a binary string", and they must not be collapsed into one.
  const msg = (fn) => { try { fn(); return 'no throw'; } catch (e) { return `${e.name}: ${e.message}`; } };

  const not_encoded = "InvalidCharacterError: Failed to execute 'atob' on 'Window': The string to be decoded is not correctly encoded.";
  testing.expectEqual(not_encoded, msg(() => atob('a')));       // len % 4 == 1
  testing.expectEqual(not_encoded, msg(() => atob('a===')));    // misplaced padding
  testing.expectEqual(not_encoded, msg(() => atob('!!!!')));    // outside the alphabet

  // Above Latin-1 is a different sentence: the read fails before the decode.
  // 'Ł' matters on its own -- its low byte is 'A', so an engine that truncates
  // instead of rejecting decodes it silently.
  const not_latin1 = "InvalidCharacterError: Failed to execute 'atob' on 'Window': The string to be decoded contains characters outside of the Latin1 range.";
  testing.expectEqual(not_latin1, msg(() => atob('Ā')));
  testing.expectEqual(not_latin1, msg(() => atob('aŁb')));

  testing.expectEqual(
    "InvalidCharacterError: Failed to execute 'btoa' on 'Window': The string to be encoded contains characters outside of the Latin1 range.",
    msg(() => btoa('Ā')));

  // Non-strings are coerced, not rejected (Chrome 151: btoa(123) === 'MTIz').
  testing.expectEqual('MTIz', btoa(123));
  testing.expectEqual('bnVsbA==', btoa(null));
  testing.expectEqual('W29iamVjdCBPYmplY3Rd', btoa({}));
</script>

<script id=atob_binary_string>
  // atob must produce a "binary string": each output byte (0-255) becomes
  // a JS string character whose codepoint equals that byte. High-bit bytes
  // must NOT be folded through UTF-8 (which would replace them with U+FFFD).

  // /w== decodes to a single 0xFF byte.
  const ff = atob('/w==');
  testing.expectEqual(1, ff.length);
  testing.expectEqual(0xff, ff.charCodeAt(0));

  // 0x00..0x07
  const lo = atob('AAECAwQFBgc=');
  testing.expectEqual(8, lo.length);
  for (let i = 0; i < 8; i++) testing.expectEqual(i, lo.charCodeAt(i));

  // 0xFC 0xFD 0xFE 0xFF — the bytes that previously turned into U+FFFD.
  const hi = atob('/P3+/w==');
  testing.expectEqual(4, hi.length);
  testing.expectEqual(0xfc, hi.charCodeAt(0));
  testing.expectEqual(0xfd, hi.charCodeAt(1));
  testing.expectEqual(0xfe, hi.charCodeAt(2));
  testing.expectEqual(0xff, hi.charCodeAt(3));

  // Boundary at 0x7F/0x80.
  const boundary = atob('f4A=');
  testing.expectEqual(2, boundary.length);
  testing.expectEqual(0x7f, boundary.charCodeAt(0));
  testing.expectEqual(0x80, boundary.charCodeAt(1));

  // Ensure the result is usable as input to a Uint8Array, the way recaptcha
  // and many libraries decode binary blobs.
  const bytes = new Uint8Array(hi.length);
  for (let i = 0; i < hi.length; i++) bytes[i] = hi.charCodeAt(i);
  testing.expectEqual(0xfc, bytes[0]);
  testing.expectEqual(0xfd, bytes[1]);
  testing.expectEqual(0xfe, bytes[2]);
  testing.expectEqual(0xff, bytes[3]);
</script>

<script id=btoa_binary_string>
  // btoa must accept a "binary string": each char's codepoint (0-255) is one
  // input byte. Chars > 0xFF must throw InvalidCharacterError.

  testing.expectEqual('/w==', btoa(String.fromCharCode(0xff)));
  testing.expectEqual('/P3+/w==', btoa(String.fromCharCode(0xfc, 0xfd, 0xfe, 0xff)));
  testing.expectEqual('AAECAwQFBgc=', btoa(String.fromCharCode(0, 1, 2, 3, 4, 5, 6, 7)));
  testing.expectEqual('f4A=', btoa(String.fromCharCode(0x7f, 0x80)));

  // Codepoints above 0xFF are not representable as a binary string.
  testing.expectError('InvalidCharacterError', () => {
    btoa(String.fromCharCode(0x100));
  });
  testing.expectError('InvalidCharacterError', () => {
    btoa('a' + String.fromCharCode(0x1ff) + 'b');
  });
</script>

<script id=btoa_atob_binary_roundtrip>
  // Roundtrip every byte value 0..255.
  let all = '';
  for (let i = 0; i < 256; i++) all += String.fromCharCode(i);
  const encoded = btoa(all);
  const decoded = atob(encoded);
  testing.expectEqual(256, decoded.length);
  for (let i = 0; i < 256; i++) testing.expectEqual(i, decoded.charCodeAt(i));
</script>

<script id=structured_clone_error_message>
{
  // The DataCloneError carries the same `Failed to execute '<op>' on
  // '<Interface>': ` prefix as the rest, and V8's own detail after it already
  // matched. A host object Blink cannot clone is named by its interface rather
  // than described generically. Measured against Chrome 151.
  const msg = (fn) => { try { fn(); return 'no throw'; } catch (e) { return `${e.name}: ${e.message}`; } };
  const pre = "DataCloneError: Failed to execute 'structuredClone' on 'Window': ";

  testing.expectEqual(pre + '() => { } could not be cloned.', msg(() => structuredClone(() => { })));
  testing.expectEqual(pre + 'Symbol(s) could not be cloned.', msg(() => structuredClone(Symbol('s'))));
  testing.expectEqual(pre + 'HTMLDivElement object could not be cloned.',
    msg(() => structuredClone(document.createElement('div'))));
}
</script>

<script id=structuredClone>
  // Basic types
  testing.expectEqual(42, structuredClone(42));
  testing.expectEqual('hello', structuredClone('hello'));
  testing.expectEqual(true, structuredClone(true));
  testing.expectEqual(null, structuredClone(null));
  testing.expectEqual(undefined, structuredClone(undefined));

  // Objects and arrays (these work with JSON too, but verify they're cloned)
  const obj = { a: 1, b: { c: 2 } };
  const clonedObj = structuredClone(obj);
  testing.expectEqual(1, clonedObj.a);
  testing.expectEqual(2, clonedObj.b.c);
  clonedObj.b.c = 999;
  testing.expectEqual(2, obj.b.c); // original unchanged

  const arr = [1, [2, 3]];
  const clonedArr = structuredClone(arr);
  testing.expectEqual(1, clonedArr[0]);
  testing.expectEqual(2, clonedArr[1][0]);
  clonedArr[1][0] = 999;
  testing.expectEqual(2, arr[1][0]); // original unchanged

  // Date - JSON would stringify to ISO string
  const date = new Date('2024-01-15T12:30:00Z');
  const clonedDate = structuredClone(date);
  testing.expectEqual(true, clonedDate instanceof Date);
  testing.expectEqual(date.getTime(), clonedDate.getTime());
  testing.expectEqual(date.toISOString(), clonedDate.toISOString());

  // RegExp - JSON would stringify to {}
  const regex = /test\d+/gi;
  const clonedRegex = structuredClone(regex);
  testing.expectEqual(true, clonedRegex instanceof RegExp);
  testing.expectEqual(regex.source, clonedRegex.source);
  testing.expectEqual(regex.flags, clonedRegex.flags);
  testing.expectEqual(true, clonedRegex.test('test123'));

  // Map - JSON can't handle
  const map = new Map([['a', 1], ['b', 2]]);
  const clonedMap = structuredClone(map);
  testing.expectEqual(true, clonedMap instanceof Map);
  testing.expectEqual(2, clonedMap.size);
  testing.expectEqual(1, clonedMap.get('a'));
  testing.expectEqual(2, clonedMap.get('b'));

  // Set - JSON can't handle
  const set = new Set([1, 2, 3]);
  const clonedSet = structuredClone(set);
  testing.expectEqual(true, clonedSet instanceof Set);
  testing.expectEqual(3, clonedSet.size);
  testing.expectEqual(true, clonedSet.has(1));
  testing.expectEqual(true, clonedSet.has(2));
  testing.expectEqual(true, clonedSet.has(3));

  // ArrayBuffer
  const buffer = new ArrayBuffer(8);
  const view = new Uint8Array(buffer);
  view[0] = 42;
  view[7] = 99;
  const clonedBuffer = structuredClone(buffer);
  testing.expectEqual(true, clonedBuffer instanceof ArrayBuffer);
  testing.expectEqual(8, clonedBuffer.byteLength);
  const clonedView = new Uint8Array(clonedBuffer);
  testing.expectEqual(42, clonedView[0]);
  testing.expectEqual(99, clonedView[7]);

  // TypedArray
  const typedArr = new Uint32Array([100, 200, 300]);
  const clonedTypedArr = structuredClone(typedArr);
  testing.expectEqual(true, clonedTypedArr instanceof Uint32Array);
  testing.expectEqual(3, clonedTypedArr.length);
  testing.expectEqual(100, clonedTypedArr[0]);
  testing.expectEqual(200, clonedTypedArr[1]);
  testing.expectEqual(300, clonedTypedArr[2]);

  // Special number values - JSON can't preserve these
  testing.expectEqual(true, Number.isNaN(structuredClone(NaN)));
  testing.expectEqual(Infinity, structuredClone(Infinity));
  testing.expectEqual(-Infinity, structuredClone(-Infinity));

  // Object with undefined value - JSON would omit it
  const objWithUndef = { a: 1, b: undefined, c: 3 };
  const clonedObjWithUndef = structuredClone(objWithUndef);
  testing.expectEqual(1, clonedObjWithUndef.a);
  testing.expectEqual(undefined, clonedObjWithUndef.b);
  testing.expectEqual(true, 'b' in clonedObjWithUndef);
  testing.expectEqual(3, clonedObjWithUndef.c);

  // Error objects
  const error = new Error('test error');
  const clonedError = structuredClone(error);
  testing.expectEqual(true, clonedError instanceof Error);
  testing.expectEqual('test error', clonedError.message);

  // TypeError
  const typeError = new TypeError('type error');
  const clonedTypeError = structuredClone(typeError);
  testing.expectEqual(true, clonedTypeError instanceof TypeError);
  testing.expectEqual('type error', clonedTypeError.message);

  // BigInt
  const bigInt = BigInt('9007199254740993');
  const clonedBigInt = structuredClone(bigInt);
  testing.expectEqual(bigInt, clonedBigInt);

  // Circular references ARE supported by structuredClone (unlike JSON)
  const circular = { a: 1 };
  circular.self = circular;
  const clonedCircular = structuredClone(circular);
  testing.expectEqual(1, clonedCircular.a);
  testing.expectEqual(clonedCircular, clonedCircular.self); // circular ref preserved

  // Functions cannot be cloned - should throw
  {
    let threw = false;
    try {
      structuredClone(() => {});
    } catch (err) {
      threw = true;
      // Just verify an error was thrown - V8's message format may vary
    }
    testing.expectEqual(true, threw);
  }

  // Symbols cannot be cloned - should throw
  {
    let threw = false;
    try {
      structuredClone(Symbol('test'));
    } catch (err) {
      threw = true;
    }
    testing.expectEqual(true, threw);
  }

  // Host objects (DOM elements) cannot be cloned - should throw, not crash
  {
    let threw = false;
    try {
      structuredClone(document.body);
    } catch (err) {
      threw = true;
    }
    testing.expectEqual(true, threw);
  }

  // Objects containing host objects cannot be cloned - should throw, not crash
  {
    let threw = false;
    try {
      structuredClone({ element: document.body });
    } catch (err) {
      threw = true;
    }
    testing.expectEqual(true, threw);
  }
</script>

<script id=cached_getter_wrong_this>
  // Test that extracting a cached property getter and calling it with wrong `this`
  // doesn't crash (V8 internal field out of bounds). V8's Signature validation
  // should throw "Illegal invocation" for wrong receiver types.
  // On the global, not on Window.prototype: [Global] moves the attribute onto
  // the global object, which is where Chrome's descriptor lives too.
  const documentGetter = Object.getOwnPropertyDescriptor(window, 'document').get;

  // Verify we get an error with wrong this values
  let errorCount = 0;
  const testValues = [{}, null, undefined, 42, 'string', [], () => {}];
  for (const val of testValues) {
    try {
      documentGetter.call(val);
    } catch (e) {
      if (e.message.includes('Illegal invocation')) {
        errorCount++;
      }
    }
  }
  // At least some should throw (null/undefined/primitives get coerced in sloppy mode)
  testing.expectEqual(true, errorCount > 0);

  // Calling with correct this should still work
  testing.expectEqual(document, documentGetter.call(window));
</script>

<script id=unforgeable_self_references>
  // Web IDL [LegacyUnforgeable]. Chrome makes `window`, `top`, `location` and
  // `document` non-configurable and leaves `self`, `parent` and `frameElement`
  // replaceable; a page that walks the descriptors sees which is which, and a
  // getter it can redefine is a getter it can watch.
  {
    const kind = (k) => {
      const d = Object.getOwnPropertyDescriptor(window, k);
      return [typeof d.get, typeof d.set, d.enumerable, d.configurable].join(' ');
    };
    testing.expectEqual('function undefined true false', kind('window'));
    testing.expectEqual('function undefined true false', kind('top'));
    testing.expectEqual('function function true false', kind('location'));
    testing.expectEqual('function undefined true false', kind('document'));

    testing.expectEqual('function function true true', kind('self'));
    testing.expectEqual('function function true true', kind('parent'));
    testing.expectEqual('function undefined true true', kind('frameElement'));
  }
</script>

<script id=global_flattening_own_props>
  // WebIDL [Global] flattening: members of the Window interface must be OWN
  // properties of the global object, not merely inherited via the prototype
  // chain. Otherwise a top-level `var navigator = ...` shadows the inherited
  // accessor with an own `undefined` (CreateGlobalVarBinding only skips when
  // the name is already own) -- that is the espn.com breakage the next block
  // reproduces.
  //
  // EventTarget's methods are the exception, and it is measured rather than
  // reasoned: on Chrome 151 `Object.getOwnPropertyNames(window)` carries
  // document / location / navigator and every other Window member, and does
  // NOT carry addEventListener, removeEventListener or dispatchEvent. Those
  // stay on EventTarget.prototype, which the global inherits through
  // Window.prototype -- so calling them on the global still works, and a
  // detector reading the global's own properties sees what Chrome shows.
  const hop = Object.prototype.hasOwnProperty;
  testing.expectEqual(true, hop.call(globalThis, 'navigator'));   // Window attribute
  testing.expectEqual(true, hop.call(globalThis, 'document'));    // Window attribute
  testing.expectEqual(true, hop.call(globalThis, 'location'));    // Window attribute
  for (const inherited of ['addEventListener', 'removeEventListener', 'dispatchEvent']) {
    testing.expectEqual(false, hop.call(globalThis, inherited), { desc: inherited + ' is not own' });
    testing.expectEqual('function', typeof globalThis[inherited], { desc: inherited + ' still callable' });
  }

  // They still work when invoked on the global.
  testing.expectEqual(document, globalThis.document);
  testing.expectEqual(navigator, globalThis.navigator);
</script>

<script id=global_flattening_var_navigator>
  // Reproduces the espn.com breakage: a top-level (sloppy-mode) classic script
  // doing `var navigator = window.navigator || {}`. With flattening, the `var`
  // declaration is a no-op (navigator is already own) and the assignment to the
  // read-only accessor silently fails, so navigator is preserved instead of
  // being clobbered with `{}`.
  var navigator = window.navigator || {};
  testing.expectEqual(true, navigator === window.navigator);
  testing.expectEqual(true, typeof navigator.userAgent === 'string');
  testing.expectEqual(true, navigator.userAgent.length > 0);
</script>

<script id=global_member_home>
  // The other half of [Global]: a member that becomes an own property of the
  // global must *leave* the interface prototype object. Web IDL keeps only the
  // constants there, so the whole of Window.prototype is three names, and the
  // global's [[Prototype]] is Window.prototype itself -- no extra link.
  //
  // Measured on headless Chrome 151 (expr-window-proto-shape):
  //   Object.getPrototypeOf(window) === Window.prototype  -> true
  //   Object.getOwnPropertyNames(Window.prototype)        -> PERSISTENT, TEMPORARY, constructor
  //   Window.prototype.hasOwnProperty('postMessage')      -> false
  //   window.constructor === Window                       -> true
  const hop2 = Object.prototype.hasOwnProperty;

  testing.expectEqual(true, Object.getPrototypeOf(window) === Window.prototype);
  testing.expectEqual(true, window.constructor === Window);
  testing.expectEqual('PERSISTENT,TEMPORARY,constructor',
    Object.getOwnPropertyNames(Window.prototype).sort().join(','));

  // Attributes and operations live on the global, not above it.
  for (const member of ['postMessage', 'document', 'location', 'navigator', 'alert', 'atob']) {
    testing.expectEqual(true, hop2.call(window, member), { desc: member + ' is own on the global' });
    testing.expectEqual(false, hop2.call(Window.prototype, member), { desc: member + ' is not on Window.prototype' });
  }

  // The brand stays where Web IDL puts it: on the interface prototype object,
  // which is why `window` owns no symbol of its own.
  testing.expectEqual('', Object.getOwnPropertySymbols(window).map(String).join(','));
  testing.expectEqual('Symbol(Symbol.toStringTag)',
    Object.getOwnPropertySymbols(Window.prototype).map(String).join(','));
  testing.expectEqual('[object Window]', Object.prototype.toString.call(window));

  // The constants Web IDL leaves behind, with the descriptor Chrome reports.
  for (const [name, value] of [['TEMPORARY', 0], ['PERSISTENT', 1]]) {
    const d = Object.getOwnPropertyDescriptor(Window.prototype, name);
    testing.expectEqual(value, d.value, { desc: name + ' value' });
    testing.expectEqual(false, d.writable, { desc: name + ' writable' });
    testing.expectEqual(true, d.enumerable, { desc: name + ' enumerable' });
    testing.expectEqual(false, d.configurable, { desc: name + ' configurable' });
  }
</script>

<script id=named_properties_object>
  // Above Window.prototype sits the nameless object Web IDL calls the named
  // properties object -- the one that answers window.someElementId in the
  // spec's telling. It is not EventTarget.prototype, and a script walking the
  // chain counts four links from `window`, not three.
  //
  // Measured on headless Chrome 151 (expr-window-properties-object):
  //   own names             []
  //   own symbols           [Symbol(Symbol.toStringTag)] -> 'WindowProperties'
  //   constructor           absent
  //   its own prototype     EventTarget.prototype
  const named_properties = Object.getPrototypeOf(Window.prototype);

  testing.expectEqual(false, named_properties === EventTarget.prototype);
  testing.expectEqual('', Object.getOwnPropertyNames(named_properties).join(','));
  testing.expectEqual('Symbol(Symbol.toStringTag)',
    Object.getOwnPropertySymbols(named_properties).map(String).join(','));
  testing.expectEqual('[object WindowProperties]',
    Object.prototype.toString.call(named_properties));
  const brand = Object.getOwnPropertyDescriptor(named_properties, Symbol.toStringTag);
  testing.expectEqual(false, brand.writable);
  testing.expectEqual(false, brand.enumerable);
  testing.expectEqual(true, brand.configurable);
  testing.expectEqual(true, Object.getPrototypeOf(named_properties) === EventTarget.prototype);

  let links = 0;
  for (let o = Object.getPrototypeOf(window); o; o = Object.getPrototypeOf(o)) links++;
  testing.expectEqual(4, links);

  // Nothing names it: the interface objects skip the link, and EventTarget's
  // methods still reach the global through it.
  testing.expectEqual(true, Object.getPrototypeOf(Window) === EventTarget);
  testing.expectEqual(true, window instanceof EventTarget);
  testing.expectEqual(true, window instanceof Window);
  {
    let hits = 0;
    const onx = () => hits++;
    window.addEventListener('lp-named-properties', onx);
    window.dispatchEvent(new Event('lp-named-properties'));
    window.removeEventListener('lp-named-properties', onx);
    testing.expectEqual(1, hits);
  }
</script>
