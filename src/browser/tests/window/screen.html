<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=screen>
  let screen = window.screen;
  if (testing.IS_TEST_RUNNER) {
    // The display is the viewport plus everything that is not the viewport:
    // the 87px of browser above the page and the 33px menu bar above that.
    // 1920x1200 is a display a Mac actually has; a display exactly as tall as
    // the viewport is one that leaves no room for the window around it.
    testing.expectEqual(1920, screen.width);
    testing.expectEqual(1200, screen.height);
  }

  let orientation = screen.orientation;
  testing.expectEqual(0, orientation.angle);
  testing.expectEqual('landscape-primary', orientation.type);

  // this shouldn't crash (it used to)
  screen.addEventListener('change', () => {});
</script>

<script id=screen_chrome_surface>
  // Measured on headed Chrome 150: availLeft/availTop say where the usable
  // area starts (the menu bar eats availTop pixels off the top), isExtended
  // says whether a second display is attached, and onchange is the handler
  // for the change event Screen already inherits the machinery for. All four
  // are on Chrome's Screen.prototype, and browserleaks.com/javascript prints
  // three of them by name — reading `undefined` back is the tell.
  testing.expectEqual(0, screen.availLeft);
  // 33, which is what a headed Chrome 151 on macOS answered -- the menu bar it
  // measures is the one the window manager draws, not a round number.
  testing.expectEqual(33, screen.availTop);
  testing.expectEqual(false, screen.isExtended);
  if (testing.IS_TEST_RUNNER) {
    // The menu bar is the whole difference between height and availHeight.
    testing.expectEqual(screen.height - screen.availHeight, screen.availTop);
    testing.expectEqual(1167, screen.availHeight);
    // The usable area is as wide as the display: the menu bar is the only
    // thing taken off it, and that comes off the top.
    testing.expectEqual(screen.width, screen.availWidth);
  }

  testing.expectEqual(null, screen.onchange);
  const onchange = () => {};
  screen.onchange = onchange;
  testing.expectEqual(onchange, screen.onchange);
  screen.onchange = null;
  testing.expectEqual(null, screen.onchange);

  // Chrome's own order, minus `constructor` — where the bridge puts that is
  // not ours to choose.
  testing.expectEqual(
    ['availWidth', 'availHeight', 'width', 'height', 'colorDepth', 'pixelDepth',
      'availLeft', 'availTop', 'orientation', 'onchange', 'isExtended'],
    Object.getOwnPropertyNames(Screen.prototype).filter((n) => n !== 'constructor'),
  );

  // Every one of them is an accessor on the prototype, not a data property, and
  // that is not cosmetic: a bot check reads a value it will not trust the
  // instance to answer honestly as
  // `Object.getOwnPropertyDescriptor(Screen.prototype, k).get.call(screen)`,
  // which throws "Cannot read properties of undefined (reading 'call')" against
  // a data property. Cloudflare's Turnstile fails on exactly that line
  // (measured, probe-descriptor-kind + the cf-scrapingcourse trace).
  for (const key of ['availWidth', 'availHeight', 'width', 'height', 'colorDepth',
    'pixelDepth', 'availLeft', 'availTop', 'orientation', 'isExtended']) {
    const d = Object.getOwnPropertyDescriptor(Screen.prototype, key);
    testing.expectEqual('function', typeof d.get, { desc: key + ' is a getter' });
    testing.expectEqual('undefined', typeof d.set, { desc: key + ' has no setter' });
    testing.expectEqual(true, d.enumerable, { desc: key + ' enumerable' });
    testing.expectEqual(true, d.configurable, { desc: key + ' configurable' });
    // And it answers the same value read that way as read off the instance.
    testing.expectEqual(screen[key], d.get.call(screen), { desc: key + ' via descriptor' });
  }
</script>

<script id=orientation>
  screen.orientation.addEventListener('change', () => {})
  // above shouldn't crash (it used to)
  testing.expectEqual(true, true);
</script>
