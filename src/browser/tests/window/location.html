<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=location>
  testing.expectEqual(testing.BASE_URL + 'window/location.html', window.location.href);
  testing.expectEqual(document.location, window.location);
</script>

<script id=location_hash>
  location.hash = "#abcdef";
  testing.expectEqual("#abcdef", location.hash);
  testing.expectEqual(testing.BASE_URL + 'window/location.html#abcdef', location.href);

  location.hash = "";
  testing.expectEqual("", location.hash);
  testing.expectEqual(testing.BASE_URL + 'window/location.html', location.href);

  location.hash = "xyzxyz";
  testing.expectEqual("#xyzxyz", location.hash);
  testing.expectEqual(testing.BASE_URL + 'window/location.html#xyzxyz', location.href);

  location.hash = "";
  testing.expectEqual("", location.hash);
  testing.expectEqual(testing.BASE_URL + 'window/location.html', location.href);
</script>

<script id=location_pathname_setter>
  testing.expectEqual('function', typeof Object.getOwnPropertyDescriptor(location, 'pathname').set);
</script>

<script id=location_search_setter>
  testing.expectEqual('function', typeof Object.getOwnPropertyDescriptor(location, 'search').set);
</script>

<script id=location_unforgeable_members>
  // Every member of Location is [LegacyUnforgeable]: it is a non-configurable
  // own property of the instance, and the interface prototype object holds
  // nothing but `constructor`. Measured on Chrome 151 (about:blank):
  //
  //   Object.getOwnPropertyNames(Location.prototype)  -> ['constructor']
  //   Object.getOwnPropertyDescriptor(location, 'href')
  //     -> { get, set, enumerable: true, configurable: false }
  //   Object.getOwnPropertyDescriptor(location, 'reload')
  //     -> { value, writable: false, enumerable: true, configurable: false }
  //
  // An engine that leaves them on the prototype is named by one line --
  // `Object.getOwnPropertyDescriptor(Location.prototype, 'href')` -- with no
  // value to compare and no noise to hide in. The operations matter as much as
  // the attributes: closing only the accessors moves the tell to
  // `Location.prototype.reload`, it does not shut it.
  const attributes = ['href', 'origin', 'protocol', 'host', 'hostname', 'port',
                      'pathname', 'search', 'hash', 'ancestorOrigins'];
  const operations = ['assign', 'replace', 'reload', 'toString'];
  const members = attributes.concat(operations);

  testing.expectEqual(['constructor'], Object.getOwnPropertyNames(Location.prototype));

  testing.expectEqual([], members.filter(function(name) {
    return Object.getOwnPropertyDescriptor(Location.prototype, name) !== undefined;
  }));

  testing.expectEqual([], members.filter(function(name) {
    return Object.prototype.hasOwnProperty.call(location, name) === false;
  }));

  testing.expectEqual([], members.filter(function(name) {
    const d = Object.getOwnPropertyDescriptor(location, name);
    return !d || d.configurable !== false || d.enumerable !== true;
  }));

  // The setter half has to survive the move: a read-only attribute keeps its
  // missing setter, a writable one keeps its setter.
  testing.expectEqual([], ['origin', 'ancestorOrigins'].filter(function(name) {
    return Object.getOwnPropertyDescriptor(location, name).set !== undefined;
  }));
  testing.expectEqual([], ['href', 'protocol', 'host', 'hostname', 'port', 'pathname',
                           'search', 'hash'].filter(function(name) {
    return typeof Object.getOwnPropertyDescriptor(location, name).set !== 'function';
  }));

  // An unforgeable operation is a non-writable data property, not an accessor.
  testing.expectEqual([], operations.filter(function(name) {
    const d = Object.getOwnPropertyDescriptor(location, name);
    return typeof d.value !== 'function' || d.writable !== false;
  }));

  // Non-configurable means the page cannot redefine or delete it.
  testing.expectEqual(false, delete location.href);
  testing.expectEqual('function', typeof location.reload);
</script>

<script id=location_creation_steps>
  // Two own properties that are not Web IDL members at all -- HTML's "create a
  // Location object" steps define them straight onto the object. Chrome 151:
  //
  //   Object.getOwnPropertySymbols(location) -> [Symbol(Symbol.toPrimitive)]
  //   ...descriptor -> { value: undefined, writable: false,
  //                      enumerable: false, configurable: false }
  //
  // An undefined @@toPrimitive is not the same as no @@toPrimitive: it stops
  // the coercion algorithm from walking up to an inherited one, so a Location
  // always stringifies through `toString`.
  testing.expectEqual(['Symbol(Symbol.toPrimitive)'], Object.getOwnPropertySymbols(location).map(String));

  const to_primitive = Object.getOwnPropertyDescriptor(location, Symbol.toPrimitive);
  testing.expectEqual(undefined, to_primitive.value);
  testing.expectEqual(false, to_primitive.writable);
  testing.expectEqual(false, to_primitive.enumerable);
  testing.expectEqual(false, to_primitive.configurable);
  testing.expectEqual(location.href, `${location}`);
  testing.expectEqual(location.href, String(location));

  // With every member unforgeable, the own-name list is itself a fingerprint.
  // Chrome's is neither IDL order nor alphabetical, and it opens with `valueOf`
  // -- the realm's %Object.prototype.valueOf%, which HTML's creation steps
  // define before any IDL member, which is why it sorts first.
  testing.expectEqual(
    ['valueOf', 'ancestorOrigins', 'href', 'origin', 'protocol', 'host', 'hostname',
     'port', 'pathname', 'search', 'hash', 'assign', 'reload', 'replace', 'toString'],
    Object.getOwnPropertyNames(location));
</script>

<script id=location_own_value_of>
{
  // The third own property HTML's "create a Location object" steps define, and
  // the only one whose value is a function the realm already has. Measured on
  // Chrome 151 (scratch/b80/remnants.mjs):
  //
  //   Object.getOwnPropertyDescriptor(location, 'valueOf')
  //     -> { value, writable: false, enumerable: false, configurable: false }
  //   location.valueOf === Object.prototype.valueOf   -> true
  //   location.valueOf()  === location                -> true
  //
  // Inheriting it from Object.prototype answers the read the same way and gets
  // `hasOwnProperty` wrong, which is one expression: an engine that inherits it
  // says false where every browser says true.
  const d = Object.getOwnPropertyDescriptor(location, 'valueOf');
  testing.expectEqual(
    ['own=true', 'data', 'w=false', 'e=false', 'c=false',
     'sameFunction=true', 'callsBackToLocation=true',
     'str=function valueOf() { [native code] }'].join('\n'),
    ['own=' + Object.prototype.hasOwnProperty.call(location, 'valueOf'),
     d === undefined ? 'absent' : ('get' in d && (d.get || d.set) ? 'accessor' : 'data'),
     'w=' + (d && d.writable), 'e=' + (d && d.enumerable), 'c=' + (d && d.configurable),
     'sameFunction=' + (location.valueOf === Object.prototype.valueOf),
     'callsBackToLocation=' + (location.valueOf() === location),
     'str=' + String(location.valueOf)].join('\n'));

  // Non-configurable and non-writable: the page can neither redefine nor
  // delete it, and an assignment is a silent no-op outside strict mode.
  testing.expectEqual(false, delete location.valueOf);
  location.valueOf = 1;
  testing.expectEqual(true, location.valueOf === Object.prototype.valueOf);

  // A second Location -- every fragment navigation makes one -- carries it too.
  const frame = document.createElement('iframe');
  document.documentElement.appendChild(frame);
  const inner = frame.contentWindow.location;
  testing.expectEqual(
    ['own=true', 'ownRealm=true', 'notOuterRealm=false'].join('\n'),
    ['own=' + Object.prototype.hasOwnProperty.call(inner, 'valueOf'),
     'ownRealm=' + (inner.valueOf === frame.contentWindow.Object.prototype.valueOf),
     'notOuterRealm=' + (inner.valueOf === Object.prototype.valueOf)].join('\n'));
  frame.remove();
}
</script>

<div id="sec1"></div>
<div id="sec2"></div>

<script id=location_target>
  // :target must reflect the CURRENT location's fragment. Each fragment
  // navigation replaces the backing Location, so this verifies the selector
  // reads the live location (not a stale/freed one), and that fragment
  // navigation releases the previous Location without breaking the chain.
  const sec1 = document.getElementById('sec1');
  const sec2 = document.getElementById('sec2');

  location.hash = "#sec1";
  testing.expectEqual(true, sec1.matches(':target'));
  testing.expectEqual(false, sec2.matches(':target'));

  // Navigate to a new fragment: :target must follow the new location.
  location.hash = "#sec2";
  testing.expectEqual(false, sec1.matches(':target'));
  testing.expectEqual(true, sec2.matches(':target'));

  // No fragment -> nothing is :target.
  location.hash = "";
  testing.expectEqual(false, sec1.matches(':target'));
  testing.expectEqual(false, sec2.matches(':target'));
</script>

<script id=location_fragment_churn>
  // Hammer fragment navigation: every iteration creates a new Location and must
  // release the previous one. Consistency must hold throughout.
  for (let i = 0; i < 50; i++) {
    location.hash = "#h" + i;
    testing.expectEqual("#h" + i, location.hash);
  }
  location.hash = "";
  testing.expectEqual("", location.hash);
</script>

<script id=location_hash_no_change>
  // Per the Location hash setter, assigning a value that doesn't change the
  // fragment must not navigate at all: re-assigning "" on a fragment-less URL
  // must not schedule a same-URL reload, and re-assigning the current
  // fragment must be a no-op too.
  const stable_href = location.href;
  location.hash = "";
  location.hash = "";
  testing.expectEqual(stable_href, location.href);

  location.hash = "#same";
  const with_fragment = location.href;
  location.hash = "#same";
  location.hash = "same";
  testing.expectEqual(with_fragment, location.href);
  testing.expectEqual("#same", location.hash);

  location.hash = "";
  testing.expectEqual(stable_href, location.href);
</script>

<script id=location_ancestor_origins>
  // The one API that hands a frame its ancestors' origins. A page that is not
  // framed gets an empty DOMStringList -- and an empty one answers `item(0)`
  // with null but `[0]` with undefined, which is two different absences from
  // the same list (measured on Chrome 151).
  //
  // Kasada reads this name twice while scoring x-hyatt. Before it existed here
  // the read threw a TypeError, which is louder than any value would have been.
  testing.expectEqual('DOMStringList', location.ancestorOrigins.constructor.name);
  testing.expectEqual(0, location.ancestorOrigins.length);
  testing.expectEqual(null, location.ancestorOrigins.item(0));
  testing.expectEqual(undefined, location.ancestorOrigins[0]);
  testing.expectEqual(false, location.ancestorOrigins.contains(location.origin));
  testing.expectEqual('[object DOMStringList]', Object.prototype.toString.call(location.ancestorOrigins));

  // Chrome hands back the same object on every read.
  testing.expectEqual(true, location.ancestorOrigins === location.ancestorOrigins);
</script>

<script id=location_ancestor_origins_framed>
{
  // A same-origin child sees exactly one ancestor, and a grandchild sees two.
  const frame = document.createElement('iframe');
  document.documentElement.appendChild(frame);

  const child = frame.contentWindow.location.ancestorOrigins;
  testing.expectEqual(1, child.length);
  testing.expectEqual(location.origin, child[0]);
  testing.expectEqual(location.origin, child.item(0));
  testing.expectEqual(true, child.contains(location.origin));

  const nested = frame.contentDocument.createElement('iframe');
  frame.contentDocument.documentElement.appendChild(nested);
  const grandchild = nested.contentWindow.location.ancestorOrigins;
  testing.expectEqual(2, grandchild.length);
  testing.expectEqual(location.origin, grandchild[0]);
  testing.expectEqual(location.origin, grandchild[1]);

  frame.remove();
}
</script>
