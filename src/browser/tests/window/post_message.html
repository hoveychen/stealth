<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=postMessageStructuredClone type=module>
// window.postMessage delivers a structured clone: the receiver gets a fresh,
// independent copy, not the literal object the sender posted.
{
    const state = await testing.async();
    const payload = { n: 1 };
    let received = null;

    window.addEventListener('message', (e) => {
        received = e.data;
        state.resolve();
    });

    window.postMessage(payload, '*');

    await state.done(() => {
        testing.expectEqual(false, received === payload);
        testing.expectEqual(1, received.n);
        // Mutating the sender's object after posting doesn't affect the clone.
        payload.n = 999;
        testing.expectEqual(1, received.n);
    });
}
</script>

<script id=postMessageDataCloneError>
// A value that cannot be structured-cloned throws synchronously (DataCloneError).
{
    let threw = false;
    try {
        window.postMessage(function () {}, '*');
    } catch (e) {
        threw = true;
        testing.expectEqual('DataCloneError', e.name);
    }
    testing.expectEqual(true, threw);
}
</script>

<script id=postMessageDataCloneErrorWording>
// Blink's sentence, character for character (Chrome 153): the prefix names the
// method and interface, the value is described the way V8 prints it, and a
// host object -- even an empty one like Permissions -- is named by interface.
// DataDome compares the whole message.
{
    const cases = [
        [function foo() {}, 'function foo() {}'],
        [() => 1, '() => 1'],
        [navigator.permissions.query, 'function query() { [native code] }'],
        [Symbol('x'), 'Symbol(x)'],
        [window, '#<Window>'],
        [new WeakMap(), '#<WeakMap>'],
        [navigator, 'Navigator object'],
        [navigator.permissions, 'Permissions object'],
        [navigator.storage, 'StorageManager object'],
        [new TextEncoder(), 'TextEncoder object'],
        [document, 'HTMLDocument object'],
        [document.documentElement, 'HTMLHtmlElement object'],
    ];
    for (const [value, described] of cases) {
        let message = 'no throw';
        try {
            window.postMessage(value, '*');
        } catch (e) {
            testing.expectEqual('DataCloneError', e.name, { desc: described });
            testing.expectEqual(25, e.code, { desc: described });
            message = e.message;
        }
        testing.expectEqual("Failed to execute 'postMessage' on 'Window': " + described + ' could not be cloned.', message);
    }

    let port = 'no throw';
    try { new MessageChannel().port1.postMessage(function () {}); } catch (e) { port = e.message; }
    testing.expectEqual("Failed to execute 'postMessage' on 'MessagePort': function () {} could not be cloned.", port);

    const bc = new BroadcastChannel('wording');
    let channel = 'no throw';
    try { bc.postMessage(Symbol('s')); } catch (e) { channel = e.message; }
    bc.close();
    testing.expectEqual("Failed to execute 'postMessage' on 'BroadcastChannel': Symbol(s) could not be cloned.", channel);

    let clone = 'no throw';
    try { structuredClone(navigator.permissions); } catch (e) { clone = e.message; }
    testing.expectEqual("Failed to execute 'structuredClone' on 'Window': Permissions object could not be cloned.", clone);
}
</script>
