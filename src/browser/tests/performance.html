<script id=now_lands_on_the_reference_lattice>
  {
    // The clamp to 100us is only half of what `performance.now()` gives away.
    // The other half is how the clamped number is spelled: the reference host
    // answers 133.79999999701977, not 133.8, because its value is the grid
    // point rounded to the nearest multiple of 2^-26 ms. Four grid points in
    // five are not on that lattice, so four readings in five carry a dozen
    // digits of dust -- and a clock that prints "133.8" every time is a clock
    // no browser has. Measured across 75M samples of Chrome 151 spanning
    // 0.1ms to 32s: the offset from k/10 is always one of {0, +/-1, +/-2}
    // multiples of 2^-25/10 ms, fixed by k mod 5, exactly as this lattice
    // predicts (tools/fingerprint/scratch/expr-now-octave.js).
    // The unit the dust comes in, and the offset a grid point carries, by grid
    // index mod 5.
    const U = Math.pow(2, -25) / 10;
    const F = [0, -2, 1, -1, 2];

    const offsets = {};
    const gridPoints = new Set();
    let offLattice = 0;
    let x = 0;
    // Spin between reads, by a length that changes every iteration. A tight
    // loop returns one value over and over, and a fixed amount of work between
    // reads walks the clock by a fixed number of grid points -- which can be a
    // multiple of five, leaving every sample on one residue and the pattern
    // this is about invisible.
    for (let i = 0; i < 3000 && (gridPoints.size < 10 || Object.keys(offsets).length < 5); i++) {
      const v = performance.now();
      const k = Math.round(v * 10);
      gridPoints.add(k);
      const m = (v - k / 10) / U;
      if (Math.abs(m - Math.round(m)) > 0.01) offLattice++;
      const r = ((k % 5) + 5) % 5;
      (offsets[r] ??= new Set()).add(Math.round(m));
      for (let j = 0; j < (i % 13) * 40; j++) x += Math.sqrt(j);
    }
    if (x < 0) throw new Error('unreachable');

    // Guards everything below against passing on one lucky grid point.
    testing.expectEqual(true, gridPoints.size >= 6,
      { desc: 'sampled enough distinct grid points, got ' + gridPoints.size });
    testing.expectEqual(0, offLattice,
      { desc: 'every reading is a whole number of lattice units off its grid point' });
    testing.expectEqual(true, Object.keys(offsets).length >= 3,
      { desc: 'covered enough grid residues, got ' + Object.keys(offsets).length });
    for (const r of Object.keys(offsets)) {
      testing.expectEqual(1, offsets[r].size,
        { desc: 'grid residue ' + r + ' always carries the same offset' });
    }

    // The five offsets are the reference table rotated by wherever this
    // document's origin fell on the lattice: five candidate rotations, exactly
    // one of which has to fit. An engine that hands out the double nearest the
    // grid point reads as all-zeroes here, which is no rotation at all.
    let rotation = null;
    for (let c = 0; c < 5 && rotation === null; c++) {
      let fits = true;
      for (const r of Object.keys(offsets)) {
        if ([...offsets[r]][0] !== F[(Number(r) + c) % 5] - F[c]) fits = false;
      }
      if (fits) rotation = c;
    }
    testing.expectEqual(true, rotation !== null,
      { desc: 'offsets are a rotation of the reference table, got ' +
        JSON.stringify(Object.keys(offsets).map((r) => [r, [...offsets[r]][0]])) });
  }
</script>

<script id=timeOrigin>
  const origin = performance.timeOrigin;
  testing.expectEqual('number', typeof origin);
  testing.expectEqual(true, origin > 0);

  // Epoch milliseconds, not the boot-relative clock `now()` counts from. The
  // pair is the check a fingerprinter runs: Chrome answers `origin + now()`
  // within a millisecond of `Date.now()`, and an engine counting from boot is
  // off by however long the machine has been up.
  testing.expectEqual(true, origin > 1700000000000);
  testing.expectEqual(true, origin < 4000000000000);
  testing.expectEqual(true, Math.abs(origin + performance.now() - Date.now()) < 1000);
</script>

<script id=now_relative_to_origin>

    testing.expectEqual(true, t < now);
  }
</script>

<script id=multiple_calls>
  {
    const times = [];
    for (let i = 0; i < 5; i++) {
      times.push(performance.now());

      testing.expectEqual(true, times[i] >= times[i-1]);
    }
  }
</script>

<script id=mark>

<script id=getEntries>

<script id=measure_with_navigation_timing_marks>
  {
    // performance.measure() must accept PerformanceTiming attribute names
    // (e.g. "fetchStart") as start/end marks per the W3C User Timing Level 2 spec.
    // https://www.w3.org/TR/user-timing/#dom-performance-measure
    performance.clearMarks();
    performance.clearMeasures();

    performance.mark("mark-dataComplete");
    let m = performance.measure("dataComplete", "fetchStart", "mark-dataComplete");
    testing.expectEqual('dataComplete', m.name);
    testing.expectEqual('measure', m.entryType);
    testing.expectEqual(true, m.duration >= 0);

    // navigationStart is also a valid mark name (was already supported)
    performance.mark("mark-end");
    let m2 = performance.measure("fromNav", "navigationStart", "mark-end");
    testing.expectEqual('fromNav', m2.name);
    testing.expectEqual(true, m2.duration >= 0);
  }
</script>

<script id=navigation_timing_entry>
  {
    // Chrome always answers exactly one navigation entry, and hands back the
    // same object every call (measured, win24-chrome.json).
    const entries = performance.getEntriesByType('navigation');
    testing.expectEqual(1, entries.length);
    testing.expectEqual(true, entries[0] === performance.getEntriesByType('navigation')[0]);

    const nav = entries[0];
    testing.expectEqual('[object PerformanceNavigationTiming]', Object.prototype.toString.call(nav));
    testing.expectEqual('PerformanceNavigationTiming', nav.constructor.name);
    testing.expectEqual('navigation', nav.entryType);
    testing.expectEqual('navigate', nav.type);
    testing.expectEqual(0, nav.startTime);
    testing.expectEqual(0, nav.redirectCount);
    testing.expectEqual(0, nav.activationStart);
    testing.expectEqual(200, nav.responseStatus);
    testing.expectEqual('navigation', nav.initiatorType);
    testing.expectEqual('text/html', nav.contentType);
    testing.expectEqual(null, nav.notRestoredReasons);
    testing.expectEqual(0, nav.serverTiming.length);
    testing.expectEqual(true, nav.name.endsWith('/src/browser/tests/performance.html'));

    // transferSize is the body plus Chrome's flat 300 bytes of header overhead.
    testing.expectEqual(true, nav.encodedBodySize > 0);
    testing.expectEqual(nav.decodedBodySize, nav.encodedBodySize);
    testing.expectEqual(nav.encodedBodySize + 300, nav.transferSize);

    // The milestones are ordered, and they are real: the response cannot start
    // before the fetch did, and the DOM cannot be interactive before the body
    // arrived.
    testing.expectEqual(true, nav.fetchStart >= 0);
    testing.expectEqual(true, nav.requestStart >= nav.fetchStart);
    testing.expectEqual(true, nav.responseStart >= nav.requestStart);
    testing.expectEqual(true, nav.responseEnd >= nav.responseStart);

    // A synchronous script runs mid-parse, so the DOM milestones have not
    // happened yet and read 0 — the same thing they read in Chrome at this
    // point. They are checked after load below.
    testing.expectEqual(0, nav.domInteractive);
    testing.expectEqual(0, nav.loadEventEnd);

    // The entry is at the head of the buffer, which is where Chrome has it.
    testing.expectEqual('navigation', performance.getEntries()[0].entryType);
    testing.expectEqual(1, performance.getEntriesByName(nav.name, 'navigation').length);
  }
</script>

<script id=navigation_timing_chain>
  {
    const nav = performance.getEntriesByType('navigation')[0];
    testing.expectEqual(true, nav instanceof PerformanceNavigationTiming);
    testing.expectEqual(true, nav instanceof PerformanceResourceTiming);
    testing.expectEqual(true, nav instanceof PerformanceEntry);

    const chain = [];
    let p = Object.getPrototypeOf(nav);
    while (p && p !== Object.prototype) {
      chain.push(Object.getOwnPropertyDescriptor(p, Symbol.toStringTag).value);
      p = Object.getPrototypeOf(p);
    }
    testing.expectEqual(
      ['PerformanceNavigationTiming', 'PerformanceResourceTiming', 'PerformanceEntry'],
      chain,
    );
  }

    if (document.readyState === 'complete') {

<script id=implicit_entries type=module>
  {
    // Chrome's buffer is never empty: one navigation entry, one `visible`
    // visibility-state entry at startTime 0, and the paint pair — and
    // getEntries() answers sorted by startTime, not insertion order (measured:
    // a measure at startTime 0 came back ahead of marks made before it).
    const state = await testing.async();
    if (document.readyState === 'complete') {
      state.resolve(true);
    } else {
      window.addEventListener('load', () => state.resolve(true));
    }

    await state.done(() => {
      const v = performance.getEntriesByType('visibility-state');
      testing.expectEqual(1, v.length);
      testing.expectEqual('visible', v[0].name);
      testing.expectEqual(0, v[0].startTime);
      testing.expectEqual(0, v[0].duration);
      testing.expectEqual('VisibilityStateEntry', v[0].constructor.name);
      // navigationId is drawn per navigation, so the value is not fixed; the
      // key and its position are.
      testing.expectEqual(
        ['name', 'entryType', 'startTime', 'duration', 'navigationId'],
        Object.keys(JSON.parse(JSON.stringify(v[0]))),
      );
      testing.expectEqual(performance.getEntries()[0].navigationId, v[0].navigationId);

      const paint = performance.getEntriesByType('paint');
      testing.expectEqual(2, paint.length);
      testing.expectEqual(['first-paint', 'first-contentful-paint'], paint.map((p) => p.name));
      for (const p of paint) {
        testing.expectEqual('PerformancePaintTiming', p.constructor.name);
        testing.expectEqual(0, p.duration);
        testing.expectEqual(p.startTime, p.presentationTime);
        testing.expectEqual(true, p.paintTime <= p.presentationTime);
        testing.expectEqual(true, p.paintTime > 0);
        testing.expectEqual(
          ['name', 'entryType', 'startTime', 'duration', 'navigationId', 'paintTime', 'presentationTime'],
          Object.keys(p.toJSON()),
        );
      }

      // Sorted by startTime, with the navigation entry (startTime 0) first.
      const all = performance.getEntries();
      testing.expectEqual('navigation', all[0].entryType);
      for (let i = 1; i < all.length; i++) {
        testing.expectEqual(true, all[i].startTime >= all[i - 1].startTime);
      }
    });
  }
</script>

<script id=nowResolution>
  // A timer finer than the browser's is a fingerprint by itself, and it is what
  // timing attacks are measured against. Chrome (outside a cross-origin
  // isolated context) clamps performance.now() to 100us; measured on the
  // reference host, its smallest non-zero delta is 0.1ms. Ours was 5us, which
  // is Firefox's number, not the browser this engine claims to be.
  {
    const t = [];
    for (let i = 0; i < 3000; i++) t.push(performance.now());
    const deltas = [];
    for (let i = 1; i < t.length; i++) {
      const d = t[i] - t[i - 1];
      if (d > 0) deltas.push(d);
      testing.expectEqual(true, d >= 0);
    }
    // Every advance is a whole clamp step, so the smallest one is the step. A
    // 5us clamp lands at 0.005 here and fails; Chrome's 100us lands at 0.1.
    const smallest = Math.min(...deltas);
    testing.expectEqual(true, deltas.length > 0);
    testing.expectEqual(true, smallest > 0.05);
  }
</script>

<script id=unreachable_performance_entry_subclasses>
  {
    // Four more PerformanceEntry subclasses Chrome 151 puts on the window.
    // Nothing here queues one -- there is no frame-timing pass, no script
    // attribution, no soft-navigation heuristic and no interaction paint -- and
    // Chrome does not let a page build one either, so the interface object and
    // the prototype are the whole surface. Every member list below is Chrome's
    // own, from probes/probe-shapes.js against a headed Chrome 151
    // (results/probes/probe-shapes.chrome.json).
    const protoKeys = (ctor) => Object.getOwnPropertyNames(ctor.prototype).join(' ');

    for (const [name, keys] of [
      // paintTime and presentationTime come last on the three that have them,
      // after toJSON -- they are own properties of each prototype, not
      // inherited, same as LargestContentfulPaint's.
      ['PerformanceLongAnimationFrameTiming',
        'renderStart styleAndLayoutStart firstUIEventTimestamp blockingDuration scripts ' +
        'toJSON paintTime presentationTime constructor'],
      ['PerformanceScriptTiming',
        'invokerType invoker windowAttribution executionStart forcedStyleAndLayoutDuration ' +
        'pauseDuration window sourceURL sourceFunctionName sourceCharPosition toJSON constructor'],
      ['PerformanceSoftNavigation',
        'navigationType interactionId getLargestInteractionContentfulPaint paintTime ' +
        'presentationTime constructor'],
      ['InteractionContentfulPaint',
        'largestContentfulPaint interactionId toJSON paintTime presentationTime constructor'],
    ]) {
      const ctor = window[name];
      testing.expectEqual('function', typeof ctor, { desc: name + ' is on the window' });
      testing.expectEqual(name, ctor.name, { desc: name + ' name' });
      testing.expectEqual(0, ctor.length, { desc: name + ' arity' });
      testing.expectEqual(keys, protoKeys(ctor), { desc: name + ' prototype members' });
      testing.expectEqual('PerformanceEntry', Object.getPrototypeOf(ctor.prototype).constructor.name,
        { desc: name + ' inherits PerformanceEntry' });
      testing.expectEqual('[object ' + name + ']', Object.prototype.toString.call(ctor.prototype),
        { desc: name + ' prototype brand' });
      testing.expectEqual(name, ctor.prototype[Symbol.toStringTag], { desc: name + ' toStringTag' });
      testing.expectError("Failed to construct '" + name + "': Illegal constructor", () => new ctor());
      testing.expectError('Illegal constructor', () => ctor());
    }

    // And none of them ever shows up in a buffer. `long-animation-frame` used
    // to be on this list and is not any more -- see `long_animation_frame`
    // below, which is the one entry of the four Chrome actually files.
    for (const type of ['script', 'soft-navigation',
      'interaction-contentful-paint']) {
      testing.expectEqual(0, performance.getEntriesByType(type).length, { desc: type + ' buffer' });
    }
  }
</script>

<script id="performance_is_an_event_target">
  {
    // Chrome's Performance inherits EventTarget. This engine had it as a
    // prototype root, which the member table could not show -- the prototype's
    // own names were already byte-identical and only the chain differed
    // (tools/fingerprint/probes/expr-proto-chains.js). It was the last chain
    // difference in either realm.
    testing.expectEqual(true, performance instanceof EventTarget);
    testing.expectEqual(true, Object.getPrototypeOf(Performance.prototype) === EventTarget.prototype);
    testing.expectEqual('[object Performance]', String(performance));

    const seen = [];
    const listener = (e) => seen.push(e.type);
    performance.addEventListener('lp-test', listener);
    performance.dispatchEvent(new Event('lp-test'));
    testing.expectEqual('lp-test', seen.join(','));
    performance.removeEventListener('lp-test', listener);
    performance.dispatchEvent(new Event('lp-test'));
    testing.expectEqual('lp-test', seen.join(','));
  }
</script>

<script id=long_animation_frame type=module>
  {
    // Chrome files a `long-animation-frame` entry for any rendering frame that
    // took more than 50ms, and a document that loads a script is over that
    // before it has finished parsing: measured on Chrome 151 there is exactly
    // one on www.scrapingcourse.com (startTime 3.5, duration 1268.8) and
    // exactly one INSIDE the Cloudflare widget document (startTime 87.0,
    // duration 746.4) -- the realm the cf-scrapingcourse guard runs in, which
    // walks `performance.getEntries()` reading `entryType` off every entry
    // moments before it hashes the four values it sends.
    //
    // This engine listed `long-animation-frame` in
    // `PerformanceObserver.supportedEntryTypes` and never filed one. Claiming
    // a capability and never delivering it is a shape no browser has, and it
    // is one expression to check.
    //
    // The spin loop at the top of this file is what puts this page over
    // the threshold; without it a local document is done in single-digit
    // milliseconds and Chrome would file nothing either.
    const state = await testing.async();
    if (document.readyState === 'complete') {
      state.resolve(true);
    } else {
      window.addEventListener('load', () => state.resolve(true));
    }

    await state.done(() => {
      const loaf = performance.getEntriesByType('long-animation-frame');
      testing.expectEqual('long-animation-frame count: 1', 'long-animation-frame count: ' + loaf.length);
      const e = loaf[0];
      testing.expectEqual('PerformanceLongAnimationFrameTiming', e.constructor.name);
      testing.expectEqual('long-animation-frame', e.name);
      testing.expectEqual('long-animation-frame', e.entryType);
      // Over the threshold that made it an entry at all.
      testing.expectEqual('duration over 50: true', 'duration over 50: ' + (e.duration > 50));
      // Chrome's own invariants, read off the entry above: the frame's end is
      // its paint, and nothing is presented before it is painted.
      testing.expectEqual('paintTime is frame end: true',
        'paintTime is frame end: ' + (e.paintTime === e.startTime + e.duration));
      testing.expectEqual('presented after paint: true',
        'presented after paint: ' + (e.presentationTime >= e.paintTime));
      testing.expectEqual('render starts inside the frame: true',
        'render starts inside the frame: ' + (e.renderStart >= e.startTime && e.renderStart <= e.paintTime));
      testing.expectEqual('styleAndLayoutStart tracks renderStart: true',
        'styleAndLayoutStart tracks renderStart: ' + (e.styleAndLayoutStart === e.renderStart));
      // Chrome answers 0 for both of these on a load frame, and files no
      // script children with it.
      testing.expectEqual(0, e.firstUIEventTimestamp);
      testing.expectEqual(0, e.blockingDuration);
      testing.expectEqual('scripts: 0', 'scripts: ' + e.scripts.length);
      testing.expectEqual(
        ['name', 'entryType', 'startTime', 'duration', 'navigationId', 'paintTime',
          'presentationTime', 'renderStart', 'styleAndLayoutStart', 'firstUIEventTimestamp',
          'blockingDuration', 'scripts'],
        Object.keys(e.toJSON()),
      );
      testing.expectEqual(performance.getEntries()[0].navigationId, e.navigationId);
    });
  }
</script>
