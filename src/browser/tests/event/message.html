<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=messageEventConstructor>
{
  const evt = new MessageEvent('message', {
    data: { foo: 'bar', count: 42 },
    origin: 'https://example.com',
    source: window
  });

  testing.expectEqual('message', evt.type);
  testing.expectEqual({ foo: 'bar', count: 42 }, evt.data);
  testing.expectEqual('https://example.com', evt.origin);
  testing.expectEqual(window, evt.source);
  testing.expectEqual(false, evt.bubbles);
  testing.expectEqual(false, evt.cancelable);
}
</script>

<script id=messageEventWithString>
{
  const evt2 = new MessageEvent('message', {
    data: 'Hello, World!',
    origin: 'https://test.com'
  });

  testing.expectEqual('Hello, World!', evt2.data);
  testing.expectEqual('https://test.com', evt2.origin);
}
</script>

<script id=messageEventDefaults>
{
  const evt3 = new MessageEvent('message');

  testing.expectEqual('', evt3.origin);
  testing.expectEqual(false, evt3.bubbles);
  testing.expectEqual(false, evt3.cancelable);
}
</script>

<script id=messageEventPorts>
{
  // ports must always be a (frozen) array, never undefined.
  const evt = new MessageEvent('message');
  testing.expectEqual(0, evt.ports.length);
  testing.expectEqual(true, Array.isArray(evt.ports) || typeof evt.ports.length === 'number');
}
</script>

<script id=messageEventInheritance>
{
  const evt4 = new MessageEvent('custom');

  testing.expectEqual('custom', evt4.type);
  testing.expectEqual(Event.NONE, evt4.eventPhase);
  testing.expectEqual(false, evt4.defaultPrevented);
}
</script>

<script id=postMessageBasic>
{
  let receivedEvent = null;

  const handler = (e) => {
    receivedEvent = e;
  };
  window.addEventListener('message', handler, { once: true });

  window.postMessage('test data', '*');

  testing.onload(() => {
    testing.expectEqual('test data', receivedEvent.data);
    testing.expectEqual(window, receivedEvent.source);
    testing.expectEqual('message', receivedEvent.type);
  });
}
</script>

<script id=postMessageWithObject>

</script>

<script id=postMessageTransfersPorts>
{
  // window.postMessage(data, targetOrigin, [port]) must deliver the transferred
  // MessagePort as event.ports[0] (regression: ports used to always be empty,
  // so receivers doing `e.ports[0].onmessage = ...` threw on undefined).
  const channel = new MessageChannel();
  let received = null;
  let echoed = null;

  channel.port1.onmessage = (e) => { echoed = e.data; };

  const handler = (e) => {
    received = e.ports[0];
    received.postMessage('pong');
  };
  window.addEventListener('message', handler, { once: true });

  window.postMessage('ping', '*', [channel.port2]);

  testing.onload(() => {
    testing.expectEqual(true, received instanceof MessagePort);
    testing.expectEqual('pong', echoed);
  });
}
</script>

<script id=messageEventOriginFromLocation>
{
  let receivedOrigin = null;

  const handler = (e) => {
    receivedOrigin = e.origin;
  };
  window.addEventListener('message', handler, { once: true });

  window.postMessage('test', '*');

  testing.onload(() => {
    testing.expectEqual('http://127.0.0.1:9582', receivedOrigin);
  });
}
</script>

<script id="user_activation_and_legacy_init">
  {
    // A UserActivation snapshot rides along only on a message posted from a
    // page with a transient activation; Chrome answers null for a constructed
    // event too (measured).
    const me = new MessageEvent('message', { data: 1 });
    testing.expectEqual(null, me.userActivation);

    // The legacy initialiser takes the eight members positionally, and its
    // arity is 1 -- only `type` is required.
    testing.expectEqual(1, MessageEvent.prototype.initMessageEvent.length);

    const e = new MessageEvent('x');
    e.initMessageEvent('m', true, true, 'D', 'ORIGIN', 'LEID', window, []);
    testing.expectEqual('m', e.type);
    testing.expectEqual(true, e.bubbles);
    testing.expectEqual(true, e.cancelable);
    testing.expectEqual('D', e.data);
    testing.expectEqual('ORIGIN', e.origin);
    testing.expectEqual('LEID', e.lastEventId);
    testing.expectEqual(true, e.source === window);
    testing.expectEqual(0, e.ports.length);

    // Chrome's defaults for the omitted arguments.
    const d = new MessageEvent('x');
    d.initMessageEvent('m');
    testing.expectEqual(false, d.bubbles);
    testing.expectEqual(false, d.cancelable);
    testing.expectEqual(null, d.data);
    testing.expectEqual('', d.origin);
    testing.expectEqual('', d.lastEventId);
    testing.expectEqual(null, d.source);
    testing.expectEqual(0, d.ports.length);
  }
</script>
