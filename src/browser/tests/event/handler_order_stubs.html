<!DOCTYPE html>
<script src="../testing.js"></script>

<!-- The same rule as handler_order.html, over the wide set of interfaces that
     only ever *carry* their `on*` properties: nothing in the engine fires the
     events, but a script can still set a handler and dispatch by hand, and the
     handler has to take its place in the listener list. Every row below is
     "al1,on,al2" on a headed Chrome 150 (probe-g22recon, probe-g22recon2);
     each one used to read back the stored function while the dispatch skipped
     it, because the owner kept it in a field of its own. -->

<script id=handler_order_stub_targets type=module>
  {
    const order = (target, name, type) => {
      const log = [];
      target.addEventListener(type, () => log.push('al1'));
      target[name] = () => log.push('on');
      target.addEventListener(type, () => log.push('al2'));
      target.dispatchEvent(new Event(type));
      target[name] = null;
      return log.join(',');
    };
    const check = (label, target, pairs) => {
      for (const [name, type] of pairs) {
        testing.expectEqual('al1,on,al2', order(target, name, type), { desc: label + '.' + name });
      }
    };

    check('Screen', screen, [['onchange', 'change']]);
    check('Navigation', navigation, [['oncurrententrychange', 'currententrychange']]);
    check('NavigationHistoryEntry', navigation.currentEntry, [['ondispose', 'dispose']]);
    check('CookieStore', cookieStore, [['onchange', 'change']]);
    check('Document', document, [['onselectionchange', 'selectionchange']]);
    check('HTMLInputElement', document.createElement('input'), [['onselectionchange', 'selectionchange']]);
    check('HTMLTextAreaElement', document.createElement('textarea'), [['onselectionchange', 'selectionchange']]);
    check('TaskSignal', new TaskController().signal, [['onprioritychange', 'prioritychange']]);
    check('IdleDetector', new IdleDetector(), [['onchange', 'change']]);
  }
</script>

<script id=handler_order_stub_async type=module>
  {
    const state = await testing.async();
    const order = (target, name, type) => {
      const log = [];
      target.addEventListener(type, () => log.push('al1'));
      target[name] = () => log.push('on');
      target.addEventListener(type, () => log.push('al2'));
      target.dispatchEvent(new Event(type));
      target[name] = null;
      return log.join(',');
    };

    (async () => {
      const rows = [];
      const record = (label, target, pairs) => {
        for (const [name, type] of pairs) {
          rows.push([label + '.' + name, order(target, name, type)]);
        }
      };

      record('BatteryManager', await navigator.getBattery(), [
        ['onchargingchange', 'chargingchange'], ['onchargingtimechange', 'chargingtimechange'],
        ['ondischargingtimechange', 'dischargingtimechange'], ['onlevelchange', 'levelchange'],
      ]);
      record('WakeLockSentinel', await navigator.wakeLock.request('screen'), [['onrelease', 'release']]);
      record('PresentationAvailability',
        await new PresentationRequest('https://example.com/').getAvailability(),
        [['onchange', 'change']]);

      const access = await navigator.requestMediaKeySystemAccess('org.w3.clearkey', [{
        initDataTypes: ['cenc'],
        videoCapabilities: [{ contentType: 'video/mp4; codecs="avc1.42E01E"' }],
      }]);
      record('MediaKeySession', (await access.createMediaKeys()).createSession(), [
        ['onkeystatuseschange', 'keystatuseschange'], ['onmessage', 'message'],
      ]);

      const device = await (await navigator.gpu.requestAdapter()).requestDevice();
      record('GPUDevice', device, [['onuncapturederror', 'uncapturederror']]);

      state.resolve(rows);
    })();

    await state.done((rows) => {
      for (const [desc, got] of rows) {
        testing.expectEqual('al1,on,al2', got, { desc: desc });
      }
    });
  }
</script>
</body>

<!-- Navigation's three missing handlers and reload, against a headed Chrome
     151. The three sit before oncurrententrychange on the prototype. -->
<script id="navigation_handlers">
{
  testing.expectEqual(null, navigation.onnavigate);
  testing.expectEqual(null, navigation.onnavigatesuccess);
  testing.expectEqual(null, navigation.onnavigateerror);

  const handler = () => {};
  navigation.onnavigate = handler;
  testing.expectEqual(handler, navigation.onnavigate);
  navigation.onnavigate = null;
  testing.expectEqual(null, navigation.onnavigate);

  testing.expectEqual('function', typeof navigation.reload);
  testing.expectEqual(0, Navigation.prototype.reload.length);
}
</script>
