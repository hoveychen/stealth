<!DOCTYPE html>
<script src="../testing.js"></script>
<script id=default>
  let event = new MouseEvent('click');
  testing.expectEqual('click', event.type);
  testing.expectEqual(true, event instanceof MouseEvent);
  testing.expectEqual(true, event instanceof UIEvent);
  testing.expectEqual(true, event instanceof Event);
  testing.expectEqual(0, event.clientX);
  testing.expectEqual(0, event.clientY);
  testing.expectEqual(0, event.screenX);
  testing.expectEqual(0, event.screenY);
  testing.expectEqual(0, event.buttons);
</script>

<script id=parameters>
  let new_event = new MouseEvent('click', { 'button': 0, 'clientX': 10, 'clientY': 20, screenX: 200, screenY: 500, buttons: 5 });
  testing.expectEqual(0, new_event.button);
  testing.expectEqual(5, new_event.buttons);
  testing.expectEqual(10, new_event.x);
  testing.expectEqual(20, new_event.y);
  testing.expectEqual(10, new_event.pageX);
  testing.expectEqual(20, new_event.pageY);
  testing.expectEqual(200, new_event.screenX);
  testing.expectEqual(500, new_event.screenY);
</script>

<script id=listener>
  let me = new MouseEvent('click');
  testing.expectEqual(true, me instanceof Event);

  var evt = null;
  document.addEventListener('click', function (e) {
    evt = e;
  });
  document.dispatchEvent(me);
  testing.expectEqual('click', evt.type);
  testing.expectEqual(true, evt instanceof MouseEvent);
</script>

<script id=isTrusted>
  // Test isTrusted on MouseEvent
  let mouseEvent = new MouseEvent('click');
  testing.expectEqual(false, mouseEvent.isTrusted);

  // Test isTrusted on dispatched MouseEvent
  let mouseIsTrusted = null;
  document.addEventListener('mousetest', (e) => {
    mouseIsTrusted = e.isTrusted;
    testing.expectEqual(true, e instanceof MouseEvent);
  });
  document.dispatchEvent(new MouseEvent('mousetest'));
  testing.expectEqual(false, mouseIsTrusted);
</script>

<script id=which>
  {
    testing.expectEqual(1, new MouseEvent('click').which);
    testing.expectEqual(2, new MouseEvent('click', {button: 1}).which);
    testing.expectEqual(3, new MouseEvent('click', {button: 2}).which);
  }
</script>

<script id=layerXY>
  {
    let evt = new MouseEvent('click', {clientX: 11, clientY: 22});
    testing.expectEqual(11, evt.layerX);
    testing.expectEqual(22, evt.layerY);
  }
</script>

<script id=fractionalCoordinatesFloored>
  {
    // Chrome floors MouseEvent coordinate getters to integers — fractional
    // precision is exposed on PointerEvent only, even though CSSOM-View types
    // these as double.
    let evt = new MouseEvent('click', {clientX: 47.5, clientY: 312.5, screenX: -47.5, screenY: 47.6});
    testing.expectEqual(47, evt.clientX);
    testing.expectEqual(312, evt.clientY);
    testing.expectEqual(-48, evt.screenX);
    testing.expectEqual(47, evt.screenY);
    testing.expectEqual(47, evt.pageX);
    testing.expectEqual(312, evt.pageY);
    testing.expectEqual(47, evt.x);
    testing.expectEqual(312, evt.y);
    testing.expectEqual(47, evt.layerX);
    testing.expectEqual(312, evt.layerY);
  }
</script>

<script id=getModifierState>
  {
    let evt = new MouseEvent('click', {altKey: true, ctrlKey: true, shiftKey: true, metaKey: true});
    testing.expectEqual(true, evt.getModifierState('Alt'));
    testing.expectEqual(true, evt.getModifierState('AltGraph'));
    testing.expectEqual(true, evt.getModifierState('Control'));
    testing.expectEqual(true, evt.getModifierState('Shift'));
    testing.expectEqual(true, evt.getModifierState('Meta'));
    testing.expectEqual(true, evt.getModifierState('Accel'));
    testing.expectEqual(false, evt.getModifierState('NumLock'));

    let none = new MouseEvent('click');
    testing.expectEqual(false, none.getModifierState('Shift'));
  }
</script>

<script id=initMouseEvent>
  {
    let evt = document.createEvent('MouseEvent');
    evt.initMouseEvent('click', true, true, window, 1, 10, 20, 30, 40, true, false, true, false, 2, null);
    testing.expectEqual('click', evt.type);
    testing.expectEqual(true, evt.bubbles);
    testing.expectEqual(true, evt.cancelable);
    testing.expectEqual(1, evt.detail);
    testing.expectEqual(10, evt.screenX);
    testing.expectEqual(20, evt.screenY);
    testing.expectEqual(30, evt.clientX);
    testing.expectEqual(40, evt.clientY);
    testing.expectEqual(true, evt.ctrlKey);
    testing.expectEqual(false, evt.altKey);
    testing.expectEqual(true, evt.shiftKey);
    testing.expectEqual(false, evt.metaKey);
    testing.expectEqual(2, evt.button);
  }
</script>

<script id=initMouseEventOptional>
  {
    let evt = document.createEvent('MouseEvent');
    evt.initMouseEvent('mousedown');
    testing.expectEqual('mousedown', evt.type);
    testing.expectEqual(false, evt.bubbles);
    testing.expectEqual(false, evt.cancelable);
    testing.expectEqual(0, evt.clientX);
    testing.expectEqual(0, evt.button);
  }
</script>

<script id=movement>
  testing.expectEqual(0, new MouseEvent('mousemove').movementX);
  testing.expectEqual(0, new MouseEvent('mousemove').movementY);
  const m = new MouseEvent('mousemove', {movementX: 7, movementY: -9});
  testing.expectEqual(7, m.movementX);
  testing.expectEqual(-9, m.movementY);
</script>

<script id=from_to_element>
  // The IE-era pair is not a symmetric alias of relatedTarget. The type
  // string alone picks the branch, and it is a literal match on two names:
  // `pointerout` and `click` take the same side as `mouseover`. Measured
  // against Chrome 151 on dispatched and undispatched events alike -- and
  // detached, which reads the same as attached on both arms, so this page does
  // not need a body it does not have.
  const a = document.createElement('div');
  const b = document.createElement('div');

  const undispatched = (type) => {
    const e = new MouseEvent(type, {relatedTarget: b});
    return [e.fromElement, e.toElement];
  };
  const dispatched = (type) => {
    let seen = null;
    a.addEventListener(type, (e) => { seen = [e.fromElement, e.toElement]; }, {once: true});
    a.dispatchEvent(new MouseEvent(type, {relatedTarget: b}));
    return seen;
  };

  for (const type of ['mousemove', 'mouseover', 'mouseenter', 'click', 'pointerover', 'pointerout']) {
    testing.expectEqual(b, undispatched(type)[0]);
    testing.expectEqual(null, undispatched(type)[1]);
    testing.expectEqual(b, dispatched(type)[0]);
    testing.expectEqual(a, dispatched(type)[1]);
  }
  // The two that swap.
  for (const type of ['mouseout', 'mouseleave']) {
    testing.expectEqual(null, undispatched(type)[0]);
    testing.expectEqual(b, undispatched(type)[1]);
    testing.expectEqual(a, dispatched(type)[0]);
    testing.expectEqual(b, dispatched(type)[1]);
  }

  // With no relatedTarget at all, the leaving branch still reports the target.
  let seen = null;
  a.addEventListener('mouseout', (e) => { seen = [e.fromElement, e.toElement]; }, {once: true});
  a.dispatchEvent(new MouseEvent('mouseout', {}));
  testing.expectEqual(a, seen[0]);
  testing.expectEqual(null, seen[1]);
</script>

<script id=own_property_order>
  testing.expectEqual(
    'screenX,screenY,clientX,clientY,ctrlKey,shiftKey,altKey,metaKey,button,' +
    'buttons,relatedTarget,pageX,pageY,x,y,offsetX,offsetY,movementX,' +
    'movementY,fromElement,toElement,layerX,layerY,getModifierState,' +
    'initMouseEvent,constructor',
    Object.getOwnPropertyNames(MouseEvent.prototype).join(','));
</script>
