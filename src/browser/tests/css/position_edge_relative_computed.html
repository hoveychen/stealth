<!--
A `<position>` has two axes however many values it was written with, and Chrome
prints both of them twice over: once as the SPECIFIED value that
`el.style.getPropertyValue` answers, and once as the COMPUTED value that
`getComputedStyle` answers. This engine printed neither, because it had no
position value at all -- it kept the author's tokens and mapped a keyword to a
percentage one word at a time.

Both serializations are measured, not read off a spec
(scratch/b92/expr-position-edge.js, 33 values x these 5 properties = 165
readings on Chrome 151; 80 of them disagreed before this test):

  SPECIFIED   Horizontal axis first, the axis the author left out filled in as
              `center`, and a unitless zero written `0px`. So `center left` is
              `left center`, `bottom 20px right 10px` is `right 10px bottom
              20px`, `30%` is `30% center` and `right 0 bottom 0` is `right 0px
              bottom 0px`. The value keeps the arity its axes need -- one and
              two values both print two, three prints three, four prints four --
              because an axis prints its edge keyword and its offset, and only
              the ones it has.

  COMPUTED    Exactly two components (three on transform-origin, whose z offset
              is a third), each an offset from the axis's START edge, because
              that is the only origin a single component can be measured from:

                left / top      the offset itself, `0%` when there is none
                center          `50%`
                right / bottom  the box minus the offset -- `100%` bare,
                                `calc(100% - 10px)` with one

              A percentage offset folds into the arithmetic rather than staying
              in a calc (`right 30%` is `70%`, not `calc(100% - 30%)`), a zero
              offset folds away entirely (`right 0px` is `100%`), and a length
              in another unit converts first (`right 2em` is
              `calc(100% - 32px)`).

  ...except on perspective-origin and transform-origin, which resolve their
  percentages against the box instead of printing them: on the 100px square
  below, `right 10px top 20px` is `90px 20px` and `right 30%` is `70px`.

`DROPPED` marks a value the property's grammar refuses, where
`getPropertyValue` answers the empty string -- transform-origin takes no
four-value form and the other four take no three-value one. Those refusals are
css/position_grammar_rejects.html's subject; they are carried here so that a
serializer which starts accepting them cannot pass this table by accident.
-->

    const got_specified = [];
    const got_computed = [];
    for (const value of CASES) {
      host.style.cssText = 'width:100px;height:100px';
      // setProperty rather than cssText, so a refused value is refused by its
      // own property's parser and cannot take a neighbour down with it.
      host.style.setProperty(property, value);
      const inline = host.style.getPropertyValue(property);
      if (inline === '') {
        got_specified.push('DROPPED');
        got_computed.push('DROPPED');
        continue;
      }
      got_specified.push(inline);
      got_computed.push(getComputedStyle(host).getPropertyValue(property));
    }
    // Joined into one string per property: a boolean assertion would only ever
    // print "expected true", and what is wanted from a failure here is which
    // value moved.

      `${property} specified: ${got_specified.join(' ; ')}`);
    testing.expectEqual(
      `${property} computed: ${computed.join(' ; ')}`,
