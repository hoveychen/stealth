<!DOCTYPE html>
<script src="../testing.js"></script>
<div id=anchor></div>

<!--
A computed colour is always an `rgb()` or `rgba()` function in a browser. Never a
keyword, never `currentcolor`. Measured on Chrome 151:

  style="color:red"                     color              -> rgb(255, 0, 0)
                                        borderTopColor     -> rgb(255, 0, 0)
  style="color:rgb(1,2,3);
         background-color:currentcolor" backgroundColor    -> rgb(1, 2, 3)

This engine answered `red` for the first — `getComputedStyle(el).color === 'red'`
is one expression that no browser can produce — and `rgb(0, 0, 0)` for the six
longhands whose initial value is `currentcolor`, which is right only while the
element's colour happens to be black.

The `currentcolor` half is not about the keyword being written out. Every one of
these six has `currentcolor` as its *initial* value, so an element that declares
nothing but `color` still has to answer its colour for all of them.
-->

<script id=named_colours_compute_to_rgb>
{
  const probe = (decl, prop) => {
    const host = document.createElement('div');
    host.innerHTML = '<p style="' + decl + '">x</p>';
    document.body.appendChild(host);
    const got = String(getComputedStyle(host.firstChild)[prop]);
    host.remove();
    return got;
  };

  testing.expectEqual('rgb(255, 0, 0)', probe('color:red', 'color'));
  testing.expectEqual('rgb(0, 128, 0)', probe('color:green', 'color'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:white', 'color'));
  testing.expectEqual('rgba(0, 0, 0, 0)', probe('background-color:transparent', 'backgroundColor'));
  testing.expectEqual('rgb(255, 0, 0)', probe('background-color:#f00', 'backgroundColor'));
  testing.expectEqual('rgb(255, 0, 0)', probe('background-color:#ff0000', 'backgroundColor'));
  testing.expectEqual('rgba(255, 0, 0, 0.5)', probe('background-color:rgba(255,0,0,0.5)', 'backgroundColor'));
  // Already canonical, and it stays that way.
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3)', 'color'));

  // A rule reaches the same place the style attribute does.
  const style = document.createElement('style');
  style.textContent = '.cxc{color:red}';
  document.head.appendChild(style);
  const host = document.createElement('div');
  host.innerHTML = '<p class="cxc">x</p>';
  document.body.appendChild(host);
  testing.expectEqual('rgb(255, 0, 0)', getComputedStyle(host.firstChild).color);
  host.remove();
  style.remove();
}
</script>

<script id=currentcolor_resolves_to_the_elements_colour>
{
  const CURRENT = ['borderTopColor', 'borderRightColor', 'borderBottomColor',
                   'borderLeftColor', 'outlineColor', 'textDecorationColor',
                   'caretColor', 'columnRuleColor', 'textEmphasisColor'];

  const probe = (decl) => {
    const host = document.createElement('div');
    host.innerHTML = '<p style="' + decl + '">x</p>';
    document.body.appendChild(host);
    const cs = getComputedStyle(host.firstChild);
    const out = {};
    for (const prop of CURRENT) out[prop] = String(cs[prop]);
    out.backgroundColor = String(cs.backgroundColor);
    host.remove();
    return out;
  };

  // The initial value of all nine is `currentcolor`, so they follow `color`.
  const red = probe('color:red');
  for (const prop of CURRENT) testing.expectEqual(prop + '=rgb(255, 0, 0)', prop + '=' + red[prop]);

  // Written out explicitly, on a property whose initial value it is not.
  testing.expectEqual('rgb(1, 2, 3)',
    probe('color:rgb(1,2,3);background-color:currentcolor').backgroundColor);

  // An element with no colour of its own inherits one, and currentcolor
  // follows the inherited value rather than the initial one.
  const style = document.createElement('style');
  style.textContent = '.cxd{color:rgb(4,5,6)}';
  document.head.appendChild(style);
  const host = document.createElement('div');
  host.innerHTML = '<div class="cxd"><p>x</p></div>';
  document.body.appendChild(host);
  testing.expectEqual('rgb(4, 5, 6)', getComputedStyle(host.firstChild.firstChild).borderTopColor);
  host.remove();
  style.remove();

  // Black is still black.
  const plain = probe('');
  for (const prop of CURRENT) testing.expectEqual(prop + '=rgb(0, 0, 0)', prop + '=' + plain[prop]);
}
</script>

<!--
The CSS system colours, and the identifiers that are not colours at all.

Kasada asks for exactly this at x-hyatt: the funnel capture has it setting
`color` to about ninety keywords in turn and reading the computed value back
with `getPropertyValue('color')` — ninety-three calls, one of the busiest things
it does on the page (tools/fingerprint/results/b55-answers-{lp,chrome}.json).

Chrome resolves the forty-two system colours to `rgb()` and refuses everything
else, so its ninety answers collapse to twelve distinct colours. This engine
answered with the keyword it was handed — `getComputedStyle(el).color ===
'buttonface'` — and accepted the forty-four `-moz-` names that only Firefox has
ever supported, and `FakeColor`, which Kasada plants as its control precisely
because no browser resolves it. 53 of 53 readings differed
(tools/fingerprint/probes/expr-b55-system-colors.js).

The values are Chrome 151 on macOS in light appearance, measured through this
same expression. They are a platform's palette, not a constant: a different
appearance moves them, the same way the voice list and the WebGL renderer
string are this machine's.
-->

<script id=system_colours_compute_to_rgb>
{
  const probe = (decl) => {
    const host = document.createElement('div');
    host.innerHTML = '<p style="' + decl + '">x</p>';
    document.body.appendChild(host);
    const got = String(getComputedStyle(host.firstChild).color);
    host.remove();
    return got;
  };

  testing.expectEqual('rgb(0, 117, 255)', probe('color:accentcolor'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:accentcolortext'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:canvas'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:canvastext'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:field'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:fieldtext'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:buttonborder'));
  testing.expectEqual('rgb(239, 239, 239)', probe('color:buttonface'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:buttontext'));
  testing.expectEqual('rgb(179, 215, 255)', probe('color:selecteditem'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:selecteditemtext'));
  testing.expectEqual('rgb(255, 255, 0)', probe('color:mark'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:marktext'));
  testing.expectEqual('rgb(0, 0, 238)', probe('color:linktext'));
  testing.expectEqual('rgb(85, 26, 139)', probe('color:visitedtext'));
  testing.expectEqual('rgb(255, 0, 0)', probe('color:activetext'));
  testing.expectEqual('rgb(128, 128, 128)', probe('color:graytext'));
  testing.expectEqual('rgba(128, 188, 254, 0.6)', probe('color:highlight'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:highlighttext'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:activeborder'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:activecaption'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:appworkspace'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:background'));
  testing.expectEqual('rgb(239, 239, 239)', probe('color:buttonhighlight'));
  testing.expectEqual('rgb(239, 239, 239)', probe('color:buttonshadow'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:captiontext'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:inactiveborder'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:inactivecaption'));
  testing.expectEqual('rgb(128, 128, 128)', probe('color:inactivecaptiontext'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:infobackground'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:infotext'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:menu'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:menutext'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:scrollbar'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:threeddarkshadow'));
  testing.expectEqual('rgb(239, 239, 239)', probe('color:threedface'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:threedhighlight'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:threedlightshadow'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:threedshadow'));
  testing.expectEqual('rgb(255, 255, 255)', probe('color:window'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:windowframe'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:windowtext'));

  // Case folds, the way every other colour keyword does.
  testing.expectEqual('rgb(239, 239, 239)', probe('color:ButtonFace'));
  testing.expectEqual('rgb(0, 0, 0)', probe('color:CanvasText'));

  // Not colours. The declaration is dropped, so the one before it stands.
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:-moz-ButtonDefault'));
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:-moz-CellHighlight'));
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:-moz-Dialog'));
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:-moz-DialogText'));
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:-moz-Field'));
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:-moz-FieldText'));
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:-moz-mac-accentface'));
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:-moz-mac-focusring'));
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:-moz-hyperlinktext'));
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:-moz-default-color'));
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3);color:FakeColor'));

  // And a system colour still wins over an earlier declaration, so the check
  // above is testing refusal rather than a parser that drops every second
  // declaration.
  testing.expectEqual('rgb(239, 239, 239)', probe('color:rgb(1,2,3);color:buttonface'));
}
</script>
