<!DOCTYPE html>
<script src="../testing.js"></script>
<div id=anchor></div>

<!--
An element that declares nothing takes an inherited property from its parent.
Measured on Chrome 151 with tools/fingerprint/scratch/expr-cascade-scope.js: of
ten properties declared on an *ancestor* and read off the child, six disagreed
here -- and the four that agreed were the four that do not inherit, so the
cascade was being asked only about the element itself.

Which longhands inherit is measured rather than remembered:
tools/fingerprint/dump-css-inherited.mjs gives the parent values until one moves
its own computed value off the initial, then reads the child. 131 of Chrome's
475 computed longhands inherit. The table it writes is
css/chrome_inherited.zig.
-->

<script id=inherits_from_ancestor>
{
  // The rule goes on the grandparent's class, the read on the leaf, so nothing
  // the leaf itself declares can account for the answer.
  const probe = (decl, prop, depth) => {
    const style = document.createElement('style');
    style.textContent = '.cxa{' + decl + '}';
    document.head.appendChild(style);
    const host = document.createElement('div');
    host.innerHTML = '<div class="cxa">' + '<div>'.repeat(depth) + '<p>x</p>' +
      '</div>'.repeat(depth) + '</div>';
    document.body.appendChild(host);
    let el = host.firstChild;
    for (let i = 0; i <= depth; i++) el = el.firstChild;
    const got = String(getComputedStyle(el)[prop]);
    host.remove();
    style.remove();
    return got;
  };

  // Inherited: the leaf reads the ancestor's value.
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3)', 'color', 0));
  testing.expectEqual('Georgia', probe('font-family:Georgia', 'fontFamily', 0));
  testing.expectEqual('italic', probe('font-style:italic', 'fontStyle', 0));
  testing.expectEqual('3px', probe('letter-spacing:3px', 'letterSpacing', 0));
  testing.expectEqual('right', probe('text-align:right', 'textAlign', 0));
  testing.expectEqual('pointer', probe('cursor:pointer', 'cursor', 0));

  // Not inherited: the leaf reads the initial value, not the ancestor's.
  testing.expectEqual('rgba(0, 0, 0, 0)', probe('background-color:rgb(1,2,3)', 'backgroundColor', 0));
  testing.expectEqual('1', probe('opacity:0.25', 'opacity', 0));
  testing.expectEqual('0px',
    probe('border-top-style:solid;border-top-width:5px', 'borderTopWidth', 0));

  // Through several generations, and past elements that declare nothing.
  testing.expectEqual('rgb(1, 2, 3)', probe('color:rgb(1,2,3)', 'color', 4));
  testing.expectEqual('rgba(0, 0, 0, 0)', probe('background-color:rgb(1,2,3)', 'backgroundColor', 4));
}
</script>

<script id=inheritance_stops_at_the_nearest_declaration>
{
  // The nearest ancestor that declares the property wins -- inheritance walks
  // up to the first answer, not to the top.
  const style = document.createElement('style');
  style.textContent = '.outer{color:rgb(1,1,1)}.inner{color:rgb(2,2,2)}';
  document.head.appendChild(style);
  const host = document.createElement('div');
  host.innerHTML = '<div class="outer"><div class="inner"><p id=leaf>x</p></div>' +
    '<p id=sibling>y</p></div>';
  document.body.appendChild(host);

  testing.expectEqual('rgb(2, 2, 2)', getComputedStyle(host.querySelector('#leaf')).color);
  testing.expectEqual('rgb(1, 1, 1)', getComputedStyle(host.querySelector('#sibling')).color);

  // The element's own declaration still outranks anything it would inherit.
  const own = document.createElement('p');
  own.setAttribute('style', 'color:rgb(9,9,9)');
  host.querySelector('.inner').appendChild(own);
  testing.expectEqual('rgb(9, 9, 9)', getComputedStyle(own).color);

  host.remove();
  style.remove();
}
</script>

<script id=inherited_lengths_resolve_at_the_declaring_element>
{
  // An inherited value goes through the same resolution a declared one does,
  // and against the element that *declared* it rather than the one inheriting
  // it: a computed px is what crosses the inheritance boundary, so an ancestor's
  // `letter-spacing:2em` under a 20px font is 40px for the child whatever font
  // size the child itself carries.
  //
  // Measured with tools/fingerprint/scratch/expr-inherited-em.js: Chrome answers
  // 40px for all three of the cases below, including the one where the child's
  // own font size is twice the ancestor's.
  const style = document.createElement('style');
  style.textContent = '.cxa{font-size:20px;letter-spacing:2em}';
  document.head.appendChild(style);
  const host = document.createElement('div');
  host.innerHTML = '<div class="cxa"><p>x</p><p style="font-size:40px">y</p>' +
    '<p style="font-size:2em">z</p></div>';
  document.body.appendChild(host);

  const kids = host.firstChild.children;
  testing.expectEqual('40px', getComputedStyle(kids[0]).letterSpacing);
  testing.expectEqual('40px', getComputedStyle(kids[1]).letterSpacing);
  testing.expectEqual('40px', getComputedStyle(kids[2]).letterSpacing);
  // ...and the child's own font size is its own business.
  testing.expectEqual('40px', getComputedStyle(kids[1]).fontSize);
  testing.expectEqual('40px', getComputedStyle(kids[2]).fontSize);

  host.remove();
  style.remove();
}
</script>
