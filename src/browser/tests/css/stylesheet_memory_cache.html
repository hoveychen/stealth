<!DOCTYPE html>
<script src="../testing.js"></script>

<!--
  The same sheet named twice is one request.

  Measured with tools/fingerprint/wire-census.mjs (both halves of it: the
  server's count and the page's own resource-timing entries): Chrome asks the
  origin once and files one entry, this engine asked twice and filed two. A
  request count is the loudest kind of wire difference -- it does not depend on
  the guard reading any property, only on the origin counting lines in its log.

  Two entries would also be visible to script, and the cf-scrapingcourse guard
  walks the resource-timing buffer entry by entry.
-->
<link rel="stylesheet" href="/wire/dup-sheet.css">
<link rel="stylesheet" href="/wire/dup-sheet.css">

<script id="stylesheet_named_twice_is_one_request" type=module>
{
  const test = await testing.async();
  const deadline = Date.now() + 600;
  const count = () => performance.getEntriesByType('resource')
    .filter((e) => e.name.endsWith('/wire/dup-sheet.css')).length;
  while (Date.now() < deadline && count() < 1) {
    await new Promise((r) => setTimeout(r, 50));
  }
  test.resolve(count());

  await test.done((n) => {
    testing.expectEqual('dup-sheet.css entries: 1', 'dup-sheet.css entries: ' + n);
    // Both links still see the rules: a cache hit is a delivery, not a skip.
    // Counted by href rather than off `document.styleSheets.length`, so the
    // block below can add links of its own without moving this number.
    const sheets = [...document.styleSheets]
      .filter((s) => String(s.href || '').endsWith('/wire/dup-sheet.css')).length;
    testing.expectEqual('dup-sheet.css sheets: 2', 'dup-sheet.css sheets: ' + sheets);
  });
}
</script>

<!--
  ...and still one request when another sheet was fetched in between.

  The cache keys on the resolved URL, and that string was allocated from the
  pooled session arena `loadExternalStylesheet` releases on the way out -- so
  the key pointed at memory the next stylesheet load takes back. Two adjacent
  <link>s hit anyway, which is why the block above passed; put one more fetch
  between them and the key has been overwritten by the time the third link
  looks. Measured on tools/fingerprint/wire-census.mjs, whose page names its
  sheet twice with the rest of the census in between: chrome 1, this engine 2.
-->
<link rel="stylesheet" href="/wire/reused-sheet.css">
<link rel="stylesheet" href="/wire/other-sheet.css">
<script src="/src/browser/tests/shape.js"></script>
<link rel="stylesheet" href="/wire/reused-sheet.css">

<script id="stylesheet_cache_key_outlives_the_fetch" type=module>
{
  const test = await testing.async();
  const deadline = Date.now() + 600;
  const count = (name) => performance.getEntriesByType('resource')
    .filter((e) => e.name.endsWith(name)).length;
  while (Date.now() < deadline && count('/wire/other-sheet.css') < 1) {
    await new Promise((r) => setTimeout(r, 50));
  }
  test.resolve(count('/wire/reused-sheet.css'));

  await test.done((n) => {
    testing.expectEqual('reused-sheet.css entries: 1', 'reused-sheet.css entries: ' + n);
    const sheets = [...document.styleSheets]
      .filter((s) => String(s.href || '').endsWith('/wire/reused-sheet.css')).length;
    testing.expectEqual('reused-sheet.css sheets: 2', 'reused-sheet.css sheets: ' + sheets);
  });
}
</script>

<!--
  ...and a sheet the page preloaded first is not fetched again.

  `<link rel=preload as=style>` followed by `<link rel=stylesheet>` for the same
  href is what Laravel/Vite emits on every page it builds, and it is on
  www.scrapingcourse.com -- the top document of the cf-scrapingcourse station.
  Measured there (tools/fingerprint/run-expr.mjs, both arms, same URL): Chrome
  files ONE resource entry for app-DxJb4DfE.css, this engine filed two, with
  different startTimes, so it went to the origin twice.

  The preload takes `Frame.preloadResource` -> `requestSubresource`, which knows
  nothing about `_stylesheet_bodies`; the stylesheet link then misses the cache
  and asks again. The dedup that already covers two `<link rel=stylesheet>`s has
  to cover this pairing too -- including while the preload is still in flight,
  which is the case on the real page: the second request started twenty
  milliseconds after the first and two hundred before it finished.
-->
<link rel="preload" as="style" href="/wire/preload-only.css">
<link rel="preload" as="style" href="/wire/preloaded-sheet.css">
<link rel="stylesheet" href="/wire/preloaded-sheet.css">

<script id="preloaded_sheet_is_one_request" type=module>
{
  const test = await testing.async();
  // Waits on the preload-only sheet, not on this one: the stylesheet link is
  // fetched synchronously and lands first, so a loop that stops at "one entry
  // exists" would count before the asynchronous preload had even arrived.
  const deadline = Date.now() + 2000;
  const count = (name) => performance.getEntriesByType('resource')
    .filter((e) => e.name.endsWith(name)).length;
  while (Date.now() < deadline && count('/wire/preload-only.css') < 1) {
    await new Promise((r) => setTimeout(r, 50));
  }
  await new Promise((r) => setTimeout(r, 200));
  test.resolve(count('/wire/preloaded-sheet.css'));

  await test.done((n) => {
    const only = performance.getEntriesByType('resource')
      .filter((e) => e.name.endsWith('/wire/preload-only.css')).length;
    testing.expectEqual('preload-only fired: 1, preloaded-sheet entries: 1',
      'preload-only fired: ' + only + ', preloaded-sheet entries: ' + n);
    // The stylesheet link still delivers its rules: a cache hit is a delivery.
    const sheets = [...document.styleSheets]
      .filter((s) => String(s.href || '').endsWith('/wire/preloaded-sheet.css')).length;
    testing.expectEqual('preloaded-sheet.css sheets: 1', 'preloaded-sheet.css sheets: ' + sheets);
  });
}
</script>
