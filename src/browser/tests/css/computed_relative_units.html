<!DOCTYPE html>
<script src="../testing.js"></script>
<div id=anchor></div>

<!--
A computed style never carries the unit the author wrote. `padding-top:2em` on a
20px element computes to `40px` in every browser, because font-relative lengths
resolve at computed-value time. This engine reported the *initial* value for all
of them: `declaredValue`'s `resolvesHere` guard refuses anything it cannot
finish resolving, which was never worse than answering `2em` — a string Chrome
never prints — but was never right either.

Absolute units were the other half, and they were worse than the guard: `pt`,
`cm`, `mm`, `in` and `pc` are not in RELATIVE_UNITS, so they went straight
through and `padding-top:12pt` read back as `12pt`. Chrome answers `16px`.

Every expected value below is Chrome 151's own, measured with
tools/fingerprint/scratch/expr-relative-units.js on a 400px-wide containing
block.

Deliberately not resolved here, each for a measured reason:

  * ~~**`ex` and `ch`.**~~ Resolved now — see the block below. The ratios are
    font metrics, and font_metrics.zig has carried them all along: `ex` is the
    ink ascent of `x` and `ch` is the advance of `0`, both already measured per
    family at basis 100.
  * **`calc()`**, which needs an evaluator and is its own task.
-->

<script id=font_relative_lengths>
{
  const probe = (decl, prop) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<div style="width:400px;font-size:20px"><p style="' + decl + '">x</p></div>';
    const got = String(getComputedStyle(host.firstChild.firstChild)[prop]);
    host.remove();
    return got;
  };

  const CASES = [
    // `em` is the element's own computed font size.
    ['40px', 'font-size:20px;padding-top:2em', 'paddingTop'],
    ['30px', 'font-size:20px;margin-left:1.5em', 'marginLeft'],
    ['10px', 'font-size:20px;border-top-style:solid;border-top-width:0.5em', 'borderTopWidth'],
    ['2px', 'font-size:20px;letter-spacing:0.1em', 'letterSpacing'],
    ['40px', 'font-size:20px;text-indent:2em', 'textIndent'],
    // ...including one it inherited rather than declared.
    ['40px', 'padding-top:2em', 'paddingTop'],
    // On `font-size` itself, `em` is the *parent's* size, not the element's.
    ['30px', 'font-size:1.5em', 'fontSize'],
    // `rem` is the root's, which nothing here changed: 16px.
    ['32px', 'padding-top:2rem', 'paddingTop'],
    ['24px', 'font-size:20px;padding-top:1.5rem', 'paddingTop'],
  ];
  const wrong = [];
  for (const [want, decl, prop] of CASES) {
    const got = probe(decl, prop);
    if (got !== want) wrong.push(decl + ' -> ' + prop + ': want ' + want + ', got ' + got);
  }
  testing.expectEqual('', wrong.join(' | '));
}
</script>

<script id=ex_ch_are_font_metrics>
{
  // `ex` is the font's x-height and `ch` the advance of its `0`, so both are
  // per-family constants and neither is derivable from the font size alone.
  // This engine answered a flat `0px` for every one of them, which is worse
  // than a wrong ratio: a whole family of measurements collapsing onto one
  // value is what a probe that cannot tell its inputs apart looks like.
  //
  // Every expected string is Chrome 151's own, measured HEADED (a headless
  // Chrome resolves serif, sans-serif and monospace to one face) at device
  // scale factor 2, with tools/fingerprint/probes/expr-b85-ex-ch-20px.js.
  const probe = (decl) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<div style="width:400px;font-size:20px"><p style="' + decl + '">x</p></div>';
    const got = String(getComputedStyle(host.firstChild.firstChild).paddingTop);
    host.remove();
    return got;
  };

  const CASES = [
    ['17.9492px', 'font-family:serif;padding-top:2ex'],
    ['20px', 'font-family:serif;padding-top:2ch'],
    ['20.918px', 'font-family:sans-serif;padding-top:2ex'],
    ['22.2461px', 'font-family:sans-serif;padding-top:2ch'],
    ['21.875px', 'font-family:monospace;padding-top:2ex'],
    ['24.082px', 'font-family:monospace;padding-top:2ch'],
    ['20.7422px', 'font-family:Arial;padding-top:2ex'],
    ['22.2461px', 'font-family:Arial;padding-top:2ch'],
    ['19.2578px', 'font-family:Georgia;padding-top:2ex'],
    ['24.5508px', 'font-family:Georgia;padding-top:2ch'],
    ['21.8164px', 'font-family:Verdana;padding-top:2ex'],
    ['25.4297px', 'font-family:Verdana;padding-top:2ch'],
  ];
  const wrong = [];
  for (const [want, decl] of CASES) {
    const got = probe(decl);
    if (got !== want) wrong.push(decl + ': want ' + want + ', got ' + got);
  }
  testing.expectEqual('', wrong.join(' | '));
}
</script>

<!--
The absolute units, which need no context at all — 96px to the inch, CSS Values
§6.2. These were reported verbatim before, which is the one shape a computed
style can never have.
-->

<script id=absolute_lengths>
{
  const probe = (decl) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<p style="' + decl + '">x</p>';
    const got = String(getComputedStyle(host.firstChild).paddingTop);
    host.remove();
    return got;
  };

  const CASES = [
    ['16px', 'padding-top:12pt'],
    ['37.7953px', 'padding-top:1cm'],
    ['3.77953px', 'padding-top:1mm'],
    ['96px', 'padding-top:1in'],
    ['16px', 'padding-top:1pc'],
    ['0.944882px', 'padding-top:1Q'],
    ['9px', 'padding-top:9px'],
  ];
  const wrong = [];
  for (const [want, decl] of CASES) {
    const got = probe(decl);
    if (got !== want) wrong.push(decl + ': want ' + want + ', got ' + got);
  }
  testing.expectEqual('', wrong.join(' | '));
}
</script>

<!--
Viewport units, asserted against the viewport this run happens to have rather
than against a number, so the test says what the unit *means* instead of what
one window size produced.
-->

<script id=viewport_lengths>
{
  const probe = (decl) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<p style="' + decl + '">x</p>';
    const got = parseFloat(getComputedStyle(host.firstChild).paddingTop);
    host.remove();
    return got;
  };

  const near = (want, got) => Math.abs(want - got) < 0.01;
  testing.expectEqual(true, near(innerWidth / 10, probe('padding-top:10vw')));
  testing.expectEqual(true, near(innerHeight / 10, probe('padding-top:10vh')));
  testing.expectEqual(true, near(Math.min(innerWidth, innerHeight) / 10, probe('padding-top:10vmin')));
  testing.expectEqual(true, near(Math.max(innerWidth, innerHeight) / 10, probe('padding-top:10vmax')));
}
</script>

<!--
The two shapes that resolve against a font size rather than a box: a percentage
on `font-size` is the parent's, a percentage or a bare number on `line-height`
is the element's own. Neither needs a containing block, which is why they are
here and the other percentages are not.
-->

<script id=font_relative_percentages>
{
  const probe = (decl, prop) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<div style="width:400px;font-size:20px"><p style="' + decl + '">x</p></div>';
    const got = String(getComputedStyle(host.firstChild.firstChild)[prop]);
    host.remove();
    return got;
  };

  const CASES = [
    ['30px', 'font-size:150%', 'fontSize'],
    ['30px', 'font-size:20px;line-height:150%', 'lineHeight'],
    ['30px', 'font-size:20px;line-height:1.5', 'lineHeight'],
    ['30px', 'line-height:1.5', 'lineHeight'],
  ];
  const wrong = [];
  for (const [want, decl, prop] of CASES) {
    const got = probe(decl, prop);
    if (got !== want) wrong.push(decl + ' -> ' + prop + ': want ' + want + ', got ' + got);
  }
  testing.expectEqual('', wrong.join(' | '));
}
</script>

<!--
And the boundary: what stays on the initial value, because answering it would
mean inventing a containing block or a font metric. `0px` is a value Chrome does
print for these properties; `50%` and `2ex` are values it never prints from a
computed style, so falling back is the whole point rather than a shortcoming to
be papered over.

Chrome's answers here, for the record, are 200px / 200px / 100px / 17.9492px /
15px. The percentages are no longer among the refusals -- box_parts.html resolves
the paddings against the containing block's width and margin_percentage.html the
margins -- so the first three are asserted at Chrome's own numbers below, and
what is left refused is the `ex` and the `calc()`.
-->

<script id=unresolvable_still_falls_through>
{
  const probe = (decl, prop) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<div style="width:400px;font-size:20px"><p style="' + decl + '">x</p></div>';
    const got = String(getComputedStyle(host.firstChild.firstChild)[prop]);
    host.remove();
    return got;
  };

  testing.expectEqual('200px', probe('margin-left:50%', 'marginLeft'));
  // Half of the WIDTH on the vertical side too, which is the reading that says
  // a percentage margin never looks at a height.
  testing.expectEqual('200px', probe('margin-top:50%', 'marginTop'));
  testing.expectEqual('100px', probe('padding-top:25%', 'paddingTop'));
  // `ex` used to be here: it was unresolvable, so it fell through to the
  // initial value. It resolves now (see ex_ch_are_font_metrics), and what is
  // left in this block is `calc()`, which still needs an evaluator.
  testing.expectEqual('0px', probe('padding-top:calc(10px + 5px)', 'paddingTop'));
}
</script>
