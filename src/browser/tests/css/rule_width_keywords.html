<!DOCTYPE html>
<script src="../testing.js"></script>

<!--
  The width keywords, for the width properties that are not a border's.

  `border-*-width` already resolves `thin`/`medium`/`thick` and collapses to
  `0px` when its style is `none`. Every other width property that takes those
  keywords was echoing them back: `outline-width`, `column-rule-width`,
  `row-rule-width`, `-webkit-column-rule-width` and `-webkit-text-stroke-width`
  all computed to the literal string `medium`, which no browser reports.

  Measured on Chrome 151 headed, devicePixelRatio 2
  (scratch/b69/expr-width-keywords.js and scratch/b69/rule-width-fixture.mjs,
  22 declaration sets):

    * The keywords resolve to 1px / 3px / 5px, and the style beside them has no
      say -- `column-rule-style: none` leaves the width at 3px, where a border
      would read 0px.
    * `-webkit-text-stroke-width` has a scale of its own: two thirds of the
      others, 0.666667px / 2px / 3.33333px.
    * An element that declares NO column rule read `1.5px` through Chrome 152,
      not the `3px` its own `medium` resolves to: three DEVICE pixels, 3px on
      both dpr-1 arms (headless, and headless under
      --force-device-scale-factor=1) and 1.5px on both dpr-2 arms (headless
      under =2, and headed), with devicePixelRatio read back in the same run as
      the width every time.

  Chrome 153 stopped folding that one answer onto the device grid: at
  --force-device-scale-factor=2, devicePixelRatio 2 read in the same object,
  the three undeclared rule widths are `3px`. The FRACTIONAL grid did not move
  with them -- `4.6px` is still `4.5px` and `0.1px` still `0.5px` on the four
  snapping names -- so the case below changed and the one after it did not.

  webapi/css/chrome_initial_values.zig used to record 3px for the three rule
  widths for an unrelated reason: its generator launched Chrome with no
  --force-device-scale-factor and so measured a dpr-1 arm. The generator now
  pins the persona's scale, and the override that used to compensate for it in
  CSSStyleDeclaration is gone, so the table alone carries whatever the
  reference browser answers.

  Cloudflare's widget encodes `JSON.stringify(getComputedStyle(el))` whole, so
  all five names travel in the payload of every page it challenges.
-->

<body>

<script id=rule_width_keywords_resolve>
{
  const probe = (decl, prop) => {
    const el = document.createElement('div');
    el.style.cssText = 'width:100px;height:20px;' + decl;
    document.body.appendChild(el);
    const got = String(getComputedStyle(el)[prop]);
    el.remove();
    return got;
  };
  const rows = [];
  const check = (decl, prop, expected) => {
    rows.push(prop + ' {' + decl + '} = ' + probe(decl, prop));
    rows.push(prop + ' {' + decl + '} = ' + expected);
  };

  // The keywords, on the three that share the border scale.
  for (const [kw, px] of [['thin', '1px'], ['medium', '3px'], ['thick', '5px']]) {
    check('outline-width:' + kw + ';', 'outlineWidth', px);
    check('column-rule-width:' + kw + ';', 'columnRuleWidth', px);
    check('row-rule-width:' + kw + ';', 'rowRuleWidth', px);
    check('-webkit-column-rule-width:' + kw + ';', 'webkitColumnRuleWidth', px);
  }

  // The style beside them has no say, which is the whole difference from a
  // border: `border-width: medium` with `border-style: none` is 0px.
  check('column-rule-width:medium;column-rule-style:none;', 'columnRuleWidth', '3px');
  check('outline-width:medium;outline-style:none;', 'outlineWidth', '3px');
  check('border-width:medium;border-style:none;', 'borderTopWidth', '0px');

  // ...and a whole-pixel length still passes through.
  check('column-rule-width:10px;column-rule-style:none;', 'columnRuleWidth', '10px');

  for (let i = 0; i < rows.length; i += 2) {
    testing.expectEqual(rows[i + 1], rows[i]);
  }
}
</script>

<script id=text_stroke_width_has_its_own_scale>
{
  const probe = (decl) => {
    const el = document.createElement('div');
    el.style.cssText = 'width:100px;height:20px;' + decl;
    document.body.appendChild(el);
    const got = String(getComputedStyle(el).webkitTextStrokeWidth);
    el.remove();
    return got;
  };
  for (const [kw, px] of [['thin', '0.666667px'], ['medium', '2px'], ['thick', '3.33333px']]) {
    testing.expectEqual(
      '-webkit-text-stroke-width:' + kw + ' = ' + px,
      '-webkit-text-stroke-width:' + kw + ' = ' + probe('-webkit-text-stroke-width:' + kw + ';'));
  }
}
</script>

<script id=undeclared_rule_width_is_three_css_pixels>
{
  const el = document.createElement('div');
  el.style.cssText = 'width:100px;height:20px;';
  document.body.appendChild(el);
  const cs = getComputedStyle(el);
  const seen = [cs.columnRuleWidth, cs.rowRuleWidth, cs.webkitColumnRuleWidth,
                cs.outlineWidth, cs.borderTopWidth].join(' ');
  el.remove();
  // Three CSS pixels for the rule widths and the outline since 153, and a
  // border with no style is not drawn at all.
  testing.expectEqual('3px 3px 3px 3px 0px', seen);
  testing.expectEqual(2, devicePixelRatio);
}
</script>

<!--
  A FRACTIONAL length lands on the same device pixel grid a used border width
  does -- floored, with a floor of one device pixel -- and these four echoed the
  author's text instead: `outline-width:4.6px` computed to `4.6px` where Chrome
  says `4.5px`, and `0.1px` stayed `0.1px` where Chrome draws half a pixel.

  `-webkit-text-stroke-width` is the one that does NOT: it echoes the length
  unrounded at any ratio, which fits the scale of its own the keywords already
  showed. So the grid is a property of the four, not of the family.

  Measured on Chrome 151 at `--force-device-scale-factor=2`, with
  devicePixelRatio reported in the same object as the widths
  (scratch/b72/expr-rule-grid.js and expr-rule-grid2.js, readings in
  scratch/b72/ch-rule-dsf2.json and ch-rule2-dsf2.json). Same grid and same
  measurement as css/computed_border_width.html's; see Element.usedWidthUnit.
-->

<script id=fractional_rule_width_is_a_device_pixel>
{
  const probe = (decl, prop) => {
    const el = document.createElement('div');
    el.style.cssText = 'width:100px;height:20px;' + decl;
    document.body.appendChild(el);
    const got = String(getComputedStyle(el)[prop]);
    el.remove();
    return got;
  };

  // width, then what the four snapping names compute it to.
  const CASES = [
    ['0px', '0px'],
    ['0.1px', '0.5px'],
    ['0.4px', '0.5px'],
    ['1.4px', '1px'],
    ['1.5px', '1.5px'],
    ['3.6px', '3.5px'],
    ['4.6px', '4.5px'],
    ['10.9px', '10.5px'],
  ];
  const NAMES = [
    ['outline-width', 'outlineWidth'],
    ['column-rule-width', 'columnRuleWidth'],
    ['row-rule-width', 'rowRuleWidth'],
    ['-webkit-column-rule-width', 'webkitColumnRuleWidth'],
  ];

  const wrong = [];
  for (const [width, want] of CASES) {
    for (const [name, prop] of NAMES) {
      const got = probe(name + ':' + width + ';', prop);
      if (got !== want) wrong.push(name + ':' + width + ': want ' + want + ', got ' + got);
    }
    // The stroke width keeps the author's number at the same ratio.
    const stroke = probe('-webkit-text-stroke-width:' + width + ';', 'webkitTextStrokeWidth');
    if (stroke !== width) {
      wrong.push('-webkit-text-stroke-width:' + width + ': want ' + width + ', got ' + stroke);
    }
  }
  testing.expectEqual(2, devicePixelRatio);
  testing.expectEqual('', wrong.join(' | '));
}
</script>
