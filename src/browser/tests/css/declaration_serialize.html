<!DOCTYPE html>
<body>
<script src="../testing.js"></script>

<!--
  What a `style=` attribute reads back as after the CSSOM has been asked to
  change it. Every expectation was measured on a headed Chrome 151 over
  http://127.0.0.1 by tools/fingerprint/probes/probe-css13.js.

  The rule the probe found: the attribute is rewritten only when the
  declaration block actually changed. A change that changes nothing -- removing
  a property that was never there, removing a custom property under the wrong
  case, setting a property to the value it already holds -- leaves the authored
  text alone, down to the semicolon it was written without. Chrome's own
  serialisation always ends in `; `, so a resync on a no-op is visible: the
  attribute grows a semicolon no author typed.
-->

<script>
// Helper block (no id, so the runner does not treat it as a test).
const authored = 'width: 10px; display: block; --Case: 1px';
function withStyle(text) {
    const el = document.createElement('div');
    el.setAttribute('style', text);
    (document.body || document.documentElement).appendChild(el);
    return el;
}
</script>

<script id="no_op_mutations_leave_the_attribute_alone">
{
    // Reading never rewrites.
    const read = withStyle(authored);
    void read.style.width;
    void read.style.cssText;
    void read.style.length;
    void read.attributeStyleMap.get('width');
    testing.expectEqual(authored, read.getAttribute('style'));

    // Removing a property that is not there.
    const absent = withStyle(authored);
    testing.expectEqual('', absent.style.removeProperty('height'));
    testing.expectEqual(authored, absent.getAttribute('style'));

    // Removing a custom property that is not there, and one that is there
    // under a different case -- custom property names are case-sensitive.
    const absent_custom = withStyle(authored);
    absent_custom.style.removeProperty('--nope');
    testing.expectEqual(authored, absent_custom.getAttribute('style'));
    const wrong_case = withStyle(authored);
    wrong_case.style.removeProperty('--case');
    testing.expectEqual(authored, wrong_case.getAttribute('style'));

    // Setting a property to the value it already holds.
    const same = withStyle(authored);
    same.style.setProperty('width', '10px');
    testing.expectEqual(authored, same.getAttribute('style'));

    // Setting a property that is not there to the empty string, which is the
    // spec's spelling of "remove it".
    const empty = withStyle(authored);
    empty.style.setProperty('height', '');
    testing.expectEqual(authored, empty.getAttribute('style'));

    // The Typed OM's delete takes the same path.
    const map_delete = withStyle(authored);
    map_delete.attributeStyleMap.delete('height');
    testing.expectEqual(authored, map_delete.getAttribute('style'));
}
</script>

<script id="real_mutations_do_rewrite_the_attribute">
{
    // A property that was there comes out, and the rewrite is Chrome's own
    // serialisation -- every declaration followed by "; ", so the text now
    // ends in a semicolon the authored text did not have.
    const removed = withStyle(authored);
    testing.expectEqual('10px', removed.style.removeProperty('width'));
    testing.expectEqual('display: block; --Case: 1px;', removed.getAttribute('style'));

    // A new property, and a changed value.
    const added = withStyle(authored);
    added.style.setProperty('height', '5px');
    testing.expectEqual('width: 10px; display: block; --Case: 1px; height: 5px;', added.getAttribute('style'));
    const changed = withStyle(authored);
    changed.style.setProperty('width', '20px');
    testing.expectEqual('width: 20px; display: block; --Case: 1px;', changed.getAttribute('style'));

    // Assigning cssText rewrites even when the text is what it already was.
    const round = withStyle(authored);
    round.style.cssText = round.style.cssText;
    testing.expectEqual('width: 10px; display: block; --Case: 1px;', round.getAttribute('style'));
}
</script>

<script id="value_case_is_canonicalised_in_four_places">
{
    const round = (text) => withStyle(text).style.cssText;

    // A keyword the property takes, from the measured per-property table.
    testing.expectEqual('display: block;', round('display: BLOCK'));
    testing.expectEqual('position: absolute;', round('position: Absolute'));
    testing.expectEqual('color: red;', round('color: RED'));
    testing.expectEqual('overflow: hidden visible;', round('overflow: HIDDEN Visible'));

    // A CSS-wide keyword, which every property takes.
    testing.expectEqual('width: inherit;', round('width: INHERIT'));
    testing.expectEqual('display: unset;', round('display: Unset'));

    // A dimension's unit, wherever the dimension sits in the value.
    testing.expectEqual('width: 10px;', round('width: 10PX'));
    testing.expectEqual('width: 10em;', round('width: 10EM'));
    testing.expectEqual('margin: 1px 2px;', round('margin: 1PX 2Px'));

    // A function name, in Chrome's spelling rather than lowercased: the
    // transform functions are the reason a blanket toLowerCase() is wrong.
    testing.expectEqual('color: rgb(1, 2, 3);', round('color: RGB(1, 2, 3)'));
    testing.expectEqual('background-color: rgba(1, 2, 3, 0.5);', round('background-color: RGBA(1, 2, 3, 0.5)'));
    testing.expectEqual('transform: translateX(1px);', round('transform: TranslateX(1PX)'));

    // !important is not part of the value, and was already lowercased.
    testing.expectEqual('color: red !important;', round('color: RED !IMPORTANT'));

    // setProperty and the camelCase attribute take the same path as parsing
    // the attribute text.
    const set = withStyle('');
    set.style.setProperty('color', 'RED');
    testing.expectEqual('red', set.style.color);
    testing.expectEqual('color: red;', set.getAttribute('style'));
    const camel = withStyle('');
    camel.style.color = 'RED';
    testing.expectEqual('red', camel.style.color);
    testing.expectEqual('color: red;', camel.getAttribute('style'));
}
</script>

<script id="value_case_is_left_alone_everywhere_else">
{
    const round = (text) => withStyle(text).style.cssText;

    // A <custom-ident>: the property takes any identifier, so none of them is
    // a keyword to canonicalise.
    testing.expectEqual('font-family: MyOwnFont;', round('font-family: MyOwnFont'));
    // ... but a generic family is a keyword even there, and it is measured by
    // the re-casing rather than by acceptance: Chrome accepts both.
    testing.expectEqual('font-family: sans-serif;', round('font-family: SANS-SERIF'));
    testing.expectEqual('animation-name: MyAnim;', round('animation-name: MyAnim'));
    testing.expectEqual('grid-area: MyArea;', round('grid-area: MyArea'));
    testing.expectEqual('counter-reset: MyCounter 3;', round('counter-reset: MyCounter 3'));
    // A counter name carries a count, and the one it is written without is
    // filled in: measured, `counter-increment` defaults to 1 and
    // `counter-reset` / `counter-set` to 0, per name and not per declaration.
    testing.expectEqual('counter-increment: MyCounter 1;', round('counter-increment: MyCounter'));
    testing.expectEqual('counter-increment: c 5;', round('counter-increment: c 5'));
    testing.expectEqual('counter-increment: a 1 b 1;', round('counter-increment: a b'));
    testing.expectEqual('counter-increment: a 2 b 1;', round('counter-increment: a 2 b'));
    testing.expectEqual('counter-reset: c 0;', round('counter-reset: c'));
    testing.expectEqual('counter-reset: a 0 b 0 c 0;', round('counter-reset: a b c'));
    testing.expectEqual('counter-set: c 0;', round('counter-set: c'));
    // ... except that `none` is the whole value rather than a counter name.
    testing.expectEqual('counter-increment: none;', round('counter-increment: none'));
    testing.expectEqual('counter-reset: none;', round('counter-reset: none'));
    testing.expectEqual('counter-set: none;', round('counter-set: none'));
    const family = withStyle('');
    family.style.setProperty('font-family', 'MyOwnFont');
    testing.expectEqual('MyOwnFont', family.style.fontFamily);

    // A string is content, not syntax.
    testing.expectEqual('content: "MiXeD";', round('content: "MiXeD"'));

    // A custom property is stored as written, name and value both.
    testing.expectEqual('--Case: MiXeD Value;', round('--Case: MiXeD Value'));
    testing.expectEqual('MiXeD Value', withStyle('--Case: MiXeD Value').style.getPropertyValue('--Case'));

    // A value whose real content is substituted later is frozen whole: the
    // function name is not re-cased and neither is anything around it.
    testing.expectEqual('width: VAR(--Foo);', round('width: VAR(--Foo)'));
    testing.expectEqual('content: ATTR(Data-X);', round('content: ATTR(Data-X)'));
    testing.expectEqual('width: CALC(1PX + VAR(--a));', round('width: CALC(1PX + VAR(--a))'));
}
</script>

<script id="a_font_family_loses_quotes_it_does_not_need">
{
    const round = (text) => withStyle(text).style.cssText;

    // Measured: a quoted family name is unquoted when its content is one
    // identifier, and left quoted otherwise. The quotes are what tell a family
    // called "monospace" from the generic keyword, so a name that spells a
    // keyword keeps them -- and that comparison is case-sensitive, which is why
    // "MONOSPACE" comes out bare and is not then re-cased into the keyword.
    testing.expectEqual('font-family: MyOwnFont;', round('font-family: "MyOwnFont"'));
    testing.expectEqual('font-family: MyOwnFont;', round("font-family: 'MyOwnFont'"));
    testing.expectEqual('font-family: Arial;', round('font-family: "Arial"'));
    testing.expectEqual('font-family: a-b;', round('font-family: "a-b"'));
    testing.expectEqual('font-family: -a;', round('font-family: "-a"'));
    testing.expectEqual('font-family: a1;', round('font-family: "a1"'));
    testing.expectEqual('font-family: a_b;', round('font-family: "a_b"'));
    testing.expectEqual('font-family: MONOSPACE;', round('font-family: "MONOSPACE"'));

    // Not one identifier, or one that would read as something else bare.
    testing.expectEqual('font-family: "a b";', round('font-family: "a b"'));
    testing.expectEqual('font-family: "a,b";', round('font-family: "a,b"'));
    testing.expectEqual('font-family: "1a";', round('font-family: "1a"'));
    testing.expectEqual('font-family: "--a";', round('font-family: "--a"'));
    testing.expectEqual('font-family: "";', round('font-family: ""'));
    testing.expectEqual('font-family: "monospace";', round('font-family: "monospace"'));
    testing.expectEqual('font-family: "inherit";', round('font-family: "inherit"'));

    // A name that stays quoted is quoted with double quotes, and its escapes
    // are resolved first -- `\31 a` is the name `1a`, which cannot go bare.
    testing.expectEqual('font-family: "a b";', round("font-family: 'a b'"));
    testing.expectEqual('font-family: "1a";', round('font-family: "\\31 a"'));

    // Every name in a list is judged on its own, and the font shorthand
    // carries a family too.
    testing.expectEqual(
        'font-family: MyOwnFont, "Other One", monospace;',
        round('font-family: "MyOwnFont", "Other One", monospace'));
    testing.expectEqual('font: 12px MyFont;', round('font: 12px "MyFont"'));
    testing.expectEqual('font: 12px "My Font";', round('font: 12px "My Font"'));

    // Only a family name: a string anywhere else is content.
    testing.expectEqual('content: "MiXeD";', round('content: "MiXeD"'));
    testing.expectEqual('content: "monospace";', round('content: "monospace"'));
}
</script>

<script id="a_number_is_reprinted_by_chromes_printer">
{
    const round = (text) => withStyle(text).style.cssText;

    // Measured: a number in a declaration is reprinted rather than echoed. The
    // printer is printf `%g` -- six significant digits, trailing zeros dropped,
    // scientific notation once the exponent leaves [-4, 6) with the exponent
    // padded to two digits -- over a value clamped to the float range.
    testing.expectEqual('width: 100px;', round('width: 1E2px'));
    testing.expectEqual('width: 100px;', round('width: 1e2px'));
    testing.expectEqual('width: 100px;', round('width: 1E+2px'));
    testing.expectEqual('width: 0.01px;', round('width: 1E-2px'));
    testing.expectEqual('width: 1.5px;', round('width: 1.50px'));
    testing.expectEqual('width: 1px;', round('width: 1.0px'));
    testing.expectEqual('width: 0.5px;', round('width: 0.50000px'));
    testing.expectEqual('width: 1.5px;', round('width: 01.5px'));
    testing.expectEqual('width: 1px;', round('width: +1px'));
    testing.expectEqual('width: 0.5px;', round('width: .5px'));
    testing.expectEqual('width: 0px;', round('width: -0px'));
    testing.expectEqual('width: 0px;', round('width: +0.0px'));

    // Six significant digits, and the exponent thresholds either side.
    testing.expectEqual('width: 100px;', round('width: 100.000001px'));
    testing.expectEqual('width: 3.14159px;', round('width: 3.14159265358979px'));
    testing.expectEqual('width: 33.3333%;', round('width: 33.333333333%'));
    testing.expectEqual('width: 1e+06px;', round('width: 999999.9px'));
    testing.expectEqual('width: 1e-06px;', round('width: 0.000001px'));
    testing.expectEqual('width: 1e-07px;', round('width: 0.0000001px'));

    // The clamp is to the float range, not to float precision: 1e100 comes
    // back as FLT_MAX, while 1e-40 -- which no float can hold to six digits --
    // keeps all of them.
    testing.expectEqual('width: 3.40282e+38px;', round('width: 1e100px'));
    testing.expectEqual('width: 3.40282e+38px;', round('width: 3.4028236e38px'));
    testing.expectEqual('width: 1e-40px;', round('width: 1e-40px'));
    testing.expectEqual('width: 1e-46px;', round('width: 1e-46px'));

    // Every dimension in the value, inside a function or a shorthand alike.
    testing.expectEqual('margin: 10px 20px;', round('margin: 1E1px 2E1px'));
    testing.expectEqual('margin: 1.5px -2px 3px 0.5px;', round('margin: 1.500px -2.0px +3px .5px'));
    testing.expectEqual('transform: scale(10);', round('transform: scale(1E1)'));
    testing.expectEqual('transform: translateX(1.5px);', round('transform: translateX(1.50px)'));
    testing.expectEqual('width: calc(100px);', round('width: calc(1E2px)'));
    testing.expectEqual('grid-template-columns: 10fr;', round('grid-template-columns: 1E1fr'));
    testing.expectEqual('transition-duration: 1000ms;', round('transition-duration: 1E3ms'));
    testing.expectEqual('opacity: 0.5;', round('opacity: 0.500'));
    testing.expectEqual('line-height: 1;', round('line-height: 1.0'));

    // An <integer> is printed as an integer rather than through %g, so it keeps
    // its digits past the sixth -- and it is clamped to the 32-bit range, which
    // is what Blink parses it into.
    testing.expectEqual('z-index: 1000000;', round('z-index: 1000000'));
    testing.expectEqual('z-index: 2147483647;', round('z-index: 2147483647'));
    testing.expectEqual('z-index: 2147483647;', round('z-index: 3000000000'));
    testing.expectEqual('z-index: -2147483648;', round('z-index: -3000000000'));
    testing.expectEqual('order: 10;', round('order: 010'));
    testing.expectEqual('order: 1;', round('order: +1'));
    testing.expectEqual('counter-increment: c 1000000;', round('counter-increment: c 1000000'));
    testing.expectEqual('font-feature-settings: "liga" 1000000;', round('font-feature-settings: "liga" 1000000'));
    // ... including the two functions whose first argument is one.
    testing.expectEqual(
        'grid-template-columns: repeat(1000000, 1px);',
        round('grid-template-columns: repeat(1000000, 1px)'));
    testing.expectEqual(
        'transition-timing-function: steps(1000000, jump-start);',
        round('transition-timing-function: steps(1000000, jump-start)'));
    // Anywhere else the same digits are a <number>, and go through %g.
    testing.expectEqual('flex-grow: 1e+06;', round('flex-grow: 1000000'));
    testing.expectEqual('width: 1.23457e+06px;', round('width: 1234567px'));
    testing.expectEqual('transform: scale(1e+06);', round('transform: scale(1000000)'));
    // A dimension is a <number> even in a property whose bare value is an
    // <integer>: only the unitless token is the integer.
    testing.expectEqual('columns: 1e+06px;', round('columns: 1000000px'));

    // A number that is not a value is left alone: inside a string, inside a
    // url(), inside a substituted value, and in a custom property.
    testing.expectEqual('content: ".5";', round('content: ".5"'));
    testing.expectEqual('content: "1.50px";', round('content: "1.50px"'));
    testing.expectEqual('background-image: url(".5");', round('background-image: url(.5)'));
    testing.expectEqual('width: var(--a, .5px);', round('width: var(--a, .5px)'));
    testing.expectEqual('width: env(safe-area-inset-top, .5px);', round('width: env(safe-area-inset-top, .5px)'));
    testing.expectEqual('--c: 01.50;', round('--c: 01.50'));
}
</script>

<script id="a_colour_folds_to_rgb_or_rgba">
{
    const round = (text) => withStyle(text).style.cssText;

    // Measured: a hex colour is answered as rgb(), or as rgba() when its alpha
    // is not opaque. Three and four digit forms double each nibble.
    testing.expectEqual('color: rgb(170, 187, 204);', round('color: #AABBCC'));
    testing.expectEqual('color: rgb(170, 187, 204);', round('color: #abc'));
    testing.expectEqual('color: rgb(170, 187, 204);', round('color: #ABC'));
    testing.expectEqual('color: rgb(0, 0, 0);', round('color: #000'));
    testing.expectEqual('color: rgb(255, 255, 255);', round('color: #FFFFFF'));
    testing.expectEqual('color: rgb(170, 187, 204);', round('color: #AABBCCFF'));
    testing.expectEqual('color: rgba(170, 187, 204, 0);', round('color: #AABBCC00'));
    testing.expectEqual('color: rgba(170, 187, 204, 0.867);', round('color: #AABBCCDD'));
    testing.expectEqual('color: rgba(170, 187, 204, 0.498);', round('color: #AABBCC7F'));
    testing.expectEqual('color: rgba(170, 187, 204, 0.867);', round('color: #ABCD'));
    testing.expectEqual('color: rgba(17, 34, 51, 0.267);', round('color: #1234'));

    // The alpha is the shortest one, two or three decimal number that rounds
    // back to the same 8-bit alpha byte -- which is why 221/255 is `0.867` but
    // 158/255 is `0.62`, and why an alpha under half a byte is plain `0`.
    const alpha = (a) => round(`color: rgba(1, 2, 3, ${a})`);
    testing.expectEqual('color: rgba(1, 2, 3, 0.5);', alpha('0.5'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.25);', alpha('0.25'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.125);', alpha('0.125'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.063);', alpha('0.0625'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.62);', alpha('0.618'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.12);', alpha('0.1235'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.086);', alpha('0.08666667'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.008);', alpha('0.008666667'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.004);', alpha('0.002'));
    testing.expectEqual('color: rgba(1, 2, 3, 0);', alpha('0.001'));
    testing.expectEqual('color: rgba(1, 2, 3, 0);', alpha('0.0005'));
    testing.expectEqual('color: rgba(1, 2, 3, 0);', alpha('-1'));
    testing.expectEqual('color: rgb(1, 2, 3);', alpha('0.999'));
    testing.expectEqual('color: rgb(1, 2, 3);', alpha('1'));
    testing.expectEqual('color: rgb(1, 2, 3);', alpha('1.5'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.5);', alpha('50%'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.333);', alpha('0.3333333'));

    // rgb() and rgba() are one function: the space separated form becomes the
    // comma separated one, an alpha of 1 drops back to rgb(), and a component
    // is rounded to a byte -- from a percentage of 255 when it is written as
    // one -- and clamped there.
    testing.expectEqual('color: rgb(1, 2, 3);', round('color: rgb(1 2 3)'));
    testing.expectEqual('color: rgb(1, 2, 3);', round('color: rgb( 1 , 2 , 3 )'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.5);', round('color: rgb(1 2 3 / 50%)'));
    testing.expectEqual('color: rgba(1, 2, 3, 0.5);', round('color: rgb(1,2,3,0.5)'));
    testing.expectEqual('color: rgb(1, 2, 3);', round('color: rgba(1,2,3,1)'));
    testing.expectEqual('color: rgb(1, 2, 3);', round('color: rgb(1 2 3 / 1)'));
    testing.expectEqual('color: rgb(255, 0, 3);', round('color: rgb(300, -5, 2.6)'));
    testing.expectEqual('color: rgb(2, 3, 4);', round('color: rgb(2.4, 2.5, 3.5)'));
    testing.expectEqual('color: rgb(1, 2, 255);', round('color: rgb(0.5 1.5 254.5)'));
    testing.expectEqual('color: rgb(128, 64, 0);', round('color: rgb(50%, 25%, 0%)'));
    testing.expectEqual('color: rgb(85, 3, 1);', round('color: rgb(33.333%, 1%, 0.4%)'));
    testing.expectEqual('color: rgb(2, 255, 255);', round('color: rgb(0.6% 99.9% 100.4%)'));
    testing.expectEqual('color: rgb(100, 2, 3);', round('color: rgb(1e2 2 3)'));
    testing.expectEqual('color: rgb(0, 2, 3);', round('color: rgb(none 2 3)'));
    testing.expectEqual('color: rgba(1, 2, 3, 0);', round('color: rgb(1 2 3 / none)'));

    // hsl() and hwb() are answered as rgb() too, so the conversion is ours to
    // do. A hue takes any angle unit and wraps; a saturation, lightness,
    // whiteness or blackness clamps; a whiteness and blackness summing past
    // 100% is the grey between them.
    testing.expectEqual('color: rgb(64, 191, 64);', round('color: hsl(120, 50%, 50%)'));
    testing.expectEqual('color: rgba(64, 191, 64, 0.5);', round('color: hsl(120deg 50% 50% / 0.5)'));
    testing.expectEqual('color: rgba(64, 191, 64, 0.25);', round('color: hsla(120, 50%, 50%, 0.25)'));
    testing.expectEqual('color: rgb(64, 191, 191);', round('color: hsl(0.5turn 50% 50%)'));
    testing.expectEqual('color: rgb(128, 191, 64);', round('color: hsl(100grad 50% 50%)'));
    testing.expectEqual('color: rgb(75, 191, 64);', round('color: hsl(2rad 50% 50%)'));
    testing.expectEqual('color: rgb(191, 149, 64);', round('color: hsl(400 50% 50%)'));
    testing.expectEqual('color: rgb(191, 64, 128);', round('color: hsl(-30 50% 50%)'));
    testing.expectEqual('color: rgb(191, 64, 64);', round('color: hsl(none 50% 50%)'));
    testing.expectEqual('color: rgb(128, 128, 128);', round('color: hsl(120 0% 50%)'));
    testing.expectEqual('color: rgb(128, 128, 128);', round('color: hsl(120 -50% 50%)'));
    testing.expectEqual('color: rgb(0, 255, 0);', round('color: hsl(120 200% 50%)'));
    testing.expectEqual('color: rgb(255, 255, 255);', round('color: hsl(120 50% 150%)'));
    testing.expectEqual('color: rgb(65, 193, 65);', round('color: hsl(120 50.5% 50.5%)'));
    testing.expectEqual('color: rgb(51, 179, 51);', round('color: hwb(120 20% 30%)'));
    testing.expectEqual('color: rgb(51, 179, 51);', round('color: hwb(120deg 20% 30%)'));
    testing.expectEqual('color: rgba(51, 179, 51, 0.5);', round('color: hwb(120 20% 30% / 0.5)'));
    testing.expectEqual('color: rgb(116, 116, 116);', round('color: hwb(120 50% 60%)'));
    testing.expectEqual('color: rgb(0, 255, 0);', round('color: hwb(120 0% 0%)'));
    testing.expectEqual('color: rgb(179, 51, 51);', round('color: hwb(none 20% 30%)'));

    // Wherever the colour sits, and whatever case it was written in.
    testing.expectEqual('border: 1px solid rgb(170, 187, 204);', round('border: 1px solid #ABC'));
    testing.expectEqual('background-color: rgb(1, 2, 3);', round('background-color: RGB(1, 2, 3)'));
    testing.expectEqual(
        'text-decoration-color: rgba(64, 191, 64, 0.25);',
        round('text-decoration-color: HSLA(120, 50%, 50%, 0.25)'));
    testing.expectEqual(
        'background-image: linear-gradient(rgb(170, 187, 204), rgb(18, 52, 86));',
        round('background-image: linear-gradient(#AABBCC, #123456)'));

    // What is left alone: a named colour, a colour space Chrome does not fold
    // to rgb(), and a colour whose arguments are not plain numbers.
    testing.expectEqual('color: rebeccapurple;', round('color: rebeccapurple'));
    testing.expectEqual('color: transparent;', round('color: transparent'));
    // `currentColor` is a keyword rather than a colour to fold, and a keyword's
    // canonical spelling is its lower case one -- see the block below.
    testing.expectEqual('color: currentcolor;', round('color: currentColor'));
    testing.expectEqual('color: oklch(0.5 0.1 200);', round('color: oklch(0.5 0.1 200)'));
    testing.expectEqual('color: color(srgb 1 0 0);', round('color: color(srgb 1 0 0)'));
    testing.expectEqual('color: color-mix(in srgb, red, blue);', round('color: color-mix(in srgb, red, blue)'));
    testing.expectEqual('color: light-dark(red, blue);', round('color: light-dark(red, blue)'));
    testing.expectEqual('color: rgb(from red r g b);', round('color: rgb(from red r g b)'));
    testing.expectEqual('color: VAR(--a, #AABBCC);', round('color: VAR(--a, #AABBCC)'));
    testing.expectEqual('--c: #AABBCC;', round('--c: #AABBCC'));

    // A hex of any other length is not a colour at all. Chrome drops the whole
    // declaration; this engine keeps invalid values, which is the same
    // already-recorded difference the value-case table has.
    testing.expectEqual('color: #12345;', round('color: #12345'));
    testing.expectEqual('color: #AABBCCDDEE;', round('color: #AABBCCDDEE'));
}
</script>

<script id="a_keywords_canonical_spelling_is_its_lower_case_one">
{
    const round = (text) => withStyle(text).style.cssText;

    // Measured over all 14392 (property, keyword) pairs the keyword table
    // carries: whatever case a keyword is written in, Chrome answers the lower
    // case spelling. 59 of those keywords are spelled with a capital in the
    // table -- it is generated from mdn-data, whose spelling is the *pool* and
    // not the answer -- and Chrome lowercases every one.
    testing.expectEqual('color: currentcolor;', round('color: currentColor'));
    testing.expectEqual('color: currentcolor;', round('color: CURRENTCOLOR'));
    testing.expectEqual('color: buttonface;', round('color: ButtonFace'));
    testing.expectEqual('color: buttonface;', round('color: bUtToNfAcE'));
    testing.expectEqual('caret-color: threeddarkshadow;', round('caret-color: ThreeDDarkShadow'));
    testing.expectEqual('shape-rendering: crispedges;', round('shape-rendering: crispEdges'));
    testing.expectEqual('pointer-events: visiblepainted;', round('pointer-events: visiblePainted'));
    testing.expectEqual('color-interpolation: srgb;', round('color-interpolation: sRGB'));
    testing.expectEqual('text-rendering: optimizelegibility;', round('text-rendering: optimizeLegibility'));
    testing.expectEqual('size: a4;', round('size: A4'));

    // And the other direction, which is what made this worth fixing rather than
    // recording: a page writing the keyword the way Chrome answers it must get
    // that back, not the table's capital.
    testing.expectEqual('pointer-events: visiblepainted;', round('pointer-events: visiblepainted'));
    testing.expectEqual('color: buttonface;', round('color: buttonface'));

    // A <custom-ident> still keeps its capitals: it is not a keyword, so no
    // table vouches for it.
    testing.expectEqual('font-family: MyOwnFont;', round('font-family: MyOwnFont'));
    testing.expectEqual('animation-name: MyAnim;', round('animation-name: MyAnim'));
}
</script>

<script id="a_url_is_always_serialised_quoted">
{
    const round = (text) => withStyle(text).style.cssText;

    // Chrome answers a url() with the path in double quotes however it was
    // written, and the quoting is the only thing it adds: the path keeps its
    // case, its query string and its fragment.
    testing.expectEqual('background-image: url("Foo/Bar.PNG");', round('background-image: URL(Foo/Bar.PNG)'));
    testing.expectEqual('background-image: url("a");', round('background-image: url(a)'));
    testing.expectEqual('background-image: url("a");', round('background-image: url("a")'));
    testing.expectEqual('background-image: url("a");', round("background-image: url('a')"));
    testing.expectEqual('background-image: url("a");', round('background-image: url(  a  )'));
    testing.expectEqual('background-image: url("");', round('background-image: url()'));
    testing.expectEqual('background-image: url("#frag");', round('background-image: url(#frag)'));
    testing.expectEqual(
        'background-image: url("A.PNG?X=Y&Z=1PX");',
        round('background-image: URL(A.PNG?X=Y&Z=1PX)'));

    // One per url(), wherever they sit.
    testing.expectEqual(
        'background-image: url("A.PNG"), url("B.PNG");',
        round('background-image: url(A.PNG), url(B.PNG)'));
    testing.expectEqual(
        'background-image: image-set(url("A.PNG") 1x);',
        round('background-image: image-set(URL(A.PNG) 1x)'));
    testing.expectEqual('cursor: url("A.PNG"), auto;', round('cursor: URL(A.PNG), auto'));

    // The escapes an unquoted path needs are resolved, and the two characters
    // a quoted one cannot hold bare are escaped back.
    testing.expectEqual('background-image: url("a b");', round('background-image: url(a\\ b)'));
    testing.expectEqual('background-image: url("a(b");', round('background-image: url(a\\28 b)'));
    testing.expectEqual('background-image: url("a\\"b");', round("background-image: url('a\"b')"));
    testing.expectEqual('background-image: url("a\\\\b");', round('background-image: url(a\\\\b)'));

    // A url() inside a substituted value is frozen with the rest of it.
    testing.expectEqual(
        'background-image: VAR(--a, URL(A.PNG));',
        round('background-image: VAR(--a, URL(A.PNG))'));
}
</script>

<!--
  A property that takes a pair. Measured by tools/fingerprint/probes/
  probe-css15.js on headed Chrome 151: three rules, not one. Most such
  properties fold `X X` back to `X`; a size drops a trailing `auto` and keeps
  an equal pair; a repeat does both a fold and a rename, because the pair
  `repeat no-repeat` has a keyword of its own.
-->
<script id="a_two_value_property_folds_the_way_chrome_folds_it">
{
    // The plain fold, one property from each family that takes it.
    const folds = {
        'place-content': 'center center',
        'place-items': 'start start',
        'place-self': 'auto auto',
        'margin-block': '10px 10px',
        'padding-inline': '10px 10px',
        'inset-block': 'auto auto',
        'border-block-style': 'solid solid',
        'border-inline-width': 'thin thin',
        'border-block-color': 'red red',
        'overflow': 'hidden hidden',
        'overscroll-behavior': 'contain contain',
        'gap': '10px 10px',
        'scroll-padding-block': '10px 10px',
        'scroll-snap-align': 'start start',
        'border-image-repeat': 'stretch stretch',
        '-webkit-mask-box-image-repeat': 'stretch stretch',
    };
    for (const [property, pair] of Object.entries(folds)) {
        const half = pair.slice(0, pair.indexOf(' '));
        testing.expectEqual(half,
            withStyle(property + ': ' + pair).style.getPropertyValue(property));
    }

    // An unequal pair stays a pair, whichever way round it was written.
    testing.expectEqual('stretch repeat',
        withStyle('border-image-repeat: stretch repeat').style.getPropertyValue('border-image-repeat'));
    testing.expectEqual('10px auto',
        withStyle('inset-block: 10px auto').style.getPropertyValue('inset-block'));

    // A size does not fold: `10px 10px` is two values in Chrome. What it does
    // instead is drop a trailing `auto`, which is the half a one-value size
    // would have implied anyway. `-webkit-mask-size` is the same longhand
    // under another name.
    for (const property of ['background-size', 'mask-size', '-webkit-mask-size']) {
        const read = (value) =>
            withStyle(property + ': ' + value).style.getPropertyValue(property);
        testing.expectEqual('10px', read('10px auto'));
        testing.expectEqual('auto', read('auto auto'));
        testing.expectEqual('50%', read('50% auto'));
        testing.expectEqual('auto 10px', read('auto 10px'));
        testing.expectEqual('10px 10px', read('10px 10px'));
        testing.expectEqual('10px 20px', read('10px 20px'));
        testing.expectEqual('cover', read('cover'));
        // A bare zero takes its unit in either half, which the whole-value
        // rule alone does not reach.
        testing.expectEqual('0px', read('0'));
        testing.expectEqual('0px 0px', read('0 0'));
        testing.expectEqual('0px 10px', read('0 10px'));
        testing.expectEqual('10px 0px', read('10px 0'));
        testing.expectEqual('0px', read('0 auto'));
        testing.expectEqual('auto 0px', read('auto 0'));
    }

    // A repeat pair folds when the halves agree and is renamed when they are
    // the two halves of an axis keyword.
    for (const property of ['background-repeat', 'mask-repeat', '-webkit-mask-repeat']) {
        const read = (value) =>
            withStyle(property + ': ' + value).style.getPropertyValue(property);
        testing.expectEqual('repeat-x', read('repeat no-repeat'));
        testing.expectEqual('repeat-y', read('no-repeat repeat'));
        testing.expectEqual('repeat', read('repeat repeat'));
        testing.expectEqual('no-repeat', read('no-repeat no-repeat'));
        testing.expectEqual('space', read('space space'));
        testing.expectEqual('round', read('round round'));
        testing.expectEqual('space round', read('space round'));
        testing.expectEqual('round space', read('round space'));
        testing.expectEqual('repeat space', read('repeat space'));
        testing.expectEqual('no-repeat space', read('no-repeat space'));
        testing.expectEqual('repeat-x', read('repeat-x'));
    }

    // A corner radius is a fold *and* the zero rule: the pair is two lengths,
    // so a bare `0` takes its unit in either half, which is what separates
    // this from the plain fold. Measured by probe-css16.js on
    // border-top-left-radius, border-bottom-right-radius and
    // border-start-end-radius; the other five spellings are the same longhand
    // and are covered here because the rule is keyed on all eight.
    for (const property of [
        'border-top-left-radius', 'border-top-right-radius',
        'border-bottom-right-radius', 'border-bottom-left-radius',
        'border-start-start-radius', 'border-start-end-radius',
        'border-end-start-radius', 'border-end-end-radius',
    ]) {
        const read = (value) =>
            withStyle(property + ': ' + value).style.getPropertyValue(property);
        testing.expectEqual('10px', read('10px'));
        testing.expectEqual('10px', read('10px 10px'));
        testing.expectEqual('10px 20px', read('10px 20px'));
        testing.expectEqual('50%', read('50%'));
        testing.expectEqual('50%', read('50% 50%'));
        testing.expectEqual('50% 25%', read('50% 25%'));
        testing.expectEqual('0px', read('0'));
        testing.expectEqual('0px', read('0 0'));
        testing.expectEqual('0px 10px', read('0 10px'));
        testing.expectEqual('10px 0px', read('10px 0'));
    }

    // Both rules run per layer, because a comma list of them is what the
    // background and mask shorthands store.
    testing.expectEqual('10px, 20px',
        withStyle('background-size: 10px auto, 20px').style.getPropertyValue('background-size'));
    testing.expectEqual('10px 10px, auto',
        withStyle('background-size: 10px 10px, auto auto').style.getPropertyValue('background-size'));
    testing.expectEqual('0px 0px, 10px',
        withStyle('background-size: 0 0, 10px').style.getPropertyValue('background-size'));
    testing.expectEqual('repeat-x, space round',
        withStyle('background-repeat: repeat no-repeat, space round')
            .style.getPropertyValue('background-repeat'));
    testing.expectEqual('repeat, repeat-y',
        withStyle('background-repeat: repeat repeat, no-repeat repeat')
            .style.getPropertyValue('background-repeat'));
    testing.expectEqual('repeat-x, space round',
        withStyle('mask-repeat: repeat no-repeat, space round')
            .style.getPropertyValue('mask-repeat'));
}
</script>

<!--
  A shorthand is not stored. Chrome expands it into its longhands and keeps
  those, so the declaration's length, its indexed names and the value it
  answers for the shorthand are all rebuilt rather than echoed. Measured on
  headed Chrome 151; the tables behind it are src/browser/webapi/css/
  chrome_shorthands.zig, generated by tools/fingerprint/dump-css-shorthands.mjs.
-->
<script id="a_shorthand_is_stored_as_its_longhands">
{
    const names = (el) => Array.from({ length: el.style.length }, (_, i) => el.style.item(i));
    const values = (el) => names(el).map((n) => el.style.getPropertyValue(n));

    // The box rule, and the shortest form it comes back as.
    const box = withStyle('margin: 1px 2px 3px');
    testing.expectEqual(4, box.style.length);
    testing.expectEqual('margin-top,margin-right,margin-bottom,margin-left', names(box).join(','));
    testing.expectEqual('1px,2px,3px,2px', values(box).join(','));
    testing.expectEqual('1px 2px 3px', box.style.getPropertyValue('margin'));
    testing.expectEqual('3px', box.style.getPropertyValue('margin-bottom'));

    // Seventeen for `border`, including the five border-image longhands the
    // value never mentions, and the order is widths, then styles, then colours.
    const border = withStyle('border: 1px solid red');
    testing.expectEqual(17, border.style.length);
    testing.expectEqual('border-top-width', border.style.item(0));
    testing.expectEqual('border-left-width', border.style.item(3));
    testing.expectEqual('border-top-style', border.style.item(4));
    testing.expectEqual('border-top-color', border.style.item(8));
    testing.expectEqual('border-image-source', border.style.item(12));
    testing.expectEqual('border-image-repeat', border.style.item(16));
    testing.expectEqual(
        '1px,1px,1px,1px,solid,solid,solid,solid,red,red,red,red,none,100%,1,0,stretch',
        values(border).join(','));
    testing.expectEqual('1px solid red', border.style.getPropertyValue('border'));

    // The components can be written in any order and land the same way.
    testing.expectEqual('1px solid red',
        withStyle('border: red 1px solid').style.getPropertyValue('border'));

    // A shorthand whose components all hold their initial value cannot be
    // written back as one, and answers nothing.
    const initial = withStyle('border: currentColor');
    testing.expectEqual(17, initial.style.length);
    testing.expectEqual('medium,medium,medium,medium,none,none,none,none,' +
        'currentcolor,currentcolor,currentcolor,currentcolor,none,100%,1,0,stretch',
        values(initial).join(','));
    testing.expectEqual('', initial.style.getPropertyValue('border'));

    // Dropping is not the same as holding the filler: `text-decoration`
    // stores `currentcolor` on its colour and still answers `none`, because
    // that is one of the values that component is left out at.
    const dropped = withStyle('text-decoration: currentColor');
    testing.expectEqual('initial,initial,initial,currentcolor', values(dropped).join(','));
    testing.expectEqual('none', dropped.style.getPropertyValue('text-decoration'));
    testing.expectEqual('none', String(dropped.attributeStyleMap.get('text-decoration')));

    // `column-rule` in the same state answers its width instead of nothing.
    const rule = withStyle('column-rule: currentColor');
    testing.expectEqual(3, rule.style.length);
    testing.expectEqual('medium,none,currentcolor', values(rule).join(','));
    testing.expectEqual('medium', rule.style.getPropertyValue('column-rule'));

    // A component holding its initial value is dropped on the way back:
    // `solid` is text-decoration-style's initial.
    const decoration = withStyle('text-decoration: 1px solid red');
    testing.expectEqual('text-decoration-line,text-decoration-thickness,' +
        'text-decoration-style,text-decoration-color', names(decoration).join(','));
    testing.expectEqual('initial,1px,solid,red', values(decoration).join(','));
    testing.expectEqual('1px red', decoration.style.getPropertyValue('text-decoration'));

    // A CSS-wide keyword reaches every longhand -- and `border` enumerates them
    // in a different order for that case: colour, style, width, per side.
    const wide = withStyle('border: inherit');
    testing.expectEqual(17, wide.style.length);
    testing.expectEqual('border-top-color', wide.style.item(0));
    testing.expectEqual('border-top-style', wide.style.item(1));
    testing.expectEqual('border-top-width', wide.style.item(2));
    testing.expectEqual('inherit', wide.style.getPropertyValue('border-left-color'));
    testing.expectEqual('inherit', wide.style.getPropertyValue('border'));

    // `white-space` is a lookup rather than a distribution.
    const space = withStyle('white-space: nowrap');
    testing.expectEqual('white-space-collapse,text-wrap-mode', names(space).join(','));
    testing.expectEqual('collapse,nowrap', values(space).join(','));
    testing.expectEqual('nowrap', space.style.getPropertyValue('white-space'));

    // A rename that rewrites the value, and reads it back under the old name.
    const legacy = withStyle('page-break-after: always');
    testing.expectEqual('break-after', legacy.style.item(0));
    testing.expectEqual('page', legacy.style.getPropertyValue('break-after'));
    testing.expectEqual('always', legacy.style.getPropertyValue('page-break-after'));

    // `transition` writes its components back in an order its longhands are
    // not stored in.
    const transition = withStyle('transition: MyIdent 1s');
    testing.expectEqual('transition-behavior,transition-duration,' +
        'transition-timing-function,transition-delay,transition-property',
        names(transition).join(','));
    testing.expectEqual('normal,1s,ease,0s,MyIdent', values(transition).join(','));
    testing.expectEqual('MyIdent 1s', transition.style.getPropertyValue('transition'));

    // `background` is a layer rather than a run of components: nine longhands,
    // a position filling two of them, a size only a `/` reaches, and one box
    // token landing on both the origin and the clip.
    const bg = withStyle('background: blue');
    testing.expectEqual(9, bg.style.length);
    testing.expectEqual('background-image,background-position-x,background-position-y,' +
        'background-size,background-repeat,background-attachment,background-origin,' +
        'background-clip,background-color', names(bg).join(','));
    testing.expectEqual('initial,initial,initial,initial,initial,initial,initial,initial,blue',
        values(bg).join(','));
    testing.expectEqual('blue', bg.style.getPropertyValue('background'));
    testing.expectEqual('background: blue;', bg.style.cssText);

    // One position token fills both axes: the one the page did not write is
    // left holding `center`, and which axis a token belongs to is what decides
    // where it goes -- `top` is a y and `10px` is an x.
    testing.expectEqual('10px center', withStyle('background: 10px')
        .style.getPropertyValue('background'));
    testing.expectEqual('center top', withStyle('background: top')
        .style.getPropertyValue('background'));

    // Two keywords may come in either order; once a length is involved the
    // order is fixed, which is why `10px left` does not parse.
    testing.expectEqual('right top', withStyle('background: top right')
        .style.getPropertyValue('background'));
    testing.expectEqual('left 10px', withStyle('background: left 10px')
        .style.getPropertyValue('background'));

    // Three and four tokens are two `edge [offset]` groups, and one axis holds
    // the whole group.
    const anchored = withStyle('background: left 10px top 20px');
    testing.expectEqual('left 10px', anchored.style.getPropertyValue('background-position-x'));
    testing.expectEqual('top 20px', anchored.style.getPropertyValue('background-position-y'));
    testing.expectEqual('left 10px top 20px', anchored.style.getPropertyValue('background'));

    // A unitless zero in a position or a size is stored `0px`, the same as in
    // any other length.
    const zero = withStyle('background: url("a") 0/0');
    testing.expectEqual('0px', zero.style.getPropertyValue('background-position-x'));
    testing.expectEqual('0px', zero.style.getPropertyValue('background-size'));
    testing.expectEqual('url("a") 0px center / 0px', zero.style.getPropertyValue('background'));

    // The `/` reaches the size, and the position it needs in front of it comes
    // back written out.
    const sized = withStyle('background: 10px / 20px');
    testing.expectEqual('20px', sized.style.getPropertyValue('background-size'));
    testing.expectEqual('10px center / 20px', sized.style.getPropertyValue('background'));

    // One box token fills the origin and the clip; a second takes the clip
    // over. `text` is a clip and not an origin, so it lands there whichever
    // side of the value it was written on.
    testing.expectEqual('padding-box padding-box', withStyle('background: padding-box')
        .style.getPropertyValue('background'));
    const clipped = withStyle('background: text border-box');
    testing.expectEqual('border-box', clipped.style.getPropertyValue('background-origin'));
    testing.expectEqual('text', clipped.style.getPropertyValue('background-clip'));
    testing.expectEqual('border-box text', clipped.style.getPropertyValue('background'));

    // The whole layer, in an order of its own, and the colour last.
    const layer = withStyle('background: red 10px');
    testing.expectEqual('10px center red', layer.style.getPropertyValue('background'));
    testing.expectEqual('url("a") center center / cover no-repeat fixed padding-box border-box red',
        withStyle('background: url("a") center / cover no-repeat fixed padding-box border-box red')
            .style.getPropertyValue('background'));

    // A value the layer model declines is kept whole rather than expanded
    // wrongly: `border-area` moves the origin where no other clip-only
    // keyword does.
    for (const value of ['border-area']) {
        const whole = withStyle('background: ' + value);
        testing.expectEqual(1, whole.style.length);
        testing.expectEqual('background', whole.style.item(0));
        testing.expectEqual(value, whole.style.getPropertyValue('background'));
    }

    // Two of the slots take a pair rather than a single component: the size
    // after the `/`, and the repeat. The pair reaches its longhand whole and
    // is shortened there, which is why `repeat no-repeat` comes back as the
    // axis keyword it spells.
    const paired = withStyle('background: left top / 10px 20px');
    testing.expectEqual(9, paired.style.length);
    testing.expectEqual('left', paired.style.getPropertyValue('background-position-x'));
    testing.expectEqual('top', paired.style.getPropertyValue('background-position-y'));
    testing.expectEqual('10px 20px', paired.style.getPropertyValue('background-size'));
    testing.expectEqual('left top / 10px 20px', paired.style.getPropertyValue('background'));

    const both = withStyle('background: 10px 20px / 30px 40px');
    testing.expectEqual('10px', both.style.getPropertyValue('background-position-x'));
    testing.expectEqual('20px', both.style.getPropertyValue('background-position-y'));
    testing.expectEqual('30px 40px', both.style.getPropertyValue('background-size'));
    testing.expectEqual('10px 20px / 30px 40px', both.style.getPropertyValue('background'));

    const axis = withStyle('background: repeat no-repeat');
    testing.expectEqual(9, axis.style.length);
    testing.expectEqual('repeat-x', axis.style.getPropertyValue('background-repeat'));
    testing.expectEqual('repeat-x', axis.style.getPropertyValue('background'));
    testing.expectEqual('repeat-y', withStyle('background: no-repeat repeat')
        .style.getPropertyValue('background'));
    // A pair with no keyword of its own stays a pair, in the layer as in the
    // longhand.
    testing.expectEqual('space round', withStyle('background: space round')
        .style.getPropertyValue('background'));
    testing.expectEqual('repeat-x, space round',
        withStyle('background: repeat no-repeat, space round')
            .style.getPropertyValue('background'));

    // The pair does not swallow a component that belongs to another slot.
    const mixed = withStyle('background: no-repeat fixed');
    testing.expectEqual('no-repeat', mixed.style.getPropertyValue('background-repeat'));
    testing.expectEqual('fixed', mixed.style.getPropertyValue('background-attachment'));

    // A comma is a layer boundary: every per-layer longhand becomes a comma
    // list as long as the value had layers, and the ones a layer never
    // mentioned hold their filler in that layer's place.
    const two = withStyle('background: url(a), url(b)');
    testing.expectEqual(9, two.style.length);
    testing.expectEqual('url("a"), url("b")', two.style.getPropertyValue('background-image'));
    testing.expectEqual('initial, initial', two.style.getPropertyValue('background-position-x'));
    testing.expectEqual('url("a"), url("b")', two.style.getPropertyValue('background'));
    testing.expectEqual('background: url("a"), url("b");', two.style.cssText);

    // The colour belongs to the whole value rather than to a layer, so it is
    // one value however many layers there are -- and only the last layer may
    // write it. `url(a) blue, url(b)` does not parse in Chrome at all; this
    // engine declines it and keeps the declaration whole.
    const tinted = withStyle('background: url("a"), url("b") blue');
    testing.expectEqual('blue', tinted.style.getPropertyValue('background-color'));
    testing.expectEqual('url("a"), url("b") blue', tinted.style.getPropertyValue('background'));
    const early = withStyle('background: url("a") blue, url("b")');
    testing.expectEqual(1, early.style.length);

    // A last layer that mentioned nothing but the colour comes back as just
    // the colour.
    testing.expectEqual('url("a"), red', withStyle('background: url("a"), red')
        .style.getPropertyValue('background'));

    // Each layer parses on its own: the second one here writes one position
    // component and is left holding `center` on the other axis.
    const positions = withStyle('background: 10px 20px, 30px');
    testing.expectEqual('10px, 30px', positions.style.getPropertyValue('background-position-x'));
    testing.expectEqual('20px, center', positions.style.getPropertyValue('background-position-y'));
    testing.expectEqual('10px 20px, 30px center', positions.style.getPropertyValue('background'));

    // The box pair and the `/` are per-layer too.
    testing.expectEqual('padding-box border-box, content-box content-box',
        withStyle('background: padding-box border-box, content-box')
            .style.getPropertyValue('background'));
    testing.expectEqual('url("a") center center / cover, url("b") left top / contain',
        withStyle('background: url("a") center / cover, url("b") left top / contain')
            .style.getPropertyValue('background'));

    // `mask` is the same layer grammar, with one longhand fewer -- there is no
    // colour, so every slot is per-layer -- and its unmentioned longhands hold
    // their initial value spelled out where background's hold the literal
    // `initial`.
    const mask = withStyle('mask: url("a")');
    testing.expectEqual(9, mask.style.length);
    testing.expectEqual('mask-image,-webkit-mask-position-x,-webkit-mask-position-y,' +
        'mask-size,mask-repeat,mask-origin,mask-clip,mask-composite,mask-mode',
        names(mask).join(','));
    testing.expectEqual('url("a"),0%,0%,auto,repeat,border-box,border-box,add,match-source',
        values(mask).join(','));
    testing.expectEqual('url("a")', mask.style.getPropertyValue('mask'));
    testing.expectEqual('mask: url("a");', mask.style.cssText);

    // Every slot at its initial answers `none` rather than nothing.
    testing.expectEqual('none', withStyle('mask: repeat').style.getPropertyValue('mask'));
    testing.expectEqual('none', withStyle('mask: add').style.getPropertyValue('mask'));

    // The box pair collapses when the two agree, which background's does not:
    // `background: content-box` answers it twice.
    testing.expectEqual('content-box', withStyle('mask: content-box')
        .style.getPropertyValue('mask'));
    testing.expectEqual('content-box', withStyle('mask: content-box content-box')
        .style.getPropertyValue('mask'));
    testing.expectEqual('padding-box border-box', withStyle('mask: padding-box border-box')
        .style.getPropertyValue('mask'));
    testing.expectEqual('border-box content-box', withStyle('mask: border-box content-box')
        .style.getPropertyValue('mask'));

    // ... and an origin sitting at its initial is written anyway, unless the
    // clip holds something the origin could not: `no-clip` is a clip and not an
    // origin, so it is written on its own.
    const noclip = withStyle('mask: border-box no-clip');
    testing.expectEqual('border-box', noclip.style.getPropertyValue('mask-origin'));
    testing.expectEqual('no-clip', noclip.style.getPropertyValue('mask-clip'));
    testing.expectEqual('no-clip', noclip.style.getPropertyValue('mask'));
    testing.expectEqual('content-box no-clip', withStyle('mask: content-box no-clip')
        .style.getPropertyValue('mask'));

    // The composite and the mode are slots of their own, the `/` and the
    // layers work as they do for background, and a layer that drops everything
    // is where `none` shows up in the middle of a list.
    testing.expectEqual('subtract', withStyle('mask: subtract').style.getPropertyValue('mask'));
    testing.expectEqual('alpha', withStyle('mask: alpha').style.getPropertyValue('mask'));
    testing.expectEqual('10px center / 20px', withStyle('mask: 10px / 20px')
        .style.getPropertyValue('mask'));
    testing.expectEqual('url("a"), url("b")', withStyle('mask: url("a"), url("b")')
        .style.getPropertyValue('mask'));
    testing.expectEqual('padding-box, none', withStyle('mask: padding-box, border-box')
        .style.getPropertyValue('mask'));

    // Mask's size and repeat take a pair the same way background's do.
    testing.expectEqual('left top / 10px 20px', withStyle('mask: left top / 10px 20px')
        .style.getPropertyValue('mask'));
    testing.expectEqual('repeat-x', withStyle('mask: repeat no-repeat')
        .style.getPropertyValue('mask'));
    testing.expectEqual('space round', withStyle('mask: space round')
        .style.getPropertyValue('mask'));

    // The -webkit- spelling stores the same nine longhands, and cssText writes
    // the unprefixed name back.
    const webkit = withStyle('-webkit-mask: url("a") no-repeat');
    testing.expectEqual(9, webkit.style.length);
    testing.expectEqual('url("a") no-repeat', webkit.style.getPropertyValue('-webkit-mask'));
    testing.expectEqual('mask: url("a") no-repeat;', webkit.style.cssText);

    // One longhand on its own is not a background, and cssText says so.
    testing.expectEqual('background-color: red;', withStyle('background-color: red').style.cssText);

    // A corner radius is two box lists over four corners, which is the one
    // four-value shorthand carrying a `/`. Each corner holds the pair `h v`,
    // folded to `h` when the two agree, so a value with no `/` leaves every
    // corner holding one component. Measured by probe-css16.js.
    const radius = withStyle('border-radius: 10px 20px / 30px 40px');
    testing.expectEqual(4, radius.style.length);
    testing.expectEqual(
        'border-top-left-radius,border-top-right-radius,' +
        'border-bottom-right-radius,border-bottom-left-radius',
        names(radius).join(','));
    testing.expectEqual('10px 30px,20px 40px,10px 30px,20px 40px',
        values(radius).join(','));
    testing.expectEqual('10px 20px / 30px 40px',
        radius.style.getPropertyValue('border-radius'));
    testing.expectEqual('20px 40px',
        radius.style.getPropertyValue('border-top-right-radius'));
    testing.expectEqual('border-radius: 10px 20px / 30px 40px;', radius.style.cssText);

    // Coming back, the two lists are elided by the box rule *independently*,
    // and the `/` goes only when the two come out identical.
    const radii = (value) =>
        withStyle('border-radius: ' + value).style.getPropertyValue('border-radius');
    testing.expectEqual('10px 20px', radii('10px 20px / 10px 20px'));
    testing.expectEqual('10px / 20px', radii('10px 10px / 20px 20px'));
    testing.expectEqual('10px', radii('10px / 10px'));
    testing.expectEqual('10px', radii('10px 10px 10px 10px'));
    testing.expectEqual('10px 20px 30px', radii('10px 20px 30px 20px'));
    testing.expectEqual('10px 20px 10px 30px', radii('10px 20px 10px 30px'));
    testing.expectEqual('10px 20px 30px / 40px', radii('10px 20px 30px / 40px'));
    testing.expectEqual('10px / 20px 30px', radii('10px / 20px 30px'));
    testing.expectEqual('50% / 25%', radii('50% / 25%'));
    // The zero rule rides along, because a corner holds it.
    testing.expectEqual('0px', radii('0'));
    testing.expectEqual('0px', radii('0 0'));
    testing.expectEqual('0px 10px', radii('0 10px'));

    // `-webkit-border-radius` is a different parser: with exactly two
    // components it is the legacy WebKit horizontal-then-vertical form rather
    // than top-left-then-top-right. One, three and four are `border-radius`,
    // and reading back -- and cssText -- go through the unprefixed name.
    const legacyRadii = (value) => {
        const el = withStyle('-webkit-border-radius: ' + value);
        return el.style.getPropertyValue('-webkit-border-radius');
    };
    testing.expectEqual('10px / 20px', legacyRadii('10px 20px'));
    testing.expectEqual('0px / 10px', legacyRadii('0 10px'));
    testing.expectEqual('50% / 25%', legacyRadii('50% 25%'));
    testing.expectEqual('10px', legacyRadii('10px'));
    testing.expectEqual('10px', legacyRadii('10px 10px'));
    testing.expectEqual('10px 20px 30px', legacyRadii('10px 20px 30px'));
    testing.expectEqual('10px 20px 30px 40px', legacyRadii('10px 20px 30px 40px'));
    testing.expectEqual('10px 20px', legacyRadii('10px 20px 10px 20px'));
    const legacyRadius = withStyle('-webkit-border-radius: 10px 20px');
    testing.expectEqual(4, legacyRadius.style.length);
    testing.expectEqual('10px 20px,10px 20px,10px 20px,10px 20px',
        values(legacyRadius).join(','));
    testing.expectEqual('10px / 20px',
        legacyRadius.style.getPropertyValue('border-radius'));
    testing.expectEqual('border-radius: 10px / 20px;', legacyRadius.style.cssText);

    // A CSS-wide keyword reaches all four corners, under either spelling.
    for (const property of ['border-radius', '-webkit-border-radius']) {
        const inherited = withStyle(property + ': inherit');
        testing.expectEqual(4, inherited.style.length);
        testing.expectEqual('inherit,inherit,inherit,inherit', values(inherited).join(','));
        testing.expectEqual('inherit', inherited.style.getPropertyValue(property));
        testing.expectEqual('border-radius: inherit;', inherited.style.cssText);
    }

    // Removing a shorthand removes every longhand it expanded to.
    const removed = withStyle('border: 1px solid red');
    testing.expectEqual('1px solid red', removed.style.removeProperty('border'));
    testing.expectEqual(0, removed.style.length);
    testing.expectEqual('', removed.style.getPropertyValue('border-top-width'));
}
</script>

<script id="a_declaration_chrome_refuses_is_not_stored">
{
    // Measured on headed Chrome 151 by tools/fingerprint/probes/probe-css17.js,
    // 525 readings. A declaration Chrome will not take is not stored at all --
    // not partially, and not over what was already there.
    const fresh = () => document.createElement('div');
    const set = (property, value) => {
        const el = fresh();
        el.style.setProperty(property, value);
        return el;
    };

    // A shorthand: nothing lands, and the object is indistinguishable from one
    // that was never touched.
    for (const value of ['-10px', '10px 20px 30px 40px 50px', 'auto', 'none',
        '10px / ', '/ 10px', '10px / 20px / 30px', '10']) {
        const el = set('border-radius', value);
        testing.expectEqual(0, el.style.length);
        testing.expectEqual('', el.style.getPropertyValue('border-radius'));
        testing.expectEqual('', el.style.cssText);
    }

    // A corner longhand takes one or two components and nothing else -- no
    // slash, no keyword, no third component.
    for (const property of ['border-top-left-radius', 'border-start-start-radius']) {
        for (const value of ['-10px', '10px 20px 30px', '10px / 20px', 'auto', 'none', '10']) {
            const el = set(property, value);
            testing.expectEqual(0, el.style.length);
            testing.expectEqual('', el.style.cssText);
        }
    }

    // The values right beside them are still taken, so this is a refusal and
    // not a retreat.
    const kept = set('border-radius', '10px 20px / 30px 40px');
    testing.expectEqual(4, kept.style.length);
    testing.expectEqual('10px 20px / 30px 40px', kept.style.getPropertyValue('border-radius'));

    // Refusing is not a write: what was there stays, byte for byte.
    const over = fresh();
    over.style.setProperty('border-radius', '1px 2px 3px 4px');
    over.style.setProperty('border-radius', '-1px');
    testing.expectEqual('1px 2px 3px 4px', over.style.getPropertyValue('border-radius'));
    testing.expectEqual('border-radius: 1px 2px 3px 4px;', over.style.cssText);

    // Nor a partial one: no longhand of a refused shorthand lands on its own.
    const partial = set('border-radius', '10px 20px 30px 40px 50px');
    testing.expectEqual('', partial.style.getPropertyValue('border-top-left-radius'));

    // The sign rule is per property. Neither half of this list is guessable
    // from the grammar -- it is the measured split between an offset and a size.
    for (const property of ['margin', 'margin-top', 'top', 'letter-spacing',
        'word-spacing', 'text-indent', 'outline-offset']) {
        testing.expectEqual('-10px', set(property, '-10px').style.getPropertyValue(property));
    }
    for (const property of ['padding', 'padding-top', 'width', 'height',
        'border-top-width', 'gap', 'font-size', 'line-height', 'flex-basis']) {
        testing.expectEqual('', set(property, '-10px').style.getPropertyValue(property));
    }

    // The test is on the number rather than on the leading minus: negative zero
    // is not negative, and comes back with the sign dropped.
    testing.expectEqual('0px', set('padding', '-0px').style.getPropertyValue('padding'));
    testing.expectEqual('0px', set('border-radius', '-0px').style.getPropertyValue('border-radius'));

    // The percentage rule is a second, independent bit. `outline-offset` is the
    // property that proves it: it takes a negative length and refuses a
    // percentage of either sign.
    testing.expectEqual('', set('outline-offset', '10%').style.getPropertyValue('outline-offset'));
    testing.expectEqual('', set('border-top-width', '10%').style.getPropertyValue('border-top-width'));
    testing.expectEqual('10%', set('padding-top', '10%').style.getPropertyValue('padding-top'));
    testing.expectEqual('10%', set('border-radius', '10%').style.getPropertyValue('border-radius'));

    // Inside a block each declaration is judged alone; a refused one takes no
    // neighbour with it.
    const block = withStyle('color: red; border-radius: -1px; padding: 5px');
    testing.expectEqual('red', block.style.getPropertyValue('color'));
    testing.expectEqual('', block.style.getPropertyValue('border-radius'));
    testing.expectEqual('5px', block.style.getPropertyValue('padding'));

    // A calc() is folded before it is stored, so what comes back is the sum
    // and not the author's two terms. This assertion used to read
    // `calc(10px + 5px)` and said so in its own comment: the engine could not
    // judge the value, so it kept it whole, which was the wrong answer that
    // was not a refusal. Chrome's answer is `calc(15px)` -- measured, see
    // tests/css/calc_canonical.html.
    testing.expectEqual('calc(15px)',
        set('border-radius', 'calc(10px + 5px)').style.getPropertyValue('border-radius'));
}
</script>

<script id="a_number_outside_the_range_chrome_takes_is_not_stored">
{
    // Measured on headless Chrome 151 by tools/fingerprint/dump-css-bounds.mjs,
    // which bisects both ends of what each property takes. The sign of a number
    // is not the whole of its range: `font-weight` refuses 0 and 1001 while
    // taking everything between, and `z-index` takes -1000000 and refuses 1.5.
    const set = (property, value) => {
        const el = document.createElement('div');
        el.style.setProperty(property, value);
        return el.style.getPropertyValue(property);
    };

    // Both ends, and a fraction inside them, on the one property that has both.
    testing.expectEqual('1', set('font-weight', '1'));
    testing.expectEqual('399.5', set('font-weight', '399.5'));
    testing.expectEqual('1000', set('font-weight', '1000'));
    testing.expectEqual('', set('font-weight', '0'));
    testing.expectEqual('', set('font-weight', '-0'));
    testing.expectEqual('', set('font-weight', '1001'));
    testing.expectEqual('', set('font-weight', '-400'));

    // A whole-number rule is a third bit, independent of either bound:
    // `z-index` and `order` have no bound in either direction and still refuse
    // a fraction.
    testing.expectEqual('-1', set('z-index', '-1'));
    testing.expectEqual('auto', set('z-index', 'auto'));
    testing.expectEqual('', set('z-index', '1.5'));
    testing.expectEqual('-1', set('order', '-1'));
    testing.expectEqual('', set('order', '1.5'));

    // A positive whole number: the lower bound rules out zero, of either sign,
    // and the whole-number rule rules out the fraction above it.
    for (const property of ['column-count', 'widows', 'orphans']) {
        testing.expectEqual('1', set(property, '1'));
        testing.expectEqual('', set(property, '0'));
        testing.expectEqual('', set(property, '-0'));
        testing.expectEqual('', set(property, '2.5'));
    }

    // A bound is not a sign rule and does not imply one: these take zero and
    // fractions and refuse only what is below.
    testing.expectEqual('0', set('animation-iteration-count', '0'));
    testing.expectEqual('infinite', set('animation-iteration-count', 'infinite'));
    testing.expectEqual('', set('animation-iteration-count', '-1'));
    testing.expectEqual('2.5', set('tab-size', '2.5'));
    testing.expectEqual('10', set('line-height', '10'));
    testing.expectEqual('16 / 9', set('aspect-ratio', '16 / 9'));
    testing.expectEqual('', set('aspect-ratio', '16 / -9'));

    // A property that takes a numeric class and no bare number at all, `0`
    // included -- where a unitless zero would otherwise walk in as the length
    // it is everywhere else.
    testing.expectEqual('90deg', set('rotate', '90deg'));
    testing.expectEqual('none', set('rotate', 'none'));
    testing.expectEqual('', set('rotate', '90'));
    testing.expectEqual('', set('rotate', '0'));
    testing.expectEqual('0px', set('overflow-clip-margin', '0px'));
    testing.expectEqual('', set('overflow-clip-margin', '0'));
    testing.expectEqual('0s', set('transition-duration', '0s'));
    testing.expectEqual('', set('transition-duration', '1'));

    // `opacity` is why absence from the table has to mean something: it takes
    // -1 and it takes 2, and clamps them long after the declaration is stored.
    testing.expectEqual('-1', set('opacity', '-1'));
    testing.expectEqual('2', set('opacity', '2'));

    // And an acceptance that is not one interval is not written down at all.
    // Chrome refuses `grid-row-start: 0` in the middle of an otherwise
    // unbounded integer range; a `min`/`max` pair cannot say that, so the
    // engine keeps it -- the wrong answer that is not a refusal.
    testing.expectEqual('-1', set('grid-row-start', '-1'));
    testing.expectEqual('0', set('grid-row-start', '0'));
}
</script>

<script id="a_run_of_letters_that_is_not_a_unit_is_not_a_length">
{
    // Measured on headless Chrome 151 by tools/fingerprint/dump-css-units.mjs:
    // 56 unit spellings, found by probing every unit the specs carry and then
    // sweeping all 475 254 alphabetic spellings up to four letters, which
    // turned up nothing the specs had not. `classify` reads any run of letters
    // after a number as a unit, so without the list `10foo` is a `<length>`.
    const set = (property, value) => {
        const el = document.createElement('div');
        el.style.setProperty(property, value);
        return el.style.getPropertyValue(property);
    };

    // A spelling no unit has. The property does not matter -- there is nothing
    // for the component to be anywhere.
    for (const property of ['width', 'height', 'margin-top', 'padding',
        'border-radius', 'gap', 'inset', 'font-size', 'line-height', 'rotate',
        'transition-duration']) {
        testing.expectEqual('', set(property, '10foo'));
    }

    // `10px2` is not one of these: a suffix with a digit in it was never a
    // unit spelling to begin with, and `classify` already answers "no class at
    // all" for it. That is a different gap -- the properties with no measured
    // class list keep it -- and this table does not close it.

    // One bad component is the whole declaration, in either position.
    testing.expectEqual('', set('margin', '10px 20foo'));
    testing.expectEqual('', set('margin', '10foo 20px'));

    // And the units that do exist stay, including the ones no hand-written
    // list would have thought to carry.
    for (const value of ['10q', '10ric', '10cap', '10lh', '10rlh', '10vmax',
        '10svh', '10dvmin', '10cqmax', '10ex', '10ch', '10ic']) {
        testing.expectEqual(value, set('width', value));
    }
    testing.expectEqual('10grad', set('rotate', '10grad'));
    testing.expectEqual('10ms', set('transition-duration', '10ms'));
    testing.expectEqual('1fr', set('grid-template-columns', '1fr'));
    testing.expectEqual('16 / 9', set('aspect-ratio', '16 / 9'));

    // A unit is case-insensitive, so the fold happens before the lookup --
    // Chrome reads `10PX` back as `10px`, and what matters here is that the
    // declaration survives at all.
    testing.expectEqual(false, set('width', '10PX') === '');
    testing.expectEqual(false, set('width', '10Q') === '');

    // A unit inside a calc() is judged with the rest of it now, so an unknown
    // one takes the whole declaration with it the way Chrome does. This used
    // to assert the value was kept, and said in its own comment that keeping
    // it was the wrong answer.
    testing.expectEqual('', set('width', 'calc(10px + 2foo)'));
}
</script>

<script id="a_property_that_holds_one_component_is_handed_one">
{
    // Measured on headless Chrome 151 by tools/fingerprint/dump-css-arity.mjs:
    // which properties take no two-component value at all, and which take a
    // comma-separated list. Without them this engine keeps whatever it is
    // handed -- `margin-top: 1px 2px` and `width: 1px,2px` are both stored,
    // where Chrome throws the declaration away.
    const set = (property, value) => {
        const el = document.createElement('div');
        el.style.setProperty(property, value);
        return el.style.getPropertyValue(property);
    };

    // A second component where only one goes, in each of the three ways a
    // value can carry one: whitespace, a `/`, and a comma.
    for (const property of ['margin-top', 'padding-left', 'width',
        'border-top-width', 'color', 'font-size', 'z-index', 'flex-basis',
        'line-height', 'opacity']) {
        testing.expectEqual('', set(property, '1px 2px'));
        testing.expectEqual('', set(property, '1px / 2px'));
        testing.expectEqual('', set(property, '1px,2px'));
        testing.expectEqual('', set(property, '1px, 2px'));
    }
    testing.expectEqual('', set('color', 'red red'));
    testing.expectEqual('', set('transition-duration', '1s 2s'));

    // A comma where the property takes no list, on one that does hold two
    // components. The count is per list item, so this is the comma alone.
    testing.expectEqual('', set('border-top-left-radius', '1px,2px'));

    // The other side, which is the one that has to hold: every property that
    // does take a second component keeps it.
    testing.expectEqual('1px 2px', set('border-top-left-radius', '1px 2px'));
    testing.expectEqual('1px 2px', set('transform-origin', '1px 2px'));
    testing.expectEqual('left top', set('background-position', 'left top'));
    testing.expectEqual('left 10px top 20px',
        set('background-position', 'left 10px top 20px'));
    testing.expectEqual('1fr 1fr', set('grid-template-columns', '1fr 1fr'));
    testing.expectEqual('16 / 9', set('aspect-ratio', '16 / 9'));
    testing.expectEqual(false, set('counter-reset', 'a 1 b 2') === '');
    testing.expectEqual(false, set('overflow-clip-margin', '1px content-box') === '');
    testing.expectEqual(false, set('box-shadow', '1px 2px 3px red') === '');
    testing.expectEqual(false, set('grid-template-areas', '"a" "b"') === '');

    // And a comma list where the property takes one, including the two whose
    // items are themselves several components long.
    testing.expectEqual(false, set('font-family', 'a, b') === '');
    testing.expectEqual(false, set('font-family', 'Times New Roman') === '');
    testing.expectEqual(false, set('transition-duration', '1s, 2s') === '');
    testing.expectEqual(false, set('transition-property', 'width, height') === '');
    testing.expectEqual(false, set('will-change', 'width, height') === '');
    testing.expectEqual(false, set('background-image', 'url(a), url(b)') === '');
    testing.expectEqual(false, set('stroke-dasharray', '1 2') === '');

    // The two that cost a regeneration each. Neither half of `"liga" 1` is a
    // value `font-feature-settings` takes on its own -- an OpenType tag is
    // four characters, so a three-letter one is refused as surely as the bare
    // number is -- and `first` is refused by `align-items` alone. A sweep that
    // pairs only accepted values reaches neither, calls both properties
    // one-component, and refuses a declaration Chrome keeps.
    testing.expectEqual(false, set('font-feature-settings', '"liga" 1') === '');
    testing.expectEqual('baseline', set('align-items', 'first baseline'));
    testing.expectEqual(false, set('text-indent', '10px hanging') === '');

    // A comma inside a function is the function's, not the value's.
    testing.expectEqual(false, set('color', 'rgb(1, 2, 3)') === '');
    testing.expectEqual('calc(100% - 10px)', set('width', 'calc(100% - 10px)'));

    // Two things this cannot count and so does not judge. A `var()` stands in
    // for text nobody here has: Chrome keeps `margin-top: var(--a) var(--b)`
    // and resolves it later. A comment is taken out before the count -- Chrome
    // reads `margin-top: 10px /* c */` back as `10px` -- and nothing here
    // removes one, so the components would come back as punctuation.
    testing.expectEqual(false, set('margin-top', 'var(--a) var(--b)') === '');
    testing.expectEqual(false, set('color', 'var(--a),var(--b)') === '');
    testing.expectEqual(false, set('margin-top', '10px /* c */') === '');
}
</script>
</body>
