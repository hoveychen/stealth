<script id="a_redeclared_property_moves_to_its_last_position">
{
  // Where a property that the PARSER saw twice ends up. Chrome moves it to the
  // later occurrence; this engine used to leave it where it was first seen.
  //
  // Not academic: Cloudflare's challenge encodes every rule of its own
  // stylesheet as one string, and two of its 183 rules differed from Chrome's
  // by exactly this -- same declarations, same total length, different order
  // (scratch/b94/css-chrome.txt against css-lp-full.txt).
  //
  // The CSSOM path is the other way round and already agreed: `setProperty`
  // over an existing declaration updates it in place. Both measured on a
  // Chrome 151 with scratch/b94/expr-decl-order.js.
  const text = (style) => withStyle(style).style.cssText;

  // The parser: last occurrence wins the position, not just the value.
  testing.expectEqual('fill: red; stroke-width: 6px;',
      text('stroke-width: 6px; fill: red; stroke-width: 6px'));
  testing.expectEqual('fill: red; stroke-width: 6px;',
      text('stroke-width: 2px; fill: red; stroke-width: 6px'));

  // A longhand re-declared after the shorthand it came from moves alone; the
  // shorthand's other longhands keep their places.
  testing.expectEqual('border-style: solid; border-color: red; border-image: none; border-width: 0px 4px 4px 0px;',
      text('border: solid red; border-width: 0px 4px 4px 0px'));

  // ...and the same through `cssText`, which is the same parser.
  const el = withStyle('');
  el.style.cssText = 'stroke-width: 6px; fill: red; stroke-width: 6px';
  testing.expectEqual('fill: red; stroke-width: 6px;', el.style.cssText);

  // The CSSOM path keeps the position. This is the control: a fix that moves
  // the declaration here would be wrong.
  const cssom = withStyle('color: red; width: 1px');
  cssom.style.setProperty('color', 'blue');
  testing.expectEqual('color: blue; width: 1px;', cssom.style.cssText);

  const assigned = withStyle('color: red; width: 1px');
  assigned.style.color = 'blue';
  testing.expectEqual('color: blue; width: 1px;', assigned.style.cssText);

  const longhand = withStyle('border: solid red; padding: 2px');
  longhand.style.setProperty('border-width', '0px 4px 4px 0px');
  testing.expectEqual('border-width: 0px 4px 4px 0px; border-style: solid; border-color: red; border-image: none; padding: 2px;',
      longhand.style.cssText);
}
</script>

<script id="a_zero_in_a_transform_function_keeps_its_unit">
{
  // `rotate(0deg)` is not `rotate(0)`: Chrome keeps the author's dimension on a
  // ZERO inside a transform function, on every path a page can read it back
  // from. This engine already does too, and this block is here to keep it that
  // way, because a zero is exactly the value a serialiser is tempted to
  // normalise.
  //
  // ⚠️ These pass, and the station still disagrees. A diff of Cloudflare's
  // widget stylesheet puts four of these on the engine's side -- `rotate(0)`
  // against the oracle's `rotate(0deg)`, nine bytes on an otherwise identical
  // 22972-byte span -- and that reading SURVIVES pinning both of the
  // confounders that were suspected of it (the device scale factor and the
  // theme, cdp.mjs). So the defect is real and this file does not reproduce it,
  // including from the live rule copied verbatim below.
  //
  // Which makes these blocks a guard rather than a repro, and locates the
  // remaining question: the widget's stylesheet lives in a cross-origin child
  // document, and the runner's page is not that
  // ([[test-runner-page-differs-from-serve]]). The next reading has to come off
  // the live document -- read this engine's own cssText for that rule there and
  // compare it with what the guard encoded -- rather than off another shape
  // guessed in this file. Two shapes were already guessed and both passed.
  //
  // Measured on Chrome 151 with tools/fingerprint/probes/expr-b105-transform-zero.js,
  // identical at --force-device-scale-factor=1 and =2, so the reading is not a
  // device-grid one: it is the author's text surviving serialisation.
  const text = (style) => withStyle(style).style.cssText;

  // Set through the property, read back through the property and the attribute.
  const prop = withStyle('');
  prop.style.transform = 'rotate(0deg) translateY(0px) scale(1)';
  testing.expectEqual('rotate(0deg) translateY(0px) scale(1)', prop.style.transform);
  testing.expectEqual('transform: rotate(0deg) translateY(0px) scale(1);', prop.style.cssText);

  // Parsed from an attribute the author wrote.
  testing.expectEqual('transform: rotate(0deg) translateY(0px);',
      text('transform: rotate(0deg) translateY(0px)'));

  // Every unit the family takes, not just deg and px.
  testing.expectEqual('transform: skewX(0deg) rotate(0rad) translateX(0em) translateZ(0px);',
      text('transform: skewX(0deg) rotate(0rad) translateX(0em) translateZ(0px)'));

  // The stylesheet path, which is the one the guard reads. Asserted as a
  // substring so this block does not also own @keyframes' whitespace shape.
  const st = document.createElement('style');
  st.textContent = '@keyframes b105 { 0% { transform: rotate(2deg) translateY(2px); }' +
      ' 100% { transform: rotate(0deg) translateY(0px); } }\n' +
      '#b105 { transform: rotate(0deg) translateY(0px); }';
  document.head.appendChild(st);
  const rules = Array.from(st.sheet.cssRules).map((r) => r.cssText);
  st.remove();

  testing.expectEqual('#b105 { transform: rotate(0deg) translateY(0px); }', rules[1]);
  testing.expectEqual('keyframes keep it: true',
      'keyframes keep it: ' + rules[0].includes('rotate(0deg) translateY(0px)'));

  // The shapes the widget's own stylesheet actually uses, copied off the live
  // capture rather than invented -- a zero followed by a NON-zero function, and
  // a lone zero translate. The first version of this block asserted
  // `rotate(0deg) translateY(0px)`, a zero followed by a zero, which this
  // engine already got right; picking the shapes from memory instead of from
  // the evidence is what made a real defect read as a phantom.
  //
  // All four measured on Chrome 151 at dpr 2, prefers-color-scheme light
  // (probes/expr-b105-keyframe-zero.js).
  const live = document.createElement('style');
  live.textContent =
      '@keyframes b105a { 70% { transform: rotate(2deg) scale(1.06); opacity: 1; }' +
      ' 100% { transform: rotate(0deg) scale(1); opacity: 1; } }\n' +
      '@keyframes b105b { 0% { transform: translateY(2px); opacity: 0; }' +
      ' 100% { transform: translateY(0px); opacity: 1; } }\n' +
      '#b105k { transform: rotate(0deg) scale(1); }\n' +
      '#b105j { transform: translateY(0px); }';
  document.head.appendChild(live);
  const liveRules = Array.from(live.sheet.cssRules).map((r) => r.cssText);
  live.remove();

  testing.expectEqual('#b105k { transform: rotate(0deg) scale(1); }', liveRules[2]);
  testing.expectEqual('#b105j { transform: translateY(0px); }', liveRules[3]);
  testing.expectEqual('zero before a non-zero: true',
      'zero before a non-zero: ' + liveRules[0].includes('transform: rotate(0deg) scale(1)'));
  testing.expectEqual('a lone zero translate: true',
      'a lone zero translate: ' + liveRules[1].includes('transform: translateY(0px)'));

  // And through the inline path, same two shapes.
  testing.expectEqual('transform: rotate(0deg) scale(1);', text('transform: rotate(0deg) scale(1)'));
  testing.expectEqual('transform: translateY(0px);', text('transform: translateY(0px)'));

  // The rule VERBATIM off the live capture, three steps and a negative first
  // one. Neither of the shorter shapes above reproduces what the station sees,
  // which is why this is copied rather than paraphrased.
  const verbatim = document.createElement('style');
  verbatim.textContent = '@keyframes success-badge-orbit-in { \n' +
      '  0% { transform: rotate(-12deg) scale(0.6); opacity: 0; }\n' +
      '  70% { transform: rotate(2deg) scale(1.06); opacity: 1; }\n' +
      '  100% { transform: rotate(0deg) scale(1); opacity: 1; }\n}';
  document.head.appendChild(verbatim);
  const vb = verbatim.sheet.cssRules[0].cssText;
  verbatim.remove();
  testing.expectEqual(
      '@keyframes success-badge-orbit-in { \n  0% { transform: rotate(-12deg) scale(0.6); opacity: 0; }\n' +
      '  70% { transform: rotate(2deg) scale(1.06); opacity: 1; }\n' +
      '  100% { transform: rotate(0deg) scale(1); opacity: 1; }\n}', vb);
}
</script>
