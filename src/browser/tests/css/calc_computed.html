<!DOCTYPE html>
<script src="../testing.js"></script>
<div id=calc-computed-anchor></div>

<!--
A calc() resolves at computed-value time like any other length.

Folding the expression (tests/css/calc_canonical.html) fixed what
`el.style.width` reads back. It did nothing for `getComputedStyle`, because
`resolvesHere` refuses any value with `calc(` in it and the declaration falls
back to the initial value -- so every calc() on every page was a declaration
with no effect at all, and a page built on `calc(100% - 2rem)` laid out as if
nothing had been declared.

Every expected value below is Chrome 151's own, measured with
scratch/b98/expr-b98-calc-computed.js in exactly the DOM this file builds: a
400px-wide, 20px-font containing block around the probe element. Twenty-three
rows, of which twenty-two differed.

No `vh`, `vw`, `ex` or `ch` here on purpose. Those answer to the viewport size
and to the platform's font metrics, which the two arms are not obliged to
share; computed_relative_units.html is where they are pinned, one unit at a
time, and a calc() over them adds nothing this file could check.

The two cases that are not a length in pixels have their own blocks below,
because each is a separate rule rather than a special case of the sum:
a calc() over plain numbers stays a number, and a calc() holding a percentage
the property does not resolve is printed as the folded calc().
-->

<script id=calc_resolves_to_a_length>
{
  const probe = (decl, prop) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<div style="width:400px;font-size:20px"><p style="' + decl + '">x</p></div>';
    const got = String(getComputedStyle(host.firstChild.firstChild)[prop]);
    host.remove();
    return got;
  };

  const CASES = [
    // A sum of a font-relative term and an absolute one.
    ['41px', 'font-size:20px;padding-top:calc(2em + 1px)', 'paddingTop'],
    ['15px', 'padding-top:calc(10px + 5px)', 'paddingTop'],
    ['17px', 'padding-top:calc(1rem + 1px)', 'paddingTop'],
    // Absolute units all fold into px before anything resolves, so these two
    // are one term by the time the computed value is asked for. Note the
    // second: 38.7402px here and 38.7344px on `width`, because a used length
    // lands on the layout grid and a padding does not.
    ['113.333px', 'padding-top:calc(1in + 1pt + 1pc)', 'paddingTop'],
    ['38.7402px', 'padding-top:calc(1q + 1cm)', 'paddingTop'],
    ['20px', 'font-size:20px;padding-top:calc(2em - 1em)', 'paddingTop'],
    // A percentage resolves against the containing block, and takes the rest
    // of the sum with it.
    ['100px', 'padding-top:calc(100% / 4)', 'paddingTop'],
    ['190px', 'padding-top:calc(50% - 10px)', 'paddingTop'],
    ['36px', 'padding-top:calc(1rem + 5%)', 'paddingTop'],
    ['41px', 'font-size:20px;margin-left:calc(2em + 1px)', 'marginLeft'],
    // `em` on `font-size` is the parent's size, the same rule a bare `1.5em`
    // already follows.
    ['30px', 'font-size:calc(1.5em)', 'fontSize'],
    ['12px', 'font-size:calc(10px + 2px)', 'fontSize'],
    ['22px', 'font-size:20px;line-height:calc(1em + 2px)', 'lineHeight'],
    // `width` reports a used value, so this is the layout grid's answer.
    ['190px', 'width:calc(50% - 10px)', 'width'],
    ['116px', 'width:calc(100px + 1rem)', 'width'],
    ['3px', 'font-size:20px;letter-spacing:calc(0.1em + 1px)', 'letterSpacing'],
    ['42px', 'font-size:20px;text-indent:calc(2em + 2px)', 'textIndent'],
    ['3px', 'border-top-style:solid;border-top-width:calc(1px + 2px)', 'borderTopWidth'],
    ['17px', 'top:calc(1rem + 1px)', 'top'],
  ];
  const wrong = [];
  for (const [want, decl, prop] of CASES) {
    const got = probe(decl, prop);
    if (got !== want) wrong.push(decl + ' -> ' + prop + ': want ' + want + ', got ' + got);
  }
  testing.expectEqual('', wrong.join('\n'));
}
</script>

<script id=calc_that_comes_out_negative_is_clamped>
{
  // A calc() is allowed to come out negative where a bare negative length
  // would be refused outright, so the clamp is a used-value rule -- and the
  // properties it applies to are exactly the ones that refuse the bare
  // negative. Measured on Chrome 151 over sixteen properties
  // (scratch/b98/expr-b98-calc-negative.js): the nine that clamp are the nine
  // in chrome_bounds.no_negative, and the four that keep the minus -- margin,
  // `top`, `letter-spacing`, `text-indent` -- are the ones absent from it. So
  // this needs no list of its own.
  const probe = (decl, prop) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<div style="width:400px;font-size:20px"><p style="' + decl + '">x</p></div>';
    const got = String(getComputedStyle(host.firstChild.firstChild)[prop]);
    host.remove();
    return got;
  };
  const CASES = [
    ['0px', 'width:calc(10px - 30px)', 'width'],
    ['0px', 'height:calc(10px - 30px)', 'height'],
    ['0px', 'padding-top:calc(10px - 30px)', 'paddingTop'],
    ['0px', 'padding-left:calc(10px - 30px)', 'paddingLeft'],
    ['0px', 'font-size:calc(10px - 30px)', 'fontSize'],
    ['0px', 'line-height:calc(10px - 30px)', 'lineHeight'],
    ['0px', 'min-width:calc(10px - 30px)', 'minWidth'],
    ['0px', 'max-width:calc(10px - 30px)', 'maxWidth'],
    ['0px', 'flex-basis:calc(10px - 30px)', 'flexBasis'],
    ['0px', 'border-top-left-radius:calc(10px - 30px)', 'borderTopLeftRadius'],
    // The other direction, which is what stops this becoming "negatives are
    // impossible": these four keep the minus sign in Chrome.
    ['-20px', 'margin-top:calc(10px - 30px)', 'marginTop'],
    ['-20px', 'margin-left:calc(10px - 30px)', 'marginLeft'],
    ['-20px', 'top:calc(10px - 30px)', 'top'],
    ['-20px', 'letter-spacing:calc(10px - 30px)', 'letterSpacing'],
    ['-20px', 'text-indent:calc(10px - 30px)', 'textIndent'],
  ];
  const wrong = [];
  for (const [want, decl, prop] of CASES) {
    const got = probe(decl, prop);
    if (got !== want) wrong.push(decl + ' -> ' + prop + ': want ' + want + ', got ' + got);
  }
  testing.expectEqual('', wrong.join('\n'));
}
</script>

<script id=comparison_functions_resolve_and_compare>
{
  // A comparison resolves the same way the sum around it does -- each argument
  // to pixels through lengthFactor -- and then picks. Which is why it could not
  // be folded at parse time: `min(1px, 1em)` is 1px only once the font size is
  // known, and on a 16px element it is the px that wins while `max` takes the
  // em.
  //
  // Measured on Chrome 151 with scratch/b98/expr-b98-compare-fns.js in this
  // file's own DOM: a 400px-wide, 20px-font containing block.
  const probe = (decl, prop) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<div style="width:400px;font-size:20px"><p style="' + decl + '">x</p></div>';
    const got = String(getComputedStyle(host.firstChild.firstChild)[prop]);
    host.remove();
    return got;
  };
  const CASES = [
    ['1px', 'font-size:16px;width:min(1px, 1em)', 'width'],
    ['16px', 'font-size:16px;width:max(1em, 1px)', 'width'],
    ['1px', 'font-size:16px;width:min(1px, 1em, 1rem)', 'width'],
    // clamp(lo, mid, hi) is max(lo, min(mid, hi)): the 1px middle is below the
    // 1em floor, so the floor wins.
    ['16px', 'font-size:16px;width:clamp(1em, 1px, 1vh)', 'width'],
    ['17px', 'font-size:16px;width:min(1px + 1em, 2em)', 'width'],
    // A percentage argument resolves against the containing block like any
    // other percentage: 10% of 400px beats 1em.
    ['40px', 'font-size:16px;width:max(10%, 1em)', 'width'],
    ['1px', 'font-size:16px;padding-left:min(1px, 1em)', 'paddingLeft'],
    ['32px', 'font-size:16px;padding-left:max(10px, 2em)', 'paddingLeft'],
    // The comparison as one term of a sum.
    ['17px', 'font-size:16px;width:calc(min(1px, 1em) + 1rem)', 'width'],
  ];
  const wrong = [];
  for (const [want, decl, prop] of CASES) {
    const got = probe(decl, prop);
    if (got !== want) wrong.push(decl + ' -> ' + prop + ': want ' + want + ', got ' + got);
  }
  testing.expectEqual('', wrong.join('\n'));
}
</script>

<script id=calc_over_numbers_stays_a_number>
{
  // A calc() whose terms carry no unit is not a length and does not gain a
  // `px`: `z-index` reports the integer and the alpha family reports the
  // number, with a percentage in it standing for a hundredth the way it does
  // when it is written bare.
  const probe = (decl, prop) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<div style="width:400px;font-size:20px"><p style="' + decl + '">x</p></div>';
    const got = String(getComputedStyle(host.firstChild.firstChild)[prop]);
    host.remove();
    return got;
  };
  const CASES = [
    ['2', 'z-index:calc(1 + 1)', 'zIndex'],
    ['0.5', 'opacity:calc(0.25 + 0.25)', 'opacity'],
    ['0.5', 'opacity:calc(50%)', 'opacity'],
  ];
  const wrong = [];
  for (const [want, decl, prop] of CASES) {
    const got = probe(decl, prop);
    if (got !== want) wrong.push(decl + ' -> ' + prop + ': want ' + want + ', got ' + got);
  }
  testing.expectEqual('', wrong.join('\n'));
}
</script>

<script id=calc_holding_an_unresolved_percentage_prints_the_calc>
{
  // A corner radius's percentage is its own computed value -- it is a share of
  // the box, and the box is not known until layout -- so Chrome cannot reduce
  // this to a length and prints the folded calc() instead. Which is the reason
  // the fold has to happen even for a value that never becomes a number: the
  // computed value IS the folded text, terms sorted and all. Same for `top`,
  // whose percentage is reported as written whether the element is rendered or
  // not.
  const probe = (decl, prop) => {
    const host = document.createElement('div');
    document.body.appendChild(host);
    host.innerHTML = '<div style="width:400px;font-size:20px"><p style="' + decl + '">x</p></div>';
    const got = String(getComputedStyle(host.firstChild.firstChild)[prop]);
    host.remove();
    return got;
  };
  const CASES = [
    ['calc(5% + 10px)', 'border-top-left-radius:calc(10px + 5%)', 'borderTopLeftRadius'],
    ['calc(5% + 10px)', 'top:calc(10px + 5%)', 'top'],
    ['calc(5% + 10px)', 'left:calc(5% + 10px)', 'left'],
    // The pin. Written through the *shorthand* the same value reads back as
    // the initial 0px, and not because of anything above: the shorthand
    // expander declines a value it cannot classify, so `border-radius:
    // calc(...)` is stored whole under the shorthand's own name, where there is
    // no percentage rule -- while `border-radius: 5%` expands into the four
    // corners and comes back right. The blindness is `shorthand.judgeable`,
    // which refuses any value calling a function it has no class for, and a
    // calc()'s class depends on what is inside it. It is the same blindness
    // that keeps `background-position: calc(...)` from gaining its second axis
    // (see calc_canonical.html), it is shared by every shorthand, and it is
    // its own piece of work.
    ['0px', 'border-radius:calc(10px + 5%)', 'borderTopLeftRadius'],
  ];
  const wrong = [];
  for (const [want, decl, prop] of CASES) {
    const got = probe(decl, prop);
    if (got !== want) wrong.push(decl + ' -> ' + prop + ': want ' + want + ', got ' + got);
  }
  testing.expectEqual('', wrong.join('\n'));
}
</script>
