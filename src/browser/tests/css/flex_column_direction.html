<!DOCTYPE html>
<script src="../testing.js"></script>
<div id=anchor></div>

<!--
What a flex COLUMN does with its main axis. css/flex_line_placement.html and
css/flex_line_distribution.html are the ROW: the items follow one another along
the inline axis and the four rules -- `gap`, `justify-content`, `flex-shrink`,
the `auto` margin -- share out what is left of it. A column turns all four
ninety degrees, and none of them was modelled: its main axis is the block one,
so the plain stacking walk laid it out and simply put each item under the
previous one.

That is a sidebar, a card stack, a modal's button column, and the flex idiom
every one of them is written with -- `display:flex; flex-direction:column;
gap:12px` -- put the three children 20px apart instead of 40px apart here.

The differences from a row are the ones the axis swap implies:

  * the gap between two items is `row-gap`, not `column-gap`; the `gap`
    shorthand still expands to both, and `column-gap` alone separates nothing
    on a column that does not wrap.
  * a percentage gap is a share of the container's own size on the gap's axis,
    which on a column is its HEIGHT: `gap:10%` in a 400x200 column is 20px.
  * `align-items` runs along the inline axis, so it decides how WIDE an item
    with no width of its own ends up, and where a narrower one sits across.

Measured on Chrome 152 with
tools/fingerprint/probes/expr-flex-column-direction.js.
-->

<script id=flex_column_lays_out_its_main_axis>
{
  const wrong = [];
  const mk = (label, hostCss, childCss, want) => {
    const host = document.createElement('div');
    host.setAttribute('style', hostCss);
    document.body.appendChild(host);
    for (const css of childCss) {
      const el = document.createElement('div');
      el.setAttribute('style', css);
      host.appendChild(el);
    }
    const hr = host.getBoundingClientRect();
    const rows = [];
    for (const el of host.children) {
      const r = el.getBoundingClientRect();
      rows.push(Math.round(r.x - hr.x) + ',' + Math.round(r.y - hr.y) +
        ' ' + Math.round(r.width) + 'x' + Math.round(r.height));
    }
    host.remove();
    const got = rows.join(' | ');
    if (got !== want) wrong.push(label + ': want [' + want + '], got [' + got + ']');
  };

  const COL = 'display:flex; flex-direction:column; width:400px; height:200px; margin:0';
  const B = 'width:60px; height:20px';
  const three = [B, B, B];

  // The gap on a column's main axis is `row-gap`. `column-gap` is its CROSS
  // axis, and a column that does not wrap has no second line to separate --
  // which is the control that says the axis swap reached the gap too.
  mk('gap', COL + '; gap:20px', three, '0,0 60x20 | 0,40 60x20 | 0,80 60x20');
  mk('row-gap', COL + '; row-gap:10px', three, '0,0 60x20 | 0,30 60x20 | 0,60 60x20');
  mk('column-gap does nothing', COL + '; column-gap:20px', three,
     '0,0 60x20 | 0,20 60x20 | 0,40 60x20');
  // A percentage is a share of the container on the gap's own axis: 10% of the
  // 200px HEIGHT, where the same declaration on a row is 10% of its width.
  mk('percentage gap', COL + '; gap:10%', three, '0,0 60x20 | 0,40 60x20 | 0,80 60x20');
  // And it comes off the column before anything is shared: two growing items
  // in a 200px column with a 20px gap are 90 tall, not 100.
  mk('gap with grow', COL + '; gap:20px', ['flex:1;width:60px', 'flex:1;width:60px'],
     '0,0 60x90 | 0,110 60x90');
  mk('gap with one item', COL + '; gap:20px', [B], '0,0 60x20');

  // `justify-content` on the block axis. 200 - 60 = 140 left over.
  mk('justify flex-start', COL + '; justify-content:flex-start', three,
     '0,0 60x20 | 0,20 60x20 | 0,40 60x20');
  mk('justify center', COL + '; justify-content:center', three,
     '0,70 60x20 | 0,90 60x20 | 0,110 60x20');
  mk('justify flex-end', COL + '; justify-content:flex-end', three,
     '0,140 60x20 | 0,160 60x20 | 0,180 60x20');
  // n-1 gaps of 70.
  mk('justify space-between', COL + '; justify-content:space-between', three,
     '0,0 60x20 | 0,90 60x20 | 0,180 60x20');
  // Half a share outside the two end items, a whole one between: 23.33 and 46.67.
  mk('justify space-around', COL + '; justify-content:space-around', three,
     '0,23 60x20 | 0,90 60x20 | 0,157 60x20');
  // n+1 equal gaps of 35.
  mk('justify space-evenly', COL + '; justify-content:space-evenly', three,
     '0,35 60x20 | 0,90 60x20 | 0,145 60x20');
  // The gap is spent first; what is left is what gets distributed.
  mk('justify with gap', COL + '; justify-content:space-between; gap:20px', three,
     '0,0 60x20 | 0,90 60x20 | 0,180 60x20');
  // Nothing left over, so nothing to distribute -- and a shrunk column is
  // exactly full.
  mk('justify over-full', COL + '; justify-content:center',
     ['width:60px;height:150px', 'width:60px;height:150px'],
     '0,0 60x100 | 0,100 60x100');

  // The cross axis is the inline one. `stretch` is the initial value and it is
  // what widens an item that declares no width to the whole container.
  const N = 'height:20px';
  mk('align stretch', COL, [N, N], '0,0 400x20 | 0,20 400x20');
  mk('align flex-start', COL + '; align-items:flex-start', [B, B],
     '0,0 60x20 | 0,20 60x20');
  mk('align center', COL + '; align-items:center', [B, B],
     '170,0 60x20 | 170,20 60x20');
  mk('align flex-end', COL + '; align-items:flex-end', [B, B],
     '340,0 60x20 | 340,20 60x20');

  // A main-axis `auto` margin eats the free space before `justify-content`
  // sees any of it -- `margin-top:auto` on the last row of a sidebar is how a
  // footer is pinned to its bottom.
  mk('margin auto both axes', COL, ['margin:auto; ' + B], '170,90 60x20');
  mk('margin-top auto', COL, ['margin-top:auto; ' + B], '0,180 60x20');
  mk('margin-bottom auto', COL, ['margin-bottom:auto; ' + B], '0,0 60x20');
  // One item takes ALL of the free space, so its sibling is pushed to the end.
  mk('margin-top auto with a sibling', COL, ['margin-top:auto; ' + B, B],
     '0,160 60x20 | 0,180 60x20');

  // `flex-shrink` when the column is over-full, the same weighting a row uses.
  mk('shrink', COL, ['width:60px;height:150px', 'width:60px;height:150px'],
     '0,0 60x100 | 0,100 60x100');
  mk('shrink zero', COL,
     ['width:60px;height:150px;flex-shrink:0', 'width:60px;height:150px'],
     '0,0 60x150 | 0,150 60x50');

  // The controls: a BLOCK container ignores every one of these.
  mk('gap on a block', 'width:400px; height:200px; gap:20px; margin:0', three,
     '0,0 60x20 | 0,20 60x20 | 0,40 60x20');
  mk('justify-content on a block',
     'width:400px; height:200px; justify-content:center; margin:0', three,
     '0,0 60x20 | 0,20 60x20 | 0,40 60x20');

  testing.expectEqual('', wrong.join(' | '));
}
</script>
