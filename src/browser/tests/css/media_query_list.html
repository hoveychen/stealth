<!DOCTYPE html>
<head>
  <script src="../testing.js"></script>
</head>

<body>
</body>

<!--
  The viewport reported by window.innerWidth / innerHeight is currently
  hardcoded at 1920×1080. matchMedia evaluates against the same dimensions.
-->

<script id=matchMedia_basic>
{
  const mql = window.matchMedia('(min-width: 600px)');
  testing.expectEqual('object', typeof mql);
  testing.expectEqual('(min-width: 600px)', mql.media);
  testing.expectEqual(true, mql.matches);
}
</script>

<script id=matchMedia_min_width_above_viewport>
{
  const mql = window.matchMedia('(min-width: 3000px)');
  testing.expectEqual('(min-width: 3000px)', mql.media);
  testing.expectEqual(false, mql.matches);
}
</script>

<script id=matchMedia_max_width>
{
  const below = window.matchMedia('(max-width: 1024px)');
  testing.expectEqual('(max-width: 1024px)', below.media);
  testing.expectEqual(false, below.matches);

  const above = window.matchMedia('(max-width: 2000px)');
  testing.expectEqual(true, above.matches);
}
</script>

<script id=matchMedia_orientation>
{
  // 1920×1080 is landscape.
  testing.expectEqual(true, window.matchMedia('(orientation: landscape)').matches);
  testing.expectEqual(false, window.matchMedia('(orientation: portrait)').matches);
}
</script>

<script id=matchMedia_media_types>
{
  testing.expectEqual(true, window.matchMedia('all').matches);
  testing.expectEqual(true, window.matchMedia('screen').matches);
  testing.expectEqual(false, window.matchMedia('print').matches);
}
</script>

<script id=matchMedia_unsupported_feature>
{
  // Unknown features evaluate to false per Media Queries Level 4. Chrome
  // implements neither inverted-colors nor video-dynamic-range (measured), so
  // those have to stay unrecognised here too.
  testing.expectEqual(false, window.matchMedia('(nonsense: 1)').matches);
  testing.expectEqual(false, window.matchMedia('(inverted-colors: none)').matches);
  testing.expectEqual(false, window.matchMedia('(video-dynamic-range: standard)').matches);
  // Recognised, but not this device's value.
  testing.expectEqual(false, window.matchMedia('(prefers-color-scheme: dark)').matches);
  testing.expectEqual(false, window.matchMedia('(hover: none)').matches);
}
</script>

<script id=matchMedia_device_persona>
{
  // The exact query set CreepJS's getCSSMedia section runs, answered the way a
  // headed Chrome answers it — see the header of src/browser/css/MediaQuery.zig.
  const pick = (feat, vals) => {
    for (const v of vals) if (window.matchMedia(`(${feat}: ${v})`).matches) return v;
    return undefined;
  };
  testing.expectEqual('no-preference', pick('prefers-reduced-motion', ['no-preference', 'reduce']));
  testing.expectEqual('light', pick('prefers-color-scheme', ['light', 'dark']));
  testing.expectEqual(false, window.matchMedia('(monochrome)').matches);
  testing.expectEqual(true, window.matchMedia('(monochrome: 0)').matches);
  testing.expectEqual('none', pick('forced-colors', ['none', 'active']));
  testing.expectEqual('hover', pick('any-hover', ['hover', 'none']));
  testing.expectEqual('hover', pick('hover', ['hover', 'none']));
  testing.expectEqual('fine', pick('any-pointer', ['fine', 'coarse', 'none']));
  testing.expectEqual('fine', pick('pointer', ['fine', 'coarse', 'none']));
  testing.expectEqual('browser', pick('display-mode', ['fullscreen', 'standalone', 'minimal-ui', 'browser']));
  // A wide-gamut HDR panel, which is what the Apple M4 this fork's WebGL
  // renderer names has: srgb and p3 both match, rec2020 does not.
  testing.expectEqual('p3', pick('color-gamut', ['rec2020', 'p3', 'srgb']));
  testing.expectEqual(true, window.matchMedia('(color-gamut: srgb)').matches);
  testing.expectEqual(false, window.matchMedia('(color-gamut: rec2020)').matches);
  testing.expectEqual('high', pick('dynamic-range', ['high', 'standard']));
  testing.expectEqual(true, window.matchMedia('(dynamic-range: standard)').matches);
  // Chrome answers the *boolean* form false even on an HDR panel -- measured
  // on a display where `(dynamic-range: high)` matches -- so it does not
  // implement dynamic-range in boolean context at all. color-gamut it does.
  testing.expectEqual(false, window.matchMedia('(dynamic-range)').matches);
  testing.expectEqual(true, window.matchMedia('(color-gamut)').matches);

  // device-* line up with screen, which is how CreepJS spots an iframe-shrunk one.
  testing.expectEqual(true, window.matchMedia(`(device-width: ${screen.width}px) and (device-height: ${screen.height}px)`).matches);
  // 1920x1200, so 8/5 -- the display's ratio, not the page's 16/9.
  testing.expectEqual(true, window.matchMedia('(device-aspect-ratio: 8/5)').matches);
  testing.expectEqual(true, window.matchMedia('(aspect-ratio: 16/9)').matches);
  testing.expectEqual(false, window.matchMedia('(device-width: 12345px)').matches);

  // Consistent with devicePixelRatio and screen.colorDepth.
  testing.expectEqual(false, window.matchMedia('(resolution: 1dppx)').matches);
  testing.expectEqual(true, window.matchMedia('(resolution: 2dppx)').matches);
  testing.expectEqual(2, window.devicePixelRatio);
  testing.expectEqual(true, window.matchMedia('(color: 10)').matches);
  testing.expectEqual(false, window.matchMedia('(color: 8)').matches);
  testing.expectEqual(30, screen.colorDepth);

  // devicePixelRatio survives being binary-searched. Kasada narrows it on
  // x-hyatt by halving a min-resolution bound and then repeating the ladder in
  // dpi and in dpcm, so a bound either side of 1 has to answer in all three.
  testing.expectEqual(true, window.matchMedia('(min-resolution: 0.625dppx)').matches);
  testing.expectEqual(true, window.matchMedia('(min-resolution: 1.5dppx)').matches);
  testing.expectEqual(false, window.matchMedia('(min-resolution: 2.5dppx)').matches);
  testing.expectEqual(true, window.matchMedia('(min-resolution: 50dpi)').matches);
  testing.expectEqual(true, window.matchMedia('(max-resolution: 256dpi)').matches);
  testing.expectEqual(true, window.matchMedia('(min-resolution: 30dpcm)').matches);
  testing.expectEqual(false, window.matchMedia('(max-resolution: 30dpcm)').matches);

  // The ladder has to answer the same way whichever unit it is written in.
  // That, not any one rung, is what the 314 queries on x-hyatt are checking:
  // Kasada halves a min-resolution bound and then repeats the whole descent in
  // dpi and in dpcm.
  //
  // 96dpi is exactly 1dppx, so the dpi column can sit on the boundary. dpcm
  // cannot -- 2dppx is 75.590551…dpcm and no finite decimal writes it -- so its
  // rungs stay a comfortable distance either side. That is not a workaround:
  // Chrome's own answers stop agreeing across units within about 0.005dppx of
  // the ratio, so a tie nobody can spell is not a thing to pin down here.
  const rungs = [
    { min: true, dppx: '0.5dppx', dpi: '48dpi', dpcm: '15dpcm' },
    { min: true, dppx: '1dppx', dpi: '96dpi', dpcm: '30dpcm' },
    { min: true, dppx: '2dppx', dpi: '192dpi', dpcm: '70dpcm' },
    { min: false, dppx: '3dppx', dpi: '288dpi', dpcm: '90dpcm' },
    { min: false, dppx: '4dppx', dpi: '384dpi', dpcm: '150dpcm' },
  ];
  for (const rung of rungs) {
    for (const unit of [rung.dppx, rung.dpi, rung.dpcm]) {
      testing.expectEqual(rung.min, window.matchMedia(`(min-resolution: ${unit})`).matches);
      // max- is the complement everywhere except the exact 2dppx rung, where
      // both bounds match because the comparison is inclusive.
      const exactly = unit === '2dppx' || unit === '192dpi';
      testing.expectEqual(!rung.min || exactly, window.matchMedia(`(max-resolution: ${unit})`).matches);
    }
  }

  // 0 is the value that makes every max- bound match and only a 0 min- one.
  testing.expectEqual(true, window.matchMedia('(max-color-index: 4)').matches);
  testing.expectEqual(true, window.matchMedia('(max-monochrome: 4)').matches);
  testing.expectEqual(false, window.matchMedia('(min-monochrome: 4)').matches);

  // A ratio term may be a decimal; 1920/1080 sits between these two bounds.
  testing.expectEqual(true, window.matchMedia('(max-aspect-ratio: 2.125)').matches);
  testing.expectEqual(false, window.matchMedia('(max-aspect-ratio: 1.7)').matches);

  testing.expectEqual('continuous', pick('device-posture', ['folded', 'continuous']));
  testing.expectEqual('continuous', navigator.devicePosture.type);
}
</script>

<script id=matchMedia_kasada_resolution_ladder>
{
  // The (min|max)-resolution queries x-hyatt's Kasada script was measured
  // asking -- 72 of the 314 it runs, the rest being width/height/aspect-ratio --
  // read out of tools/fingerprint/results/b53-reads-x-hyatt.json and answered
  // here the way the headed Chrome that clears the station answered them in the
  // same sitting (tools/fingerprint/probes/expr-b53-guard-questions.js).
  //
  // The point is the ladder as a whole, not any one rung: Kasada halves the
  // interval around devicePixelRatio and then repeats the descent in dppx, in
  // dpi and in dpcm, so the last twenty rungs sit within a millionth of the
  // ratio and a single disagreeing answer names a different browser.
  //
  // What is deliberately NOT asserted is monotonicity. Driving the same ladder
  // against Chrome under --force-device-scale-factor produces non-monotone
  // pairs there too -- its dpcm conversion is coarse enough that its tie region
  // is about 0.005dppx wide -- so requiring monotonicity here would require
  // something the reference does not do. What has to hold is the answers.
  const matching = [
    '(min-resolution:1.25dppx)', '(min-resolution:0.625dppx)', '(min-resolution:0.9375dppx)',
    '(min-resolution:1.09375dppx)', '(min-resolution:1.015625dppx)',
    '(min-resolution:0.9765625dppx)', '(min-resolution:0.99609375dppx)',
    '(min-resolution:1.005859375dppx)', '(min-resolution:1.0009765625dppx)',
    '(min-resolution:0.99853515625dppx)', '(min-resolution:0.999755859375dppx)',
    '(min-resolution:1.0003662109375dppx)', '(min-resolution:1.00006103515625dppx)',
    '(min-resolution:0.999908447265625dppx)', '(min-resolution:0.9999847412109375dppx)',
    '(min-resolution:1.0000228881835938dppx)', '(min-resolution:1.0000038146972656dppx)',
    '(min-resolution:1.0000133514404297dppx)', '(min-resolution:1.0000085830688477dppx)',
    '(min-resolution:1.0000061988830566dppx)', '(min-resolution:1.0000050067901611dppx)',
    '(min-resolution:1.0000044107437134dppx)', '(min-resolution:125dpi)',
    '(min-resolution:62.5dpi)', '(min-resolution:93.75dpi)', '(min-resolution:109.375dpi)',
    '(min-resolution:101.5625dpi)', '(min-resolution:97.65625dpi)',
    '(min-resolution:95.703125dpi)', '(min-resolution:96.6796875dpi)',
    '(min-resolution:96.19140625dpi)', '(min-resolution:95.947265625dpi)',
    '(min-resolution:96.0693359375dpi)', '(min-resolution:96.00830078125dpi)',
    '(min-resolution:95.977783203125dpi)', '(min-resolution:95.9930419921875dpi)',
    '(min-resolution:96.00067138671875dpi)', '(min-resolution:95.99685668945312dpi)',
    '(min-resolution:95.99876403808594dpi)', '(min-resolution:95.99971771240234dpi)',
    '(min-resolution:50dpcm)', '(min-resolution:25dpcm)', '(min-resolution:37.5dpcm)',
    '(min-resolution:43.75dpcm)', '(min-resolution:40.625dpcm)',
    '(min-resolution:39.0625dpcm)', '(min-resolution:38.28125dpcm)',
    '(min-resolution:37.890625dpcm)', '(min-resolution:37.6953125dpcm)',
    '(min-resolution:37.79296875dpcm)', '(min-resolution:37.841796875dpcm)',
    '(min-resolution:37.8173828125dpcm)', '(min-resolution:37.80517578125dpcm)',
    '(min-resolution:37.799072265625dpcm)', '(min-resolution:37.7960205078125dpcm)',
    '(min-resolution:37.79449462890625dpcm)', '(min-resolution:37.795257568359375dpcm)',
    '(min-resolution:37.79487609863281dpcm)', '(max-resolution: 256dpi)',
    '(min-resolution: 128dpi)', '(min-resolution: 64dpi)', '(min-resolution: 96dpi)',
  ];
  const notMatching = [
    '(min-resolution:5dppx)', '(min-resolution:2.5dppx)', '(min-resolution:500dpi)',
    '(min-resolution:250dpi)', '(min-resolution:200dpcm)', '(min-resolution:100dpcm)',
    '(min-resolution: 256dpi)', '(max-resolution: 128dpi)', '(max-resolution: 64dpi)',
    '(max-resolution: 96dpi)',
  ];
  for (const q of matching) testing.expectEqual(true, window.matchMedia(q).matches);
  for (const q of notMatching) testing.expectEqual(false, window.matchMedia(q).matches);
  testing.expectEqual(72, matching.length + notMatching.length);
}
</script>

<script id=matchMedia_datadome_question_set>
{
  // The eleven media queries dd-saks's DataDome script was measured asking, in
  // the order it asked them -- read out of the prop_read log in
  // tools/fingerprint/results/b53-reads-dd-saks.json, not invented. Two of them
  // used to come back the other way from the headed Chrome that clears the
  // station, and this block is what stops them drifting back.
  //
  // The expected column is that headed Chrome, measured in the same sitting
  // (tools/fingerprint/probes/expr-b53-guard-questions.js).
  const ask = (q) => window.matchMedia(q).matches;
  testing.expectEqual(true, ask('(any-pointer:fine)'));
  testing.expectEqual(true, ask('(any-hover:hover)'));
  testing.expectEqual(false, ask('(color-gamut:rec2020)'));
  testing.expectEqual(true, ask('(color-gamut:p3)'));
  testing.expectEqual(true, ask('(color-gamut:srgb)'));
  testing.expectEqual(true, ask('(dynamic-range:high)'));
  testing.expectEqual(true, ask('(dynamic-range:standard)'));
  testing.expectEqual(false, ask('(display-mode:standalone)'));
  testing.expectEqual(false, ask('(display-mode:fullscreen)'));
  testing.expectEqual(false, ask('(display-mode:minimal-ui)'));
  testing.expectEqual(true, ask('(display-mode:browser)'));

  // The reverse assertions. A panel that answered yes to everything would pass
  // the eleven above and still be a display nobody sells, so the ceiling is
  // named too: rec2020 stays out of reach, and the depth that puts p3 and high
  // within it is the one screen reports.
  testing.expectEqual(false, ask('(color: 12)'));
  testing.expectEqual(true, ask('(color: 10)'));
  testing.expectEqual(30, screen.colorDepth);
  testing.expectEqual(30, screen.pixelDepth);
}
</script>

<script id=matchMedia_combined>
{
  testing.expectEqual(true,  window.matchMedia('screen and (min-width: 600px)').matches);
  testing.expectEqual(false, window.matchMedia('print and (min-width: 600px)').matches);
  testing.expectEqual(true,  window.matchMedia('(min-width: 600px) and (max-width: 2000px)').matches);
}
</script>

<script id=matchMedia_comma_is_or>
{
  testing.expectEqual(true, window.matchMedia('print, screen').matches);
  testing.expectEqual(true, window.matchMedia('(max-width: 100px), (min-width: 600px)').matches);
  testing.expectEqual(false, window.matchMedia('(max-width: 100px), (min-width: 3000px)').matches);
}
</script>

<script id=matchMedia_not>
{
  testing.expectEqual(true,  window.matchMedia('not print').matches);
  testing.expectEqual(false, window.matchMedia('not screen').matches);
  testing.expectEqual(false, window.matchMedia('not (min-width: 600px)').matches);
}
</script>

<script id=matchMedia_only>
{
  // `only` is a legacy hint to old parsers; behaves as no-op for modern engines.
  testing.expectEqual(true, window.matchMedia('only screen').matches);
  testing.expectEqual(true, window.matchMedia('only screen and (min-width: 600px)').matches);
}
</script>

<script id=matchMedia_em_units>
{
  // 1em = 16px. 30em = 480px ≤ 1920px → matches.
  testing.expectEqual(true,  window.matchMedia('(min-width: 30em)').matches);
  // 121em = 1936px > 1920px → does not match.
  testing.expectEqual(false, window.matchMedia('(min-width: 121em)').matches);
  // u32-overflowing em / rem fails closed instead of panicking.
  testing.expectEqual(false, window.matchMedia('(min-width: 268435456em)').matches);
  testing.expectEqual(false, window.matchMedia('(min-width: 268435456rem)').matches);
}
</script>

<script id=matchMedia_comments_stripped>
{
  // CSS `/* ... */` comments between query tokens are stripped per spec.
  testing.expectEqual(true,  window.matchMedia('screen and /*x*/ (min-width: 1px)').matches);
  testing.expectEqual(true,  window.matchMedia('/* leading */ screen').matches);
  testing.expectEqual(true,  window.matchMedia('(min-width: /* hi */ 600px)').matches);
}
</script>

<script id=matchMedia_unimplemented_units>
{
  // Units the evaluator doesn't claim to support (cm/mm/pt/in/vw/vh) fail closed.
  testing.expectEqual(false, window.matchMedia('(min-width: 5cm)').matches);
  testing.expectEqual(false, window.matchMedia('(min-width: 50mm)').matches);
  testing.expectEqual(false, window.matchMedia('(min-width: 10pt)').matches);
  testing.expectEqual(false, window.matchMedia('(min-width: 1in)').matches);
  testing.expectEqual(false, window.matchMedia('(min-width: 50vw)').matches);
}
</script>

<script id=matchMedia_event_target>
{
  const mql = window.matchMedia('(orientation: portrait)');
  testing.expectEqual('function', typeof mql.addEventListener);
  testing.expectEqual('function', typeof mql.removeEventListener);
  testing.expectEqual('function', typeof mql.dispatchEvent);
}
</script>

<script id=matchMedia_serializes_the_query>
{
  // `media` is a re-serialisation of the parsed query, not the text handed in:
  // Chrome 150 answers `(min-width: 100px)` to `(min-width:100px)`. Every row
  // below was measured on a headed Chrome 150
  // (results/media-query-serialization.json).
  const rows = [
    // one space after the colon, none inside the parens
    ['(min-width:100px)', '(min-width: 100px)'],
    ['(min-width : 100px)', '(min-width: 100px)'],
    ['(  min-width  :  100px  )', '(min-width: 100px)'],
    ['screen and (min-width:100px)', 'screen and (min-width: 100px)'],
    ['screen,print', 'screen, print'],
    // names, units and keywords lowercased
    ['(MIN-WIDTH: 100PX)', '(min-width: 100px)'],
    ['SCREEN AND (MIN-WIDTH: 100px)', 'screen and (min-width: 100px)'],
    ['(min-resolution: 1DPPX)', '(min-resolution: 1dppx)'],
    ['(orientation: LANDSCAPE)', '(orientation: landscape)'],
    // CSS number serialisation
    ['(min-resolution: .625dppx)', '(min-resolution: 0.625dppx)'],
    ['(min-resolution: 0.6250dppx)', '(min-resolution: 0.625dppx)'],
    ['(min-width: 0100px)', '(min-width: 100px)'],
    ['(min-width: +100px)', '(min-width: 100px)'],
    ['(color: 08)', '(color: 8)'],
    // a ratio is two numbers around ' / ', and a bare number is ' / 1'
    ['(min-aspect-ratio: 1/2)', '(min-aspect-ratio: 1 / 2)'],
    ['(min-aspect-ratio: 1  /  2)', '(min-aspect-ratio: 1 / 2)'],
    ['(max-aspect-ratio: 2.125)', '(max-aspect-ratio: 2.125 / 1)'],
    ['(aspect-ratio: 16/9)', '(aspect-ratio: 16 / 9)'],
    ['(device-aspect-ratio: 16/9)', '(device-aspect-ratio: 16 / 9)'],
    ['(aspect-ratio > 1.5)', '(aspect-ratio > 1.5 / 1)'],
    // the range form spaces its operator
    ['(width>100px)', '(width > 100px)'],
    ['(width>= 100px)', '(width >= 100px)'],
    ['(100px<width)', '(100px < width)'],
    ['(100px<=width<=200px)', '(100px <= width <= 200px)'],
    ['(width=100px)', '(width = 100px)'],
    // comments and outer whitespace are gone
    ['/*c*/(min-width:100px)', '(min-width: 100px)'],
    ['(min-width:/*c*/100px)', '(min-width: 100px)'],
    ['  (min-width:100px)  ', '(min-width: 100px)'],
    // an `all` with a condition after it drops out; a negated one stays
    ['all and (min-width:100px)', '(min-width: 100px)'],
    ['not all and (min-width:100px)', 'not all and (min-width: 100px)'],
    // what does not parse is echoed back exactly as it came in
    ['(  min-bogus  :  1px  )', '(  min-bogus  :  1px  )'],
    ['(min-width: bogus)', '(min-width: bogus)'],
    ['(min-width:)', '(min-width:)'],
    ['(min-width: 100)', '(min-width: 100)'],
    ['(orientation:bogus)', '(orientation:bogus)'],
    ['(color: 8.0)', '(color: 8.0)'],
    ['(grid:2)', '(grid:2)'],
    ['bogus', 'bogus'],
    ['only bogus', 'only bogus'],
    ['bogus and (min-width:100px)', 'bogus and (min-width: 100px)'],
    // and a query with no valid reading at all is `not all`
    ['screen and bogus', 'not all'],
    ['(min-width:100px) and bogus', 'not all'],
    ['not', 'not all'],
    ['only', 'not all'],
    ['and', 'not all'],
    [')', 'not all'],
    ['(min-width:100px),,(max-width:200px)', '(min-width: 100px), not all, (max-width: 200px)'],
    // the empty query stays empty
    ['', ''],
    ['   ', ''],
    // nesting and the logical keywords
    ['((min-width:100px))', '((min-width: 100px))'],
    ['not (min-width:100px)', 'not (min-width: 100px)'],
    ['(min-width:100px) AND (max-width:200px)', '(min-width: 100px) and (max-width: 200px)'],
    ['(min-width:100px) OR (max-width:200px)', '(min-width: 100px) or (max-width: 200px)'],
    ['(min-width:100px), (max-width:200px)', '(min-width: 100px), (max-width: 200px)'],
  ];
  for (const [input, expected] of rows) {
    testing.expectEqual(expected, window.matchMedia(input).media);
  }
}
</script>

<script id=matchMedia_serialization_leaves_matches_alone>
{
  // The serialisation must not move the answer: same viewport, same verdicts as
  // the blocks above, read through the canonicalised spellings.
  testing.expectEqual(true, window.matchMedia('(min-width:100px)').matches);
  testing.expectEqual(true, window.matchMedia('(width>100px)').matches);
  testing.expectEqual(true, window.matchMedia('all and (min-width:100px)').matches);
  testing.expectEqual(false, window.matchMedia('(min-width:3000px)').matches);
  testing.expectEqual(false, window.matchMedia('(orientation:bogus)').matches);
  testing.expectEqual(false, window.matchMedia('screen and bogus').matches);
  testing.expectEqual(true, window.matchMedia('(min-aspect-ratio: 1/2)').matches);
}
</script>

<script id=matchMedia_number_forms>
{
  // A media-feature number is a full CSS <number>: it may carry an exponent, a
  // sign and a fraction, and a <length> may be negative (a bound below zero is
  // useless but well-formed). Every row measured on a headed Chrome 150 whose
  // viewport was 1920 wide; see results/media-query-serialization.json.
  const matchRows = [
    ['(min-width: 1e2px)', true],
    ['(min-width: 1E-2px)', true],
    ['(min-width: 100.5px)', true],
    ['(min-width: 1919.5px)', true],
    ['(min-width: 1920.5px)', false],
    ['(min-width: 6.25em)', true],
    ['(min-width: 119.9375em)', true],
    ['(min-width: 120.0625em)', false],
    ['(min-width: -0px)', true],
    ['(min-width: -1px)', true],
    // A <resolution> and a <ratio> may not go below zero, and a negative one
    // is malformed rather than clamped — but -0 is zero, so it is fine.
    ['(min-resolution: -0dppx)', true],
    ['(min-resolution: -1dppx)', false],
    ['(min-aspect-ratio: -1/2)', false],
    // The length is a float32, so an exponent past its range clamps instead of
    // becoming infinite, and one below it collapses to zero.
    ['(min-width: 1e400px)', false],
    ['(min-width: 1e-400px)', true],
    // An <integer> takes no exponent and no fraction.
    ['(color: 1e1)', false],
    ['(color: 8.0)', false],
  ];
  for (const [query, expected] of matchRows) {
    testing.expectEqual(expected + ' ' + query,
      window.matchMedia(query).matches + ' ' + query);
  }

  // Serialisation writes the number back from its value, with six significant
  // digits — the same rule canvas uses for a gradient offset.
  const mediaRows = [
    ['(min-width: 1e2px)', '(min-width: 100px)'],
    ['(min-width: 1E-2px)', '(min-width: 0.01px)'],
    ['(min-width: 119.9375em)', '(min-width: 119.938em)'],
    ['(min-width: 1e400px)', '(min-width: 3.40282e+38px)'],
    ['(min-width: -0px)', '(min-width: 0px)'],
    ['(min-width: -1px)', '(min-width: -1px)'],
    ['(color: -0)', '(color: 0)'],
    ['(min-resolution: 1e0dppx)', '(min-resolution: 1dppx)'],
    ['(aspect-ratio: -0/1)', '(aspect-ratio: 0 / 1)'],
    // and what is still malformed keeps its own text
    ['(min-width:5.px)', '(min-width:5.px)'],
    ['(color:1e1)', '(color:1e1)'],
    ['(min-resolution:-1dppx)', '(min-resolution:-1dppx)'],
    ['(min-aspect-ratio:-1/2)', '(min-aspect-ratio:-1/2)'],
  ];
  for (const [query, expected] of mediaRows) {
    testing.expectEqual(expected, window.matchMedia(query).media);
  }
}
</script>

<script id=matchMedia_nesting_and_logic>
{
  // MQ4 gives a media condition parens, `or`, and a `not` that binds to a
  // condition rather than to a media type. All rows measured on a headed
  // Chrome 150 at a 1920x1080 viewport.
  const rows = [
    ['((min-width: 100px))', true],
    ['((min-width: 3000px))', false],
    ['(((min-width: 100px)))', true],
    ['not ((min-width: 100px))', false],
    ['((min-width: 100px) and (max-width: 5000px))', true],
    ['((min-width: 3000px) or (min-width: 100px))', true],
    ['(min-width: 100px) or (min-width: 3000px)', true],
    ['(min-width: 3000px) or (min-width: 4000px)', false],
    ['screen and ((min-width: 100px))', true],
    ['(not (min-width: 100px))', false],
    ['(not (min-width: 3000px))', true],
    // An empty query is `all`, and `all` matches.
    ['', true],
    ['   ', true],
    // A media type this browser is not answers false — and negating that
    // answers true, whether the type is a real one it is not or a name no
    // registry has.
    ['print', false],
    ['not print', true],
    ['not tv', true],
    ['bogus', false],
    ['not bogus', true],
    ['not braille', true],
  ];
  for (const [query, expected] of rows) {
    testing.expectEqual(expected + ' [' + query + ']',
      window.matchMedia(query).matches + ' [' + query + ']');
  }
}
</script>

<script id=matches_reads_the_query_not_its_serialisation>
{
  // `matchMedia` stores the CANONICAL text and `matches` used to evaluate that,
  // so every threshold was rounded to six significant digits before it was ever
  // compared. Kasada bisects `devicePixelRatio` to twenty bits on x-hyatt --
  // 314 `(min|max)-resolution: …)` queries reading only `.matches` -- and the
  // rungs past the sixth digit were all being answered against the same rounded
  // number.
  //
  // The boundaries below are Chrome 151's, bisected on both arms at the
  // persona's dpr=2 with tools/fingerprint/probes/expr-b96-resolution-boundary.js.
  const dpr = window.devicePixelRatio;
  testing.expectEqual('dpr: 2', 'dpr: ' + dpr);

  // A `<resolution>` is compared at float32 precision: Chrome's crossover sits
  // exactly where a double rounds to the next float, at dpr 1 and at dpr 2
  // both.
  const m = (q) => window.matchMedia(q).matches;
  testing.expectEqual('at the float32 tie: true',
    'at the float32 tie: ' + m('(min-resolution: 2.0000001192092896dppx)'));
  testing.expectEqual('just past it: false',
    'just past it: ' + m('(min-resolution: 2.00000011920929dppx)'));
  testing.expectEqual('dpi at the same tie: true',
    'dpi at the same tie: ' + m('(min-resolution: 192.00001144409183dpi)'));
  testing.expectEqual('dpi just past it: false',
    'dpi just past it: ' + m('(min-resolution: 192.00001144409185dpi)'));

  // The same quantity in three spellings has to answer the same way. 2dppx is
  // 192dpi is 75.59055118110236dpcm, and the third one used to answer false
  // because the serialiser rounded it to 75.5906 first.
  testing.expectEqual('three spellings: true,true,true',
    'three spellings: ' +
      [m('(min-resolution: 2dppx)'), m('(min-resolution: 192dpi)'),
       m('(min-resolution: 75.59055118110236dpcm)')].join(','));

  // The three thresholds B53 measured the two arms disagreeing on, at dpr 1.
  // All three are below 2dppx, so all three match here -- what matters is that
  // they are read at full precision rather than rounded to 2.00000.
  testing.expectEqual('B53 trio: true,true,true',
    'B53 trio: ' +
      [m('(min-resolution: 1.0000038146972656dppx)'),
       m('(min-resolution: 1.0000044107437134dppx)'),
       m('(min-resolution: 37.795257568359375dpcm)')].join(','));
}
</script>

<script id=a_length_bound_tolerates_one_layout_unit>
{
  // A `<length>` bound is compared on the 1/64 px grid a LayoutUnit is stored
  // on, and the comparison tolerates one unit either way. Measured on Chrome
  // 151 at two viewport widths (1920 and 813): the last matching `min-width` is
  // exactly `width + 1/64`, the last matching `max-width` is `width - 1/64`,
  // and the plain `width` form tolerates both sides.
  const w = window.innerWidth;
  const U = 1 / 64;
  const m = (q) => window.matchMedia(q).matches;
  testing.expectEqual('min-width at +1/64: true',
    'min-width at +1/64: ' + m(`(min-width: ${w + U}px)`));
  testing.expectEqual('min-width just past it: false',
    'min-width just past it: ' + m(`(min-width: ${w + U * 1.0001}px)`));
  testing.expectEqual('max-width at -1/64: true',
    'max-width at -1/64: ' + m(`(max-width: ${w - U}px)`));
  testing.expectEqual('max-width just past it: false',
    'max-width just past it: ' + m(`(max-width: ${w - U * 1.0001}px)`));
  testing.expectEqual('width at +1/64: true',
    'width at +1/64: ' + m(`(width: ${w + U}px)`));
  testing.expectEqual('width at -1/64: true',
    'width at -1/64: ' + m(`(width: ${w - U}px)`));
  testing.expectEqual('width just past +1/64: false',
    'width just past +1/64: ' + m(`(width: ${w + U * 1.0001}px)`));

  // ...and the same rule on the other axis, so the tolerance is the
  // comparison's and not one feature's.
  const h = window.innerHeight;
  testing.expectEqual('min-height at +1/64: true',
    'min-height at +1/64: ' + m(`(min-height: ${h + U}px)`));
  testing.expectEqual('min-height just past it: false',
    'min-height just past it: ' + m(`(min-height: ${h + U * 1.0001}px)`));
}
</script>
