<!DOCTYPE html>
<script src="../testing.js"></script>

<!--
  `-webkit-font-smoothing` takes four keywords, and this engine knew two.

  `auto` and `none` were accepted; `antialiased` and `subpixel-antialiased`
  were rejected, so a declaration carrying either was dropped on the floor --
  from a stylesheet rule, from a `style=` attribute, from `setProperty`, from
  `CSS.supports` and from the computed value, which is
  [[supports-and-inline-retention-are-one-predicate]] holding again.

  Measured on Chrome 151 against this engine on the same http page, six readings
  per value (scratch/b76/expr-font-smoothing.js): 30 readings, 12 of them
  differing, all twelve belonging to those two keywords.

  Where it came from: Cloudflare's widget encodes its own stylesheet's
  `cssText` into the challenge payload, and the two arms' plaintext differed by
  exactly 37 characters -- `-webkit-font-smoothing: antialiased; `, one
  declaration, in the widget's `body, .main-wrapper` rule. Every page whose
  author CSS uses this property, which is most pages targeting a Mac, loses the
  declaration the same way.

  The root cause is not this property. `chrome_keywords.zig` is generated by
  offering Chrome every bare identifier that appears in any mdn-data value
  syntax, and mdn-data 2.24.0 has no `-webkit-font-smoothing` entry and no
  `antialiased` anywhere in it -- so the keyword was never offered, and an
  identifier that is never offered reads exactly like one Chrome rejected. The
  pool's ceiling is now Blink's own `css_value_keywords.json5` as well, so a
  keyword Chrome has cannot be missing from the pool again.
-->

<body>

<script id=font_smoothing_keywords>
{
  const rows = [];
  const check = (label, got, expected) => {
    rows.push(label + ' = ' + got);
    rows.push(label + ' = ' + expected);
  };

  // A rule's cssText, which is the reading the widget's payload showed.
  const sheet = document.createElement('style');
  document.head.appendChild(sheet);
  const ruleText = (value) => {
    sheet.textContent = '#p { -webkit-font-smoothing: ' + value + '; letter-spacing: 3px; }';
    const rule = sheet.sheet.cssRules[0];
    return rule ? rule.cssText : '(no rule)';
  };
  // An inline declaration, read back through the declaration rather than the
  // computed value: [[css-rejection-judged-by-inline-value]] -- a computed
  // value equal to the initial value cannot tell a refusal from an accepted
  // `auto`.
  const inlineText = (value) => {
    const el = document.createElement('div');
    el.setAttribute('style', '-webkit-font-smoothing: ' + value);
    return el.style.getPropertyValue('-webkit-font-smoothing');
  };
  const computedText = (value) => {
    const el = document.createElement('div');
    el.setAttribute('style', '-webkit-font-smoothing: ' + value);
    document.body.appendChild(el);
    const got = String(getComputedStyle(el).webkitFontSmoothing);
    el.remove();
    return got;
  };

  for (const value of ['auto', 'none', 'antialiased', 'subpixel-antialiased']) {
    check('rule ' + value, ruleText(value),
        '#p { -webkit-font-smoothing: ' + value + '; letter-spacing: 3px; }');
    check('inline ' + value, inlineText(value), value);
    check('setProperty ' + value, (() => {
      const el = document.createElement('div');
      el.style.setProperty('-webkit-font-smoothing', value);
      return el.style.getPropertyValue('-webkit-font-smoothing');
    })(), value);
    check('supports ' + value, String(CSS.supports('-webkit-font-smoothing', value)), 'true');
    check('computed ' + value, computedText(value), value);
  }

  // The refusal still has to work: an identifier Chrome does not take is
  // dropped, and widening the candidate pool must not have made the parser
  // permissive. Chrome answers the same five ways for this one.
  check('rule bogus', ruleText('zqxjkwvbn'), '#p { letter-spacing: 3px; }');
  check('inline bogus', inlineText('zqxjkwvbn'), '');
  check('supports bogus', String(CSS.supports('-webkit-font-smoothing', 'zqxjkwvbn')), 'false');
  check('computed bogus', computedText('zqxjkwvbn'), 'auto');

  sheet.remove();

  for (let i = 0; i < rows.length; i += 2) {
    testing.expectEqual(rows[i + 1], rows[i]);
  }
}
</script>
</body>
