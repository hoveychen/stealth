<!DOCTYPE html>
<script src="../testing.js"></script>

<!--
  Four properties whose two-component grammar this engine refused outright.

  `chrome_arity.one_component` is a licence to refuse: a property listed there
  takes no second component, so `margin-top: 1px 2px` is thrown away the way
  Chrome throws it away. The list is measured as a negative -- a property is
  only listed when Chrome refused *everything the sweep offered it* -- which
  makes the offer itself the ceiling. Two halves of that offer were too narrow:

    * the identifier pool was every bare identifier in an mdn-data value
      syntax, so `links` and `tabs` -- Blink keywords the standard has never
      heard of -- were never paired with anything, and
      `scroll-marker-group: after links` read as refused-by-Chrome;
    * the nineteen generic values carried no shape for a function call, a
      resolution, a dashed ident or a line-name list, so
      `clip-path: circle() padding-box` was never offered either.

  The second one had already been noticed once and patched at the other end:
  `tooManyComponents` carried a hand-written exemption for `transform`, whose
  comment says in as many words that the sweep "never offered `transform` two
  of them". Nobody wrote the same exemption for `clip-path`, `shape-outside`
  or `border-shape`, so those three stayed broken -- the same failure as
  [[generated-table-pool-ceiling]], one table over.

  Measured on Chrome 151 against this engine on the same page
  (scratch/b77/expr-serial.js, scratch/b77/expr-neg.js): 68 readings over the
  shape/box matrix, 34 of them differing, 25 of those a declaration this engine
  dropped and Chrome kept.

  The cases below are the ones Chrome serialises verbatim. Chrome also *omits*
  a box that is the property's own default reference box (`clip-path: circle()
  border-box` reads back `circle()`, `shape-outside: circle() margin-box` reads
  back `circle()`) and reorders a box written first -- a separate divergence
  this engine still has on `offset-path`, which was never in the table, so it
  is not what this test is about.

  What the fix costs, stated rather than hidden. The count was also the only
  thing refusing an *invalid* second component on these four properties, and
  six declarations Chrome drops are now kept:

    clip-path: circle() nonsense      shape-outside: circle() nonsense
    border-shape: circle() nonsense   border-shape: 1px 2px
    scroll-marker-group: after nonsense
    scroll-marker-group: links after

  They are not in the list below because this engine keeps them. Over the 52
  readings of scratch/b77/expr-assertions.js the two arms went from 16 differing
  to 12; over the 68 readings of the shape/box matrix, from 34 to 9. Trading
  this way round is the direction the table's own header asks for: a property
  wrongly refused "loses a style the page was written with -- the one kind of
  wrong these tables exist never to be".

  The residual has one root cause and it is a third instance of the same
  ceiling. `shorthand.refusesLonghand` grades a component against
  `chrome_shorthands.value_classes`, which is generated by walking the longhands
  of the shorthands the generator probes -- so a longhand no shorthand expands
  to, which is what all four of these are, is never measured and never graded.
  The keyword lists cannot stand in for it: they are measured by offering each
  identifier *alone*, and half of a two-component grammar routinely does not
  parse alone in either position (`align-items: first baseline` leads with one,
  `scroll-marker-group: after links` trails with one). Measured: reusing the
  keyword list on the trailing component refuses `after links`, which Chrome
  keeps.
-->

<body>

<script id=arity_pool_ceiling>
{
  const rows = [];
  const check = (label, got, expected) => {
    rows.push(label + ' = ' + got);
    rows.push(label + ' = ' + expected);
  };

  const el = document.createElement('div');
  document.body.appendChild(el);
  // Read back through the declaration, not the computed value:
  // [[css-rejection-judged-by-inline-value]] -- a computed value equal to the
  // initial value cannot tell a refusal from an accepted default.
  const inlineValue = (property, value) => {
    el.style.cssText = '';
    el.style.setProperty(property, value);
    return el.style.length > 0 ? el.style.getPropertyValue(property) : '(refused)';
  };

  const sheet = document.createElement('style');
  document.head.appendChild(sheet);
  const ruleText = (decl) => {
    sheet.textContent = '#p { ' + decl + '; letter-spacing: 3px; }';
    const rule = sheet.sheet.cssRules[0];
    return rule ? rule.cssText : '(no rule)';
  };

  // Kept by Chrome, and serialised exactly as authored.
  const kept = [
    ['clip-path', 'circle() padding-box'],
    ['clip-path', 'circle() content-box'],
    ['clip-path', 'circle() view-box'],
    ['shape-outside', 'circle() border-box'],
    ['shape-outside', 'circle() content-box'],
    ['border-shape', 'circle() circle()'],
    ['scroll-marker-group', 'after links'],
    ['scroll-marker-group', 'after tabs'],
  ];
  for (const [property, value] of kept) {
    check('inline ' + property + ': ' + value, inlineValue(property, value), value);
    check('rule ' + property + ': ' + value, ruleText(property + ': ' + value),
        '#p { ' + property + ': ' + value + '; letter-spacing: 3px; }');
  }

  // Refused by Chrome, and still refused here -- by the value classes and the
  // sole-identifier keyword check rather than by the count. Widening the offer
  // must not have made the parser permissive.
  const refused = [
    ['clip-path', '1px 2px'],
    ['shape-outside', '1px 2px'],
    ['shape-outside', 'fill-box'],
    ['scroll-marker-group', 'links'],
  ];
  for (const [property, value] of refused) {
    check('inline ' + property + ': ' + value, inlineValue(property, value), '(refused)');
    check('rule ' + property + ': ' + value, ruleText(property + ': ' + value),
        '#p { letter-spacing: 3px; }');
  }

  // `transform` was the one property the ceiling had already been noticed on,
  // and it is answered by a rule rather than by the table. Removing it from
  // the table must not take its refusals with it: Chrome keeps a list of
  // calls and refuses a list with anything else in it.
  check('inline transform list', inlineValue('transform', 'translate(1px) rotate(1deg)'),
      'translate(1px) rotate(1deg)');
  check('inline transform one', inlineValue('transform', 'translate(1px)'), 'translate(1px)');
  check('inline transform none', inlineValue('transform', 'none'), 'none');
  check('inline transform mixed tail', inlineValue('transform', 'rotate(45deg) 5px'), '(refused)');
  check('inline transform mixed head', inlineValue('transform', '5px rotate(45deg)'), '(refused)');
  check('inline transform comma', inlineValue('transform', 'rotate(1deg), rotate(2deg)'), '(refused)');

  // And the property the whole table is for still loses its second component.
  check('inline margin-top pair', inlineValue('margin-top', '1px 2px'), '(refused)');
  check('inline margin-top slash', inlineValue('width', '1px / 2px'), '(refused)');

  sheet.remove();
  el.remove();

  for (let i = 0; i < rows.length; i += 2) {
    testing.expectEqual(rows[i + 1], rows[i]);
  }
}
</script>
</body>
