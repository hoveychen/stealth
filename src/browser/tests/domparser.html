<!DOCTYPE html>
<script src="testing.js"></script>
<body></body>

<script id=basic>
{
  {
    const parser = new DOMParser();
    testing.expectEqual('object', typeof parser);
    testing.expectEqual('function', typeof parser.parseFromString);
  }

  {
    // Our stand-in for the error document is a parse of the <parsererror>
    // markup itself, so the declaration it carries is now an attribute and
    // shows up in the serialization -- which is what Chrome 151 prints for
    // that same markup (probe expr-g5-p67.js, `round_serialized`). Chrome's
    // own error document is a much larger XHTML one; only the namespace
    // handling is compared here.
    const parser = new DOMParser();
    let d = parser.parseFromString('', 'text/xml');
    testing.expectEqual(
      '<parsererror xmlns="http://www.mozilla.org/newlayout/xml/parsererror.xml">error</parsererror>',
      new XMLSerializer().serializeToString(d));
  }
}
</script>

<script id=parseSimpleHTML>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div>Hello World</div>', 'text/html');

  testing.expectEqual('object', typeof doc);
  testing.expectEqual('[object HTMLDocument]', doc.toString());

  const div = doc.querySelector('div');
  testing.expectEqual('DIV', div.tagName);
  testing.expectEqual('Hello World', div.textContent);
}
</script>

<script id=parseWithAttributes>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div id="test" class="foo">Content</div>', 'text/html');

  const div = doc.querySelector('div');
  testing.expectEqual('test', div.id);
  testing.expectEqual('foo', div.className);
  testing.expectEqual('Content', div.textContent);
}
</script>

<script id=parseMultipleElements>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div>First</div><span>Second</span>', 'text/html');

  const div = doc.querySelector('div');
  const span = doc.querySelector('span');

  testing.expectEqual('DIV', div.tagName);
  testing.expectEqual('First', div.textContent);
  testing.expectEqual('SPAN', span.tagName);
  testing.expectEqual('Second', span.textContent);
}
</script>

<script id=parseNestedElements>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div><p><span>Nested</span></p></div>', 'text/html');

  const div = doc.querySelector('div');
  const p = doc.querySelector('p');
  const span = doc.querySelector('span');

  testing.expectEqual('DIV', div.tagName);
  testing.expectEqual('P', p.tagName);
  testing.expectEqual('SPAN', span.tagName);
  testing.expectEqual('Nested', span.textContent);
  testing.expectEqual(p, div.firstChild);
  testing.expectEqual(span, p.firstChild);
}
</script>

<script id=parseEmptyString>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('', 'text/html');

  testing.expectEqual('object', typeof doc);
  testing.expectEqual('[object HTMLDocument]', doc.toString());
}
</script>

<script id=parsedDocumentIsIndependent>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div id="parsed">Parsed</div>', 'text/html');

  // The parsed document should be independent from the current document
  const currentDiv = document.querySelector('div');
  const parsedDiv = doc.querySelector('div');

  testing.expectEqual(null, currentDiv);
  testing.expectEqual('parsed', parsedDiv.id);
  testing.expectEqual('Parsed', parsedDiv.textContent);
}
</script>

<script id=malformedHTMLDoesNotThrow>
{
  const parser = new DOMParser();

  // HTML parsers should be forgiving and not throw on malformed HTML
  const doc1 = parser.parseFromString('<div><p>unclosed', 'text/html');
  testing.expectEqual('object', typeof doc1);

  const doc2 = parser.parseFromString('<<<invalid>>>', 'text/html');
  testing.expectEqual('object', typeof doc2);
}
</script>

<script id=getElementById>
{
  const doc = new DOMParser().parseFromString('<div id="new-node">new-node</div>', 'text/html');
  testing.expectEqual('new-node', doc.getElementById('new-node').textContent);
}
</script>

<script id=getElementById_isolationBetweenDocuments>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div id="shared-id">From parsed doc</div>', 'text/html');

  // Create element with same ID in main document
  const mainEl = document.createElement('div');
  mainEl.id = 'shared-id';
  mainEl.textContent = 'From main doc';
  document.body.appendChild(mainEl);

  // Each document should find its own element
  const mainFound = document.getElementById('shared-id');
  testing.expectEqual('From main doc', mainFound.textContent);

  const parsedFound = doc.getElementById('shared-id');
  testing.expectEqual('From parsed doc', parsedFound.textContent);

  // Clean up
  mainEl.remove();
}
</script>

<script id=getElementById_afterSettingId>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div>No ID initially</div>', 'text/html');

  const div = doc.querySelector('div');

  // Should not find it yet
  testing.expectEqual(null, doc.getElementById('new-id'));

  // Set ID via JavaScript
  div.id = 'new-id';

  // Should now find it
  const found = doc.getElementById('new-id');
  testing.expectEqual(div, found);
}
</script>

<script id=getElementById_afterRemovingId>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div id="remove-me">Content</div>', 'text/html');

  // Should find it initially
  const div = doc.getElementById('remove-me');
  testing.expectEqual('Content', div.textContent);

  // Remove the ID
  div.removeAttribute('id');

  // Should not find it anymore
  testing.expectEqual(null, doc.getElementById('remove-me'));
}
</script>

<script id=getElementById_afterChangingId>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div id="old-id">Content</div>', 'text/html');

  const div = doc.querySelector('div');

  // Change the ID
  div.id = 'new-id';

  // Should not find old ID
  testing.expectEqual(null, doc.getElementById('old-id'));

  // Should find new ID
  const found = doc.getElementById('new-id');
  testing.expectEqual(div, found);
}
</script>

<script id=getElementById_detachedFromParsedDoc>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<div id="will-detach">Content</div>', 'text/html');

  const div = doc.querySelector('div');

  // Should find it while connected
  testing.expectEqual(div, doc.getElementById('will-detach'));

  // Remove it from the document
  div.remove();

  // Should not find it after removal
  testing.expectEqual(null, doc.getElementById('will-detach'));
}
</script>

<script id=getElementById_multipleDocuments>
{
  const parser = new DOMParser();
  const doc1 = parser.parseFromString('<div id="doc1-el">Doc 1</div>', 'text/html');
  const doc2 = parser.parseFromString('<div id="doc2-el">Doc 2</div>', 'text/html');

  // Each document should only find its own element
  testing.expectEqual('Doc 1', doc1.getElementById('doc1-el').textContent);
  testing.expectEqual(null, doc1.getElementById('doc2-el'));

  testing.expectEqual('Doc 2', doc2.getElementById('doc2-el').textContent);
  testing.expectEqual(null, doc2.getElementById('doc1-el'));
}
</script>

<script id=getElementsByTagName-xml>
{
  const parser = new DOMParser();
  const doc = parser.parseFromString('<layout><row><col>A</col><col>B</col></row></layout>', 'text/xml');

  // Test getElementsByTagName on document
  const rows = doc.getElementsByTagName('row');
  testing.expectEqual(1, rows.length);

  // Test getElementsByTagName on element
  const row = rows[0];
  const cols = row.getElementsByTagName('col');
  testing.expectEqual(2, cols.length);
  testing.expectEqual('A', cols[0].textContent);
  testing.expectEqual('B', cols[1].textContent);

  // Test getElementsByTagName('*') on element
  const allElements = row.getElementsByTagName('*');
  testing.expectEqual(2, allElements.length);
}
</script>

<script id=typeSelectorCase-xml>
{
  // A type selector folds case in an HTML document and not in an XML one, and
  // the rule follows the *document*, not the element's namespace: an XHTML
  // `<p>` is case-sensitive even though it is HTML-namespaced. Chrome 151
  // readings, probes expr-x1.js / expr-x1d.js / expr-x1e.js.
  const parser = new DOMParser();

  {
    const doc = parser.parseFromString(
      '<root xmlns:s="http://www.w3.org/2000/svg"><Thing/><thing/><s:clipPath/></root>', 'text/xml');
    testing.expectEqual(1, doc.querySelectorAll('Thing').length);
    testing.expectEqual(1, doc.querySelectorAll('thing').length);
    testing.expectEqual(0, doc.querySelectorAll('THING').length);
    testing.expectEqual(1, doc.querySelectorAll('clipPath').length);
    testing.expectEqual(0, doc.querySelectorAll('clippath').length);
    testing.expectEqual(0, doc.querySelectorAll('CLIPPATH').length);
  }

  {
    // A capital kept by the XML parser is reachable only by that same
    // spelling, and each of `p` / `P` picks out its own element.
    const doc = parser.parseFromString(
      '<html xmlns="http://www.w3.org/1999/xhtml"><body><p>a</p><DIV/><P>b</P></body></html>',
      'application/xhtml+xml');
    testing.expectEqual('a', doc.querySelector('p').textContent);
    testing.expectEqual('b', doc.querySelector('P').textContent);
    testing.expectEqual(1, doc.querySelectorAll('body').length);
    testing.expectEqual(0, doc.querySelectorAll('BODY').length);
    testing.expectEqual(1, doc.querySelectorAll('DIV').length);
    testing.expectEqual(0, doc.querySelectorAll('div').length);
  }

  {
    const doc = parser.parseFromString(
      '<svg xmlns="http://www.w3.org/2000/svg"><clipPath/><g/></svg>', 'image/svg+xml');
    testing.expectEqual(1, doc.querySelectorAll('clipPath').length);
    testing.expectEqual(0, doc.querySelectorAll('clippath').length);
    testing.expectEqual(1, doc.querySelectorAll('svg').length);
    testing.expectEqual(0, doc.querySelectorAll('SVG').length);
    testing.expectEqual(1, doc.querySelectorAll('g').length);
    testing.expectEqual(0, doc.querySelectorAll('G').length);
  }

  {
    // No parse step at all: createDocument makes an XML document too.
    const doc = document.implementation.createDocument(null, 'Root');
    doc.documentElement.appendChild(doc.createElement('Kid'));
    testing.expectEqual(1, doc.querySelectorAll('Root').length);
    testing.expectEqual(0, doc.querySelectorAll('root').length);
    testing.expectEqual(1, doc.querySelectorAll('Kid').length);
    testing.expectEqual(0, doc.querySelectorAll('kid').length);
    testing.expectEqual(0, doc.querySelectorAll('KID').length);
  }

  {
    // The control: an HTML document still folds, foreign elements included.
    const doc = document.implementation.createHTMLDocument('t');
    doc.body.innerHTML = '<div></div><svg><clipPath></clipPath></svg>';
    testing.expectEqual(1, doc.querySelectorAll('DIV').length);
    testing.expectEqual(1, doc.querySelectorAll('clipPath').length);
    testing.expectEqual(1, doc.querySelectorAll('clippath').length);
    testing.expectEqual(1, doc.querySelectorAll('CLIPPATH').length);
  }
}
</script>

<script id=contentType-echoes-the-parsed-mime>
{
  // `contentType` reports the mime the document was parsed as, not a single
  // stand-in for "some kind of XML". Chrome 151 readings, probe expr-g1.js.
  const parser = new DOMParser();
  const SVG = 'http://www.w3.org/2000/svg';

  testing.expectEqual('text/xml', parser.parseFromString('<r/>', 'text/xml').contentType);
  testing.expectEqual('application/xml',
    parser.parseFromString('<r/>', 'application/xml').contentType);
  testing.expectEqual('image/svg+xml',
    parser.parseFromString('<svg xmlns="' + SVG + '"/>', 'image/svg+xml').contentType);
  testing.expectEqual('application/xhtml+xml',
    parser.parseFromString(
      '<html xmlns="http://www.w3.org/1999/xhtml"><body><p>x</p></body></html>',
      'application/xhtml+xml').contentType);

  // The two that were already right, kept as regressions: the HTML branch and
  // the documents that never went through a parser at all.
  testing.expectEqual('text/html', parser.parseFromString('<p>x</p>', 'text/html').contentType);
  testing.expectEqual('text/html', document.implementation.createHTMLDocument('t').contentType);
  testing.expectEqual('application/xml',
    document.implementation.createDocument(null, 'Root').contentType);
}
</script>

<script id=namespaceURI-xml>
{
  // An XML element sits in whatever namespace is declared over it, and in none
  // at all when nothing declares one. Chrome 151 readings, probes expr-g5.js /
  // expr-g5b.js.
  //
  // The declaration attribute the readings also show -- `xmlns` staying in
  // `attributes` -- is checked separately, in `xmlnsAttribute-xml`.
  const parser = new DOMParser();
  const XHTML = 'http://www.w3.org/1999/xhtml';
  const SVG = 'http://www.w3.org/2000/svg';

  {
    // Nothing declared: the null namespace, not the XML one.
    const doc = parser.parseFromString('<root><kid/></root>', 'text/xml');
    const root = doc.documentElement;
    testing.expectEqual(null, root.namespaceURI);
    testing.expectEqual(null, root.firstElementChild.namespaceURI);
  }

  {
    // A default declaration reaches the element that carries it and its
    // descendants.
    const doc = parser.parseFromString('<root xmlns="urn:x"><kid/></root>', 'text/xml');
    const root = doc.documentElement;
    testing.expectEqual('urn:x', root.namespaceURI);
    testing.expectEqual('urn:x', root.firstElementChild.namespaceURI);
    testing.expectEqual('urn:x', root.lookupNamespaceURI(null));
  }

  {
    // An inner declaration wins over the outer one for its own subtree.
    const doc = parser.parseFromString(
      '<root xmlns="urn:x"><kid xmlns="urn:y"><g/></kid></root>', 'text/xml');
    const kid = doc.documentElement.firstElementChild;
    testing.expectEqual('urn:x', doc.documentElement.namespaceURI);
    testing.expectEqual('urn:y', kid.namespaceURI);
    testing.expectEqual('urn:y', kid.firstElementChild.namespaceURI);
  }

  {
    // `xmlns=""` puts the subtree back in the null namespace.
    const doc = parser.parseFromString(
      '<root xmlns="urn:x"><kid xmlns=""/></root>', 'text/xml');
    const kid = doc.documentElement.firstElementChild;
    testing.expectEqual('urn:x', doc.documentElement.namespaceURI);
    testing.expectEqual(null, kid.namespaceURI);
  }

  {
    // A prefix declaration does not move the element that carries it: `<root>`
    // stays in the null namespace and only `s:`-prefixed elements follow it.
    const doc = parser.parseFromString(
      '<root xmlns:s="' + SVG + '"><s:g/><plain/></root>', 'text/xml');
    const root = doc.documentElement;
    testing.expectEqual(null, root.namespaceURI);
    testing.expectEqual(SVG, root.children[0].namespaceURI);
    testing.expectEqual('g', root.children[0].localName);
    testing.expectEqual(null, root.children[1].namespaceURI);
  }

  {
    // The two mimes whose namespace the document flavour would otherwise
    // suggest: it is the declaration that puts them there.
    const doc = parser.parseFromString(
      '<html xmlns="' + XHTML + '"><body><p>x</p></body></html>', 'application/xhtml+xml');
    testing.expectEqual(XHTML, doc.documentElement.namespaceURI);
    testing.expectEqual(XHTML, doc.querySelector('p').namespaceURI);
  }

  {
    const doc = parser.parseFromString(
      '<svg xmlns="' + SVG + '"><clipPath/></svg>', 'image/svg+xml');
    testing.expectEqual(SVG, doc.documentElement.namespaceURI);
    testing.expectEqual(SVG, doc.documentElement.firstElementChild.namespaceURI);
  }

  {
    // No parse step: createDocument puts the root in the namespace it is given.
    const withNs = document.implementation.createDocument('urn:x', 'Root');
    testing.expectEqual('urn:x', withNs.documentElement.namespaceURI);

    const withoutNs = document.implementation.createDocument(null, 'Root');
    testing.expectEqual(null, withoutNs.documentElement.namespaceURI);
  }

  {
    // A uri exactly as long as the XHTML namespace is not the XHTML namespace:
    // 28 characters is a coincidence, not a match. Chrome 151 readings, probe
    // expr-g5b.js.
    const U28 = 'urn:aaaaaaaaaaaaaaaaaaaaaaaa';
    testing.expectEqual(28, U28.length);
    testing.expectEqual(28, 'http://www.w3.org/1999/xhtml'.length);

    const root = parser.parseFromString(
      '<root xmlns="' + U28 + '"><kid/></root>', 'text/xml').documentElement;
    testing.expectEqual(U28, root.namespaceURI);
    testing.expectEqual(U28, root.firstElementChild.namespaceURI);
    testing.expectEqual('root', root.tagName);
    testing.expectEqual(U28, document.createElementNS(U28, 'thing').namespaceURI);
  }
}
</script>

<script id=attributeNameCase-xml>
{
  // An attribute name goes the same way as a type selector, and the rule again
  // follows the *document*: an XML document matches it exactly, HTML-namespaced
  // elements included. Chrome 151 readings, probes expr-a1.js / expr-a2.js /
  // expr-a2b.js. The HTML-document half lives in element/svg/attribute_name_case.
  const parser = new DOMParser();

  {
    // An XHTML `<p>` is HTML-namespaced, and its capital is still exact-only.
    const doc = parser.parseFromString(
      '<html xmlns="http://www.w3.org/1999/xhtml"><body><p Foo="1">x</p></body></html>',
      'application/xhtml+xml');
    testing.expectEqual('Foo', doc.querySelector('p').attributes[0].name);
    testing.expectEqual(1, doc.querySelectorAll('[Foo]').length);
    testing.expectEqual(0, doc.querySelectorAll('[foo]').length);
    testing.expectEqual(0, doc.querySelectorAll('[FOO]').length);
  }

  {
    // Each spelling picks out its own element, and neither reaches the other.
    const doc = parser.parseFromString(
      '<root xmlns:s="http://www.w3.org/2000/svg"><s:g Bar="1"/><s:rect bar="2"/></root>',
      'text/xml');
    testing.expectEqual(1, doc.querySelectorAll('[Bar]').length);
    testing.expectEqual(1, doc.querySelectorAll('[bar]').length);
    testing.expectEqual(0, doc.querySelectorAll('[BAR]').length);
    testing.expectEqual('1', doc.querySelector('[Bar]').getAttribute('Bar'));
    testing.expectEqual('2', doc.querySelector('[bar]').getAttribute('bar'));
  }

  {
    // The value matchers never get a chance to run when the name is off, the
    // `i` flag included -- that flag is about the value, not the name.
    const doc = parser.parseFromString(
      '<root xmlns:s="http://www.w3.org/2000/svg"><s:g Bar="one two"/></root>', 'text/xml');
    testing.expectEqual(1, doc.querySelectorAll('[Bar="one two"]').length);
    testing.expectEqual(0, doc.querySelectorAll('[bar="one two"]').length);
    testing.expectEqual(0, doc.querySelectorAll('[bar~="two"]').length);
    testing.expectEqual(0, doc.querySelectorAll('[bar="ONE TWO" i]').length);
    testing.expectEqual(1, doc.querySelectorAll('[Bar="ONE TWO" i]').length);
  }

  {
    // Both spellings on one element, where an HTML document would take the
    // first in order: here each selector takes its own, whichever came first.
    for (const attrs of ['Bar="cap" bar="low"', 'bar="low" Bar="cap"']) {
      const doc = parser.parseFromString(
        '<root xmlns:s="http://www.w3.org/2000/svg"><s:g ' + attrs + '/></root>', 'text/xml');
      testing.expectEqual(1, doc.querySelectorAll('[Bar="cap"]').length);
      testing.expectEqual(1, doc.querySelectorAll('[bar="low"]').length);
      testing.expectEqual(0, doc.querySelectorAll('[Bar="low"]').length);
      testing.expectEqual(0, doc.querySelectorAll('[bar="cap"]').length);
    }
  }

  {
    // No parse step: createDocument makes an XML document too, and setAttribute
    // does not lowercase there.
    const doc = document.implementation.createDocument(null, 'Root');
    const a = doc.createElement('a');
    a.setAttribute('Foo', '1');
    doc.documentElement.appendChild(a);
    testing.expectEqual('Foo', a.attributes[0].name);
    testing.expectEqual(1, doc.querySelectorAll('[Foo]').length);
    testing.expectEqual(0, doc.querySelectorAll('[foo]').length);
  }
}
</script>

<script id=xmlnsAttribute-xml>
{
  // A namespace declaration is consumed by the parser *and* left behind as an
  // ordinary attribute, ahead of the others whatever the source order. Chrome
  // 151 readings, probe expr-g5.js.
  //
  // What is checked here is the attribute's name and value. Chrome also reads
  // its `namespaceURI` as the xmlns namespace and splits `prefix` / `localName`
  // off the colon; this engine has no namespace on an attribute at all
  // (`Attribute.getNamespaceURI` is a flat null, `getAttributeNS` ignores the
  // argument), which is its own deviation and not this one's to fix.
  const parser = new DOMParser();
  const XHTML = 'http://www.w3.org/1999/xhtml';
  const SVG = 'http://www.w3.org/2000/svg';
  const attrs = (el) => Array.from(el.attributes).map((a) => [a.name, a.value]);

  {
    // Nothing declared, nothing to keep.
    const doc = parser.parseFromString('<root><kid/></root>', 'text/xml');
    testing.expectEqual([], attrs(doc.documentElement));
  }

  {
    const doc = parser.parseFromString('<root xmlns="urn:x"><kid/></root>', 'text/xml');
    const root = doc.documentElement;
    testing.expectEqual([['xmlns', 'urn:x']], attrs(root));
    testing.expectEqual('urn:x', root.getAttribute('xmlns'));
    testing.expectEqual(true, root.hasAttribute('xmlns'));
    // The declaration reaches only the element carrying it, not its children.
    testing.expectEqual([], attrs(root.firstElementChild));
  }

  {
    // An inner declaration is kept on the inner element.
    const doc = parser.parseFromString(
      '<root xmlns="urn:x"><kid xmlns="urn:y"><g/></kid></root>', 'text/xml');
    testing.expectEqual([['xmlns', 'urn:x']], attrs(doc.documentElement));
    testing.expectEqual([['xmlns', 'urn:y']],
      attrs(doc.documentElement.firstElementChild));
  }

  {
    // The empty declaration is still an attribute.
    const doc = parser.parseFromString(
      '<root xmlns="urn:x"><kid xmlns=""/></root>', 'text/xml');
    testing.expectEqual([['xmlns', '']], attrs(doc.documentElement.firstElementChild));
  }

  {
    // A prefix declaration keeps its `xmlns:` spelling, and is what makes
    // `lookupNamespaceURI` answer for that prefix.
    const doc = parser.parseFromString(
      '<root xmlns:s="' + SVG + '"><s:g/><plain/></root>', 'text/xml');
    const root = doc.documentElement;
    testing.expectEqual([['xmlns:s', SVG]], attrs(root));
    testing.expectEqual(SVG, root.lookupNamespaceURI('s'));
    // Carried by the root only: the elements that follow it hold nothing.
    testing.expectEqual([], attrs(root.children[0]));
    testing.expectEqual([], attrs(root.children[1]));
  }

  {
    // The declaration comes first in `attributes` whatever the source order.
    const mixed = parser.parseFromString('<root a="1" xmlns="urn:x" b="2"/>', 'text/xml');
    testing.expectEqual([['xmlns', 'urn:x'], ['a', '1'], ['b', '2']],
      attrs(mixed.documentElement));

    const prefixFirst = parser.parseFromString('<root xmlns:s="urn:y" a="1"/>', 'text/xml');
    testing.expectEqual([['xmlns:s', 'urn:y'], ['a', '1']],
      attrs(prefixFirst.documentElement));
  }

  {
    // Several declarations on one element keep their own source order, whatever
    // that order is and whatever sits between them. Chrome 151 readings, probe
    // expr-order.js.
    testing.expectEqual(['xmlns', 'xmlns:s'],
      attrs(parser.parseFromString('<root xmlns="urn:x" xmlns:s="urn:s"/>', 'text/xml')
        .documentElement).map((a) => a[0]));
    testing.expectEqual(['xmlns:s', 'xmlns'],
      attrs(parser.parseFromString('<root xmlns:s="urn:s" xmlns="urn:x"/>', 'text/xml')
        .documentElement).map((a) => a[0]));
    testing.expectEqual(['xmlns:a', 'xmlns:b'],
      attrs(parser.parseFromString('<root xmlns:a="urn:a" xmlns:b="urn:b"/>', 'text/xml')
        .documentElement).map((a) => a[0]));
    testing.expectEqual(['xmlns:a', 'xmlns', 'xmlns:b'],
      attrs(parser.parseFromString('<root xmlns:a="urn:a" xmlns="urn:x" xmlns:b="urn:b"/>', 'text/xml')
        .documentElement).map((a) => a[0]));
    // ... and they all still come ahead of the plain attributes.
    testing.expectEqual(['xmlns', 'xmlns:s', 'p', 'q', 'r'],
      attrs(parser.parseFromString('<root p="1" xmlns="urn:x" q="2" xmlns:s="urn:s" r="3"/>', 'text/xml')
        .documentElement).map((a) => a[0]));
  }

  {
    const doc = parser.parseFromString(
      '<html xmlns="' + XHTML + '"><body><p>x</p></body></html>', 'application/xhtml+xml');
    testing.expectEqual([['xmlns', XHTML]], attrs(doc.documentElement));
    testing.expectEqual([], attrs(doc.getElementsByTagNameNS(XHTML, 'body')[0]));
  }

  {
    const doc = parser.parseFromString(
      '<svg xmlns="' + SVG + '"><clipPath/></svg>', 'image/svg+xml');
    testing.expectEqual([['xmlns', SVG]], attrs(doc.documentElement));
  }

  {
    // No parse step: createDocument writes no declaration attribute for the
    // namespace it is handed.
    testing.expectEqual([],
      attrs(document.implementation.createDocument('urn:x', 'Root').documentElement));
    testing.expectEqual([],
      attrs(document.implementation.createDocument(null, 'Root').documentElement));
  }
}
</script>

<script id=tagNameCase-xml>
{
  // tagName uppercases only for an HTML-namespaced element in an *HTML*
  // document; an XML document hands back the qualified name as written, and a
  // prefix stays on it. Chrome 151 readings, probe expr-g4-p67.js.
  //
  // What the serializer does with those names is a separate deviation and not
  // asserted here: Chrome prints `<s:clipPath xmlns:s="...">` and
  // `<p xmlns="...">` where we print no declaration.
  const parser = new DOMParser();
  const XHTML = 'http://www.w3.org/1999/xhtml';
  const SVG = 'http://www.w3.org/2000/svg';
  // [tagName, nodeName, localName, prefix, namespaceURI]
  const info = (el) => [el.tagName, el.nodeName, el.localName, el.prefix, el.namespaceURI];

  {
    // No namespace at all: both spellings survive, and they are distinct.
    const doc = parser.parseFromString('<Root><kid/><KID/></Root>', 'text/xml');
    testing.expectEqual(['Root', 'Root', 'Root', null, null], info(doc.documentElement));
    testing.expectEqual(['kid', 'kid', 'kid', null, null], info(doc.documentElement.children[0]));
    testing.expectEqual(['KID', 'KID', 'KID', null, null], info(doc.documentElement.children[1]));
  }

  {
    // XHTML: HTML-namespaced, and still not uppercased.
    const doc = parser.parseFromString(
      '<html xmlns="' + XHTML + '"><body><p>x</p><DIV/></body></html>', 'application/xhtml+xml');
    testing.expectEqual(['html', 'html', 'html', null, XHTML], info(doc.documentElement));
    testing.expectEqual(['body', 'body', 'body', null, XHTML],
      info(doc.getElementsByTagNameNS(XHTML, 'body')[0]));
    testing.expectEqual(['p', 'p', 'p', null, XHTML],
      info(doc.getElementsByTagNameNS(XHTML, 'p')[0]));
    // A capitalised spelling is its own name in XML, so it never matched the
    // HTML table to begin with.
    testing.expectEqual(['DIV', 'DIV', 'DIV', null, XHTML],
      info(doc.getElementsByTagNameNS(XHTML, 'DIV')[0]));
  }

  {
    // A prefix rides along in tagName / nodeName, and splits off into
    // prefix / localName.
    const doc = parser.parseFromString(
      '<root xmlns:s="' + SVG + '"><s:clipPath/><s:g/></root>', 'text/xml');
    testing.expectEqual(['s:clipPath', 's:clipPath', 'clipPath', 's', SVG],
      info(doc.documentElement.children[0]));
    testing.expectEqual(['s:g', 's:g', 'g', 's', SVG],
      info(doc.documentElement.children[1]));
  }

  {
    // A default declaration leaves no prefix behind.
    const doc = parser.parseFromString('<svg xmlns="' + SVG + '"><clipPath/></svg>', 'image/svg+xml');
    testing.expectEqual(['svg', 'svg', 'svg', null, SVG], info(doc.documentElement));
    testing.expectEqual(['clipPath', 'clipPath', 'clipPath', null, SVG],
      info(doc.documentElement.children[0]));
  }

  {
    // The HTML document is the one that uppercases, and only for its own
    // namespace: a foreign element there is case-preserving as ever.
    const doc = parser.parseFromString('<p>x</p><svg><clipPath/></svg>', 'text/html');
    testing.expectEqual(['P', 'P', 'p', null, XHTML], info(doc.querySelector('p')));
    testing.expectEqual(['clipPath', 'clipPath', 'clipPath', null, SVG],
      info(doc.querySelector('clipPath')));
  }
}
</script>

<script id=getElementsByTagName-qualified-xml>
{
  // getElementsByTagName compares the *qualified* name -- the same string
  // tagName reads back -- and folds ASCII case only in an HTML document. So an
  // XHTML `<p>` answers to `p` and not to `P`, and `<s:clipPath/>` answers to
  // `s:clipPath` and not to `clipPath`. getElementsByTagNameNS is unaffected:
  // it takes a local name, which never carried the prefix. Chrome 151
  // readings, probe expr-g2-p67.js.
  const parser = new DOMParser();
  const XHTML = 'http://www.w3.org/1999/xhtml';
  const SVG = 'http://www.w3.org/2000/svg';
  const names = (list) => Array.from(list).map((e) => e.tagName);

  {
    // No namespace: each spelling reaches only its own element.
    const doc = parser.parseFromString('<Root><kid/><KID/></Root>', 'text/xml');
    testing.expectEqual(['Root'], names(doc.getElementsByTagName('Root')));
    testing.expectEqual([], names(doc.getElementsByTagName('root')));
    testing.expectEqual(['kid'], names(doc.getElementsByTagName('kid')));
    testing.expectEqual(['KID'], names(doc.getElementsByTagName('KID')));
    testing.expectEqual(['Root', 'kid', 'KID'], names(doc.getElementsByTagName('*')));
    testing.expectEqual(['kid'], names(doc.getElementsByTagNameNS('*', 'kid')));
    testing.expectEqual(['KID'], names(doc.getElementsByTagNameNS('*', 'KID')));
    testing.expectEqual(['kid'], names(doc.getElementsByTagNameNS(null, 'kid')));
  }

  {
    // XHTML: HTML-namespaced and still exact-only, which cuts both ways --
    // `P` misses the lowercase element, and `DIV` is the only way to the
    // capitalised one.
    const doc = parser.parseFromString(
      '<html xmlns="' + XHTML + '"><body><p/><DIV/></body></html>', 'application/xhtml+xml');
    testing.expectEqual(['p'], names(doc.getElementsByTagName('p')));
    testing.expectEqual([], names(doc.getElementsByTagName('P')));
    testing.expectEqual(['DIV'], names(doc.getElementsByTagName('DIV')));
    testing.expectEqual([], names(doc.getElementsByTagName('div')));
    testing.expectEqual(['body'], names(doc.getElementsByTagName('body')));
    testing.expectEqual([], names(doc.getElementsByTagName('BODY')));
    testing.expectEqual(['p'], names(doc.getElementsByTagNameNS(XHTML, 'p')));
    testing.expectEqual([], names(doc.getElementsByTagNameNS(XHTML, 'P')));
    testing.expectEqual(['DIV'], names(doc.getElementsByTagNameNS(XHTML, 'DIV')));
  }

  {
    // A prefixed element is named by its qualified name here, and by its local
    // name through the NS variant.
    const doc = parser.parseFromString(
      '<root xmlns:s="' + SVG + '"><s:clipPath/><s:g/></root>', 'text/xml');
    testing.expectEqual(['s:clipPath'], names(doc.getElementsByTagName('s:clipPath')));
    testing.expectEqual([], names(doc.getElementsByTagName('clipPath')));
    testing.expectEqual(['s:g'], names(doc.getElementsByTagName('s:g')));
    testing.expectEqual([], names(doc.getElementsByTagName('g')));
    testing.expectEqual([], names(doc.getElementsByTagName('s:clippath')));
    testing.expectEqual(['s:clipPath'], names(doc.getElementsByTagNameNS(SVG, 'clipPath')));
    testing.expectEqual([], names(doc.getElementsByTagNameNS(SVG, 's:clipPath')));
    testing.expectEqual(['s:clipPath'], names(doc.getElementsByTagNameNS('*', 'clipPath')));
  }

  {
    // The HTML document is the one that folds, and only for its own namespace:
    // a foreign element there stays exact. Guards the half that was already
    // aligned.
    const doc = parser.parseFromString('<p>x</p><svg><clipPath/></svg>', 'text/html');
    testing.expectEqual(['P'], names(doc.getElementsByTagName('p')));
    testing.expectEqual(['P'], names(doc.getElementsByTagName('P')));
    testing.expectEqual(['clipPath'], names(doc.getElementsByTagName('clipPath')));
    testing.expectEqual([], names(doc.getElementsByTagName('clippath')));
    testing.expectEqual(['clipPath'], names(doc.getElementsByTagNameNS(SVG, 'clipPath')));
    testing.expectEqual([], names(doc.getElementsByTagNameNS(SVG, 'clippath')));
  }
}
</script>

<script id=xml-namespaces>
{
  const doc = new DOMParser().parseFromString(
    '<r xmlns:a="urn:a" a:b="1" xml:lang="en" c="2"><a:k/><k/></r>', 'text/xml');
  const r = doc.documentElement;

  // Elements outside any xmlns declaration are in no namespace
  testing.expectEqual(null, r.namespaceURI);
  testing.expectEqual(1, doc.getElementsByTagNameNS('', 'r').length);
  testing.expectEqual(1, doc.getElementsByTagNameNS(null, 'k').length);

  // Prefixed attributes keep their qualified name. (Not asserted: browsers
  // also list xmlns:a as an attribute; xml5ever consumes the declaration.)
  testing.expectEqual(true, Array.from(r.attributes).some(a => a.name === 'a:b'));
  testing.expectEqual(false, Array.from(r.attributes).some(a => a.name === 'b'));
  testing.expectEqual('1', r.getAttribute('a:b'));
  testing.expectEqual('en', r.getAttribute('xml:lang'));
  testing.expectEqual(null, r.getAttribute('lang'));
  testing.expectEqual('en', r.getAttributeNS('http://www.w3.org/XML/1998/namespace', 'lang'));
  testing.expectEqual(true, r.hasAttributeNS('http://www.w3.org/XML/1998/namespace', 'lang'));
}
</script>

<script id=xml-content-type>
{
  const p = new DOMParser();
  for (const type of ['text/xml', 'application/xml', 'application/xhtml+xml', 'image/svg+xml']) {
    testing.expectEqual(type, p.parseFromString('<a/>', type).contentType);
    testing.expectEqual(type, p.parseFromString('<a>', type).contentType);
  }
  testing.expectEqual('text/html', p.parseFromString('<p>', 'text/html').contentType);
}
</script>

<script id=xml-element-namespaces>
{
  const doc = new DOMParser().parseFromString(
    '<root xmlns="urn:foo"><a:b xmlns:a="urn:a" a:x="1"/><c xmlns=""/><svg xmlns="http://www.w3.org/2000/svg"/></root>', 'text/xml');
  const root = doc.documentElement;
  testing.expectEqual('urn:foo', root.namespaceURI);
  testing.expectEqual('urn:foo', root.lookupNamespaceURI(null));

  const ab = root.firstChild;
  testing.expectEqual('a:b', ab.tagName);
  testing.expectEqual('a:b', ab.nodeName);
  testing.expectEqual('a', ab.prefix);
  testing.expectEqual('b', ab.localName);
  testing.expectEqual('urn:a', ab.namespaceURI);
  testing.expectEqual('1', ab.getAttribute('a:x'));
  testing.expectEqual(1, doc.getElementsByTagNameNS('urn:a', 'b').length);

  testing.expectEqual(null, root.childNodes[1].namespaceURI);
  testing.expectEqual('http://www.w3.org/2000/svg', root.childNodes[2].namespaceURI);
  testing.expectEqual(true, root.childNodes[2] instanceof SVGElement);

  const soap = new DOMParser().parseFromString(
    '<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/"><soap:Body/></soap:Envelope>', 'text/xml');
  testing.expectEqual('soap:Envelope', soap.documentElement.tagName);
  testing.expectEqual('Envelope', soap.documentElement.localName);
  testing.expectEqual(1, soap.getElementsByTagName('soap:Body').length);
  testing.expectEqual(1, soap.getElementsByTagNameNS('http://schemas.xmlsoap.org/soap/envelope/', 'Body').length);
}
</script>

<script id=xml-parsererror>
{
  const p = new DOMParser();
  const isError = (doc) => {
    const root = doc.documentElement;
    return root.localName === 'parsererror'
      && root.namespaceURI === 'http://www.mozilla.org/newlayout/xml/parsererror.xml'
      && doc.childNodes.length === 1;
  };

  // well-formedness errors -> <parsererror> document
  for (const bad of [
    '', '   ',
    '<a>',                       // unclosed at EOF
    '<a><b>c</a>',               // unclosed child
    '<a><b></a></b>',            // mismatched
    '<a/><b/>',                  // two roots
    'text<a/>',                  // junk before root
    '< a/>',
    '<a b="1" b="2"/>',          // duplicate attribute
    '<x:a>1</x:a>',              // undeclared prefix
    '<a>&#0;</a>',
  ]) {
    testing.expectEqual(bad + ' -> error', bad + (isError(p.parseFromString(bad, 'text/xml')) ? ' -> error' : ' -> ok'));
  }

  // legal documents must not be flagged
  for (const good of [
    '<a/>',
    '<?xml version="1.0" encoding="UTF-8"?>\n<a/>\n',
    '\uFEFF<a/>',
    '<a><![CDATA[<x>]]><!-- c --><?pi d?></a><!-- trailing -->',
    '<a b="x&quot;y&apos;&lt;&#169;"/>',
    '<a xml:lang="en"> </a>',
    '<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd"><html xmlns="http://www.w3.org/1999/xhtml"><body><p>a&nbsp;b</p></body></html>',
    // DOCTYPE internal subset (old Illustrator exports); xml5ever has no DTD
    // support, so the entities stay unexpanded, but the document must parse.
    '<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [\n\t<!ENTITY ns_svg "http://www.w3.org/2000/svg">\n]>\n<svg xmlns="&ns_svg;"><rect/></svg>',
    '<a>&undefined;</a>',
    '<a>\x7F</a>',       // discouraged but legal code points
  ]) {
    testing.expectEqual(good + ' -> ok', good + (isError(p.parseFromString(good, 'text/xml')) ? ' -> error' : ' -> ok'));
  }

  // the doctype survives the internal-subset strip
  const svg = p.parseFromString('<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" [<!ENTITY x "y">]><svg/>', 'image/svg+xml');
  testing.expectEqual('svg', svg.doctype.name);
  testing.expectEqual('-//W3C//DTD SVG 1.1//EN', svg.doctype.publicId);
  testing.expectEqual('svg', svg.documentElement.localName);
}
</script>

<script id=invalidType>
{
  let err = null;
  try {
    new DOMParser().parseFromString('', 'text/foo');
  } catch (e) {
    err = e;
  }
  testing.expectEqual(true, err instanceof TypeError);
}
</script>
