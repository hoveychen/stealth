<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=OffscreenCanvas>
{
  const canvas = new OffscreenCanvas(256, 256);
  testing.expectEqual(true, canvas instanceof OffscreenCanvas);
  testing.expectEqual(canvas.width, 256);
  testing.expectEqual(canvas.height, 256);
}
</script>

<script id=OffscreenCanvas#width>
{
  const canvas = new OffscreenCanvas(100, 200);
  testing.expectEqual(canvas.width, 100);
  canvas.width = 300;
  testing.expectEqual(canvas.width, 300);
}
</script>

<script id=OffscreenCanvas#height>
{
  const canvas = new OffscreenCanvas(100, 200);
  testing.expectEqual(canvas.height, 200);
  canvas.height = 400;
  testing.expectEqual(canvas.height, 400);
}
</script>

<script id=OffscreenCanvas#getContext>
{
  const canvas = new OffscreenCanvas(64, 64);
  const ctx = canvas.getContext("2d");
  testing.expectEqual(true, ctx instanceof OffscreenCanvasRenderingContext2D);
  // We can't really test rendering but let's try to call it at least.
  ctx.fillRect(0, 0, 10, 10);
}
</script>

<script id=OffscreenCanvas#convertToBlob>
{
  const canvas = new OffscreenCanvas(64, 64);
  const promise = canvas.convertToBlob();
  testing.expectEqual(true, promise instanceof Promise);
  // The promise resolves to a PNG of the (transparent) canvas.
  promise.then(blob => {
    testing.expectEqual(true, blob instanceof Blob);
    testing.expectEqual('image/png', blob.type);
    testing.expectTrue(blob.size > 0);
  });
}
</script>

<script id=HTMLCanvasElement#transferControlToOffscreen>
{
  const htmlCanvas = document.createElement("canvas");
  htmlCanvas.width = 128;
  htmlCanvas.height = 96;
  const offscreen = htmlCanvas.transferControlToOffscreen();
  testing.expectEqual(true, offscreen instanceof OffscreenCanvas);
  testing.expectEqual(offscreen.width, 128);
  testing.expectEqual(offscreen.height, 96);
}
</script>

<script id=OffscreenCanvasRenderingContext2D#getImageData>
{
  const canvas = new OffscreenCanvas(100, 50);
  const ctx = canvas.getContext("2d");

  const imageData = ctx.getImageData(0, 0, 10, 20);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 10);
  testing.expectEqual(imageData.height, 20);
  testing.expectEqual(imageData.data.length, 10 * 20 * 4);

  // Undrawn canvas should return transparent black pixels.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);

  // Zero or negative dimensions should throw.
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 0, 10));
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 10, -5));
}
</script>

<script id="OffscreenCanvasRenderingContext2D#fillRect paints">
{
  const canvas = new OffscreenCanvas(4, 4);
  const ctx = canvas.getContext('2d');

  // The same context object comes back, so drawn pixels survive the call.
  testing.expectTrue(ctx === canvas.getContext('2d'));
  testing.expectEqual(canvas, ctx.canvas);

  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 2, 2);
  testing.expectEqual([255, 0, 0, 255], Array.from(ctx.getImageData(0, 0, 1, 1).data));
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(3, 3, 1, 1).data));

  ctx.clearRect(0, 0, 1, 1);
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 1, 1).data));

  // Resizing clears the bitmap.
  ctx.fillRect(0, 0, 4, 4);
  canvas.width = 4;
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 1, 1).data));
}
</script>

<script id="OffscreenCanvas#convertToBlob png" type=module>
  const state = await testing.async();

  const canvas = new OffscreenCanvas(3, 3);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 3, 3);

  const blob = await canvas.convertToBlob();
  const bytes = new Uint8Array(await blob.arrayBuffer());

  let rejected = null;
  const empty = new OffscreenCanvas(0, 0);
  try {
    await empty.convertToBlob();
  } catch (err) {
    rejected = err;
  }

  state.resolve();
  await state.done(() => {
    testing.expectEqual('image/png', blob.type);
    testing.expectTrue(blob.size > 0);
    // PNG signature.
    testing.expectEqual([137, 80, 78, 71, 13, 10, 26, 10], Array.from(bytes.slice(0, 8)));
    // IHDR carries the real dimensions.
    testing.expectEqual([0, 0, 0, 3], Array.from(bytes.slice(16, 20)));
    testing.expectEqual([0, 0, 0, 3], Array.from(bytes.slice(20, 24)));

    testing.expectTrue(rejected !== null);
    testing.expectTrue(rejected.toString().includes('Index or size'));
  });
</script>

<script id="OffscreenCanvas#getContext webgl">
{
  // Chrome hands back a WebGL context for an OffscreenCanvas, and `gl.canvas`
  // is the OffscreenCanvas itself (measured, main thread and worker).
  const canvas = new OffscreenCanvas(256, 256);
  const gl = canvas.getContext('webgl');
  testing.expectEqual('[object WebGLRenderingContext]', Object.prototype.toString.call(gl));
  testing.expectEqual(true, gl.canvas === canvas);
  testing.expectEqual(256, gl.drawingBufferWidth);
  testing.expectEqual(256, gl.drawingBufferHeight);
  testing.expectEqual([0, 0, 256, 256], Array.from(gl.getParameter(gl.VIEWPORT)));
  // Same object on every read, and a different kind afterwards answers null.
  testing.expectEqual(true, canvas.getContext('webgl') === gl);
  testing.expectEqual(null, canvas.getContext('2d'));

  const gl2 = new OffscreenCanvas(300, 150).getContext('webgl2');
  testing.expectEqual('[object WebGL2RenderingContext]', Object.prototype.toString.call(gl2));
  testing.expectEqual(300, gl2.drawingBufferWidth);
  testing.expectEqual(150, gl2.drawingBufferHeight);

  // Resizing the canvas moves the drawing buffer with it.
  const c3 = new OffscreenCanvas(8, 8);
  const g3 = c3.getContext('webgl');
  c3.width = 64;
  testing.expectEqual(64, g3.drawingBufferWidth);

  // Object-creating calls work off an OffscreenCanvas context too — this is
  // what used to need a Frame and therefore could not run in a worker.
  testing.expectEqual('[object WebGLBuffer]', Object.prototype.toString.call(gl.createBuffer()));
  testing.expectEqual('[object WebGLProgram]', Object.prototype.toString.call(gl.createProgram()));
}
</script>

<script id="OffscreenCanvas#getContext enum">
{
  // OffscreenRenderingContextType is a real WebIDL enum here, unlike
  // HTMLCanvasElement's free-form string: a name outside the list is a
  // TypeError rather than null (measured).
  let threw = null;
  try { new OffscreenCanvas(2, 2).getContext('experimental-webgl'); } catch (e) { threw = e.name; }
  testing.expectEqual('TypeError', threw);

  threw = null;
  try { new OffscreenCanvas(2, 2).getContext('bogus'); } catch (e) { threw = e.name; }
  testing.expectEqual('TypeError', threw);

  // In the list but not implemented here: null rather than a throw.
  testing.expectEqual(null, new OffscreenCanvas(2, 2).getContext('bitmaprenderer'));
  // 'webgpu' does hand one back now -- see webgpu/pipeline.html.
  testing.expectEqual('[object GPUCanvasContext]',
    Object.prototype.toString.call(new OffscreenCanvas(2, 2).getContext('webgpu')));

  // An HTMLCanvasElement keeps the loose behaviour.
  testing.expectEqual(null, document.createElement('canvas').getContext('bogus'));
  testing.expectEqual('[object WebGLRenderingContext]',
    Object.prototype.toString.call(document.createElement('canvas').getContext('experimental-webgl')));
}
</script>
