<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=OffscreenCanvas>
{
  const canvas = new OffscreenCanvas(256, 256);
  testing.expectEqual(true, canvas instanceof OffscreenCanvas);
  testing.expectEqual(canvas.width, 256);
  testing.expectEqual(canvas.height, 256);
}
</script>

<script id=OffscreenCanvas#width>
{
  const canvas = new OffscreenCanvas(100, 200);
  testing.expectEqual(canvas.width, 100);
  canvas.width = 300;
  testing.expectEqual(canvas.width, 300);
}
</script>

<script id=OffscreenCanvas#height>
{
  const canvas = new OffscreenCanvas(100, 200);
  testing.expectEqual(canvas.height, 200);
  canvas.height = 400;
  testing.expectEqual(canvas.height, 400);
}
</script>

<script id=OffscreenCanvas#getContext>
{
  const canvas = new OffscreenCanvas(64, 64);
  const ctx = canvas.getContext("2d");
  testing.expectEqual(true, ctx instanceof OffscreenCanvasRenderingContext2D);
  // We can't really test rendering but let's try to call it at least.
  ctx.fillRect(0, 0, 10, 10);
}
</script>

<script id="OffscreenCanvasRenderingContext2D#drawFocusIfNeeded is element-only">
{
  // `drawFocusIfNeeded` draws a focus ring around the element the current path
  // stands in for, so it only means anything on a context that has an element.
  // Chrome puts it on the element context and leaves it off the offscreen one;
  // we used to register it on both, which showed up as a 74th own member on a
  // prototype a widget enumerates.
  testing.expectEqual(true,
    Object.getOwnPropertyNames(CanvasRenderingContext2D.prototype).includes('drawFocusIfNeeded'));
  testing.expectEqual(false,
    Object.getOwnPropertyNames(OffscreenCanvasRenderingContext2D.prototype).includes('drawFocusIfNeeded'));
  testing.expectEqual(undefined, OffscreenCanvasRenderingContext2D.prototype.drawFocusIfNeeded);

  // The whole member list, in Chrome's own `getOwnPropertyNames` sorted order.
  testing.expectEqual([
    'arc', 'arcTo', 'beginPath', 'bezierCurveTo', 'canvas', 'clearRect', 'clip', 'closePath',
    'constructor', 'createConicGradient', 'createImageData', 'createLinearGradient',
    'createPattern', 'createRadialGradient', 'direction', 'drawImage', 'ellipse', 'fill',
    'fillRect', 'fillStyle', 'fillText', 'filter', 'font', 'fontKerning', 'fontStretch',
    'fontVariantCaps', 'getContextAttributes', 'getImageData', 'getLineDash', 'getTransform',
    'globalAlpha', 'globalCompositeOperation', 'imageSmoothingEnabled', 'imageSmoothingQuality',
    'isContextLost', 'isPointInPath', 'isPointInStroke', 'lang', 'letterSpacing', 'lineCap',
    'lineDashOffset', 'lineJoin', 'lineTo', 'lineWidth', 'measureText', 'miterLimit', 'moveTo',
    'putImageData', 'quadraticCurveTo', 'rect', 'reset', 'resetTransform', 'restore', 'rotate',
    'roundRect', 'save', 'scale', 'setLineDash', 'setTransform', 'shadowBlur', 'shadowColor',
    'shadowOffsetX', 'shadowOffsetY', 'stroke', 'strokeRect', 'strokeStyle', 'strokeText',
    'textAlign', 'textBaseline', 'textRendering', 'transform', 'translate', 'wordSpacing',
  ], Object.getOwnPropertyNames(OffscreenCanvasRenderingContext2D.prototype).sort());
}
</script>

<script id=OffscreenCanvas#convertToBlob>
{
  const canvas = new OffscreenCanvas(64, 64);
  const promise = canvas.convertToBlob();
  testing.expectEqual(true, promise instanceof Promise);
  // The promise resolves to a PNG of the (transparent) canvas.
  promise.then(blob => {
    testing.expectEqual(true, blob instanceof Blob);
    testing.expectEqual('image/png', blob.type);
    testing.expectTrue(blob.size > 0);
  });
}
</script>

<script id=OffscreenCanvas#convertToBlob_zero_size_rejects>
{
  const canvas = new OffscreenCanvas(0, 64);
  canvas.convertToBlob().then(
    () => testing.expectEqual('rejected', 'resolved'),
    (err) => testing.expectEqual('IndexSizeError', err.name),
  );
}
</script>

<script id=HTMLCanvasElement#transferControlToOffscreen>
{
  const htmlCanvas = document.createElement("canvas");
  htmlCanvas.width = 128;
  htmlCanvas.height = 96;
  const offscreen = htmlCanvas.transferControlToOffscreen();
  testing.expectEqual(true, offscreen instanceof OffscreenCanvas);
  testing.expectEqual(offscreen.width, 128);
  testing.expectEqual(offscreen.height, 96);
}
</script>

<script id=OffscreenCanvasRenderingContext2D#getImageData>
{
  const canvas = new OffscreenCanvas(100, 50);
  const ctx = canvas.getContext("2d");

  const imageData = ctx.getImageData(0, 0, 10, 20);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 10);
  testing.expectEqual(imageData.height, 20);
  testing.expectEqual(imageData.data.length, 10 * 20 * 4);

  // Undrawn canvas should return transparent black pixels.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);

  // A zero size throws; a negative one is normalised instead (measured --
  // probes/canvas-image-data-settings-2.js).
  testing.expectError('The source width is 0.', () => ctx.getImageData(0, 0, 0, 10));
  testing.expectEqual(5, ctx.getImageData(0, 0, 10, -5).height);
}
</script>

<script id="OffscreenCanvasRenderingContext2D#fillRect paints">
{
  const canvas = new OffscreenCanvas(4, 4);
  const ctx = canvas.getContext('2d');

  // The same context object comes back, so drawn pixels survive the call.
  testing.expectTrue(ctx === canvas.getContext('2d'));
  testing.expectEqual(canvas, ctx.canvas);

  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 2, 2);
  testing.expectEqual([255, 0, 0, 255], Array.from(ctx.getImageData(0, 0, 1, 1).data));
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(3, 3, 1, 1).data));

  ctx.clearRect(0, 0, 1, 1);
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 1, 1).data));

  // Resizing clears the bitmap.
  ctx.fillRect(0, 0, 4, 4);
  canvas.width = 4;
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 1, 1).data));
}
</script>

<script id="OffscreenCanvas#convertToBlob png" type=module>
  const state = await testing.async();

  const canvas = new OffscreenCanvas(3, 3);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 3, 3);

  const blob = await canvas.convertToBlob();
  const bytes = new Uint8Array(await blob.arrayBuffer());

  let rejected = null;
  const empty = new OffscreenCanvas(0, 0);
  try {
    await empty.convertToBlob();
  } catch (err) {
    rejected = err;
  }

  state.resolve();
  await state.done(() => {
    testing.expectEqual('image/png', blob.type);
    testing.expectTrue(blob.size > 0);
    // PNG signature.
    testing.expectEqual([137, 80, 78, 71, 13, 10, 26, 10], Array.from(bytes.slice(0, 8)));
    // IHDR carries the real dimensions.
    testing.expectEqual([0, 0, 0, 3], Array.from(bytes.slice(16, 20)));
    testing.expectEqual([0, 0, 0, 3], Array.from(bytes.slice(20, 24)));

    testing.expectTrue(rejected !== null);
    testing.expectTrue(rejected.toString().includes('Index or size'));
  });
</script>

<script id="OffscreenCanvas#convertToBlob types" type=module>
  const state = await testing.async();

  const canvas = new OffscreenCanvas(20, 20);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#4285f4';
  ctx.fillRect(2, 2, 16, 16);

  // The options bag reads the same way toDataURL's argument does (measured).
  const seen = [];
  for (const options of [undefined, {}, { type: 'image/png' }, { type: 'image/jpeg' },
    { type: 'image/webp' }, { type: 'IMAGE/JPEG' }, { type: 'image/jpg' }, { type: 'image/bogus' }]) {
    seen.push((await canvas.convertToBlob(options)).type);
  }

  // Quality reaches the JPEG encoder here too.
  const lossy = await canvas.convertToBlob({ type: 'image/jpeg', quality: 0 });
  const better = await canvas.convertToBlob({ type: 'image/jpeg' });

  state.resolve();
  await state.done(() => {
    testing.expectEqual(
      'image/png,image/png,image/png,image/jpeg,image/webp,image/jpeg,image/png,image/png',
      seen.join(','),
    );
    testing.expectTrue(lossy.size < better.size);
  });
</script>

<script id="OffscreenCanvas#getContext webgl">
{
  // Chrome hands back a WebGL context for an OffscreenCanvas, and `gl.canvas`
  // is the OffscreenCanvas itself (measured, main thread and worker).
  const canvas = new OffscreenCanvas(256, 256);
  const gl = canvas.getContext('webgl');
  testing.expectEqual('[object WebGLRenderingContext]', Object.prototype.toString.call(gl));
  testing.expectEqual(true, gl.canvas === canvas);
  testing.expectEqual(256, gl.drawingBufferWidth);
  testing.expectEqual(256, gl.drawingBufferHeight);
  testing.expectEqual([0, 0, 256, 256], Array.from(gl.getParameter(gl.VIEWPORT)));
  // Same object on every read, and a different kind afterwards answers null.
  testing.expectEqual(true, canvas.getContext('webgl') === gl);
  testing.expectEqual(null, canvas.getContext('2d'));

  const gl2 = new OffscreenCanvas(300, 150).getContext('webgl2');
  testing.expectEqual('[object WebGL2RenderingContext]', Object.prototype.toString.call(gl2));
  testing.expectEqual(300, gl2.drawingBufferWidth);
  testing.expectEqual(150, gl2.drawingBufferHeight);

  // Resizing the canvas moves the drawing buffer with it.
  const c3 = new OffscreenCanvas(8, 8);
  const g3 = c3.getContext('webgl');
  c3.width = 64;
  testing.expectEqual(64, g3.drawingBufferWidth);

  // Object-creating calls work off an OffscreenCanvas context too — this is
  // what used to need a Frame and therefore could not run in a worker.
  testing.expectEqual('[object WebGLBuffer]', Object.prototype.toString.call(gl.createBuffer()));
  testing.expectEqual('[object WebGLProgram]', Object.prototype.toString.call(gl.createProgram()));
}
</script>

<script id="OffscreenCanvas#getContext enum">
{
  // OffscreenRenderingContextType is a real WebIDL enum here, unlike
  // HTMLCanvasElement's free-form string: a name outside the list is a
  // TypeError rather than null (measured).
  let threw = null;
  try { new OffscreenCanvas(2, 2).getContext('experimental-webgl'); } catch (e) { threw = e.name; }
  testing.expectEqual('TypeError', threw);

  threw = null;
  try { new OffscreenCanvas(2, 2).getContext('bogus'); } catch (e) { threw = e.name; }
  testing.expectEqual('TypeError', threw);

  // In the list but not implemented here: null rather than a throw.
  testing.expectEqual(null, new OffscreenCanvas(2, 2).getContext('bitmaprenderer'));
  // 'webgpu' does hand one back now -- see webgpu/pipeline.html.
  testing.expectEqual('[object GPUCanvasContext]',
    Object.prototype.toString.call(new OffscreenCanvas(2, 2).getContext('webgpu')));

  // An HTMLCanvasElement keeps the loose behaviour.
  testing.expectEqual(null, document.createElement('canvas').getContext('bogus'));
  testing.expectEqual('[object WebGLRenderingContext]',
    Object.prototype.toString.call(document.createElement('canvas').getContext('experimental-webgl')));
}
</script>

<script id="OffscreenCanvas#resize resets the context">
{
  // The same reset the canvas element does — and the path the Turnstile
  // widget actually takes, since it reuses one OffscreenCanvas at half a
  // dozen sizes and relies on the resize to clear the transform between them.
  const canvas = new OffscreenCanvas(8, 8);
  const ctx = canvas.getContext('2d');

  ctx.scale(2, 2);
  ctx.fillStyle = '#ff0000';
  ctx.save();
  canvas.width = 8;

  testing.expectEqual(1, ctx.getTransform().a);
  testing.expectEqual('#000000', ctx.fillStyle);
  ctx.scale(5, 5);
  ctx.restore();
  testing.expectEqual(5, ctx.getTransform().a);
}
</script>

<script id="OffscreenCanvas#fillStyle(gradient)">
{
  // Same union as the element context: a gradient reads back as itself. Chrome
  // 151 readings.
  const canvas = new OffscreenCanvas(20, 20);
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#123456';
  const gradient = ctx.createLinearGradient(0, 0, 5, 5);
  ctx.fillStyle = gradient;
  testing.expectEqual('object', typeof ctx.fillStyle);
  testing.expectEqual(true, ctx.fillStyle === gradient);
  testing.expectEqual('[object CanvasGradient]', String(ctx.fillStyle));

  ctx.strokeStyle = gradient;
  testing.expectEqual(true, ctx.strokeStyle === gradient);

  ctx.fillStyle = '#ff0000';
  testing.expectEqual('#ff0000', ctx.fillStyle);

  // The resize reset drops the gradient along with everything else.
  ctx.fillStyle = gradient;
  canvas.width = 20;
  testing.expectEqual('#000000', ctx.fillStyle);

  // addColorStop refuses the same three ways here as on the element context.
  const P = "Failed to execute 'addColorStop' on 'CanvasGradient': ";
  testing.expectError('TypeError: ' + P + 'The provided double value is non-finite.',
    () => ctx.createLinearGradient(0, 0, 5, 5).addColorStop(NaN, '#fff'));
  testing.expectError(
    'IndexSizeError: ' + P + 'The provided value (2) is outside the range (0.0, 1.0).',
    () => ctx.createLinearGradient(0, 0, 5, 5).addColorStop(2, '#fff'));
  testing.expectError(
    "SyntaxError: " + P + "The value provided ('notacolour') could not be parsed as a color.",
    () => ctx.createLinearGradient(0, 0, 5, 5).addColorStop(0, 'notacolour'));
  ctx.createLinearGradient(0, 0, 5, 5).addColorStop(0, 'rgba(1,2,3,0.5)');

  // The factories refuse the same way, and the sentence names *this* interface
  // rather than the element context's (measured on Chrome 151).
  const on = (op) => "Failed to execute '" + op +
    "' on 'OffscreenCanvasRenderingContext2D': ";
  testing.expectError(
    'TypeError: ' + on('createLinearGradient') + 'The provided double value is non-finite.',
    () => ctx.createLinearGradient(NaN, 0, 1, 1));
  testing.expectError(
    'IndexSizeError: ' + on('createRadialGradient') + 'The r0 provided is less than 0.',
    () => ctx.createRadialGradient(0, 0, -1, 0, 0, 1));
  testing.expectError(
    'TypeError: ' + on('createConicGradient') + 'The provided double value is non-finite.',
    () => ctx.createConicGradient(NaN, 0, 0));
  testing.expectError(
    "SyntaxError: " + on('createPattern') +
    "The provided type ('bogus') is not one of 'repeat', 'no-repeat', " +
    "'repeat-x', or 'repeat-y'.",
    () => ctx.createPattern(new OffscreenCanvas(2, 2), 'bogus'));
  testing.expectError(
    'TypeError: ' + on('createPattern') +
    "The provided value is not of type '(CSSImageValue or HTMLCanvasElement " +
    "or HTMLImageElement or HTMLVideoElement or ImageBitmap or OffscreenCanvas " +
    "or SVGImageElement or VideoFrame)'.",
    () => ctx.createPattern(null, 'repeat'));
}
</script>

<script id="OffscreenCanvas#getContextAttributes">
{
  // Same echo as the element context, and the refusals name *this* interface.
  const attrs = (settings) => new OffscreenCanvas(10, 10).getContext('2d', settings)
    .getContextAttributes();

  testing.expectEqual(false, attrs(undefined).willReadFrequently);
  testing.expectEqual(true, attrs({ willReadFrequently: true }).willReadFrequently);
  const all = attrs({
    alpha: false,
    colorSpace: 'display-p3',
    colorType: 'float16',
    desynchronized: true,
    willReadFrequently: true,
  });
  testing.expectEqual('false,display-p3,float16,true,true',
    [all.alpha, all.colorSpace, all.colorType, all.desynchronized, all.willReadFrequently].join(','));
  testing.expectEqual(false, attrs('nonsense').willReadFrequently);

  const P = "Failed to execute 'getContext' on 'OffscreenCanvas': " +
    "Failed to read the '";
  const M = "' property from 'CanvasContextCreationAttributesModule': " +
    "The provided value 'bogus' is not a valid enum value of type ";
  testing.expectError('TypeError: ' + P + 'colorSpace' + M + 'PredefinedColorSpace.',
    () => attrs({ colorSpace: 'bogus' }));
  testing.expectError('TypeError: ' + P + 'colorType' + M + 'CanvasPixelFormat.',
    () => attrs({ colorType: 'bogus' }));
  testing.expectError(
    "TypeError: Failed to execute 'getContext' on 'OffscreenCanvas': " +
    "Failed to read the 'willReadFrequently' property from " +
    "'CanvasContextCreationAttributesModule': The provided value '1' is not " +
    'a valid enum value of type CanvasWillReadFrequently.',
    () => attrs({ willReadFrequently: 1 }));
}
</script>

<script id="OffscreenCanvas#drawImage">
{
  // This member did not exist on the offscreen context at all -- the element
  // context had it and this one did not, so calling it raised a TypeError that
  // took the rest of the caller's function with it. That is what stops five of
  // the Turnstile widget's readbacks from happening here (README, "The
  // eighteen pixel readbacks").
  const src = new OffscreenCanvas(4, 4);
  const sctx = src.getContext('2d');
  sctx.fillStyle = '#ff0000';
  sctx.fillRect(0, 0, 4, 4);

  const dst = new OffscreenCanvas(8, 8);
  const dctx = dst.getContext('2d');
  testing.expectEqual('function', typeof dctx.drawImage);
  testing.expectEqual(3, dctx.drawImage.length);

  dctx.drawImage(src, 0, 0);
  testing.expectEqual([255, 0, 0, 255], Array.from(dctx.getImageData(3, 3, 1, 1).data));
  // The source is 4x4, so nothing lands past it.
  testing.expectEqual([0, 0, 0, 0], Array.from(dctx.getImageData(4, 4, 1, 1).data));

  // The nine-argument form scales; a 4x4 source into a 2x2 box leaves the
  // other half of the destination alone.
  const box = new OffscreenCanvas(4, 4);
  const bctx = box.getContext('2d');
  bctx.drawImage(src, 0, 0, 4, 4, 0, 0, 2, 2);
  testing.expectEqual([255, 0, 0, 255], Array.from(bctx.getImageData(1, 1, 1, 1).data));
  testing.expectEqual([0, 0, 0, 0], Array.from(bctx.getImageData(3, 3, 1, 1).data));

  // A source that was never drawn into has no pixels to give.
  const blank = new OffscreenCanvas(4, 4);
  blank.getContext('2d');
  const after = new OffscreenCanvas(4, 4);
  const actx = after.getContext('2d');
  actx.drawImage(blank, 0, 0);
  testing.expectEqual([0, 0, 0, 0], Array.from(actx.getImageData(0, 0, 1, 1).data));
}
</script>

<script id="OffscreenCanvas#transferToImageBitmap">
{
  // Measured on Chrome with probes/expr-transfer-to-image-bitmap.js. The name
  // is the specification: the bitmap comes away with the pixels and the canvas
  // is left blank, which is what makes a second transfer answer transparent.
  //
  // Every reading goes through `ask`, which turns a throw into a string rather
  // than letting it escape: a script that dies half way through leaves the
  // assertions it never reached unrecorded, and the runner reads a script whose
  // recorded assertions all passed as a pass. Nothing here may throw.
  const ask = (fn) => {
    try { return fn(); } catch (err) { return `${err.name}: ${err.message}`; }
  };
  const shot = (bmp, w, h) => ask(() => {
    const c = new OffscreenCanvas(w, h);
    const g = c.getContext('2d');
    g.drawImage(bmp, 0, 0);
    return Array.from(g.getImageData(0, 0, w, h).data);
  });

  const canvas = new OffscreenCanvas(2, 1);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(0, 0, 1, 1);
  ctx.fillStyle = '#0000ff';
  ctx.fillRect(1, 0, 1, 1);

  testing.expectEqual('function', typeof canvas.transferToImageBitmap);
  testing.expectEqual(0, canvas.transferToImageBitmap.length);

  const bitmap = ask(() => canvas.transferToImageBitmap());
  testing.expectEqual('ImageBitmap', ask(() => bitmap.constructor.name));
  testing.expectEqual(2, ask(() => bitmap.width));
  testing.expectEqual(1, ask(() => bitmap.height));
  testing.expectEqual([255, 0, 0, 255, 0, 0, 255, 255], shot(bitmap, 2, 1));

  // The source is blank afterwards, read either way round, and keeps its size.
  testing.expectEqual([0, 0, 0, 0, 0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 2, 1).data));
  testing.expectEqual(2, canvas.width);
  testing.expectEqual(1, canvas.height);

  // The context survives it: same canvas, and still drawable.
  testing.expectTrue(ctx.canvas === canvas);
  ctx.fillStyle = '#00ff00';
  ctx.fillRect(0, 0, 2, 1);
  testing.expectEqual([0, 255, 0, 255], Array.from(ctx.getImageData(0, 0, 1, 1).data));

  // A second transfer of a canvas nothing has been drawn into since answers a
  // transparent bitmap rather than the pixels the first one took.
  const twice = new OffscreenCanvas(2, 1);
  const tctx = twice.getContext('2d');
  tctx.fillStyle = '#ff0000';
  tctx.fillRect(0, 0, 2, 1);
  testing.expectEqual([255, 0, 0, 255, 255, 0, 0, 255], shot(ask(() => twice.transferToImageBitmap()), 2, 1));
  testing.expectEqual([0, 0, 0, 0, 0, 0, 0, 0], shot(ask(() => twice.transferToImageBitmap()), 2, 1));

  // The bitmap is a copy, so resizing the source afterwards does not reach it.
  const kept = new OffscreenCanvas(2, 1);
  const kctx = kept.getContext('2d');
  kctx.fillStyle = '#ff0000';
  kctx.fillRect(0, 0, 2, 1);
  const survivor = ask(() => kept.transferToImageBitmap());
  kept.width = 4;
  testing.expectEqual([255, 0, 0, 255, 255, 0, 0, 255], shot(survivor, 2, 1));

  // And it is an ordinary ImageBitmap: closing it detaches it.
  ask(() => survivor.close());
  testing.expectEqual(0, ask(() => survivor.width));
  testing.expectEqual(
    "InvalidStateError: Failed to execute 'drawImage' on " +
      "'OffscreenCanvasRenderingContext2D': The image source is detached",
    shot(survivor, 2, 1),
  );

  // A canvas with no context at all has no bitmap to hand over.
  testing.expectEqual(
    "InvalidStateError: Failed to execute 'transferToImageBitmap' on " +
      "'OffscreenCanvas': Cannot transfer an ImageBitmap from an " +
      'OffscreenCanvas with no context',
    ask(() => new OffscreenCanvas(2, 1).transferToImageBitmap()),
  );

  // A degenerate extent is refused after the context check, and under a
  // different name -- Chrome reports the construction itself as having failed.
  const degenerate = new OffscreenCanvas(0, 1);
  degenerate.getContext('2d');
  testing.expectEqual(
    "UnknownError: Failed to execute 'transferToImageBitmap' on " +
      "'OffscreenCanvas': ImageBitmap construction failed",
    ask(() => degenerate.transferToImageBitmap()),
  );
}
</script>

<script id="OffscreenCanvasRenderingContext2D#measureText emoji">
{
  // The ten strings the Turnstile widget measures, at the font it sets, with
  // headed Chrome's answer for all ten -- probes/expr-emoji-text-metrics.js.
  // The widget reads them off an OffscreenCanvas, so this is the surface that
  // matters even though both 2D contexts share one implementation.
  //
  // Every reading goes through `ask` for the reason given above: a script that
  // throws half way leaves its remaining assertions unrecorded, and the runner
  // reads a script whose recorded assertions all passed as a pass.
  const ask = (fn) => {
    try { return fn(); } catch (err) { return `${err.name}: ${err.message}`; }
  };

  const ctx = new OffscreenCanvas(300, 150).getContext('2d');
  ctx.font = '16px sans-serif';

  const TEN = [
    '\u{1F600}', '\u{1F923}', '\u{1F631}', '\u{1F44D}', '\u{1F525}',
    '\u{1F680}', '\u{1F9E0}', '\u{1F436}', '\u{1F3E0}', '\u{2600}\u{FE0F}',
  ];
  for (const emoji of TEN) {
    testing.expectEqual(
      // The hanging baseline is 80% of the font ascent computed in single
      // precision, which is Chrome's own rounding -- the probe rounds it to
      // 11.2 for display, the engine answers 11.199999809265137.
      [20, 1, 21, 17, 5, 14, 4, 0, 11.199999809265137, -4],
      ask(() => {
        const m = ctx.measureText(emoji);
        return [
          m.width, m.actualBoundingBoxLeft, m.actualBoundingBoxRight,
          m.actualBoundingBoxAscent, m.actualBoundingBoxDescent,
          m.fontBoundingBoxAscent, m.fontBoundingBoxDescent,
          m.alphabeticBaseline, m.hangingBaseline, m.ideographicBaseline,
        ];
      }),
    );
  }

  // The plain-text control from the same probe, which already agreed: if these
  // move, the change was to the font metrics rather than to the emoji.
  const round = (v) => (typeof v === 'number' ? Math.round(v * 1000) / 1000 : v);
  testing.expectEqual(8, ask(() => ctx.measureText('x').width));
  testing.expectEqual(13.328, round(ask(() => ctx.measureText('M').width)));
  testing.expectEqual(60.445, round(ask(() => ctx.measureText('Hwmqxli').width)));
  testing.expectEqual(4.445, round(ask(() => ctx.measureText(' ').width)));
}
</script>

<script id="OffscreenCanvas#creation_attributes">
{
  // The same dictionary as on an HTMLCanvasElement, differing only in the
  // interface its refusals name. Readings from
  // probes/canvas-context-settings{,-2,-3,-4}.js.
  const attrs = (settings) => {
    const c = new OffscreenCanvas(2, 2);
    const ctx = settings === undefined ? c.getContext('2d') : c.getContext('2d', settings);
    return ctx.getContextAttributes();
  };
  const threw = (f) => { try { f(); return null; } catch (e) { return `${e.name}: ${e.message}`; } };

  // The widget builds all four of its contexts on offscreen canvases.
  const widget = attrs({ colorSpace: 'display-p3', colorType: 'float16', willReadFrequently: true });
  testing.expectEqual('display-p3', widget.colorSpace);
  testing.expectEqual('float16', widget.colorType);
  testing.expectEqual(true, widget.willReadFrequently);

  testing.expectEqual(false, attrs({ alpha: false }).alpha);
  testing.expectEqual(true, attrs({ desynchronized: true }).desynchronized);
  testing.expectEqual('srgb', attrs(undefined).colorSpace);
  testing.expectEqual(false, attrs(undefined).willReadFrequently);
  testing.expectEqual('standard', attrs(undefined).toneMapping.mode);
  testing.expectEqual('srgb', attrs('nope').colorSpace);

  // The refusals name OffscreenCanvas where the element's name
  // HTMLCanvasElement, and the dictionary itself is the same one.
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'OffscreenCanvas': Failed to read the " +
      "'colorSpace' property from 'CanvasContextCreationAttributesModule': The provided value " +
      "'nonesuch' is not a valid enum value of type PredefinedColorSpace.",
    threw(() => attrs({ colorSpace: 'nonesuch' })));
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'OffscreenCanvas': The provided value " +
      "'rec2020' is not a valid enum value of the type PredefinedColorSpace.",
    threw(() => attrs({ colorSpace: 'rec2020' })));
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'OffscreenCanvas': Failed to read the " +
      "'willReadFrequently' property from 'CanvasContextCreationAttributesModule': The provided " +
      "value 'auto' is not a valid enum value of type CanvasWillReadFrequently.",
    threw(() => attrs({ willReadFrequently: 'auto' })));

  // Unlike the element, an OffscreenCanvas validates the context *type* first:
  // a bad name and a bad member together report the name. Note "of type" here
  // against the colour space's "of the type" above.
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'OffscreenCanvas': The provided value " +
      "'nonesuch' is not a valid enum value of type OffscreenRenderingContextType.",
    threw(() => new OffscreenCanvas(2, 2).getContext('nonesuch', { colorSpace: 'bad' })));
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'OffscreenCanvas': The provided value " +
      "'experimental-webgl' is not a valid enum value of type OffscreenRenderingContextType.",
    threw(() => new OffscreenCanvas(2, 2).getContext('experimental-webgl')));

  // Held for the context's whole life, and a later call's dictionary is dropped
  // while still being converted.
  {
    const c = new OffscreenCanvas(2, 2);
    const first = c.getContext('2d', { colorSpace: 'display-p3', willReadFrequently: true });
    const second = c.getContext('2d', { colorSpace: 'srgb' });
    testing.expectEqual(true, first === second);
    testing.expectEqual('display-p3', second.getContextAttributes().colorSpace);
    c.width = 4;
    testing.expectEqual('display-p3', first.getContextAttributes().colorSpace);
    testing.expectEqual(
      "TypeError: Failed to execute 'getContext' on 'OffscreenCanvas': Failed to read the " +
        "'colorSpace' property from 'CanvasContextCreationAttributesModule': The provided value " +
        "'nonesuch' is not a valid enum value of type PredefinedColorSpace.",
      threw(() => c.getContext('2d', { colorSpace: 'nonesuch' })));
  }
}
</script>

<script id="OffscreenCanvasRenderingContext2D#image data settings">
{
  // `getImageData`'s fifth argument and `createImageData`'s third: the
  // ImageDataSettings dictionary, which decides the colour space the bytes are
  // converted *to* on the way out. Readings from
  // probes/canvas-image-data-settings{,-2}.js.
  const threw = (f) => { try { f(); return null; } catch (e) { return `${e.name}: ${e.message}`; } };
  const hex = (d) => [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
  const painted = (notation) => {
    const ctx = new OffscreenCanvas(1, 1).getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = notation;
    ctx.fillRect(0, 0, 1, 1);
    return ctx;
  };
  const p3 = (notation) => hex(painted(notation).getImageData(0, 0, 1, 1, { colorSpace: 'display-p3' }).data);

  // The bitmap is srgb, so reading it back as display-p3 is the axis reachable
  // without the canvas itself being display-p3 (that is P2's).
  testing.expectEqual('ff0000ff', hex(painted('#ff0000').getImageData(0, 0, 1, 1).data));
  testing.expectEqual('ff0000ff', hex(painted('#ff0000').getImageData(0, 0, 1, 1, { colorSpace: 'srgb' }).data));
  testing.expectEqual('ea3323ff', p3('#ff0000'));
  testing.expectEqual('75fb4cff', p3('#00ff00'));
  testing.expectEqual('0000f5ff', p3('#0000ff'));
  // Grey, white and black sit on the diagonal the two spaces share.
  testing.expectEqual('808080ff', p3('#808080'));
  testing.expectEqual('ffffffff', p3('#ffffff'));
  testing.expectEqual('000000ff', p3('#000000'));
  // Alpha rides through untouched, and the bytes converted are unpremultiplied.
  testing.expectEqual('ea332380', p3('rgba(255, 0, 0, 0.5)'));
  // A display-p3 notation lands as srgb bytes on an srgb canvas and converts
  // back out to a *third* value, which is the round trip losing the gamut.
  testing.expectEqual('ff1b7fff', hex(painted('color(display-p3 1 0.25 0.5)').getImageData(0, 0, 1, 1).data));
  testing.expectEqual('ea3b7fff', p3('color(display-p3 1 0.25 0.5)'));

  // What the ImageData claims, and what an untouched pixel is in either space.
  testing.expectEqual('display-p3',
    painted('#ff0000').getImageData(0, 0, 1, 1, { colorSpace: 'display-p3' }).colorSpace);
  testing.expectEqual('rgba-unorm8',
    painted('#ff0000').getImageData(0, 0, 1, 1, { colorSpace: 'display-p3' }).pixelFormat);
  testing.expectEqual('srgb', painted('#ff0000').getImageData(0, 0, 1, 1).colorSpace);
  testing.expectEqual('00000000',
    hex(new OffscreenCanvas(1, 1).getContext('2d').getImageData(0, 0, 1, 1, { colorSpace: 'display-p3' }).data));
  // The window may hang off the bitmap; only the overlap is converted.
  testing.expectEqual('ea3323ff00000000',
    hex(painted('#ff0000').getImageData(0, 0, 2, 1, { colorSpace: 'display-p3' }).data));

  // The refusals name this interface and this method, and come in the same two
  // gates as getContext's dictionary.
  const prefix = "Failed to execute 'getImageData' on 'OffscreenCanvasRenderingContext2D': ";
  testing.expectEqual(
    'TypeError: ' + prefix + "Failed to read the 'colorSpace' property from 'ImageDataSettings': " +
      "The provided value 'nonesuch' is not a valid enum value of type PredefinedColorSpace.",
    threw(() => painted('#ff0000').getImageData(0, 0, 1, 1, { colorSpace: 'nonesuch' })));
  testing.expectEqual(
    'TypeError: ' + prefix +
      "The provided value 'rec2020' is not a valid enum value of the type PredefinedColorSpace.",
    threw(() => painted('#ff0000').getImageData(0, 0, 1, 1, { colorSpace: 'rec2020' })));
  testing.expectEqual(
    'TypeError: ' + prefix + "Failed to read the 'pixelFormat' property from 'ImageDataSettings': " +
      "The provided value 'rgba-uint8' is not a valid enum value of type ImageDataPixelFormat.",
    threw(() => painted('#ff0000').getImageData(0, 0, 1, 1, { pixelFormat: 'rgba-uint8' })));
  // A non-object is refused here, unlike getContext's dictionary; an array and
  // a null are read as an empty one.
  testing.expectEqual(
    'TypeError: ' + prefix + "The provided value is not of type 'ImageDataSettings'.",
    threw(() => painted('#ff0000').getImageData(0, 0, 1, 1, 'nope')));
  testing.expectEqual('srgb', painted('#ff0000').getImageData(0, 0, 1, 1, []).colorSpace);
  testing.expectEqual('srgb', painted('#ff0000').getImageData(0, 0, 1, 1, null).colorSpace);

  // The dictionary is read before the rect is looked at, so a zero-sized window
  // and a bad member together report the member.
  testing.expectEqual(
    'TypeError: ' + prefix + "Failed to read the 'colorSpace' property from 'ImageDataSettings': " +
      "The provided value 'nonesuch' is not a valid enum value of type PredefinedColorSpace.",
    threw(() => painted('#ff0000').getImageData(0, 0, 0, 0, { colorSpace: 'nonesuch' })));
  // The rect's own refusals name the dimension. A *negative* size is not one of
  // them: it is normalised about the origin, which is what we refused before.
  testing.expectEqual('IndexSizeError: ' + prefix + 'The source width is 0.',
    threw(() => painted('#ff0000').getImageData(0, 0, 0, 1)));
  testing.expectEqual('IndexSizeError: ' + prefix + 'The source height is 0.',
    threw(() => painted('#ff0000').getImageData(0, 0, 1, 0)));
  {
    const ctx = new OffscreenCanvas(2, 2).getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(0, 0, 2, 2);
    const read = (sx, sy, sw, sh) => {
      const d = ctx.getImageData(sx, sy, sw, sh);
      return `${d.width}x${d.height} ${hex(d.data)}`;
    };
    // `sx` moves by `sw`, so the window lands on the *other* side of the origin
    // rather than merely being made positive in place.
    testing.expectEqual('1x1 ff0000ff', read(1, 0, -1, 1));
    testing.expectEqual('1x1 00000000', read(0, 0, -1, 1));
    testing.expectEqual('1x1 ff0000ff', read(2, 0, -1, 1));
    testing.expectEqual('1x1 ff0000ff', read(0, 1, 1, -1));
  }

  // createImageData takes the same dictionary, and from a source ImageData
  // inherits its settings rather than being handed any.
  {
    const ctx = new OffscreenCanvas(2, 2).getContext('2d');
    testing.expectEqual('display-p3', ctx.createImageData(1, 1, { colorSpace: 'display-p3' }).colorSpace);
    testing.expectEqual('rgba-float16', ctx.createImageData(1, 1, { pixelFormat: 'rgba-float16' }).pixelFormat);
    const source = new ImageData(2, 3, { colorSpace: 'display-p3' });
    const inherited = ctx.createImageData(source);
    testing.expectEqual('display-p3', inherited.colorSpace);
    testing.expectEqual('2x3', `${inherited.width}x${inherited.height}`);

    // The format decides the typed array here too, and it is inherited from a
    // source ImageData along with the space: `createImageData from float16`
    // answers `display-p3 rgba-float16 Float16Array` (measured --
    // results/canvas-image-data-settings-2.chrome.json).
    testing.expectEqual(
      'Float16Array',
      ctx.createImageData(1, 1, { pixelFormat: 'rgba-float16' }).data.constructor.name);
    testing.expectEqual(
      'Uint8ClampedArray', ctx.createImageData(1, 1).data.constructor.name);
    const float16Source = new ImageData(2, 3, {
      colorSpace: 'display-p3',
      pixelFormat: 'rgba-float16',
    });
    const fromFloat16 = ctx.createImageData(float16Source);
    testing.expectEqual('display-p3', fromFloat16.colorSpace);
    testing.expectEqual('rgba-float16', fromFloat16.pixelFormat);
    testing.expectEqual('Float16Array', fromFloat16.data.constructor.name);
    testing.expectEqual(24, fromFloat16.data.length);

    // And getImageData reads back through the same dictionary.
    testing.expectEqual(
      'Float16Array',
      ctx.getImageData(0, 0, 1, 1, { pixelFormat: 'rgba-float16' }).data.constructor.name);
    testing.expectEqual(
      'Uint8ClampedArray', ctx.getImageData(0, 0, 1, 1).data.constructor.name);
  }

  // What a float16 read *holds*. The bitmap behind a canvas is eight bits a
  // channel in Chrome too, so this is not a finer *bitmap* — but it is a finer
  // read of it: the un-premultiplication happens in floating point and is not
  // rounded into a byte on the way. Measured
  // (probes/canvas-image-data-construct.js): a `rgba(200, 100, 50, 0.3)` pixel
  // stores the premultiplied {60, 30, 15, 77} and reads
  //
  //   unorm8   199              = round(60 * 255 / 77)
  //   float16  0.779296875      = round_f16(60 / 77)
  //   float32  0.7792208194732666 = 60 / 77
  //
  // and not round_f16(199 / 255), which is a different half-precision value
  // (0.78027). Every opaque row below cannot tell the two apart, because
  // dividing by an alpha of 255 is the same as not dividing at all — which is
  // why they read as if the byte were the source.
  {
    const f16 = { pixelFormat: 'rgba-float16' };
    const c = new OffscreenCanvas(1, 1).getContext('2d', { willReadFrequently: true });
    c.fillStyle = 'rgba(200, 100, 50, 0.3)';
    c.fillRect(0, 0, 1, 1);
    testing.expectEqual('199,99,50,77',
      [...c.getImageData(0, 0, 1, 1).data].join(','));
    testing.expectEqual('0.779296875,0.3896484375,0.19482421875,0.302001953125',
      [...c.getImageData(0, 0, 1, 1, f16).data].join(','));
  }
  {
    const f16 = { pixelFormat: 'rgba-float16' };
    const c = new OffscreenCanvas(1, 1).getContext('2d', { willReadFrequently: true });
    c.fillStyle = 'rgba(1, 2, 3, 0.01)';
    c.fillRect(0, 0, 1, 1);
    testing.expectEqual('0,0,0,3', [...c.getImageData(0, 0, 1, 1).data].join(','));
    testing.expectEqual('0,0,0,0.0117645263671875',
      [...c.getImageData(0, 0, 1, 1, f16).data].join(','));
  }
  {
    const f16 = { pixelFormat: 'rgba-float16' };
    const read = (canvasSpace, notation, settings) => {
      const ctx = new OffscreenCanvas(1, 1).getContext('2d', { colorSpace: canvasSpace });
      ctx.fillStyle = notation;
      ctx.fillRect(0, 0, 1, 1);
      return [...ctx.getImageData(0, 0, 1, 1, settings).data].join(',');
    };
    const p3 = 'color(display-p3 1 0.25 0.5)';

    // ff0000ff
    testing.expectEqual('255,0,0,255', read('srgb', '#ff0000', undefined));
    testing.expectEqual('1,0,0,1', read('srgb', '#ff0000', f16));
    // ff1b7fff
    testing.expectEqual('255,27,127,255', read('srgb', p3, undefined));
    testing.expectEqual('1,0.10589599609375,0.498046875,1', read('srgb', p3, f16));
    // ea3323ff -- the canvas's own space is what an absent colorSpace means,
    // so the float16 read is in display-p3 as the unorm8 one is.
    testing.expectEqual('234,51,35,255', read('display-p3', '#ff0000', undefined));
    testing.expectEqual('0.91748046875,0.199951171875,0.13720703125,1', read('display-p3', '#ff0000', f16));
    // ff407fff
    testing.expectEqual('255,64,127,255', read('display-p3', p3, undefined));
    testing.expectEqual('1,0.2509765625,0.498046875,1', read('display-p3', p3, f16));

    // An explicit space still converts under this format: the two axes of the
    // dictionary do not interfere. This is *not* the reading two lines above,
    // even though both end up in display-p3: there the p3 bytes were already in
    // the bitmap and the read only divided them by 255, here the conversion
    // runs unquantised and only the result is narrowed to half precision.
    // Chrome 151 reads 0.2003173828125 against that one's 0.199951171875
    // (measured; the reading this line carried before was the other row's,
    // copied across).
    testing.expectEqual(
      '0.91748046875,0.2003173828125,0.1385498046875,1',
      read('srgb', '#ff0000', { colorSpace: 'display-p3', pixelFormat: 'rgba-float16' }));

    // A window that runs off the canvas is transparent black where it missed,
    // and 0.0 is how this format spells that.
    const ctx = new OffscreenCanvas(1, 1).getContext('2d');
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(0, 0, 1, 1);
    testing.expectEqual(
      '1,0,0,1,0,0,0,0', [...ctx.getImageData(0, 0, 2, 1, f16).data].join(','));
    testing.expectEqual(
      '0,0,0,0', [...ctx.getImageData(5, 5, 1, 1, f16).data].join(','));
    testing.expectEqual(
      "TypeError: Failed to execute 'createImageData' on 'OffscreenCanvasRenderingContext2D': " +
        "The provided value 'rec2020' is not a valid enum value of the type PredefinedColorSpace.",
      threw(() => ctx.createImageData(1, 1, { colorSpace: 'rec2020' })));
    testing.expectEqual(
      "TypeError: Failed to execute 'createImageData' on 'OffscreenCanvasRenderingContext2D': " +
        "The provided value is not of type 'ImageDataSettings'.",
      threw(() => ctx.createImageData(1, 1, 'nope')));
  }
}
</script>

<script id="OffscreenCanvasRenderingContext2D#canvas colour space">
{
  // A display-p3 canvas stores its bitmap in *its own* space, so the notation
  // is converted on the way in rather than on the way out. The two halves pull
  // apart: `fillStyle` still answers the notation it was given, which is why a
  // context cannot keep one RGBA and serve both. Readings from
  // probes/canvas-own-color-space.js.
  const hex = (d) => [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
  const painted = (space, notation) => {
    const c = new OffscreenCanvas(1, 1).getContext('2d', {
      colorSpace: space,
      willReadFrequently: true,
    });
    c.fillStyle = notation;
    c.fillRect(0, 0, 1, 1);
    return c;
  };
  const stored = (notation) => hex(painted('display-p3', notation).getImageData(0, 0, 1, 1).data);
  const asSrgb = (notation) =>
    hex(painted('display-p3', notation).getImageData(0, 0, 1, 1, { colorSpace: 'srgb' }).data);

  // An srgb notation is converted into the canvas's space.
  testing.expectEqual('ea3323ff', stored('#ff0000'));
  testing.expectEqual('ea3b7fff', stored('rgb(255, 27, 127)'));
  testing.expectEqual('ffffffff', stored('white'));
  // `hsl()` and `hwb()` reach the conversion as *floats*, not as the bytes they
  // answer back: `hsl(30 60% 40%)` is (163.2, 102, 40.8), and converting that
  // rather than (163, 102, 41) is the difference between `9b` and `9a` in the
  // red channel. Legacy `rgb()` is the other way round — its percentages are
  // quantised before the conversion sees them, which is why `rgb(50% 0% 0%)`
  // converts 128 and not 127.5 (measured, all four axes --
  // results/canvas-color-notation.chrome.json).
  testing.expectEqual('9b6935ff', stored('hsl(30 60% 40%)'));
  testing.expectEqual('5cb047ff', stored('hwb(120 20% 30%)'));
  testing.expectEqual('75140cff', stored('rgb(50% 0% 0%)'));
  // A byte-valued `hsl()` and an out-of-gamut `hwb()` are the same either way,
  // so they pin that the float source did not move what already agreed.
  testing.expectEqual('ea3323ff', stored('hsl(0 100% 50%)'));
  testing.expectEqual('747474ff', stored('hwb(120 50% 60%)'));
  // A display-p3 notation goes in as itself — no round trip through srgb, which
  // is what makes this different from converting the stored bytes afterwards.
  testing.expectEqual('ff407fff', stored('color(display-p3 1 0.25 0.5)'));
  // The other wide notations convert straight into p3 as well, and the proof is
  // rec2020: via srgb it would be ea338b, because srgb clips the red channel
  // before the second conversion sees it.
  testing.expectEqual('ff228dff', stored('color(rec2020 1 0.25 0.5)'));
  testing.expectEqual('eb5180ff', stored('color(srgb 1 0.25 0.5)'));
  testing.expectEqual('b25d22ff', stored('lab(50% 40 59.5)'));
  testing.expectEqual('61afb5ff', stored('oklch(0.7 0.1 200)'));

  // Read back as srgb, the round trip is visible: three of these are a bit off
  // what the same notation paints on an srgb canvas (bf5700, 40b1b7, ff008d).
  testing.expectEqual('ff0000ff', asSrgb('#ff0000'));
  testing.expectEqual('ff1c7eff', asSrgb('color(display-p3 1 0.25 0.5)'));
  testing.expectEqual('bf5701ff', asSrgb('lab(50% 40 59.5)'));
  testing.expectEqual('3fb1b7ff', asSrgb('oklch(0.7 0.1 200)'));
  testing.expectEqual('ff008eff', asSrgb('color(rec2020 1 0.25 0.5)'));
  // The float source shows on this axis too, and its sign is the giveaway that
  // it is a source and not a readback: converting the *byte* triple in and back
  // out lands on a36628/32b433, one step away from Chrome on both.
  testing.expectEqual('a46628ff', asSrgb('hsl(30 60% 40%)'));
  testing.expectEqual('33b333ff', asSrgb('hwb(120 20% 30%)'));
  testing.expectEqual('800000ff', asSrgb('rgb(50% 0% 0%)'));

  // An srgb canvas is unchanged by any of this.
  testing.expectEqual('ff0000ff',
    hex(painted('srgb', '#ff0000').getImageData(0, 0, 1, 1).data));
  testing.expectEqual('ff1b7fff',
    hex(painted('srgb', 'color(display-p3 1 0.25 0.5)').getImageData(0, 0, 1, 1).data));

  // The paint state answers the notation, not the bytes.
  testing.expectEqual('#ff0000', painted('display-p3', '#ff0000').fillStyle);
  testing.expectEqual('color(display-p3 1 0.25 0.5)',
    painted('display-p3', 'color(display-p3 1 0.25 0.5)').fillStyle);
  testing.expectEqual('#ff1b7f', painted('display-p3', 'rgb(255, 27, 127)').fillStyle);

  // The rest of the paint state on a display-p3 canvas.
  {
    const c = new OffscreenCanvas(1, 1).getContext('2d', {
      colorSpace: 'display-p3',
      willReadFrequently: true,
    });
    c.strokeStyle = '#ff0000';
    c.lineWidth = 2;
    c.strokeRect(0, 0, 1, 1);
    testing.expectEqual('ea3323ff', hex(c.getImageData(0, 0, 1, 1).data));
    testing.expectEqual('#ff0000', c.strokeStyle);
  }
  // Transparent black is the same in both spaces, so neither an untouched
  // bitmap nor a cleared one moves.
  testing.expectEqual('00000000', hex(new OffscreenCanvas(1, 1)
    .getContext('2d', { colorSpace: 'display-p3' }).getImageData(0, 0, 1, 1).data));
  {
    const c = painted('display-p3', '#ff0000');
    c.clearRect(0, 0, 1, 1);
    testing.expectEqual('00000000', hex(c.getImageData(0, 0, 1, 1).data));
  }
  // save/restore carries the notation across, so the restored style paints the
  // p3 bytes rather than the ones the discarded style would have.
  {
    const c = new OffscreenCanvas(1, 1).getContext('2d', {
      colorSpace: 'display-p3',
      willReadFrequently: true,
    });
    c.fillStyle = 'color(display-p3 1 0.25 0.5)';
    c.save();
    c.fillStyle = '#00ff00';
    c.restore();
    c.fillRect(0, 0, 1, 1);
    testing.expectEqual('ff407fff', hex(c.getImageData(0, 0, 1, 1).data));
    testing.expectEqual('color(display-p3 1 0.25 0.5)', c.fillStyle);
  }
  // Resizing drops the bitmap and keeps the space.
  {
    const canvas = new OffscreenCanvas(1, 1);
    const c = canvas.getContext('2d', { colorSpace: 'display-p3', willReadFrequently: true });
    canvas.width = 2;
    c.fillStyle = '#ff0000';
    c.fillRect(0, 0, 1, 1);
    testing.expectEqual('ea3323ff', hex(c.getImageData(0, 0, 1, 1).data));
    testing.expectEqual('display-p3', c.getContextAttributes().colorSpace);
  }

  // drawImage crosses spaces, so the pixels are converted rather than copied.
  {
    const source = new OffscreenCanvas(1, 1);
    const sg = source.getContext('2d', { colorSpace: 'display-p3' });
    sg.fillStyle = 'color(display-p3 1 0.25 0.5)';
    sg.fillRect(0, 0, 1, 1);
    const dest = new OffscreenCanvas(1, 1).getContext('2d', { willReadFrequently: true });
    dest.drawImage(source, 0, 0);
    testing.expectEqual('ff1c7eff', hex(dest.getImageData(0, 0, 1, 1).data));
  }
  {
    const source = new OffscreenCanvas(1, 1);
    const sg = source.getContext('2d');
    sg.fillStyle = '#ff0000';
    sg.fillRect(0, 0, 1, 1);
    const dest = new OffscreenCanvas(1, 1).getContext('2d', {
      colorSpace: 'display-p3',
      willReadFrequently: true,
    });
    dest.drawImage(source, 0, 0);
    testing.expectEqual('ea3323ff', hex(dest.getImageData(0, 0, 1, 1).data));
  }
}
</script>

<script id="OffscreenCanvasRenderingContext2D#opaque canvas">
{
  // `{alpha: false}` is not a hint: the bitmap *is* opaque black, so a script
  // reads a different pixel back without drawing anything, every paint
  // composites against black instead of keeping its own alpha, and clearRect
  // returns to black rather than to transparent. Readings from
  // probes/canvas-alpha-semantics.js.
  const hex = (d) => [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
  const ctx = (settings) => new OffscreenCanvas(1, 1)
    .getContext('2d', { willReadFrequently: true, ...settings });
  const filled = (settings, notation) => {
    const c = ctx(settings);
    c.fillStyle = notation;
    c.fillRect(0, 0, 1, 1);
    return hex(c.getImageData(0, 0, 1, 1).data);
  };

  // Untouched, which is the cheapest tell of the three.
  testing.expectEqual('000000ff', hex(ctx({ alpha: false }).getImageData(0, 0, 1, 1).data));
  testing.expectEqual('00000000', hex(ctx({ alpha: true }).getImageData(0, 0, 1, 1).data));
  testing.expectEqual(false, ctx({ alpha: false }).getContextAttributes().alpha);

  // An opaque paint is the same either way; a translucent one is not.
  testing.expectEqual('ff0000ff', filled({ alpha: false }, '#ff0000'));
  testing.expectEqual('800000ff', filled({ alpha: false }, 'rgba(255, 0, 0, 0.5)'));
  testing.expectEqual('ff000080', filled({ alpha: true }, 'rgba(255, 0, 0, 0.5)'));
  testing.expectEqual('000040ff', filled({ alpha: false }, 'rgba(0, 0, 255, 0.25)'));
  testing.expectEqual('0000ff40', filled({ alpha: true }, 'rgba(0, 0, 255, 0.25)'));
  // A fully transparent paint leaves the black where it is.
  testing.expectEqual('000000ff', filled({ alpha: false }, 'transparent'));
  testing.expectEqual('00000000', filled({ alpha: true }, 'transparent'));

  // globalAlpha composites the same way the colour's own alpha does.
  {
    const c = ctx({ alpha: false });
    c.globalAlpha = 0.5;
    c.fillStyle = '#ff0000';
    c.fillRect(0, 0, 1, 1);
    testing.expectEqual('800000ff', hex(c.getImageData(0, 0, 1, 1).data));
  }

  // Two translucent fills, so the second composites over the first's result.
  {
    const c = ctx({ alpha: false });
    c.fillStyle = 'rgba(255, 0, 0, 0.5)';
    c.fillRect(0, 0, 1, 1);
    c.fillRect(0, 0, 1, 1);
    testing.expectEqual('c00000ff', hex(c.getImageData(0, 0, 1, 1).data));
  }
  {
    const c = ctx({ alpha: true });
    c.fillStyle = 'rgba(255, 0, 0, 0.5)';
    c.fillRect(0, 0, 1, 1);
    c.fillRect(0, 0, 1, 1);
    testing.expectEqual('ff0000c0', hex(c.getImageData(0, 0, 1, 1).data));
  }

  // clearRect goes back to the background, whichever one that is.
  {
    const c = ctx({ alpha: false });
    c.fillStyle = '#ff0000';
    c.fillRect(0, 0, 1, 1);
    c.clearRect(0, 0, 1, 1);
    testing.expectEqual('000000ff', hex(c.getImageData(0, 0, 1, 1).data));
  }
  {
    const c = ctx({ alpha: true });
    c.fillStyle = '#ff0000';
    c.fillRect(0, 0, 1, 1);
    c.clearRect(0, 0, 1, 1);
    testing.expectEqual('00000000', hex(c.getImageData(0, 0, 1, 1).data));
  }

  // Resizing drops the bitmap back to the background rather than to zero.
  {
    const canvas = new OffscreenCanvas(1, 1);
    const c = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
    c.fillStyle = '#ff0000';
    c.fillRect(0, 0, 1, 1);
    canvas.width = 2;
    testing.expectEqual('000000ff', hex(c.getImageData(0, 0, 1, 1).data));
  }

  // An opaque display-p3 canvas: black is black in either space, and the
  // translucent red is the *p3* red composited against it.
  testing.expectEqual('000000ff',
    hex(ctx({ alpha: false, colorSpace: 'display-p3' }).getImageData(0, 0, 1, 1).data));
  testing.expectEqual('751a12ff',
    filled({ alpha: false, colorSpace: 'display-p3' }, 'rgba(255, 0, 0, 0.5)'));
}
</script>

<script id="OffscreenCanvasRenderingContext2D#putImageData">
{
  // The one way pixels go back *into* a canvas, and the only paint that skips
  // the whole drawing state. Readings from probes/canvas-put-image-data.js.
  const hex = (d) => [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
  const ctx = (w, h, settings) => new OffscreenCanvas(w, h)
    .getContext('2d', { willReadFrequently: true, ...settings });
  const read = (c, w, h, space) => hex(c.getImageData(0, 0, w, h,
    space ? { colorSpace: space } : undefined).data);
  // A `w` x `h` ImageData whose pixels are all distinguishable.
  const ramp = (w, h) => {
    const d = new ImageData(w, h);
    for (let i = 0; i < w * h; i++) {
      d.data.set([255, i * 16, 0, 255], i * 4);
    }
    return d;
  };
  const one = (channels, settings) => {
    const d = new ImageData(1, 1, settings);
    d.data.set(channels);
    return d;
  };

  // The store is premultiplied, so a translucent pixel does not come back as
  // the bytes that went in — the divergence a translucent fill has.
  {
    const c = ctx(1, 1);
    c.putImageData(one([200, 100, 50, 77]), 0, 0);
    testing.expectEqual('c763324d', read(c, 1, 1));
  }
  // An opaque canvas does not premultiply on the way in — and still divides on
  // the way out, so the colour comes back *brighter* than it went in. Two
  // alphas pin it: premultiplying would read 64321a80 for the second.
  {
    const c = ctx(1, 1, { alpha: false });
    c.putImageData(one([200, 100, 50, 77]), 0, 0);
    testing.expectEqual('ffffa64d', read(c, 1, 1));
  }
  {
    const c = ctx(1, 1, { alpha: false });
    c.putImageData(one([100, 50, 25, 128]), 0, 0);
    testing.expectEqual('c7643280', read(c, 1, 1));
  }
  {
    const c = ctx(1, 1, { alpha: false });
    c.putImageData(one([200, 100, 50, 255]), 0, 0);
    testing.expectEqual('c86432ff', read(c, 1, 1));
  }
  // Transparent black over a painted pixel erases it: a replace, not a
  // composite.
  {
    const c = ctx(1, 1);
    c.fillStyle = '#00ff00';
    c.fillRect(0, 0, 1, 1);
    c.putImageData(new ImageData(1, 1), 0, 0);
    testing.expectEqual('00000000', read(c, 1, 1));
  }
  // globalAlpha, the composite operator and the transform are all ignored.
  {
    const c = ctx(1, 1);
    c.globalAlpha = 0.5;
    c.globalCompositeOperation = 'destination-atop';
    c.translate(5, 5);
    c.scale(2, 2);
    c.putImageData(one([255, 0, 0, 255]), 0, 0);
    testing.expectEqual('ff0000ff', read(c, 1, 1));
  }

  // Where the pixels land. A fractional destination truncates toward zero.
  {
    const c = ctx(2, 1);
    c.putImageData(ramp(2, 1), 0, 0);
    testing.expectEqual('ff0000ffff1000ff', read(c, 2, 1));
  }
  {
    const c = ctx(2, 1);
    c.putImageData(ramp(1, 1), 0.9, 0);
    testing.expectEqual('ff0000ff00000000', read(c, 2, 1));
  }
  {
    const c = ctx(2, 1);
    c.putImageData(ramp(1, 1), -0.9, 0);
    testing.expectEqual('ff0000ff00000000', read(c, 2, 1));
  }
  // Partly off an edge: the part that overlaps lands, the rest is dropped.
  {
    const c = ctx(2, 1);
    c.putImageData(ramp(2, 1), -1, 0);
    testing.expectEqual('ff1000ff00000000', read(c, 2, 1));
  }
  {
    const c = ctx(2, 1);
    c.putImageData(ramp(2, 1), 1, 0);
    testing.expectEqual('00000000ff0000ff', read(c, 2, 1));
  }

  // The dirty rectangle, in the ImageData's own coordinates.
  {
    const c = ctx(2, 2);
    c.putImageData(ramp(2, 2), 0, 0, 0, 0, 1, 1);
    testing.expectEqual('ff0000ff000000000000000000000000', read(c, 2, 2));
  }
  {
    const c = ctx(2, 2);
    c.putImageData(ramp(2, 2), 0, 0, 1, 1, 1, 1);
    testing.expectEqual('000000000000000000000000ff3000ff', read(c, 2, 2));
  }
  // A negative extent flips the rectangle rather than being refused, the way
  // getImageData's window does.
  {
    const c = ctx(2, 2);
    c.putImageData(ramp(2, 2), 0, 0, 1, 1, -1, -1);
    testing.expectEqual('ff0000ff000000000000000000000000', read(c, 2, 2));
  }
  // Oversized clips to the source.
  {
    const c = ctx(2, 2);
    c.putImageData(ramp(2, 2), 0, 0, -5, -5, 20, 20);
    testing.expectEqual('ff0000ffff1000ffff2000ffff3000ff', read(c, 2, 2));
  }
  {
    const c = ctx(2, 2);
    c.putImageData(ramp(2, 2), 0, 0, 0, 0, 0, 2);
    testing.expectEqual('00000000000000000000000000000000', read(c, 2, 2));
  }
  // The destination offset moves where that piece of the source lands.
  {
    const c = ctx(2, 2);
    c.putImageData(ramp(2, 2), 1, 1, 0, 0, 1, 1);
    testing.expectEqual('000000000000000000000000ff0000ff', read(c, 2, 2));
  }

  // The ImageData carries its own colour space, so crossing into the canvas's
  // one converts the bytes.
  {
    const c = ctx(1, 1, { colorSpace: 'display-p3' });
    c.putImageData(one([255, 0, 0, 255], { colorSpace: 'srgb' }), 0, 0);
    testing.expectEqual('ea3323ff', read(c, 1, 1, 'display-p3'));
    testing.expectEqual('ff0000ff', read(c, 1, 1, 'srgb'));
  }
  // The other way the conversion leaves the srgb gamut and clamps.
  {
    const c = ctx(1, 1);
    c.putImageData(one([255, 0, 0, 255], { colorSpace: 'display-p3' }), 0, 0);
    testing.expectEqual('ff0000ff', read(c, 1, 1, 'srgb'));
    testing.expectEqual('ea3323ff', read(c, 1, 1, 'display-p3'));
  }
  {
    const c = ctx(1, 1, { colorSpace: 'display-p3' });
    c.putImageData(one([255, 0, 0, 255], { colorSpace: 'display-p3' }), 0, 0);
    testing.expectEqual('ff0000ff', read(c, 1, 1, 'display-p3'));
  }

  // A float16 ImageData's channels are 0..1 floats over a bitmap that is still
  // eight bits, so they quantise on the way in and clamp outside 0..1.
  {
    const c = ctx(1, 1);
    c.putImageData(one([1, 0.5, 0.2, 1], { pixelFormat: 'rgba-float16' }), 0, 0);
    testing.expectEqual('ff8033ff', read(c, 1, 1));
  }
  {
    const c = ctx(1, 1);
    c.putImageData(one([2, -1, 0.5, 1], { pixelFormat: 'rgba-float16' }), 0, 0);
    testing.expectEqual('ff0080ff', read(c, 1, 1));
  }
  {
    const c = ctx(1, 1);
    c.putImageData(one([200 / 255, 100 / 255, 50 / 255, 77 / 255],
      { pixelFormat: 'rgba-float16' }), 0, 0);
    testing.expectEqual('c763324d', read(c, 1, 1));
  }

  // The call itself: three required arguments, and the dirty rectangle is a
  // whole overload rather than four optional arguments.
  testing.expectEqual(3, OffscreenCanvasRenderingContext2D.prototype.putImageData.length);
  testing.expectEqual(undefined, ctx(1, 1).putImageData(new ImageData(1, 1), 0, 0));
  testing.expectError(
    "TypeError: Failed to execute 'putImageData' on " +
      "'OffscreenCanvasRenderingContext2D': Overload resolution failed.",
    () => ctx(1, 1).putImageData(new ImageData(1, 1), 0, 0, 0));
  testing.expectError(
    "TypeError: Failed to execute 'putImageData' on " +
      "'OffscreenCanvasRenderingContext2D': parameter 1 is not of type 'ImageData'.",
    () => ctx(1, 1).putImageData({ width: 1, height: 1, data: new Uint8ClampedArray(4) }, 0, 0));
  testing.expectError(
    "TypeError: Failed to execute 'putImageData' on " +
      "'OffscreenCanvasRenderingContext2D': 3 arguments required, but only 0 present.",
    () => ctx(1, 1).putImageData());
}
</script>

<script id="OffscreenCanvasRenderingContext2D#float16 colorType bitmap">
{
  // `colorType: 'float16'` is not the same axis as `pixelFormat:
  // 'rgba-float16'`. The pixel format is a finer *read* of an eight-bit bitmap,
  // so every channel it answers is the half-precision neighbour of some `n /
  // 255`. The colour type is a finer *bitmap*: the paint goes in unquantised
  // and comes back out that way, so a channel that is not byte-valued stays
  // that way. Measured on headed Chrome by
  // probes/canvas-float-source-channels.js, readings in
  // results/canvas-float-source-channels.chrome.json.
  //
  // Two of the four contexts the Turnstile widget builds are float16
  // (results/ibt2-oracle.json), so both of its float16 rows read this.
  const read = (colorSpace, notation) => {
    const ctx = new OffscreenCanvas(1, 1).getContext('2d', {
      colorSpace,
      colorType: 'float16',
      willReadFrequently: true,
    });
    ctx.fillStyle = notation;
    ctx.fillRect(0, 0, 1, 1);
    return [...ctx.getImageData(0, 0, 1, 1, { pixelFormat: 'rgba-float16' }).data].join(' ');
  };

  // `hsl(30 60% 40%)` is (0.64, 0.4, 0.16). Half precision's neighbour of 0.64
  // is 0.64013671875; of the 163/255 an eight-bit bitmap would hold it is
  // 0.63916015625. The first is what a float16 bitmap answers.
  testing.expectEqual('0.64013671875 0.39990234375 0.1600341796875 1',
    read('srgb', 'hsl(30 60% 40%)'));
  // 17/30 of a byte, the row that pinned the f32 width for the unorm8 bitmap.
  testing.expectEqual('0.0999755859375 0.56689453125 0.7998046875 1',
    read('srgb', 'hwb(200 10% 20%)'));
  // Exactly half, which an eight-bit bitmap cannot hold: it stores 128 and
  // reads back 0.501953125.
  testing.expectEqual('0.5 0.5 0.5 1', read('srgb', 'hsl(0 0% 50%)'));
  // Legacy `rgb()` is quantised by its own parser, so 128/255 is the colour
  // here and both bitmaps agree.
  testing.expectEqual('0.501953125 0 0 1', read('srgb', 'rgb(50% 0% 0%)'));

  // On a display-p3 float16 bitmap the *conversion* is what stays unquantised,
  // so even pure red parts from the eight-bit answer: 0.2003173828125 is the
  // converted green itself, where 0.199951171875 is the 51/255 a byte bitmap
  // rounds it to.
  testing.expectEqual('0.91748046875 0.2003173828125 0.1385498046875 1',
    read('display-p3', '#ff0000'));
  testing.expectEqual('0.91748046875 0.2003173828125 0.1385498046875 1',
    read('display-p3', 'hsl(0 100% 50%)'));
  testing.expectEqual('0.60595703125 0.410888671875 0.208740234375 1',
    read('display-p3', 'hsl(30 60% 40%)'));
  // A translucent fill premultiplies into the float bitmap and divides back
  // out of it, so the colour channels come back further from the byte arm than
  // the opaque row above.
  testing.expectEqual('0.91796875 0.2003173828125 0.1385498046875 0.501953125',
    read('display-p3', 'rgba(255, 0, 0, 0.5)'));
  // The widget's own fill. On a display-p3 float16 bitmap it needs no
  // conversion at all, so the channels come back as themselves — where the
  // eight-bit bitmap answers 0.2509765625 and 0.498046875 for the same paint.
  testing.expectEqual('1 0.25 0.5 1', read('display-p3', 'color(display-p3 1 0.25 0.5)'));
  // And at half alpha the premultiply round trip is lossless here, where on an
  // eight-bit bitmap it moves two channels.
  testing.expectEqual('1 0.25 0.5 0.5', read('display-p3', 'color(display-p3 1 0.25 0.5 / 0.5)'));
  // The same fill on an *srgb* float16 bitmap keeps a channel outside the
  // gamut: a float bitmap has room for one, so the conversion is not clipped.
  // The eight-bit bitmap clamps the same red to 255.
  testing.expectEqual('1.0888671875 0.10601806640625 0.497314453125 1',
    read('srgb', 'color(display-p3 1 0.25 0.5)'));
}
</script>

<script id="OffscreenCanvasRenderingContext2D#premultiplied cross-space read">
{
  // Reading a *translucent* pixel out of one space and into the other is the
  // one place the order of the two steps shows. The bitmap holds the colour
  // premultiplied, so a read has to divide the alpha back out — and that
  // quotient is not a byte. Chrome converts it as it stands and quantises once,
  // at the end; rounding it to a byte first and converting that lands a
  // different byte. Every reading here is Chrome's
  // (results/canvas-color-notation.chrome.json, the two cross-space pixel
  // axes).
  const hex = (d) => [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
  const read = (canvasSpace, readSpace, notation) => {
    const ctx = new OffscreenCanvas(1, 1).getContext('2d', {
      colorSpace: canvasSpace,
      willReadFrequently: true,
    });
    ctx.fillStyle = notation;
    ctx.fillRect(0, 0, 1, 1);
    return hex(ctx.getImageData(0, 0, 1, 1, { colorSpace: readSpace }).data);
  };

  // An srgb bitmap read as display-p3. The opaque rows are the control: with an
  // alpha of 255 there is no division to do, so both orders agree and these
  // already passed.
  testing.expectEqual('ea3b7fff', read('srgb', 'display-p3', 'color(display-p3 1 0.25 0.5)'));
  testing.expectEqual('af5e4cff', read('srgb', 'display-p3', 'lab(50 40 30)'));
  // At half alpha they part. The first is the widest gap in the set: the stored
  // red is 139, and 139 of 128 un-premultiplies to 276.8 — which the byte order
  // clamps to 255 before converting, throwing away the whole out-of-gamut part
  // the premultiply had preserved.
  testing.expectEqual('fe407e80', read('srgb', 'display-p3', 'color(display-p3 1 0.25 0.5 / 0.5)'));
  testing.expectEqual('af5d4b80', read('srgb', 'display-p3', 'lab(50 40 30 / 0.5)'));
  testing.expectEqual('af5d4b80', read('srgb', 'display-p3', 'lab(50 40 30 / 50%)'));

  // And the other direction, a display-p3 bitmap read as srgb.
  testing.expectEqual('ff0000ff', read('display-p3', 'srgb', '#ff0000'));
  testing.expectEqual('bc5747ff', read('display-p3', 'srgb', 'lab(50 40 30)'));
  // Four notations for the same half-transparent red, which all reach the
  // bitmap as the same premultiplied bytes and so all read back the same.
  testing.expectEqual('fe040280', read('display-p3', 'srgb', '#ff000080'));
  testing.expectEqual('fe040280', read('display-p3', 'srgb', 'rgba(255,0,0,0.5)'));
  testing.expectEqual('fe040280', read('display-p3', 'srgb', 'rgb(255 0 0 / 0.5)'));
  testing.expectEqual('fe040280', read('display-p3', 'srgb', 'hsla(0,100%,50%,0.5)'));
  testing.expectEqual('ff1c7f80', read('display-p3', 'srgb', 'color(display-p3 1 0.25 0.5 / 0.5)'));
  testing.expectEqual('ba584680', read('display-p3', 'srgb', 'lab(50 40 30 / 0.5)'));
  testing.expectEqual('ba584680', read('display-p3', 'srgb', 'lab(50 40 30 / 50%)'));
}
</script>

<script id="OffscreenCanvasRenderingContext2D#eight-bit srgb paints the byte">
{
  // An eight-bit srgb bitmap is the one combination Blink can hand Skia as a
  // plain eight-bit colour, and there the colour is quantised *before* it is
  // premultiplied. So a notation whose channels are not byte-valued paints
  // exactly what the `rgb()` form it answers back paints.
  //
  // The knife edge decides it on its own: `hsl(30 60% 40%)`'s blue is 40.8,
  // which premultiplies to 20 and reads back 40, where the 41 it rounds to
  // premultiplies to 21 and reads back 42. Chrome answers 42 for both arms.
  // Fourteen pairs measured on headed Chrome, thirteen of them agreeing
  // (probes/canvas-legacy-premultiply.js, readings in
  // results/canvas-legacy-premultiply.chrome.json).
  const hex = (d) => [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
  const paint = (notation) => {
    const ctx = new OffscreenCanvas(1, 1).getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = notation;
    ctx.fillRect(0, 0, 1, 1);
    return hex(ctx.getImageData(0, 0, 1, 1).data);
  };

  // The three rows the byte moves. Each one is a channel whose float and its
  // rounded byte fall on opposite sides of a premultiply boundary.
  testing.expectEqual('a3662a80', paint('hsl(30 60% 40% / 0.5)'));
  testing.expectEqual('839bb380', paint('hsl(210 25% 61% / 0.5)'));
  testing.expectEqual('f10ef180', paint('hwb(300 5% 5% / 0.5)'));
  // And the same three painted as the bytes they answer back, which is the
  // claim: on this bitmap the two arms are one colour.
  testing.expectEqual(paint('rgba(163, 102, 41, 0.5)'), paint('hsl(30 60% 40% / 0.5)'));
  testing.expectEqual(paint('rgba(131, 156, 180, 0.5)'), paint('hsl(210 25% 61% / 0.5)'));
  testing.expectEqual(paint('rgba(242, 13, 242, 0.5)'), paint('hwb(300 5% 5% / 0.5)'));

  // The other nine legacy rows of the same sweep, which already agreed — they
  // pin that quantising first did not move what the float already had right.
  testing.expectEqual('a3682840', paint('hsl(30 60% 40% / 0.25)'));
  testing.expectEqual('a36529bf', paint('hsl(30 60% 40% / 0.75)'));
  testing.expectEqual('1a91cb80', paint('hwb(200 10% 20% / 0.5)'));
  testing.expectEqual('1a8fc980', paint('hwb(200 10% 21% / 0.5)'));
  testing.expectEqual('5e188180', paint('hsl(280 70% 30% / 0.5)'));
  testing.expectEqual('91b56e80', paint('hsl(90 33% 57% / 0.5)'));
  testing.expectEqual('a5852680', paint('hwb(45 15% 35% / 0.5)'));
  testing.expectEqual('46a17480', paint('hsl(150 40% 45% / 0.5)'));
  testing.expectEqual('80808080', paint('hsl(0 0% 50% / 0.5)'));

  // The bound. A wide notation is not quantised here — its red is outside
  // sRGB's gamut, and the byte arm has already thrown that part away, so the
  // two land a byte apart where every legacy row above lands on one.
  testing.expectEqual('ff1c7e80', paint('color(display-p3 1 0.25 0.5 / 0.5)'));
  testing.expectEqual('ff1c8080', paint('rgba(255, 27, 127, 0.5)'));
  testing.expectEqual('bb584680', paint('lab(50 40 30 / 0.5)'));
}
</script>

<script id="OffscreenCanvasRenderingContext2D#shadowBlur">
{
  // A shadow is the shape's own coverage, blurred, tinted with `shadowColor`
  // and drawn *under* the shape at `shadowOffsetX/Y`. Every reading here is
  // headed Chrome's (probes/canvas-shadow-blur.js, results in
  // results/canvas-shadow-blur.chrome.json).
  //
  // The kernel is Skia's three box passes, not a Gaussian: with
  // sigma = shadowBlur / 2 and window = max(1, floor(sigma * 3*sqrt(2pi)/4 +
  // 0.5)), three box convolutions reproduce Chrome's bytes with no residual at
  // all -- measured at nine radii from 4 to 32. An odd window is three equal
  // centred boxes; an even one is (w, w, w+1) with the first shifted one to
  // the left, which is how Skia centres an even box.
  const W = 96, H = 32;
  const ctx = (build) => {
    const c = new OffscreenCanvas(W, H).getContext('2d', { willReadFrequently: true });
    build(c);
    return c;
  };
  const row = (c) => {
    const d = c.getImageData(0, 16, W, 1).data;
    const a = [];
    for (let x = 0; x < W; x++) a.push(d[x * 4 + 3]);
    let lo = 0;
    while (lo < W && a[lo] === 0) lo++;
    let hi = W - 1;
    while (hi >= 0 && a[hi] === 0) hi--;
    return lo > hi ? 'empty' : lo + ':' + a.slice(lo, hi + 1).join(',');
  };
  // A bar the full height of the bitmap, so the vertical factor is 1 down the
  // middle and the row *is* the one-dimensional kernel.
  const bar = (blur) => row(ctx((c) => {
    c.shadowColor = '#ff0000';
    c.shadowBlur = blur;
    c.shadowOffsetX = 48;
    c.fillStyle = '#000000';
    c.fillRect(4, -32, 4, H + 64);
  }));

  // An even window: 8 -> boxes (8,8,9).
  testing.expectEqual(
    '4:255,255,255,255' + ',0'.repeat(34) +
    ',2,4,9,15,23,33,44,57,69,79,86,89,89,86,79,69,57,44,33,23,15,9,4,2',
    bar(8));
  // Another even one, and the smallest radius where the box triple is exact.
  testing.expectEqual(
    '4:255,255,255,255' + ',0'.repeat(39) +
    ',3,13,32,64,102,137,159,159,137,102,64,32,13,3',
    bar(4));
  // An odd window: 14 -> boxes (13,13,13), three equal and centred.
  testing.expectEqual(
    '4:255,255,255,255' + ',0'.repeat(28) +
    ',1,2,4,6,9,12,15,19,23,28,34,39,44,49,53,55,57,58,58,57,55,53,49,44,39,34,28,23,19,15,12,9,6,4,2,1',
    bar(14));

  // A bar *one* pixel wide, so the row is the kernel's taps themselves. Below
  // sigma 2 Skia leaves the box triple for the discrete Gaussian --
  // `gauss(n) = I_n(var) / e^var` with `var = sigma * sigma`, expanded outward
  // until a tap falls below 1/100 and normalised to sum to one. Every kernel
  // below is Chrome's, to the byte.
  const taps = (blur) => {
    const c = new OffscreenCanvas(W, H).getContext('2d', { willReadFrequently: true });
    c.shadowColor = '#ff0000';
    c.shadowBlur = blur;
    c.shadowOffsetX = 48;
    c.fillStyle = '#000000';
    c.fillRect(4, -32, 1, H + 64);
    const d = c.getImageData(0, 16, W, 1).data;
    const a = [];
    for (let x = 40; x < 70; x++) a.push(d[x * 4 + 3]);
    let lo = 0;
    while (lo < a.length && a[lo] === 0) lo++;
    let hi = a.length - 1;
    while (hi >= 0 && a[hi] === 0) hi--;
    return lo > hi ? 'empty' : a.slice(lo, hi + 1).join(',');
  };
  // `3 * sigma <= 1` is Skia's own "no blur at all", and these two brackets it:
  // the silhouette at sigma 0.3, a kernel at 0.35.
  testing.expectEqual('255', taps(0.6));
  testing.expectEqual('14,227,14', taps(0.7));
  testing.expectEqual('25,204,25', taps(1));
  testing.expectEqual('6,43,158,43,6', taps(1.5));
  testing.expectEqual('13,54,121,54,13', taps(2));
  testing.expectEqual('5,20,56,92,56,20,5', taps(2.5));
  testing.expectEqual('9,26,55,75,55,26,9', taps(3));
  testing.expectEqual('4,13,29,51,62,51,29,13,4', taps(3.5));
  // The last kernel before the box triple takes over, and the first one after.
  testing.expectEqual('6,15,31,48,56,48,31,15,6', taps(3.9));
  testing.expectEqual('3,10,19,32,41,45,41,32,19,10,3', taps(4));

  // A 4x4 square rather than a bar. A separable blur hands back the product of
  // the two axes, so this row is the kernel squared -- which is the check that
  // the pass runs on both.
  const square = (blur) => row(ctx((c) => {
    c.shadowColor = '#ff0000';
    c.shadowBlur = blur;
    c.shadowOffsetX = 48;
    c.fillStyle = '#000000';
    c.fillRect(4, 14, 4, 4);
  }));
  testing.expectEqual(
    '4:255,255,255,255' + ',0'.repeat(32) +
    ',1,1,2,3,5,7,9,11,13,15,18,19,20,21,21,20,19,18,15,13,11,9,7,5,3,2,1,1',
    square(11));

  // The radius is in *device* space: the same shape under the widget's own
  // transform, its coordinates divided out so the device shape is identical,
  // is byte-identical. The offset is not transformed either.
  testing.expectEqual(square(11), row(ctx((c) => {
    c.scale(0.384, 0.384);
    c.shadowColor = '#ff0000';
    c.shadowBlur = 11;
    c.shadowOffsetX = 48;
    c.fillStyle = '#000000';
    c.fillRect(4 / 0.384, 14 / 0.384, 4 / 0.384, 4 / 0.384);
  })));

  // The rest of the shadow state, five pixels of one row each.
  const px = (c) => {
    const d = c.getImageData(0, 16, W, 1).data;
    return [6, 40, 48, 54, 60].map((x) =>
      [...d.slice(x * 4, x * 4 + 4)].map((b) => b.toString(16).padStart(2, '0')).join('')
    ).join(' ');
  };
  const shadowed = (build) => px(ctx((c) => {
    c.shadowColor = '#ff0000';
    c.shadowBlur = 8;
    c.shadowOffsetX = 48;
    c.fillStyle = '#000000';
    build(c);
    c.fillRect(4, 14, 4, 4);
  }));
  // The reference the rows below are read against.
  testing.expectEqual('000000ff 00000000 ff00000f ff00001f ff00000c', shadowed(() => {}));
  // `shadowColor`'s alpha multiplies the coverage.
  testing.expectEqual('000000ff 00000000 ff000008 ff000010 ff000006',
    shadowed((c) => { c.shadowColor = 'rgba(255, 0, 0, 0.5)'; }));
  // So does the shape's, to the same bytes.
  testing.expectEqual('00000080 00000000 ff000008 ff000010 ff000006',
    shadowed((c) => { c.fillStyle = 'rgba(0, 0, 0, 0.5)'; }));
  // A transparent `shadowColor` draws nothing, which is the default and is why
  // an unshadowed canvas is unchanged by any of this.
  testing.expectEqual('000000ff 00000000 00000000 00000000 00000000',
    shadowed((c) => { c.shadowColor = 'transparent'; }));
  // A zero radius is the silhouette itself, in `shadowColor`, at the offset.
  testing.expectEqual('000000ff 00000000 00000000 ff0000ff 00000000',
    shadowed((c) => { c.shadowBlur = 0; }));
  // The shadow goes under the shape: with no offset the two overlap and the
  // shape wins its own pixels while the blur still shows either side.
  testing.expectEqual('00000000 00000000 ff00000f 000000ff ff00000c', px(ctx((c) => {
    c.shadowColor = '#ff0000';
    c.shadowBlur = 8;
    c.fillStyle = '#000000';
    c.fillRect(52, 14, 4, 4);
  })));
  // A stroke casts one too, which is four of the widget's five shadowed ops.
  testing.expectEqual('00000000 00000000 ff00001f ff00003a ff000017', px(ctx((c) => {
    c.shadowColor = '#ff0000';
    c.shadowBlur = 8;
    c.shadowOffsetX = 48;
    c.strokeStyle = '#000000';
    c.lineWidth = 2;
    c.strokeRect(4, 14, 4, 4);
  })));
}
</script>

<script id="OffscreenCanvasRenderingContext2D#a modern alpha stays a float">
{
  // CSS Color 4 splits the notations into *legacy* ones — a hex, a name,
  // `rgb()`, `rgba()`, `hsl()`, `hsla()` — and modern ones, `hwb()` among
  // them. A legacy colour's alpha is a byte by the time it is parsed; a modern
  // one's stays the float it was written as. A float16 bitmap keeps whatever
  // it is handed, so it answers the question on sight: 0.5 and 0.501953125
  // (half precision's neighbour of 128/255) are distinct halves. Measured on
  // headed Chrome, both spaces agreeing (probes/canvas-nonlegacy-alpha.js).
  const alpha = (notation) => {
    const ctx = new OffscreenCanvas(1, 1).getContext('2d', {
      colorType: 'float16',
      willReadFrequently: true,
    });
    ctx.fillStyle = notation;
    ctx.fillRect(0, 0, 1, 1);
    return String([...ctx.getImageData(0, 0, 1, 1, { pixelFormat: 'rgba-float16' }).data][3]);
  };
  testing.expectEqual('0.501953125', alpha('#ff000080'));
  testing.expectEqual('0.501953125', alpha('rgba(255, 0, 0, 0.5)'));
  testing.expectEqual('0.501953125', alpha('rgb(255 0 0 / 0.5)'));
  testing.expectEqual('0.501953125', alpha('hsl(30 60% 40% / 0.5)'));
  testing.expectEqual('0.501953125', alpha('hsla(30, 60%, 40%, 0.5)'));
  testing.expectEqual('0.5', alpha('hwb(200 10% 20% / 0.5)'));
  testing.expectEqual('0.5', alpha('lab(50 40 30 / 0.5)'));
  testing.expectEqual('0.5', alpha('oklch(0.7 0.1 200 / 0.5)'));
  testing.expectEqual('0.5', alpha('color(display-p3 1 0.25 0.5 / 0.5)'));
  // Two more alphas, where the byte and the float part further: 0.3 is 76.5
  // of a byte and 0.7 is 178.5, both of them exactly half.
  testing.expectEqual('0.302001953125', alpha('rgba(255, 0, 0, 0.3)'));
  testing.expectEqual('0.300048828125', alpha('hwb(200 10% 20% / 0.3)'));
  testing.expectEqual('0.7021484375', alpha('rgba(255, 0, 0, 0.7)'));
  testing.expectEqual('0.7001953125', alpha('hwb(200 10% 20% / 0.7)'));

  // Which is what the display-p3 eight-bit bitmap sees. There the colour is
  // *not* quantised — the conversion's output is not byte-valued and the
  // bitmap premultiplies it as it stands — so the alpha it is multiplied by is
  // the only thing left to tell the two families apart, and it does: the four
  // `hwb()` rows below are the ones a byte alpha lands one step off.
  const hex = (d) => [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
  const p3 = (notation) => {
    const ctx = new OffscreenCanvas(1, 1).getContext('2d', {
      colorSpace: 'display-p3',
      willReadFrequently: true,
    });
    ctx.fillStyle = notation;
    ctx.fillRect(0, 0, 1, 1);
    return hex(ctx.getImageData(0, 0, 1, 1).data);
  };
  testing.expectEqual('448dc580', p3('hwb(200 10% 20% / 0.5)'));
  testing.expectEqual('448bc380', p3('hwb(200 10% 21% / 0.5)'));
  testing.expectEqual('9f873a80', p3('hwb(45 15% 35% / 0.5)'));
  testing.expectEqual('dd34e980', p3('hwb(300 5% 5% / 0.5)'));
  // The `hsl()` rows of the same sweep, which keep the byte alpha and must not
  // move. Together with the four above they are why this is an alpha rule and
  // not a colour one: one sweep, one bitmap, two answers.
  testing.expectEqual('9b6a3680', p3('hsl(30 60% 40% / 0.5)'));
  testing.expectEqual('9b683440', p3('hsl(30 60% 40% / 0.25)'));
  testing.expectEqual('9b6835bf', p3('hsl(30 60% 40% / 0.75)'));
  testing.expectEqual('561c7e80', p3('hsl(280 70% 30% / 0.5)'));
  testing.expectEqual('99b57680', p3('hsl(90 33% 57% / 0.5)'));
  testing.expectEqual('879bb180', p3('hsl(210 25% 61% / 0.5)'));
  testing.expectEqual('5e9f7680', p3('hsl(150 40% 45% / 0.5)'));
  testing.expectEqual('80808080', p3('hsl(0 0% 50% / 0.5)'));
  // And on this bitmap the byte arm is a *different* colour from the float
  // arm, which is what makes the block above specific to eight-bit srgb.
  testing.expectEqual('996a3680', p3('rgba(163, 102, 41, 0.5)'));
  testing.expectEqual('448fc780', p3('rgba(26, 145, 204, 0.5)'));
  testing.expectEqual('fd408080', p3('color(display-p3 1 0.25 0.5 / 0.5)'));
  testing.expectEqual('ad5e4c80', p3('lab(50 40 30 / 0.5)'));
}
