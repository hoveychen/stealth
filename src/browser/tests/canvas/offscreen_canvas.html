<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=OffscreenCanvas>
{
  const canvas = new OffscreenCanvas(256, 256);
  testing.expectEqual(true, canvas instanceof OffscreenCanvas);
  testing.expectEqual(canvas.width, 256);
  testing.expectEqual(canvas.height, 256);
}
</script>

<script id=OffscreenCanvas#width>
{
  const canvas = new OffscreenCanvas(100, 200);
  testing.expectEqual(canvas.width, 100);
  canvas.width = 300;
  testing.expectEqual(canvas.width, 300);
}
</script>

<script id=OffscreenCanvas#height>
{
  const canvas = new OffscreenCanvas(100, 200);
  testing.expectEqual(canvas.height, 200);
  canvas.height = 400;
  testing.expectEqual(canvas.height, 400);
}
</script>

<script id=OffscreenCanvas#getContext>
{
  const canvas = new OffscreenCanvas(64, 64);
  const ctx = canvas.getContext("2d");
  testing.expectEqual(true, ctx instanceof OffscreenCanvasRenderingContext2D);
  // We can't really test rendering but let's try to call it at least.
  ctx.fillRect(0, 0, 10, 10);
}
</script>

<script id=OffscreenCanvas#convertToBlob>
{
  const canvas = new OffscreenCanvas(64, 64);
  const promise = canvas.convertToBlob();
  testing.expectEqual(true, promise instanceof Promise);
  // The promise resolves to a PNG of the (transparent) canvas.
  promise.then(blob => {
    testing.expectEqual(true, blob instanceof Blob);
    testing.expectEqual('image/png', blob.type);
    testing.expectTrue(blob.size > 0);
  });
}
</script>

<script id=HTMLCanvasElement#transferControlToOffscreen>
{
  const htmlCanvas = document.createElement("canvas");
  htmlCanvas.width = 128;
  htmlCanvas.height = 96;
  const offscreen = htmlCanvas.transferControlToOffscreen();
  testing.expectEqual(true, offscreen instanceof OffscreenCanvas);
  testing.expectEqual(offscreen.width, 128);
  testing.expectEqual(offscreen.height, 96);
}
</script>

<script id=OffscreenCanvasRenderingContext2D#getImageData>
{
  const canvas = new OffscreenCanvas(100, 50);
  const ctx = canvas.getContext("2d");

  const imageData = ctx.getImageData(0, 0, 10, 20);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 10);
  testing.expectEqual(imageData.height, 20);
  testing.expectEqual(imageData.data.length, 10 * 20 * 4);

  // Undrawn canvas should return transparent black pixels.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);

  // Zero or negative dimensions should throw.
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 0, 10));
  testing.expectError('Index or size', () => ctx.getImageData(0, 0, 10, -5));
}
</script>

<script id="OffscreenCanvasRenderingContext2D#fillRect paints">
{
  const canvas = new OffscreenCanvas(4, 4);
  const ctx = canvas.getContext('2d');

  // The same context object comes back, so drawn pixels survive the call.
  testing.expectTrue(ctx === canvas.getContext('2d'));
  testing.expectEqual(canvas, ctx.canvas);

  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 2, 2);
  testing.expectEqual([255, 0, 0, 255], Array.from(ctx.getImageData(0, 0, 1, 1).data));
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(3, 3, 1, 1).data));

  ctx.clearRect(0, 0, 1, 1);
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 1, 1).data));

  // Resizing clears the bitmap.
  ctx.fillRect(0, 0, 4, 4);
  canvas.width = 4;
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 1, 1).data));
}
</script>

<script id="OffscreenCanvas#convertToBlob png" type=module>
  const state = await testing.async();

  const canvas = new OffscreenCanvas(3, 3);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 3, 3);

  const blob = await canvas.convertToBlob();
  const bytes = new Uint8Array(await blob.arrayBuffer());

  let rejected = null;
  const empty = new OffscreenCanvas(0, 0);
  try {
    await empty.convertToBlob();
  } catch (err) {
    rejected = err;
  }

  state.resolve();
  await state.done(() => {
    testing.expectEqual('image/png', blob.type);
    testing.expectTrue(blob.size > 0);
    // PNG signature.
    testing.expectEqual([137, 80, 78, 71, 13, 10, 26, 10], Array.from(bytes.slice(0, 8)));
    // IHDR carries the real dimensions.
    testing.expectEqual([0, 0, 0, 3], Array.from(bytes.slice(16, 20)));
    testing.expectEqual([0, 0, 0, 3], Array.from(bytes.slice(20, 24)));

    testing.expectTrue(rejected !== null);
    testing.expectTrue(rejected.toString().includes('Index or size'));
  });
</script>

<script id="OffscreenCanvas#getContext webgl">
{
  // Chrome hands back a WebGL context for an OffscreenCanvas, and `gl.canvas`
  // is the OffscreenCanvas itself (measured, main thread and worker).
  const canvas = new OffscreenCanvas(256, 256);
  const gl = canvas.getContext('webgl');
  testing.expectEqual('[object WebGLRenderingContext]', Object.prototype.toString.call(gl));
  testing.expectEqual(true, gl.canvas === canvas);
  testing.expectEqual(256, gl.drawingBufferWidth);
  testing.expectEqual(256, gl.drawingBufferHeight);
  testing.expectEqual([0, 0, 256, 256], Array.from(gl.getParameter(gl.VIEWPORT)));
  // Same object on every read, and a different kind afterwards answers null.
  testing.expectEqual(true, canvas.getContext('webgl') === gl);
  testing.expectEqual(null, canvas.getContext('2d'));

  const gl2 = new OffscreenCanvas(300, 150).getContext('webgl2');
  testing.expectEqual('[object WebGL2RenderingContext]', Object.prototype.toString.call(gl2));
  testing.expectEqual(300, gl2.drawingBufferWidth);
  testing.expectEqual(150, gl2.drawingBufferHeight);

  // Resizing the canvas moves the drawing buffer with it.
  const c3 = new OffscreenCanvas(8, 8);
  const g3 = c3.getContext('webgl');
  c3.width = 64;
  testing.expectEqual(64, g3.drawingBufferWidth);

  // Object-creating calls work off an OffscreenCanvas context too — this is
  // what used to need a Frame and therefore could not run in a worker.
  testing.expectEqual('[object WebGLBuffer]', Object.prototype.toString.call(gl.createBuffer()));
  testing.expectEqual('[object WebGLProgram]', Object.prototype.toString.call(gl.createProgram()));
}
</script>

<script id="OffscreenCanvas#getContext enum">
{
  // OffscreenRenderingContextType is a real WebIDL enum here, unlike
  // HTMLCanvasElement's free-form string: a name outside the list is a
  // TypeError rather than null (measured).
  let threw = null;
  try { new OffscreenCanvas(2, 2).getContext('experimental-webgl'); } catch (e) { threw = e.name; }
  testing.expectEqual('TypeError', threw);

  threw = null;
  try { new OffscreenCanvas(2, 2).getContext('bogus'); } catch (e) { threw = e.name; }
  testing.expectEqual('TypeError', threw);

  // In the list but not implemented here: null rather than a throw.
  testing.expectEqual(null, new OffscreenCanvas(2, 2).getContext('bitmaprenderer'));
  // 'webgpu' does hand one back now -- see webgpu/pipeline.html.
  testing.expectEqual('[object GPUCanvasContext]',
    Object.prototype.toString.call(new OffscreenCanvas(2, 2).getContext('webgpu')));

  // An HTMLCanvasElement keeps the loose behaviour.
  testing.expectEqual(null, document.createElement('canvas').getContext('bogus'));
  testing.expectEqual('[object WebGLRenderingContext]',
    Object.prototype.toString.call(document.createElement('canvas').getContext('experimental-webgl')));
}
</script>

<script id="OffscreenCanvas#resize resets the context">
{
  // The same reset the canvas element does — and the path the Turnstile
  // widget actually takes, since it reuses one OffscreenCanvas at half a
  // dozen sizes and relies on the resize to clear the transform between them.
  const canvas = new OffscreenCanvas(8, 8);
  const ctx = canvas.getContext('2d');

  ctx.scale(2, 2);
  ctx.fillStyle = '#ff0000';
  ctx.save();
  canvas.width = 8;

  testing.expectEqual(1, ctx.getTransform().a);
  testing.expectEqual('#000000', ctx.fillStyle);
  ctx.scale(5, 5);
  ctx.restore();
  testing.expectEqual(5, ctx.getTransform().a);
}
</script>

<script id="OffscreenCanvas#fillStyle(gradient)">
{
  // Same union as the element context: a gradient reads back as itself. Chrome
  // 151 readings.
  const canvas = new OffscreenCanvas(20, 20);
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#123456';
  const gradient = ctx.createLinearGradient(0, 0, 5, 5);
  ctx.fillStyle = gradient;
  testing.expectEqual('object', typeof ctx.fillStyle);
  testing.expectEqual(true, ctx.fillStyle === gradient);
  testing.expectEqual('[object CanvasGradient]', String(ctx.fillStyle));

  ctx.strokeStyle = gradient;
  testing.expectEqual(true, ctx.strokeStyle === gradient);

  ctx.fillStyle = '#ff0000';
  testing.expectEqual('#ff0000', ctx.fillStyle);

  // The resize reset drops the gradient along with everything else.
  ctx.fillStyle = gradient;
  canvas.width = 20;
  testing.expectEqual('#000000', ctx.fillStyle);

  // addColorStop refuses the same three ways here as on the element context.
  const P = "Failed to execute 'addColorStop' on 'CanvasGradient': ";
  testing.expectError('TypeError: ' + P + 'The provided double value is non-finite.',
    () => ctx.createLinearGradient(0, 0, 5, 5).addColorStop(NaN, '#fff'));
  testing.expectError(
    'IndexSizeError: ' + P + 'The provided value (2) is outside the range (0.0, 1.0).',
    () => ctx.createLinearGradient(0, 0, 5, 5).addColorStop(2, '#fff'));
  testing.expectError(
    "SyntaxError: " + P + "The value provided ('notacolour') could not be parsed as a color.",
    () => ctx.createLinearGradient(0, 0, 5, 5).addColorStop(0, 'notacolour'));
  ctx.createLinearGradient(0, 0, 5, 5).addColorStop(0, 'rgba(1,2,3,0.5)');

  // The factories refuse the same way, and the sentence names *this* interface
  // rather than the element context's (measured on Chrome 151).
  const on = (op) => "Failed to execute '" + op +
    "' on 'OffscreenCanvasRenderingContext2D': ";
  testing.expectError(
    'TypeError: ' + on('createLinearGradient') + 'The provided double value is non-finite.',
    () => ctx.createLinearGradient(NaN, 0, 1, 1));
  testing.expectError(
    'IndexSizeError: ' + on('createRadialGradient') + 'The r0 provided is less than 0.',
    () => ctx.createRadialGradient(0, 0, -1, 0, 0, 1));
  testing.expectError(
    'TypeError: ' + on('createConicGradient') + 'The provided double value is non-finite.',
    () => ctx.createConicGradient(NaN, 0, 0));
  testing.expectError(
    "SyntaxError: " + on('createPattern') +
    "The provided type ('bogus') is not one of 'repeat', 'no-repeat', " +
    "'repeat-x', or 'repeat-y'.",
    () => ctx.createPattern(new OffscreenCanvas(2, 2), 'bogus'));
  testing.expectError(
    'TypeError: ' + on('createPattern') +
    "The provided value is not of type '(CSSImageValue or HTMLCanvasElement " +
    "or HTMLImageElement or HTMLVideoElement or ImageBitmap or OffscreenCanvas " +
    "or SVGImageElement or VideoFrame)'.",
    () => ctx.createPattern(null, 'repeat'));
}
</script>

<script id="OffscreenCanvas#getContextAttributes">
{
  // Same echo as the element context, and the refusals name *this* interface.
  const attrs = (settings) => new OffscreenCanvas(10, 10).getContext('2d', settings)
    .getContextAttributes();

  testing.expectEqual(false, attrs(undefined).willReadFrequently);
  testing.expectEqual(true, attrs({ willReadFrequently: true }).willReadFrequently);
  const all = attrs({
    alpha: false,
    colorSpace: 'display-p3',
    colorType: 'float16',
    desynchronized: true,
    willReadFrequently: true,
  });
  testing.expectEqual('false,display-p3,float16,true,true',
    [all.alpha, all.colorSpace, all.colorType, all.desynchronized, all.willReadFrequently].join(','));
  testing.expectEqual(false, attrs('nonsense').willReadFrequently);

  const P = "Failed to execute 'getContext' on 'OffscreenCanvas': " +
    "Failed to read the '";
  const M = "' property from 'CanvasContextCreationAttributesModule': " +
    "The provided value 'bogus' is not a valid enum value of type ";
  testing.expectError('TypeError: ' + P + 'colorSpace' + M + 'PredefinedColorSpace.',
    () => attrs({ colorSpace: 'bogus' }));
  testing.expectError('TypeError: ' + P + 'colorType' + M + 'CanvasPixelFormat.',
    () => attrs({ colorType: 'bogus' }));
  testing.expectError(
    "TypeError: Failed to execute 'getContext' on 'OffscreenCanvas': " +
    "Failed to read the 'willReadFrequently' property from " +
    "'CanvasContextCreationAttributesModule': The provided value '1' is not " +
    'a valid enum value of type CanvasWillReadFrequently.',
    () => attrs({ willReadFrequently: 1 }));
}
</script>

<script id="OffscreenCanvas#drawImage">
{
  // This member did not exist on the offscreen context at all -- the element
  // context had it and this one did not, so calling it raised a TypeError that
  // took the rest of the caller's function with it. That is what stops five of
  // the Turnstile widget's readbacks from happening here (README, "The
  // eighteen pixel readbacks").
  const src = new OffscreenCanvas(4, 4);
  const sctx = src.getContext('2d');
  sctx.fillStyle = '#ff0000';
  sctx.fillRect(0, 0, 4, 4);

  const dst = new OffscreenCanvas(8, 8);
  const dctx = dst.getContext('2d');
  testing.expectEqual('function', typeof dctx.drawImage);
  testing.expectEqual(3, dctx.drawImage.length);

  dctx.drawImage(src, 0, 0);
  testing.expectEqual([255, 0, 0, 255], Array.from(dctx.getImageData(3, 3, 1, 1).data));
  // The source is 4x4, so nothing lands past it.
  testing.expectEqual([0, 0, 0, 0], Array.from(dctx.getImageData(4, 4, 1, 1).data));

  // The nine-argument form scales; a 4x4 source into a 2x2 box leaves the
  // other half of the destination alone.
  const box = new OffscreenCanvas(4, 4);
  const bctx = box.getContext('2d');
  bctx.drawImage(src, 0, 0, 4, 4, 0, 0, 2, 2);
  testing.expectEqual([255, 0, 0, 255], Array.from(bctx.getImageData(1, 1, 1, 1).data));
  testing.expectEqual([0, 0, 0, 0], Array.from(bctx.getImageData(3, 3, 1, 1).data));

  // A source that was never drawn into has no pixels to give.
  const blank = new OffscreenCanvas(4, 4);
  blank.getContext('2d');
  const after = new OffscreenCanvas(4, 4);
  const actx = after.getContext('2d');
  actx.drawImage(blank, 0, 0);
  testing.expectEqual([0, 0, 0, 0], Array.from(actx.getImageData(0, 0, 1, 1).data));
}
</script>

<script id="OffscreenCanvas#transferToImageBitmap">
{
  // Measured on Chrome with probes/expr-transfer-to-image-bitmap.js. The name
  // is the specification: the bitmap comes away with the pixels and the canvas
  // is left blank, which is what makes a second transfer answer transparent.
  //
  // Every reading goes through `ask`, which turns a throw into a string rather
  // than letting it escape: a script that dies half way through leaves the
  // assertions it never reached unrecorded, and the runner reads a script whose
  // recorded assertions all passed as a pass. Nothing here may throw.
  const ask = (fn) => {
    try { return fn(); } catch (err) { return `${err.name}: ${err.message}`; }
  };
  const shot = (bmp, w, h) => ask(() => {
    const c = new OffscreenCanvas(w, h);
    const g = c.getContext('2d');
    g.drawImage(bmp, 0, 0);
    return Array.from(g.getImageData(0, 0, w, h).data);
  });

  const canvas = new OffscreenCanvas(2, 1);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(0, 0, 1, 1);
  ctx.fillStyle = '#0000ff';
  ctx.fillRect(1, 0, 1, 1);

  testing.expectEqual('function', typeof canvas.transferToImageBitmap);
  testing.expectEqual(0, canvas.transferToImageBitmap.length);

  const bitmap = ask(() => canvas.transferToImageBitmap());
  testing.expectEqual('ImageBitmap', ask(() => bitmap.constructor.name));
  testing.expectEqual(2, ask(() => bitmap.width));
  testing.expectEqual(1, ask(() => bitmap.height));
  testing.expectEqual([255, 0, 0, 255, 0, 0, 255, 255], shot(bitmap, 2, 1));

  // The source is blank afterwards, read either way round, and keeps its size.
  testing.expectEqual([0, 0, 0, 0, 0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 2, 1).data));
  testing.expectEqual(2, canvas.width);
  testing.expectEqual(1, canvas.height);

  // The context survives it: same canvas, and still drawable.
  testing.expectTrue(ctx.canvas === canvas);
  ctx.fillStyle = '#00ff00';
  ctx.fillRect(0, 0, 2, 1);
  testing.expectEqual([0, 255, 0, 255], Array.from(ctx.getImageData(0, 0, 1, 1).data));

  // A second transfer of a canvas nothing has been drawn into since answers a
  // transparent bitmap rather than the pixels the first one took.
  const twice = new OffscreenCanvas(2, 1);
  const tctx = twice.getContext('2d');
  tctx.fillStyle = '#ff0000';
  tctx.fillRect(0, 0, 2, 1);
  testing.expectEqual([255, 0, 0, 255, 255, 0, 0, 255], shot(ask(() => twice.transferToImageBitmap()), 2, 1));
  testing.expectEqual([0, 0, 0, 0, 0, 0, 0, 0], shot(ask(() => twice.transferToImageBitmap()), 2, 1));

  // The bitmap is a copy, so resizing the source afterwards does not reach it.
  const kept = new OffscreenCanvas(2, 1);
  const kctx = kept.getContext('2d');
  kctx.fillStyle = '#ff0000';
  kctx.fillRect(0, 0, 2, 1);
  const survivor = ask(() => kept.transferToImageBitmap());
  kept.width = 4;
  testing.expectEqual([255, 0, 0, 255, 255, 0, 0, 255], shot(survivor, 2, 1));

  // And it is an ordinary ImageBitmap: closing it detaches it.
  ask(() => survivor.close());
  testing.expectEqual(0, ask(() => survivor.width));
  testing.expectEqual(
    "InvalidStateError: Failed to execute 'drawImage' on " +
      "'OffscreenCanvasRenderingContext2D': The image source is detached",
    shot(survivor, 2, 1),
  );

  // A canvas with no context at all has no bitmap to hand over.
  testing.expectEqual(
    "InvalidStateError: Failed to execute 'transferToImageBitmap' on " +
      "'OffscreenCanvas': Cannot transfer an ImageBitmap from an " +
      'OffscreenCanvas with no context',
    ask(() => new OffscreenCanvas(2, 1).transferToImageBitmap()),
  );

  // A degenerate extent is refused after the context check, and under a
  // different name -- Chrome reports the construction itself as having failed.
  const degenerate = new OffscreenCanvas(0, 1);
  degenerate.getContext('2d');
  testing.expectEqual(
    "UnknownError: Failed to execute 'transferToImageBitmap' on " +
      "'OffscreenCanvas': ImageBitmap construction failed",
    ask(() => degenerate.transferToImageBitmap()),
  );
}
</script>

<script id="OffscreenCanvasRenderingContext2D#measureText emoji">
{
  // The ten strings the Turnstile widget measures, at the font it sets, with
  // headed Chrome's answer for all ten -- probes/expr-emoji-text-metrics.js.
  // The widget reads them off an OffscreenCanvas, so this is the surface that
  // matters even though both 2D contexts share one implementation.
  //
  // Every reading goes through `ask` for the reason given above: a script that
  // throws half way leaves its remaining assertions unrecorded, and the runner
  // reads a script whose recorded assertions all passed as a pass.
  const ask = (fn) => {
    try { return fn(); } catch (err) { return `${err.name}: ${err.message}`; }
  };

  const ctx = new OffscreenCanvas(300, 150).getContext('2d');
  ctx.font = '16px sans-serif';

  const TEN = [
    '\u{1F600}', '\u{1F923}', '\u{1F631}', '\u{1F44D}', '\u{1F525}',
    '\u{1F680}', '\u{1F9E0}', '\u{1F436}', '\u{1F3E0}', '\u{2600}\u{FE0F}',
  ];
  for (const emoji of TEN) {
    testing.expectEqual(
      // The hanging baseline is 80% of the font ascent computed in single
      // precision, which is Chrome's own rounding -- the probe rounds it to
      // 11.2 for display, the engine answers 11.199999809265137.
      [20, 1, 21, 17, 5, 14, 4, 0, 11.199999809265137, -4],
      ask(() => {
        const m = ctx.measureText(emoji);
        return [
          m.width, m.actualBoundingBoxLeft, m.actualBoundingBoxRight,
          m.actualBoundingBoxAscent, m.actualBoundingBoxDescent,
          m.fontBoundingBoxAscent, m.fontBoundingBoxDescent,
          m.alphabeticBaseline, m.hangingBaseline, m.ideographicBaseline,
        ];
      }),
    );
  }

  // The plain-text control from the same probe, which already agreed: if these
  // move, the change was to the font metrics rather than to the emoji.
  const round = (v) => (typeof v === 'number' ? Math.round(v * 1000) / 1000 : v);
  testing.expectEqual(8, ask(() => ctx.measureText('x').width));
  testing.expectEqual(13.328, round(ask(() => ctx.measureText('M').width)));
  testing.expectEqual(60.445, round(ask(() => ctx.measureText('Hwmqxli').width)));
  testing.expectEqual(4.445, round(ask(() => ctx.measureText(' ').width)));
}
</script>
