</script>

<script id="OffscreenCanvasRenderingContext2D#float32 pixel format">
{
  // `ImageDataPixelFormat` has a third member. Chrome's own refusal for a
  // Float32Array in the data constructor names it — "Float32Array must use
  // rgba-float32 pixelFormat." — and every entry point that takes the
  // dictionary accepts it. Readings from probes/canvas-image-data-construct.js.
  const shape = (d) => `${d.colorSpace} ${d.pixelFormat} ${d.width}x${d.height} ` +
    `${d.data.constructor.name} len=${d.data.length}`;
  const hex = (d) => [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
  const ctx = (settings) => new OffscreenCanvas(1, 1)
    .getContext('2d', { willReadFrequently: true, ...settings });

  testing.expectEqual('srgb rgba-float32 1x1 Float32Array len=4',
    shape(new ImageData(1, 1, { pixelFormat: 'rgba-float32' })));
  testing.expectEqual('srgb rgba-float32 1x1 Float32Array len=4',
    shape(ctx().createImageData(1, 1, { pixelFormat: 'rgba-float32' })));
  // From a source ImageData the format is inherited, as the space is.
  testing.expectEqual('srgb rgba-float32 1x1 Float32Array len=4',
    shape(ctx().createImageData(new ImageData(1, 1, { pixelFormat: 'rgba-float32' }))));

  // A read holds the same unquantised value the float16 format does, at the
  // width that can show all of it: the premultiplied {60, 30, 15, 77} this
  // pixel stores is 60 / 77 exactly, not the 199 / 255 of its unorm8 byte.
  {
    const c = ctx();
    c.fillStyle = 'rgba(200, 100, 50, 0.3)';
    c.fillRect(0, 0, 1, 1);
    testing.expectEqual('199,99,50,77', [...c.getImageData(0, 0, 1, 1).data].join(','));
    testing.expectEqual(
      '0.7792208194732666,0.3896104097366333,0.19480520486831665,0.3019607961177826',
      [...c.getImageData(0, 0, 1, 1, { pixelFormat: 'rgba-float32' }).data].join(','));
  }
  // An opaque pixel is its byte over 255 at this width too, since dividing by
  // an alpha of 255 is not dividing at all.
  {
    const c = ctx({ colorSpace: 'display-p3' });
    c.fillStyle = '#ff0000';
    c.fillRect(0, 0, 1, 1);
    testing.expectEqual('234,51,35,255', [...c.getImageData(0, 0, 1, 1).data].join(','));
    testing.expectEqual(
      '0.917647123336792,0.20000001788139343,0.13725490868091583,1',
      [...c.getImageData(0, 0, 1, 1, { pixelFormat: 'rgba-float32' }).data].join(','));
  }
  // A window off the canvas is transparent black, and an opaque canvas that has
  // never been painted is opaque black.
  {
    const c = ctx();
    c.fillStyle = '#ff0000';
    c.fillRect(0, 0, 1, 1);
    testing.expectEqual('1,0,0,1,0,0,0,0',
      [...c.getImageData(0, 0, 2, 1, { pixelFormat: 'rgba-float32' }).data].join(','));
  }
  testing.expectEqual('0,0,0,1', [...ctx({ alpha: false })
    .getImageData(0, 0, 1, 1, { pixelFormat: 'rgba-float32' }).data].join(','));
  testing.expectEqual('0,0,0,0',
    [...ctx().getImageData(0, 0, 1, 1, { pixelFormat: 'rgba-float32' }).data].join(','));

  // And a write through the format's own array, which quantises into the
  // eight-bit bitmap and clamps outside 0..1.
  {
    const c = ctx();
    const d = new ImageData(1, 1, { pixelFormat: 'rgba-float32' });
    d.data.set([1, 0.5, 0.2, 1]);
    c.putImageData(d, 0, 0);
    testing.expectEqual('ff8033ff', hex(c.getImageData(0, 0, 1, 1).data));
  }
  {
    const c = ctx();
    const d = new ImageData(1, 1, { pixelFormat: 'rgba-float32' });
    d.data.set([2, -1, 0.5, 1]);
    c.putImageData(d, 0, 0);
    testing.expectEqual('ff0080ff', hex(c.getImageData(0, 0, 1, 1).data));
  }

  // A clone carries the format, since the bytes alone would not say which array
  // to rebuild.
  {
    const d = new ImageData(1, 1, { pixelFormat: 'rgba-float32', colorSpace: 'display-p3' });
    d.data.set([0.25, 0.5, 0.75, 1]);
    const back = structuredClone(d);
    testing.expectEqual('display-p3 rgba-float32 1x1 Float32Array len=4', shape(back));
    testing.expectEqual('0.25,0.5,0.75,1', [...back.data].join(','));
  }
}
</script>

<script id="OffscreenCanvasRenderingContext2D#ImageData data constructor">
{
  // `new ImageData(data, sw)` / `(data, sw, sh)` / `(data, sw, sh, settings)`:
  // the three forms that hand it pixels rather than a size. They can disagree
  // with themselves in ways the size forms cannot, and each disagreement has
  // its own sentence. Readings from probes/canvas-image-data-construct.js.
  const shape = (d) => `${d.colorSpace} ${d.pixelFormat} ${d.width}x${d.height} ` +
    `${d.data.constructor.name} len=${d.data.length}`;
  const threw = (f) => { try { f(); return 'no throw'; } catch (e) { return `${e.name}: ${e.message}`; } };
  const P = "Failed to construct 'ImageData': ";

  // The height is inferred from what is left of the array.
  testing.expectEqual('srgb rgba-unorm8 1x2 Uint8ClampedArray len=8',
    shape(new ImageData(new Uint8ClampedArray(8), 1)));
  testing.expectEqual('srgb rgba-unorm8 1x2 Uint8ClampedArray len=8',
    shape(new ImageData(new Uint8ClampedArray(8), 1, 2)));
  testing.expectEqual('display-p3 rgba-unorm8 1x1 Uint8ClampedArray len=4',
    shape(new ImageData(new Uint8ClampedArray(4), 1, 1, { colorSpace: 'display-p3' })));
  testing.expectEqual('srgb rgba-unorm8 1x1 Uint8ClampedArray len=4',
    shape(new ImageData(new Uint8ClampedArray(4), 1, 1, undefined)));
  testing.expectEqual('srgb rgba-unorm8 1x2 Uint8ClampedArray len=8',
    shape(new ImageData(new Uint8ClampedArray(8), 1, undefined)));
  // With a fourth argument the height is converted rather than inferred, so an
  // undefined one is a zero.
  testing.expectEqual(`IndexSizeError: ${P}The source height is zero or not a number.`,
    threw(() => new ImageData(new Uint8ClampedArray(8), 1, undefined, { colorSpace: 'display-p3' })));

  // The array is taken over rather than copied: it is the same object, writes
  // go both ways, and a view onto part of a buffer keeps its offset.
  {
    const array = new Uint8ClampedArray(4);
    const d = new ImageData(array, 1, 1);
    testing.expectEqual(true, d.data === array);
    array[0] = 200;
    d.data[1] = 100;
    testing.expectEqual('200,100', `${d.data[0]},${array[1]}`);
  }
  {
    const array = new Uint8ClampedArray(new ArrayBuffer(12), 4, 4);
    const d = new ImageData(array, 1, 1);
    testing.expectEqual('4 4 12',
      `${d.data.length} ${d.data.byteOffset} ${d.data.buffer.byteLength}`);
  }

  // The array's type has to be the one the pixelFormat names, and each of the
  // three names itself when it is not.
  testing.expectEqual('srgb rgba-float16 1x1 Float16Array len=4',
    shape(new ImageData(new Float16Array(4), 1, 1, { pixelFormat: 'rgba-float16' })));
  testing.expectEqual('srgb rgba-float32 1x1 Float32Array len=4',
    shape(new ImageData(new Float32Array(4), 1, 1, { pixelFormat: 'rgba-float32' })));
  testing.expectEqual('srgb rgba-unorm8 1x1 Uint8ClampedArray len=4',
    shape(new ImageData(new Uint8ClampedArray(4), 1, 1, { pixelFormat: 'rgba-unorm8' })));
  testing.expectEqual(`InvalidStateError: ${P}Float16Array must use rgba-float16 pixelFormat.`,
    threw(() => new ImageData(new Float16Array(4), 1, 1)));
  testing.expectEqual(`InvalidStateError: ${P}Float16Array must use rgba-float16 pixelFormat.`,
    threw(() => new ImageData(new Float16Array(4), 1, 1, { pixelFormat: 'rgba-unorm8' })));
  testing.expectEqual(`InvalidStateError: ${P}Uint8ClampedArray must use rgba-unorm8 pixelFormat.`,
    threw(() => new ImageData(new Uint8ClampedArray(4), 1, 1, { pixelFormat: 'rgba-float16' })));
  testing.expectEqual(`InvalidStateError: ${P}Float32Array must use rgba-float32 pixelFormat.`,
    threw(() => new ImageData(new Float32Array(4), 1, 1)));

  // Any other first argument is not this overload at all: it is a width, and
  // the arguments after it move up a slot — so a third argument that is a
  // number is read as the settings dictionary and refused for being one.
  for (const notAnArray of [new Uint8Array(4), [0, 0, 0, 0], new ArrayBuffer(4), null]) {
    testing.expectEqual(`TypeError: ${P}The provided value is not of type 'ImageDataSettings'.`,
      threw(() => new ImageData(notAnArray, 1, 1)));
  }

  // Every way the arguments can disagree, each with its own sentence.
  testing.expectEqual(`InvalidStateError: ${P}The input data length is not a multiple of 4.`,
    threw(() => new ImageData(new Uint8ClampedArray(5), 1, 1)));
  testing.expectEqual(`IndexSizeError: ${P}The input data length is not a multiple of (4 * width).`,
    threw(() => new ImageData(new Uint8ClampedArray(8), 3)));
  testing.expectEqual(
    `IndexSizeError: ${P}The input data length is not equal to (4 * width * height).`,
    threw(() => new ImageData(new Uint8ClampedArray(8), 1, 3)));
  testing.expectEqual(`IndexSizeError: ${P}The source width is zero or not a number.`,
    threw(() => new ImageData(new Uint8ClampedArray(4), 0, 1)));
  testing.expectEqual(`IndexSizeError: ${P}The source height is zero or not a number.`,
    threw(() => new ImageData(new Uint8ClampedArray(4), 1, 0)));
  testing.expectEqual(`InvalidStateError: ${P}The input data has zero elements.`,
    threw(() => new ImageData(new Uint8ClampedArray(0), 1)));
  testing.expectEqual(`IndexSizeError: ${P}The requested image size exceeds the supported range.`,
    threw(() => new ImageData(new Uint8ClampedArray(4), -1, 1)));
  testing.expectEqual(`TypeError: ${P}The provided value is not of type 'ImageDataSettings'.`,
    threw(() => new ImageData(new Uint8ClampedArray(4), 1, 1, 'nope')));
  testing.expectEqual(`TypeError: ${P}2 arguments required, but only 0 present.`,
    threw(() => new ImageData()));
  testing.expectEqual(`TypeError: ${P}2 arguments required, but only 1 present.`,
    threw(() => new ImageData(new Uint8ClampedArray(4))));
  testing.expectEqual(`TypeError: ${P}2 arguments required, but only 1 present.`,
    threw(() => new ImageData(1)));

  // Which refusal wins, for the calls that earn two at once.
  testing.expectEqual(`InvalidStateError: ${P}Float16Array must use rgba-float16 pixelFormat.`,
    threw(() => new ImageData(new Float16Array(5), 1, 1)));
  testing.expectEqual(`InvalidStateError: ${P}Float16Array must use rgba-float16 pixelFormat.`,
    threw(() => new ImageData(new Float16Array(0), 1)));
  testing.expectEqual(`IndexSizeError: ${P}The source width is zero or not a number.`,
    threw(() => new ImageData(new Float16Array(4), 0, 1)));
  testing.expectEqual(`IndexSizeError: ${P}The source width is zero or not a number.`,
    threw(() => new ImageData(new Uint8ClampedArray(5), 0, 1)));
  testing.expectEqual(`IndexSizeError: ${P}The requested image size exceeds the supported range.`,
    threw(() => new ImageData(new Uint8ClampedArray(5), -1, 1)));
  testing.expectEqual(`IndexSizeError: ${P}The source width is zero or not a number.`,
    threw(() => new ImageData(new Uint8ClampedArray(4), 0, 0)));

  // And the size forms reach the same sentences without a data array.
  testing.expectEqual(`IndexSizeError: ${P}The source width is zero or not a number.`,
    threw(() => new ImageData(0, 1)));
  testing.expectEqual(`IndexSizeError: ${P}The source height is zero or not a number.`,
    threw(() => new ImageData(1, 0)));
  testing.expectEqual(`IndexSizeError: ${P}The source width is zero or not a number.`,
    threw(() => new ImageData(0, 0)));
  testing.expectEqual(`IndexSizeError: ${P}The source width is zero or not a number.`,
    threw(() => new ImageData(NaN, 1)));
  testing.expectEqual(`IndexSizeError: ${P}The requested image size exceeds the supported range.`,
    threw(() => new ImageData(-1, 1)));
  testing.expectEqual(`IndexSizeError: ${P}The requested image size exceeds the supported range.`,
    threw(() => new ImageData(1, -1)));
  testing.expectEqual(`IndexSizeError: ${P}The requested image size exceeds the supported range.`,
    threw(() => new ImageData(1e10, 1)));
  testing.expectEqual(`IndexSizeError: ${P}The requested image size exceeds the supported range.`,
    threw(() => new ImageData(65536, 65536)));
  // Both arguments are `unsigned long`, so these truncate rather than refuse.
  testing.expectEqual('srgb rgba-unorm8 1x1 Uint8ClampedArray len=4', shape(new ImageData(1.9, 1.9)));
  testing.expectEqual('srgb rgba-unorm8 2x3 Uint8ClampedArray len=24', shape(new ImageData('2', '3')));

  // A detached array has no elements at all, so it reaches the zero-elements
  // refusal above. There is no assertion for it here: `structuredClone`'s
  // `transfer` option does not detach the buffer in this engine yet, so the
  // array a test could build is never actually detached. The probe carries that
  // row (`refusals | detached buffer`) and it is the transfer that is missing,
  // not this constructor.
}
</script>

<script id="OffscreenCanvasRenderingContext2D#ImageData data is cached">
{
  // `data` is `[Cached]` in Blink, which makes it an own value property on the
  // instance *as well as* the prototype getter — and it is there before
  // anything reads it. So an ImageData is the one object on this interface with
  // an own key, which `Object.keys`, `JSON.stringify` and `Object.hasOwn` all
  // see. Readings from probes/canvas-image-data-settings-2.js.
  const desc = (o, k) => {
    const d = Object.getOwnPropertyDescriptor(o, k);
    if (!d) return 'absent';
    if ('value' in d) return `value writable=${d.writable} enumerable=${d.enumerable} configurable=${d.configurable}`;
    return `get enumerable=${d.enumerable} configurable=${d.configurable}`;
  };
  const ctx = () => new OffscreenCanvas(1, 1).getContext('2d', { willReadFrequently: true });

  const d0 = new ImageData(1, 1);
  testing.expectEqual('value writable=false enumerable=true configurable=true', desc(d0, 'data'));
  testing.expectEqual('get enumerable=true configurable=true', desc(ImageData.prototype, 'data'));
  // The other three attributes are prototype getters and nothing more.
  testing.expectEqual('absent', desc(d0, 'colorSpace'));
  testing.expectEqual('absent', desc(d0, 'pixelFormat'));
  testing.expectEqual('absent', desc(d0, 'width'));
  testing.expectEqual('absent', desc(d0, 'height'));

  testing.expectEqual('data', Object.keys(d0).join(','));
  testing.expectEqual('data', Object.getOwnPropertyNames(d0).join(','));
  testing.expectEqual(true, Object.hasOwn(d0, 'data'));
  testing.expectEqual('{"data":{"0":0,"1":0,"2":0,"3":0}}', JSON.stringify(d0));
  // The own value is the array the getter answers, not a second copy of it.
  testing.expectEqual(true, Object.getOwnPropertyDescriptor(d0, 'data').value === d0.data);

  // Present on a fresh object, before `data` has been read through anything.
  testing.expectEqual('value writable=false enumerable=true configurable=true',
    desc(new ImageData(1, 1), 'data'));
  // And on one from every entry point that hands an ImageData out.
  testing.expectEqual('value writable=false enumerable=true configurable=true',
    desc(ctx().getImageData(0, 0, 1, 1), 'data'));
  testing.expectEqual('value writable=false enumerable=true configurable=true',
    desc(ctx().createImageData(1, 1), 'data'));
  testing.expectEqual('value writable=false enumerable=true configurable=true',
    desc(structuredClone(new ImageData(1, 1)), 'data'));

  // Only the unorm8 arm has one. The cached attribute in Blink's IDL is the
  // Uint8ClampedArray one, so a float ImageData reaches `data` through the
  // prototype getter alone (measured).
  testing.expectEqual('absent', desc(new ImageData(1, 1, { pixelFormat: 'rgba-float16' }), 'data'));
  testing.expectEqual('absent', desc(new ImageData(1, 1, { pixelFormat: 'rgba-float32' }), 'data'));
  testing.expectEqual('absent',
    desc(ctx().getImageData(0, 0, 1, 1, { pixelFormat: 'rgba-float16' }), 'data'));

  // writable=false, so an assignment is dropped; configurable=true, so a
  // delete and a redefinition are not.
  {
    const d = new ImageData(1, 1);
    const before = d.data;
    d.data = 5;
    testing.expectEqual(true, d.data === before);
  }
  {
    const d = new ImageData(1, 1);
    testing.expectEqual(true, delete d.data);
    testing.expectEqual('absent', desc(d, 'data'));
    // The prototype getter is still there underneath.
    testing.expectEqual(4, d.data.length);
  }
  {
    const d = new ImageData(1, 1);
    Object.defineProperty(d, 'data', { value: 7 });
    testing.expectEqual(7, d.data);
  }

  // The prototype's own keys, in Blink's order.
  testing.expectEqual('width,height,colorSpace,data,pixelFormat,constructor',
    Object.getOwnPropertyNames(ImageData.prototype).join(','));
}
</script>

<script id="offscreen_canvas_is_an_event_target">
  {
    // Chrome's OffscreenCanvas inherits EventTarget, which is what makes
    // oncontextlost/oncontextrestored handler properties in the first place.
    // This engine had it as a prototype root: `oc instanceof EventTarget` was
    // false and `oc.addEventListener` was undefined, both readable in one
    // expression.
    const oc = new OffscreenCanvas(1, 1);
    testing.expectEqual(true, oc instanceof EventTarget);
    testing.expectEqual('function', typeof oc.addEventListener);
    testing.expectEqual(true, Object.getPrototypeOf(OffscreenCanvas.prototype) === EventTarget.prototype);

    testing.expectEqual('width,height,oncontextlost,oncontextrestored,convertToBlob,getContext,transferToImageBitmap,constructor',
      Object.getOwnPropertyNames(OffscreenCanvas.prototype).join(','));

    testing.expectEqual(null, oc.oncontextlost);
    testing.expectEqual(null, oc.oncontextrestored);
    const d = Object.getOwnPropertyDescriptor(OffscreenCanvas.prototype, 'oncontextlost');
    testing.expectEqual('function', typeof d.get);
    testing.expectEqual(true, d.enumerable);
    testing.expectEqual(true, d.configurable);

    const f = () => {};
    oc.oncontextlost = f;
    testing.expectEqual(true, oc.oncontextlost === f);
    oc.oncontextlost = null;
    testing.expectEqual(null, oc.oncontextlost);
  }
</script>

<script id=OffscreenCanvasRenderingContext2D#measureText>
{
  const ctx = new OffscreenCanvas(10, 10).getContext("2d");
  ctx.font = "16px sans-serif";
  // The same advance the on-screen context answers: an offscreen context
  // measures against the same font tables, and a fingerprint that compared
  // the two would see one number, not a stand-in.
  const onscreen = document.createElement("canvas").getContext("2d");
  onscreen.font = "16px sans-serif";
  testing.expectEqual(onscreen.measureText("hello").width, ctx.measureText("hello").width);
  ctx.setLineDash([1, 2]);
  testing.expectEqual("1,2", ctx.getLineDash().join());
  testing.expectEqual(true, ctx.createLinearGradient(0, 0, 1, 1) instanceof CanvasGradient);
}
</script>
