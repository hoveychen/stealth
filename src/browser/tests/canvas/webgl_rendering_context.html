<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=WebGLRenderingContext#getSupportedExtensions>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  testing.expectEqual(true, ctx instanceof WebGLRenderingContext);

  const supportedExtensions = ctx.getSupportedExtensions();
  // The order Chrome prefer.
  const expectedExtensions = [
      "ANGLE_instanced_arrays",
      "EXT_blend_minmax",
      "EXT_clip_control",
      "EXT_color_buffer_half_float",
      "EXT_depth_clamp",
      "EXT_float_blend",
      "EXT_frag_depth",
      "EXT_polygon_offset_clamp",
      "EXT_shader_texture_lod",
      "EXT_texture_compression_bptc",
      "EXT_texture_compression_rgtc",
      "EXT_texture_filter_anisotropic",
      "EXT_texture_mirror_clamp_to_edge",
      "EXT_sRGB",
      "OES_element_index_uint",
      "OES_fbo_render_mipmap",
      "OES_standard_derivatives",
      "OES_texture_float",
      "OES_texture_float_linear",
      "OES_texture_half_float",
      "OES_texture_half_float_linear",
      "OES_vertex_array_object",
      "WEBGL_color_buffer_float",
      "WEBGL_compressed_texture_astc",
      "WEBGL_compressed_texture_etc",
      "WEBGL_compressed_texture_etc1",
      "WEBGL_compressed_texture_s3tc",
      "WEBGL_compressed_texture_s3tc_srgb",
      "WEBGL_debug_renderer_info",
      "WEBGL_debug_shaders",
      "WEBGL_depth_texture",
      "WEBGL_draw_buffers",
      "WEBGL_lose_context",
      "WEBGL_multi_draw",
      "WEBGL_polygon_mode"
  ];

  testing.expectEqual(expectedExtensions.length, supportedExtensions.length);
  for (let i = 0; i < expectedExtensions.length; i++) {
    testing.expectEqual(expectedExtensions[i], supportedExtensions[i]);
  }
}
</script>

<script id=WebGLRenderingCanvas#getExtension>
// WEBGL_debug_renderer_info
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const rendererInfo = ctx.getExtension("WEBGL_debug_renderer_info");
  testing.expectEqual(true, rendererInfo instanceof WEBGL_debug_renderer_info);

  const { UNMASKED_VENDOR_WEBGL, UNMASKED_RENDERER_WEBGL } = rendererInfo;
  testing.expectEqual(UNMASKED_VENDOR_WEBGL, 0x9245);
  testing.expectEqual(UNMASKED_RENDERER_WEBGL, 0x9246);

  testing.expectEqual("Google Inc. (Google)", ctx.getParameter(UNMASKED_VENDOR_WEBGL));
  testing.expectEqual(
    "ANGLE (Google, Vulkan 1.3.0 (SwiftShader Device (Subzero) (0x0000C0DE)), SwiftShader driver)",
    ctx.getParameter(UNMASKED_RENDERER_WEBGL),
  );
}

// WEBGL_lose_context
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("webgl");
  const loseContext = ctx.getExtension("WEBGL_lose_context");
  testing.expectEqual(true, loseContext instanceof WEBGL_lose_context);

  loseContext.loseContext();
  loseContext.restoreContext();
}
</script>

<script id=identity>
{
  const element = document.createElement('canvas');
  const ctx = element.getContext('webgl');

  testing.expectTrue(ctx === element.getContext('webgl'));
  testing.expectEqual(null, element.getContext('2d'));
}
</script>

<script id=WebGLRenderingContext#getParameter>
{
  const element = document.createElement("canvas");
  element.width = 240;
  element.height = 60;
  const ctx = element.getContext("webgl");

  // Strings a fingerprinting script reads first. These are the values the real
  // Chrome on the reference host reports; see tools/fingerprint/results/.
  testing.expectEqual("WebKit", ctx.getParameter(ctx.VENDOR));
  testing.expectEqual("WebKit WebGL", ctx.getParameter(ctx.RENDERER));
  testing.expectEqual("WebGL 1.0 (OpenGL ES 2.0 Chromium)", ctx.getParameter(ctx.VERSION));
  testing.expectEqual(
    "WebGL GLSL ES 1.0 (OpenGL ES GLSL ES 1.0 Chromium)",
    ctx.getParameter(ctx.SHADING_LANGUAGE_VERSION),
  );

  // Numeric limits.
  testing.expectEqual(8192, ctx.getParameter(ctx.MAX_TEXTURE_SIZE));
  testing.expectEqual(16, ctx.getParameter(ctx.MAX_VERTEX_ATTRIBS));
  testing.expectEqual(4, ctx.getParameter(ctx.SAMPLES));
  testing.expectEqual(24, ctx.getParameter(ctx.DEPTH_BITS));

  // Booleans.
  testing.expectEqual(true, ctx.getParameter(ctx.DITHER));
  testing.expectEqual(false, ctx.getParameter(ctx.BLEND));
  testing.expectEqual(true, ctx.getParameter(ctx.DEPTH_WRITEMASK));

  // Typed arrays.
  const range = ctx.getParameter(ctx.ALIASED_POINT_SIZE_RANGE);
  testing.expectEqual(true, range instanceof Float32Array);
  testing.expectEqual(2, range.length);
  testing.expectEqual(1, range[0]);
  testing.expectEqual(1023, range[1]);

  const dims = ctx.getParameter(ctx.MAX_VIEWPORT_DIMS);
  testing.expectEqual(true, dims instanceof Int32Array);
  testing.expectEqual(8192, dims[0]);

  // The viewport defaults to the whole drawing buffer.
  const viewport = ctx.getParameter(ctx.VIEWPORT);
  testing.expectEqual(0, viewport[0]);
  testing.expectEqual(0, viewport[1]);
  testing.expectEqual(240, viewport[2]);
  testing.expectEqual(60, viewport[3]);

  const formats = ctx.getParameter(ctx.COMPRESSED_TEXTURE_FORMATS);
  testing.expectEqual(true, formats instanceof Uint32Array);
  testing.expectEqual(0, formats.length);

  const writemask = ctx.getParameter(ctx.COLOR_WRITEMASK);
  testing.expectEqual(true, Array.isArray(writemask));
  testing.expectEqual(4, writemask.length);
  testing.expectEqual(true, writemask[0]);

  // Enums that aren't gettable state answer null, as they do in Chrome.
  testing.expectEqual(null, ctx.getParameter(ctx.TRIANGLES));
  testing.expectEqual(null, ctx.getParameter(ctx.RGBA));
}
</script>

<script id=WebGLRenderingContext#constants>
{
  const ctx = document.createElement("canvas").getContext("webgl");

  // Web IDL puts constants on both the interface object and the prototype.
  testing.expectEqual(0x0DE1, WebGLRenderingContext.TEXTURE_2D);
  testing.expectEqual(0x0DE1, WebGLRenderingContext.prototype.TEXTURE_2D);
  testing.expectEqual(0x0DE1, ctx.TEXTURE_2D);
  testing.expectEqual(0x8B31, ctx.VERTEX_SHADER);
  testing.expectEqual(0x8B30, ctx.FRAGMENT_SHADER);
  testing.expectEqual(0x1F00, ctx.VENDOR);

  // They are readonly and own properties of the prototype, not the instance.
  testing.expectEqual(false, Object.prototype.hasOwnProperty.call(ctx, "TEXTURE_2D"));
  const d = Object.getOwnPropertyDescriptor(WebGLRenderingContext.prototype, "TEXTURE_2D");
  testing.expectEqual(false, d.writable);
}
</script>

<script id=WebGLRenderingContext#drawingBuffer>
{
  const element = document.createElement("canvas");
  element.width = 240;
  element.height = 60;
  const ctx = element.getContext("webgl");

  testing.expectTrue(ctx.canvas === element);
  testing.expectEqual(240, ctx.drawingBufferWidth);
  testing.expectEqual(60, ctx.drawingBufferHeight);
  testing.expectEqual("srgb", ctx.drawingBufferColorSpace);
  testing.expectEqual("srgb", ctx.unpackColorSpace);
  testing.expectEqual(0x8058, ctx.drawingBufferFormat);
}
</script>

<script id=WebGLRenderingContext#objects>
{
  const gl = document.createElement("canvas").getContext("webgl");

  // create* hands back a distinct, correctly tagged object every call.
  const a = gl.createBuffer();
  const b = gl.createBuffer();
  testing.expectEqual(false, a === b);
  testing.expectEqual("[object WebGLBuffer]", Object.prototype.toString.call(a));
  testing.expectEqual(true, a instanceof WebGLBuffer);
  testing.expectEqual("[object WebGLTexture]", Object.prototype.toString.call(gl.createTexture()));
  testing.expectEqual("[object WebGLProgram]", Object.prototype.toString.call(gl.createProgram()));
  testing.expectEqual("[object WebGLShader]", Object.prototype.toString.call(gl.createShader(gl.VERTEX_SHADER)));
  testing.expectEqual("[object WebGLFramebuffer]", Object.prototype.toString.call(gl.createFramebuffer()));
  testing.expectEqual("[object WebGLRenderbuffer]", Object.prototype.toString.call(gl.createRenderbuffer()));

  testing.expectEqual(true, gl.isBuffer(a));
  testing.expectEqual(false, gl.isBuffer(null));
  testing.expectEqual(true, gl.isTexture(gl.createTexture()));
  testing.expectEqual(false, gl.isContextLost());
  testing.expectEqual(0, gl.getError());
  testing.expectEqual(36053, gl.checkFramebufferStatus(gl.FRAMEBUFFER));

  // DITHER is the one capability on by default.
  testing.expectEqual(true, gl.isEnabled(gl.DITHER));
  testing.expectEqual(false, gl.isEnabled(gl.BLEND));
}
</script>

<script id=WebGLRenderingContext#queries>
{
  const gl = document.createElement("canvas").getContext("webgl");
  const program = gl.createProgram();
  const shader = gl.createShader(gl.VERTEX_SHADER);

  testing.expectEqual("", gl.getProgramInfoLog(program));
  testing.expectEqual("", gl.getShaderInfoLog(shader));
  testing.expectEqual("", gl.getShaderSource(shader));
  testing.expectEqual(false, gl.getProgramParameter(program, gl.LINK_STATUS));
  testing.expectEqual(0, gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS));
  testing.expectEqual(false, gl.getShaderParameter(shader, gl.COMPILE_STATUS));
  testing.expectEqual(35633, gl.getShaderParameter(shader, gl.SHADER_TYPE));
  testing.expectEqual(-1, gl.getAttribLocation(program, "aPos"));
  testing.expectEqual(null, gl.getUniformLocation(program, "uColor"));
  testing.expectEqual(0, gl.getAttachedShaders(program).length);
  testing.expectEqual(null, gl.getActiveAttrib(program, 0));

  // Default sampler and buffer state.
  testing.expectEqual(9729, gl.getTexParameter(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER));
  testing.expectEqual(9986, gl.getTexParameter(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER));
  testing.expectEqual(10497, gl.getTexParameter(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S));
  testing.expectEqual(0, gl.getBufferParameter(gl.ARRAY_BUFFER, gl.BUFFER_SIZE));
  testing.expectEqual(35044, gl.getBufferParameter(gl.ARRAY_BUFFER, gl.BUFFER_USAGE));
  testing.expectEqual(32854, gl.getRenderbufferParameter(gl.RENDERBUFFER, gl.RENDERBUFFER_INTERNAL_FORMAT));

  // Default generic vertex attribute.
  testing.expectEqual(4, gl.getVertexAttrib(0, gl.VERTEX_ATTRIB_ARRAY_SIZE));
  testing.expectEqual(5126, gl.getVertexAttrib(0, gl.VERTEX_ATTRIB_ARRAY_TYPE));
  testing.expectEqual(false, gl.getVertexAttrib(0, gl.VERTEX_ATTRIB_ARRAY_ENABLED));
  const current = gl.getVertexAttrib(0, gl.CURRENT_VERTEX_ATTRIB);
  testing.expectEqual(true, current instanceof Float32Array);
  testing.expectEqual(1, current[3]);
  testing.expectEqual(0, gl.getVertexAttribOffset(0, gl.VERTEX_ATTRIB_ARRAY_POINTER));

  const high = gl.getShaderPrecisionFormat(gl.VERTEX_SHADER, gl.HIGH_FLOAT);
  testing.expectEqual("[object WebGLShaderPrecisionFormat]", Object.prototype.toString.call(high));
  testing.expectEqual(127, high.rangeMin);
  testing.expectEqual(127, high.rangeMax);
  testing.expectEqual(23, high.precision);
  const int = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.MEDIUM_INT);
  testing.expectEqual(31, int.rangeMin);
  testing.expectEqual(30, int.rangeMax);
  testing.expectEqual(0, int.precision);

  const attrs = gl.getContextAttributes();
  testing.expectEqual(true, attrs.alpha);
  testing.expectEqual(true, attrs.antialias);
  testing.expectEqual("default", attrs.powerPreference);
  testing.expectEqual(false, attrs.xrCompatible);
}
</script>

<script id=WebGLRenderingContext#doesNotThrow>
{
  // The whole point of the stub: a consumer that feature-detects WebGL and then
  // drives it must not hit "is not a function" or an exception anywhere.
  const gl = document.createElement("canvas").getContext("webgl");

  const program = gl.createProgram();
  const vs = gl.createShader(gl.VERTEX_SHADER);
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(vs, "void main() { gl_Position = vec4(0.0); }");
  gl.compileShader(vs);
  gl.shaderSource(fs, "void main() { gl_FragColor = vec4(1.0); }");
  gl.compileShader(fs);
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  gl.useProgram(program);

  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, document.createElement("canvas"));

  gl.viewport(0, 0, 300, 150);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.finish();
  gl.flush();

  // readPixels leaves the destination alone, as Chrome does for a context that
  // has never been drawn into.
  const pixels = new Uint8Array(4);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  testing.expectEqual(0, pixels[0]);
  testing.expectEqual(0, pixels[3]);

  gl.deleteBuffer(buffer);
  gl.deleteTexture(texture);
  gl.deleteShader(vs);
  gl.deleteProgram(program);

  // Chrome's arity, which a script can read off Function.prototype.length.
  testing.expectEqual(2, gl.blendFunc.length);
  testing.expectEqual(4, gl.clearColor.length);
  testing.expectEqual(6, gl.vertexAttribPointer.length);
  testing.expectEqual(1, gl.clear.length);
}
</script>
