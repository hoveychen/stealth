<script id="CanvasRenderingContext2D#stubbed queries">
{
  const ctx = document.createElement('canvas').getContext('2d');

  testing.expectEqual(false, ctx.isContextLost());
  testing.expectEqual(false, ctx.isPointInPath(0, 0));
  testing.expectEqual(false, ctx.isPointInStroke(0, 0));

  const attributes = ctx.getContextAttributes();
  testing.expectEqual(true, attributes.alpha);
  testing.expectEqual('srgb', attributes.colorSpace);
  testing.expectEqual('unorm8', attributes.colorType);
  testing.expectEqual(false, attributes.desynchronized);
  testing.expectEqual(false, attributes.willReadFrequently);
  testing.expectEqual('standard', attributes.toneMapping.mode);

  testing.expectEqual([], ctx.getLineDash());
  ctx.setLineDash([1, 2]);
  testing.expectEqual([1, 2], ctx.getLineDash());
  // An odd-length list is repeated, and an invalid one is dropped whole.
  ctx.setLineDash([3, 4, 5]);
  testing.expectEqual([3, 4, 5, 3, 4, 5], ctx.getLineDash());
  ctx.setLineDash([1, -1]);
  testing.expectEqual([3, 4, 5, 3, 4, 5], ctx.getLineDash());

  testing.expectEqual('DOMMatrix', ctx.getTransform().constructor.name);
  testing.expectEqual(1, ctx.getTransform().a);
  testing.expectEqual(0, ctx.getTransform().b);

  // Gradients and patterns are handles that carry no paint, but they exist.
  const gradient = ctx.createLinearGradient(0, 0, 1, 1);
  testing.expectEqual(true, gradient instanceof CanvasGradient);
  testing.expectEqual(undefined, gradient.addColorStop(0.5, 'red'));
  // The wording is Chrome's; the CanvasGradient#addColorStop block above has
  // the rest of the sentences and the order the checks run in.
  testing.expectError(
    "IndexSizeError: Failed to execute 'addColorStop' on 'CanvasGradient': " +
    'The provided value (2) is outside the range (0.0, 1.0).',
    () => gradient.addColorStop(2, 'red'));
  testing.expectEqual(true, ctx.createRadialGradient(0, 0, 0, 1, 1, 1) instanceof CanvasGradient);
  testing.expectEqual(true, ctx.createConicGradient(0, 0, 0) instanceof CanvasGradient);
  testing.expectEqual(true, ctx.createPattern(document.createElement('canvas'), 'repeat') instanceof CanvasPattern);

  // reset() drops both the bitmap and the drawing state.
  const canvas = document.createElement('canvas');
  canvas.width = 2;
  canvas.height = 2;
  const drawn = canvas.getContext('2d');
  drawn.fillStyle = 'red';
  drawn.font = '30px monospace';
  drawn.fillRect(0, 0, 2, 2);
  drawn.reset();
  testing.expectEqual('#000000', drawn.fillStyle);
  testing.expectEqual('10px sans-serif', drawn.font);
  testing.expectEqual([0, 0, 0, 0], Array.from(drawn.getImageData(0, 0, 1, 1).data));
}
</script>

<script id="CanvasRenderingContext2D#fill">
{
  const canvas = document.createElement('canvas');
  canvas.width = 16;
  canvas.height = 16;
  const ctx = canvas.getContext('2d');
  const at = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data);

  // A closed path that is filled is ink, not silence.
  ctx.fillStyle = '#ff0000';
  ctx.beginPath();
  ctx.moveTo(2, 2);
  ctx.lineTo(10, 2);
  ctx.lineTo(10, 10);
  ctx.lineTo(2, 10);
  ctx.closePath();
  ctx.fill();
  testing.expectEqual([255, 0, 0, 255], at(6, 6));
  // Outside the path stays transparent.
  testing.expectEqual([0, 0, 0, 0], at(14, 14));

  // arc() encloses its disc, and fill() paints it.
  ctx.reset();
  ctx.fillStyle = '#0000ff';
  ctx.beginPath();
  ctx.arc(8, 8, 5, 0, Math.PI * 2);
  ctx.fill();
  testing.expectEqual([0, 0, 255, 255], at(8, 8));
  // A corner is more than five away from the centre.
  testing.expectEqual([0, 0, 0, 0], at(0, 0));
}
</script>

<script id="CanvasRenderingContext2D#fill evenodd">
{
  const canvas = document.createElement('canvas');
  canvas.width = 16;
  canvas.height = 16;
  const ctx = canvas.getContext('2d');
  const at = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data);

  // Two concentric circles wound the same way: the even-odd rule reads the
  // inner one as a hole, the default non-zero rule does not. This is the
  // shape the Turnstile widget draws (README, "The eighteen pixel readbacks").
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(8, 8, 7, 0, Math.PI * 2);
  ctx.arc(8, 8, 3, 0, Math.PI * 2);
  ctx.fill('evenodd');
  testing.expectEqual([0, 0, 0, 0], at(8, 8));
  testing.expectEqual([255, 255, 255, 255], at(8, 3));

  // The same path under the non-zero rule has no hole.
  ctx.reset();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(8, 8, 7, 0, Math.PI * 2);
  ctx.arc(8, 8, 3, 0, Math.PI * 2);
  ctx.fill();
  testing.expectEqual([255, 255, 255, 255], at(8, 8));
}
</script>

<script id="CanvasRenderingContext2D#stroke">
{
  const canvas = document.createElement('canvas');
  canvas.width = 16;
  canvas.height = 16;
  const ctx = canvas.getContext('2d');
  const at = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data);

  // A two-wide horizontal line centred on y=4 covers rows 3 and 4.
  ctx.strokeStyle = '#00ff00';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 4);
  ctx.lineTo(16, 4);
  ctx.stroke();
  testing.expectEqual([0, 255, 0, 255], at(8, 3));
  testing.expectEqual([0, 255, 0, 255], at(8, 4));
  testing.expectEqual([0, 0, 0, 0], at(8, 6));
}
</script>

<script id="CanvasRenderingContext2D#transform">
{
  const canvas = document.createElement('canvas');
  canvas.width = 16;
  canvas.height = 16;
  const ctx = canvas.getContext('2d');
  const at = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data);

  // The transform is reported, not assumed.
  ctx.scale(2, 2);
  testing.expectEqual(2, ctx.getTransform().a);
  testing.expectEqual(2, ctx.getTransform().d);
  ctx.translate(1, 1);
  testing.expectEqual(2, ctx.getTransform().e);
  testing.expectEqual(2, ctx.getTransform().f);

  // And it is applied: a 1x1 fill at the origin lands on four device pixels
  // starting at (2, 2).
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(0, 0, 1, 1);
  testing.expectEqual([255, 0, 0, 255], at(2, 2));
  testing.expectEqual([255, 0, 0, 255], at(3, 3));
  testing.expectEqual([0, 0, 0, 0], at(4, 4));

  // save()/restore() carry the transform with them.
  ctx.resetTransform();
  testing.expectEqual(1, ctx.getTransform().a);
  testing.expectEqual(0, ctx.getTransform().e);
  ctx.save();
  ctx.scale(3, 3);
  testing.expectEqual(3, ctx.getTransform().a);
  ctx.restore();
  testing.expectEqual(1, ctx.getTransform().a);
}
</script>

<script id="CanvasRenderingContext2D#resize resets the context">
{
  // Assigning to width or height resets the whole context, not just the
  // bitmap: transform, paint, path and the save() stack all go. Measured
  // against Chrome 151, including that assigning the value it already has
  // still counts as an assignment.
  const canvas = document.createElement('canvas');
  canvas.width = 8;
  canvas.height = 8;
  const ctx = canvas.getContext('2d');

  ctx.scale(2, 2);
  ctx.fillStyle = '#ff0000';
  ctx.lineWidth = 7;
  ctx.font = '30px monospace';
  ctx.globalAlpha = 0.5;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(4, 4);
  ctx.save();

  canvas.width = 8;

  testing.expectEqual(1, ctx.getTransform().a);
  testing.expectEqual('#000000', ctx.fillStyle);
  testing.expectEqual(1, ctx.lineWidth);
  testing.expectEqual('10px sans-serif', ctx.font);
  testing.expectEqual(1, ctx.globalAlpha);

  // The path went with it, so stroking now lands no ink at all.
  ctx.strokeStyle = '#00ff00';
  ctx.lineWidth = 2;
  ctx.stroke();
  const data = ctx.getImageData(0, 0, 8, 8).data;
  let ink = 0;
  for (let i = 3; i < data.length; i += 4) if (data[i] !== 0) ink++;
  testing.expectEqual(0, ink);

  // And so did the save() stack: this restore has nothing to pop.
  ctx.scale(5, 5);
  ctx.restore();
  testing.expectEqual(5, ctx.getTransform().a);
}
</script>

<script id="CanvasRenderingContext2D#arc counterclockwise">
{
  // How a counterclockwise sweep normalises, measured against Chrome 151 on a
  // 64x64 canvas with r=25 (ink pixels in brackets):
  //
  //   arc(0, 2pi)          2032   arc(0, 2pi, true)          2032   a full turn
  //   arc(0, 2pi + pi/2)   2032   arc(0, 2pi + pi/2, true)   1843
  //   arc(0, -pi)          1012   arc(0, -pi, true)          1012
  //   arc(0, -3pi)         1012   arc(0, 3pi, true)          1012
  //   arc(0, pi/2)          206   arc(0, pi/2, true)         1843
  //
  // So a counterclockwise turn of exactly 2pi is a whole circle rather than
  // nothing, and anything past one turn wraps rather than clamping. This is
  // the call the Turnstile widget makes: every one of its arcs passes true.
  const canvas = document.createElement('canvas');
  canvas.width = 16;
  canvas.height = 16;
  const ctx = canvas.getContext('2d');
  const at = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data);

  ctx.fillStyle = '#ff0000';
  ctx.beginPath();
  ctx.arc(8, 8, 5, 0, Math.PI * 2, true);
  ctx.fill();
  testing.expectEqual([255, 0, 0, 255], at(8, 8));

  // A counterclockwise quarter is the long way round, so it covers the left
  // of the disc that the clockwise quarter does not.
  ctx.reset();
  ctx.fillStyle = '#ff0000';
  ctx.beginPath();
  ctx.arc(8, 8, 5, 0, Math.PI / 2, true);
  ctx.fill();
  testing.expectEqual([255, 0, 0, 255], at(5, 8));

  ctx.reset();
  ctx.fillStyle = '#ff0000';
  ctx.beginPath();
  ctx.arc(8, 8, 5, 0, Math.PI / 2, false);
  ctx.fill();
  testing.expectEqual([0, 0, 0, 0], at(5, 8));
}
</script>

<script id="CanvasRenderingContext2D#drawImage">
{
  const src = document.createElement('canvas');
  src.width = 4;
  src.height = 4;
  const sctx = src.getContext('2d');
  sctx.fillStyle = '#0000ff';
  sctx.fillRect(0, 0, 2, 2);

  const dst = document.createElement('canvas');
  dst.width = 8;
  dst.height = 8;
  const ctx = dst.getContext('2d');
  const at = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data);

  // Placed under the current transform, like every other drawing call.
  ctx.translate(4, 4);
  ctx.drawImage(src, 0, 0);
  testing.expectEqual([0, 0, 255, 255], at(5, 5));
  testing.expectEqual([0, 0, 0, 0], at(1, 1));
  // Only the source's own opaque quarter came across.
  testing.expectEqual([0, 0, 0, 0], at(7, 7));
}
</script>

<script id="CanvasRenderingContext2D#creation_attributes">
{
  // getContext's second argument. Every reading below is Chrome's, from
  // probes/canvas-context-settings{,-2,-3,-4}.js -- the Turnstile widget passes
  // `{colorSpace, colorType, willReadFrequently: true}` to all four of the 2D
  // contexts it builds, and we used to answer the same default context for
  // every one of them.
  const attrs = (settings) => {
    const c = document.createElement('canvas');
    const ctx = settings === undefined ? c.getContext('2d') : c.getContext('2d', settings);
    return ctx.getContextAttributes();
  };
  const threw = (f) => { try { f(); return null; } catch (e) { return `${e.name}: ${e.message}`; } };

  // The widget's own dictionary, which is the whole point of this test.
  const widget = attrs({ colorSpace: 'display-p3', colorType: 'float16', willReadFrequently: true });
  testing.expectEqual('display-p3', widget.colorSpace);
  testing.expectEqual('float16', widget.colorType);
  testing.expectEqual(true, widget.willReadFrequently);
  testing.expectEqual(true, widget.alpha);
  testing.expectEqual(false, widget.desynchronized);

  // Each member on its own.
  testing.expectEqual(false, attrs({ alpha: false }).alpha);
  testing.expectEqual(true, attrs({ desynchronized: true }).desynchronized);
  testing.expectEqual('display-p3', attrs({ colorSpace: 'display-p3' }).colorSpace);
  testing.expectEqual('float16', attrs({ colorType: 'float16' }).colorType);

  // `alpha` and `desynchronized` are plain WebIDL booleans, so ToBoolean: a
  // truthy string is true and 0 is false.
  testing.expectEqual(false, attrs({ alpha: 0 }).alpha);
  testing.expectEqual(true, attrs({ alpha: 'false' }).alpha);

  // `willReadFrequently` is not a boolean at all but an enum whose members are
  // "true", "false" and "undefined" -- the JS boolean only works because it
  // stringifies onto one. 1 and "auto" are refused.
  testing.expectEqual(true, attrs({ willReadFrequently: 'true' }).willReadFrequently);
  testing.expectEqual(false, attrs({ willReadFrequently: 'false' }).willReadFrequently);
  testing.expectEqual(false, attrs({ willReadFrequently: 'undefined' }).willReadFrequently);
  testing.expectEqual(false, attrs({ willReadFrequently: false }).willReadFrequently);
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': Failed to read the " +
      "'willReadFrequently' property from 'CanvasContextCreationAttributesModule': The provided " +
      "value 'auto' is not a valid enum value of type CanvasWillReadFrequently.",
    threw(() => attrs({ willReadFrequently: 'auto' })));
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': Failed to read the " +
      "'willReadFrequently' property from 'CanvasContextCreationAttributesModule': The provided " +
      "value '1' is not a valid enum value of type CanvasWillReadFrequently.",
    threw(() => attrs({ willReadFrequently: 1 })));

  // A non-object second argument is not a dictionary-conversion failure here:
  // it takes the defaults, where WebIDL's own rule would have been a TypeError.
  for (const bad of [null, undefined, 'srgb', 42, true, false, []]) {
    const a = attrs(bad);
    testing.expectEqual('srgb', a.colorSpace);
    testing.expectEqual(false, a.willReadFrequently);
  }
  testing.expectEqual('srgb', attrs({ nonesuch: 1 }).colorSpace);

  // `toneMapping` is answered but never read: asking for another mode changes
  // nothing.
  testing.expectEqual('standard', attrs({ toneMapping: { mode: 'extended' } }).toneMapping.mode);

  // colorSpace has two gates. PredefinedColorSpace has six members, so a name
  // outside it fails the dictionary conversion and names the property...
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': Failed to read the " +
      "'colorSpace' property from 'CanvasContextCreationAttributesModule': The provided value " +
      "'nonesuch' is not a valid enum value of type PredefinedColorSpace.",
    threw(() => attrs({ colorSpace: 'nonesuch' })));
  // ...while one inside it that a canvas cannot be is refused afterwards, by a
  // message with no property in it and "the type" rather than "type".
  // `display-p3-linear` belongs in this list and in no other colour API here,
  // so leaving it out gives it the wrong one of the two refusals.
  for (const inEnum of ['rec2020', 'srgb-linear', 'display-p3-linear',
                        'rec2100-hlg', 'rec2100-pq']) {
    testing.expectEqual(
      "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': The provided value '" +
        inEnum + "' is not a valid enum value of the type PredefinedColorSpace.",
      threw(() => attrs({ colorSpace: inEnum })));
  }
  // Case matters, and so does a non-string: both are stringified into the
  // dictionary message.
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': Failed to read the " +
      "'colorSpace' property from 'CanvasContextCreationAttributesModule': The provided value " +
      "'DISPLAY-P3' is not a valid enum value of type PredefinedColorSpace.",
    threw(() => attrs({ colorSpace: 'DISPLAY-P3' })));
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': Failed to read the " +
      "'colorSpace' property from 'CanvasContextCreationAttributesModule': The provided value " +
      "'null' is not a valid enum value of type PredefinedColorSpace.",
    threw(() => attrs({ colorSpace: null })));
  // An explicitly undefined member is an absent one, and takes the default.
  testing.expectEqual('srgb', attrs({ colorSpace: undefined }).colorSpace);

  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': Failed to read the " +
      "'colorType' property from 'CanvasContextCreationAttributesModule': The provided value " +
      "'float32' is not a valid enum value of type CanvasPixelFormat.",
    threw(() => attrs({ colorType: 'float32' })));

  // Members are read in alphabetical order, so a throwing `alpha` getter beats
  // a bad `colorSpace` and a throwing `xrCompatible` one does not.
  testing.expectEqual('TypeError: boom', threw(() => attrs({
    get alpha() { throw new TypeError('boom'); },
    colorSpace: 'bad',
  })));
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': Failed to read the " +
      "'colorSpace' property from 'CanvasContextCreationAttributesModule': The provided value " +
      "'bad' is not a valid enum value of type PredefinedColorSpace.",
    threw(() => attrs({
      get xrCompatible() { throw new TypeError('boom'); },
      colorSpace: 'bad',
    })));

  // A canvas answers its first context forever, and the later call's dictionary
  // is dropped rather than applied -- but it is still *converted*, so a bad
  // value in it throws even though the settings could not have been used.
  {
    const c = document.createElement('canvas');
    const first = c.getContext('2d', { colorSpace: 'display-p3', willReadFrequently: true });
    const second = c.getContext('2d', { colorSpace: 'srgb', willReadFrequently: false });
    testing.expectEqual(true, first === second);
    testing.expectEqual('display-p3', second.getContextAttributes().colorSpace);
    testing.expectEqual(true, second.getContextAttributes().willReadFrequently);
    // Resetting the bitmap keeps them too.
    c.width = 3;
    testing.expectEqual('display-p3', first.getContextAttributes().colorSpace);
    testing.expectEqual(true, first.getContextAttributes().willReadFrequently);
    testing.expectEqual(
      "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': Failed to read the " +
        "'colorSpace' property from 'CanvasContextCreationAttributesModule': The provided value " +
        "'nonesuch' is not a valid enum value of type PredefinedColorSpace.",
      threw(() => c.getContext('2d', { colorSpace: 'nonesuch' })));
  }

  // The conversion runs before the context type is dispatched, so an unknown
  // type with a bad dictionary throws rather than answering null -- and an
  // unknown type with a good one still answers null.
  testing.expectEqual(
    "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': Failed to read the " +
      "'colorSpace' property from 'CanvasContextCreationAttributesModule': The provided value " +
      "'bad' is not a valid enum value of type PredefinedColorSpace.",
    threw(() => document.createElement('canvas').getContext('nonesuch', { colorSpace: 'bad' })));
  testing.expectEqual(
    null, document.createElement('canvas').getContext('nonesuch', { colorSpace: 'srgb' }));

  // The key set and its order, which a script can read without touching a
  // single value.
  testing.expectEqual(
    'alpha,colorSpace,colorType,desynchronized,toneMapping,willReadFrequently',
    Object.keys(attrs(undefined)).join(','));
}
</script>

<script id="CanvasRenderingContext2D#image data settings">
{
  // The same ImageDataSettings machinery as on an OffscreenCanvas, differing
  // only in the interface its refusals name. Readings from
  // probes/canvas-image-data-settings-2.js.
  const threw = (f) => { try { f(); return null; } catch (e) { return `${e.name}: ${e.message}`; } };
  const hex = (d) => [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
  const painted = () => {
    const element = document.createElement('canvas');
    element.width = 1;
    element.height = 1;
    const ctx = element.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#ff0000';
    ctx.fillRect(0, 0, 1, 1);
    return ctx;
  };

  testing.expectEqual('ff0000ff', hex(painted().getImageData(0, 0, 1, 1).data));
  testing.expectEqual('ea3323ff',
    hex(painted().getImageData(0, 0, 1, 1, { colorSpace: 'display-p3' }).data));
  testing.expectEqual('display-p3',
    painted().getImageData(0, 0, 1, 1, { colorSpace: 'display-p3' }).colorSpace);

  const prefix = "Failed to execute 'getImageData' on 'CanvasRenderingContext2D': ";
  testing.expectEqual(
    'TypeError: ' + prefix + "Failed to read the 'colorSpace' property from 'ImageDataSettings': " +
      "The provided value 'nonesuch' is not a valid enum value of type PredefinedColorSpace.",
    threw(() => painted().getImageData(0, 0, 1, 1, { colorSpace: 'nonesuch' })));
  testing.expectEqual(
    'TypeError: ' + prefix +
      "The provided value 'display-p3-linear' is not a valid enum value of the type PredefinedColorSpace.",
    threw(() => painted().getImageData(0, 0, 1, 1, { colorSpace: 'display-p3-linear' })));
  testing.expectEqual('IndexSizeError: ' + prefix + 'The source width is 0.',
    threw(() => painted().getImageData(0, 0, 0, 1)));
  testing.expectEqual('IndexSizeError: ' + prefix + 'The source height is 0.',
    threw(() => painted().getImageData(0, 0, 1, 0)));

  testing.expectEqual(
    "TypeError: Failed to execute 'createImageData' on 'CanvasRenderingContext2D': Failed to " +
      "read the 'colorSpace' property from 'ImageDataSettings': The provided value 'nonesuch' " +
      'is not a valid enum value of type PredefinedColorSpace.',
    threw(() => painted().createImageData(1, 1, { colorSpace: 'nonesuch' })));
  testing.expectEqual('display-p3', painted().createImageData(1, 1, { colorSpace: 'display-p3' }).colorSpace);
}
</script>

<script id=fractional_rect_edges_are_antialiased>
{
  // A rectangle's fractional edge covers part of a pixel, and that part is its
  // alpha. Measured on headed Chrome 151 with
  // tools/fingerprint/probes/expr-aa-coverage-curve.js: land a fill's right
  // edge at 24 + f/16 for f = 0..15 and column 24 walks round(255 * f/16)
  // exactly. This engine used to @round the edge to a whole pixel, answering 0
  // for the first half of that sweep and 255 for the second -- eight pixels
  // wrong out of sixteen, on the common case of a fractional-coordinate rect.
  const sweep = [];
  for (let f = 0; f < 16; f++) {
    const ctx = new OffscreenCanvas(48, 48).getContext('2d');
    ctx.fillStyle = '#000000';
    ctx.fillRect(8, 8, 16 + f / 16, 16);
    sweep.push(ctx.getImageData(24, 12, 1, 1).data[3]);
  }
  testing.expectEqual('0,16,32,48,64,80,96,112,128,143,159,175,191,207,223,239', sweep.join(','));

  // Both axes, and the interior stays fully opaque: a 0.5-inset rect on all
  // four sides is a half-covered border and a solid middle.
  const ctx = new OffscreenCanvas(8, 8).getContext('2d');
  ctx.fillStyle = '#000000';
  ctx.fillRect(1.5, 1.5, 5, 5);
  const a = (x, y) => ctx.getImageData(x, y, 1, 1).data[3];
  testing.expectEqual('corner 64 edge 128 inside 255',
    'corner ' + a(1, 1) + ' edge ' + a(3, 1) + ' inside ' + a(3, 3));
  // Outside the rect on both sides of the covered band.
  testing.expectEqual('0,0', a(0, 3) + ',' + a(7, 3));

  // A rect narrower than one pixel is a partial cover, not nothing and not a
  // whole pixel -- the case @round collapsed to either extreme.
  const thin = new OffscreenCanvas(4, 4).getContext('2d');
  thin.fillStyle = '#000000';
  thin.fillRect(1.25, 0, 0.5, 4);
  testing.expectEqual(128, thin.getImageData(1, 1, 1, 1).data[3]);

  // Whole-pixel rectangles must not have moved: the old path answered these
  // correctly and every other canvas expectation depends on them.
  const whole = new OffscreenCanvas(4, 4).getContext('2d');
  whole.fillStyle = '#000000';
  whole.fillRect(1, 1, 2, 2);
  const row = Array.from(whole.getImageData(0, 1, 4, 1).data).filter((_, i) => i % 4 === 3);
  testing.expectEqual('0,255,255,0', row.join(','));

  // strokeRect is four fills, so it inherits the same coverage.
  const st = new OffscreenCanvas(8, 8).getContext('2d');
  st.strokeStyle = '#000000';
  st.lineWidth = 1;
  st.strokeRect(2, 2, 4, 4);
  // A width-1 stroke centred on x=2 spans 1.5..2.5, so two half-covered columns.
  testing.expectEqual('128,128', st.getImageData(1, 4, 1, 1).data[3] + ',' + st.getImageData(2, 4, 1, 1).data[3]);
}
</script>
