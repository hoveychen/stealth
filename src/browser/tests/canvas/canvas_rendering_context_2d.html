<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=CanvasRenderingContext2D>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");
  testing.expectEqual(true, ctx instanceof CanvasRenderingContext2D);
  // We can't really test this but let's try to call it at least.
  ctx.fillRect(0, 0, 0, 0);
}
</script>

<script id=CanvasRenderingContext2D#fillStyle>
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  // Black by default.
  testing.expectEqual(ctx.fillStyle, "#000000");
  ctx.fillStyle = "red";
  testing.expectEqual(ctx.fillStyle, "#ff0000");
  ctx.fillStyle = "rebeccapurple";
  testing.expectEqual(ctx.fillStyle, "#663399");
  // No changes made if color is invalid.
  ctx.fillStyle = "invalid-color";
  testing.expectEqual(ctx.fillStyle, "#663399");
  ctx.fillStyle = "#fc0";
  testing.expectEqual(ctx.fillStyle, "#ffcc00");
  ctx.fillStyle = "#ff0000";
  testing.expectEqual(ctx.fillStyle, "#ff0000");
  ctx.fillStyle = "#fF00000F";
  testing.expectEqual(ctx.fillStyle, "rgba(255, 0, 0, 0.06)");
}
</script>

<script id="CanvasRenderingContext2D#fillStyle(gradient)">
{
  // The attribute is `(DOMString or CanvasGradient or CanvasPattern)`, so a
  // gradient assigned to it reads back as the same object — not as the string
  // it would stringify to. Every expectation below is a Chrome 151 reading.
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  ctx.fillStyle = "#123456";
  const gradient = ctx.createLinearGradient(0, 0, 10, 10);
  ctx.fillStyle = gradient;
  testing.expectEqual("object", typeof ctx.fillStyle);
  testing.expectEqual(true, ctx.fillStyle === gradient);
  testing.expectEqual("[object CanvasGradient]", String(ctx.fillStyle));

  // A colour string after a gradient replaces it.
  ctx.fillStyle = "#ff0000";
  testing.expectEqual("#ff0000", ctx.fillStyle);

  const radial = ctx.createRadialGradient(0, 0, 1, 0, 0, 2);
  ctx.strokeStyle = radial;
  testing.expectEqual("object", typeof ctx.strokeStyle);
  testing.expectEqual(true, ctx.strokeStyle === radial);
  testing.expectEqual("[object CanvasGradient]", String(ctx.strokeStyle));

  // A pattern is the third arm of the same union.
  const pattern = ctx.createPattern(element, "repeat");
  ctx.fillStyle = pattern;
  testing.expectEqual(true, ctx.fillStyle === pattern);
  testing.expectEqual("[object CanvasPattern]", String(ctx.fillStyle));

  // Neither a string nor either object: the previous value survives, the same
  // way an unparseable colour does.
  ctx.fillStyle = {};
  testing.expectEqual(true, ctx.fillStyle === pattern);
  ctx.fillStyle = 42;
  testing.expectEqual(true, ctx.fillStyle === pattern);
  ctx.fillStyle = null;
  testing.expectEqual(true, ctx.fillStyle === pattern);

  // save()/restore() carries the object, not a stringification of it.
  ctx.fillStyle = gradient;
  ctx.save();
  ctx.fillStyle = "#00ff00";
  testing.expectEqual("#00ff00", ctx.fillStyle);
  ctx.restore();
  testing.expectEqual(true, ctx.fillStyle === gradient);

  // reset() drops back to the default colour.
  ctx.reset();
  testing.expectEqual("#000000", ctx.fillStyle);

  // A gradient is not bound to the context that made it, and two gradients
  // are distinct objects.
  const other = document.createElement("canvas").getContext("2d");
  other.fillStyle = gradient;
  testing.expectEqual(true, other.fillStyle === gradient);
  testing.expectEqual(true, gradient !== ctx.createLinearGradient(0, 0, 10, 10));
}
</script>

<script id="CanvasRenderingContext2D#getContextAttributes">
{
  // These used to be the defaults whatever the page asked for, so
  // `getContext('2d', {willReadFrequently: true})` reported false -- and asking
  // for that is how a page says it means to call getImageData. All Chrome 151
  // readings.
  const attrs = (settings) => document.createElement('canvas').getContext('2d', settings)
    .getContextAttributes();

  const fresh = attrs(undefined);
  testing.expectEqual(true, fresh.alpha);
  testing.expectEqual('srgb', fresh.colorSpace);
  testing.expectEqual('unorm8', fresh.colorType);
  testing.expectEqual(false, fresh.desynchronized);
  testing.expectEqual('standard', fresh.toneMapping.mode);
  testing.expectEqual(false, fresh.willReadFrequently);
  // An empty dictionary is the same as none.
  testing.expectEqual(false, attrs({}).willReadFrequently);

  testing.expectEqual(true, attrs({ willReadFrequently: true }).willReadFrequently);
  testing.expectEqual(false, attrs({ willReadFrequently: false }).willReadFrequently);
  testing.expectEqual(false, attrs({ alpha: false }).alpha);
  // `alpha` is a plain boolean, so it takes any value's truthiness.
  testing.expectEqual(false, attrs({ alpha: 0 }).alpha);
  testing.expectEqual(true, attrs({ desynchronized: true }).desynchronized);
  testing.expectEqual('display-p3', attrs({ colorSpace: 'display-p3' }).colorSpace);
  testing.expectEqual('float16', attrs({ colorType: 'float16' }).colorType);
  // An unknown member is ignored rather than refused.
  testing.expectEqual(true, attrs({ bogus: true, willReadFrequently: true }).willReadFrequently);
  // toneMapping is not read: Chrome answers 'standard' either way.
  testing.expectEqual('standard', attrs({ toneMapping: { mode: 'extended' } }).toneMapping.mode);

  const all = attrs({
    alpha: false,
    colorSpace: 'display-p3',
    colorType: 'float16',
    desynchronized: true,
    willReadFrequently: true,
  });
  testing.expectEqual('false,display-p3,float16,true,true',
    [all.alpha, all.colorSpace, all.colorType, all.desynchronized, all.willReadFrequently].join(','));

  // A settings argument that is not an object is ignored, not refused.
  testing.expectEqual(false, attrs('nonsense').willReadFrequently);
  testing.expectEqual(false, attrs(42).willReadFrequently);
  testing.expectEqual(false, attrs(null).willReadFrequently);

  // `willReadFrequently` is an enum of two *strings*, not a boolean, so a JS
  // boolean only gets there by stringifying -- which is why 1 and null are
  // refused while true is not.
  const P = "Failed to execute 'getContext' on 'HTMLCanvasElement': " +
    "Failed to read the 'willReadFrequently' property from " +
    "'CanvasContextCreationAttributesModule': The provided value ";
  const E = " is not a valid enum value of type CanvasWillReadFrequently.";
  testing.expectEqual(true, attrs({ willReadFrequently: 'true' }).willReadFrequently);
  testing.expectEqual(false, attrs({ willReadFrequently: 'false' }).willReadFrequently);
  testing.expectEqual(false, attrs({ willReadFrequently: undefined }).willReadFrequently);
  testing.expectError('TypeError: ' + P + "'1'" + E, () => attrs({ willReadFrequently: 1 }));
  testing.expectError('TypeError: ' + P + "'0'" + E, () => attrs({ willReadFrequently: 0 }));
  testing.expectError('TypeError: ' + P + "'no'" + E, () => attrs({ willReadFrequently: 'no' }));
  testing.expectError('TypeError: ' + P + "'True'" + E, () => attrs({ willReadFrequently: 'True' }));
  testing.expectError('TypeError: ' + P + "'null'" + E, () => attrs({ willReadFrequently: null }));
  testing.expectError('TypeError: ' + P + "''" + E, () => attrs({ willReadFrequently: '' }));
  // An array stringifies to the empty string; a plain object to [object Object].
  testing.expectError('TypeError: ' + P + "''" + E, () => attrs({ willReadFrequently: [] }));
  testing.expectError('TypeError: ' + P + "'[object Object]'" + E,
    () => attrs({ willReadFrequently: {} }));

  // The two colour enums, and the second sentence for a value that is in the
  // IDL enum but is not one canvas 2D takes -- it names no property and says
  // "of the type" rather than "of type".
  testing.expectError(
    "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': " +
    "Failed to read the 'colorSpace' property from " +
    "'CanvasContextCreationAttributesModule': The provided value 'bogus' " +
    'is not a valid enum value of type PredefinedColorSpace.',
    () => attrs({ colorSpace: 'bogus' }));
  testing.expectError(
    "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': " +
    "Failed to read the 'colorType' property from " +
    "'CanvasContextCreationAttributesModule': The provided value 'bogus' " +
    'is not a valid enum value of type CanvasPixelFormat.',
    () => attrs({ colorType: 'bogus' }));
  for (const inIdl of ['rec2020', 'srgb-linear', 'display-p3-linear', 'rec2100-hlg', 'rec2100-pq']) {
    testing.expectError(
      "TypeError: Failed to execute 'getContext' on 'HTMLCanvasElement': " +
      "The provided value '" + inIdl + "' is not a valid enum value of the " +
      'type PredefinedColorSpace.',
      () => attrs({ colorSpace: inIdl }));
  }
  // Case matters: 'SRGB' is not in the enum at all.
  testing.expectError('is not a valid enum value of type PredefinedColorSpace.',
    () => attrs({ colorSpace: 'SRGB' }));

  // The context is created once, so a second call hands back the same object
  // and keeps the settings the first call made it with.
  const el = document.createElement('canvas');
  const first = el.getContext('2d', { willReadFrequently: true });
  const second = el.getContext('2d', { willReadFrequently: false });
  testing.expectEqual(true, first === second);
  testing.expectEqual(true, second.getContextAttributes().willReadFrequently);
  // The settings are still *read* first, though, so asking again with a bad
  // enum member throws even though the value would have been ignored.
  testing.expectError('is not a valid enum value of type PredefinedColorSpace.',
    () => el.getContext('2d', { colorSpace: 'bogus' }));
  testing.expectError('is not a valid enum value of type CanvasWillReadFrequently.',
    () => el.getContext('2d', { willReadFrequently: 1 }));

  // Neither reset() nor a resize touches them.
  const kept = document.createElement('canvas');
  const ctx = kept.getContext('2d', { willReadFrequently: true, alpha: false });
  ctx.reset();
  testing.expectEqual(true, ctx.getContextAttributes().willReadFrequently);
  testing.expectEqual(false, ctx.getContextAttributes().alpha);
  kept.width = 40;
  testing.expectEqual(true, ctx.getContextAttributes().willReadFrequently);
  testing.expectEqual(false, ctx.getContextAttributes().alpha);
}
</script>

<script id="CanvasRenderingContext2D#gradient factory arguments">
{
  // All Chrome 151 wording. None of these refused before: every factory took
  // NaN, Infinity and a negative radius and handed back a gradient.
  const ctx = document.createElement("canvas").getContext("2d");
  const on = (op) => "Failed to execute '" + op +
    "' on 'CanvasRenderingContext2D': ";

  // A WebIDL `double` is restricted, so a non-finite coordinate is a TypeError
  // before the operation's own steps run.
  const linear = "TypeError: " + on('createLinearGradient') +
    "The provided double value is non-finite.";
  testing.expectError(linear, () => ctx.createLinearGradient(NaN, 0, 10, 10));
  testing.expectError(linear, () => ctx.createLinearGradient(0, 0, NaN, 0));
  testing.expectError(linear, () => ctx.createLinearGradient(0, 0, Infinity, 0));
  testing.expectError(linear, () => ctx.createLinearGradient(-Infinity, 0, 0, 0));
  // A string that will not convert, and an explicit `undefined`, both become NaN.
  testing.expectError(linear, () => ctx.createLinearGradient('abc', 0, 0, 0));
  testing.expectError(linear, () => ctx.createLinearGradient(undefined, 0, 0, 0));
  // `null` converts to 0, and a zero-length gradient is fine.
  testing.expectEqual('CanvasGradient', ctx.createLinearGradient(null, 0, 0, 0).constructor.name);
  testing.expectEqual('CanvasGradient', ctx.createLinearGradient(5, 5, 5, 5).constructor.name);

  const radial = "TypeError: " + on('createRadialGradient') +
    "The provided double value is non-finite.";
  testing.expectError(radial, () => ctx.createRadialGradient(0, 0, 0, 0, 0, Infinity));
  testing.expectError(radial, () => ctx.createRadialGradient(0, 0, NaN, 0, 0, 1));
  // Both radii must be non-negative, and r0 is checked first -- so two
  // negative radii name r0, not r1.
  testing.expectError(
    "IndexSizeError: " + on('createRadialGradient') + 'The r0 provided is less than 0.',
    () => ctx.createRadialGradient(0, 0, -1, 0, 0, 1));
  testing.expectError(
    "IndexSizeError: " + on('createRadialGradient') + 'The r1 provided is less than 0.',
    () => ctx.createRadialGradient(0, 0, 0, 0, 0, -1));
  testing.expectError(
    "IndexSizeError: " + on('createRadialGradient') + 'The r0 provided is less than 0.',
    () => ctx.createRadialGradient(0, 0, -2, 0, 0, -3));
  testing.expectError(
    "IndexSizeError: " + on('createRadialGradient') + 'The r0 provided is less than 0.',
    () => ctx.createRadialGradient(0, 0, -0.5, 0, 0, 1));
  // The conversion wins over the radius: a non-finite coordinate is refused
  // even when a radius is also negative.
  testing.expectError(radial, () => ctx.createRadialGradient(NaN, 0, -1, 0, 0, 1));
  // Negative zero is not negative, and two zero radii are allowed.
  testing.expectEqual('CanvasGradient',
    ctx.createRadialGradient(0, 0, -0, 0, 0, 1).constructor.name);
  testing.expectEqual('CanvasGradient',
    ctx.createRadialGradient(0, 0, 0, 0, 0, 0).constructor.name);

  const conic = "TypeError: " + on('createConicGradient') +
    "The provided double value is non-finite.";
  testing.expectError(conic, () => ctx.createConicGradient(NaN, 0, 0));
  testing.expectError(conic, () => ctx.createConicGradient(0, Infinity, 0));
  // The angle is neither wrapped nor bounded.
  testing.expectEqual('CanvasGradient', ctx.createConicGradient(1e6, 0, 0).constructor.name);

  // createPattern's repetition is one of four keywords; null, undefined and the
  // empty string all mean 'repeat'.
  const image = document.createElement('canvas');
  testing.expectError(
    "SyntaxError: " + on('createPattern') +
    "The provided type ('bogus') is not one of 'repeat', 'no-repeat', " +
    "'repeat-x', or 'repeat-y'.",
    () => ctx.createPattern(image, 'bogus'));
  for (const repetition of ['repeat', 'no-repeat', 'repeat-x', 'repeat-y', '', null, undefined]) {
    testing.expectEqual('CanvasPattern', ctx.createPattern(image, repetition).constructor.name);
  }

  // The image is an eight-member IDL union, converted before the operation
  // runs, so anything that is none of the eight is refused -- a plain object
  // just as much as a primitive.
  const notAnImage = "TypeError: " + on('createPattern') +
    "The provided value is not of type '(CSSImageValue or HTMLCanvasElement " +
    "or HTMLImageElement or HTMLVideoElement or ImageBitmap or OffscreenCanvas " +
    "or SVGImageElement or VideoFrame)'.";
  for (const bad of [null, undefined, 42, 'x', {}]) {
    testing.expectError(notAnImage, () => ctx.createPattern(bad, 'repeat'));
  }
  // Four of the eight we can build here. An `<img>` is a valid argument even
  // though it has no pixels behind it yet.
  testing.expectEqual('CanvasPattern',
    ctx.createPattern(document.createElement('img'), 'repeat').constructor.name);
  testing.expectEqual('CanvasPattern',
    ctx.createPattern(document.createElement('video'), 'repeat').constructor.name);
  testing.expectEqual('CanvasPattern',
    ctx.createPattern(new OffscreenCanvas(2, 2), 'repeat').constructor.name);
  testing.expectEqual('CanvasPattern',
    ctx.createPattern(document.createElementNS('http://www.w3.org/2000/svg', 'image'), 'repeat')
      .constructor.name);

  // Arity is unchanged by any of the above.
  testing.expectEqual(4, ctx.createLinearGradient.length);
  testing.expectEqual(6, ctx.createRadialGradient.length);
  testing.expectEqual(3, ctx.createConicGradient.length);
  testing.expectEqual(2, ctx.createPattern.length);
}
</script>

<script id="CanvasGradient#addColorStop">
{
  // Chrome 151 wording throughout. Before this only the range was checked, and
  // it answered an IndexSizeError with the generic DOMException sentence for a
  // non-finite offset too -- where Chrome raises a TypeError.
  const ctx = document.createElement("canvas").getContext("2d");
  const grad = () => ctx.createLinearGradient(0, 0, 10, 10);
  const P = "Failed to execute 'addColorStop' on 'CanvasGradient': ";

  // The WebIDL `double` conversion runs first, so a non-finite offset is a
  // TypeError even when the colour is also unparseable.
  const nonFinite = "TypeError: " + P + "The provided double value is non-finite.";
  testing.expectError(nonFinite, () => grad().addColorStop(NaN, "#fff"));
  testing.expectError(nonFinite, () => grad().addColorStop(Infinity, "#fff"));
  testing.expectError(nonFinite, () => grad().addColorStop(-Infinity, "#fff"));
  testing.expectError(nonFinite, () => grad().addColorStop(NaN, "notacolour"));
  // An unconvertible string and an explicit `undefined` both become NaN.
  testing.expectError(nonFinite, () => grad().addColorStop("abc", "#fff"));
  testing.expectError(nonFinite, () => grad().addColorStop(undefined, "#fff"));

  // Then the range, which also beats the colour check.
  testing.expectError(
    "IndexSizeError: " + P + "The provided value (2) is outside the range (0.0, 1.0).",
    () => grad().addColorStop(2, "#fff"));
  testing.expectError(
    "IndexSizeError: " + P + "The provided value (-1) is outside the range (0.0, 1.0).",
    () => grad().addColorStop(-1, "#fff"));
  testing.expectError(
    "IndexSizeError: " + P + "The provided value (1.5) is outside the range (0.0, 1.0).",
    () => grad().addColorStop(1.5, "#fff"));
  testing.expectError(
    "IndexSizeError: " + P + "The provided value (2) is outside the range (0.0, 1.0).",
    () => grad().addColorStop(2, "notacolour"));
  // Six significant digits, and the exponential form past 999999.
  testing.expectError(
    "IndexSizeError: " + P + "The provided value (1) is outside the range (0.0, 1.0).",
    () => grad().addColorStop(1.0000001, "#fff"));
  testing.expectError(
    "IndexSizeError: " + P + "The provided value (1.00000e+6) is outside the range (0.0, 1.0).",
    () => grad().addColorStop(1000000, "#fff"));
  testing.expectError(
    "IndexSizeError: " + P + "The provided value (-1.00000e-7) is outside the range (0.0, 1.0).",
    () => grad().addColorStop(-1e-7, "#fff"));

  // Then the colour. A non-string arrives as whatever it stringifies to.
  testing.expectError(
    "SyntaxError: " + P + "The value provided ('notacolour') could not be parsed as a color.",
    () => grad().addColorStop(0, "notacolour"));
  testing.expectError(
    "SyntaxError: " + P + "The value provided ('') could not be parsed as a color.",
    () => grad().addColorStop(0, ""));
  testing.expectError(
    "SyntaxError: " + P + "The value provided ('42') could not be parsed as a color.",
    () => grad().addColorStop(0, 42));
  testing.expectError(
    "SyntaxError: " + P + "The value provided ('null') could not be parsed as a color.",
    () => grad().addColorStop(0, null));
  testing.expectError(
    "SyntaxError: " + P + "The value provided ('inherit') could not be parsed as a color.",
    () => grad().addColorStop(0, "inherit"));
  testing.expectError(
    "SyntaxError: " + P + "The value provided ('rgb(1,2)') could not be parsed as a color.",
    () => grad().addColorStop(0, "rgb(1,2)"));

  // What must NOT throw. The colour notations here are the ones Chrome accepts;
  // several of them we cannot yet convert to a colour, and accepting them
  // without a colour is the point -- refusing a value every browser takes
  // would be a worse divergence than the silence this replaces.
  const accepted = [
    "#fff", "#ffffffff", "red", "RED", "  red  ", "rebeccapurple",
    "transparent", "currentColor", "rgb(1,2,3)", "rgb(1 2 3)",
    "rgba(1,2,3,0.5)", "rgb(1 2 3 / 50%)", "hsl(120,50%,50%)",
    "hsla(120,50%,50%,0.5)", "hwb(120 30% 40%)", "lab(50% 40 59.5)",
    "oklch(0.7 0.1 200)", "color(display-p3 1 0 0)",
    "color-mix(in srgb, red, blue)", "rgb(300,0,0)", "ButtonFace",
  ];
  for (const colour of accepted) {
    grad().addColorStop(0, colour);
  }
  // The offset boundaries are inclusive, a string offset coerces, and `null`
  // coerces to 0 rather than failing the conversion.
  grad().addColorStop(0, "#fff");
  grad().addColorStop(1, "#fff");
  grad().addColorStop("0.5", "#fff");
  grad().addColorStop(null, "#fff");
  // A repeated offset is kept, not refused.
  const repeated = grad();
  repeated.addColorStop(0.5, "red");
  repeated.addColorStop(0.5, "blue");

  // The shape Chrome exposes: two arguments, and no own enumerable state.
  testing.expectEqual(2, repeated.addColorStop.length);
  testing.expectEqual(0, Object.keys(repeated).length);
  testing.expectEqual("addColorStop,constructor",
    Object.getOwnPropertyNames(Object.getPrototypeOf(repeated)).sort().join(","));
}
</script>

<script id="CanvasRenderingContext2D#fillStyle colour functions">
{
  // Every colour notation a 2D context accepts, and the string it answers.
  // All of it measured on headed Chrome by
  // tools/fingerprint/probes/canvas-color-notation.js, whose readings are in
  // tools/fingerprint/results/canvas-color-notation.chrome.json.
  //
  // The split that shapes the code: hex, a name, `rgb()`, `hsl()` and `hwb()`
  // all collapse to hex (or `rgba()` when translucent), while `lab()`,
  // `lch()`, `oklab()`, `oklch()` and `color()` are answered as *themselves*,
  // canonicalised. A context therefore has to keep the source of those five.
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");
  // The previous colour is blue, so a notation the engine drops shows up as
  // blue rather than as silence -- which is exactly how the bug read.
  const read = (v) => { ctx.fillStyle = "#0000ff"; ctx.fillStyle = v; return ctx.fillStyle; };

  // --- the collapsing family -------------------------------------------
  testing.expectEqual("#ff0000", read("rgb(255,0,0)"));
  testing.expectEqual("#ff0000", read("rgb(255 0 0)"));
  testing.expectEqual("rgba(255, 0, 0, 0.5)", read("rgba(255,0,0,0.5)"));
  testing.expectEqual("rgba(255, 0, 0, 0.5)", read("rgb(255 0 0 / 0.5)"));
  testing.expectEqual("#800000", read("rgb(50% 0% 0%)"));
  testing.expectEqual("#000000", read("rgb(none 0 0)"));
  testing.expectEqual("#ff0000", read("hsl(0,100%,50%)"));
  testing.expectEqual("#ff0000", read("hsl(0 100% 50%)"));
  testing.expectEqual("rgba(255, 0, 0, 0.5)", read("hsla(0,100%,50%,0.5)"));
  testing.expectEqual("#a36629", read("hsl(30 60% 40%)"));
  testing.expectEqual("#ff0000", read("hwb(0 0% 0%)"));
  testing.expectEqual("#33b333", read("hwb(120 20% 30%)"));
  // A whiteness and blackness summing past 100% is the grey between them.
  testing.expectEqual("#747474", read("hwb(120 50% 60%)"));
  // An alpha of exactly one, or one that clamps to it, answers as opaque.
  testing.expectEqual("#ff0000", read("hsl(0 100% 50% / 200%)"));
  testing.expectEqual("rgba(255, 0, 0, 0.5)", read("#ff000080"));
  testing.expectEqual("rgba(0, 0, 0, 0)", read("transparent"));

  // `currentColor` is the element's `color`, whose initial value is black.
  testing.expectEqual("#000000", read("currentColor"));

  // Surrounding whitespace and the case of a name are both tolerated: the
  // `<input type=color>` sanitiser's asymmetry there is its own, not CSS's.
  testing.expectEqual("#ff0000", read(" red "));
  testing.expectEqual("#ff0000", read("RED"));
  testing.expectEqual("#010203", read(" rgb(1,2,3) "));
  testing.expectEqual("#0000ff", read("red x"));
  testing.expectEqual("#0000ff", read(""));

  // --- the family answered as itself -----------------------------------
  testing.expectEqual("lab(50 40 30)", read("lab(50% 40 30)"));
  testing.expectEqual("lab(50 40 30)", read("lab(50 40 30)"));
  testing.expectEqual("lab(50 40 30)", read("LAB(50 40 30)"));
  testing.expectEqual("lab(50 40 30)", read("lab( 50  40  30 )"));
  testing.expectEqual("lab(50 40 30)", read("lab(5e1 40 30)"));
  testing.expectEqual("lab(50 40 30)", read("lab(+50 40 30)"));
  testing.expectEqual("lab(50 40 30 / 0.5)", read("lab(50 40 30 / 0.5)"));
  testing.expectEqual("lab(50 40 30 / 0.5)", read("lab(50 40 30 / 50%)"));
  // An alpha of one is dropped from the string; a `none` alpha is not.
  testing.expectEqual("lab(50 40 30)", read("lab(50 40 30 / 1)"));
  testing.expectEqual("lab(50 40 30)", read("lab(50 40 30 / 1.5)"));
  testing.expectEqual("lab(none 40 30)", read("lab(none 40 30)"));
  // Lightness clamps, and a lab percentage is 125 per hundred on a and b.
  testing.expectEqual("lab(100 40 30)", read("lab(150 40 30)"));
  testing.expectEqual("lab(0 40 30)", read("lab(-50 40 30)"));
  testing.expectEqual("lab(50 62.5 62.5)", read("lab(50% 50% 50%)"));

  testing.expectEqual("lch(50 40 30)", read("lch(50% 40 30)"));
  testing.expectEqual("lch(50 40 30)", read("lch(50 40 30deg)"));
  testing.expectEqual("lch(50 40 180)", read("lch(50 40 0.5turn)"));
  // The hue wraps in both directions; chroma clamps at zero, and 100% is 150.
  testing.expectEqual("lch(50 40 40)", read("lch(50 40 400)"));
  testing.expectEqual("lch(50 40 330)", read("lch(50 40 -30)"));
  testing.expectEqual("lch(50 0 30)", read("lch(50 -40 30)"));
  testing.expectEqual("lch(50 150 30)", read("lch(50 100% 30)"));

  testing.expectEqual("oklab(0.7 0.1 0.05)", read("oklab(0.7 0.1 0.05)"));
  // An oklab percentage is 0.4 per hundred, and its lightness 1 per hundred.
  testing.expectEqual("oklab(0.7 0.1 0.02)", read("oklab(0.7 25% 5%)"));
  testing.expectEqual("oklab(none none none)", read("oklab(none none none)"));
  testing.expectEqual("oklch(0.7 0.1 20)", read("oklch(0.7 0.1 20)"));
  testing.expectEqual("oklch(0.7 0.1 20)", read("oklch(70% 0.1 20)"));
  testing.expectEqual("oklch(0.7 0.1 20)", read("oklch(0.7 25% 20)"));
  testing.expectEqual("oklch(0.7 0.1 20)", read("oklch(0.70 0.10 20.0)"));
  testing.expectEqual("oklch(1 0.1 20)", read("oklch(1.5 0.1 20)"));
  testing.expectEqual("oklch(0.7 0 20)", read("oklch(0.7 -0.1 20)"));

  // `color()` keeps its colour space, lowercased, with `xyz` spelled out.
  testing.expectEqual("color(display-p3 1 0 0)", read("color(display-p3 1 0 0)"));
  testing.expectEqual("color(display-p3 1 0 0)", read("COLOR(DISPLAY-P3 1 0 0)"));
  testing.expectEqual("color(display-p3 1 0.25 0.5)", read("color(display-p3 1 0.25 0.5)"));
  testing.expectEqual("color(display-p3 0.5 0.25 0.5)", read("color(display-p3 50% 25% 50%)"));
  testing.expectEqual("color(display-p3 1 0.25 0.5 / 0.5)", read("color(display-p3 1 0.25 0.5 / 0.5)"));
  testing.expectEqual("color(display-p3 1 0.25 0.5 / none)", read("color(display-p3 1 0.25 0.5 / none)"));
  testing.expectEqual("color(display-p3 1 0 0 / 0)", read("color(display-p3 1 0 0 / -1)"));
  testing.expectEqual("color(display-p3 1 0 0)", read("color(display-p3 1 0 0 / 1)"));
  testing.expectEqual("color(display-p3 none none none)", read("color(display-p3 none none none)"));
  testing.expectEqual("color(xyz-d65 0.5 0.25 0.1)", read("color(xyz 0.5 0.25 0.1)"));
  testing.expectEqual("color(xyz-d65 0.5 0.25 0.1)", read("color(xyz-d65 0.5 0.25 0.1)"));
  testing.expectEqual("color(xyz-d50 0.5 0.25 0.1)", read("color(xyz-d50 0.5 0.25 0.1)"));
  // `color()` channels are not clamped in the string, unlike a lightness.
  testing.expectEqual("color(srgb 1.5 -0.5 0.5)", read("color(srgb 1.5 -0.5 0.5)"));
  testing.expectEqual("color(rec2020 -0.5 0.25 1.5)", read("color(rec2020 -0.5 0.25 1.5)"));

  // Rejections: the wrong arity, a comma anywhere, an unknown colour space.
  testing.expectEqual("#0000ff", read("lab(50)"));
  testing.expectEqual("#0000ff", read("lab(50 40 30 40)"));
  testing.expectEqual("#0000ff", read("lab(50, 40, 30)"));
  testing.expectEqual("#0000ff", read("color(display-p3 1 0.25)"));
  testing.expectEqual("#0000ff", read("color(display-p3 1 0.25 0.5 0.5)"));
  testing.expectEqual("#0000ff", read("color(display-p3, 1, 0, 0)"));
  testing.expectEqual("#0000ff", read("color(nonesuch 1 0 0)"));
  testing.expectEqual("#0000ff", read("rgb(1,2,3,)"));

  // strokeStyle is the same parser.
  ctx.strokeStyle = "oklch(0.7 0.1 20)";
  testing.expectEqual("oklch(0.7 0.1 20)", ctx.strokeStyle);
  ctx.strokeStyle = "red";
  testing.expectEqual("#ff0000", ctx.strokeStyle);
}
</script>

<script id="CanvasRenderingContext2D#fillStyle colour function pixels">
{
  // The bytes each notation actually paints, on an srgb/unorm8 canvas read
  // back in srgb -- the first of the four readings the Turnstile widget takes
  // (results/ibt2-oracle.json). Chrome's values, same probe as above.
  const hex = (data) => [...data].map((b) => b.toString(16).padStart(2, "0")).join("");
  const paint = (v) => {
    const canvas = new OffscreenCanvas(2, 2);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#0000ff";
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, 2, 2);
    return hex(ctx.getImageData(0, 0, 1, 1).data);
  };

  testing.expectEqual("ff0000ff", paint("rgb(255,0,0)"));
  testing.expectEqual("ff000080", paint("rgba(255,0,0,0.5)"));
  testing.expectEqual("ff0000ff", paint("hsl(0,100%,50%)"));
  testing.expectEqual("33b333ff", paint("hwb(120 20% 30%)"));
  testing.expectEqual("000000ff", paint("currentColor"));
  testing.expectEqual("00000000", paint("transparent"));

  // The wide-gamut families, converted through XYZ into srgb and clipped.
  testing.expectEqual("bb5846ff", paint("lab(50% 40 30)"));
  testing.expectEqual("bb584680", paint("lab(50 40 30 / 0.5)"));
  testing.expectEqual("380000ff", paint("lab(none 40 30)"));
  testing.expectEqual("db3702ff", paint("lab(50% 50% 50%)"));
  testing.expectEqual("ffe0c7ff", paint("lab(150 40 30)"));
  testing.expectEqual("b25d57ff", paint("lch(50% 40 30)"));
  testing.expectEqual("008875ff", paint("lch(50 40 0.5turn)"));
  testing.expectEqual("ff0011ff", paint("lch(50 100% 30)"));
  testing.expectEqual("777777ff", paint("lch(50 -40 30)"));
  testing.expectEqual("db8279ff", paint("oklab(0.7 0.1 0.05)"));
  testing.expectEqual("d5838eff", paint("oklab(0.7 25% 5%)"));
  testing.expectEqual("d68585ff", paint("oklch(0.7 0.1 20)"));
  testing.expectEqual("9e9e9eff", paint("oklch(0.7 -0.1 20)"));
  testing.expectEqual("ffe5e3ff", paint("oklch(1.5 0.1 20)"));

  // Every colour space `color()` takes, one reading each.
  testing.expectEqual("ff0000ff", paint("color(display-p3 1 0 0)"));
  testing.expectEqual("ff1b7fff", paint("color(display-p3 1 0.25 0.5)"));
  // The same notation at half alpha, which moves two channels rather than
  // none: the bitmap premultiplies the *float* colour and divides it back out
  // on the way to a page, so the blue's 126.78 stores 63 and 63 of 128 reads
  // back 126 where the opaque row above reads 127. The green is the knife edge
  // that says which conversion the notation took — 27.03 halves to 13.5 and
  // stores 14, where the 26.998 an XYZ D50 route gives halves to 13.4985 and
  // stores 13. Chrome's byte is the first (see `Wide.toSrgbUnit`).
  testing.expectEqual("ff1c7e80", paint("color(display-p3 1 0.25 0.5 / 0.5)"));
  testing.expectEqual("00000000", paint("color(display-p3 1 0.25 0.5 / none)"));
  testing.expectEqual("004184ff", paint("color(display-p3 none 0.25 0.5)"));
  testing.expectEqual("893b83ff", paint("color(display-p3 50% 25% 50%)"));
  testing.expectEqual("ff4080ff", paint("color(srgb 1 0.25 0.5)"));
  testing.expectEqual("ff0080ff", paint("color(srgb 1.5 -0.5 0.5)"));
  testing.expectEqual("ff89bcff", paint("color(srgb-linear 1 0.25 0.5)"));
  testing.expectEqual("ff3d82ff", paint("color(a98-rgb 1 0.25 0.5)"));
  testing.expectEqual("ff0098ff", paint("color(prophoto-rgb 1 0.25 0.5)"));
  testing.expectEqual("ff008dff", paint("color(rec2020 1 0.25 0.5)"));
  testing.expectEqual("005affff", paint("color(rec2020 -0.5 0.25 1.5)"));
  testing.expectEqual("ff0051ff", paint("color(xyz 0.5 0.25 0.1)"));
  testing.expectEqual("ff0061ff", paint("color(xyz-d50 0.5 0.25 0.1)"));

  // A second and third reading per space, in gamut this time, so the transfer
  // function each one uses is pinned by more than a single point. That matters:
  // a98-rgb turned out to use a plain 2.2 rather than CSS Color 4's 563/256,
  // and one reading alone could not have told the two apart.
  testing.expectEqual("56c100ff", paint("color(a98-rgb 0.5 0.75 0.1)"));
  testing.expectEqual("00669cff", paint("color(a98-rgb 0.2 0.4 0.6)"));
  testing.expectEqual("ff135aff", paint("color(a98-rgb 0.9 0.1 0.35)"));
  testing.expectEqual("6bd500ff", paint("color(prophoto-rgb 0.5 0.75 0.1)"));
  // Below 16/512 the prophoto transfer function is its linear segment.
  testing.expectEqual("0085b0ff", paint("color(prophoto-rgb 0.02 0.4 0.6)"));
  testing.expectEqual("58cc00ff", paint("color(rec2020 0.5 0.75 0.1)"));
  testing.expectEqual("0079a8ff", paint("color(rec2020 0.05 0.4 0.6)"));
  // The knife edge that says which gamut matrix a display-p3 notation takes.
  // Its red lands within four hundredths of a byte of the rounding boundary,
  // and the two candidates fall on opposite sides: CSS Color 4's rationals
  // through XYZ D50 answer `1b`, Skia's own D50 fixed-point pair answers `1a`,
  // and Chrome answers `1a` (see `Wide.toSrgbUnit`).
  testing.expectEqual("1a689dff", paint("color(display-p3 0.2 0.4 0.6)"));
  testing.expectEqual("7caacbff", paint("color(srgb-linear 0.2 0.4 0.6)"));
  testing.expectEqual("00c89fff", paint("color(xyz-d50 0.2 0.4 0.3)"));
  testing.expectEqual("00c788ff", paint("color(xyz-d65 0.2 0.4 0.3)"));
  testing.expectEqual("89b949ff", paint("lab(70 -30 50)"));
  testing.expectEqual("00e2ebff", paint("lch(80 60 200)"));
  testing.expectEqual("115705ff", paint("oklab(0.4 -0.1 0.08)"));
  testing.expectEqual("773ac1ff", paint("oklch(0.5 0.2 300)"));
  // Green is 17/30 of a byte, which is 144.49999999999997 in double and
  // exactly 144.5 in float — so the byte it stores says which width the
  // channel is carried at, and Chrome's 145 says float. Measured directly:
  // a float16 read of this paint answers 0.56689453125, the half-precision
  // neighbour of 17/30, and not the 0.568359375 that 145/255 would give
  // (probes/canvas-float-source-channels.js). Under a double the same channel
  // lands a whisker below the boundary and stores 144, which is the byte this
  // line carried before.
  testing.expectEqual("1a91ccff", paint("hwb(200 10% 20%)"));
  testing.expectEqual("5e1782ff", paint("hsl(280 70% 30%)"));
  testing.expectEqual("1a334dff", paint("rgb(10% 20% 30%)"));
}
</script>

<script id="CanvasRenderingContext2D#createImageData(width, height)">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const imageData = ctx.createImageData(100, 200);
  testing.expectEqual(true, imageData instanceof ImageData);
  testing.expectEqual(imageData.width, 100);
  testing.expectEqual(imageData.height, 200);
  testing.expectEqual(imageData.data.length, 100 * 200 * 4);
  testing.expectEqual(true, imageData.data instanceof Uint8ClampedArray);

  // All pixels should be initialized to 0.
  testing.expectEqual(imageData.data[0], 0);
  testing.expectEqual(imageData.data[1], 0);
  testing.expectEqual(imageData.data[2], 0);
  testing.expectEqual(imageData.data[3], 0);
}
</script>

{

  const imageData = ctx.createImageData(source);

<script id="CanvasRenderingContext2D#putImageData">
{
  const element = document.createElement("canvas");
  const ctx = element.getContext("2d");

  const imageData = ctx.createImageData(10, 10);
  testing.expectEqual(true, imageData instanceof ImageData);
  // Modify some pixel data.
  imageData.data[0] = 255;
  imageData.data[1] = 0;
  imageData.data[2] = 0;
  imageData.data[3] = 255;

  // putImageData should not throw.
  ctx.putImageData(imageData, 0, 0);
  ctx.putImageData(imageData, 10, 20);
  // With dirty rect parameters.
  ctx.putImageData(imageData, 0, 0, 0, 0, 5, 5);

  // And the pixels are really in the bitmap: the same paint the offscreen
  // context's `putImageData` block covers, on an element-backed canvas. The
  // element defaults to 300x150, so (10, 20) is on it too.
  const hex = (d) => [...d].map((b) => b.toString(16).padStart(2, '0')).join('');
  testing.expectEqual('ff0000ff', hex(ctx.getImageData(0, 0, 1, 1).data));
  testing.expectEqual('ff0000ff', hex(ctx.getImageData(10, 20, 1, 1).data));
  // Outside every window written above.
  testing.expectEqual('00000000', hex(ctx.getImageData(50, 50, 1, 1).data));
  // The dirty rectangle is a whole overload, not four optional arguments.
  testing.expectError(
    "TypeError: Failed to execute 'putImageData' on " +
      "'CanvasRenderingContext2D': Overload resolution failed.",
    () => ctx.putImageData(imageData, 0, 0, 0));
}
</script>

<script id="CanvasRenderingContext2D#fillRect paints">
{
  const element = document.createElement('canvas');
  element.width = 4;
  element.height = 4;
  const ctx = element.getContext('2d');

  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 2, 2);

  const data = ctx.getImageData(0, 0, 4, 4).data;
  // Top-left 2x2 is opaque red.
  testing.expectEqual([255, 0, 0, 255], Array.from(data.slice(0, 4)));
  testing.expectEqual([255, 0, 0, 255], Array.from(data.slice(4, 8)));
  testing.expectEqual([255, 0, 0, 255], Array.from(data.slice(16, 20)));
  // Third column of the first row was never painted.
  testing.expectEqual([0, 0, 0, 0], Array.from(data.slice(8, 12)));

  // A different fill gives different pixels: two canvases no longer hash the
  // same, which is the whole point of the raster.
  ctx.fillStyle = '#0000ff';
  ctx.fillRect(2, 2, 2, 2);
  const after = ctx.getImageData(2, 2, 1, 1).data;
  testing.expectEqual([0, 0, 255, 255], Array.from(after));
}
</script>

<script id="CanvasRenderingContext2D#fillRect normalises and clips">
{
  const element = document.createElement('canvas');
  element.width = 4;
  element.height = 4;
  const ctx = element.getContext('2d');

  ctx.fillStyle = 'lime';
  // Negative extents are normalised; the part outside the canvas is dropped.
  ctx.fillRect(2, 2, -4, -4);

  const data = ctx.getImageData(0, 0, 4, 4).data;
  testing.expectEqual([0, 255, 0, 255], Array.from(data.slice(0, 4)));
  // (2,2) is outside the normalised [0,2)x[0,2) rect.
  testing.expectEqual([0, 0, 0, 0], Array.from(data.slice((2 * 4 + 2) * 4, (2 * 4 + 2) * 4 + 4)));

  // Wholly off-canvas draws nothing and does not throw.
  ctx.fillRect(-50, -50, 10, 10);
  ctx.fillRect(NaN, 0, 4, 4);
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(3, 3, 1, 1).data));
}
</script>

<script id="CanvasRenderingContext2D#clearRect">
{
  const element = document.createElement('canvas');
  element.width = 2;
  element.height = 2;
  const ctx = element.getContext('2d');

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 2, 2);
  testing.expectEqual([255, 255, 255, 255], Array.from(ctx.getImageData(0, 0, 1, 1).data));

  ctx.clearRect(0, 0, 1, 1);
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 1, 1).data));
  // The rest of the canvas survives.
  testing.expectEqual([255, 255, 255, 255], Array.from(ctx.getImageData(1, 1, 1, 1).data));
}
</script>

<script id="CanvasRenderingContext2D#globalAlpha">
{
  const element = document.createElement('canvas');
  element.width = 1;
  element.height = 1;
  const ctx = element.getContext('2d');

  testing.expectEqual(1, ctx.globalAlpha);
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(0, 0, 1, 1);

  ctx.globalAlpha = 0.5;
  testing.expectEqual(0.5, ctx.globalAlpha);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, 1, 1);
  // Half-opaque white over opaque red.
  testing.expectEqual([255, 128, 128, 255], Array.from(ctx.getImageData(0, 0, 1, 1).data));

  // Out-of-range assignments are ignored rather than clamped.
  ctx.globalAlpha = 4;
  testing.expectEqual(0.5, ctx.globalAlpha);
  ctx.globalAlpha = -1;
  testing.expectEqual(0.5, ctx.globalAlpha);
}
</script>

<script id="CanvasRenderingContext2D#globalCompositeOperation pixels">
{
  // Every expectation is a Chrome 151 readback (probes/expr-composite-blend.js).
  const cell = (op, backdrop, source) => {
    const element = document.createElement('canvas');
    element.width = 1;
    element.height = 1;
    const ctx = element.getContext('2d');
    if (backdrop) {
      ctx.fillStyle = backdrop;
      ctx.fillRect(0, 0, 1, 1);
    }
    ctx.globalCompositeOperation = op;
    ctx.fillStyle = source;
    ctx.fillRect(0, 0, 1, 1);
    return Array.from(ctx.getImageData(0, 0, 1, 1).data);
  };

  // Opaque over opaque is the blend function alone: Cb*Cs and |Cb-Cs|.
  testing.expectEqual([64, 64, 0, 255], cell('multiply', '#ff8000', '#4080c0'));
  testing.expectEqual([191, 0, 192, 255], cell('difference', '#ff8000', '#4080c0'));
  // Multiplying by white, or differencing with black, changes nothing.
  testing.expectEqual([51, 102, 204, 255], cell('multiply', '#3366cc', '#ffffff'));
  testing.expectEqual([51, 102, 204, 255], cell('difference', '#3366cc', '#000000'));
  // Differencing a colour with itself is black, which is the whole point of
  // the pass the fingerprinting widget runs.
  testing.expectEqual([0, 0, 0, 255], cell('difference', '#3366cc', '#3366cc'));
  // With no backdrop there is nothing to blend with, so the source lands as-is.
  testing.expectEqual([51, 102, 204, 255], cell('multiply', null, '#3366cc'));
  testing.expectEqual([51, 102, 204, 255], cell('difference', null, '#3366cc'));
  // A half-opaque source only blends over the half of the pixel it covers.
  testing.expectEqual([159, 96, 0, 255], cell('multiply', '#ff8000', 'rgba(64,128,192,0.5)'));
  testing.expectEqual([223, 64, 96, 255], cell('difference', '#ff8000', 'rgba(64,128,192,0.5)'));
  // A half-opaque backdrop: the part of the source it does not cover stays
  // itself, so the result is a mix of the blend and the raw source.
  testing.expectEqual([64, 96, 96, 255], cell('multiply', 'rgba(255,128,0,0.5)', '#4080c0'));
  testing.expectEqual([128, 64, 192, 255], cell('difference', 'rgba(255,128,0,0.5)', '#4080c0'));

  // The twenty-four Porter-Duff keywords are stored and reported but not
  // applied — they still paint source-over, which is what they did before.
  testing.expectEqual([64, 128, 192, 255], cell('destination-in', '#ff8000', '#4080c0'));
  testing.expectEqual([64, 128, 192, 255], cell('xor', '#ff8000', '#4080c0'));

  // A blend mode is part of the saved drawing state.
  {
    const element = document.createElement('canvas');
    element.width = 1;
    element.height = 1;
    const ctx = element.getContext('2d');
    ctx.fillStyle = '#ff8000';
    ctx.fillRect(0, 0, 1, 1);
    ctx.globalCompositeOperation = 'difference';
    ctx.save();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
    testing.expectEqual('difference', ctx.globalCompositeOperation);
    ctx.fillStyle = '#4080c0';
    ctx.fillRect(0, 0, 1, 1);
    testing.expectEqual([191, 0, 192, 255], Array.from(ctx.getImageData(0, 0, 1, 1).data));
  }
}
</script>

<script id="CanvasRenderingContext2D#globalCompositeOperation on paths and images">
{
  const at = (ctx, x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data);

  // A path's partly covered edge pixel: coverage is the source's alpha, so the
  // half-covered column reads exactly what a half-opaque fill would.
  {
    const element = document.createElement('canvas');
    element.width = 8;
    element.height = 1;
    const ctx = element.getContext('2d');
    ctx.fillStyle = '#ff8000';
    ctx.fillRect(0, 0, 8, 1);
    ctx.globalCompositeOperation = 'difference';
    ctx.fillStyle = '#4080c0';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(4.5, 0);
    ctx.lineTo(4.5, 1);
    ctx.lineTo(0, 1);
    ctx.fill();
    testing.expectEqual([191, 0, 192, 255], at(ctx, 0, 0));
    testing.expectEqual([191, 0, 192, 255], at(ctx, 3, 0));
    testing.expectEqual([223, 64, 96, 255], at(ctx, 4, 0));
    testing.expectEqual([255, 128, 0, 255], at(ctx, 5, 0));
  }

  // drawImage under a blend mode. Taking the same surface twice, the second
  // time differenced, has to flatten every pixel to opaque black whatever the
  // source held — this is verbatim the pass the widget runs before it reads a
  // 1x1 downscale, and until the mode was read the second draw simply
  // overwrote the first.
  {
    const a = document.createElement('canvas');
    a.width = 4;
    a.height = 4;
    const ca = a.getContext('2d');
    ca.fillStyle = '#ffffff';
    ca.fillRect(0, 0, 4, 4);
    ca.fillStyle = '#123456';
    ca.fillRect(1, 1, 2, 2);

    const b = document.createElement('canvas');
    b.width = 4;
    b.height = 4;
    const cb = b.getContext('2d');
    cb.drawImage(a, 0, 0);
    cb.globalCompositeOperation = 'difference';
    cb.drawImage(a, 0, 0);
    cb.globalCompositeOperation = 'source-over';

    const flat = Array.from(cb.getImageData(0, 0, 4, 4).data);
    let black = 0;
    for (let i = 0; i < flat.length; i += 4) {
      if (flat[i] === 0 && flat[i + 1] === 0 && flat[i + 2] === 0 && flat[i + 3] === 255) black++;
    }
    testing.expectEqual(16, black);

    // And the downscale of it, which is the readback the widget actually takes.
    const c = document.createElement('canvas');
    c.width = 1;
    c.height = 1;
    const cc = c.getContext('2d');
    cc.drawImage(b, 0, 0, 4, 4, 0, 0, 1, 1);
    testing.expectEqual([0, 0, 0, 255], at(cc, 0, 0));
  }
}
</script>

<script id="CanvasRenderingContext2D#filter grayscale">
{
  // Every expectation is a Chrome 151 readback
  // (probes/expr-canvas-filter-grayscale.js).
  const fill = (filter, colour) => {
    const element = document.createElement('canvas');
    element.width = 1;
    element.height = 1;
    const ctx = element.getContext('2d');
    ctx.filter = filter;
    ctx.fillStyle = colour;
    ctx.fillRect(0, 0, 1, 1);
    return Array.from(ctx.getImageData(0, 0, 1, 1).data);
  };

  // The filter reaches a plain fill, not only drawImage.
  testing.expectEqual([119, 119, 119, 255], fill('grayscale(1)', '#4080c0'));
  // sRGB luminance on the bytes themselves — a CSS filter does not linearise.
  testing.expectEqual([54, 54, 54, 255], fill('grayscale(1)', '#ff0000'));
  testing.expectEqual([182, 182, 182, 255], fill('grayscale(1)', '#00ff00'));
  testing.expectEqual([18, 18, 18, 255], fill('grayscale(1)', '#0000ff'));
  testing.expectEqual([255, 255, 255, 255], fill('grayscale(1)', '#ffffff'));
  // A partial amount interpolates towards that luminance.
  testing.expectEqual([92, 124, 156, 255], fill('grayscale(0.5)', '#4080c0'));
  testing.expectEqual([92, 124, 156, 255], fill('grayscale(50%)', '#4080c0'));
  testing.expectEqual([78, 126, 174, 255], fill('grayscale(25%)', '#4080c0'));
  // An empty argument is 1; above 1 clamps; 0 and 'none' change nothing.
  testing.expectEqual([119, 119, 119, 255], fill('grayscale()', '#4080c0'));
  testing.expectEqual([119, 119, 119, 255], fill('grayscale(2)', '#4080c0'));
  testing.expectEqual([64, 128, 192, 255], fill('grayscale(0)', '#4080c0'));
  testing.expectEqual([64, 128, 192, 255], fill('none', '#4080c0'));
  // Case and whitespace are not significant, and Chrome takes an unclosed one.
  testing.expectEqual([119, 119, 119, 255], fill('GRAYSCALE(1)', '#4080c0'));
  testing.expectEqual([119, 119, 119, 255], fill(' grayscale( 1 ) ', '#4080c0'));
  testing.expectEqual([119, 119, 119, 255], fill('grayscale(1', '#4080c0'));

  // A translucent paint, which used to be a divergence: Chrome greys the
  // premultiplied bytes and reads 120, and greying the straight colour without
  // rounding it first reaches the same 120 once the bitmap premultiplies it
  // (measured -- results/canvas-premultiplied-encode.chrome.json).
  testing.expectEqual([120, 120, 120, 128], fill('grayscale(1)', 'rgba(64,128,192,0.5)'));
  // One divergence, deliberate: a chain whose other half we do not implement
  // paints unfiltered, since
  // honouring only the grey would land further from Chrome's {128,128,128,8}
  // than honouring none of it — the blur is most of what happened there.
  testing.expectEqual([64, 128, 192, 255], fill('grayscale(1) blur(2px)', '#4080c0'));

  // The filter applies to the source, never to the backdrop: greyed #4080c0 is
  // 119 all over, and differencing that against #ff8000 gives |255-119| etc.
  {
    const element = document.createElement('canvas');
    element.width = 1;
    element.height = 1;
    const ctx = element.getContext('2d');
    ctx.fillStyle = '#ff8000';
    ctx.fillRect(0, 0, 1, 1);
    ctx.filter = 'grayscale(1)';
    ctx.globalCompositeOperation = 'difference';
    ctx.fillStyle = '#4080c0';
    ctx.fillRect(0, 0, 1, 1);
    testing.expectEqual([136, 9, 119, 255], Array.from(ctx.getImageData(0, 0, 1, 1).data));
  }

  // drawImage greys every texel it takes, and the filter is saved state.
  {
    const src = document.createElement('canvas');
    src.width = 4;
    src.height = 1;
    const cs = src.getContext('2d');
    ['#ff0000', '#00ff00', '#0000ff', '#4080c0'].forEach((colour, i) => {
      cs.fillStyle = colour;
      cs.fillRect(i, 0, 1, 1);
    });

    const row = (filter) => {
      const element = document.createElement('canvas');
      element.width = 4;
      element.height = 1;
      const ctx = element.getContext('2d');
      ctx.filter = 'none';
      ctx.save();
      ctx.filter = filter;
      ctx.drawImage(src, 0, 0);
      const got = Array.from(ctx.getImageData(0, 0, 4, 1).data);
      ctx.restore();
      testing.expectEqual('none', ctx.filter);
      return got;
    };

    testing.expectEqual(
      [255, 0, 0, 255, 0, 255, 0, 255, 0, 0, 255, 255, 64, 128, 192, 255],
      row('none'),
    );
    testing.expectEqual(
      [54, 54, 54, 255, 182, 182, 182, 255, 18, 18, 18, 255, 119, 119, 119, 255],
      row('grayscale(1)'),
    );
    testing.expectEqual(
      [155, 27, 27, 255, 91, 219, 91, 255, 9, 9, 137, 255, 92, 124, 156, 255],
      row('grayscale(0.5)'),
    );
    testing.expectEqual(
      [205, 14, 14, 255, 46, 237, 46, 255, 5, 5, 196, 255, 78, 126, 174, 255],
      row('grayscale(25%)'),
    );
  }
}
</script>

<script id="CanvasRenderingContext2D#strokeRect">
{
  const element = document.createElement('canvas');
  element.width = 5;
  element.height = 5;
  const ctx = element.getContext('2d');

  testing.expectEqual('#000000', ctx.strokeStyle);
  testing.expectEqual(1, ctx.lineWidth);

  ctx.strokeStyle = 'blue';
  testing.expectEqual('#0000ff', ctx.strokeStyle);
  // Centred on the path, so a 1px stroke of [1,4] covers [0.5,4.5] -> [1,4].
  ctx.strokeRect(1.5, 1.5, 2, 2);

  const at = (x, y) => Array.from(ctx.getImageData(x, y, 1, 1).data);
  testing.expectEqual([0, 0, 255, 255], at(1, 1));
  testing.expectEqual([0, 0, 255, 255], at(3, 1));
  testing.expectEqual([0, 0, 255, 255], at(1, 3));
  // The interior is untouched.
  testing.expectEqual([0, 0, 0, 0], at(2, 2));
  // As is everything outside.
  testing.expectEqual([0, 0, 0, 0], at(0, 0));

  ctx.lineWidth = 0;
  testing.expectEqual(1, ctx.lineWidth);
  ctx.lineWidth = 3;
  testing.expectEqual(3, ctx.lineWidth);
}
</script>

<script id="CanvasRenderingContext2D#getImageData window">
{
  const element = document.createElement('canvas');
  element.width = 3;
  element.height = 3;
  const ctx = element.getContext('2d');

  ctx.fillStyle = '#ff0000';
  ctx.fillRect(2, 2, 1, 1);

  // A window straddling the bottom-right corner: only one pixel overlaps.
  const data = ctx.getImageData(2, 2, 2, 2).data;
  testing.expectEqual([255, 0, 0, 255], Array.from(data.slice(0, 4)));
  testing.expectEqual([0, 0, 0, 0], Array.from(data.slice(4, 8)));
  testing.expectEqual([0, 0, 0, 0], Array.from(data.slice(8, 12)));

  // A negative origin pushes the canvas into the middle of the window.
  const shifted = ctx.getImageData(-1, -1, 4, 4).data;
  const index = ((2 + 1) * 4 + (2 + 1)) * 4;
  testing.expectEqual([255, 0, 0, 255], Array.from(shifted.slice(index, index + 4)));
  testing.expectEqual([0, 0, 0, 0], Array.from(shifted.slice(0, 4)));
}
</script>

<script id="CanvasRenderingContext2D#resize clears">
{
  const element = document.createElement('canvas');
  element.width = 2;
  element.height = 2;
  const ctx = element.getContext('2d');

  ctx.fillStyle = '#ff0000';
  ctx.fillRect(0, 0, 2, 2);
  testing.expectEqual([255, 0, 0, 255], Array.from(ctx.getImageData(0, 0, 1, 1).data));

  // Re-assigning the same width still resets the bitmap.
  element.width = 2;
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 1, 1).data));

  ctx.fillRect(0, 0, 2, 2);
  element.height = 8;
  testing.expectEqual([0, 0, 0, 0], Array.from(ctx.getImageData(0, 0, 1, 1).data));
}
</script>

<script id="CanvasRenderingContext2D#shadowColor">
{
  // shadowColor is a colour, not free text: Chrome parses it and reads back the
  // serialisation, exactly as it does for fillStyle. Measured on Chrome 150 --
  // and measured again where it matters, because Akamai's macys interstitial
  // sets `shadowColor` twice and reads it back both times, so echoing the
  // source notation is a value a guard sees.
  const ctx = document.createElement('canvas').getContext('2d');
  testing.expectEqual('rgba(0, 0, 0, 0)', ctx.shadowColor);
  ctx.shadowColor = 'red';
  testing.expectEqual('#ff0000', ctx.shadowColor);
  ctx.shadowColor = 'rgb(43,22,233)';
  testing.expectEqual('#2b16e9', ctx.shadowColor);
  ctx.shadowColor = '#fc0';
  testing.expectEqual('#ffcc00', ctx.shadowColor);
  ctx.shadowColor = 'rgba(255, 0, 0, 0.5)';
  testing.expectEqual('rgba(255, 0, 0, 0.5)', ctx.shadowColor);
  ctx.shadowColor = 'transparent';
  testing.expectEqual('rgba(0, 0, 0, 0)', ctx.shadowColor);
  // Unparseable leaves the previous value in place, same rule as fillStyle.
  ctx.shadowColor = '#123456';
  ctx.shadowColor = 'not-a-colour';
  testing.expectEqual('#123456', ctx.shadowColor);
  // currentColor has no element colour to resolve against here, so it lands on
  // that property's initial value.
  ctx.shadowColor = 'currentColor';
  testing.expectEqual('#000000', ctx.shadowColor);
}
</script>

<script id="CanvasRenderingContext2D#drawing state accessors">
{
  const proto = CanvasRenderingContext2D.prototype;
  for (const name of ['fillStyle', 'strokeStyle', 'lineWidth', 'globalAlpha']) {
    const descriptor = Object.getOwnPropertyDescriptor(proto, name);
    testing.expectEqual('function', typeof descriptor.get);
    testing.expectEqual('function', typeof descriptor.set);
  }
}
</script>

<script id="HTMLCanvasElement#toDataURL">
{
  const element = document.createElement('canvas');
  element.width = 4;
  element.height = 4;

  const empty = element.toDataURL();
  testing.expectTrue(empty.startsWith('data:image/png;base64,iVBORw0KGgo'));

  // A canvas with no 2D context at all encodes the same transparent image as
  // one whose context never drew.
  const untouched = document.createElement('canvas');
  untouched.width = 4;
  untouched.height = 4;
  untouched.getContext('2d');
  testing.expectEqual(empty, untouched.toDataURL());

  // Drawing changes the bytes, and drawing something else changes them again.
  const ctx = element.getContext('2d');
  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 2, 2);
  const red = element.toDataURL();
  testing.expectTrue(red !== empty);

  ctx.fillStyle = 'blue';
  ctx.fillRect(0, 0, 2, 2);
  testing.expectTrue(element.toDataURL() !== red);

  // Same pixels, same string.
  ctx.fillStyle = 'red';
  ctx.fillRect(0, 0, 2, 2);
  testing.expectEqual(red, element.toDataURL());

  // Everything outside the three types we encode falls back to PNG.
  testing.expectTrue(element.toDataURL('image/bogus').startsWith('data:image/png;base64,'));

  // A canvas with no area has no image.
  const degenerate = document.createElement('canvas');
  degenerate.width = 0;
  testing.expectEqual('data:,', degenerate.toDataURL());
}
</script>

<script id="HTMLCanvasElement#toBlob" type=module>
  const state = await testing.async();

  const element = document.createElement('canvas');
  element.width = 3;
  element.height = 3;
  const ctx = element.getContext('2d');
  ctx.fillStyle = '#00ff00';
  ctx.fillRect(0, 0, 3, 3);

  let synchronous = true;
  let blob = null;
  let calledSynchronously = null;
  element.toBlob((result) => {
    blob = result;
    calledSynchronously = synchronous;
    state.resolve();
  });
  synchronous = false;

  await state.done(() => {
    testing.expectEqual(false, calledSynchronously);
    testing.expectEqual(true, blob instanceof Blob);
    testing.expectEqual('image/png', blob.type);
    // The same bytes toDataURL would have base64'd.
    const expected = element.toDataURL().slice('data:image/png;base64,'.length);
    testing.expectEqual(atob(expected).length, blob.size);
  });
</script>

<script id="HTMLCanvasElement#toDataURL jpeg and webp">
{
  // Chrome encodes exactly three of the IANA image types and falls back to PNG
  // for the rest. Measured on Chrome 141 with probes/canvas-encode-types.js:
  // the match is on the whole string, ASCII case-insensitively, so 'image/jpg'
  // and a type carrying a parameter both miss.
  const element = document.createElement('canvas');
  element.width = 20;
  element.height = 20;
  const ctx = element.getContext('2d');
  ctx.fillStyle = '#4285f4';
  ctx.fillRect(2, 2, 16, 16);

  const mime = (...args) => {
    const url = element.toDataURL(...args);
    const semi = url.indexOf(';');
    return semi === -1 ? url : url.slice(0, semi);
  };

  testing.expectEqual('data:image/png', mime());
  testing.expectEqual('data:image/png', mime('image/png'));
  testing.expectEqual('data:image/jpeg', mime('image/jpeg'));
  testing.expectEqual('data:image/webp', mime('image/webp'));

  // ASCII case folding, both ways.
  testing.expectEqual('data:image/jpeg', mime('IMAGE/JPEG'));
  testing.expectEqual('data:image/webp', mime('Image/WebP'));

  // Near misses. Every one of these is 'data:image/png' on Chrome.
  const misses = ['image/jpg', 'image/x-png', 'image/gif', 'image/bmp', 'image/apng',
    'image/avif', 'image/svg+xml', 'image/tiff', 'image/jxr', 'image/vnd.mozilla.apng',
    'image/vnd.sealedmedia.softseal.jpg', 'image/bogus', ' image/jpeg', 'image/jpeg ',
    'image/jpeg;q=1', 'image/webp;', 'jpeg', ''];
  const wrong = misses.filter((t) => mime(t) !== 'data:image/png');
  testing.expectEqual('', wrong.join(','));

  // The magic bytes each format opens with, as Chrome writes them: a JFIF APP0
  // right behind the SOI, and a RIFF/WEBP container.
  testing.expectTrue(element.toDataURL('image/jpeg').startsWith('data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQAB'));
  testing.expectTrue(element.toDataURL('image/webp').startsWith('data:image/webp;base64,UklGR'));

  // Quality reaches the JPEG encoder: 0 is a real request, and anything that is
  // not a number in [0, 1] leaves the default 0.92 in place (measured).
  const byteLength = (...args) => atob(element.toDataURL(...args).split(',')[1]).length;
  const fallback = byteLength('image/jpeg');
  testing.expectTrue(byteLength('image/jpeg', 0) < fallback);
  testing.expectTrue(byteLength('image/jpeg', 1) > fallback);
  const defaulted = [undefined, -1, 2, NaN, 'x', null, true]
    .filter((q) => byteLength('image/jpeg', q) !== fallback);
  testing.expectEqual('', defaulted.join(','));
  // PNG has no quality knob.
  testing.expectEqual(byteLength('image/png'), byteLength('image/png', 0));

  // A canvas with no area has no image, whatever type was asked for.
  const degenerate = document.createElement('canvas');
  degenerate.width = 0;
  testing.expectEqual('data:,', degenerate.toDataURL('image/jpeg'));
}
</script>

<script id="HTMLCanvasElement#toBlob jpeg and webp" type=module>
  const state = await testing.async();

  const element = document.createElement('canvas');
  element.width = 20;
  element.height = 20;
  const ctx = element.getContext('2d');
  ctx.fillStyle = '#4285f4';
  ctx.fillRect(2, 2, 16, 16);

  const type = (t) => new Promise((resolve) => {
    element.toBlob((blob) => resolve(blob === null ? 'null' : blob.type), t);
  });

  const seen = [];
  for (const t of [undefined, 'image/png', 'image/jpeg', 'image/webp', 'IMAGE/JPEG', 'image/jpg', 'image/bogus']) {
    seen.push(await type(t));
  }
  state.resolve();

  await state.done(() => {
    // toBlob reads the type the same way toDataURL does.
    testing.expectEqual(
      'image/png,image/png,image/jpeg,image/webp,image/jpeg,image/png,image/png',
      seen.join(','),
    );
  });
</script>

<script id="CanvasRenderingContext2D#font normalisation">
{
  const ctx = document.createElement('canvas').getContext('2d');
  testing.expectEqual('10px sans-serif', ctx.font);

  // Every pair here is a measured Chrome answer.
  const cases = [
    ['14px Arial', '14px Arial'],
    ['bold 12px serif', 'bold 12px serif'],
    ['italic 700 16px/1.5 "Times New Roman", serif', 'italic bold 16px "Times New Roman", serif'],
    ['small-caps 20px monospace', 'small-caps 20px monospace'],
    ['12pt serif', '16px serif'],
    ['xx-large serif', '32px serif'],
    ['2rem serif', '32px serif'],
    ['150% serif', '15px serif'],
    ['lighter 16px serif', '100 16px serif'],
    ['oblique 16px serif', 'italic 16px serif'],
    ['16px Foo Bar', '16px "Foo Bar"'],
    ["16px 'Single'", '16px Single'],
    ['italic small-caps bold 16px serif', 'italic bold small-caps 16px serif'],
  ];
  for (const [input, expected] of cases) {
    ctx.font = input;
    testing.expectEqual(expected, ctx.font);
  }

  // A value Chrome rejects keeps the previous font rather than resetting.
  ctx.font = '33px monospace';
  for (const bad of ['not-a-font', '', '16px', 'bold serif', 'condensed 16px serif', 'oblique 30deg 16px serif']) {
    ctx.font = bad;
    testing.expectEqual('33px monospace', ctx.font);
  }

  // Relative sizes resolve against the canvas default, not the current font.
  ctx.font = '1em sans-serif';
  testing.expectEqual('10px sans-serif', ctx.font);
}
</script>

<script id="CanvasRenderingContext2D#measureText">
{
  const ctx = document.createElement('canvas').getContext('2d');

  // Chrome's own numbers, for the strings canvas fingerprints actually use.
  testing.expectEqual(89.9658203125, ctx.measureText('mmmmmmmmmmlli').width);
  testing.expectEqual(140.615234375, ctx.measureText('Cwm fjordbank glyphs vext quiz').width);
  testing.expectEqual(55.01953125, ctx.measureText('Hello, world!').width);
  testing.expectEqual(0, ctx.measureText('').width);

  // Exactly linear in the font size.
  ctx.font = '100px sans-serif';
  testing.expectEqual(899.658203125, ctx.measureText('mmmmmmmmmmlli').width);

  // A different family measures differently — this is the signal a font
  // fingerprint reads.
  ctx.font = '100px monospace';
  const mono = ctx.measureText('mmmmmmmmmmlli').width;
  ctx.font = '100px serif';
  const serif = ctx.measureText('mmmmmmmmmmlli').width;
  testing.expectTrue(mono !== serif);
  testing.expectTrue(mono !== 899.658203125);

  // An unresolvable family falls back to the standard font, as Chrome's does.
  ctx.font = '100px NoSuchFamily12345';
  testing.expectEqual(serif, ctx.measureText('mmmmmmmmmmlli').width);
}
</script>

<script id="CanvasRenderingContext2D#measureText emoji">
{
  // Headed Chrome's numbers, from probes/expr-emoji-text-metrics.js. A colour
  // emoji does not come from the named family and is not linear in the font
  // size: at 16px it advances 20 where the em box is 16, and at 24px and up it
  // advances the em exactly.
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = '16px sans-serif';

  const m = ctx.measureText('\u{1F600}');
  testing.expectEqual(20, m.width);
  testing.expectEqual(1, m.actualBoundingBoxLeft);
  testing.expectEqual(21, m.actualBoundingBoxRight);
  testing.expectEqual(17, m.actualBoundingBoxAscent);
  testing.expectEqual(5, m.actualBoundingBoxDescent);

  // Which family was asked for makes no difference, because the glyph never
  // comes from it. Chrome answers 20 under all four.
  for (const family of ['sans-serif', 'serif', 'monospace', 'Arial']) {
    ctx.font = `16px ${family}`;
    testing.expectEqual(20, ctx.measureText('\u{1F600}').width);
  }

  // The curve, at the sizes the probe walked.
  ctx.font = '8px sans-serif';
  testing.expectEqual(10, ctx.measureText('\u{1F600}').width);
  ctx.font = '13px sans-serif';
  testing.expectEqual(16, ctx.measureText('\u{1F600}').width);
  ctx.font = '24px sans-serif';
  testing.expectEqual(24, ctx.measureText('\u{1F600}').width);
  ctx.font = '48px sans-serif';
  testing.expectEqual(48, ctx.measureText('\u{1F600}').width);
  testing.expectEqual(44, ctx.measureText('\u{1F600}').actualBoundingBoxAscent);

  // A shaped cluster is one emoji however many code points it is made of, and
  // a selector on its own is not one at all.
  ctx.font = '16px sans-serif';
  testing.expectEqual(20, ctx.measureText('\u{2600}\u{FE0F}').width); // sun, colour
  testing.expectEqual(20, ctx.measureText('\u{1F1FA}\u{1F1F8}').width); // a flag
  testing.expectEqual(20, ctx.measureText('\u{1F468}\u{200D}\u{1F4BB}').width); // ZWJ
  testing.expectEqual(20, ctx.measureText('\u{1F44D}\u{1F3FD}').width); // skin tone
  testing.expectEqual(0, ctx.measureText('\u{FE0F}').width);

  // Text is still text: the pen carries both kinds of advance, and 'x' is 8.
  testing.expectEqual(8, ctx.measureText('x').width);
  testing.expectEqual(28, ctx.measureText('x\u{1F600}').width);
  testing.expectEqual(29, ctx.measureText('x\u{1F600}').actualBoundingBoxRight);

  // A combining mark rides on the letter before it rather than being charged
  // an advance of its own.
  testing.expectEqual(ctx.measureText('a').width, ctx.measureText('a\u{0301}').width);
}
</script>

<script id="TextMetrics">
{
  const ctx = document.createElement('canvas').getContext('2d');
  const metrics = ctx.measureText('mmmmmmmmmmlli');
  testing.expectEqual(true, metrics instanceof TextMetrics);

  // The full set Chrome reports for 10px sans-serif.
  testing.expectEqual(89.9658203125, metrics.width);
  testing.expectEqual(-0.64453125, metrics.actualBoundingBoxLeft);
  testing.expectEqual(89.2822265625, metrics.actualBoundingBoxRight);
  testing.expectEqual(10, metrics.fontBoundingBoxAscent);
  testing.expectEqual(2, metrics.fontBoundingBoxDescent);
  testing.expectEqual(7.1728515625, metrics.actualBoundingBoxAscent);
  testing.expectEqual(0, metrics.actualBoundingBoxDescent);
  testing.expectEqual(8, metrics.hangingBaseline);
  testing.expectEqual(0, metrics.alphabeticBaseline);
  testing.expectEqual(-2, metrics.ideographicBaseline);

  ctx.font = '14px Arial';
  const arial = ctx.measureText('Cwm fjordbank glyphs vext quiz');
  testing.expectEqual(196.861328125, arial.width);
  testing.expectEqual(-0.697265625, arial.actualBoundingBoxLeft);
  testing.expectEqual(196.560546875, arial.actualBoundingBoxRight);
  testing.expectEqual(10.1923828125, arial.actualBoundingBoxAscent);
  testing.expectEqual(2.9462890625, arial.actualBoundingBoxDescent);
  testing.expectEqual(10.399999618530273, arial.hangingBaseline);

  // Chrome exposes all ten as prototype accessors and nothing else.
  const names = Object.getOwnPropertyNames(TextMetrics.prototype).filter((n) => n !== 'constructor');
  testing.expectEqual(10, names.length);
  for (const name of names) {
    const descriptor = Object.getOwnPropertyDescriptor(TextMetrics.prototype, name);
    testing.expectEqual('function', typeof descriptor.get);
    testing.expectEqual(undefined, descriptor.set);
  }
}
</script>

<script id="CanvasRenderingContext2D#interface shape">
{
  const proto = CanvasRenderingContext2D.prototype;
  const names = Object.getOwnPropertyNames(proto).filter((n) => n !== 'constructor');
  // Chrome has exactly 73 own properties here: 45 methods and 28 accessors,
  // and not one plain data property. Measured, see tools/fingerprint.
  testing.expectEqual(73, names.length);

  let accessors = 0;
  let methods = 0;
  for (const name of names) {
    const descriptor = Object.getOwnPropertyDescriptor(proto, name);
    if (descriptor.get) {
      accessors += 1;
    } else {
      testing.expectEqual('function', typeof descriptor.value);
      methods += 1;
    }
  }
  testing.expectEqual(28, accessors);
  testing.expectEqual(45, methods);
}
</script>

<script id="CanvasRenderingContext2D#drawing state defaults">
