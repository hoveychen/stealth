<!DOCTYPE html>
<script src="../testing.js"></script>

<script id="observe_performance_mark">
{
  const observer = new PerformanceObserver((list, observer) => {
    testing.expectEqual(true, list instanceof PerformanceObserverEntryList);
    testing.expectEqual(true, observer instanceof PerformanceObserver);

    const entries = list.getEntries();
    testing.expectEqual(true, entries instanceof Array);
    testing.expectEqual(2, entries.length);

    {
      const { name, startTime, duration, entryType } = entries[0];
      testing.expectEqual("operationStart", name);
      testing.expectEqual(20, startTime);
      testing.expectEqual(0, duration);
      testing.expectEqual("mark", entryType);
    }

    {
      const { name, startTime, duration, entryType } = entries[1];
      testing.expectEqual("operationEnd", name);
      testing.expectEqual(34.0, startTime);
      testing.expectEqual(0, duration);
      testing.expectEqual("mark", entryType);
    }

    observer.disconnect();
  });

  // Look for performance marks.
  observer.observe({ type: "mark" });
  performance.mark("operationStart", { startTime: 20.0 });
  performance.mark("operationEnd", { startTime: 34.0 });
}
</script>

<script id="microtask_access_to_list" type=module>
  const state = await testing.async();

  let savedList;
  const promise = new Promise((resolve) => {
    const observer = new PerformanceObserver((list, observer) => {
      savedList = list;
      resolve();
      observer.disconnect();
    });
    observer.observe({ type: "mark" });
    performance.mark("testMark");
  });

  await promise;
  // force a call_depth reset, which will clear the call_arena
  document.getElementsByTagName('*');

  const entries = savedList.getEntries();
  const entriesIsArray = entries instanceof Array;
  const entriesLen = entries.length;
  const firstName = entries[0].name;
  const firstType = entries[0].entryType;

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, entriesIsArray);
    testing.expectEqual(1, entriesLen);
    testing.expectEqual("testMark", firstName);
    testing.expectEqual("mark", firstType);
  });
</script>

<script>
  // Chrome's fifteen, in Chrome's order, which is alphabetical (measured on a
  // headed Chrome 151). taskattribution is deliberately absent: it is a real
  // entryType with a real interface, but Chrome does not advertise it here.
  //
  // interaction-contentful-paint and soft-navigation are advertised even though
  // nothing ever queues one -- their interfaces are on the window here already
  // (see the unreachable_performance_entry_subclasses block in performance.html)
  // and Chrome's own buffers for them are empty too, so the list is the only
  // place the two names are readable.
  testing.expectEqual([
    'element', 'event', 'first-input', 'interaction-contentful-paint',
    'largest-contentful-paint', 'layout-shift', 'long-animation-frame',
    'longtask', 'mark', 'measure', 'navigation', 'paint', 'resource',
    'soft-navigation', 'visibility-state',
  ], PerformanceObserver.supportedEntryTypes);
  // A static FrozenArray, so it reads back frozen -- the static accessor path
  // converts its return value the same way an instance one does.
  testing.expectEqual(true, Object.isFrozen(PerformanceObserver.supportedEntryTypes));
  testing.expectEqual(false, Object.isExtensible(PerformanceObserver.supportedEntryTypes));
</script>

<script id="list_get_entries_by_type">
{
  performance.clearMarks();
  performance.clearMeasures();

  const observer = new PerformanceObserver((list) => {
    const marks = list.getEntriesByType("mark");
    testing.expectEqual(true, marks instanceof Array);
    testing.expectEqual(2, marks.length);
    testing.expectEqual("lbt1", marks[0].name);
    testing.expectEqual("mark", marks[0].entryType);
    testing.expectEqual("lbt2", marks[1].name);

    const measures = list.getEntriesByType("measure");
    testing.expectEqual(1, measures.length);
    testing.expectEqual("lbtMeasure", measures[0].name);
    testing.expectEqual("measure", measures[0].entryType);

    // A type that's observed but has no entries returns an empty array.
    const resources = list.getEntriesByType("resource");
    testing.expectEqual(true, resources instanceof Array);
    testing.expectEqual(0, resources.length);

    observer.disconnect();
  });

  observer.observe({ entryTypes: ["mark", "measure"] });
  performance.mark("lbt1");
  performance.mark("lbt2");
  performance.measure("lbtMeasure");
}
</script>

<script id="list_get_entries_by_name">
{
  performance.clearMarks();
  performance.clearMeasures();

  const observer = new PerformanceObserver((list) => {
    // Without entryType, any type matching the name is returned.
    const shared = list.getEntriesByName("lbnShared");
    testing.expectEqual(true, shared instanceof Array);
    testing.expectEqual(2, shared.length);

    // With entryType, only entries of that type are returned.
    const sharedMark = list.getEntriesByName("lbnShared", "mark");
    testing.expectEqual(1, sharedMark.length);
    testing.expectEqual("mark", sharedMark[0].entryType);

    const sharedMeasure = list.getEntriesByName("lbnShared", "measure");
    testing.expectEqual(1, sharedMeasure.length);
    testing.expectEqual("measure", sharedMeasure[0].entryType);

    // Name mismatch -> empty array.
    const missing = list.getEntriesByName("lbnMissing");
    testing.expectEqual(0, missing.length);

    // Name matches but type doesn't -> empty array.
    const wrongType = list.getEntriesByName("lbnOnlyMark", "measure");
    testing.expectEqual(0, wrongType.length);

    observer.disconnect();
  });

  observer.observe({ entryTypes: ["mark", "measure"] });
  performance.mark("lbnShared");
  performance.measure("lbnShared");
  performance.mark("lbnOnlyMark");
}
</script>

<script id="buffered_option">
{
  // Clear marks from previous tests so we get a precise count
  performance.clearMarks();

  // Create marks BEFORE the observer
  performance.mark("early1", { startTime: 1.0 });
  performance.mark("early2", { startTime: 2.0 });

  let receivedEntries = null;
  const observer = new PerformanceObserver((list) => {
    receivedEntries = list.getEntries();
    // Disconnect as soon as the buffered entries arrive so later marks
    // (e.g. from other tests sharing the global performance buffer) don't
    // trigger a second callback that overwrites receivedEntries.
    observer.disconnect();
  });

  // With buffered: true, existing marks should be delivered
  observer.observe({ type: "mark", buffered: true });

  testing.onload(() => {
    testing.expectEqual(true, receivedEntries !== null);
    testing.expectEqual(2, receivedEntries.length);
    testing.expectEqual("early1", receivedEntries[0].name);
    testing.expectEqual("early2", receivedEntries[1].name);
  });
}
</script>

<script id=performanceObserver_callback_brand>
  // Same sentence every observer constructor writes for a non-callable
  // callback (measured on Chrome 151).
  let err = null;
  try { new PerformanceObserver(1); } catch (e) { err = `${e.name}: ${e.message}`; }
  testing.expectEqual(
    "TypeError: Failed to construct 'PerformanceObserver': parameter 1 is not of type 'Function'.",
    err,
  );
</script>

<script id="observe_mode_is_fixed">
{
  const observer = new PerformanceObserver(() => {});
  observer.observe({ entryTypes: ["mark"] });
  testing.expectError("InvalidModificationError", () => observer.observe({ type: "mark" }));
  observer.disconnect();

  const single = new PerformanceObserver(() => {});
  single.observe({ type: "mark" });
  testing.expectError("InvalidModificationError", () => single.observe({ entryTypes: ["mark"] }));
  testing.expectError("TypeError", () => single.observe({ type: "mark", entryTypes: ["mark"] }));
  testing.expectError("TypeError", () => single.observe({}));
  single.disconnect();
}
</script>

<script id="buffered_ignored_with_entry_types" type=module>
{
  const state = await testing.async();
  performance.mark("before_observer");
  // Like every engine (and unlike the spec's TypeError), buffered is
  // ignored alongside entryTypes: no past entry is delivered.
  let delivered = 0;
  const observer = new PerformanceObserver((list) => { delivered += list.getEntries().length; });
  observer.observe({ entryTypes: ["mark"], buffered: true });
  setTimeout(() => state.resolve(), 20);
  await state.done(() => {
    observer.disconnect();
    testing.expectEqual(0, delivered);
  });
}
</script>
