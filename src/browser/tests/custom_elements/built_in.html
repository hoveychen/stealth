<!DOCTYPE html>
<body>
<script src="../testing.js"></script>
<script id="built_in">
{
    class FancyButton extends HTMLElement {}
    customElements.define('fancy-button', FancyButton, { extends: 'button' });

    const definition = customElements.get('fancy-button');
    testing.expectEqual(FancyButton, definition);
}

{
    let threw = false;
    try {
        class BadExtends extends HTMLElement {}
        customElements.define('bad-extends', BadExtends, { extends: 'not-a-real-element' });
    } catch (e) {
        threw = true;
    }
    testing.expectEqual(true, threw);
}

{
    let threw = false;
    try {
        class ExtendCustom extends HTMLElement {}
        customElements.define('extend-custom', ExtendCustom, { extends: 'fancy-button' });
    } catch (e) {
        threw = true;
    }
    testing.expectEqual(true, threw);
}

{
    class FancyParagraph extends HTMLElement {}
    customElements.define('fancy-paragraph', FancyParagraph, { extends: 'p' });

    const definition = customElements.get('fancy-paragraph');
    testing.expectEqual(FancyParagraph, definition);
}

{
    let constructorCalled = 0;

    class ConstructedButton extends HTMLElement {
        constructor() {
            super();
            constructorCalled++;
            this.clicked = false;
        }
    }

    customElements.define('constructed-button', ConstructedButton, { extends: 'button' });

    const btn = document.createElement('button', { is: 'constructed-button' });
    testing.expectEqual(1, constructorCalled);
    testing.expectEqual('BUTTON', btn.tagName);
    testing.expectEqual(false, btn.clicked);
}

{
    class WrongTag extends HTMLElement {}
    customElements.define('wrong-tag', WrongTag, { extends: 'button' });

    const div = document.createElement('div', { is: 'wrong-tag' });
    testing.expectEqual('DIV', div.tagName);
}

{
    let constructorCalled = 0;

    class TypedButton extends HTMLButtonElement {
        constructor() {
            super();
            constructorCalled++;
            this.custom = true;
        }
    }

    customElements.define('typed-button', TypedButton, { extends: 'button' });

    const btn = document.createElement('button', { is: 'typed-button' });
    testing.expectEqual(1, constructorCalled);
    testing.expectEqual(true, btn instanceof TypedButton);
    testing.expectEqual(true, btn instanceof HTMLButtonElement);
    testing.expectEqual('BUTTON', btn.tagName);
    testing.expectEqual(true, btn.custom);
}

// Directly constructing a built-in interface is unsupported, and Chrome names
// the interface when it refuses: `new HTMLDivElement()` is "Failed to construct
// 'HTMLDivElement': Illegal constructor" and the bare call points at the
// operator. Measured on Chrome 151 over every constructor on the window
// (probes/probe-ctor-sweep.js); Chrome has no empty constructor message at all.
// Both forms used to leak here, because one shared callback serves the whole
// family: `new` threw a TypeError with an empty message, and the bare call
// named HTMLElement whatever subclass was called.
{
    const useNew = (n) => `TypeError: Failed to construct '${n}': Please use the 'new' ` +
        'operator, this DOM object constructor cannot be called as a function.';
    const raised = (fn) => {
        try {
            fn();
        } catch (e) {
            return `${e.name}: ${e.message}`;
        }
        return null;
    };

    // Chrome answers the plain call with a bare "Illegal constructor" for these
    // two: neither is a valid custom element base, so neither carries Blink's
    // [HTMLConstructor] and neither has a constructor callback to reach
    // (measured, same probe).
    const noHtmlConstructor = ['HTMLMediaElement', 'HTMLUnknownElement'];
    // Left out rather than asserted: Chrome has a distinct interface object per
    // legacy factory function (window.Audio is not window.HTMLAudioElement),
    // where this engine has one object under both names. So `new
    // HTMLAudioElement()` builds an element here and is refused in Chrome --
    // a missing interface, not a message this change can word differently.
    const legacyFactoryAlias = ['HTMLAudioElement', 'HTMLImageElement', 'HTMLOptionElement'];

    const names = Object.getOwnPropertyNames(window)
        .filter((n) => n.startsWith('HTML') && typeof window[n] === 'function')
        .filter((n) => window[n] !== HTMLElement &&
            HTMLElement.prototype.isPrototypeOf(window[n].prototype))
        .filter((n) => !legacyFactoryAlias.includes(n));
    // The sweep only means something if it really walked the family.
    testing.expectTrue(names.length > 60);
    testing.expectTrue(names.includes('HTMLDivElement'));
    testing.expectTrue(names.includes('HTMLUnknownElement'));

    for (const name of names) {
        const ctor = window[name];
        testing.expectEqual(`TypeError: Failed to construct '${name}': Illegal constructor`,
            raised(() => new ctor()), { label: name });
        testing.expectEqual(
            noHtmlConstructor.includes(name) ? 'TypeError: Illegal constructor' : useNew(name),
            raised(() => ctor()), { label: name });
    }

    // HTMLElement itself has its own constructor (a custom element reaches it
    // through super()), and its refusal used to be an Error rather than a
    // TypeError with no interface named.
    testing.expectEqual("TypeError: Failed to construct 'HTMLElement': Illegal constructor",
        raised(() => new HTMLElement()));
    testing.expectEqual(useNew('HTMLElement'), raised(() => HTMLElement()));
}

{
    let connectedCount = 0;
    let disconnectedCount = 0;
    let attributeChanges = [];

    class LifecycleButton extends HTMLElement {
        static get observedAttributes() {
            return ['data-test'];
        }

        connectedCallback() {
            connectedCount++;
        }

        disconnectedCallback() {
            disconnectedCount++;
        }

        attributeChangedCallback(name, oldValue, newValue) {
            attributeChanges.push({ name, oldValue, newValue });
        }
    }

    customElements.define('lifecycle-button', LifecycleButton, { extends: 'button' });

    const btn = document.createElement('button', { is: 'lifecycle-button' });
    testing.expectEqual(0, connectedCount);

    document.body.appendChild(btn);
    testing.expectEqual(1, connectedCount);

    btn.setAttribute('data-test', 'value1');
    testing.expectEqual(1, attributeChanges.length);
    testing.expectEqual('data-test', attributeChanges[0].name);
    testing.expectEqual(null, attributeChanges[0].oldValue);
    testing.expectEqual('value1', attributeChanges[0].newValue);

    btn.remove();
    testing.expectEqual(1, disconnectedCount);
}
</script>

<script>
{
    let constructorCalled = 0;
    let connectedCalled = 0;

    class ParsedButton extends HTMLElement {
        constructor() {
            super();
            constructorCalled++;
        }

        connectedCallback() {
            connectedCalled++;
        }
    }

    customElements.define('parsed-button', ParsedButton, { extends: 'button' });
}
</script>
<button is="parsed-button" id="parsed"></button>
<script>
{
    const btn = document.getElementById('parsed');
    testing.expectEqual('BUTTON', btn.tagName);
}
</script>
