<script id=getRandomValues>
  function isRandom(ta) {
    let uniq = new Set(Array.from(ta));
    testing.expectEqual(true, (uniq.size / ta.length) * 100 > 0.7)
  }
  {
    let tu8a = new Uint8Array(100)
    testing.expectEqual(tu8a, crypto.getRandomValues(tu8a))
    isRandom(tu8a)

    let ti8a = new Int8Array(100)
    testing.expectEqual(ti8a, crypto.getRandomValues(ti8a))
    isRandom(ti8a)

    let tu8ca = new Uint8ClampedArray(100)
    testing.expectEqual(tu8ca, crypto.getRandomValues(tu8ca))
    isRandom(tu8ca)
  }

  {
    let tu16a = new Uint16Array(100)
    testing.expectEqual(tu16a, crypto.getRandomValues(tu16a))
    isRandom(tu16a)

    let ti16a = new Int16Array(100)
    testing.expectEqual(ti16a, crypto.getRandomValues(ti16a))
    isRandom(ti16a)
  }

  {
    let tu32a = new Uint32Array(100)
    testing.expectEqual(tu32a, crypto.getRandomValues(tu32a))
    isRandom(tu32a)

    let ti32a = new Int32Array(100)
    testing.expectEqual(ti32a, crypto.getRandomValues(ti32a))
    isRandom(ti32a)
  }

  {
    let tu64a = new BigUint64Array(100)
    testing.expectEqual(tu64a, crypto.getRandomValues(tu64a))
    isRandom(tu64a)

    let ti64a = new BigInt64Array(100)
    testing.expectEqual(ti64a, crypto.getRandomValues(ti64a))
    isRandom(ti64a)
  }
</script>

<script id=sign-and-verify-hmac type=module>
  const state = await testing.async();
  let key = await crypto.subtle.generateKey(
    {
      name: "HMAC",
      hash: { name: "SHA-512" },
    },
    true,
    ["sign", "verify"],
  );

  const raw = await crypto.subtle.exportKey("raw", key);

  const encoder = new TextEncoder();

  const signature = await crypto.subtle.sign(
    "HMAC",
    key,
    encoder.encode("Hello, world!")
  );

  const result = await window.crypto.subtle.verify(
    { name: "HMAC" },
    key,
    signature,
    encoder.encode("Hello, world!")
  );

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, key instanceof CryptoKey);
    testing.expectEqual(128, raw.byteLength);
    testing.expectEqual(true, signature instanceof ArrayBuffer);
    testing.expectEqual(true, result);
  });
</script>

<script id=derive-shared-key-x25519 type=module>

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, privateKey instanceof CryptoKey);
    testing.expectEqual(true, publicKey instanceof CryptoKey);
    testing.expectEqual(16, sharedKey.byteLength);
  });
</script>

<script id=aes-ctr-counter-wrap type=module>
  const state = await testing.async();
  // AES-CTR must increment only the rightmost `length` bits of the counter
  // block and leave the nonce bits fixed when that sub-counter wraps. Use a
  // 1-bit counter so it wraps after two blocks, and check each block's
  // keystream against an independent single-block encryption (the
  // non-wrapping path, used here as the oracle).
  const key = await crypto.subtle.importKey(
    "raw", new Uint8Array(16), { name: "AES-CTR" }, false, ["encrypt", "decrypt"],
  );

  // Counter with the low bit set; the wrap target is the same block with the
  // low bit cleared (which differs from a naive +1 carry).
  const counter = new Uint8Array(16); counter[15] = 0x01;
  const counter0 = new Uint8Array(16);

  const enc = (ctr, bits, data) =>
    crypto.subtle.encrypt({ name: "AES-CTR", counter: ctr, length: bits }, key, data);

  const ks1 = new Uint8Array(await enc(counter, 128, new Uint8Array(16)));
  const ks2 = new Uint8Array(await enc(counter0, 128, new Uint8Array(16)));
  const full = new Uint8Array(await enc(counter, 1, new Uint8Array(32)));

  // A message longer than the counter space (here 2 blocks for a 1-bit
  // counter) must reject rather than reuse counter values.
  let overLengthError = null;
  try {
    await enc(counter0, 1, new Uint8Array(48));
  } catch (err) {
    overLengthError = err;
  }

  state.resolve();
  await state.done(() => {
    testing.expectEqual(ks1.join(","), full.slice(0, 16).join(","));
    testing.expectEqual(ks2.join(","), full.slice(16).join(","));

    testing.expectEqual(true, overLengthError !== null);
    testing.expectEqual("OperationError", overLengthError.name);
  });
</script>

<script id=hmac-verify-length-mismatch type=module>
  const state = await testing.async();
  // A signature whose length differs from the MAC resolves to false rather
  // than rejecting (and a truncated-but-matching prefix must not pass).
  const key = await crypto.subtle.generateKey(
    { name: "HMAC", hash: "SHA-256" }, true, ["sign", "verify"],
  );
  const data = new TextEncoder().encode("over 9000");
  const sig = await crypto.subtle.sign("HMAC", key, data);

  const verifyFull = await crypto.subtle.verify("HMAC", key, sig, data);
  const verifyTruncated = await crypto.subtle.verify("HMAC", key, sig.slice(0, 16), data);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, verifyFull);
    testing.expectEqual(false, verifyTruncated);
  });
</script>

<script>
  // helper: runs generateKey and captures the rejection's error name (or null
  // if it unexpectedly resolved). Returns { algo, expected, actual } so the
  // caller can assert synchronously inside state.done.
  window.captureGenKeyReject = async function(algo, extractable, usages, expected) {
    try {
      await crypto.subtle.generateKey(algo, extractable, usages);
      return { algo, expected, actual: null };
    } catch (err) {
      return { algo, expected, actual: err.name };
    }
  };

  // assert a list of capture results synchronously.
  window.assertGenKeyRejects = function(results) {
    for (const r of results) {
      testing.expectEqual(r.expected, r.actual);
    }
  };
</script>

<script id=generateKey-unrecognized-algorithm type=module>
  const state = await testing.async();
  // Unknown name (string and object form) -> NotSupportedError.
  // Empty algorithm dictionary -> TypeError (missing required `name`).
  const results = [
    await captureGenKeyReject("AES", true, ["encrypt"], "NotSupportedError"),
    await captureGenKeyReject({ name: "AES" }, true, ["encrypt"], "NotSupportedError"),
    await captureGenKeyReject({ name: "AES-CMAC", length: 128 }, true, ["encrypt"], "NotSupportedError"),
    await captureGenKeyReject({ name: "EC", namedCurve: "P-256" }, true, ["sign"], "NotSupportedError"),
    await captureGenKeyReject({}, true, ["encrypt"], "TypeError"),
  ];
  state.resolve();
  await state.done(() => {
    assertGenKeyRejects(results);
  });
</script>

<script id=generateKey-aes-validation type=module>
  const state = await testing.async();
  const results = [];
  // Bad usages: SyntaxError.
  results.push(await captureGenKeyReject({ name: "AES-CBC", length: 128 }, true, ["sign"], "SyntaxError"));
  results.push(await captureGenKeyReject({ name: "AES-GCM", length: 128 }, true, ["encrypt", "deriveBits"], "SyntaxError"));
  // AES-KW only allows wrapKey / unwrapKey.
  results.push(await captureGenKeyReject({ name: "AES-KW", length: 128 }, true, ["encrypt"], "SyntaxError"));

  // Bad length: OperationError.
  for (const length of [64, 127, 129, 255, 257, 512]) {
    results.push(await captureGenKeyReject({ name: "AES-CBC", length }, true, ["encrypt"], "OperationError"));
  }

  // Empty usages on a secret key: SyntaxError.
  results.push(await captureGenKeyReject({ name: "AES-CBC", length: 128 }, true, [], "SyntaxError"));
  results.push(await captureGenKeyReject({ name: "AES-KW", length: 256 }, true, [], "SyntaxError"));

  state.resolve();
  await state.done(() => {
    assertGenKeyRejects(results);
  });
</script>

<script id=generateKey-rsa-validation type=module>
  const state = await testing.async();
  const goodExp = new Uint8Array([1, 0, 1]); // 65537

  const results = [
    // Bad name: NotSupportedError.
    await captureGenKeyReject(
      { name: "RSA", hash: "SHA-256", modulusLength: 2048, publicExponent: goodExp },
      true, ["sign"], "NotSupportedError",
    ),
    // Bad hash: NotSupportedError.
    await captureGenKeyReject(
      { name: "RSA-PSS", hash: "SHA", modulusLength: 2048, publicExponent: goodExp },
      true, ["sign"], "NotSupportedError",
    ),
    // Bad usages: SyntaxError. RSASSA only allows sign/verify.
    await captureGenKeyReject(
      { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256", modulusLength: 2048, publicExponent: goodExp },
      true, ["encrypt"], "SyntaxError",
    ),
    // RSA-OAEP only allows encrypt/decrypt/wrapKey/unwrapKey.
    await captureGenKeyReject(
      { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 2048, publicExponent: goodExp },
      true, ["sign"], "SyntaxError",
    ),
    // Bad publicExponent: OperationError.
    await captureGenKeyReject(
      { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 2048, publicExponent: new Uint8Array([1]) },
      true, ["encrypt"], "OperationError",
    ),
    await captureGenKeyReject(
      { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 0]) },
      true, ["encrypt"], "OperationError",
    ),
    // Empty usages: SyntaxError.
    await captureGenKeyReject(
      { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 2048, publicExponent: goodExp },
      true, [], "SyntaxError",
    ),
  ];
  state.resolve();
  await state.done(() => {
    assertGenKeyRejects(results);
  });
</script>

<script id=generateKey-hmac-validation type=module>
  const state = await testing.async();
  // Unknown hash: NotSupportedError.
  // Bad usages: SyntaxError. HMAC only allows sign/verify.
  // Empty usages: SyntaxError.
  // A present, zero length is an OperationError (not a zero-byte key).
  const results = [
    await captureGenKeyReject({ name: "HMAC", hash: "MD5" }, true, ["sign"], "NotSupportedError"),
    await captureGenKeyReject({ name: "HMAC", hash: "SHA-256" }, true, ["encrypt"], "SyntaxError"),
    await captureGenKeyReject({ name: "HMAC", hash: "SHA-256" }, true, ["sign", "deriveBits"], "SyntaxError"),
    await captureGenKeyReject({ name: "HMAC", hash: "SHA-256" }, true, [], "SyntaxError"),
    await captureGenKeyReject({ name: "HMAC", hash: "SHA-256", length: 0 }, true, ["sign"], "OperationError"),
  ];

  // An explicit length overrides the hash block size (256 bits -> 32 bytes).
  const sized = await crypto.subtle.generateKey(
    { name: "HMAC", hash: "SHA-256", length: 256 }, true, ["sign", "verify"],
  );
  const sizedRaw = await crypto.subtle.exportKey("raw", sized);

  state.resolve();
  await state.done(() => {
    assertGenKeyRejects(results);
    testing.expectEqual(32, sizedRaw.byteLength);
  });
</script>

<script id="digest" type=module>
  const state = await testing.async();
  async function hash(algo, data) {
    const buffer = await window.crypto.subtle.digest(algo, new TextEncoder().encode(data));
    return [...new Uint8Array(buffer)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  const sha1 = await hash('sha-1', 'over 9000');
  const sha256 = await hash('sha-256', 'over 9000');
  const sha384 = await hash('sha-384', 'over 9000');
  const sha512 = await hash('sha-512', 'over 9000');

  state.resolve();
  await state.done(() => {
    testing.expectEqual("a6a1e3375239f215f09a156df29c17c7d1ac6722", sha1);
    testing.expectEqual("1bc375bb92459685194dda18a4b835f4e2972ec1bde6d9ab3db53fcc584a6580", sha256);
    testing.expectEqual("a4260d64c2eea9fd30c1f895c5e48a26d817e19d3a700b61b3ce665864ff4b8e012bd357d345aa614c5f642dab865ea1", sha384);
    testing.expectEqual("6cad17e6f3f76680d6dd18ed043b75b4f6e1aa1d08b917294942e882fb6466c3510948c34af8b903ed0725b582b3b39c0e485ae2c1b7dfdb192ee38b79c782b6", sha512);
  });
</script>

<script>
  // Helper for worker-based crypto tests. Spawns a worker, waits for it to
  // signal readiness, then sends `kind` and forwards the worker's reply to
  // `state.resolve`. Avoids racing worker startup, which matters on slow CI.
  window.runCryptoInWorker = function(kind, state) {
    const worker = new Worker('./crypto-worker.js');
    worker.onmessage = (e) => {
      if (e.data && e.data.ready) {
        worker.postMessage({ kind });
        return;
      }
      state.resolve(e.data);
    };
  };
</script>

<script id=generateKey-rsa-pairs type=module>
  // Every value below is what a headed Chrome 150 answers (probe-g25). The RSA
  // family used to reject NotSupportedError outright, which is what left
  // browserscan's value cards empty (README `## G23`).
  {
    const state = await testing.async();
    const exp = new Uint8Array([1, 0, 1]);
    const gen = (name, usages) => crypto.subtle.generateKey(
      { name, hash: "SHA-256", modulusLength: 2048, publicExponent: exp }, true, usages,
    );

    // Recorded rather than awaited bare: a rejection here has to reach the
    // assertions as a value, not tear the block down before they run.
    const out = {};
    try {
    const oaep = await gen("RSA-OAEP", ["encrypt", "decrypt"]);
    out.oaep_public_type = oaep.publicKey.type;
    out.oaep_private_type = oaep.privateKey.type;
    out.oaep_name = oaep.publicKey.algorithm.name;
    out.oaep_modulus = oaep.publicKey.algorithm.modulusLength;
    out.oaep_hash = oaep.publicKey.algorithm.hash.name;
    out.oaep_exponent = Array.from(oaep.publicKey.algorithm.publicExponent).join(",");
    // The pair splits the requested usages: each key keeps only its own.
    out.oaep_public_usages = oaep.publicKey.usages.join(",");
    out.oaep_private_usages = oaep.privateKey.usages.join(",");
    // `usages` is an `object` in the IDL, not a FrozenArray, and Chrome hands it
    // back extensible (measured, probes/frozen-array-surfaces.js) -- unlike
    // every FrozenArray in this engine. The guard is here so the freeze does not
    // spread to a member that never had it.
    out.oaep_public_usages_frozen = Object.isFrozen(oaep.publicKey.usages);
    out.oaep_public_extractable = oaep.publicKey.extractable;
    out.oaep_private_extractable = oaep.privateKey.extractable;
    // A pair is two distinct keys, not one object handed back twice.
    out.oaep_distinct = oaep.publicKey !== oaep.privateKey;

    const pkcs1 = await gen("RSASSA-PKCS1-v1_5", ["sign", "verify"]);
    out.pkcs1_name = pkcs1.privateKey.algorithm.name;
    out.pkcs1_private_usages = pkcs1.privateKey.usages.join(",");
    out.pkcs1_public_usages = pkcs1.publicKey.usages.join(",");

    const pss = await gen("RSA-PSS", ["sign", "verify"]);
    out.pss_name = pss.privateKey.algorithm.name;
    out.pss_private_type = pss.privateKey.type;

    // A non-extractable pair still reports its public half as extractable.
    const sealed = await crypto.subtle.generateKey(
      { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 2048, publicExponent: exp },
      false, ["encrypt", "decrypt"],
    );
    out.sealed_public_extractable = sealed.publicKey.extractable;
    out.sealed_private_extractable = sealed.privateKey.extractable;
    } catch (e) { out.threw = `${e.name}: ${e.message}`; }

    state.resolve(out);
    await state.done((o) => {
      testing.expectEqual(undefined, o.threw);
      testing.expectEqual("public", o.oaep_public_type);
      testing.expectEqual("private", o.oaep_private_type);
      testing.expectEqual("RSA-OAEP", o.oaep_name);
      testing.expectEqual(2048, o.oaep_modulus);
      testing.expectEqual("SHA-256", o.oaep_hash);
      testing.expectEqual("1,0,1", o.oaep_exponent);
      testing.expectEqual("encrypt", o.oaep_public_usages);
      testing.expectEqual("decrypt", o.oaep_private_usages);
      testing.expectEqual(false, o.oaep_public_usages_frozen);
      testing.expectEqual(true, o.oaep_public_extractable);
      testing.expectEqual(true, o.oaep_private_extractable);
      testing.expectEqual(true, o.oaep_distinct);
      testing.expectEqual("RSASSA-PKCS1-v1_5", o.pkcs1_name);
      testing.expectEqual("sign", o.pkcs1_private_usages);
      testing.expectEqual("verify", o.pkcs1_public_usages);
      testing.expectEqual("RSA-PSS", o.pss_name);
      testing.expectEqual("private", o.pss_private_type);
      testing.expectEqual(true, o.sealed_public_extractable);
      testing.expectEqual(false, o.sealed_private_extractable);
    });
  }
</script>

<script id=exportKey-rsa-der type=module>
  // The DER export formats, measured against a headed Chrome 150 (probe-g25).
  // browserscan exports the public half as `spki` before it POSTs, so a
  // rejection here is as fatal to the value cards as a failed generateKey.
  {
    const state = await testing.async();
    const exp = new Uint8Array([1, 0, 1]);
    const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
    const gen = (extractable) => crypto.subtle.generateKey(
      { name: "RSA-OAEP", hash: "SHA-256", modulusLength: 2048, publicExponent: exp },
      extractable, ["encrypt", "decrypt"],
    );
    // A rejection has to arrive at the assertions as a value; awaiting it bare
    // would tear the block down before they run.
    const rejectsWith = async (fn) => {
      try {
        await fn();
        return "RESOLVED";
      } catch (e) {
        return e.name;
      }
    };

    const out = {};
    try {
      const pair = await gen(true);

      const spki = await crypto.subtle.exportKey("spki", pair.publicKey);
      out.spki_length = spki.byteLength;
      out.spki_prefix = b64(spki.slice(0, 12));

      const pkcs8 = await crypto.subtle.exportKey("pkcs8", pair.privateKey);
      // Chrome reports ~1218 bytes; assert the shape, not an exact DER length.
      out.pkcs8_plausible = pkcs8.byteLength > 1000;

      // Each DER format names one half of the pair. Chrome refuses the other
      // half rather than deriving it.
      out.spki_of_private = await rejectsWith(() => crypto.subtle.exportKey("spki", pair.privateKey));
      out.pkcs8_of_public = await rejectsWith(() => crypto.subtle.exportKey("pkcs8", pair.publicKey));

      const sealed = await gen(false);
      out.sealed_pkcs8 = await rejectsWith(() => crypto.subtle.exportKey("pkcs8", sealed.privateKey));
      // ...but the public half of a sealed pair is extractable, so it exports.
      const sealed_spki = await crypto.subtle.exportKey("spki", sealed.publicKey);
      out.sealed_spki_length = sealed_spki.byteLength;
    } catch (e) {
      out.threw = `${e.name}: ${e.message}`;
    }

    state.resolve(out);
    await state.done((o) => {
      testing.expectEqual(undefined, o.threw);
      testing.expectEqual(294, o.spki_length);
      testing.expectEqual("MIIBIjANBgkqhkiG", o.spki_prefix);
      testing.expectEqual(true, o.pkcs8_plausible);
      testing.expectEqual("InvalidAccessError", o.spki_of_private);
      testing.expectEqual("InvalidAccessError", o.pkcs8_of_public);
      testing.expectEqual("InvalidAccessError", o.sealed_pkcs8);
      testing.expectEqual(294, o.sealed_spki_length);
    });
  }
</script>

<script id=importKey-rsa-der type=module>
  // DER import, measured against a headed Chrome 150 (probe-g25). The round
  // trip is generate -> export -> import, so a failure here is the import and
  // not a stale test vector.
  {
    const state = await testing.async();
    const exp = new Uint8Array([1, 0, 1]);
    const gen = (name, usages) => crypto.subtle.generateKey(
      { name, hash: "SHA-256", modulusLength: 2048, publicExponent: exp }, true, usages,
    );
    const rejectsWith = async (fn) => {
      try {
        await fn();
        return "RESOLVED";
      } catch (e) {
        return e.name;
      }
    };

    const out = {};
    try {
      const oaep = await gen("RSA-OAEP", ["encrypt", "decrypt"]);

      const spki = await crypto.subtle.exportKey("spki", oaep.publicKey);
      const pub_key = await crypto.subtle.importKey(
        "spki", spki, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"],
      );
      // The modulus is read off the parsed key, not echoed from the request.
      out.spki_round_trip = [pub_key.type, pub_key.algorithm.name, pub_key.algorithm.modulusLength].join("/");
      out.spki_hash = pub_key.algorithm.hash.name;
      out.spki_usages = pub_key.usages.join(",");
      // An imported key re-exports to the same DER it came from.
      const reexported = await crypto.subtle.exportKey("spki", pub_key);
      out.spki_stable = new Uint8Array(reexported).join(",") === new Uint8Array(spki).join(",");

      const pkcs8 = await crypto.subtle.exportKey("pkcs8", oaep.privateKey);
      const priv_key = await crypto.subtle.importKey(
        "pkcs8", pkcs8, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["decrypt"],
      );
      out.pkcs8_round_trip = [priv_key.type, priv_key.algorithm.name].join("/");

      // The algorithm comes from the caller, not the DER: the same SPKI reads
      // back as whichever RSA algorithm was asked for.
      const pkcs1 = await gen("RSASSA-PKCS1-v1_5", ["sign", "verify"]);
      const pkcs1_spki = await crypto.subtle.exportKey("spki", pkcs1.publicKey);
      const pkcs1_key = await crypto.subtle.importKey(
        "spki", pkcs1_spki, { name: "RSASSA-PKCS1-v1_5", hash: "SHA-256" }, true, ["verify"],
      );
      out.pkcs1_round_trip = [pkcs1_key.type, pkcs1_key.algorithm.name].join("/");

      out.garbage_spki = await rejectsWith(() => crypto.subtle.importKey(
        "spki", new Uint8Array([1, 2, 3, 4]), { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"],
      ));
      out.garbage_pkcs8 = await rejectsWith(() => crypto.subtle.importKey(
        "pkcs8", new Uint8Array([1, 2, 3, 4]), { name: "RSA-OAEP", hash: "SHA-256" }, true, ["decrypt"],
      ));
      // A usage the algorithm doesn't own is still a SyntaxError on import.
      out.bad_usage = await rejectsWith(() => crypto.subtle.importKey(
        "spki", spki, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["sign"],
      ));
    } catch (e) {
      out.threw = `${e.name}: ${e.message}`;
    }

    state.resolve(out);
    await state.done((o) => {
      testing.expectEqual(undefined, o.threw);
      testing.expectEqual("public/RSA-OAEP/2048", o.spki_round_trip);
      testing.expectEqual("SHA-256", o.spki_hash);
      testing.expectEqual("encrypt", o.spki_usages);
      testing.expectEqual(true, o.spki_stable);
      testing.expectEqual("private/RSA-OAEP", o.pkcs8_round_trip);
      testing.expectEqual("public/RSASSA-PKCS1-v1_5", o.pkcs1_round_trip);
      testing.expectEqual("DataError", o.garbage_spki);
      testing.expectEqual("DataError", o.garbage_pkcs8);
      testing.expectEqual("SyntaxError", o.bad_usage);
    });
  }
</script>

<script id=jwk-rsa type=module>
  // JSON Web Key export/import for the RSA family. The public field values are
  // what a headed Chrome 150 answers (probe-g25: `RSA/RSA-OAEP-256/AQAB/true/342`);
  // the private key set is Chrome's too. The public key set is that private set
  // minus the six private components.
  {
    const state = await testing.async();
    const exp = new Uint8Array([1, 0, 1]);
    const gen = (name, hash, usages) => crypto.subtle.generateKey(
      { name, hash, modulusLength: 2048, publicExponent: exp }, true, usages,
    );
    const rejectsWith = async (fn) => {
      try {
        await fn();
        return "RESOLVED";
      } catch (e) {
        return e.name;
      }
    };
    const keys = (o) => Object.keys(o).sort().join(",");

    const out = {};
    try {
      const oaep = await gen("RSA-OAEP", "SHA-256", ["encrypt", "decrypt"]);

      const pub_jwk = await crypto.subtle.exportKey("jwk", oaep.publicKey);
      out.public_shape = [pub_jwk.kty, pub_jwk.alg, pub_jwk.e, String(pub_jwk.ext), (pub_jwk.n || "").length].join("/");
      out.public_keys = keys(pub_jwk);
      out.public_key_ops = (pub_jwk.key_ops || []).join(",");

      const priv_jwk = await crypto.subtle.exportKey("jwk", oaep.privateKey);
      out.private_keys = keys(priv_jwk);
      // The private half carries the same modulus as the public one.
      out.same_modulus = priv_jwk.n === pub_jwk.n;

      // `alg` is a JWA name that tracks both the algorithm and the hash.
      const pkcs1 = await gen("RSASSA-PKCS1-v1_5", "SHA-256", ["sign", "verify"]);
      out.pkcs1_alg = (await crypto.subtle.exportKey("jwk", pkcs1.publicKey)).alg;
      const pss = await gen("RSA-PSS", "SHA-384", ["sign", "verify"]);
      out.pss_alg = (await crypto.subtle.exportKey("jwk", pss.publicKey)).alg;
      const sha1 = await gen("RSA-OAEP", "SHA-1", ["encrypt", "decrypt"]);
      out.sha1_alg = (await crypto.subtle.exportKey("jwk", sha1.publicKey)).alg;

      const back_pub = await crypto.subtle.importKey(
        "jwk", pub_jwk, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"],
      );
      out.public_round_trip = [back_pub.type, back_pub.algorithm.name, back_pub.algorithm.modulusLength].join("/");
      out.public_reexports = keys(await crypto.subtle.exportKey("jwk", back_pub)) === out.public_keys;
      // An imported public key marshals to the same SPKI as the original.
      const a = await crypto.subtle.exportKey("spki", oaep.publicKey);
      const b = await crypto.subtle.exportKey("spki", back_pub);
      out.spki_matches = new Uint8Array(a).join(",") === new Uint8Array(b).join(",");

      const back_priv = await crypto.subtle.importKey(
        "jwk", priv_jwk, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["decrypt"],
      );
      out.private_round_trip = [back_priv.type, back_priv.algorithm.name].join("/");
      const c = await crypto.subtle.exportKey("pkcs8", oaep.privateKey);
      const d = await crypto.subtle.exportKey("pkcs8", back_priv);
      out.pkcs8_matches = new Uint8Array(c).join(",") === new Uint8Array(d).join(",");

      out.bad_kty = await rejectsWith(() => crypto.subtle.importKey(
        "jwk", { kty: "EC", n: pub_jwk.n, e: pub_jwk.e },
        { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"],
      ));
      out.missing_n = await rejectsWith(() => crypto.subtle.importKey(
        "jwk", { kty: "RSA", e: pub_jwk.e }, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"],
      ));
    } catch (e) {
      out.threw = `${e.name}: ${e.message}`;
    }

    state.resolve(out);
    await state.done((o) => {
      testing.expectEqual(undefined, o.threw);
      testing.expectEqual("RSA/RSA-OAEP-256/AQAB/true/342", o.public_shape);
      testing.expectEqual("alg,e,ext,key_ops,kty,n", o.public_keys);
      testing.expectEqual("encrypt", o.public_key_ops);
      testing.expectEqual("alg,d,dp,dq,e,ext,key_ops,kty,n,p,q,qi", o.private_keys);
      testing.expectEqual(true, o.same_modulus);
      testing.expectEqual("RS256", o.pkcs1_alg);
      testing.expectEqual("PS384", o.pss_alg);
      testing.expectEqual("RSA-OAEP", o.sha1_alg);
      testing.expectEqual("public/RSA-OAEP/2048", o.public_round_trip);
      testing.expectEqual(true, o.public_reexports);
      testing.expectEqual(true, o.spki_matches);
      testing.expectEqual("private/RSA-OAEP", o.private_round_trip);
      testing.expectEqual(true, o.pkcs8_matches);
      testing.expectEqual("DataError", o.bad_kty);
      testing.expectEqual("DataError", o.missing_n);
    });
  }
</script>

<script id=encrypt-rsa-oaep type=module>
  // RSA-OAEP encrypt/decrypt, measured against a headed Chrome 150 (probe-g25).
  // browserscan wraps its fingerprint payload with exactly this before it POSTs.
  {
    const state = await testing.async();
    const exp = new Uint8Array([1, 0, 1]);
    const enc = new TextEncoder();
    const gen = (name, usages) => crypto.subtle.generateKey(
      { name, hash: "SHA-256", modulusLength: 2048, publicExponent: exp }, true, usages,
    );
    const rejectsWith = async (fn) => {
      try {
        await fn();
        return "RESOLVED";
      } catch (e) {
        return e.name;
      }
    };
    const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

    const out = {};
    try {
      const oaep = await gen("RSA-OAEP", ["encrypt", "decrypt"]);
      const algo = { name: "RSA-OAEP" };

      const ct = await crypto.subtle.encrypt(algo, oaep.publicKey, enc.encode("hello"));
      // One RSA block, whatever the plaintext length.
      out.ct_length = ct.byteLength;

      const round = await crypto.subtle.decrypt(
        algo, oaep.privateKey, await crypto.subtle.encrypt(algo, oaep.publicKey, enc.encode("hello g25")),
      );
      out.round_trip = new TextDecoder().decode(round);

      // OAEP seeds each block randomly, so the same plaintext encrypts twice
      // to two different ciphertexts.
      const same = enc.encode("same");
      out.randomised = b64(await crypto.subtle.encrypt(algo, oaep.publicKey, same)) !==
        b64(await crypto.subtle.encrypt(algo, oaep.publicKey, same));

      const label = enc.encode("lbl");
      const labelled = { name: "RSA-OAEP", label };
      const with_label = await crypto.subtle.decrypt(
        labelled, oaep.privateKey, await crypto.subtle.encrypt(labelled, oaep.publicKey, enc.encode("x")),
      );
      out.label_round_trip = new TextDecoder().decode(with_label);
      // The label is authenticated: decrypting without it fails.
      out.label_mismatch = await rejectsWith(async () => crypto.subtle.decrypt(
        algo, oaep.privateKey, await crypto.subtle.encrypt(labelled, oaep.publicKey, enc.encode("x")),
      ));

      // 2048-bit OAEP-SHA-256 holds 190 bytes; 500 does not fit in one block.
      out.too_long = await rejectsWith(() => crypto.subtle.encrypt(algo, oaep.publicKey, new Uint8Array(500)));

      // Each half of the pair keeps only its own usage.
      out.encrypt_with_private = await rejectsWith(() => crypto.subtle.encrypt(algo, oaep.privateKey, enc.encode("x")));
      out.decrypt_with_public = await rejectsWith(() => crypto.subtle.decrypt(algo, oaep.publicKey, ct));

      // A key generated for a different RSA algorithm is not an OAEP key.
      const pkcs1 = await gen("RSASSA-PKCS1-v1_5", ["sign", "verify"]);
      out.wrong_algorithm = await rejectsWith(() => crypto.subtle.encrypt(algo, pkcs1.publicKey, enc.encode("x")));
    } catch (e) {
      out.threw = `${e.name}: ${e.message}`;
    }

    state.resolve(out);
    await state.done((o) => {
      testing.expectEqual(undefined, o.threw);
      testing.expectEqual(256, o.ct_length);
      testing.expectEqual("hello g25", o.round_trip);
      testing.expectEqual(true, o.randomised);
      testing.expectEqual("x", o.label_round_trip);
      testing.expectEqual("OperationError", o.label_mismatch);
      testing.expectEqual("OperationError", o.too_long);
      testing.expectEqual("InvalidAccessError", o.encrypt_with_private);
      testing.expectEqual("InvalidAccessError", o.decrypt_with_public);
      testing.expectEqual("InvalidAccessError", o.wrong_algorithm);
    });
  }
</script>

<script id=sign-rsa type=module>
  // RSASSA-PKCS1-v1_5 and RSA-PSS sign/verify, measured against a headed
  // Chrome 150 (probe-g25). PKCS1 padding is deterministic; PSS salts each
  // signature, so the same message signs twice to two different signatures.
  {
    const state = await testing.async();
    const exp = new Uint8Array([1, 0, 1]);
    const enc = new TextEncoder();
    const msg = enc.encode("msg");
    const gen = (name, hash, usages) => crypto.subtle.generateKey(
      { name, hash, modulusLength: 2048, publicExponent: exp }, true, usages,
    );
    const rejectsWith = async (fn) => {
      try {
        await fn();
        return "RESOLVED";
      } catch (e) {
        return e.name;
      }
    };
    const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

    const out = {};
    try {
      const pkcs1 = await gen("RSASSA-PKCS1-v1_5", "SHA-256", ["sign", "verify"]);
      const p1 = { name: "RSASSA-PKCS1-v1_5" };

      const sig = await crypto.subtle.sign(p1, pkcs1.privateKey, msg);
      out.pkcs1_length = sig.byteLength;
      out.pkcs1_deterministic = b64(sig) === b64(await crypto.subtle.sign(p1, pkcs1.privateKey, msg));
      out.pkcs1_verify = await crypto.subtle.verify(p1, pkcs1.publicKey, sig, msg);
      out.pkcs1_tampered = await crypto.subtle.verify(p1, pkcs1.publicKey, sig, enc.encode("msh"));

      const pss = await gen("RSA-PSS", "SHA-256", ["sign", "verify"]);
      const ps = { name: "RSA-PSS", saltLength: 32 };
      const pss_sig = await crypto.subtle.sign(ps, pss.privateKey, msg);
      out.pss_length = pss_sig.byteLength;
      out.pss_verify = await crypto.subtle.verify(ps, pss.publicKey, pss_sig, msg);
      out.pss_tampered = await crypto.subtle.verify(ps, pss.publicKey, pss_sig, enc.encode("msh"));
      out.pss_randomised = b64(pss_sig) !== b64(await crypto.subtle.sign(ps, pss.privateKey, msg));

      // The hash comes from the key, not the call, so a key made for SHA-384
      // signs and verifies under SHA-384.
      const sha384 = await gen("RSASSA-PKCS1-v1_5", "SHA-384", ["sign", "verify"]);
      const sha384_sig = await crypto.subtle.sign(p1, sha384.privateKey, msg);
      out.sha384_verify = await crypto.subtle.verify(p1, sha384.publicKey, sha384_sig, msg);
      // ...and a signature made under one hash does not verify under another.
      out.cross_hash = await crypto.subtle.verify(p1, pkcs1.publicKey, sha384_sig, msg);

      // Each half of the pair keeps only its own usage.
      out.sign_with_public = await rejectsWith(() => crypto.subtle.sign(p1, pkcs1.publicKey, msg));
      out.verify_with_private = await rejectsWith(() => crypto.subtle.verify(p1, pkcs1.privateKey, sig, msg));
      // A PSS key is not a PKCS1 key, whatever the call asks for.
      out.wrong_algorithm = await rejectsWith(() => crypto.subtle.sign(p1, pss.privateKey, msg));
    } catch (e) {
      out.threw = `${e.name}: ${e.message}`;
    }

    state.resolve(out);
    await state.done((o) => {
      testing.expectEqual(undefined, o.threw);
      testing.expectEqual(256, o.pkcs1_length);
      testing.expectEqual(true, o.pkcs1_deterministic);
      testing.expectEqual(true, o.pkcs1_verify);
      testing.expectEqual(false, o.pkcs1_tampered);
      testing.expectEqual(256, o.pss_length);
      testing.expectEqual(true, o.pss_verify);
      testing.expectEqual(false, o.pss_tampered);
      testing.expectEqual(true, o.pss_randomised);
      testing.expectEqual(true, o.sha384_verify);
      testing.expectEqual(false, o.cross_hash);
      testing.expectEqual("InvalidAccessError", o.sign_with_public);
      testing.expectEqual("InvalidAccessError", o.verify_with_private);
      testing.expectEqual("InvalidAccessError", o.wrong_algorithm);
    });
  }
</script>

<script id=crypto_random_values_error_message>
{
  // Both getRandomValues rejections quote the argument back: the view's type
  // for the wrong-type one, and the byte length -- not the element count --
  // for the quota one. Measured against Chrome 151.
  const msg = (fn) => { try { fn(); return 'no throw'; } catch (e) { return `${e.name}: ${e.message}`; } };
  const pre = "Failed to execute 'getRandomValues' on 'Crypto': ";
  const wrong_type = (type) => 'TypeMismatchError: ' + pre +
    `The provided ArrayBufferView is of type '${type}', which is not an integer array type.`;

  testing.expectEqual(wrong_type('Float64'), msg(() => crypto.getRandomValues(new Float64Array(1))));
  testing.expectEqual(wrong_type('Float32'), msg(() => crypto.getRandomValues(new Float32Array(1))));
  testing.expectEqual(wrong_type('DataView'), msg(() => crypto.getRandomValues(new DataView(new ArrayBuffer(8)))));

  const quota = (bytes) => 'QuotaExceededError: ' + pre +
    `The ArrayBufferView's byte length (${bytes}) exceeds the number of bytes of entropy available via this API (65536).`;

  testing.expectEqual(quota(65537), msg(() => crypto.getRandomValues(new Uint8Array(65537))));
  // A Uint16Array is counted in bytes, so 65536 elements is 131072 bytes.
  testing.expectEqual(quota(131072), msg(() => crypto.getRandomValues(new Uint16Array(65536))));

  // Exactly at the limit is still fine, and a BigInt64Array is an integer type.
  testing.expectEqual(65536, crypto.getRandomValues(new Uint8Array(65536)).length);
  testing.expectEqual(1, crypto.getRandomValues(new BigInt64Array(1)).length);
}
</script>
