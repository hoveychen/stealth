<!DOCTYPE html>
<body></body>
<script src="../testing.js"></script>
<script id=createElement>
  testing.expectEqual(1, document.createElement.length);

  const div1 = document.createElement('div');
  testing.expectEqual(true, div1 instanceof HTMLDivElement);
  testing.expectEqual("DIV", div1.tagName);
  div1.id = "hello";
  testing.expectEqual(null, $('#hello'));

  const div2 = document.createElement('DIV');
  testing.expectEqual(true, div2 instanceof HTMLDivElement);

  document.getElementsByTagName('body')[0].appendChild(div1);
  testing.expectEqual(div1, $('#hello'));
</script>


<script id=createElement_missing_argument>
  // Blink counts the arguments before it converts any of them, and names both
  // the operation and the interface that declares it (measured on Chrome 151).
  // The bridge used to answer the generic "invalid argument" here, which no
  // browser says.
  testing.expectError(
    "TypeError: Failed to execute 'createElement' on 'Document': 1 argument required, but only 0 present.",
    () => document.createElement());
  testing.expectError(
    "TypeError: Failed to execute 'createTextNode' on 'Document': 1 argument required, but only 0 present.",
    () => document.createTextNode());
</script>
