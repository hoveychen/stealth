<!DOCTYPE html>
<script src="../testing.js"></script>

<body>

<script id=document_prototype_html_document_is_empty>
  {
    // Measured on a headed Chrome 150: HTMLDocument.prototype carries nothing
    // but `constructor`. Every document member lives one level up, on
    // Document.prototype. Detectors that read
    // Object.getOwnPropertyDescriptors(Document.prototype) look at that one
    // level only, so anything parked on HTMLDocument reads as missing.
    testing.expectEqual(['constructor'], Object.getOwnPropertyNames(HTMLDocument.prototype));
  }
</script>

<script id=document_prototype_owns_html_members>
  {
    const own = Object.getOwnPropertyNames(Document.prototype);
    for (const name of [
      'title', 'dir', 'body', 'head', 'images', 'embeds', 'plugins', 'links',
      'forms', 'scripts', 'currentScript', 'anchors', 'applets', 'all', 'doctype',
    ]) {
      testing.expectEqual(true, own.includes(name), { desc: 'Document.prototype owns ' + name });
    }
  }
</script>

<script id=document_prototype_no_lang>
  {
    // Chrome has no `lang` on documents at all: measured `'lang' in document`
    // is false there. It is an HTMLElement member only.
    testing.expectEqual(false, 'lang' in document);
    testing.expectEqual(undefined, document.lang);
  }
</script>

<script id=document_prototype_html_members_still_work>
  {
    // Moving the declaration must not change behaviour.
    testing.expectEqual('BODY', document.body.tagName);
    testing.expectEqual('HEAD', document.head.tagName);
    testing.expectEqual('HTMLCollection', document.images.constructor.name);
    testing.expectEqual('HTMLAllCollection', document.all.constructor.name);
    testing.expectEqual('html', document.doctype.name);
    document.dir = 'rtl';
    testing.expectEqual('rtl', document.documentElement.getAttribute('dir'));
  }
</script>


<script id=document_prototype_event_handlers>
  {
    // Every on* property a headed Chrome 150 owns on Document.prototype, in
    // Chrome's own order. Measured, not taken from the spec: Chrome ships
    // vendor-prefixed aliases (onwebkitanimationend, onwebkitfullscreenchange)
    // and legacy ones (onsearch, onfreeze) that no current spec lists.
    const expected = [
      'onreadystatechange', 'onpointerlockchange', 'onpointerlockerror', 'onbeforecopy',
      'onbeforecut', 'onbeforepaste', 'onfreeze', 'onprerenderingchange', 'onresume',
      'onsearch', 'onvisibilitychange', 'onfullscreenchange', 'onfullscreenerror',
      'onwebkitfullscreenchange', 'onwebkitfullscreenerror', 'onabort', 'onbeforeinput',
      'onbeforematch', 'onbeforetoggle', 'onblur', 'oncancel', 'oncanplay', 'oncanplaythrough',
      'onchange', 'onclick', 'onclose', 'oncommand', 'oncontentvisibilityautostatechange',
      'oncontextlost', 'oncontextmenu', 'oncontextrestored', 'oncuechange', 'ondblclick',
      'ondrag', 'ondragend', 'ondragenter', 'ondragleave', 'ondragover', 'ondragstart',
      'ondrop', 'ondurationchange', 'onemptied', 'onended', 'onerror', 'onfocus', 'onformdata',
      'oninput', 'oninvalid', 'onkeydown', 'onkeypress', 'onkeyup', 'onload', 'onloadeddata',
      'onloadedmetadata', 'onloadstart', 'onmousedown', 'onmouseenter', 'onmouseleave',
      'onmousemove', 'onmouseout', 'onmouseover', 'onmouseup', 'onmousewheel', 'onpause',
      'onplay', 'onplaying', 'onprogress', 'onratechange', 'onreset', 'onresize', 'onscroll',
      'onscrollend', 'onsecuritypolicyviolation', 'onseeked', 'onseeking', 'onselect',
      'onslotchange', 'onstalled', 'onsubmit', 'onsuspend', 'ontimeupdate', 'ontoggle',
      'onvolumechange', 'onwaiting', 'onwebkitanimationend', 'onwebkitanimationiteration',
      'onwebkitanimationstart', 'onwebkittransitionend', 'onwheel', 'onauxclick',
      'ongotpointercapture', 'onlostpointercapture', 'onpointerdown', 'onpointermove',
      'onpointerup', 'onpointercancel', 'onpointerover', 'onpointerout', 'onpointerenter',
      'onpointerleave', 'onselectstart', 'onselectionchange', 'onanimationcancel',
      'onanimationend', 'onanimationiteration', 'onanimationstart', 'ontransitionrun',
      'ontransitionstart', 'ontransitionend', 'ontransitioncancel', 'onbeforexrselect',
      'oncopy', 'oncut', 'onpaste', 'onpointerrawupdate', 'onscrollsnapchange',
      'onscrollsnapchanging'
    ];
    const own = Object.getOwnPropertyNames(Document.prototype);
    const missing = expected.filter((name) => !own.includes(name));
    testing.expectEqual([], missing);

    // ...and only those. Touch handlers are gated on a touch-capable device:
    // Chrome at navigator.maxTouchPoints === 0 has none of them, on Document or
    // anywhere else, so exposing them contradicts our own maxTouchPoints.
    testing.expectEqual(0, navigator.maxTouchPoints);
    const surplus = own.filter((name) => name.startsWith('on') && !expected.includes(name));
    testing.expectEqual([], surplus);
  }
</script>

<script id=document_prototype_event_handler_roundtrip>
  {
    // A generated handler must behave like the hand-written ones: readable back,
    // clearable with null, and actually invoked by dispatch.
    testing.expectEqual(null, document.onvisibilitychange);
    let seen = 0;
    const fn = () => { seen++; };
    document.onvisibilitychange = fn;
    testing.expectEqual(fn, document.onvisibilitychange);
    document.dispatchEvent(new Event('visibilitychange'));
    testing.expectEqual(1, seen);
    document.onvisibilitychange = null;
    testing.expectEqual(null, document.onvisibilitychange);
    document.dispatchEvent(new Event('visibilitychange'));
    testing.expectEqual(1, seen);
  }
</script>

</body>
</html>
