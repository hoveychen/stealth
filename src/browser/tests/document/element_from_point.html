<!DOCTYPE html>
<script src="../testing.js"></script>

<body>
  <div id="div1" style="width: 100px; height: 50px;">Div 1</div>
  <div id="div2" style="width: 100px; height: 50px;">Div 2</div>
  <div id="hidden" style="display: none; width: 100px; height: 50px;">Hidden</div>
  <div id="parent" style="width: 100px; height: 50px;">
    <div id="child" style="width: 80px; height: 30px;">Child</div>
  </div>
</body>

<script id="basic_usage">
{
  // Test finding an element at a specific point
  const div1 = document.getElementById('div1');
  const rect1 = div1.getBoundingClientRect();

  // Query near the top of div1 to avoid overlap with later elements
  const x = rect1.left + 10;
  const y = rect1.top + 5;
  const element = document.elementFromPoint(x, y);

  // Should return div1 or a parent (body/html) - not null
  testing.expectTrue(element !== null);
  // If it returns div1 specifically, that's ideal
  // But we also accept parent elements
  testing.expectTrue(element === div1 || element.tagName === 'BODY' || element.tagName === 'HTML');
}
</script>

<script id="nested_elements">
{
  // Test that nested elements are found (topmost in document order)
  const child = document.getElementById('child');
  const parent = document.getElementById('parent');
  const rect = child.getBoundingClientRect();

  const centerX = (rect.left + rect.right) / 2;
  const centerY = (rect.top + rect.bottom) / 2;
  const element = document.elementFromPoint(centerX, centerY);

  // Should return the child element (topmost in document order) or parent
  testing.expectTrue(element !== null);
  testing.expectTrue(element === child || element === parent ||
                     element.tagName === 'BODY' || element.tagName === 'HTML');
}
</script>

<script id="outside_viewport">
{
  // Test points outside all elements
  const element = document.elementFromPoint(-1000, -1000);
  testing.expectEqual(null, element);
}
</script>

<script id="at_element_center">
{
  // Test querying at the center of an element
  const div1 = document.getElementById('div1');
  const rect = div1.getBoundingClientRect();

  const centerX = (rect.left + rect.right) / 2;
  const centerY = (rect.top + rect.bottom) / 2;
  const element = document.elementFromPoint(centerX, centerY);

  // Should return div1 or one of its ancestors (body/html)
  testing.expectTrue(element !== null);
}
</script>

<script id="dynamically_created">
{
  // Test with dynamically created elements
  const newDiv = document.createElement('div');
  newDiv.style.width = '50px';
  newDiv.style.height = '50px';
  newDiv.textContent = 'Dynamic';
  document.body.appendChild(newDiv);

  const rect = newDiv.getBoundingClientRect();
  const centerX = (rect.left + rect.right) / 2;
  const centerY = (rect.top + rect.bottom) / 2;
  const element = document.elementFromPoint(centerX, centerY);

  testing.expectEqual(newDiv, element);

  // Clean up
  newDiv.remove();
}
</script>

<script id="hidden_is_never_the_answer">
{
  // The hit test has two conditions -- the box contains the point, and the
  // element is visible -- and it is free to check them in either order, so
  // this pins the answer rather than the order. An inline display:none beats
  // anything a stylesheet says, which is why it is what the box below uses.
  const box = document.createElement('div');
  box.style.width = '100px';
  box.style.height = '50px';
  box.textContent = 'Invisible';
  document.body.appendChild(box);

  const rect = box.getBoundingClientRect();
  const cx = (rect.left + rect.right) / 2;
  const cy = (rect.top + rect.bottom) / 2;

  // Sanity: while it is visible it is the answer, so the query really does
  // land on this element and the assertion below is about visibility alone.
  testing.expectEqual(box, document.elementFromPoint(cx, cy));

  box.style.display = 'none';
  const hit = document.elementFromPoint(cx, cy);
  testing.expectTrue(hit === null || hit !== box);
  for (const el of document.elementsFromPoint(cx, cy)) {
    testing.expectTrue(el !== box);
  }

  box.remove();
}
</script>

<script id="hit_test_does_not_cascade_every_element">
{
  // elementFromPoint walks the document in preorder, and under the faux layout
  // it has to ask every element it passes for a box. Asking each of them for a
  // computed visibility as well -- a CSS cascade plus selector matching, per
  // element, per call -- is what makes this quadratic in practice: kohls.com
  // calls it a few hundred times per load from an IntersectionObserver
  // handler, and at a cascade per element it never gets through them.
  //
  // Only the handful of boxes that contain the point can be the answer, so the
  // cascade belongs behind the box test rather than in front of it. Measured
  // here (debug build, Apple silicon): 5.0s for the loop below with the
  // cascade first, 0.04s with the box first.
  const sheet = document.createElement('style');
  let rules = '';
  for (let i = 0; i < 400; i++) {
    rules += '.c' + i + ' .d' + (i % 37) + ' span{display:block}\n';
  }
  sheet.textContent = rules;
  document.head.appendChild(sheet);

  const host = document.createElement('div');
  for (let i = 0; i < 400; i++) {
    const row = document.createElement('div');
    row.className = 'c' + i + ' c' + ((i * 7) % 400);
    const label = document.createElement('span');
    label.className = 'd' + (i % 37);
    label.textContent = 'row ' + i;
    row.appendChild(label);
    host.appendChild(row);
  }
  document.body.appendChild(host);

  // The tree above was built a statement ago, so the first call after it has
  // to fill the position tables -- one whole layout pass, which is not what
  // this budget is about and is what used to make it straddle 1500ms on a
  // loaded machine. Warm the tables outside the timer and charge the loop with
  // the per-call cost the comment above is describing.
  document.elementFromPoint(4000, 4000);

  const started = Date.now();
  for (let i = 0; i < 40; i++) {
    document.elementFromPoint(4000 + i, 4000);
  }
  const elapsed = Date.now() - started;

  host.remove();
  sheet.remove();

  if (elapsed >= 1500) {
    testing.fail('40 elementFromPoint calls over 800 elements took ' + elapsed + 'ms');
  }
  // Reached the end of the block, and the tree it built is gone again.
  testing.expectEqual(null, document.querySelector('.d36'));
}
</script>

<script id="hit_test_does_not_measure_every_paragraph">
{
  // The box the hit test asks each element for is mostly free -- except that an
  // element with no declared size gets one from its text, and getting a width
  // out of text means walking every character of it. The vertical half of the
  // test does not need that width: the height text contributes is the font's
  // own box, which is the same whatever the text says. So the walk has to stay
  // off the path that rejects an element on its y alone, which is all but a
  // handful of them.
  //
  // kohls.com is the page that made this the whole cost: ~1600 bytes of text
  // per element, ~1900 elements walked per call, a few hundred calls a load --
  // 76MB of text measured, 24s of a 25s run. Measured here (debug build,
  // Apple silicon): 6.6s for the loop below when the width is measured for
  // every element, 0.04s when it is measured only for the survivors.
  const host = document.createElement('div');
  const filler = 'Free shipping on orders over 49 dollars, no code needed. '.repeat(30);
  for (let i = 0; i < 400; i++) {
    const row = document.createElement('p');
    row.textContent = i + ': ' + filler;
    host.appendChild(row);
  }
  document.body.appendChild(host);

  // Same reason as the block above: the first call after those 400 appends
  // pays for a layout pass over 670KB of text (measured: 1445ms for this tree,
  // 72ms for the same tree with a thirtieth of the text), and that pass is not
  // what "does not measure every paragraph" is claiming. The 39 calls after it
  // cost 13ms whatever the text says, which is the claim.
  document.elementFromPoint(4000, 4000);

  const started = Date.now();
  for (let i = 0; i < 40; i++) {
    document.elementFromPoint(4000 + i, 4000);
  }
  const elapsed = Date.now() - started;

  host.remove();

  if (elapsed >= 1500) {
    testing.fail('40 elementFromPoint calls over 400 paragraphs took ' + elapsed + 'ms');
  }
  // Reached the end of the block, and the tree it built is gone again.
  testing.expectEqual(0, document.getElementsByTagName('p').length);
}
</script>

<script id="elementsFromPoint_basic">
{
  // Test that elementsFromPoint returns array of element and its ancestors
  const div1 = document.getElementById('div1');
  const rect = div1.getBoundingClientRect();

  const x = rect.left + 10;
  const y = rect.top + 5;
  const elements = document.elementsFromPoint(x, y);

  // Should return an array
  testing.expectTrue(Array.isArray(elements));
  testing.expectTrue(elements.length > 0);

  // First element should be div1 or one of its ancestors
  testing.expectTrue(elements[0] !== null);

  // All elements should be ancestors of each other (parent chain)
  for (let i = 1; i < elements.length; i++) {
    let found = false;
    let parent = elements[i - 1].parentElement;
    while (parent) {
      if (parent === elements[i]) {
        found = true;
        break;
      }
      parent = parent.parentElement;
    }
    testing.expectTrue(found || elements[i].tagName === 'HTML');
  }
}
</script>

<script id="elementsFromPoint_nested">
{
  // Test with nested elements - should return child, parent, body, html in order
  const child = document.getElementById('child');
  const parent = document.getElementById('parent');
  const rect = child.getBoundingClientRect();

  const centerX = (rect.left + rect.right) / 2;
  const centerY = (rect.top + rect.bottom) / 2;
  const elements = document.elementsFromPoint(centerX, centerY);

  testing.expectTrue(Array.isArray(elements));
  testing.expectTrue(elements.length >= 2); // At least child and parent (or more ancestors)

  // First element should be the deepest (child or parent)
  testing.expectTrue(elements[0] === child || elements[0] === parent ||
                     elements[0].tagName === 'BODY' || elements[0].tagName === 'HTML');

  // If we got child as first element, parent should be in the array
  if (elements[0] === child) {
    let foundParent = false;
    for (let el of elements) {
      if (el === parent) {
        foundParent = true;
        break;
      }
    }
    testing.expectTrue(foundParent);
  }
}
</script>

<script id="elementsFromPoint_order">
{
  // Test that elements are returned in order from topmost to deepest
  const child = document.getElementById('child');
  const parent = document.getElementById('parent');
  const rect = child.getBoundingClientRect();

  const centerX = (rect.left + rect.right) / 2;
  const centerY = (rect.top + rect.bottom) / 2;
  const elements = document.elementsFromPoint(centerX, centerY);

  // Elements should be ordered such that each element is a parent of the previous
  for (let i = 1; i < elements.length; i++) {
    const current = elements[i - 1];
    const next = elements[i];

    // next should be an ancestor of current
    let isAncestor = false;
    let p = current.parentElement;
    while (p) {
      if (p === next) {
        isAncestor = true;
        break;
      }
      p = p.parentElement;
    }

    testing.expectTrue(isAncestor || next.tagName === 'HTML');
  }
}
</script>

<script id="elementsFromPoint_outside">
{
  // Test with point outside all elements
  const elements = document.elementsFromPoint(-1000, -1000);

  testing.expectTrue(Array.isArray(elements));
  testing.expectEqual(0, elements.length);
}
</script>
