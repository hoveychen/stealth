<!DOCTYPE html>

</body>
<script src="../testing.js"></script>

<script id="offset_width_follows_the_text">
{
  // A text-bearing element with no width of its own is as wide as its text.
  // Every font-enumeration probe in the wild works by laying one of these out
  // twice and comparing, so an element whose width ignores its contents makes
  // the whole family of probes report nothing at all.
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;font-family:monospace;white-space:nowrap;';
  document.body.appendChild(span);

  span.textContent = 'm';
  const one = span.offsetWidth;
  span.textContent = 'mmmmmmmmmmlli';
  const thirteen = span.offsetWidth;
  span.textContent = 'mmmmmmmmmmlli'.repeat(4);
  const fiftytwo = span.offsetWidth;

  testing.expectTrue(one > 0);
  testing.expectTrue(thirteen > one);
  testing.expectTrue(fiftytwo > thirteen);
  // Monospace, so four copies of a string are four times as wide. offsetWidth
  // is an integer, and rounding the long run is not the same as rounding the
  // short one and multiplying, so the two can differ by up to 2 — the same
  // slack the reference Chrome shows (562 against 2247).
  testing.expectEqual(true, Math.abs(fiftytwo - 4 * thirteen) <= 2);
}
</script>

<script id="offset_width_follows_the_font_size">
{
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font-family:monospace;white-space:nowrap;';
  span.textContent = 'mmmmmmmmmmlli';
  document.body.appendChild(span);

  span.style.fontSize = '16px';
  const small = span.offsetWidth;
  span.style.fontSize = '72px';
  const large = span.offsetWidth;

  testing.expectTrue(small > 0);
  // Advances are linear in size, so the ratio is the ratio of the sizes.
  testing.expectEqual(true, Math.abs(large / small - 72 / 16) < 0.05);
}
</script>

<script id="offset_width_follows_the_font_family">
{
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;white-space:nowrap;';
  span.textContent = 'mmmmmmmmmmlli';
  document.body.appendChild(span);

  const widthOf = (family) => { span.style.fontFamily = family; return span.offsetWidth; };

  const monospace = widthOf('monospace');
  const sansSerif = widthOf('sans-serif');
  const serif = widthOf('serif');
  testing.expectTrue(monospace > 0 && sansSerif > 0 && serif > 0);
  testing.expectTrue(monospace !== sansSerif);
  testing.expectTrue(sansSerif !== serif);

  // The probe itself: a family we have metrics for shifts the width away from
  // the base it is listed against; one we do not falls through to the base and
  // measures exactly the same. Both halves matter -- a probe that reports every
  // font as present is as wrong as one that reports none.
  testing.expectTrue(widthOf('"Courier New", monospace') !== monospace);
  testing.expectEqual(monospace, widthOf('"Bogus Not A Font", monospace'));
  testing.expectEqual(sansSerif, widthOf('"Bogus Not A Font", sans-serif'));
}
</script>

<script id="font_enumeration_matches_the_reference_chrome">
{
  // The 65 names fingerprintjs2 shipped, which is still the list most probes
  // use, and the 26 of them the real macOS Chrome on the reference host detects.
  // Both measured, not chosen: tools/fingerprint/dump-fonts.mjs records the
  // table, and the same probe run against that Chrome produces exactly this set.
  // What the engine answers here IS its font list, so matching the set name for
  // name is the whole of the test -- detecting one extra is as wrong as missing
  // one, and an earlier table detected Arial Hebrew, which Chrome does not.
  const CANDIDATES = [
    'Andale Mono', 'Arial', 'Arial Black', 'Arial Hebrew', 'Arial MT', 'Arial Narrow',
    'Arial Rounded MT Bold', 'Arial Unicode MS', 'Bitstream Vera Sans Mono', 'Book Antiqua',
    'Bookman Old Style', 'Calibri', 'Cambria', 'Cambria Math', 'Century', 'Century Gothic',
    'Century Schoolbook', 'Comic Sans', 'Comic Sans MS', 'Consolas', 'Courier', 'Courier New',
    'Geneva', 'Georgia', 'Helvetica', 'Helvetica Neue', 'Impact', 'Lucida Bright',
    'Lucida Calligraphy', 'Lucida Console', 'Lucida Fax', 'LUCIDA GRANDE', 'Lucida Handwriting',
    'Lucida Sans', 'Lucida Sans Typewriter', 'Lucida Sans Unicode', 'Microsoft Sans Serif',
    'Monaco', 'Monotype Corsiva', 'MS Gothic', 'MS Outlook', 'MS PGothic',
    'MS Reference Sans Serif', 'MS Sans Serif', 'MS Serif', 'MYRIAD', 'MYRIAD PRO', 'Palatino',
    'Palatino Linotype', 'Segoe Print', 'Segoe Script', 'Segoe UI', 'Segoe UI Light',
    'Segoe UI Semibold', 'Segoe UI Symbol', 'Tahoma', 'Times', 'Times New Roman',
    'Times New Roman PS', 'Trebuchet MS', 'Verdana', 'Wingdings', 'Wingdings 2', 'Wingdings 3',
  ];
  const EXPECTED = [
    'Andale Mono', 'Arial', 'Arial Black', 'Arial Narrow', 'Arial Rounded MT Bold',
    'Arial Unicode MS', 'Comic Sans MS', 'Courier', 'Courier New', 'Geneva', 'Georgia',
    'Helvetica', 'Helvetica Neue', 'Impact', 'LUCIDA GRANDE', 'Microsoft Sans Serif', 'Monaco',
    'Palatino', 'Tahoma', 'Times', 'Times New Roman', 'Trebuchet MS', 'Verdana', 'Wingdings',
    'Wingdings 2', 'Wingdings 3',
  ];

  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;white-space:nowrap;';
  span.textContent = 'mmmmmmmmmmlli';
  document.body.appendChild(span);
  const ctx = document.createElement('canvas').getContext('2d');

  // Three bases, the way the real probes do it: each generic has a blind spot for
  // the family it is itself resolved from -- 'Times' hides behind serif, 'Menlo'
  // behind monospace -- so a name counts as present if any base moves.
  const BASES = ['monospace', 'sans-serif', 'serif'];
  const detected = { dom: [], canvas: [] };
  for (const name of CANDIDATES) {
    let dom = false;
    let canvas = false;
    for (const base of BASES) {
      span.style.fontFamily = base;
      const domBase = span.offsetWidth;
      span.style.fontFamily = '"' + name + '", ' + base;
      if (span.offsetWidth !== domBase) dom = true;

      ctx.font = '72px ' + base;
      const canvasBase = ctx.measureText('mmmmmmmmmmlli').width;
      ctx.font = '72px "' + name + '", ' + base;
      if (ctx.measureText('mmmmmmmmmmlli').width !== canvasBase) canvas = true;
    }
    if (dom) detected.dom.push(name);
    if (canvas) detected.canvas.push(name);
  }

  testing.expectEqual(EXPECTED, detected.canvas);
  // The DOM route has to answer the same set: a fingerprint that reads both and
  // gets two different font lists has found the engine.
  testing.expectEqual(EXPECTED, detected.dom);
}
</script>

<script id="offset_width_agrees_with_measure_text">
{
  // Both routes resolve the family through the same measured tables, so a
  // fingerprint that cross-checks them sees one browser rather than two.
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;white-space:nowrap;';
  span.textContent = 'mmmmmmmmmmlli';
  document.body.appendChild(span);
  const ctx = document.createElement('canvas').getContext('2d');

  for (const family of ['monospace', 'sans-serif', 'serif', 'Arial', '"Courier New"']) {
    span.style.fontFamily = family;
    ctx.font = '72px ' + family;
    testing.expectEqual(Math.round(ctx.measureText('mmmmmmmmmmlli').width), span.offsetWidth);
  }
}
</script>

<script id="offset_height_follows_the_font">
{
  // Height comes from the font's own box. It is not Chrome's line box -- that
  // adds a line gap we have no table for -- but a 72px line reporting the same
  // 5 pixels as an 8px one is not a rounding difference, it is a placeholder.
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font-family:serif;white-space:nowrap;';
  span.textContent = 'mmmmmmmmmmlli';
  document.body.appendChild(span);

  const heightAt = (size) => { span.style.fontSize = size; return span.offsetHeight; };
  const small = heightAt('16px');
  const large = heightAt('72px');

  testing.expectTrue(small > 0);
  testing.expectTrue(large > small);
  // Ascent and descent are linear in size, so the ratio tracks the sizes.
  testing.expectEqual(true, Math.abs(large / small - 72 / 16) < 0.2);

  // Height is a property of the font, not of how much text there is: one line
  // of one character is as tall as one line of fifty.
  span.style.fontSize = '72px';
  const one = span.offsetHeight;
  span.textContent = 'mmmmmmmmmmlli'.repeat(4);
  testing.expectEqual(one, span.offsetHeight);
}
</script>

<script id="an_explicit_height_still_wins">
{
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;font-family:serif;height:11px;';
  span.textContent = 'mmmmmmmmmmlli';
  document.body.appendChild(span);
  testing.expectEqual(11, span.offsetHeight);
}
</script>

<script id="an_explicit_width_still_wins">
{
  // Text measurement is the fallback for an element that has no width of its
  // own, not an override of one that has.
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;font-family:monospace;width:37px;';
  span.textContent = 'mmmmmmmmmmlli';
  document.body.appendChild(span);
  testing.expectEqual(37, span.offsetWidth);
}
</script>

<script id="a_quoted_generic_family_is_not_the_keyword">
{
  // `monospace` is a keyword; `'monospace'` is an ordinary family name, and no
  // face is called that, so it falls through to the standard font. Measured
  // against Chrome 151 both headed and headless: 'monospace' 620 where the bare
  // keyword is 564, 'sans-serif' 620 where the keyword is 648, and the same for
  // cursive and fantasy. `serif` is invisible here because the standard font IS
  // serif, which is why it is not in the list.
  //
  // A font-enumeration probe writes every candidate quoted, so an engine that
  // reads a quoted generic as the keyword reports a different width for
  // `'monospace'` than every real browser does.
  const span = document.createElement('span');
  span.style.cssText = 'position:absolute;left:-9999px;font-size:72px;white-space:nowrap;';
  span.textContent = 'mmmmmmmmmmlli';
  document.body.appendChild(span);
  const widthOf = (family) => { span.style.fontFamily = family; return span.offsetWidth; };

  const fallback = widthOf('bogus-not-a-font-12345');
  const report = [];
  for (const generic of ['monospace', 'sans-serif', 'cursive', 'fantasy']) {
    const bare = widthOf(generic);
    // The premise: the keyword resolves to a face of its own, so "quoting it
    // costs the keyword" is a question this measurement can answer at all.
    report.push(`${generic} bare-differs-from-fallback=${bare !== fallback}`);
    report.push(`'${generic}' is-fallback=${widthOf(`'${generic}'`) === fallback}`);
    report.push(`"${generic}" is-fallback=${widthOf(`"${generic}"`) === fallback}`);
  }
  // The keyword is ASCII case-insensitive, and recognising it canonicalises the
  // computed value to lower case -- both engines answer `monospace` for a bare
  // `MONOSPACE`, and `MONOSPACE` for a quoted one.
  report.push(`MONOSPACE bare-is-mono=${widthOf('MONOSPACE') === widthOf('monospace')}`);
  // `'MONOSPACE'` is deliberately not asserted. Chrome measures it as the
  // standard font (620 where the keyword is 564) while serialising it exactly
  // as we do, so the quoting survives into Chrome's layout and not into its
  // computed string. Ours resolves the family from that string, so the
  // distinction is not reachable here; matching it is a separate change to
  // where layout reads the family from, not to this rule.
  // In a list the quoted generic is skipped, so the next entry wins.
  report.push(`quoted-then-sans=${widthOf("'monospace', sans-serif") === widthOf('sans-serif')}`);
  report.push(`nonesuch-then-quoted=${widthOf("bogus-not-a-font-12345, 'monospace'") === fallback}`);
  // And the other half: quoting a real family name is how every probe writes
  // it, so that has to keep resolving.
  report.push(`quoted-real-family-resolves=${widthOf('"Courier New", monospace') !== widthOf('monospace')}`);
  // system-ui is the exception Chrome makes: quoted or bare it resolves to the
  // system font (624 both ways on the reference host), so it is not gated.
  report.push(`'system-ui' resolves=${widthOf("'system-ui'") === widthOf('system-ui')}`);

  testing.expectEqual([
    'monospace bare-differs-from-fallback=true',
    "'monospace' is-fallback=true",
    '"monospace" is-fallback=true',
    'sans-serif bare-differs-from-fallback=true',
    "'sans-serif' is-fallback=true",
    '"sans-serif" is-fallback=true',
    'cursive bare-differs-from-fallback=true',
    "'cursive' is-fallback=true",
    '"cursive" is-fallback=true',
    'fantasy bare-differs-from-fallback=true',
    "'fantasy' is-fallback=true",
    '"fantasy" is-fallback=true',
    'MONOSPACE bare-is-mono=true',
    'quoted-then-sans=true',
    'nonesuch-then-quoted=true',
    'quoted-real-family-resolves=true',
    "'system-ui' resolves=true",
  ].join('\n'), report.join('\n'));
}
</script>

<script id="a_quoted_generic_family_is_not_the_keyword_on_canvas">
{
  // Same rule through the other surface a probe uses. `ctx.font` parses its own
  // family list, so the gate has to be in the shared resolver rather than in
  // the element path.
  const ctx = document.createElement('canvas').getContext('2d');
  const widthOf = (family) => { ctx.font = `72px ${family}`; return ctx.measureText('mmmmmmmmmmlli').width; };

  const fallback = widthOf('bogus-not-a-font-12345');
  const report = [];
  for (const generic of ['monospace', 'sans-serif', 'cursive', 'fantasy']) {
    report.push(`${generic} bare-differs-from-fallback=${widthOf(generic) !== fallback}`);
    report.push(`'${generic}' is-fallback=${widthOf(`'${generic}'`) === fallback}`);
  }
  report.push(`quoted-real-family-resolves=${widthOf('"Courier New", monospace') !== widthOf('monospace')}`);

  testing.expectEqual([
    'monospace bare-differs-from-fallback=true',
    "'monospace' is-fallback=true",
    'sans-serif bare-differs-from-fallback=true',
    "'sans-serif' is-fallback=true",
    'cursive bare-differs-from-fallback=true',
    "'cursive' is-fallback=true",
    'fantasy bare-differs-from-fallback=true',
    "'fantasy' is-fallback=true",
    'quoted-real-family-resolves=true',
  ].join('\n'), report.join('\n'));
}
</script>
