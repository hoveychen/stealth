<!DOCTYPE html>
<script src="../../testing.js"></script>

<svg id=root class="chart wide">
  <use id=use1 xlink:href="#icon"></use>
  <use id=use2 href="#modern" xlink:href="#legacy"></use>
  <a id=link1></a>
</svg>
<div id=plain class="html-class"></div>

<script id=className>
{
  const root = $('#root');
  testing.expectEqual('object', typeof root.className);
  testing.expectEqual(true, root.className instanceof SVGAnimatedString);
  testing.expectEqual('chart wide', root.className.baseVal);
  testing.expectEqual('chart wide', root.className.animVal);

  // [SameObject]
  testing.expectEqual(true, root.className === root.className);

  root.className.baseVal = 'chart narrow';
  testing.expectEqual('chart narrow', root.getAttribute('class'));
  testing.expectEqual('chart narrow', root.className.animVal);
  testing.expectEqual(true, root.classList.contains('narrow'));

  root.setAttribute('class', 'other');
  testing.expectEqual('other', root.className.baseVal);

  // The SVG className accessor doesn't leak onto HTML elements.
  testing.expectEqual('html-class', $('#plain').className);
}
</script>

<script id=href>
{
  // The parser keeps xlink:href under the qualified name it was written with,
  // and href reflects it when there is no plain href. Chrome 151 readings
  // (probe expr-xlink-p67.js): use1.attributes reads ['id', 'xlink:href'],
  // getAttribute('href') is null and getAttribute('xlink:href') is '#icon'.
  const use1 = $('#use1');
  testing.expectEqual(true, use1.href instanceof SVGAnimatedString);
  testing.expectEqual('#icon', use1.href.baseVal);
  testing.expectEqual('#icon', use1.href.animVal);
  testing.expectEqual(true, use1.href === use1.href);
  testing.expectEqual(null, use1.getAttribute('href'));
  testing.expectEqual('#icon', use1.getAttribute('xlink:href'));
  testing.expectEqual('#icon', use1.getAttributeNS('http://www.w3.org/1999/xlink', 'href'));
  // A plain href wins over the legacy one.
  testing.expectEqual('#modern', $('#use2').href.baseVal);
  testing.expectEqual('#legacy', $('#use2').getAttribute('xlink:href'));

  // Only xlink:href present: the write lands in the xlink attribute, not in
  // a new href, which is what Chrome reports -- it leaves the attribute list
  // alone. (Firefox drops the prefix on that write, so only assert the
  // namespaced lookup.)
  use1.href.baseVal = '#other';
  testing.expectEqual('#other', use1.href.baseVal);
  testing.expectEqual('#other', use1.getAttributeNS('http://www.w3.org/1999/xlink', 'href'));
  testing.expectEqual(false, use1.hasAttributeNS(null, 'href'));

  // Runtime setAttributeNS keeps the qualified name and reflects the same way,
  // as Chrome does: it too names the attribute xlink:href.
  const use3 = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use3.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#runtime');
  testing.expectEqual('#runtime', use3.href.baseVal);
  testing.expectEqual('#runtime', use3.getAttribute('xlink:href'));

  // A namespace-less setAttribute('xlink:href') is a literal attribute in no
  // namespace, which Chrome does not reflect ('' there). We have no namespace
  // on an attribute, so it is indistinguishable from the parsed one and does
  // reflect -- the residual half of the xlink deviation, and the reason the
  // parsed case above works at all. The write follows the same rule and lands
  // in the literal attribute; Chrome, seeing no xlink-namespaced href, would
  // create a plain one instead.
  const use4 = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use4.setAttribute('xlink:href', '#literal');
  testing.expectEqual('#literal', use4.href.baseVal);
  use4.href.baseVal = '#written';
  testing.expectEqual('#written', use4.getAttribute('xlink:href'));
  testing.expectEqual(null, use4.getAttribute('href'));

  // No href attribute at all: set writes to href.
  const link = $('#link1');
  testing.expectEqual('', link.href.baseVal);
  link.href.baseVal = '/docs';
  testing.expectEqual('/docs', link.getAttribute('href'));
}
</script>
