<!DOCTYPE html>
<script src="../../testing.js"></script>

<svg id=root width="200" height="100">
  <title id=title>Accessible title</title>
  <desc id=desc>Long description</desc>
  <metadata id=metadata><entry>value</entry></metadata>
  <view id=view></view>
  <symbol id=symbol><rect width="5" height="5"></rect></symbol>
  <switch id=switch requiredExtensions="urn:svg"><circle r="2"></circle></switch>
  <g id=container>
    <foreignObject id=foreign x="10" y="20" width="30" height="40" transform="translate(5 6)">
      <div>HTML content</div>
    </foreignObject>
  </g>
</svg>

<script id=structuralIdentities>
{
  testing.expectEqual(true, $('#symbol') instanceof SVGSymbolElement);
  testing.expectEqual(true, $('#symbol') instanceof SVGGraphicsElement);
  testing.expectEqual(true, $('#switch') instanceof SVGSwitchElement);
  testing.expectEqual(true, $('#switch') instanceof SVGGraphicsElement);
  testing.expectEqual(true, $('#foreign') instanceof SVGForeignObjectElement);
  testing.expectEqual(true, $('#foreign') instanceof SVGGraphicsElement);

  testing.expectEqual(true, $('#view') instanceof SVGViewElement);
  testing.expectEqual(true, $('#view') instanceof SVGElement);
  testing.expectEqual(false, $('#view') instanceof SVGGraphicsElement);
  testing.expectEqual(true, $('#title') instanceof SVGTitleElement);
  testing.expectEqual(true, $('#desc') instanceof SVGDescElement);
  testing.expectEqual(true, $('#metadata') instanceof SVGMetadataElement);
  testing.expectEqual($('#title'), document.querySelector('svg title'));
  testing.expectEqual('Accessible title', $('#title').textContent);
  testing.expectEqual('Long description', $('#desc').textContent);

  testing.expectEqual(true, document.createElementNS('http://www.w3.org/2000/svg', 'symbol') instanceof SVGSymbolElement);
  testing.expectEqual(false, document.createElementNS('http://www.w3.org/2000/svg', 'Symbol') instanceof SVGSymbolElement);
}
</script>

<script id=foreignObjectGeometry>
{
  const foreign = $('#foreign');
  testing.expectEqual(true, foreign.x instanceof SVGAnimatedLength);
  testing.expectEqual(true, foreign.x === foreign.x);
  testing.expectEqual(10, foreign.x.baseVal.value);
  testing.expectEqual(40, foreign.height.baseVal.value);
  foreign.width.baseVal.value = 35;
  testing.expectEqual('35', foreign.getAttribute('width'));
  testing.expectEqual(35, foreign.width.animVal.value);
  testing.expectError('NoModificationAllowedError', () => { foreign.width.animVal.value = 1; });

  let box = foreign.getBBox();
  testing.expectEqual(10, box.x);
  testing.expectEqual(20, box.y);
  testing.expectEqual(35, box.width);
  testing.expectEqual(40, box.height);

  // The element's own transform is excluded from its box but included in its
  // parent's box.
  box = $('#container').getBBox();
  testing.expectEqual(15, box.x);
  testing.expectEqual(26, box.y);
  testing.expectEqual(35, box.width);
  testing.expectEqual(40, box.height);

  foreign.setAttribute('width', '-1');
  testing.expectEqual(0, foreign.getBBox().width);
}
</script>

<script id=structuralBoundaries>
{
  // Like <defs>, <symbol> and <switch> contribute no resolvable geometry, so
  // they answer with an empty box rather than an error.
  testing.expectEqual(0, $('#symbol').getBBox().width);
  testing.expectEqual(0, $('#switch').getBBox().width);
  testing.expectEqual(true, $('#switch').requiredExtensions instanceof SVGStringList);
  testing.expectEqual('urn:svg', $('#switch').requiredExtensions.getItem(0));
}
</script>

<script id=deepGroupBounds>
{
  const namespace = 'http://www.w3.org/2000/svg';
  const outer = document.createElementNS(namespace, 'g');
  let parent = outer;
  for (let i = 0; i < 512; i++) {
    const group = document.createElementNS(namespace, 'g');
    parent.appendChild(group);
    parent = group;
  }
  const rect = document.createElementNS(namespace, 'rect');
  rect.setAttribute('x', '3');
  rect.setAttribute('y', '4');
  rect.setAttribute('width', '5');
  rect.setAttribute('height', '6');
  parent.appendChild(rect);
  $('#root').appendChild(outer);

  const box = outer.getBBox();
  testing.expectEqual(3, box.x);
  testing.expectEqual(4, box.y);
  testing.expectEqual(5, box.width);
  testing.expectEqual(6, box.height);
}
</script>

<!-- Fragment parsing takes its mode from the context element, so markup set
     through innerHTML on an SVG element is SVG, not HTML. Sprite sheets are
     injected exactly this way — vite-plugin-svg-icons builds one <svg> and
     fills it with <symbol>s — and HTML-namespace children make every <use>
     that references them dangle. All values read off headed Chrome. -->
<script id=innerHtmlNamespace>
{
  const ns = 'http://www.w3.org/2000/svg';
  const info = (el) => [el.tagName, el.namespaceURI, Object.getPrototypeOf(el).constructor.name].join('|');

  const host = document.createElementNS(ns, 'svg');
  document.body.appendChild(host);
  host.innerHTML = '<symbol id="ns-sym" viewBox="0 0 10 10"><path d="M0 0"/></symbol>'
    + '<linearGradient><stop/></linearGradient>';
  testing.expectEqual('symbol|' + ns + '|SVGSymbolElement', info(host.children[0]));
  testing.expectEqual('path|' + ns + '|SVGPathElement', info(host.children[0].children[0]));
  testing.expectEqual('linearGradient|' + ns + '|SVGLinearGradientElement', info(host.children[1]));
  testing.expectEqual('stop|' + ns + '|SVGStopElement', info(host.children[1].children[0]));

  // A <g> is just as much an SVG context as the root is.
  const g = document.createElementNS(ns, 'g');
  host.appendChild(g);
  g.innerHTML = '<rect/><foreignObject><div>inner</div></foreignObject>';
  testing.expectEqual('rect|' + ns + '|SVGRectElement', info(g.children[0]));
  testing.expectEqual('foreignObject|' + ns + '|SVGForeignObjectElement', info(g.children[1]));
  // …and <foreignObject> switches back to HTML, as it does in the document.
  testing.expectEqual('DIV|http://www.w3.org/1999/xhtml|HTMLDivElement', info(g.children[1].children[0]));

  // An HTML context still gives HTML, and only the <svg> subtree inside it
  // is SVG — which already worked, and must keep working.
  const div = document.createElement('div');
  document.body.appendChild(div);
  div.innerHTML = '<svg><path d="M0 0"/></svg><p>x</p>';
  testing.expectEqual('svg|' + ns + '|SVGSVGElement', info(div.children[0]));
  testing.expectEqual('path|' + ns + '|SVGPathElement', info(div.children[0].children[0]));
  testing.expectEqual('P|http://www.w3.org/1999/xhtml|HTMLParagraphElement', info(div.children[1]));

  host.remove();
  div.remove();
}
</script>

<!-- SVGAElement, SVGImageElement, SVGUseElement and SVGMaskElement's members,
     against a headed Chrome 151 (probes/expr-svg-family-semantics.js and
     -edges.js). -->
<script id=anchorMembers>
{
  const ns = 'http://www.w3.org/2000/svg';
  const host = document.createElementNS(ns, 'svg');
  host.innerHTML = '<a id=link href="#x" target="_top" download="d" ping="/p" rel="noopener"'
    + ' hreflang="en" type="text/html" referrerpolicy="no-referrer"><circle r="2"/></a>';
  document.body.appendChild(host);
  const link = $('#link');

  // target is an SVGAnimatedString and read-only: the assignment is silently
  // dropped, which is what separates it from HTMLAnchorElement's plain string.
  testing.expectEqual(true, link.target instanceof SVGAnimatedString);
  testing.expectEqual(true, link.target === link.target);
  testing.expectEqual('_top', link.target.baseVal);
  link.target = '_blank';
  testing.expectEqual('_top', link.getAttribute('target'));

  testing.expectEqual('d', link.download);
  testing.expectEqual('/p', link.ping);
  testing.expectEqual('noopener', link.rel);
  testing.expectEqual('en', link.hreflang);
  testing.expectEqual('text/html', link.type);
  // Not the limited-to-known-values reflection HTMLAnchorElement uses: an
  // unrecognised policy reads straight back.
  testing.expectEqual('no-referrer', link.referrerPolicy);
  link.setAttribute('referrerpolicy', 'bogus');
  testing.expectEqual('bogus', link.referrerPolicy);
  testing.expectEqual(null, link.interestForElement);

  link.download = 'z';
  testing.expectEqual('z', link.getAttribute('download'));
  link.rel = 'nofollow';
  testing.expectEqual('nofollow', link.getAttribute('rel'));
  testing.expectEqual('nofollow', link.relList.value);

  // Every one of them reads the lowercase content attribute; SVG is
  // case-sensitive, so the camelCase spelling is a different attribute.
  const bare = document.createElementNS(ns, 'a');
  testing.expectEqual('', bare.hreflang);
  bare.setAttribute('hrefLang', 'C');
  testing.expectEqual('', bare.hreflang);
  bare.setAttribute('hreflang', 'L');
  testing.expectEqual('L', bare.hreflang);

  host.remove();
}
</script>

<script id=imageAndUseMembers>
{
  const ns = 'http://www.w3.org/2000/svg';
  const host = document.createElementNS(ns, 'svg');
  host.innerHTML = '<image id=pic href="#i" x="1" y="2" width="30" height="40"'
    + ' preserveAspectRatio="xMidYMid slice" decoding="async" crossorigin="anonymous"/>'
    + '<use id=copy href="#c" x="3" y="4" width="50" height="60"/>';
  document.body.appendChild(host);

  const pic = $('#pic');
  testing.expectEqual(true, pic.x instanceof SVGAnimatedLength);
  testing.expectEqual(1, pic.x.baseVal.value);
  testing.expectEqual(2, pic.y.baseVal.value);
  testing.expectEqual(30, pic.width.baseVal.value);
  testing.expectEqual(40, pic.height.baseVal.value);
  testing.expectEqual(true, pic.preserveAspectRatio instanceof SVGAnimatedPreserveAspectRatio);
  testing.expectEqual(6, pic.preserveAspectRatio.baseVal.align);
  testing.expectEqual('async', pic.decoding);
  testing.expectEqual('anonymous', pic.crossOrigin);
  testing.expectEqual(true, pic.decode() instanceof Promise);

  // decoding's invalid and missing value default is "auto"; crossOrigin's
  // missing default is null and its invalid one is "anonymous".
  pic.setAttribute('decoding', 'bogus');
  testing.expectEqual('auto', pic.decoding);
  pic.setAttribute('crossorigin', 'bogus');
  testing.expectEqual('anonymous', pic.crossOrigin);
  pic.setAttribute('crossorigin', '');
  testing.expectEqual('anonymous', pic.crossOrigin);
  pic.crossOrigin = null;
  testing.expectEqual(null, pic.crossOrigin);
  testing.expectEqual(null, pic.getAttribute('crossorigin'));

  const bareImage = document.createElementNS(ns, 'image');
  testing.expectEqual('auto', bareImage.decoding);
  testing.expectEqual(null, bareImage.crossOrigin);
  testing.expectEqual(0, bareImage.width.baseVal.value);

  const copy = $('#copy');
  testing.expectEqual(3, copy.x.baseVal.value);
  testing.expectEqual(4, copy.y.baseVal.value);
  testing.expectEqual(50, copy.width.baseVal.value);
  testing.expectEqual(60, copy.height.baseVal.value);

  // A bare <use> takes plain numbers defaulting to 0, not the percentages a
  // viewport-establishing element gets.
  const bareUse = document.createElementNS(ns, 'use');
  testing.expectEqual(0, bareUse.width.baseVal.value);
  testing.expectEqual(SVGLength.SVG_LENGTHTYPE_NUMBER, bareUse.width.baseVal.unitType);

  host.remove();
}
</script>

<script id=maskTests>
{
  const ns = 'http://www.w3.org/2000/svg';
  const host = document.createElementNS(ns, 'svg');
  host.innerHTML = '<mask id=cover requiredExtensions="urn:a" systemLanguage="en"/>';
  document.body.appendChild(host);
  const cover = $('#cover');

  // SVGMaskElement includes SVGTests even though its prototype chain runs
  // through SVGElement rather than SVGGraphicsElement.
  testing.expectEqual(true, cover.requiredExtensions instanceof SVGStringList);
  testing.expectEqual('urn:a', cover.requiredExtensions.getItem(0));
  testing.expectEqual(true, cover.requiredExtensions === cover.requiredExtensions);
  testing.expectEqual(1, cover.systemLanguage.numberOfItems);

  host.remove();
}
</script>
