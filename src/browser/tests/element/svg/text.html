<!DOCTYPE html>
<meta charset=utf-8>
<script src="../../testing.js"></script>

<svg>
  <text id=text font-size="20">Hello<tspan id=tspan>🌍</tspan></text>
  <text id=invalidFont font-size="-10">A</text>
  <path id=guide d="M0 0 L100 0"></path>
  <text><textPath id=textPath href="#guide" startOffset="25%" method="stretch" spacing="auto">abc</textPath></text>
</svg>

<script id=textIdentities>
{
  const text = $('#text');
  testing.expectEqual(true, text instanceof SVGTextElement);
  testing.expectEqual(true, text instanceof SVGTextPositioningElement);
  testing.expectEqual(true, text instanceof SVGTextContentElement);
  testing.expectEqual(true, text instanceof SVGGraphicsElement);
  testing.expectEqual(text, document.querySelector('svg text'));
  testing.expectEqual(true, $('#tspan') instanceof SVGTSpanElement);
  testing.expectEqual(true, $('#tspan') instanceof SVGTextPositioningElement);
  testing.expectEqual(true, $('#textPath') instanceof SVGTextPathElement);
  testing.expectEqual(true, $('#textPath') instanceof SVGTextContentElement);

  const ns = 'http://www.w3.org/2000/svg';
  testing.expectEqual(true, document.createElementNS(ns, 'textPath') instanceof SVGTextPathElement);
  testing.expectEqual(false, document.createElementNS(ns, 'textpath') instanceof SVGTextPathElement);
}
</script>

<!-- Chrome's own answers, read off headed Chrome, with our departures called
     out where they exist. The default SVG font is serif, not sans-serif, and
     ours is the same measured table the canvas uses. -->
<script id=metrics>
{
  const text = $('#text');
  // Characters are UTF-16 code units, like DOM strings: the emoji counts as
  // two, and addressing either of its halves measures the full glyph.
  testing.expectEqual(7, text.getNumberOfChars());

  // Chrome: 64.4375 / 44.4375 / 30.0078125. It quantises an SVG advance per
  // font size where we scale one 100px table, which costs us ~1/256 px.
  testing.expectEqual(64.43359375, text.getComputedTextLength());
  testing.expectEqual(44.43359375, text.getSubStringLength(0, 5));
  testing.expectEqual(30, text.getSubStringLength(4, 99));
  testing.expectEqual(20, text.getSubStringLength(5, 1));
  testing.expectEqual(20, text.getSubStringLength(6, 1));
  testing.expectError('IndexSizeError', () => text.getSubStringLength(7, 1));
  testing.expectError('IndexSizeError', () => text.getSubStringLength(7, 0));
  testing.expectEqual(2, $('#tspan').getNumberOfChars());
  testing.expectEqual(20, $('#tspan').getComputedTextLength());

  // A negative font-size is invalid and drops to the initial 16px. Exactly
  // Chrome's number.
  testing.expectEqual(11.5546875, $('#invalidFont').getComputedTextLength());

  // Chrome answers an absent textLength with the computed text length; we
  // still report the attribute's default.
  testing.expectEqual(0, text.textLength.baseVal.value);

  // The advance box, standing on the font's ascent and descent at the text's
  // origin. Chrome grows this by the ink an Apple Color Emoji bitmap spills
  // past its advance and above its ascent — it answers x 0, y -18.5, width
  // 65.4375, height 23.5 — which we do not model.
  const box = text.getBBox();
  testing.expectEqual(0, box.x);
  testing.expectEqual(-18, box.y);
  testing.expectEqual(64.43359375, box.width);
  testing.expectEqual(23, box.height);
}
</script>

<script id=extentOfChar>
{
  const text = $('#text');
  testing.expectEqual('function', typeof text.getExtentOfChar);

  // x is where the character starts in the element's user space, width is its
  // own advance, and the cell is the font's ascent plus descent tall. Chrome
  // answers the same box to within its per-size quantisation: it says width
  // 14.4453125 for the H and x 34.4296875 / width 10.0078125 for the o.
  testing.expectEqual(0, text.getExtentOfChar(0).x);
  testing.expectEqual(14.443359375, text.getExtentOfChar(0).width);
  testing.expectEqual(-18, text.getExtentOfChar(0).y);
  testing.expectEqual(23, text.getExtentOfChar(0).height);

  testing.expectEqual(34.43359375, text.getExtentOfChar(4).x);
  testing.expectEqual(10, text.getExtentOfChar(4).width);

  // Addressing either half of the surrogate pair measures the whole emoji.
  testing.expectEqual(44.43359375, text.getExtentOfChar(5).x);
  testing.expectEqual(20, text.getExtentOfChar(5).width);
  testing.expectEqual(20, text.getExtentOfChar(6).width);

  testing.expectError('IndexSizeError', () => text.getExtentOfChar(7));
}
</script>

<!-- What CreepJS's SVG probe actually measures: a stylesheet-set font-size,
     a stylesheet-set family, and one <text> per emoji inside a <g> whose box
     it sums. -->
<script id=cascadedMetrics>
{
  const ns = 'http://www.w3.org/2000/svg';
  const style = document.createElement('style');
  style.textContent = '.svg-big { font-size: 200px !important }'
    + ' .svg-mono { font-family: monospace; font-size: 20px }'
    + ' .svg-emoji { font-family: sans-serif; font-size: 200px !important }';
  document.head.appendChild(style);

  const host = document.createElementNS(ns, 'svg');
  document.body.appendChild(host);
  const make = (cls, content, parent) => {
    const el = document.createElementNS(ns, 'text');
    el.setAttribute('class', cls);
    el.setAttribute('x', '32');
    el.setAttribute('y', '32');
    el.textContent = content;
    (parent || host).appendChild(el);
    return el;
  };

  // A rule sets the size, so the string is measured at 200px and not at the
  // initial 16. Chrome answers 444.3359375 too.
  const big = make('svg-big', 'Hello');
  testing.expectEqual(444.3359375, big.getComputedTextLength());

  // …and a rule sets the family. Chrome: 60.2109375.
  testing.expectEqual(60.205078125, make('svg-mono', 'Hello').getComputedTextLength());

  // Every emoji has its own advance, which is the point: a fingerprinter
  // counts how many *distinct* widths a set of them produces, and answering
  // one em for all of them answers 1. Chrome, to within the per-size
  // quantisation, says 147.3671875 / 120.4140625 / 200 / 182.03125.
  const group = document.createElementNS(ns, 'g');
  host.appendChild(group);
  const emojis = ['\u{263A}', '\u{2620}', '\u{1F600}', '\u{2764}', '\u{2708}'];
  const widths = emojis.map((e) => make('svg-emoji', e, group).getComputedTextLength());
  testing.expectEqual('147.375,120.421875,200,182.03125,120.421875', widths.join(','));
  testing.expectEqual(4, new Set(widths).size);

  // A ZWJ sequence is one glyph, so it is one advance and not the sum of its
  // parts. Chrome: 200.
  testing.expectEqual(200, make('svg-emoji', '\u{1F935}\u{200D}\u{2642}\u{FE0F}').getComputedTextLength());

  // The <g> unions its children's boxes, which is the call CreepJS reports as
  // "bBox". Chrome answers x 28.875, y -152, width 209.375, height 230: the
  // ink of the widest emoji bitmap, where we answer the advance box.
  const box = group.getBBox();
  testing.expectEqual(32, box.x);
  testing.expectEqual(200, box.width);
  testing.expectEqual(230, box.height);
  // Within a quarter pixel of Chrome's -152, which is as close as a 200px box
  // gets: font_metrics sweeps sizes 1..120 and scales the last entry above
  // that, so a 200px ascent is 110.5 x 200 / 120 = 184.1666 against the 184
  // Chrome draws. Re-measured at both device scales with
  // tools/fingerprint/scratch/expr-svg-group-bbox.js -- Chrome answers y -152
  // and height 230 at either, and moves only the x and the width.
  testing.expectEqual(true, Math.abs(box.y + 152) < 0.25);

  host.remove();
  style.remove();
}
</script>

<script id=textReflection>
{
  const text = $('#text');
  testing.expectEqual(true, text.textLength instanceof SVGAnimatedLength);
  testing.expectEqual(true, text.textLength === text.textLength);
  text.textLength.baseVal.value = 100;
  testing.expectEqual('100', text.getAttribute('textLength'));
  testing.expectEqual(100, text.textLength.animVal.value);
  testing.expectEqual(1, text.lengthAdjust.baseVal);
  testing.expectEqual(true, text.lengthAdjust === text.lengthAdjust);
  text.lengthAdjust.baseVal = 2;
  testing.expectEqual('spacingAndGlyphs', text.getAttribute('lengthAdjust'));

  const textPath = $('#textPath');
  testing.expectEqual('#guide', textPath.href.baseVal);
  testing.expectEqual(true, textPath.startOffset === textPath.startOffset);
  testing.expectEqual(true, textPath.method === textPath.method);
  testing.expectEqual(true, textPath.spacing === textPath.spacing);
  testing.expectEqual('25%', textPath.startOffset.baseVal.valueAsString);
  testing.expectEqual(2, textPath.method.baseVal);
  testing.expectEqual(1, textPath.spacing.baseVal);
  textPath.spacing.baseVal = 2;
  testing.expectEqual('exact', textPath.getAttribute('spacing'));
}
</script>

<!-- The four position calls and selectSubString. Chrome's own numbers for a
     serif <text> at 20px, read off a headed Chrome 151. -->
<script id=charPositions>
{
  const text = $('#text');
  testing.expectEqual(0, text.getStartPositionOfChar(0).x);
  testing.expectEqual(0, text.getStartPositionOfChar(0).y);
  testing.expectEqual(true, text.getStartPositionOfChar(0) instanceof SVGPoint);
  testing.expectEqual(14.443359375, text.getEndPositionOfChar(0).x);
  testing.expectEqual(14.443359375, text.getStartPositionOfChar(1).x);
  testing.expectEqual(0, text.getEndPositionOfChar(0).y);
  testing.expectEqual(44.43359375, text.getStartPositionOfChar(5).x);

  // Without a rotate attribute every character sits upright.
  testing.expectEqual(0, text.getRotationOfChar(0));
  testing.expectEqual(0, text.getRotationOfChar(6));

  // Blink refuses past-the-end and at-the-end with two different sentences.
  testing.expectError('IndexSizeError', () => text.getStartPositionOfChar(7));
  testing.expectError('IndexSizeError', () => text.getEndPositionOfChar(99));
  testing.expectError('IndexSizeError', () => text.getRotationOfChar(7));
  testing.expectEqual(
    "Failed to execute 'getStartPositionOfChar' on 'SVGTextContentElement': " +
      'The charnum provided (7) is greater than or equal to the maximum bound (7).',
    (() => { try { text.getStartPositionOfChar(7); } catch (e) { return e.message; } })(),
  );
  testing.expectEqual(
    "Failed to execute 'getStartPositionOfChar' on 'SVGTextContentElement': " +
      'The charnum provided (99) is greater than the maximum bound (7).',
    (() => { try { text.getStartPositionOfChar(99); } catch (e) { return e.message; } })(),
  );
  // A negative index arrives as its unsigned wrap and is quoted back as one.
  testing.expectEqual(
    "Failed to execute 'getStartPositionOfChar' on 'SVGTextContentElement': " +
      'The charnum provided (4294967295) is greater than the maximum bound (7).',
    (() => { try { text.getStartPositionOfChar(-1); } catch (e) { return e.message; } })(),
  );
}
</script>

<script id=charNumAtPosition>
{
  const svg = document.querySelector('svg');
  const at = (x, y) => {
    const p = svg.createSVGPoint();
    p.x = x; p.y = y;
    return p;
  };
  const text = $('#text');

  // The cell getExtentOfChar answers with, so the two agree by construction.
  testing.expectEqual(0, SVGTextContentElement.prototype.getCharNumAtPosition.length);
  testing.expectEqual(-1, text.getCharNumAtPosition());
  testing.expectEqual(0, text.getCharNumAtPosition(at(1, 0)));
  testing.expectEqual(4, text.getCharNumAtPosition(at(35, 0)));
  // Past the last glyph, and above the ascent, are both outside.
  testing.expectEqual(-1, text.getCharNumAtPosition(at(900, 0)));
  testing.expectEqual(-1, text.getCharNumAtPosition(at(1, -900)));
}
</script>

<script id=selectSubString>
{
  const plain = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  plain.textContent = 'Hello';
  document.querySelector('svg').appendChild(plain);

  testing.expectEqual(2, SVGTextContentElement.prototype.selectSubString.length);
  testing.expectEqual(undefined, plain.selectSubString(0, 2));
  testing.expectEqual('He', String(getSelection()));
  // nchars is clamped to what is left rather than refused.
  testing.expectEqual(undefined, plain.selectSubString(0, 99));
  testing.expectEqual('Hello', String(getSelection()));
  testing.expectError('IndexSizeError', () => plain.selectSubString(5, 1));
  testing.expectError('TypeError', () => plain.selectSubString());

  getSelection().removeAllRanges();
  plain.remove();
}
</script>

<!-- An SVG <text> measures on the LAYOUT surface, not the canvas one: it
     charges the kern pairs with a space on one side that `measureText` does
     not. Read off a headed Chrome 153 over six families by nine strings
     (scratch/s69/expr-svg-vs-span.js): `getComputedTextLength()` equalled the
     width of a <span> holding the same string in the same font on every row,
     and differed from `measureText` on exactly the rows with a space pair.
     This engine answered the canvas number, 0.28125 over on the string iphey
     reads. -->
<script id=spacePairsAreCharged>
{
  const ns = 'http://www.w3.org/2000/svg';
  const host = document.createElementNS(ns, 'svg');
  document.body.appendChild(host);
  const svgWidth = (family, content) => {
    const el = document.createElementNS(ns, 'text');
    el.style.fontFamily = family;
    el.style.fontSize = '16px';
    el.textContent = content;
    host.appendChild(el);
    return el.getComputedTextLength();
  };
  const spanWidth = (family, content) => {
    const el = document.createElement('span');
    el.style.cssText = `font:16px ${family};white-space:pre;display:inline-block`;
    el.textContent = content;
    document.body.appendChild(el);
    return el.getBoundingClientRect().width;
  };
  const canvas = document.createElement('canvas').getContext('2d');
  const canvasWidth = (family, content) => {
    canvas.font = `16px ${family}`;
    return canvas.measureText(content).width;
  };

  // Chrome's own numbers, to the digit. Each pair is one where the two
  // surfaces disagree, so a row that passed by measuring like the canvas
  // cannot pass here.
  testing.expectEqual(108.5234375, svgWidth('sans-serif', 'AVATAR To Wo'));
  testing.expectEqual(108.8046875, canvasWidth('sans-serif', 'AVATAR To Wo'));
  testing.expectEqual(53.3984375, svgWidth('sans-serif', 'A V A V'));
  testing.expectEqual(56.0234375, canvasWidth('sans-serif', 'A V A V'));
  testing.expectEqual(124.203125, svgWidth('serif', 'Hello, SVG World!'));
  testing.expectEqual(124.484375, canvasWidth('serif', 'Hello, SVG World!'));
  testing.expectEqual(105.4140625, svgWidth('serif', 'AVATAR To Wo'));

  // And the invariant behind them: the two paths answer one number. A family
  // that kerns no space pair at all (monospace) is on the list to show the
  // equality is not the space table answering everything.
  for (const family of ['sans-serif', 'serif', 'monospace', 'Courier New']) {
    for (const content of ['AVATAR To Wo', 'A V A V', 'Hello, SVG World!', 'Hello', ', S']) {
      testing.expectEqual(spanWidth(family, content), svgWidth(family, content));
    }
  }
}
</script>

<!-- The UA declaration that says so. Chrome's SVG stylesheet gives <text>
     `white-space: nowrap`, which its HTML sheet gives no element of that name
     — the two sheets are keyed by the same local names. -->
<script id=svgTextIsNowrap>
{
  const ns = 'http://www.w3.org/2000/svg';
  const host = document.createElementNS(ns, 'svg');
  document.body.appendChild(host);
  const make = (tag) => {
    const el = document.createElementNS(ns, tag);
    host.appendChild(el);
    return getComputedStyle(el);
  };

  const text = make('text');
  testing.expectEqual('nowrap', text.whiteSpace);
  testing.expectEqual('nowrap', text.getPropertyValue('text-wrap'));
  testing.expectEqual('nowrap', text.getPropertyValue('text-wrap-mode'));
  testing.expectEqual('normal', text.unicodeBidi);

  // Only <text>: Chrome's sheet says nothing about the others, and a <tspan>
  // is nowrap only by inheriting from the <text> it sits in.
  testing.expectEqual('normal', make('tspan').whiteSpace);
  testing.expectEqual('normal', make('rect').whiteSpace);

  // An HTML element of the same name is a different sheet's business, and that
  // sheet has no rule for it.
  const html = document.createElement('text');
  document.body.appendChild(html);
  testing.expectEqual('normal', getComputedStyle(html).whiteSpace);
}
</script>

<!-- An SVG <text> measures its COLLAPSED string, and every index-taking method
     addresses that string. Read off a headed Chrome 153 over twenty strings by
     two xml:space values by five white-space declarations
     (scratch/s69/expr-svg-ws2.js, expr-svg-ws3.js). -->
<script id=whitespaceCollapses>
{
  const ns = 'http://www.w3.org/2000/svg';
  const host = document.createElementNS(ns, 'svg');
  document.body.appendChild(host);
  const mk = (content, css, xmlSpace) => {
    const el = document.createElementNS(ns, 'text');
    el.style.fontFamily = 'sans-serif';
    el.style.fontSize = '16px';
    if (css) el.style.whiteSpace = css;
    if (xmlSpace) el.setAttributeNS('http://www.w3.org/XML/1998/namespace', 'xml:space', xmlSpace);
    el.textContent = content;
    host.appendChild(el);
    return el;
  };
  // The three reference widths every row below is one of.
  const HELLO = 36.4609375;          // 'Hello'
  const HELLO_WORLD = 82.40625;      // 'Hello World'
  const HELLO_2SP_WORLD = 86.8515625; // 'Hello  World'
  testing.expectEqual(HELLO, mk('Hello').getComputedTextLength());
  testing.expectEqual(HELLO_WORLD, mk('Hello World').getComputedTextLength());

  // Leading and trailing whitespace is stripped, inner runs collapse to one
  // space, and a tab / newline / carriage return is a space rather than a
  // break.
  for (const raw of [' Hello', 'Hello ', '  Hello  ', '\n  Hello\n  ', '\tHello\t']) {
    const el = mk(raw);
    testing.expectEqual(HELLO, el.getComputedTextLength());
    testing.expectEqual(5, el.getNumberOfChars());
  }
  for (const raw of ['Hello\nWorld', 'Hello\rWorld', 'Hello\tWorld', 'Hello   World', 'Hello \n World']) {
    const el = mk(raw);
    testing.expectEqual(HELLO_WORLD, el.getComputedTextLength());
    testing.expectEqual(11, el.getNumberOfChars());
  }
  // Whitespace with nothing beside it is nothing at all.
  testing.expectEqual(0, mk('   ').getComputedTextLength());
  testing.expectEqual(0, mk('   ').getNumberOfChars());
  testing.expectEqual(0, mk('\n\n').getNumberOfChars());

  // U+00A0 is not whitespace and survives.
  testing.expectEqual(40.90625, mk(' Hello').getComputedTextLength());
  testing.expectEqual(6, mk(' Hello').getNumberOfChars());

  // `white-space` turns the collapsing off exactly where it turns it off for a
  // <span>, and `xml:space="preserve"` does the same. A tab and a newline stay
  // one space each even then: that is the SVG half of the rule.
  for (const css of ['pre', 'pre-wrap', 'break-spaces']) {
    testing.expectEqual(HELLO_2SP_WORLD, mk('Hello\t\tWorld', css).getComputedTextLength());
    testing.expectEqual(12, mk('Hello\t\tWorld', css).getNumberOfChars());
  }
  testing.expectEqual(HELLO_2SP_WORLD, mk('Hello\t\tWorld', null, 'preserve').getComputedTextLength());
  testing.expectEqual(HELLO_WORLD, mk('Hello\tWorld', null, 'preserve').getComputedTextLength());
  testing.expectEqual(HELLO_WORLD, mk('Hello\nWorld', 'pre').getComputedTextLength());
  // `default` is the attribute's other value and means the collapsing stays on.
  testing.expectEqual(HELLO, mk(' Hello ', null, 'default').getComputedTextLength());

  // The per-character methods address the collapsed string too, so the first
  // character of a markup-indented <text> is its first LETTER.
  const indented = mk('\n  AV\n');
  testing.expectEqual(2, indented.getNumberOfChars());
  testing.expectEqual(0, indented.getExtentOfChar(0).x);
  testing.expectEqual(20.1640625, indented.getComputedTextLength());
  testing.expectError('IndexSizeError', () => indented.getExtentOfChar(2));
}
</script>
