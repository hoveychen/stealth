<!DOCTYPE html>
<script src="../../testing.js"></script>

<svg id=first x="10" y="20px" width="25%" height="2.54cm" preserveAspectRatio="xMinYMax slice">
  <g>
    <rect id=inner-rect></rect>
    <svg id=nested>
      <circle id=nested-circle></circle>
    </svg>
  </g>
</svg>
<svg id=second>
  <rect id=other-rect></rect>
</svg>

<script id=getElementById>
{
  const first = $('#first');
  testing.expectEqual($('#inner-rect'), first.getElementById('inner-rect'));
  testing.expectEqual($('#nested-circle'), first.getElementById('nested-circle'));

  // Scoped to the subtree, unlike document.getElementById.
  testing.expectEqual(null, first.getElementById('other-rect'));
  testing.expectEqual(null, $('#second').getElementById('inner-rect'));
  testing.expectEqual(null, first.getElementById(''));
  testing.expectEqual(null, first.getElementById('missing'));
}
</script>

<script id=scalarFactories>
{
  const svg = $('#first');

  const length = svg.createSVGLength();
  testing.expectEqual(true, length instanceof SVGLength);
  testing.expectEqual(false, length === svg.createSVGLength());
  testing.expectEqual(SVGLength.SVG_LENGTHTYPE_NUMBER, length.unitType);
  testing.expectEqual(0, length.value);
  testing.expectEqual('0', length.valueAsString);

  length.valueAsString = '2.54cm';
  testing.expectEqual(SVGLength.SVG_LENGTHTYPE_CM, length.unitType);
  testing.expectEqual(2.54, length.valueInSpecifiedUnits);
  testing.expectEqual(96, Math.round(length.value));
  testing.expectEqual('2.54cm', length.valueAsString);

  // `value` is an absolute user-unit setter; the unit is preserved and
  // valueInSpecifiedUnits converts (12 user units = 0.3175cm).
  length.value = 12;
  testing.expectEqual(SVGLength.SVG_LENGTHTYPE_CM, length.unitType);
  testing.expectEqual(0.3175, length.valueInSpecifiedUnits);
  testing.expectEqual(12, length.value);
  testing.expectEqual('0.3175cm', length.valueAsString);
  length.newValueSpecifiedUnits(SVGLength.SVG_LENGTHTYPE_PX, 4.5);
  testing.expectEqual('4.5px', length.valueAsString);
  testing.expectError('NotSupportedError', () => length.newValueSpecifiedUnits(0, 1));
  testing.expectError('TypeError', () => { length.value = Infinity; });
  testing.expectError('SyntaxError', () => { length.valueAsString = 'calc(1px + 2%)'; });
  testing.expectError('SyntaxError', () => { length.valueAsString = 'NaN'; });

  const angle = svg.createSVGAngle();
  testing.expectEqual(true, angle instanceof SVGAngle);
  testing.expectEqual(false, angle === svg.createSVGAngle());
  testing.expectEqual(SVGAngle.SVG_ANGLETYPE_UNSPECIFIED, angle.unitType);
  angle.valueAsString = '3.141592653589793rad';
  testing.expectEqual(SVGAngle.SVG_ANGLETYPE_RAD, angle.unitType);
  testing.expectEqual(180, Math.round(angle.value));
  angle.convertToSpecifiedUnits(SVGAngle.SVG_ANGLETYPE_DEG);
  testing.expectEqual(180, Math.round(angle.valueInSpecifiedUnits));
  testing.expectEqual('180deg', angle.valueAsString);
  angle.value = 45;
  testing.expectEqual(SVGAngle.SVG_ANGLETYPE_DEG, angle.unitType);
  testing.expectEqual(45, angle.valueInSpecifiedUnits);
  testing.expectEqual('45deg', angle.valueAsString);
  testing.expectError('NotSupportedError', () => angle.convertToSpecifiedUnits(0));
  testing.expectError('TypeError', () => { angle.value = NaN; });

  const transform = svg.createSVGTransform();
  testing.expectEqual(true, transform instanceof SVGTransform);
  testing.expectEqual(false, transform === svg.createSVGTransform());
  testing.expectEqual(SVGTransform.SVG_TRANSFORM_MATRIX, transform.type);
  testing.expectEqual(true, transform.matrix === transform.matrix);
  testing.expectEqual(1, transform.matrix.a);
  transform.setTranslate(3, 4);
  testing.expectEqual(SVGTransform.SVG_TRANSFORM_TRANSLATE, transform.type);
  testing.expectEqual(3, transform.matrix.e);
  testing.expectEqual(4, transform.matrix.f);

  const source = svg.createSVGMatrix();
  source.e = 8;
  const copied = svg.createSVGTransformFromMatrix(source);
  testing.expectEqual(8, copied.matrix.e);
  source.e = 9;
  testing.expectEqual(8, copied.matrix.e);
  copied.setRotate(90, 10, 20);
  testing.expectEqual(SVGTransform.SVG_TRANSFORM_ROTATE, copied.type);
  testing.expectEqual(90, copied.angle);
  testing.expectEqual(30, Math.round(copied.matrix.e));
  testing.expectEqual(10, Math.round(copied.matrix.f));
  testing.expectError('TypeError', () => copied.setScale(Infinity, 1));

  const matrix3d = new DOMMatrix();
  matrix3d.m13 = 7;
  const copied2d = svg.createSVGTransformFromMatrix(matrix3d);
  testing.expectEqual(true, copied2d.matrix.is2D);
  testing.expectEqual(0, copied2d.matrix.m13);
}
</script>

<script id=liveScalarProperties>
{
  const svg = $('#first');

  testing.expectEqual(true, svg.x instanceof SVGAnimatedLength);
  testing.expectEqual(true, svg.x === svg.x);
  testing.expectEqual(true, svg.x.baseVal === svg.x.baseVal);
  testing.expectEqual(true, svg.x.animVal === svg.x.animVal);
  testing.expectEqual(false, svg.x.baseVal === svg.x.animVal);
  testing.expectEqual(SVGLength.SVG_LENGTHTYPE_NUMBER, svg.x.baseVal.unitType);
  testing.expectEqual(SVGLength.SVG_LENGTHTYPE_PX, svg.y.baseVal.unitType);
  testing.expectEqual(SVGLength.SVG_LENGTHTYPE_PERCENTAGE, svg.width.baseVal.unitType);
  testing.expectEqual(SVGLength.SVG_LENGTHTYPE_CM, svg.height.baseVal.unitType);
  testing.expectEqual(96, Math.round(svg.height.baseVal.value));

  const nested = $('#nested');
  nested.setAttribute('width', '50%');
  testing.expectEqual(
    Math.round(svg.width.baseVal.value / 2),
    Math.round(nested.width.baseVal.value),
  );
  nested.setAttribute('style', 'font-size: 20px');
  nested.setAttribute('x', '2em');
  testing.expectEqual(40, nested.x.baseVal.value);
  nested.setAttribute('font-size', '30px');
  testing.expectEqual(40, nested.x.baseVal.value);
  nested.style.fontSize = '';
  testing.expectEqual(60, nested.x.baseVal.value);

  const deep = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  deep.setAttribute('width', '50%');
  let deepest = deep;
  for (let i = 0; i < 40; i++) {
    const child = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    child.setAttribute('width', '50%');
    child.setAttribute('font-size', '1em');
    deepest.appendChild(child);
    deepest = child;
  }
  deepest.setAttribute('x', '1em');
  document.body.appendChild(deep);
  testing.expectEqual(true, Number.isFinite(deepest.width.baseVal.value));
  testing.expectEqual(16, deepest.x.baseVal.value);
  deep.remove();

  svg.setAttribute('x', '12px');
  testing.expectEqual(SVGLength.SVG_LENGTHTYPE_PX, svg.x.baseVal.unitType);
  testing.expectEqual(12, svg.x.baseVal.value);
  testing.expectEqual(12, svg.x.animVal.value);
  svg.x.baseVal.valueInSpecifiedUnits = 4.5;
  testing.expectEqual('4.5px', svg.getAttribute('x'));
  svg.x.baseVal.value = 7;
  testing.expectEqual('7px', svg.getAttribute('x'));
  testing.expectEqual(SVGLength.SVG_LENGTHTYPE_PX, svg.x.animVal.unitType);
  testing.expectError('NoModificationAllowedError', () => { svg.x.animVal.value = 3; });
  testing.expectError('NoModificationAllowedError', () => { svg.x.animVal.valueAsString = '3px'; });

  const aspect = svg.preserveAspectRatio;
  testing.expectEqual(true, aspect instanceof SVGAnimatedPreserveAspectRatio);
  testing.expectEqual(true, aspect === svg.preserveAspectRatio);
  testing.expectEqual(true, aspect.baseVal === aspect.baseVal);
  testing.expectEqual(true, aspect.animVal === aspect.animVal);
  testing.expectEqual(false, aspect.baseVal === aspect.animVal);
  testing.expectEqual(SVGPreserveAspectRatio.SVG_PRESERVEASPECTRATIO_XMINYMAX, aspect.baseVal.align);
  testing.expectEqual(SVGPreserveAspectRatio.SVG_MEETORSLICE_SLICE, aspect.baseVal.meetOrSlice);

  aspect.baseVal.align = SVGPreserveAspectRatio.SVG_PRESERVEASPECTRATIO_XMIDYMID;
  testing.expectEqual('xMidYMid slice', svg.getAttribute('preserveAspectRatio'));
  svg.setAttribute('preserveAspectRatio', 'none meet');
  testing.expectEqual(SVGPreserveAspectRatio.SVG_PRESERVEASPECTRATIO_NONE, aspect.baseVal.align);
  testing.expectEqual(SVGPreserveAspectRatio.SVG_PRESERVEASPECTRATIO_NONE, aspect.animVal.align);
  testing.expectError('TypeError', () => { aspect.baseVal.align = 0; });
  testing.expectError('NoModificationAllowedError', () => { aspect.animVal.meetOrSlice = 2; });

  const empty = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  testing.expectEqual('100%', empty.width.baseVal.valueAsString);
  testing.expectEqual('100%', empty.height.baseVal.valueAsString);
  empty.setAttribute('width', 'invalid');
  testing.expectEqual('100%', empty.width.baseVal.valueAsString);
  testing.expectEqual(SVGPreserveAspectRatio.SVG_PRESERVEASPECTRATIO_XMIDYMID, empty.preserveAspectRatio.baseVal.align);
  testing.expectEqual(SVGPreserveAspectRatio.SVG_MEETORSLICE_MEET, empty.preserveAspectRatio.baseVal.meetOrSlice);
  testing.expectEqual(null, empty.getAttribute('preserveAspectRatio'));
}
</script>

<!-- `em` resolves against the cascaded font-size, so a stylesheet rule counts
     just as much as the inline declaration and the presentation attribute do.
     Every number here was read off headed Chrome. -->
<script id=cascadedFontSize>
{
  const ns = 'http://www.w3.org/2000/svg';
  const style = document.createElement('style');
  style.textContent = '.fs-cls { font-size: 20px }'
    + ' #fs-id { font-size: 40px }'
    + ' .fs-bang { font-size: 50px !important }'
    + ' .fs-parent { font-size: 25px }';
  document.head.appendChild(style);

  const root = document.createElementNS(ns, 'svg');
  document.body.appendChild(root);
  const el = document.createElementNS(ns, 'svg');
  el.setAttribute('x', '2em');
  root.appendChild(el);

  // No declaration anywhere: the initial 16px.
  testing.expectEqual(32, el.x.baseVal.value);

  // A class rule.
  el.setAttribute('class', 'fs-cls');
  testing.expectEqual(40, el.x.baseVal.value);

  // An id rule outranks it.
  el.setAttribute('id', 'fs-id');
  testing.expectEqual(80, el.x.baseVal.value);

  // The inline declaration outranks both.
  el.setAttribute('style', 'font-size: 10px');
  testing.expectEqual(20, el.x.baseVal.value);

  // …but not an `!important` rule.
  el.setAttribute('class', 'fs-cls fs-bang');
  testing.expectEqual(100, el.x.baseVal.value);

  // The presentation attribute is the weakest author declaration: any rule
  // beats it, and it only applies once no rule matches. (A second element:
  // dropping the `style` attribute does not currently drop the parsed
  // declaration it created, which is a separate gap.)
  const pres = document.createElementNS(ns, 'svg');
  pres.setAttribute('x', '2em');
  pres.setAttribute('class', 'fs-cls');
  pres.setAttribute('font-size', '80px');
  root.appendChild(pres);
  testing.expectEqual(40, pres.x.baseVal.value);
  pres.removeAttribute('class');
  testing.expectEqual(160, pres.x.baseVal.value);

  // font-size inherits, so a rule matching an ancestor reaches the child.
  pres.removeAttribute('font-size');
  root.setAttribute('class', 'fs-parent');
  testing.expectEqual(50, pres.x.baseVal.value);

  root.remove();
  style.remove();
}
</script>

<script id=factories>
{
  // SVG2 defines SVGPoint/SVGMatrix/SVGRect as aliases of the DOM geometry
  // types, but neither Chrome nor Firefox shipped that, so all three are
  // their own interfaces here too. matrix.html covers them in full.
  const svg = $('#first');

  const point = svg.createSVGPoint();
  testing.expectEqual(false, point instanceof DOMPoint);
  testing.expectEqual('SVGPoint', point.constructor.name);
  testing.expectEqual(0, point.x);
  testing.expectEqual(0, point.y);
  testing.expectEqual(undefined, point.w);
  point.x = 5;
  testing.expectEqual(5, point.x);

  const matrix = svg.createSVGMatrix();
  testing.expectEqual(false, matrix instanceof DOMMatrix);
  testing.expectEqual('SVGMatrix', matrix.constructor.name);
  testing.expectEqual(1, matrix.a);
  testing.expectEqual(0, matrix.b);
  testing.expectEqual(1, matrix.d);
  testing.expectEqual(undefined, matrix.is2D);

  const rect = svg.createSVGRect();
  testing.expectEqual(true, rect instanceof SVGRect);
  testing.expectEqual(false, rect instanceof DOMRect);
  testing.expectEqual('SVGRect', Object.getPrototypeOf(rect).constructor.name);
  testing.expectEqual(Object.prototype, Object.getPrototypeOf(SVGRect.prototype));
  testing.expectEqual('x,y,width,height,constructor', Object.getOwnPropertyNames(SVGRect.prototype).join(','));
  testing.expectEqual(0, SVGRect.length);
  testing.expectError('TypeError', () => new SVGRect());
  testing.expectEqual(0, rect.x);
  testing.expectEqual(0, rect.width);
  rect.x = 1.5;
  rect.height = -3;
  testing.expectEqual(1.5, rect.x);
  testing.expectEqual(-3, rect.height);
  // A WebIDL float is restricted, so a non-finite assignment throws.
  testing.expectError('TypeError', () => { rect.y = NaN; });
  testing.expectError('TypeError', () => { rect.width = Infinity; });
  testing.expectEqual(true, $('#first').getBBox() instanceof SVGRect);

  const number = svg.createSVGNumber();
  testing.expectEqual(true, number instanceof SVGNumber);
  testing.expectEqual(0, number.value);
  number.value = 4.5;
  testing.expectEqual(4.5, number.value);
}
</script>

<script id=owner>
{
  const first = $('#first');
  const nested = $('#nested');

  testing.expectEqual(null, first.ownerSVGElement);
  testing.expectEqual(null, first.viewportElement);

  testing.expectEqual(first, $('#inner-rect').ownerSVGElement);
  testing.expectEqual(first, $('#inner-rect').viewportElement);
  testing.expectEqual(first, nested.ownerSVGElement);
  testing.expectEqual(nested, $('#nested-circle').ownerSVGElement);
  testing.expectEqual($('#second'), $('#other-rect').ownerSVGElement);

  // A foreignObject starts a new SVG document fragment.
  first.innerHTML += '<foreignObject><div><svg id=foreign-svg></svg></div></foreignObject>';
  testing.expectEqual(null, $('#foreign-svg').ownerSVGElement);
}
</script>

<!-- The SVGSVGElement members that are not attribute reflections: the user
     agent's zoom and pan, the SMIL clock, the redraw-suspension trio and the
     geometry queries. Every number here is a headed Chrome 151 reading
     (tools/fingerprint/probes/expr-svg-family-semantics.js and -edges.js). -->
<script id=currentScaleAndTranslate>
{
  const first = $('#first');
  testing.expectEqual(1, first.currentScale);
  first.currentScale = 2;
  testing.expectEqual(2, first.currentScale);
  // Chrome takes any finite number, 0 and negatives included.
  first.currentScale = 0;
  testing.expectEqual(0, first.currentScale);
  first.currentScale = -3;
  testing.expectEqual(-3, first.currentScale);
  first.currentScale = 1;

  // A nested <svg> reads 1 and ignores the write.
  const nested = $('#nested');
  testing.expectEqual(1, nested.currentScale);
  nested.currentScale = 4;
  testing.expectEqual(1, nested.currentScale);

  // A fresh SVGPoint every read -- Chrome's tear-off -- that still writes
  // through to the element.
  testing.expectEqual(true, first.currentTranslate instanceof SVGPoint);
  testing.expectEqual(false, first.currentTranslate === first.currentTranslate);
  testing.expectEqual(0, first.currentTranslate.x);
  first.currentTranslate.x = 5;
  testing.expectEqual(5, first.currentTranslate.x);
  testing.expectEqual(0, first.currentTranslate.y);
}
</script>

<script id=zoomAndPan>
{
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  testing.expectEqual(0, SVGSVGElement.prototype.SVG_ZOOMANDPAN_UNKNOWN);
  testing.expectEqual(1, SVGSVGElement.prototype.SVG_ZOOMANDPAN_DISABLE);
  testing.expectEqual(2, SVGSVGElement.prototype.SVG_ZOOMANDPAN_MAGNIFY);

  // The initial value is magnify, and the IDL setter does not write the
  // attribute back.
  testing.expectEqual(2, svg.zoomAndPan);
  svg.zoomAndPan = 1;
  testing.expectEqual(1, svg.zoomAndPan);
  testing.expectEqual(null, svg.getAttribute('zoomAndPan'));
  svg.zoomAndPan = 0;
  testing.expectEqual(0, svg.zoomAndPan);

  // The keywords are case-sensitive and anything else is UNKNOWN -- not
  // magnify, which is only the *initial* value.
  svg.setAttribute('zoomAndPan', 'disable');
  testing.expectEqual(1, svg.zoomAndPan);
  svg.setAttribute('zoomAndPan', 'magnify');
  testing.expectEqual(2, svg.zoomAndPan);
  svg.setAttribute('zoomAndPan', 'DISABLE');
  testing.expectEqual(0, svg.zoomAndPan);
  svg.setAttribute('zoomAndPan', 'bogus');
  testing.expectEqual(0, svg.zoomAndPan);

  // Setting through the IDL wins over the attribute that is still there, and
  // removing the attribute afterwards resets to UNKNOWN.
  svg.setAttribute('zoomAndPan', 'disable');
  svg.zoomAndPan = 2;
  testing.expectEqual(2, svg.zoomAndPan);
  testing.expectEqual('disable', svg.getAttribute('zoomAndPan'));
  svg.removeAttribute('zoomAndPan');
  testing.expectEqual(0, svg.zoomAndPan);
  // Out of range is ignored rather than refused.
  svg.zoomAndPan = 7;
  testing.expectEqual(0, svg.zoomAndPan);

  // <view> carries the same mixin.
  const view = document.createElementNS('http://www.w3.org/2000/svg', 'view');
  testing.expectEqual(2, view.zoomAndPan);
  testing.expectEqual(1, SVGViewElement.prototype.SVG_ZOOMANDPAN_DISABLE);
  view.setAttribute('zoomAndPan', 'disable');
  testing.expectEqual(1, view.zoomAndPan);
}
</script>

<script id=animationClock>
{
  const svg = $('#first');
  testing.expectEqual(false, svg.animationsPaused());
  testing.expectEqual(0, svg.getCurrentTime());
  testing.expectEqual(undefined, svg.pauseAnimations());
  testing.expectEqual(true, svg.animationsPaused());
  testing.expectEqual(undefined, svg.unpauseAnimations());
  testing.expectEqual(false, svg.animationsPaused());

  testing.expectEqual(undefined, svg.setCurrentTime(3));
  testing.expectEqual(3, svg.getCurrentTime());
  testing.expectError('TypeError', () => svg.setCurrentTime());
  svg.setCurrentTime(0);

  // Chrome hands back 1 from every suspendRedraw, not an incrementing handle.
  testing.expectEqual(1, svg.suspendRedraw(100));
  testing.expectEqual(1, svg.suspendRedraw(100));
  testing.expectEqual(undefined, svg.unsuspendRedraw(1));
  testing.expectEqual(undefined, svg.unsuspendRedraw(9999));
  testing.expectEqual(undefined, svg.unsuspendRedrawAll());
  testing.expectEqual(undefined, svg.forceRedraw());
  testing.expectEqual(undefined, svg.deselectAll());
}
</script>

<script id=intersectionAndEnclosure>
{
  const ns = 'http://www.w3.org/2000/svg';
  const host = document.createElementNS(ns, 'svg');
  host.setAttribute('width', '200');
  host.setAttribute('height', '100');
  host.innerHTML = '<a id=link><circle id=dot cx="10" cy="10" r="5"/></a>'
    + '<rect id=box x="0" y="0" width="20" height="20"/>'
    + '<image id=pic />'
    + '<text id=label x="5" y="20">Hello</text>';
  document.body.appendChild(host);

  const mk = (x, y, w, h) => {
    const r = host.createSVGRect();
    r.x = x; r.y = y; r.width = w; r.height = h;
    return r;
  };
  const ids = (list) => Array.from(list).map((e) => e.id).join(',');

  testing.expectEqual(true, host.checkIntersection($('#box'), mk(0, 0, 200, 100)));
  testing.expectEqual(true, host.checkIntersection($('#box'), mk(10, 10, 5, 5)));
  testing.expectEqual(false, host.checkIntersection($('#box'), mk(100, 50, 10, 10)));
  testing.expectEqual(true, host.checkEnclosure($('#box'), mk(0, 0, 200, 100)));
  testing.expectEqual(false, host.checkEnclosure($('#box'), mk(0, 0, 10, 10)));
  testing.expectError('TypeError', () => host.checkIntersection());

  // Only the elements that draw: the <a> wrapping the circle never appears,
  // and a size-less <image> does.
  const all = host.getIntersectionList(mk(0, 0, 200, 100), null);
  testing.expectEqual(true, all instanceof NodeList);
  testing.expectEqual('dot,box,pic,label', ids(all));
  testing.expectEqual('dot,box,pic,label', ids(host.getEnclosureList(mk(0, 0, 200, 100), null)));

  // The reference element scopes the walk to its own subtree, itself excluded.
  testing.expectEqual('dot', ids(host.getIntersectionList(mk(0, 0, 200, 100), $('#link'))));

  // An empty query rect meets nothing, even at the origin where boxes sit.
  testing.expectEqual(0, host.getIntersectionList(host.createSVGRect(), null).length);
  testing.expectEqual(false, host.checkIntersection($('#dot'), host.createSVGRect()));
  testing.expectEqual(0, host.getIntersectionList(mk(500, 500, 1, 1), null).length);

  // Static, not live.
  const list = host.getIntersectionList(mk(0, 0, 200, 100), null);
  host.appendChild(document.createElementNS(ns, 'circle'));
  testing.expectEqual(4, list.length);

  host.remove();
}
</script>
