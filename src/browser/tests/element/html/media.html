<!DOCTYPE html>
<script src="../../testing.js"></script>

<audio id="audio1" src="test.mp3"></audio>
<video id="video1" src="test.mp4"></video>

<script id="canPlayType_audio">
  {
    // These answers are Chrome 150's, measured — see media/chrome_mimes.zig.
    // A container that implies its own codec answers "probably" bare; one that
    // can hold several answers "maybe" until a codec is named. The two groups
    // below are exactly that split.
    const audio = document.getElementById('audio1');
    testing.expectEqual('probably', audio.canPlayType('audio/mp3'));
    testing.expectEqual('probably', audio.canPlayType('audio/mpeg'));
    testing.expectEqual('probably', audio.canPlayType('audio/aac'));
    testing.expectEqual('probably', audio.canPlayType('audio/flac'));

    testing.expectEqual('maybe', audio.canPlayType('audio/webm'));
    testing.expectEqual('maybe', audio.canPlayType('audio/ogg'));
    testing.expectEqual('maybe', audio.canPlayType('audio/wav'));

    testing.expectEqual('', audio.canPlayType('audio/invalid'));
    testing.expectEqual('', audio.canPlayType('video/invalid'));
  }
</script>

<script id="canPlayType_video">
  {
    // Every video container Chrome supports can hold more than one codec, so
    // all three are "maybe" until one is named.
    const video = document.getElementById('video1');
    testing.expectEqual('maybe', video.canPlayType('video/mp4'));
    testing.expectEqual('maybe', video.canPlayType('video/webm'));
    testing.expectEqual('maybe', video.canPlayType('video/ogg'));
    testing.expectEqual('', video.canPlayType('video/invalid'));
  }
</script>

<script id="canPlayType_with_codecs">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual('probably', audio.canPlayType('video/mp4; codecs="avc1.42E01E"'));
    testing.expectEqual('probably', audio.canPlayType('audio/mpeg; codecs="mp3"'));
    // audio/mp3 is already as specific as it gets, so Chrome accepts no codecs
    // parameter on it at all — not even the obvious one.
    testing.expectEqual('', audio.canPlayType('audio/mp3; codecs="mp3"'));
  }
</script>

<script id="play_pause">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual(true, audio.paused);

    var resolved = false;
    audio.play().then(() => {
      resolved = true;
    });
    testing.expectEqual(false, audio.paused);

    audio.pause();
    testing.expectEqual(true, audio.paused);
    testing.onload(() => {
      testing.expectEqual(true, resolved);
    })
  }
</script>

<script id="play_pause_events">
  {
    const audio = document.createElement('audio');
    const events = [];

    audio.addEventListener('play', () => events.push('play'));
    audio.addEventListener('playing', () => events.push('playing'));
    audio.addEventListener('pause', () => events.push('pause'));
    audio.addEventListener('emptied', () => events.push('emptied'));

    // First play: paused -> playing, fires play + playing
    audio.play();
    testing.expectEqual('play,playing', events.join(','));

    // Second play: already playing, no events
    audio.play();
    testing.expectEqual('play,playing', events.join(','));

    // Pause: playing -> paused, fires pause
    audio.pause();
    testing.expectEqual('play,playing,pause', events.join(','));

    // Second pause: already paused, no event
    audio.pause();
    testing.expectEqual('play,playing,pause', events.join(','));

    // Third play: resume from pause, fires play + playing (verified in Chrome)
    audio.play();
    testing.expectEqual('play,playing,pause,play,playing', events.join(','));

    // Pause again
    audio.pause();
    testing.expectEqual('play,playing,pause,play,playing,pause', events.join(','));

    // Load: resets state, fires emptied
    audio.load();
    testing.expectEqual('play,playing,pause,play,playing,pause,emptied', events.join(','));

    // Play after load: fires play + playing
    audio.play();
    testing.expectEqual('play,playing,pause,play,playing,pause,emptied,play,playing', events.join(','));
  }
</script>

<script id="volume_muted">
  {
    const audio = document.getElementById('audio1');
    testing.expectEqual(1.0, audio.volume);
    testing.expectEqual(false, audio.muted);

    audio.volume = 0.5;
    testing.expectEqual(0.5, audio.volume);

    audio.volume = 1.5; // Should clamp to 1.0
    testing.expectEqual(1.0, audio.volume);

    audio.volume = -0.5; // Should clamp to 0.0
    testing.expectEqual(0.0, audio.volume);

    audio.muted = true;
    testing.expectEqual(true, audio.muted);
  }
</script>

<script id="ready_state_network_state">
  {
    // Create a fresh element to test initial state
    const audio = document.createElement('audio');
    testing.expectEqual(0, audio.readyState); // HAVE_NOTHING initially
    testing.expectEqual(0, audio.networkState); // NETWORK_EMPTY initially

    audio.play();
    // In headless mode, play() immediately succeeds without actual media loading
    testing.expectEqual(4, audio.readyState); // HAVE_ENOUGH_DATA in headless
    testing.expectEqual(1, audio.networkState); // NETWORK_IDLE in headless
  }
</script>

<script id="load_reset">
  {
    // Create a fresh element to test load() behavior
    const audio = document.createElement('audio');
    audio.currentTime = 50;
    audio.play();

    audio.load();
    testing.expectEqual(true, audio.paused);
    testing.expectEqual(0, audio.currentTime);
    testing.expectEqual(0, audio.readyState);
  }
</script>

<script id="create_audio_element">
  {
    const audio = document.createElement('audio');
    testing.expectEqual('[object HTMLAudioElement]', audio.toString());
    testing.expectEqual(true, audio.paused);
  }

  // Create with `Audio` constructor.
  {
    const audio = new Audio();
    testing.expectEqual(true, audio instanceof HTMLAudioElement);
    testing.expectEqual("[object HTMLAudioElement]", audio.toString());
    testing.expectEqual(true, audio.paused);
    testing.expectEqual("auto", audio.getAttribute("preload"));

</script>

<script id="media_members_a_sensor_reads">
  {
    // Every default here is measured on a headed Chrome 151
    // (tools/fingerprint/probes/expr-read-path-members.js). The interstitial
    // this work is aimed at reads canPlayType twelve times per round, which is
    // a walk over this prototype.
    const v = document.createElement('video');
    testing.expectEqual(1, v.defaultPlaybackRate);
    testing.expectEqual(true, v.preservesPitch);
    testing.expectEqual(0, v.webkitAudioDecodedByteCount);
    testing.expectEqual(0, v.webkitVideoDecodedByteCount);
    testing.expectEqual(null, v.srcObject);
    testing.expectEqual('', v.sinkId);
    // A media element's missing-value default is `eager`; an iframe's is
    // `auto` (see frames/iframe_members.html).
    testing.expectEqual('eager', v.loading);
    v.loading = 'lazy';
    testing.expectEqual('lazy', v.loading);
    testing.expectEqual('lazy', v.getAttribute('loading'));

    // defaultPlaybackRate does not move playbackRate.
    v.defaultPlaybackRate = 2.5;
    testing.expectEqual(2.5, v.defaultPlaybackRate);
    testing.expectEqual(1, v.playbackRate);

    // preservesPitch is a slot, not a reflection: nothing lands in the markup.
    v.preservesPitch = false;
    testing.expectEqual(false, v.preservesPitch);
    testing.expectEqual(null, v.getAttribute('preservespitch'));

    testing.expectEqual('DOMTokenList', v.controlsList.constructor.name);
    testing.expectEqual(0, v.controlsList.length);
    testing.expectEqual(true, v.controlsList === v.controlsList);
    v.controlsList = 'nodownload';
    testing.expectEqual('nodownload', v.getAttribute('controlslist'));

    testing.expectEqual('MediaStream', v.captureStream().constructor.name);
    testing.expectEqual(0, v.captureStream.length);
    testing.expectEqual(1, v.setSinkId.length);
  }
</script>

<script id="media_set_sink_id" type=module>
  {
    // The empty string is the default device and resolves; anything else is a
    // device this engine does not have, and the rejection carries Blink's own
    // sentence.
    const v = document.createElement('video');
    const state = await testing.async();
    const seen = [];
    v.setSinkId('')
      .then(() => seen.push('resolved:' + v.sinkId))
      .then(() => v.setSinkId('bogus'))
      .then(() => seen.push('unexpectedly resolved'), (e) => seen.push(e.name + '|' + e.message))
      .then(() => state.resolve(seen));

    await state.done((s) => {
      testing.expectEqual('resolved:', s[0]);
      testing.expectEqual('NotFoundError|Requested device not found', s[1]);
    });
  }
</script>

<!-- HTMLVideoElement's eight added members, against a headed Chrome 151. -->
<script id="video_added_members">
{
  const video = document.createElement('video');
  document.body.appendChild(video);

  // Nothing decodes, so nothing is decoded or dropped.
  testing.expectEqual(0, video.webkitDecodedFrameCount);
  testing.expectEqual(0, video.webkitDroppedFrameCount);

  testing.expectEqual(null, video.onenterpictureinpicture);
  testing.expectEqual(null, video.onleavepictureinpicture);
  video.onenterpictureinpicture = () => {};
  testing.expectEqual('function', typeof video.onenterpictureinpicture);

  testing.expectEqual(false, video.disablePictureInPicture);
  video.disablePictureInPicture = true;
  testing.expectEqual('', video.getAttribute('disablepictureinpicture'));

  // Handles count up from 1 per element; nothing ever presents a frame, so
  // the callback never runs -- which is what a <video> with no source does in
  // Chrome too.
  testing.expectEqual(1, video.requestVideoFrameCallback(() => {}));
  testing.expectEqual(2, video.requestVideoFrameCallback(() => {}));
  testing.expectEqual(undefined, video.cancelVideoFrameCallback(1));
  testing.expectEqual(undefined, video.cancelVideoFrameCallback(9999));
  testing.expectError('TypeError', () => video.requestVideoFrameCallback());

  // Rejects rather than throws, and the reason is the missing metadata.
  const pip = video.requestPictureInPicture();
  testing.expectEqual(true, pip instanceof Promise);
  pip.catch((e) => {
    testing.expectEqual('InvalidStateError', e.name);
    testing.expectEqual(
      "Failed to execute 'requestPictureInPicture' on 'HTMLVideoElement': Metadata for the video element are not loaded yet.",
      e.message,
    );
  });

  video.remove();
}
</script>
