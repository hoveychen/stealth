<!DOCTYPE html>
<script src="../../testing.js"></script>

<script id="frameset_constructor">
  // Regression for #2249: Angular 9's zone.js polyfill reaches for
  // HTMLFrameSetElement during __load_patch. The constructor must exist as a
  // global and instances must report the standard tag, type, and prototype
  // chain.
  //
  // Note: an inline <frameset> cannot be used here. The HTML5 parser switches
  // to the "in frameset" insertion mode on a top-level <frameset>, after which
  // all <script> tokens are ignored — so we exercise the element via
  // createElement instead.
  testing.expectEqual("function", typeof HTMLFrameSetElement)

  const fs = document.createElement('frameset')
  testing.expectEqual("[object HTMLFrameSetElement]", fs.toString())
  testing.expectEqual("FRAMESET", fs.tagName)
  testing.expectEqual(true, fs instanceof HTMLFrameSetElement)
  testing.expectEqual(true, fs instanceof HTMLElement)
</script>

<script id="windowed_handler_set">
  {
    // Chrome's HTMLFrameSetElement.prototype carries the same handler set
    // HTMLBodyElement.prototype does (measured), and the window-reflecting
    // ones are aliases for the Window's slots.
    const fs = document.createElement('frameset');
    const names = Object.getOwnPropertyNames(HTMLFrameSetElement.prototype);
    const body = Object.getOwnPropertyNames(HTMLBodyElement.prototype).filter((n) => n.startsWith('on'));
    testing.expectEqual(body.join(','), names.filter((n) => n.startsWith('on')).join(','));

    const f = () => {};
    fs.onunload = f;
    testing.expectEqual(true, window.onunload === f);
    fs.onunload = null;
    testing.expectEqual(null, window.onunload);

    fs.onhashchange = f;
    testing.expectEqual(true, window.onhashchange === f);
    fs.onhashchange = null;

    // The two gamepad handlers are element-local, not window aliases.
    fs.ongamepadconnected = f;
    testing.expectEqual(true, fs.ongamepadconnected === f);
    testing.expectEqual(null, window.ongamepadconnected);
    fs.ongamepadconnected = null;
  }
</script>
