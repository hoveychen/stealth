<script id="Image">
{
    let i1 = new Image()
    testing.expectEqual(0, i1.width);
    testing.expectEqual(null, i1.getAttribute('width'));
    testing.expectEqual(0, i1.height);
    testing.expectEqual(null, i1.getAttribute('height'));

    let i2 = new Image(10)
    testing.expectEqual(10, i2.width);
    testing.expectEqual('10', i2.getAttribute('width'));
    testing.expectEqual(0, i2.height);
    testing.expectEqual(null, i2.getAttribute('height'));

    let i3 = new Image(10, 20)
    testing.expectEqual(10, i3.width);
    testing.expectEqual('10', i3.getAttribute('width'));
    testing.expectEqual(20, i3.height);
    testing.expectEqual('20', i3.getAttribute('height'));
}
</script>

<script id="src_alt">
{
    const img = document.createElement('img');

    testing.expectEqual('', img.src);
    testing.expectEqual('', img.alt);
    testing.expectEqual('', img.currentSrc);

    img.src = 'test.png';
    // src property returns resolved absolute URL
    testing.expectEqual(testing.BASE_URL + 'element/html/test.png', img.src);
    testing.expectEqual(testing.BASE_URL + 'element/html/test.png', img.currentSrc);
    // getAttribute returns the raw attribute value
    testing.expectEqual('test.png', img.getAttribute('src'));

    img.src = '/absolute/path.png';
    testing.expectEqual(testing.ORIGIN + '/absolute/path.png', img.src);
    testing.expectEqual('/absolute/path.png', img.getAttribute('src'));

    // A fully-qualified URL passes through instead of resolving against base.
    // Kept on the test origin on purpose: setting src now issues a real
    // request (see Frame.loadImage), and a public hostname here would make the
    // suite depend on the network.
    img.src = testing.ORIGIN + '/qualified/image.png';
    testing.expectEqual(testing.ORIGIN + '/qualified/image.png', img.src);
    testing.expectEqual(testing.ORIGIN + '/qualified/image.png', img.getAttribute('src'));

    img.alt = 'Test image';
    testing.expectEqual('Test image', img.alt);
    testing.expectEqual('Test image', img.getAttribute('alt'));
}
</script>

<script id="complete">
{
    // Image with no src is complete per spec
    const img = document.createElement('img');
    testing.expectEqual(true, img.complete);

    // Image with src is also complete (headless browser, no actual fetch)
    img.src = 'test.png';
    testing.expectEqual(true, img.complete);

    // Image constructor also complete
    const img2 = new Image();
    testing.expectEqual(true, img2.complete);
}

<body></body>

<script id="broken_image_box">
{
    // An image whose bytes never become a picture still occupies a box: Chrome
    // draws the 16x16 broken-image icon for it. bot.sannysoft.com has a row
    // ("Broken Image Dimensions") that reads exactly this, and 0x0 -- or this
    // engine's old 5x5 placeholder -- is a reading no browser gives.
    //
    // Every image is broken here: the bytes are fetched but never decoded (see
    // `Frame.loadImage`), which is why the intrinsic size stays 0 while the box
    // does not. Readings below are from Chrome 151 (probe expr-broken-image.js).
    const img = document.createElement('img');
    img.src = 'broken.png';
    document.body.appendChild(img);

    testing.expectEqual(16, img.width);
    testing.expectEqual(16, img.height);
    testing.expectEqual(16, img.offsetWidth);
    testing.expectEqual(16, img.offsetHeight);
    testing.expectEqual(16, img.getBoundingClientRect().width);
    testing.expectEqual(16, img.getBoundingClientRect().height);

    // The icon is the layout box, not the image: nothing was decoded, so the
    // intrinsic size stays 0 and the request is settled.
    testing.expectEqual(0, img.naturalWidth);
    testing.expectEqual(0, img.naturalHeight);
    testing.expectEqual(true, img.complete);

    // A declared size wins over the icon, on both the IDL and the box.
    img.setAttribute('width', '100');
    img.setAttribute('height', '40');
    testing.expectEqual(100, img.width);
    testing.expectEqual(40, img.height);
    testing.expectEqual(100, img.offsetWidth);
    testing.expectEqual(40, img.offsetHeight);

    img.remove();
}
</script>

<script id="broken_image_box_needs_rendering">
{
    // The icon is a rendering, so it needs an element that renders. Chrome
    // reports 0 for a detached <img>, and 0 for a connected one with no src --
    // in both cases `width` falls back to the content attribute.
    const detached = document.createElement('img');
    detached.src = 'broken.png';
    testing.expectEqual(0, detached.width);
    testing.expectEqual(0, detached.height);

    detached.setAttribute('width', '100');
    testing.expectEqual(100, detached.width);
    testing.expectEqual(0, detached.height);

    const srcless = document.createElement('img');
    document.body.appendChild(srcless);
    testing.expectEqual(0, srcless.width);
    testing.expectEqual(0, srcless.height);
    srcless.remove();
}
</script>

<script id="img-load-event" type=module>
  // An img fires a load event when src is set. Served locally, like every
  // other image on this page: the test server answers any path ending in an
  // image extension with a one-pixel PNG, and the event now depends on those
  // bytes (see `Frame.ImageRequest`), so a public URL here would make the
  // assertion a network check.
  const state = await testing.async();
  const img = document.createElement("img");

  img.addEventListener("load", (e) => {
    state.resolve(e);
  });
  img.src = "/served/load-event.png";

  await state.done((e) => {
    testing.expectEqual(false, e.bubbles);
    testing.expectEqual(false, e.cancelBubble);
    testing.expectEqual(false, e.cancelable);
    testing.expectEqual(false, e.composed);
    testing.expectEqual(true, e.isTrusted);
    testing.expectEqual(img, e.target);
  });
</script>

<script id="img-error-on-failed-request" type=module>
  // A request that fails fires `error`, not `load`. Chrome 151 answers `error`
  // for a 404, a refused connection, an unknown scheme and an undecodable
  // data: URL, and `load` only for bytes that arrive (probe
  // `expr-img-events.js`). This engine queued `load` the moment a src was set,
  // whatever the fetch then did -- which is what leaves bot.sannysoft.com's
  // "Broken Image Dimensions" row blank, since that cell is written from
  // onerror.
  //
  // `broken.png` is under /src/browser/tests/, where the test server serves
  // real files and 404s for the ones that are missing.
  const state = await testing.async();
  const img = document.createElement("img");
  const seen = [];
  img.addEventListener("load", () => { seen.push("load"); state.resolve(seen); });
  img.addEventListener("error", (e) => { seen.push("error"); state.resolve(e); });
  document.body.appendChild(img);
  img.src = "broken.png";

  await state.done((e) => {
    testing.expectEqual("error", seen.join(","));
    // Same shape as the load event next to it: an untrusted-looking event
    // would be its own tell.
    testing.expectEqual(false, e.bubbles);
    testing.expectEqual(false, e.cancelable);
    testing.expectEqual(true, e.isTrusted);
    testing.expectEqual(img, e.target);
  });
</script>

<script id="img-load-on-served-bytes" type=module>
  // The other side of the same line: a request that answers 2xx still fires
  // `load` and nothing else. Any path ending in an image extension is served a
  // one-pixel PNG by the test server.
  const state = await testing.async();
  const img = document.createElement("img");
  const seen = [];
  img.addEventListener("load", () => { seen.push("load"); state.resolve(seen); });
  img.addEventListener("error", () => { seen.push("error"); state.resolve(seen); });
  document.body.appendChild(img);
  img.src = "/served/pixel.png";

  await state.done(() => {
    testing.expectEqual("load", seen.join(","));
  });
</script>

<script id="img-error-on-non-image-bytes" type=module>
  // 200 is not the line. Chrome 151 answers `error` for a response that
  // arrives with a 2xx and an HTML body (probe `expr-img-events.js`): what
  // decides the event is whether the bytes decode into a picture, and a status
  // code cannot see that. Serving a page in an image's clothing is a shape the
  // real web has -- an interstitial, a login redirect landing as 200 -- so
  // firing `load` on it is a reading no browser gives.
  //
  // `/served/html-bytes.png` is the test server's fixture for exactly this:
  // 200, `Content-Type: text/html`, HTML bytes.
  const state = await testing.async();
  const img = document.createElement("img");
  const seen = [];
  img.addEventListener("load", () => { seen.push("load"); state.resolve(seen); });
  img.addEventListener("error", () => { seen.push("error"); state.resolve(seen); });
  document.body.appendChild(img);
  img.src = "/served/html-bytes.png";

  await state.done(() => {
    testing.expectEqual("error", seen.join(","));
  });
</script>

<script id="img-event-is-decided-by-the-bytes" type=module>
  // Which of the three inputs -- status, declared type, body -- settles the
  // event? Each fixture below varies exactly one of them, and every expected
  // value here was read off Chrome 151 by
  // `node tools/fingerprint/img-sniff.mjs chrome`, which serves the same set
  // and asks an engine the same question.
  //
  // The answer is that only the body has a say: PNG bytes load while disowned
  // by the header and while behind a 404, and HTML bytes error while dressed as
  // image/png. SVG is the exception -- no signature to match, so it is taken
  // from the declared type -- and the run confirms Chrome refuses it under any
  // other type.
  const state = await testing.async();
  const cases = {
    "/served/octet-stream.png": "load",
    "/served/no-content-type.png": "load",
    "/served/png-bytes-404.png": "load",
    "/served/html-as-png.png": "error",
    "/served/truncated.png": "error",
    "/served/vector.svg": "load",
    "/served/svg-as-text.svg": "error",
  };

  const seen = {};
  for (const src of Object.keys(cases)) {
    const img = document.createElement("img");
    document.body.appendChild(img);
    seen[src] = await new Promise((resolve) => {
      img.addEventListener("load", () => resolve("load"));
      img.addEventListener("error", () => resolve("error"));
      img.src = src;
    });
    img.remove();
  }
  state.resolve(seen);

  await state.done((seen) => {
    // One comparison rather than seven: a mismatch names the fixture that
    // moved, instead of only the first one.
    testing.expectEqual(JSON.stringify(cases), JSON.stringify(seen));
  });
</script>

<script id="lazy-src-set">
{
  // Append to DOM first, then set src — load should still fire.
  const img = document.createElement("img");
  let result = false;
  img.onload = () => result = true;
  document.body.appendChild(img);
  img.src = "/served/lazy-src.png";

  testing.onload(() => testing.expectEqual(true, result));
}

<!-- The eight members this batch added, against a headed Chrome 151
     (tools/fingerprint/probes/expr-html-family-semantics.js). -->
<script id="image_added_members">
{
  const img = document.createElement('img');
  document.body.appendChild(img);

  testing.expectEqual('', img.sizes);
  img.setAttribute('sizes', '100vw');
  testing.expectEqual('100vw', img.sizes);
  img.sizes = '50vw';
  testing.expectEqual('50vw', img.getAttribute('sizes'));

  // Missing and invalid both fall back to "auto".
  testing.expectEqual('auto', img.fetchPriority);
  img.setAttribute('fetchpriority', 'high');
  testing.expectEqual('high', img.fetchPriority);
  img.setAttribute('fetchpriority', 'bogus');
  testing.expectEqual('auto', img.fetchPriority);
  img.fetchPriority = 'low';
  testing.expectEqual('low', img.getAttribute('fetchpriority'));

  // The only position this engine has, which is the one offsetLeft answers.
  testing.expectEqual(img.offsetLeft, img.x);
  testing.expectEqual(img.offsetTop, img.y);

  testing.expectEqual(true, img.decode() instanceof Promise);
  testing.expectEqual(0, HTMLImageElement.prototype.decode.length);

  // Three boolean-ish reflections Blink installs per context, which is why
  // they sit after `constructor` on the prototype.
  testing.expectEqual(false, img.browsingTopics);
  img.browsingTopics = true;
  testing.expectEqual('', img.getAttribute('browsingtopics'));
  testing.expectEqual(true, img.browsingTopics);
  testing.expectEqual(false, img.sharedStorageWritable);
  img.setAttribute('sharedstoragewritable', '');
  testing.expectEqual(true, img.sharedStorageWritable);
  testing.expectEqual('', img.attributionSrc);
  img.setAttribute('attributionsrc', '/a');
  testing.expectEqual('/a', img.attributionSrc);

  img.remove();
}
</script>

<script id="img-intrinsic-size" type=module>
  // A picture that arrived has an intrinsic size, and a page reads it through
  // `naturalWidth`/`naturalHeight`. This engine answered 0 for both while also
  // firing `load` and answering `complete === true` -- a combination no browser
  // produces. Chrome with images turned off
  // (`--blink-settings=imagesEnabled=false`) leaves `complete` at false and
  // fires nothing at all; Chrome with images on answers a real size. "Loaded,
  // and no size" is a shape only this engine had.
  //
  // Nothing here decodes pixels. The size comes out of the header the sniffer
  // already reads to decide `load` against `error`, which is why two formats
  // are checked: they come from two different parsers.
  const state = await testing.async();
  const img = document.createElement("img");
  img.addEventListener("load", () => state.resolve("load"));
  img.addEventListener("error", () => state.resolve("error"));
  document.body.appendChild(img);
  img.src = "/served/intrinsic-7x3.png";

  await state.done((seen) => {
    // Joined into one string on purpose: a bare `expectEqual(7, ...)` red
    // light prints "expected true got false" and says nothing about which of
    // the two numbers moved.
    testing.expectEqual("load", seen);
    testing.expectEqual("7x3", img.naturalWidth + "x" + img.naturalHeight);
    testing.expectEqual(true, img.complete);

    // The box follows the intrinsic size, not the 16x16 broken-image icon.
    testing.expectEqual("7x3", img.width + "x" + img.height);
    testing.expectEqual("7x3", img.offsetWidth + "x" + img.offsetHeight);
    const rect = img.getBoundingClientRect();
    testing.expectEqual("7x3", rect.width + "x" + rect.height);

    img.remove();
  });
</script>

<script id="img-intrinsic-size-absent-when-nothing-arrived" type=module>
  // The other side of the same line, which is what stops this from becoming
  // "answer a size for everything": bytes that never became a picture still
  // read 0 and still draw the icon. `/served/html-bytes.png` is a page in an
  // image's clothing, so the request succeeds and the decode does not.
  const state = await testing.async();
  const img = document.createElement("img");
  img.addEventListener("load", () => state.resolve("load"));
  img.addEventListener("error", () => state.resolve("error"));
  document.body.appendChild(img);
  img.src = "/served/html-bytes.png";

  await state.done((seen) => {
    testing.expectEqual("error", seen);
    testing.expectEqual("0x0", img.naturalWidth + "x" + img.naturalHeight);
    testing.expectEqual("16x16", img.offsetWidth + "x" + img.offsetHeight);
    img.remove();
  });
</script>

<script id="img-intrinsic-size-svg" type=module>
  // SVG is the one image type with no binary header, so its size is markup:
  // the root element's `width`/`height`, with `viewBox` supplying a ratio and
  // the replaced-element default (300x150) standing in for whatever is left.
  // All four rows measured on Chrome 151, probe
  // `scratch/b90/expr-img-geometry.js`, against the same markup.
  const cases = {
    "/served/svg-sized.svg": "4x6",      // both axes declared
    "/served/svg-bare.svg": "300x150",   // neither: the default
    "/served/svg-one-axis.svg": "40x150",// one declared, one defaulted
    "/served/svg-ratio.svg": "40x10",    // one declared, one from the viewBox
  };
  for (const [url, expected] of Object.entries(cases)) {
    const state = await testing.async();
    const img = document.createElement("img");
    img.addEventListener("load", () => state.resolve("load"));
    img.addEventListener("error", () => state.resolve("error"));
    document.body.appendChild(img);
    img.src = url;

    await state.done((seen) => {
      testing.expectEqual(url + " load", url + " " + seen);
      testing.expectEqual(url + " " + expected, url + " " + img.naturalWidth + "x" + img.naturalHeight);
      testing.expectEqual(url + " " + expected, url + " " + img.offsetWidth + "x" + img.offsetHeight);
      img.remove();
    });
  }
</script>

<script id="img-second-load-is-served-from-memory" type=module>
  // A second <img> for a URL this document already loaded must not reach the
  // server. Chrome answers it out of the renderer's memory cache and leaves no
  // second resource entry behind; measured seven ways on Chrome 151
  // (scratch/b69/img-cache-fixture.mjs): two Images in sequence, two in the
  // same task, one element whose src is assigned twice, markup plus a scripted
  // Image, and a response carrying `Cache-Control: no-store` all cost ONE
  // request. Only an error response and a request in a different CORS mode are
  // asked for again.
  //
  // Why it is worth a test: the difference is invisible from the page -- both
  // loads fire `load` and report the same size either way -- and visible to
  // the server. Cloudflare's challenge loads its `ci` PNG as an Image, and on
  // cf-scrapingcourse this engine asked for it twice in 3 runs of 3 while
  // Chrome asked once (scratch/b69/alt-*.log).
  const state = await testing.async();
  const url = "/served/counted.png";
  const hits = async () => Number(await (await fetch("/served/counted-hits")).text());
  const load = () => new Promise((r) => {
    const img = document.createElement("img");
    img.addEventListener("load", () => r("load"));
    img.addEventListener("error", () => r("error"));
    document.body.appendChild(img);
    img.src = url;
  });

  const before = await hits();
  const first = await load();
  const second = await load();
  const after = await hits();
  const entries = performance.getEntriesByName(testing.ORIGIN + url, "resource").length;
  state.resolve({ first, second, requests: after - before, entries });

  await state.done((r) => {
    testing.expectEqual("load,load", r.first + "," + r.second);
    testing.expectEqual("requests 1", "requests " + r.requests);
    testing.expectEqual("entries 1", "entries " + r.entries);
  });
</script>
