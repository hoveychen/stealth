<!DOCTYPE html>
<script src="../../testing.js"></script>

<video id="video1">
  <track id="track1" kind="subtitles">
  <track id="track2" kind="captions">
  <track id="track3" kind="invalid-kind">
</video>

<script id="instanceof">
{
  const track = document.createElement("track");
  testing.expectEqual(true, track instanceof HTMLTrackElement);
  testing.expectEqual("[object HTMLTrackElement]", track.toString());
}
</script>

<script id="kind_default">
{
  const track = document.createElement("track");
  testing.expectEqual("subtitles", track.kind);
}
</script>

<script id="kind_valid_values">
{
  const track = document.createElement("track");

  track.kind = "captions";
  testing.expectEqual("captions", track.kind);

  track.kind = "descriptions";
  testing.expectEqual("descriptions", track.kind);

  track.kind = "chapters";
  testing.expectEqual("chapters", track.kind);

  track.kind = "metadata";
  testing.expectEqual("metadata", track.kind);
}
</script>

<script id="kind_invalid">
{
  const track = document.createElement("track");

  track.kind = null;
  testing.expectEqual("metadata", track.kind);

  track.kind = "Subtitles";
  testing.expectEqual("subtitles", track.kind);

  track.kind = "";
  testing.expectEqual("metadata", track.kind);
}
</script>

<script id="constants">
{
  const track = document.createElement("track");
  testing.expectEqual(0, track.NONE);
  testing.expectEqual(1, track.LOADING);
  testing.expectEqual(2, track.LOADED);
  testing.expectEqual(3, track.ERROR);
}
</script>

<script id="constants_static">
{
  testing.expectEqual(0, HTMLTrackElement.NONE);
  testing.expectEqual(1, HTMLTrackElement.LOADING);
  testing.expectEqual(2, HTMLTrackElement.LOADED);
  testing.expectEqual(3, HTMLTrackElement.ERROR);
}
</script>

<!-- readyState and the TextTrack the element owns, against a headed Chrome 151. -->
<script id="track_ready_state_and_track">
{
  const video = document.createElement('video');
  video.innerHTML = '<track id=cc src="/t.vtt" kind="captions" srclang="en" label="English" default>';
  document.body.appendChild(video);
  const cc = video.querySelector('#cc');

  // Nothing loads the cue file, so it never leaves NONE -- which is also what
  // Chrome answers for a <track> its media has not been asked to load.
  testing.expectEqual(0, cc.readyState);
  testing.expectEqual(HTMLTrackElement.NONE, cc.readyState);

  testing.expectEqual(true, cc.track instanceof TextTrack);
  testing.expectEqual(true, cc.track === cc.track);
  testing.expectEqual('captions', cc.track.kind);
  testing.expectEqual('English', cc.track.label);
  testing.expectEqual('en', cc.track.language);
  // `default` starts it showing; without it the track is disabled.
  testing.expectEqual('showing', cc.track.mode);

  // Reading the track registers it with the owning media element.
  testing.expectEqual(1, video.textTracks.length);
  testing.expectEqual(cc.track, video.textTracks[0]);

  const plain = document.createElement('video');
  plain.innerHTML = '<track id=plainTrack src="/t.vtt">';
  document.body.appendChild(plain);
  const plainTrack = plain.querySelector('#plainTrack');
  testing.expectEqual('subtitles', plainTrack.track.kind);
  testing.expectEqual('disabled', plainTrack.track.mode);

  video.remove();
  plain.remove();
}
</script>
