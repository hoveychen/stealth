<!DOCTYPE html>
<script src="../../testing.js"></script>

<select id="select1">
  <option id="opt1" value="val1">Text 1</option>
  <option id="opt2" value="val2" selected>Text 2</option>
  <option id="opt3">Text 3</option>
  <option id="opt4" disabled>Text 4</option>
</select>

<script id="value_with_attribute">
  testing.expectEqual('val1', $('#opt1').value)
  testing.expectEqual('val2', $('#opt2').value)
</script>

<script id="value_without_attribute">
  // When value attribute is not present, value should be text content
  testing.expectEqual('Text 3', $('#opt3').value)
</script>

<script id="value_set">
  $('#opt1').value = 'changed'
  testing.expectEqual('changed', $('#opt1').value)
</script>

<script id="value_set_attribute">
  {
    const option = document.createElement('option')

    // short values are stored inline in the String passed to our
    // attributeChange hook, long ones are heap-backed
    option.setAttribute('value', 'ab')
    testing.expectEqual('ab', option.value)

    option.setAttribute('value', 'a-long-attribute-value')
    testing.expectEqual('a-long-attribute-value', option.value)

    option.removeAttribute('value')
    testing.expectEqual('', option.value)
  }
</script>

<script id="text">
  testing.expectEqual('Text 1', $('#opt1').text)
  testing.expectEqual('Text 2', $('#opt2').text)
  testing.expectEqual('Text 3', $('#opt3').text)
</script>

<option id="opt_labelled" label="Explicit Label">Inner Text</option>

<script id="label">
  // https://html.spec.whatwg.org/multipage/form-elements.html#dom-option-label
  // No label attribute: falls back to the text.
  testing.expectEqual('Text 1', $('#opt1').label)
  // label attribute present and non-empty: returned as-is.
  testing.expectEqual('Explicit Label', $('#opt_labelled').label)
  // Setting reflects to the label content attribute.
  $('#opt1').label = 'Set Label'
  testing.expectEqual('Set Label', $('#opt1').label)
  testing.expectEqual('Set Label', $('#opt1').getAttribute('label'))
  // An empty label attribute falls back to the text, per spec.
  $('#opt1').setAttribute('label', '')
  testing.expectEqual('Text 1', $('#opt1').label)
</script>

<script id="text_set">
  $('#opt1').text = 'New Text 1'
  testing.expectEqual('New Text 1', $('#opt1').text)
  testing.expectEqual('New Text 1', $('#opt1').textContent)
</script>

<script id="selected">
  testing.expectEqual(false, $('#opt1').selected)
  testing.expectEqual(true, $('#opt2').selected)
  testing.expectEqual(false, $('#opt3').selected)
</script>

<script id="selected_set">
  $('#opt1').selected = true
  testing.expectEqual(true, $('#opt1').selected)

  $('#opt2').selected = false
  testing.expectEqual(false, $('#opt2').selected)
</script>

<script id="defaultSelected">
  testing.expectEqual(false, $('#opt1').defaultSelected)
  testing.expectEqual(true, $('#opt2').defaultSelected)
  testing.expectEqual(false, $('#opt3').defaultSelected)

  // Setting selected shouldn't change defaultSelected
  $('#opt1').selected = true
  testing.expectEqual(false, $('#opt1').defaultSelected)
</script>

<script id="disabled">
  testing.expectEqual(false, $('#opt1').disabled)
  testing.expectEqual(true, $('#opt4').disabled)
</script>

<script id="disabled_set">
  $('#opt1').disabled = true
  testing.expectEqual(true, $('#opt1').disabled)

  $('#opt4').disabled = false
  testing.expectEqual(false, $('#opt4').disabled)
</script>

<option id="named1" name="choice1">Named option</option>

<!-- HTMLOptionElement is one of the few form-associated interfaces that does
     not reflect `name`: Chrome's prototype has no such member at all, so the
     attribute stays an attribute and nothing else. -->
<script id="name_is_not_reflected">
  testing.expectEqual(undefined, $('#named1').name)
  testing.expectEqual('choice1', $('#named1').getAttribute('name'))
  testing.expectTrue(!('name' in HTMLOptionElement.prototype))
</script>

<!-- The prototype shape, in Chrome's own member order (measured, probe-win28). -->
<script id="option_prototype_shape">
  testing.expectEqual('disabled,form,label,defaultSelected,selected,value,text,index',
    Object.getOwnPropertyNames(HTMLOptionElement.prototype).filter((k) => k !== 'constructor').join(','))
  testing.expectEqual('HTMLOptionElement', HTMLOptionElement.prototype[Symbol.toStringTag])
</script>

<!-- The `Option` legacy factory function. -->
<script id="option_factory_function">
  {
    testing.expectEqual(0, Option.length)
    testing.expectTrue(Option.prototype === HTMLOptionElement.prototype)
    // Neither global name is enumerable.
    testing.expectEqual(false, Object.getOwnPropertyDescriptor(window, 'Option').enumerable)
    testing.expectEqual(false, Object.getOwnPropertyDescriptor(window, 'HTMLOptionElement').enumerable)

    testing.expectEqual('<option></option>', new Option().outerHTML)
    testing.expectEqual('<option value="v"></option>', new Option(undefined, 'v').outerHTML)
    testing.expectEqual('<option value="null">null</option>', new Option(null, null).outerHTML)
    testing.expectEqual('<option>T</option>', new Option('T').outerHTML)
    testing.expectEqual('<option value="6">5</option>', new Option(5, 6).outerHTML)
    // Chrome writes `selected=""`; this engine writes a bare `selected` for
    // empty boolean attributes (see formatAttribute in element/Attribute.zig),
    // which is a serializer-wide difference, not an Option one.
    testing.expectEqual('<option value="V" selected>T</option>', new Option('T', 'V', true, true).outerHTML)
    testing.expectEqual('<option value="V" selected>T</option>', new Option('T', 'V', true).outerHTML)
    testing.expectEqual(true, new Option('T', 'V', true).defaultSelected)
    testing.expectEqual(true, new Option('T', 'V', true).selected)

    // The third argument is defaultSelected (the content attribute), the
    // fourth is selectedness on its own.
    const live = new Option('T', 'V', false, true)
    testing.expectEqual('<option value="V">T</option>', live.outerHTML)
    testing.expectEqual(true, live.selected)
    testing.expectEqual(false, live.defaultSelected)

    const bare = new Option()
    testing.expectEqual('[object HTMLOptionElement]', String(bare))
    testing.expectEqual('OPTION', bare.tagName)
    testing.expectEqual('', bare.text)
    testing.expectEqual('', bare.value)
    testing.expectEqual(null, bare.form)
    testing.expectEqual(0, bare.index)
    testing.expectEqual('', bare.label)
  }
</script>

<!-- form and index both come from the option's select, not its ancestors. -->
<form id="opt_form">
  <select id="opt_select">
    <option id="opt_i0">zero</option>
    <optgroup label="g"><option id="opt_i1">one</option></optgroup>
  </select>
  <option id="opt_loose">loose</option>
</form>

<script id="option_form_and_index">
  testing.expectEqual($('#opt_form'), $('#opt_i0').form)
  testing.expectEqual($('#opt_form'), $('#opt_i1').form)
  testing.expectEqual(0, $('#opt_i0').index)
  testing.expectEqual(1, $('#opt_i1').index)

  // An option that is in the form but not in a select has no form owner.
  testing.expectEqual(null, $('#opt_loose').form)
  testing.expectEqual(0, $('#opt_loose').index)
</script>

<!-- defaultSelected is writable, and reflects the `selected` attribute. -->
<script id="default_selected_set">
  {
    const option = new Option('T')
    option.defaultSelected = true
    testing.expectEqual('', option.getAttribute('selected'))
    testing.expectEqual(true, option.defaultSelected)

    option.defaultSelected = false
    testing.expectEqual(null, option.getAttribute('selected'))
    testing.expectEqual(false, option.defaultSelected)
  }
</script>
