<!DOCTYPE html>
<script src="../../testing.js"></script>

<fieldset id="fs1" disabled name="group1">
  <input type="text">
</fieldset>
<fieldset id="fs2">
  <input type="text">
</fieldset>

<script id="disabled">
  {
    const fs1 = document.getElementById('fs1');
    testing.expectEqual(true, fs1.disabled);

    fs1.disabled = false;
    testing.expectEqual(false, fs1.disabled);

    const fs2 = document.getElementById('fs2');
    testing.expectEqual(false, fs2.disabled);
  }
</script>

<script id="name">
  {
    const fs1 = document.getElementById('fs1');
    testing.expectEqual('group1', fs1.name);

    fs1.name = 'updated';
    testing.expectEqual('updated', fs1.name);

    const fs2 = document.getElementById('fs2');
    testing.expectEqual('', fs2.name);
  }
</script>

<script id="type_and_form">
  {
    const form = document.createElement('form');
    const fs = document.createElement('fieldset');
    form.appendChild(fs);
    document.body.appendChild(form);

    testing.expectEqual('fieldset', fs.type);
    testing.expectEqual(true, fs.form === form);
    testing.expectEqual(null, document.createElement('fieldset').form);

    form.remove();
  }
</script>

<script id="barred_from_constraint_validation">
  {
    // A fieldset never validates, but setCustomValidity still shows through
    // the ValidityState. Measured on Chrome 151: willValidate false,
    // checkValidity true, validationMessage "" — and customError true.
    const fs = document.createElement('fieldset');
    testing.expectEqual(false, fs.willValidate);
    testing.expectEqual('ValidityState', fs.validity.constructor.name);
    testing.expectEqual(true, fs.validity === fs.validity);
    testing.expectEqual(true, fs.validity.valid);
    testing.expectEqual('', fs.validationMessage);
    testing.expectEqual(true, fs.checkValidity());
    testing.expectEqual(true, fs.reportValidity());

    let fired = false;
    fs.addEventListener('invalid', () => { fired = true; });
    fs.setCustomValidity('boom');
    testing.expectEqual(true, fs.validity.customError);
    testing.expectEqual(false, fs.validity.valid);
    testing.expectEqual('', fs.validationMessage);
    testing.expectEqual(true, fs.checkValidity());
    testing.expectEqual(false, fs.willValidate);
    testing.expectEqual(false, fired);

    fs.setCustomValidity('');
    testing.expectEqual(false, fs.validity.customError);
    testing.expectEqual(true, fs.validity.valid);
  }
</script>

<script id="elements">
  {
    // The listed elements among the descendants. Unlike form.elements this
    // keeps <input type=image> (measured on Chrome 151).
    const fs = document.createElement('fieldset');
    fs.innerHTML = '<input name=a><input type=image name=b><select name=c></select>' +
      '<div><button name=d></button></div><output name=e></output><object name=f></object>' +
      '<img name=g><a name=h></a>';
    document.body.appendChild(fs);

    testing.expectEqual('HTMLCollection', fs.elements.constructor.name);
    testing.expectEqual(6, fs.elements.length);
    testing.expectEqual('a,b,c,d,e,f', Array.from(fs.elements, (e) => e.name).join(','));

    fs.appendChild(document.createElement('textarea'));
    testing.expectEqual(7, fs.elements.length);

    fs.remove();
  }
</script>

<fieldset id="fs-off" disabled>
  <legend><input id="in-legend" type="text"></legend>
  <input id="in-body" type="text">
  <div><button id="btn-body" type="submit">go</button></div>
</fieldset>

<script id="disabled-state">
  {
    // The IDL attribute reflects only the element's own attribute; the
    // disabled state (activation, constraint validation) also comes from a
    // disabled fieldset ancestor, except through its first <legend>.
    const body = document.getElementById('in-body');
    testing.expectEqual(false, body.disabled);
    testing.expectEqual(false, body.willValidate);
    testing.expectEqual(false, document.getElementById('btn-body').willValidate);
    let clicked = false;
    body.addEventListener('click', () => { clicked = true; });
    body.click();
    testing.expectEqual(false, clicked);

    const legend = document.getElementById('in-legend');
    testing.expectEqual(true, legend.willValidate);
    legend.addEventListener('click', () => { clicked = true; });
    legend.click();
    testing.expectEqual(true, clicked);

    document.getElementById('fs-off').disabled = false;
    testing.expectEqual(true, body.willValidate);
  }
</script>
