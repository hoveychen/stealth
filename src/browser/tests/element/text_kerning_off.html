<!DOCTYPE html>
<script src="../testing.js"></script>
<div id=anchor></div>

<!--
Turning kerning OFF. Chrome has three switches for it and this engine had none:
`font-kerning`, `font-feature-settings: "kern" 0` and, for the other half of the
feature, `text-rendering` / `font-variant-ligatures`. Measured, they split three
ways and not one (scratch/b100/expr-kern-table.js, 48 rows of six families by
eight pairs by ten declarations):

  * `font-kerning: none` and `font-feature-settings: "kern" 0` turn kerning off
    and leave ligatures. Identical on all 48 rows.
  * `font-variant-ligatures: none` and `text-rendering: optimizeSpeed` turn
    LIGATURES off and leave kerning. Equal to the default on all 48 rows.
  * `font-kerning: normal`, `font-kerning: auto`, `"kern" 1`,
    `optimizeLegibility` and `geometricPrecision` are the default. All 48 rows.

Only the first bullet is implemented, and that is deliberate rather than a
half-done job: this engine forms no ligatures at all -- 'Waffle fi' comes out
NARROWER than Chrome's own no-ligature width -- so a ligature switch here would
be a switch over nothing, with no reading to assert it against. The two
ligature declarations are in the control column below precisely because they
must stay no-ops, and if this engine ever grows ligatures they are where the
next author starts.

Every expectation is Chrome 151, headed, at `--force-device-scale-factor=2`.

The absolute numbers are safe in both columns and that was checked, not assumed:
  * the DEFAULT column agreed with this engine bit for bit on 222 of 222 pair
    widths before any of this (scratch/b100/expr-kern-pairs.js), and
  * the KERNING-OFF column is, by definition, the sum of the glyphs' advances --
    and Chrome's number equals the sum THIS engine's advance table produces on
    all 48 pairs and on every longer string below (scratch/b101/expr-advance-sums.js,
    scratch/b101/expr-string-sums.js: 115.5390625 for 'AVATAR To Wo',
    55.9765625 for 'ab To cd', 56.875 for 'ab ' + bold 'To' + ' cd').
So a red line here is about the switch and cannot be about the table.

monospace and Georgia are the controls across families: Chrome kerns not one of
these eight pairs in either, so the switch must leave all sixteen of their rows
alone. Sixteen of the 48 rows are theirs and 32 move.
-->

<script id=text_kerning_off>
{
  const wrong = [];
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-9999px;top:0;width:4000px';
  document.body.appendChild(host);

  const width = (family, decl, text) => {
    const span = document.createElement('span');
    span.style.cssText = 'font:16px ' + family + ';white-space:pre;' + decl;
    span.textContent = text;
    host.appendChild(span);
    const w = span.getBoundingClientRect().width;
    span.remove();
    return w;
  };

  // The two spellings of "kerning off", then the seven that must not move.
  const OFF = [
    ['font-kerning:none', 'font-kerning:none'],
    ['"kern" 0', 'font-feature-settings:"kern" 0'],
  ];
  const SAME = [
    ['font-kerning:normal', 'font-kerning:normal'],
    ['font-kerning:auto', 'font-kerning:auto'],
    ['"kern" 1', 'font-feature-settings:"kern" 1'],
    ['optimizeSpeed', 'text-rendering:optimizeSpeed'],
    ['optimizeLegibility', 'text-rendering:optimizeLegibility'],
    ['geometricPrecision', 'text-rendering:geometricPrecision'],
    ['ligatures:none', 'font-variant-ligatures:none'],
  ];

  // [family, pair, default width, kerning-off width]
  const CASES = [
    ["serif", "AV", 21.046875, 23.109375],
    ["serif", "AT", 19.5546875, 21.328125],
    ["serif", "To", 16.65625, 17.7734375],
    ["serif", "Tr", 14.546875, 15.1015625],
    ["serif", "Wo", 21.828125, 23.1015625],
    ["serif", "Ya", 17.0625, 18.65625],
    ["serif", "P,", 11.125, 12.8984375],
    ["serif", "v,", 10.9609375, 12],
    ["sans-serif", "AV", 20.1640625, 21.34375],
    ["sans-serif", "AT", 19.265625, 20.4453125],
    ["sans-serif", "To", 16.8984375, 18.671875],
    ["sans-serif", "Tr", 14.515625, 15.1015625],
    ["sans-serif", "Wo", 23.71875, 24],
    ["sans-serif", "Ya", 18.390625, 19.5703125],
    ["sans-serif", "P,", 13.0546875, 15.1171875],
    ["sans-serif", "v,", 11.265625, 12.4453125],
    ["Verdana", "AV", 21.40625, 21.875],
    ["Verdana", "AT", 19.859375, 20.796875],
    ["Verdana", "To", 17.8515625, 19.5703125],
    ["Verdana", "Tr", 15.125, 16.6875],
    ["Verdana", "Wo", 24.75, 25.53125],
    ["Verdana", "Ya", 18.359375, 19.453125],
    ["Verdana", "P,", 13.125, 15.46875],
    ["Verdana", "v,", 13.8828125, 15.2890625],
    ["Arial", "AV", 20.15625, 21.34375],
    ["Arial", "AT", 19.2578125, 20.4453125],
    ["Arial", "To", 16.8984375, 18.671875],
    ["Arial", "Tr", 14.5078125, 15.1015625],
    ["Arial", "Wo", 23.7109375, 24],
    ["Arial", "Ya", 18.3828125, 19.5703125],
    ["Arial", "P,", 13.0546875, 15.1171875],
    ["Arial", "v,", 11.2578125, 12.4453125],
    // monospace: one advance for every glyph, no pair to lose.
    ["monospace", "AV", 19.265625, 19.265625],
    ["monospace", "AT", 19.265625, 19.265625],
    ["monospace", "To", 19.265625, 19.265625],
    ["monospace", "Tr", 19.265625, 19.265625],
    ["monospace", "Wo", 19.265625, 19.265625],
    ["monospace", "Ya", 19.265625, 19.265625],
    ["monospace", "P,", 19.265625, 19.265625],
    ["monospace", "v,", 19.265625, 19.265625],
    // Georgia: proportional, and still carries none of these eight pairs.
    ["Georgia", "AV", 21.3984375, 21.3984375],
    ["Georgia", "AT", 20.6328125, 20.6328125],
    ["Georgia", "To", 18.5234375, 18.5234375],
    ["Georgia", "Tr", 16.453125, 16.453125],
    ["Georgia", "Wo", 24.234375, 24.234375],
    ["Georgia", "Ya", 17.90625, 17.90625],
    ["Georgia", "P,", 14.0703125, 14.0703125],
    ["Georgia", "v,", 12.2578125, 12.2578125],
  ];

  for (const [family, pair, base, off] of CASES) {
    const where = family + ' ' + JSON.stringify(pair) + ' ';
    const got = width(family, '', pair);
    if (got !== base) wrong.push(where + 'default: want ' + base + ', got ' + got);
    for (const [name, decl] of OFF) {
      const w = width(family, decl, pair);
      if (w !== off) wrong.push(where + name + ': want ' + off + ', got ' + w);
    }
    for (const [name, decl] of SAME) {
      const w = width(family, decl, pair);
      if (w !== base) wrong.push(where + name + ': want ' + base + ' (unchanged), got ' + w);
    }
  }

  // The LINE-BUILDING path, which is a different measurement from everything
  // above. Each span above is priced by the whole-text-node measurement, which
  // gets its pairs from the kernel. A <br>, a preserved newline, an inline
  // child and wrapping each reach the path that chops text at white space and
  // prices the space itself -- the one holding the space-pair table. The switch
  // has to reach BOTH, and 'AVATAR To Wo' says so twice over: 105.4140625
  // default, 115.5390625 off, and the 10.125 between them is 9.5625 of ordinary
  // pairs plus 0.5625 of SPACE pairs. Miss the space table and this row lands
  // on 114.9765625.
  //
  // Heights are asserted beside widths because the sibling plan's bug was
  // width-only-correct: an inline-block sized by one path and laid out by the
  // other wrapped onto a second line, 105.4140625 wide and 37 tall where Chrome
  // says 18.5. A width assertion alone called that a pass.
  //
  // 'ab <b>To</b> cd' is the row that says the switch is read per RUN. The
  // bold child shapes as its own run, so the pair either side of the space is
  // already suppressed by the font change; what the switch takes off is the
  // bold 'To' pair alone, 1.46875, and 55.40625 + 1.46875 = 56.875 is what
  // Chrome answers. 'ab <span>To</span> cd' is the same markup with the run
  // intact and loses 1.3984375: the regular 'To' pair, 1.1171875, plus the
  // ' T' space pair, 0.28125.
  //
  // 'AVATAR To Wo and more words here' in 60px is the line-breaking control:
  // the longest word is 66.6640625 even unkerned, so every line breaks the same
  // way either side of the switch and the box stays 60 by 92.5. A build that
  // priced the switch into breaking but not into measuring would move it.
  const BOXES = [
    // declaration, markup, default width/height, kerning-off width/height
    ["display:inline-block", "AVATAR To Wo", 105.4140625, 18.5, 115.5390625, 18.5],
    ["display:inline-block", "AVATAR To Wo<br>x", 105.4140625, 37, 115.5390625, 37],
    ["white-space:pre;display:inline-block", "AVATAR To Wo\nx", 105.4140625, 37, 115.5390625, 37],
    ["display:inline-block", "AVATAR   To   Wo", 105.4140625, 18.5, 115.5390625, 18.5],
    ["width:60px", "AVATAR To Wo and more words here", 60, 92.5, 60, 92.5],
    ["display:inline-block", "ab <span>To</span> cd", 54.578125, 18.5, 55.9765625, 18.5],
    ["display:inline-block", "ab <b>To</b> cd", 55.40625, 18.5, 56.875, 18.5],
    // no pair in 'monotone', so nothing to switch off
    ["display:inline-block", "monotone<br>x", 63.9921875, 37, 63.9921875, 37],
  ];

  const box = (decl, kern, html) => {
    const el = document.createElement('div');
    el.style.cssText = 'font:16px serif;' + decl + ';' + kern;
    el.innerHTML = html;
    host.appendChild(el);
    const r = el.getBoundingClientRect();
    el.remove();
    return [r.width, r.height];
  };

  for (const [decl, html, baseW, baseH, offW, offH] of BOXES) {
    const where = '{' + decl + '} ' + JSON.stringify(html) + ' ';
    const [bw, bh] = box(decl, '', html);
    if (bw !== baseW) wrong.push(where + 'default width: want ' + baseW + ', got ' + bw);
    if (bh !== baseH) wrong.push(where + 'default height: want ' + baseH + ', got ' + bh);
    for (const [name, kern] of OFF) {
      const [w, h] = box(decl, kern, html);
      if (w !== offW) wrong.push(where + name + ' width: want ' + offW + ', got ' + w);
      if (h !== offH) wrong.push(where + name + ' height: want ' + offH + ', got ' + h);
    }
    for (const [name, kern] of SAME) {
      const [w, h] = box(decl, kern, html);
      if (w !== baseW) wrong.push(where + name + ' width: want ' + baseW + ' (unchanged), got ' + w);
      if (h !== baseH) wrong.push(where + name + ' height: want ' + baseH + ' (unchanged), got ' + h);
    }
  }

  // All three declarations inherit, so the switch cannot be read off the
  // element that carries the text. Declared on a wrapper, read on a child that
  // declares nothing -- and then overridden back on the child, which is the
  // half a naive "does any ancestor say none" walk gets wrong.
  const inherited = (wrapperDecl, childDecl) => {
    const outer = document.createElement('div');
    outer.style.cssText = 'font:16px serif;white-space:pre;' + wrapperDecl;
    const inner = document.createElement('span');
    inner.style.cssText = childDecl;
    inner.textContent = 'AVATAR To Wo';
    outer.appendChild(inner);
    host.appendChild(outer);
    const w = inner.getBoundingClientRect().width;
    outer.remove();
    return w;
  };
  const INHERIT = [
    ['nothing on the wrapper', '', '', 105.4140625],
    ['font-kerning:none inherits', 'font-kerning:none', '', 115.5390625],
    ['"kern" 0 inherits', 'font-feature-settings:"kern" 0', '', 115.5390625],
    ['optimizeSpeed inherits nothing', 'text-rendering:optimizeSpeed', '', 105.4140625],
    ['child overrides back', 'font-kerning:none', 'font-kerning:normal', 105.4140625],
  ];
  for (const [name, outerDecl, innerDecl, want] of INHERIT) {
    const got = inherited(outerDecl, innerDecl);
    if (got !== want) wrong.push('inherit ' + name + ': want ' + want + ', got ' + got);
  }

  // The STYLESHEET path, which none of the above reaches: a rule goes through
  // the document's declared-name set and the enum-keyed cascade cache, where an
  // inline declaration goes through the declaration's own property list. The
  // two can also disagree, and the ordering when they do is the one thing only
  // this block asserts: an `!important` rule beats inline, and inline beats a
  // normal rule.
  //
  // The wrapper's font is written as LONGHANDS on purpose. `font` is a
  // shorthand over `font-kerning` -- it resets it to `auto` -- and an inline
  // declaration beats a normal rule, so `wrap.style.font = '16px serif'` would
  // silently defeat every rule here. The first version of the probe behind these
  // numbers did exactly that and read `auto` everywhere, which looks identical
  // to the rule not matching at all. The last row keeps that trap as a reading
  // rather than a footnote: the rule says `none`, the inline `font` shorthand
  // resets it to `auto`, and 105.4140625 -- the kerned width -- is Chrome's
  // answer.
  const sheetCase = (css, wrapAttr, wrapStyle, spanId, spanStyle) => {
    const sheet = document.createElement('style');
    sheet.textContent = css;
    document.head.appendChild(sheet);

    const wrap = document.createElement('div');
    if (wrapAttr) wrap.setAttribute(wrapAttr[0], wrapAttr[1]);
    wrap.style.cssText = wrapStyle;
    const span = document.createElement('span');
    if (spanId) span.id = spanId;
    span.style.cssText = spanStyle;
    span.textContent = 'AVATAR To Wo';
    wrap.appendChild(span);
    host.appendChild(wrap);
    const w = span.getBoundingClientRect().width;
    wrap.remove();
    sheet.remove();
    return w;
  };
  // Longhands, so the rule under test is not overridden by a `font` shorthand.
  const LONGHAND_FONT = 'font-size:16px;font-family:serif;white-space:pre';
  const SHEET = [
    // name, css, wrapper attribute, wrapper style, span id, span style, width
    ['rule by id on the wrapper', '#kwrap{font-kerning:none}', ['id', 'kwrap'], LONGHAND_FONT, '', '', 115.5390625],
    ['rule by class on the wrapper', '.kwrapc{font-kerning:none}', ['class', 'kwrapc'], LONGHAND_FONT, '', '', 115.5390625],
    ['rule by id on the span', '#kspan{font-kerning:none}', null, LONGHAND_FONT, 'kspan', '', 115.5390625],
    ['rule "kern" 0 on the span', '#kspan{font-feature-settings:"kern" 0}', null, LONGHAND_FONT, 'kspan', '', 115.5390625],
    ['inline normal beats the rule', '#kspan{font-kerning:none}', null, LONGHAND_FONT, 'kspan', 'font-kerning:normal', 105.4140625],
    ['important rule beats inline', '#kspan{font-kerning:none!important}', null, LONGHAND_FONT, 'kspan', 'font-kerning:normal', 115.5390625],
    ['inline none beats the rule', '#kspan{font-kerning:normal}', null, LONGHAND_FONT, 'kspan', 'font-kerning:none', 115.5390625],
    ['a rule about something else', '#kspan{color:red}', null, LONGHAND_FONT, 'kspan', '', 105.4140625],
    // The `font` shorthand resets `font-kerning` to `auto`, and it is inline, so
    // it wins: 105.4140625 and not 115.5390625.
    ['inline font shorthand resets it', '#kwrap{font-kerning:none}', ['id', 'kwrap'], 'font:16px serif;white-space:pre', '', '', 105.4140625],
    // ...and the same shorthand written in a RULE, which is a different path in
    // this engine: the raw-sheet parser keeps the fixed font properties in a
    // struct of their own, so `font`'s reset has to be carried into it or an
    // inherited `none` survives a rule Chrome says clears it. The last two rows
    // are the declaration order inside one rule, which decides the answer.
    ['sheet font shorthand on the span resets it', '#kwrap{font-kerning:none}#kspan{font:16px serif}', ['id', 'kwrap'], LONGHAND_FONT, 'kspan', '', 105.4140625],
    ['sheet font shorthand after the longhand', '#kwrap{font-kerning:none;font:16px serif}', ['id', 'kwrap'], LONGHAND_FONT, 'kspan', '', 105.4140625],
    ['sheet font shorthand before the longhand', '#kwrap{font:16px serif;font-kerning:none}', ['id', 'kwrap'], LONGHAND_FONT, 'kspan', '', 115.5390625],
    // `font` resets the other spelling too, to `normal`.
    ['sheet "kern" 0 by rule', '#kwrap{font-feature-settings:"kern" 0}', ['id', 'kwrap'], LONGHAND_FONT, 'kspan', '', 115.5390625],
    ['sheet font shorthand resets "kern" 0', '#kwrap{font-feature-settings:"kern" 0}#kspan{font:16px serif}', ['id', 'kwrap'], LONGHAND_FONT, 'kspan', '', 105.4140625],
  ];
  for (const [name, css, wrapAttr, wrapStyle, spanId, spanStyle, want] of SHEET) {
    const got = sheetCase(css, wrapAttr, wrapStyle, spanId, spanStyle);
    if (got !== want) wrong.push('sheet ' + name + ': want ' + want + ', got ' + got);
  }

  // The canvas has its own switch, `ctx.fontKerning`, and it reads back already
  // -- it is the measurement it does not reach. 'bogus' is the CSS-attribute
  // rule the 2D context uses throughout: an unrecognised value is ignored and
  // the previous one stays, which is why each row sets 'auto' first.
  //
  // 'AVATAR To Wo' is 105.9765625 here and 105.4140625 in layout, because the
  // canvas does not kern a space against a capital. With kerning off the two
  // surfaces agree at 115.5390625: there is no pair left for them to disagree
  // about, which is a cross-check on both halves at once.
  const ctx = document.createElement('canvas').getContext('2d');
  const CANVAS = [
    // value, readback, 'AV', 'AVATAR To Wo'
    ['auto', 'auto', 21.046875, 105.9765625],
    ['normal', 'normal', 21.046875, 105.9765625],
    ['none', 'none', 23.109375, 115.5390625],
    ['bogus', 'auto', 21.046875, 105.9765625],
  ];
  for (const [value, readback, wantPair, wantLong] of CANVAS) {
    ctx.font = '16px serif';
    ctx.fontKerning = 'auto';
    ctx.fontKerning = value;
    if (ctx.fontKerning !== readback) {
      wrong.push('canvas ' + value + ' readback: want ' + readback + ', got ' + ctx.fontKerning);
    }
    const pair = ctx.measureText('AV').width;
    if (pair !== wantPair) wrong.push('canvas ' + value + ' AV: want ' + wantPair + ', got ' + pair);
    const long = ctx.measureText('AVATAR To Wo').width;
    if (long !== wantLong) wrong.push('canvas ' + value + ' long: want ' + wantLong + ', got ' + long);
  }

  host.remove();
  testing.expectEqual('', wrong.join('\n  | '));
}
</script>
