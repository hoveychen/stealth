<!DOCTYPE html>
<script src="../testing.js"></script>

<body>
<div id="probe">text</div>

<script id=element_prototype_no_html_members>
  {
    // These belong to HTMLElement, not Element: an SVG or MathML element has no
    // style, no dataset, no offsetTop and cannot be focused. Measured on a
    // headed Chrome 150, Element.prototype owns none of them.
    const own = Object.getOwnPropertyNames(Element.prototype);
    const htmlOnly = ['style', 'dataset', 'dir', 'innerText', 'offsetTop', 'offsetLeft',
                      'offsetWidth', 'offsetHeight', 'offsetParent', 'focus', 'blur'];
    testing.expectEqual([], htmlOnly.filter((name) => own.includes(name)));

    // ...and HTMLElement.prototype owns every one of them.
    const htmlOwn = Object.getOwnPropertyNames(HTMLElement.prototype);
    testing.expectEqual([], htmlOnly.filter((name) => !htmlOwn.includes(name)));
  }
</script>

<script id=element_prototype_fullscreen_handlers>
  {
    // The other way round: fullscreen events fire at any element, so Chrome
    // declares these on Element and not on HTMLElement.
    const own = Object.getOwnPropertyNames(Element.prototype);
    const htmlOwn = Object.getOwnPropertyNames(HTMLElement.prototype);
    for (const name of ['onfullscreenchange', 'onfullscreenerror']) {
      testing.expectEqual(true, own.includes(name), { desc: 'Element owns ' + name });
      testing.expectEqual(false, htmlOwn.includes(name), { desc: 'HTMLElement does not own ' + name });
    }
  }
</script>

<script id=element_prototype_no_surplus>
  {
    // Names we exposed that Chrome has on neither interface. accessKeyLabel is
    // Gecko-only; ondragexit was dropped from the spec and never shipped in
    // Blink; the touch handlers are gated on a touch-capable device and Chrome
    // at navigator.maxTouchPoints === 0 has none of them.
    const both = Object.getOwnPropertyNames(Element.prototype)
      .concat(Object.getOwnPropertyNames(HTMLElement.prototype));
    testing.expectEqual(0, navigator.maxTouchPoints);
    for (const name of ['accessKeyLabel', 'ondragexit', 'ontouchstart', 'ontouchend',
                        'ontouchmove', 'ontouchcancel']) {
      testing.expectEqual(false, both.includes(name), { desc: 'no ' + name });
      testing.expectEqual(false, name in document.getElementById('probe'), { desc: 'not on an element: ' + name });
    }
  }
</script>

      'title', 'lang', 'translate', 'dir', 'hidden', 'inert', 'accessKey', 'draggable',
      'spellcheck', 'autocapitalize', 'editContext', 'contentEditable', 'enterKeyHint',
      'isContentEditable', 'inputMode', 'virtualKeyboardPolicy', 'offsetParent', 'offsetTop',
      'offsetLeft', 'offsetWidth', 'offsetHeight', 'popover', 'innerText', 'outerText',
      'writingSuggestions', 'onabort', 'onbeforeinput', 'onbeforematch', 'onbeforetoggle',
      'onblur', 'oncancel', 'oncanplay', 'oncanplaythrough', 'onchange', 'onclick', 'onclose',
      'oncommand', 'oncontentvisibilityautostatechange', 'oncontextlost', 'oncontextmenu',
      'oncontextrestored', 'oncuechange', 'ondblclick', 'ondrag', 'ondragend', 'ondragenter',
      'ondragleave', 'ondragover', 'ondragstart', 'ondrop', 'ondurationchange', 'onemptied',
      'onended', 'onerror', 'onfocus', 'onformdata', 'oninput', 'oninvalid', 'onkeydown',
      'onkeypress', 'onkeyup', 'onload', 'onloadeddata', 'onloadedmetadata', 'onloadstart',
      'onmousedown', 'onmouseenter', 'onmouseleave', 'onmousemove', 'onmouseout',
      'onmouseover', 'onmouseup', 'onmousewheel', 'onpause', 'onplay', 'onplaying',
      'onprogress', 'onratechange', 'onreset', 'onresize', 'onscroll', 'onscrollend',
      'onsecuritypolicyviolation', 'onseeked', 'onseeking', 'onselect', 'onslotchange',
      'onstalled', 'onsubmit', 'onsuspend', 'ontimeupdate', 'ontoggle', 'onvolumechange',
      'onwaiting', 'onwebkitanimationend', 'onwebkitanimationiteration',
      'onwebkitanimationstart', 'onwebkittransitionend', 'onwheel', 'onauxclick',
      'ongotpointercapture', 'onlostpointercapture', 'onpointerdown', 'onpointermove',
      'onpointerup', 'onpointercancel', 'onpointerover', 'onpointerout', 'onpointerenter',
      'onpointerleave', 'onselectstart', 'onselectionchange', 'onanimationcancel',
      'onanimationend', 'onanimationiteration', 'onanimationstart', 'ontransitionrun',
      'ontransitionstart', 'ontransitionend', 'ontransitioncancel', 'onbeforexrselect',
      'oncopy', 'oncut', 'onpaste', 'dataset', 'nonce', 'autofocus', 'tabIndex', 'style',
      'attributeStyleMap', 'attachInternals', 'blur', 'click', 'focus', 'hidePopover',
      'showPopover', 'togglePopover', 'onscrollsnapchange', 'onscrollsnapchanging',

      // boundary between the template's members and the ones Blink installs

    testing.expectEqual(expected, Object.getOwnPropertyNames(HTMLElement.prototype));

</script>

<script id=element_prototype_insert_adjacent_html_only_on_element>
  {
    // insertAdjacentHTML is declared once, on Element. Measured on a headed
    // Chrome 150: HTMLElement.prototype does not own it, and on Element it sits
    // between insertAdjacentElement and insertAdjacentText.
    const own = Object.getOwnPropertyNames(Element.prototype);
    testing.expectEqual(true, own.includes('insertAdjacentHTML'));
    testing.expectEqual(false,
      Object.getOwnPropertyNames(HTMLElement.prototype).includes('insertAdjacentHTML'));

    // Removing the duplicate must not change what an HTML element can do.
    const div = document.createElement('div');
    div.insertAdjacentHTML('beforeend', '<b>x</b>');
    testing.expectEqual('<b>x</b>', div.innerHTML);
  }
</script>

<script id=element_prototype_moved_members_still_work>
  {
    // Moving a declaration must not change what it does.
    const div = document.getElementById('probe');
    testing.expectEqual('CSSStyleDeclaration', div.style.constructor.name);
    testing.expectEqual('object', typeof div.dataset);
    testing.expectEqual('', div.dir);
    div.dir = 'rtl';
    testing.expectEqual('rtl', div.getAttribute('dir'));
    testing.expectEqual('text', div.innerText);
    testing.expectEqual('number', typeof div.offsetTop);
    testing.expectEqual('number', typeof div.offsetWidth);
    testing.expectEqual(undefined, div.focus());
    testing.expectEqual(undefined, div.blur());

    // An element outside the HTML namespace reaches the layout half of them --
    // that is the point of the move -- but not the HTMLOrSVGElement half, which
    // Chrome declares separately on SVGElement and MathMLElement (measured:
    // both prototypes own dataset, style, tabIndex, blur and focus; neither
    // owns offsetTop, innerText or dir).
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const math = document.createElementNS('http://www.w3.org/1998/Math/MathML', 'mi');
    for (const el of [svg, math]) {
      testing.expectEqual('object', typeof el.dataset);
      testing.expectEqual('function', typeof el.focus);
      testing.expectEqual('CSSStyleDeclaration', el.style.constructor.name);
      testing.expectEqual(undefined, el.offsetTop);
      testing.expectEqual(undefined, el.innerText);
      testing.expectEqual(undefined, el.dir);
    }
  }
</script>

<script id=element_prototype_aria_reflection>
  {
    // ARIAMixin. Every one of these reflects a lowercase attribute of the same
    // name with the aria camel case flattened: ariaBrailleRoleDescription is
    // aria-brailleroledescription, ariaPosInSet is aria-posinset. Measured
    // uniformly across the family: null when the attribute is absent, the raw
    // string otherwise, and assigning null removes the attribute. No value
    // parsing at all — ariaValueMax holds whatever string you give it.
    const aria = [
      'ariaAtomic', 'ariaAutoComplete', 'ariaBusy', 'ariaBrailleLabel',
      'ariaBrailleRoleDescription', 'ariaChecked', 'ariaColCount', 'ariaColIndex',
      'ariaColSpan', 'ariaCurrent', 'ariaDescription', 'ariaDisabled', 'ariaExpanded',
      'ariaHasPopup', 'ariaHidden', 'ariaInvalid', 'ariaKeyShortcuts', 'ariaLabel',
      'ariaLevel', 'ariaLive', 'ariaModal', 'ariaMultiLine', 'ariaMultiSelectable',
      'ariaOrientation', 'ariaPlaceholder', 'ariaPosInSet', 'ariaPressed', 'ariaReadOnly',
      'ariaRelevant', 'ariaRequired', 'ariaRoleDescription', 'ariaRowCount', 'ariaRowIndex',
      'ariaRowSpan', 'ariaSelected', 'ariaSetSize', 'ariaSort', 'ariaValueMax', 'ariaValueMin',
      'ariaValueNow', 'ariaValueText', 'ariaColIndexText', 'ariaRowIndexText'
    ];
    const own = Object.getOwnPropertyNames(Element.prototype);
    testing.expectEqual([], aria.filter((name) => !own.includes(name)));
    testing.expectEqual(43, aria.length);

    const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    for (const prop of aria.concat(['role'])) {
      const attr = prop === 'role' ? 'role' : 'aria-' + prop.slice(4).toLowerCase();
      testing.expectEqual(null, el[prop], { desc: prop + ' unset' });
      el[prop] = 'zz';
      testing.expectEqual('zz', el.getAttribute(attr), { desc: prop + ' -> ' + attr });
      el.setAttribute(attr, 'qq');
      testing.expectEqual('qq', el[prop], { desc: prop + ' reads ' + attr });
      el[prop] = null;
      testing.expectEqual(false, el.hasAttribute(attr), { desc: prop + ' = null removes ' + attr });
    }
  }
</script>

<script id=element_prototype_aria_element_references>
  {
    // The IDREF-list reflections resolve to elements, so they answer null while
    // the attribute is absent and an array once it is set.
    const refs = [
      'ariaActionsElements', 'ariaActiveDescendantElement', 'ariaControlsElements', 'ariaDescribedByElements',
      'ariaDetailsElements', 'ariaErrorMessageElements', 'ariaFlowToElements',
      'ariaLabelledByElements'
    ];
    const own = Object.getOwnPropertyNames(Element.prototype);
    testing.expectEqual([], refs.filter((name) => !own.includes(name)));
    const el = document.getElementById('probe');
    for (const prop of refs) {
      testing.expectEqual(null, el[prop], { desc: prop + ' unset' });
    }
    el.setAttribute('aria-controls', 'probe');
    testing.expectEqual(true, Array.isArray(el.ariaControlsElements));
    testing.expectEqual(1, el.ariaControlsElements.length);
    testing.expectEqual(el, el.ariaControlsElements[0]);
    el.removeAttribute('aria-controls');
    testing.expectEqual(null, el.ariaControlsElements);

    // aria-actions is the newest of the seven and the one this engine was
    // missing. Measured on Chrome 151: assigning an array writes the content
    // attribute as the empty string and the getter still answers the element,
    // setting the attribute by hand resolves the IDREF, and null clears both.
    el.ariaActionsElements = [el];
    testing.expectEqual(1, el.ariaActionsElements.length);
    testing.expectEqual(el, el.ariaActionsElements[0]);
    el.ariaActionsElements = null;
    testing.expectEqual(null, el.ariaActionsElements);
    el.setAttribute('aria-actions', 'probe');
    testing.expectEqual(el, el.ariaActionsElements[0]);
    el.removeAttribute('aria-actions');
    testing.expectEqual(null, el.ariaActionsElements);
    // ElementInternals declares the same seven, in the same order.
    const ei = Object.getOwnPropertyNames(ElementInternals.prototype);
    testing.expectEqual('ariaRowIndexText,ariaActionsElements,ariaActiveDescendantElement',
      ei.slice(ei.indexOf('ariaRowIndexText'), ei.indexOf('ariaRowIndexText') + 3).join(','));
  }
</script>

<script id=element_prototype_part_and_element_timing>
  {
    testing.expectEqual('object', typeof document.getElementById('probe').part);
    testing.expectEqual('string', typeof document.getElementById('probe').elementTiming);
    const el = document.getElementById('probe');
    // part is a DOMTokenList over the `part` attribute, like classList.
    testing.expectEqual('DOMTokenList', el.part.constructor.name);
    testing.expectEqual(0, el.part.length);
    testing.expectEqual('', el.part.value);
    el.setAttribute('part', 'a b');
    testing.expectEqual(2, el.part.length);
    testing.expectEqual(true, el.part.contains('a'));
    el.part.add('c');
    testing.expectEqual('a b c', el.getAttribute('part'));
    el.removeAttribute('part');

    // elementTiming is a plain DOMString reflection, not a nullable one: it
    // reads "" when unset, and assigning null writes the string "null" rather
    // than removing the attribute.
    testing.expectEqual('', el.elementTiming);
    el.elementTiming = 'hero';
    testing.expectEqual('hero', el.getAttribute('elementtiming'));
    el.elementTiming = null;
    testing.expectEqual(true, el.hasAttribute('elementtiming'));
    el.removeAttribute('elementtiming');
  }
</script>

<script id=element_prototype_event_handlers>
  {
    // The eight handlers Chrome declares on Element rather than HTMLElement.
    const own = Object.getOwnPropertyNames(Element.prototype);
    const handlers = ['onbeforecopy', 'onbeforecut', 'onbeforepaste', 'onsearch',
                      'onfullscreenchange', 'onfullscreenerror',
                      'onwebkitfullscreenchange', 'onwebkitfullscreenerror'];
    testing.expectEqual([], handlers.filter((name) => !own.includes(name)));
    // They work on a non-HTML element, which is the reason they live here.
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    testing.expectEqual(null, svg.onfullscreenchange);
    let seen = 0;
    const fn = () => { seen++; };
    svg.onfullscreenchange = fn;
    testing.expectEqual(fn, svg.onfullscreenchange);
    svg.dispatchEvent(new Event('fullscreenchange'));
    testing.expectEqual(1, seen);
    svg.onfullscreenchange = null;
    testing.expectEqual(null, svg.onfullscreenchange);
  }
</script>

<script id=element_prototype_pointer_and_fullscreen>
  {
    for (const n of ['hasPointerCapture','setPointerCapture','releasePointerCapture',
                     'webkitRequestFullscreen','webkitRequestFullScreen','ariaNotify',
                     'webkitMatchesSelector']) {
      testing.expectEqual('function', typeof document.getElementById('probe')[n], { desc: n });
    }
    testing.expectEqual('number', typeof document.getElementById('probe').currentCSSZoom);
    const el = document.getElementById('probe');
    // Nothing can capture a pointer or go fullscreen here, and Chrome's answers
    // on a page that has not been interacted with are the same shapes.
    testing.expectEqual(false, el.hasPointerCapture(1));
    testing.expectEqual(undefined, el.setPointerCapture(1));
    testing.expectEqual(undefined, el.releasePointerCapture(1));
    // The webkit spellings are synchronous and return undefined; only the
    // unprefixed requestFullscreen is a promise.
    testing.expectEqual(undefined, el.webkitRequestFullscreen());
    testing.expectEqual(undefined, el.webkitRequestFullScreen());
    testing.expectEqual(1, el.currentCSSZoom);
    testing.expectEqual(null, el.activeViewTransition);
    testing.expectEqual(window.customElements, el.customElementRegistry);
    testing.expectEqual(undefined, el.ariaNotify('hi'));
    testing.expectEqual(true, el.webkitMatchesSelector('div'));
    testing.expectEqual(false, el.webkitMatchesSelector('span'));
  }
</script>

<script id=element_prototype_promises>
  testing.onload(async () => {
    testing.expectEqual('function', typeof Element.prototype.requestFullscreen);
    testing.expectEqual('function', typeof Element.prototype.requestPointerLock);
    const el = document.getElementById('probe');
    const settle = async (p) => {
      try { await p; return 'resolved'; } catch (e) { return 'rejected:' + e.name; }
    };
    // Measured: a fullscreen request without a user gesture is a bare
    // TypeError, and pointer lock on a document that cannot host it is a
    // WrongDocumentError.
    testing.expectEqual('rejected:TypeError', await settle(el.requestFullscreen()));
    testing.expectEqual('rejected:WrongDocumentError', await settle(el.requestPointerLock()));
  });
</script>

<script id=element_prototype_ns_attributes>
  {
    for (const n of ['getAttributeNodeNS','setAttributeNodeNS','removeAttributeNS']) {
      testing.expectEqual('function', typeof document.getElementById('probe')[n], { desc: n });
    }
    const el = document.getElementById('probe');
    // These three inherit the namespace handling their non-NS siblings already
    // have: the engine stores attributes by local name only and ignores the
    // namespace argument, so getAttributeNodeNS matches on the local name.
    // Chrome would answer null for an `id` looked up in the XHTML namespace,
    // and closing that gap belongs with getAttributeNS / hasAttributeNS /
    // setAttributeNS rather than here.
    testing.expectEqual('Attr', el.getAttributeNodeNS(null, 'id').constructor.name);
    testing.expectEqual('probe', el.getAttributeNodeNS(null, 'id').value);
    testing.expectEqual(null, el.getAttributeNodeNS(null, 'nosuchattribute'));

    el.setAttributeNS('http://www.example.com/ns', 'ex:thing', 'v');
    testing.expectEqual('v', el.getAttributeNodeNS('http://www.example.com/ns', 'thing').value);
    testing.expectEqual(undefined, el.removeAttributeNS('http://www.example.com/ns', 'thing'));
    testing.expectEqual(null, el.getAttributeNodeNS('http://www.example.com/ns', 'thing'));
    // Removing something that was never there is not an error.
    testing.expectEqual(undefined, el.removeAttributeNS(null, 'nope'));

    const attr = document.createAttributeNS('http://www.w3.org/1999/xhtml', 'other');
    attr.value = 'w';
    testing.expectEqual(null, el.setAttributeNodeNS(attr));
    testing.expectEqual('w', el.getAttribute('other'));
    el.removeAttributeNS(null, 'other');
    testing.expectEqual(false, el.hasAttribute('other'));
  }
</script>

<script id=element_prototype_get_set_html>
  {
    testing.expectEqual('function', typeof Element.prototype.getHTML);
    testing.expectEqual('function', typeof Element.prototype.setHTML);
    const el = document.createElement('div');
    el.innerHTML = '<b>hi</b>';
    // getHTML is the modern name for what getInnerHTML used to do.
    testing.expectEqual(0, el.getHTML.length);
    testing.expectEqual('<b>hi</b>', el.getHTML());
    // setHTML sanitises: event-handler attributes and script elements are
    // dropped. Measured in Chrome: '<b onclick="x()">hi</b><script>bad()<\/script>'
    // becomes '<b>hi</b>'.
    testing.expectEqual(1, el.setHTML.length);
    el.setHTML('<b onclick="x()">hi</b><script>bad()<\/script>');
    testing.expectEqual('<b>hi</b>', el.innerHTML);
  }
</script>

<script id=element_prototype_pseudo>
  {
    testing.expectEqual('function', typeof Element.prototype.pseudo);
    testing.expectEqual('function', typeof window.CSSPseudoElement);
    const el = document.getElementById('probe');
    testing.expectEqual(1, el.pseudo.length);
    const before = el.pseudo('::before');
    testing.expectEqual('CSSPseudoElement', before.constructor.name);
    testing.expectEqual(['type', 'element', 'parent', 'pseudo', 'constructor'],
                        Object.getOwnPropertyNames(CSSPseudoElement.prototype));
    testing.expectEqual('::before', before.type);
    testing.expectEqual(el, before.element);
    testing.expectEqual('CSSPseudoElement', el.pseudo('::marker').constructor.name);
    // A selector that is not a pseudo-element is null, not an error.
    testing.expectEqual(null, el.pseudo('nonsense'));
  }
</script>

<script id=element_prototype_view_transition>
  {
    testing.expectEqual('function', typeof Element.prototype.startViewTransition);
    const el = document.getElementById('probe');
    testing.expectEqual(0, el.startViewTransition.length);
    const vt = el.startViewTransition();
    testing.expectEqual('ViewTransition', vt.constructor.name);
    // Scoped to the element it was started on, unlike the document-wide one.
    testing.expectEqual(el, vt.transitionRoot);
    vt.skipTransition();
  }
</script>

<script id=element_prototype_computed_style_map>
  {
    testing.expectEqual('function', typeof Element.prototype.computedStyleMap);
    testing.expectEqual('function', typeof window.StylePropertyMapReadOnly);
    const el = document.getElementById('probe');
    testing.expectEqual(0, el.computedStyleMap.length);
    const map = el.computedStyleMap();
    testing.expectEqual('StylePropertyMapReadOnly', map.constructor.name);
    testing.expectEqual(['size', 'get', 'getAll', 'has', 'entries', 'forEach', 'keys', 'values', 'constructor'],
                        Object.getOwnPropertyNames(StylePropertyMapReadOnly.prototype));
    // The same 476 computed longhands getComputedStyle enumerates, in the same
    // order, since it is the same list.
    testing.expectEqual(476, map.size);
    testing.expectEqual('accent-color', [...map.keys()][0]);
    testing.expectEqual(476, [...map.keys()].length);
    testing.expectEqual(true, map.has('display'));
    testing.expectEqual(false, map.has('not-a-property'));
    testing.expectEqual('block', String(map.get('display')));
    testing.expectEqual(null, map.get('not-a-property'));
    // get returns one value; getAll returns a list, and entries/values yield
    // those lists rather than bare values.
    testing.expectEqual(1, map.getAll('display').length);
    testing.expectEqual(true, Array.isArray([...map.values()][0]));
    testing.expectEqual('accent-color', [...map.entries()][0][0]);
    testing.expectError('TypeError', () => new StylePropertyMapReadOnly());
  }
</script>

<script id=element_variadic_lengths>
  {
    // A variadic operation contributes nothing to WebIDL `length`: Chrome 151
    // reports 0 for all six, and accepts a call with no arguments at all. We
    // derived the length from the Zig signature, where the variadic and a
    // sequence parameter are the same slice, and reported 1 -- readable off
    // `Element.prototype.append.length` without calling anything.
    for (const name of ['append', 'prepend', 'replaceChildren', 'after', 'before', 'replaceWith']) {
      testing.expectEqual(0, Element.prototype[name].length, { desc: name + '.length' });
    }

    const el = document.createElement('div');
    let threw = false;
    try {
      el.append();
      el.prepend();
      el.replaceChildren();
      el.after();
      el.before();
      el.replaceWith();
    } catch (e) {
      threw = true;
    }
    testing.expectEqual(false, threw);
  }
</script>

<script id=element_missing_argument>
  {
    // Ten of Element's operations under-report `length`, and every one of them
    // is a required argument this engine wrote as optional. The two families
    // read differently from the outside: the NS pair already threw, but with
    // the generic "invalid argument" nothing says, while the pointer-capture
    // three returned quietly -- `div.setPointerCapture()` did nothing and
    // `div.animate()` handed back an Animation. Chrome 151 counts before it
    // converts, so all ten refuse with the same sentence.
    const cases = [
      ['animate', 1],
      ['getAttributeNS', 2],
      ['getAttributeNodeNS', 2],
      ['getElementsByTagNameNS', 2],
      ['hasAttributeNS', 2],
      ['hasPointerCapture', 1],
      ['releasePointerCapture', 1],
      ['removeAttributeNS', 2],
      ['setAttributeNS', 3],
      ['setPointerCapture', 1],
    ];

    const el = document.createElement('div');
    for (const [name, n] of cases) {
      testing.expectEqual(n, Element.prototype[name].length, { desc: name + '.length' });
      testing.expectError(
        `TypeError: Failed to execute '${name}' on 'Element': ${n} argument${n === 1 ? '' : 's'} required, but only 0 present.`,
        () => el[name]());
    }
  }
</script>

<script id=element_missing_argument_short_by_one>
  {
    // Short by one rather than empty: the count Chrome reports is the count it
    // received, so "but only 1 present." is a separate sentence from "only 0",
    // and setAttributeNS wants three, which makes "only 2" reachable too. The
    // two-argument call is the one this engine let through entirely --
    // `el.setAttributeNS('x', 'y')` set an attribute.
    const el = document.createElement('div');
    const cases = [
      ['getAttributeNS', 2, ['x']],
      ['getAttributeNodeNS', 2, ['x']],
      ['getElementsByTagNameNS', 2, ['x']],
      ['hasAttributeNS', 2, ['x']],
      ['removeAttributeNS', 2, ['x']],
      ['setAttributeNS', 3, ['x']],
      ['setAttributeNS', 3, ['x', 'y']],
    ];
    for (const [name, n, args] of cases) {
      testing.expectError(
        `TypeError: Failed to execute '${name}' on 'Element': ${n} arguments required, but only ${args.length} present.`,
        () => el[name](...args));
    }
  }
</script>
