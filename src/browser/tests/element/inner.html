<!DOCTYPE html>
<script src="../testing.js"></script>
<div id=d1>hello <em>world</em></div>
<div id=d2>
  <style>h1 { font-size: 1em; }</style>
  <!-- this is a comment -->
  This is a <br>
  text
</div>
<p id=d3><span>Hello</span> <span>World</span></p>
<p id=d4><span>Hello</span>
  <span>World</span></p>

<style>.ihide { display: none }</style>
<div id=d5>a<span class=ihide>X</span>b<span style="display:none">Y</span>c</div>
<div id=d6>before<div class=ihide>deep <span>nested</span></div>after</div>

<script id=innerHTML>
  const d1 = $('#d1');
  testing.expectEqual('hello <em>world</em>', d1.innerHTML);

  d1.innerHTML = 'only text';
  testing.expectEqual('only text', d1.innerHTML);

  d1.innerHTML = 'hello <div>world</div><b>!!</b>';
  testing.expectEqual('hello <div>world</div><b>!!</b>', d1.innerHTML);
  for (let child of d1.childNodes) {
    testing.expectEqual(d1, child.parentNode);
  }

  // doesn't run JavaScript, important!
  let inner_loaded = false;
  d1.innerHTML = '<script src=inner.js>';
  testing.expectEqual('<script src="inner.js"><\/script>', d1.innerHTML);
  testing.expectEqual(false, inner_loaded);

  const d2 = $('#d2');
  testing.expectEqual("\n  <style>h1 { font-size: 1em; }</style>\n  <!-- this is a comment -->\n  This is a <br>\n  text\n", d2.innerHTML);
</script>

<script id=ids>
  d1.innerHTML = '<a id=link>home</a>';
  testing.expectEqual('home', $('#link').innerText);

  d1.innerHTML = '';
  testing.expectEqual(null, $('#link'));

  d1.innerHTML = '<div><p><a id=link>hi</a></p></div>';
  testing.expectEqual('hi', $('#link').innerText);

  d1.innerHTML = '';
</script>

<script id=attributeSerialization>
  d1.innerHTML = '<div class="test">text</div>';
  testing.expectEqual('<div class="test">text</div>', d1.innerHTML);

  d1.innerHTML = '<div id=simple>text</div>';
  testing.expectEqual('<div id="simple">text</div>', d1.innerHTML);

  d1.innerHTML = '<a href="/?foo=1&bar=2">link</a>';
  testing.expectEqual('<a href="/?foo=1&amp;bar=2">link</a>', d1.innerHTML);

  d1.innerHTML = '<div title="She said &quot;hello&quot;">text</div>';
  testing.expectEqual('<div title="She said &quot;hello&quot;">text</div>', d1.innerHTML);

  d1.innerHTML = '<div data-value="<tag>">text</div>';
  testing.expectEqual('<div data-value="&lt;tag&gt;">text</div>', d1.innerHTML);

  const div1 = document.createElement('div');
  div1.setAttribute('title', 'line1\nline2');
  d1.innerHTML = '';
  d1.appendChild(div1);
  testing.expectEqual('<div title="line1\nline2"></div>', d1.innerHTML);

  const div2 = document.createElement('div');
  div2.setAttribute('title', 'line1\rline2');
  d1.innerHTML = '';
  d1.appendChild(div2);
  testing.expectEqual('<div title="line1\rline2"></div>', d1.innerHTML);

  const div3 = document.createElement('div');
  div3.setAttribute('title', 'col1\tcol2');
  d1.innerHTML = '';
  d1.appendChild(div3);
  testing.expectEqual('<div title="col1\tcol2"></div>', d1.innerHTML);

  d1.innerHTML = '<div data-test="&quot;&amp;&lt;&gt;">text</div>';
  testing.expectEqual('<div data-test="&quot;&amp;&lt;&gt;">text</div>', d1.innerHTML);

  d1.innerHTML = '<input type="text" value="">';
  testing.expectEqual('<input type="text" value="">', d1.innerHTML);

  d1.innerHTML = '<div class="foo bar">text</div>';
  testing.expectEqual('<div class="foo bar">text</div>', d1.innerHTML);

  d1.innerHTML = '<div data-expr="x=5">text</div>';
  testing.expectEqual('<div data-expr="x=5">text</div>', d1.innerHTML);

  const div4 = document.createElement('div');
  div4.setAttribute('title', "it's working");
  d1.innerHTML = '';
  d1.appendChild(div4);
  testing.expectEqual('<div title="it\'s working"></div>', d1.innerHTML);

  const div5 = document.createElement('div');
  div5.setAttribute('data-code', '`template`');
  d1.innerHTML = '';
  d1.appendChild(div5);
  testing.expectEqual('<div data-code="`template`"></div>', d1.innerHTML);

  d1.innerHTML = '<a href="/search?q=test&lang=en" title="Search: &quot;test&quot;">Search</a>';
  testing.expectEqual('<a href="/search?q=test&amp;lang=en" title="Search: &quot;test&quot;">Search</a>', d1.innerHTML);

  d1.innerHTML = '<div data-start="&start">text</div>';
  testing.expectEqual('<div data-start="&amp;start">text</div>', d1.innerHTML);

  d1.innerHTML = '<div data-end="end&">text</div>';
  testing.expectEqual('<div data-end="end&amp;">text</div>', d1.innerHTML);

  d1.innerHTML = '<div data-middle="mid&dle">text</div>';
  testing.expectEqual('<div data-middle="mid&amp;dle">text</div>', d1.innerHTML);
</script>

<script id=voidElements>
  d1.innerHTML = '<br>';
  testing.expectEqual('<br>', d1.innerHTML);

  d1.innerHTML = '<hr>';
  testing.expectEqual('<hr>', d1.innerHTML);

  d1.innerHTML = '<img src="test.png" alt="test">';
  testing.expectEqual('<img src="test.png" alt="test">', d1.innerHTML);

  d1.innerHTML = '<input type="text" name="field">';
  testing.expectEqual('<input type="text" name="field">', d1.innerHTML);

  d1.innerHTML = '<link rel="stylesheet" href="style.css">';
  testing.expectEqual('<link rel="stylesheet" href="style.css">', d1.innerHTML);

  d1.innerHTML = '<meta charset="utf-8">';
  testing.expectEqual('<meta charset="utf-8">', d1.innerHTML);

  d1.innerHTML = '<div><br><hr><img src="x.png"></div>';
  testing.expectEqual('<div><br><hr><img src="x.png"></div>', d1.innerHTML);
</script>

<script id=innerText>
  // Get innerText from element
  d1.innerHTML = 'hello <em>world</em>';
  testing.expectEqual('hello world', d1.innerText);

  // Set innerText - should replace children with text node
  d1.innerText = 'only text';
  testing.expectEqual('only text', d1.innerText);
  testing.expectEqual('only text', d1.innerHTML);

  // innerText does NOT parse HTML (unlike innerHTML)
  d1.innerText = 'hello <div>world</div><b>!!</b>';
  testing.expectEqual('hello <div>world</div><b>!!</b>', d1.innerText);
  testing.expectEqual('hello &lt;div&gt;world&lt;/div&gt;&lt;b&gt;!!&lt;/b&gt;', d1.innerHTML);

  // Setting empty string clears children
  d1.innerText = '';
  testing.expectEqual('', d1.innerText);
  testing.expectEqual('', d1.innerHTML);

  // innerText with nested elements
  d1.innerHTML = '<div>hello <span>beautiful</span> world</div>';
  testing.expectEqual('hello beautiful world', d1.innerText);

  // Setting innerText removes all previous children including elements
  d1.innerHTML = '<div><p><a id=link2>hi</a></p></div>';
  testing.expectEqual('hi', d1.innerText);
  d1.innerText = 'new content';
  testing.expectEqual('new content', d1.innerText);
  testing.expectEqual(null, $('#link2'));

  testing.expectEqual("This is a\ntext", d2.innerText);
  testing.expectEqual("Hello World", $('#d3').innerText);
  testing.expectEqual("Hello World", $('#d4').innerText);

  // display:none subtrees are excluded from innerText, whether the rule comes
  // from an inline style or a stylesheet (the common real-world case: content
  // hidden via a CSS class). A hidden block does not contribute a line break.
  testing.expectEqual("abc", $('#d5').innerText);
  testing.expectEqual("beforeafter", $('#d6').innerText);

  // .innerText read ON a display:none root equals textContent. The own-element
  // check must keep visible child elements (an ancestor-walk would prune the
  // <span> while keeping its sibling text nodes, yielding "ac").
  d1.innerHTML = '<div id=dn style="display:none">a<span>b</span>c</div>';
  testing.expectEqual("abc", $('#dn').innerText);

  // A display:none <br> contributes no line break.
  d1.innerHTML = 'a<br style="display:none">b';
  testing.expectEqual("ab", d1.innerText);

  // visibility:hidden text is excluded too, and for a different reason than
  // display:none: the box exists, it just renders nothing. Chrome 151 reads "Y".
  // The whitespace and line-break halves of that rule are in the
  // innerTextVisibility group below.
  d1.innerHTML = '<span style="visibility:hidden">X</span>Y';
  testing.expectEqual("Y", d1.innerText);
</script>

<script id=rawTextContext>
  // Setting innerHTML on a raw-text element (script/style/textarea/title) must
  // parse the content in the matching raw-text tokenizer state. In particular a
  // '<' followed by a letter is plain text, NOT the start of a tag — otherwise
  // the body is truncated at the first '<' (e.g. `for(;l<localStorage.length;)`
  // would be swallowed, leaving a half-statement that fails to compile).
  const script = document.createElement('script');
  const body = 'window.__x=0; for(let l=0;l<localStorage.length+3;){window.__x=l;l++;}';
  script.innerHTML = body;
  testing.expectEqual(body, script.innerHTML);
  testing.expectEqual(1, script.childNodes.length);
  testing.expectEqual(body, script.textContent);

  const style = document.createElement('style');
  style.innerHTML = 'a<b{color:red}';
  testing.expectEqual('a<b{color:red}', style.innerHTML);
  testing.expectEqual(1, style.childNodes.length);

  // textarea / title are RCDATA: '<' + letter stays text (not a tag) and
  // character references are decoded on parse. On serialization the content is
  // re-escaped (RCDATA elements are NOT raw-text-serialized), so the round-trip
  // shows '<' as &lt; and the decoded '&' re-escaped as &amp;.
  const textarea = document.createElement('textarea');
  textarea.innerHTML = 'x < y &amp; z';
  testing.expectEqual('x < y & z', textarea.value);
  testing.expectEqual('x &lt; y &amp; z', textarea.innerHTML);

  const title = document.createElement('title');
  title.innerHTML = '1 < 2 < three';
  testing.expectEqual(1, title.childNodes.length);
  testing.expectEqual('1 < 2 < three', title.textContent);
  testing.expectEqual('1 &lt; 2 &lt; three', title.innerHTML);

  // A normal element stays in the data state: '<b>' is a real child element.
  d1.innerHTML = 'a<b>bold</b>';
  testing.expectEqual('a<b>bold</b>', d1.innerHTML);
  testing.expectEqual('B', d1.lastChild.tagName);
</script>

<script id=leadingBOM>
  // A leading U+FEFF (BOM / ZWNBSP) is only stripped from a document's input
  // stream, never from a parsed fragment. innerHTML must preserve it, otherwise
  // round-tripped markup (e.g. React hydrating BOM-prefixed CMS strings) breaks.
  // Uses the \uFEFF escape rather than a raw BOM byte so the assertion does not
  // depend on this file's charset.
  const el = document.createElement('div');
  el.innerHTML = '\uFEFFabc';
  testing.expectEqual(4, el.textContent.length);
  testing.expectEqual(0xFEFF, el.textContent.charCodeAt(0));
  testing.expectEqual('\uFEFFabc', el.textContent);

  // An interior BOM is likewise preserved.
  el.innerHTML = 'x\uFEFFy';
  testing.expectEqual('x\uFEFFy', el.textContent);
</script>

<script id=innerTextTextTransform>
  // innerText is defined in terms of layout, so it reports text the way it is
  // rendered -- text-transform included. Chrome returns MY FINGERPRINT here;
  // returning the source casing is what made iphey's card read `Browser` where
  // Chrome reads `BROWSER`, and the same for amiunique and pixelscan.
  const tt = document.createElement('div');
  document.body.appendChild(tt);

  // From an inline style.
  tt.innerHTML = '<div style="text-transform: uppercase">my fingerprint</div>';
  testing.expectEqual('MY FINGERPRINT', tt.innerText);
  testing.expectEqual('my fingerprint', tt.textContent);

  tt.innerHTML = '<div style="text-transform: lowercase">MY FINGERPRINT</div>';
  testing.expectEqual('my fingerprint', tt.innerText);

  tt.innerHTML = '<div style="text-transform: capitalize">my fingerprint here</div>';
  testing.expectEqual('My Fingerprint Here', tt.innerText);

  tt.innerHTML = '<div style="text-transform: none">my fingerprint</div>';
  testing.expectEqual('my fingerprint', tt.innerText);

  // It inherits, which is how a page sets it once on a container.
  tt.innerHTML = '<div style="text-transform: uppercase">a <em>b</em> c</div>';
  testing.expectEqual('A B C', tt.innerText);

  // A descendant overrides its ancestor.
  tt.innerHTML = '<div style="text-transform: uppercase">a <em style="text-transform: lowercase">B</em></div>';
  testing.expectEqual('A b', tt.innerText);

  // From a stylesheet rule, which is the path the three detectors actually use.
  const sheet = document.createElement('style');
  sheet.textContent = '.shout { text-transform: uppercase }';
  document.head.appendChild(sheet);
  tt.innerHTML = '<div class="shout">my fingerprint</div>';
  testing.expectEqual('MY FINGERPRINT', tt.innerText);

  // capitalize only touches the first letter of each word, not the rest.
  tt.innerHTML = '<div style="text-transform: capitalize">mcDONALD o’neill</div>';
  testing.expectEqual('McDONALD O’neill', tt.innerText);

  tt.remove();
  sheet.remove();
</script>

<script id=innerTextCollapsedBoundary>
  // A collapsible space pending from one text run must survive an all-whitespace
  // text node. iphey's headline is `Looks <span> <span>Trustworthy</span> </span>`:
  // the space after "Looks" was pending, the slot span's whitespace-only child
  // cleared it, and the card read LooksTrustworthy. Chrome's readings are in the
  // comments; all of these were measured on Chrome 151 against about:blank.
  const ws = document.createElement('div');
  document.body.appendChild(ws);

  // Chrome: "a b" -- the pending space survives the nested inline's whitespace.
  ws.innerHTML = 'a <span> <span>b</span> </span>';
  testing.expectEqual('a b', ws.innerText);

  // Chrome: "a b" -- two whitespace-only nodes still collapse to one space.
  ws.innerHTML = 'a <span> </span><span> </span>b';
  testing.expectEqual('a b', ws.innerText);

  // Chrome: "a b" -- this one already passed; nothing is pending after "a", so
  // the whitespace-only node is what creates the space. Kept as the control
  // that says the fix did not simply force a space in unconditionally.
  ws.innerHTML = 'a<span> <span>b</span> </span>';
  testing.expectEqual('a b', ws.innerText);

  // Chrome: "a b" -- an inline-block slot collapses rather than breaking.
  ws.innerHTML = 'a <span style="display:inline-block"> <span>b</span> </span>';
  testing.expectEqual('a b', ws.innerText);

  // Chrome: "ab" -- with no whitespace anywhere there is no space to preserve.
  ws.innerHTML = 'a<span><span>b</span></span>';
  testing.expectEqual('ab', ws.innerText);

  // Chrome: "a" -- leading and trailing whitespace is still dropped, so the
  // fix must not turn a pending space into a trailing one.
  ws.innerHTML = ' <span> </span>a<span> </span> ';
  testing.expectEqual('a', ws.innerText);

  ws.remove();
</script>

<script id=innerTextComputedDisplay>
  // innerText breaks a line for a block-level *computed* display, not for a
  // block-level tag. Chrome's reading is in the comment on every line; all of
  // them were measured on Chrome 151 against about:blank (probe d4-cases).
  const cd = document.createElement('div');
  document.body.appendChild(cd);
  const read = (html) => { cd.innerHTML = html; return cd.innerText; };

  // An inline tag turned block-level by CSS breaks.
  testing.expectEqual('a\nM\nb', read('a<span style="display:block">M</span>b'));
  testing.expectEqual('a\nM\nb', read('a<span style="display:flex">M</span>b'));
  testing.expectEqual('a\nM\nb', read('a<span style="display:grid">M</span>b'));
  testing.expectEqual('a\nM\nb', read('a<span style="display:list-item">M</span>b'));
  testing.expectEqual('a\nM\nb', read('a<span style="display:table">M</span>b'));
  testing.expectEqual('a\nM\nb', read('a<span style="display:flow-root">M</span>b'));
  testing.expectEqual('a\nM\nb', read('a<span style="display:table-caption">M</span>b'));

  // Every inline-level value does not -- inline-flex included, which is the
  // reading that ruled the container out as the cause of iphey's line break.
  testing.expectEqual('aMb', read('a<span style="display:inline-block">M</span>b'));
  testing.expectEqual('aMb', read('a<span style="display:inline-flex">M</span>b'));
  testing.expectEqual('aMb', read('a<span style="display:inline-grid">M</span>b'));
  testing.expectEqual('aMb', read('a<span style="display:inline-table">M</span>b'));
  testing.expectEqual('aMb', read('a<span style="display:table-cell">M</span>b'));
  testing.expectEqual('aMb', read('a<span style="display:table-row">M</span>b'));
  testing.expectEqual('aMb', read('a<span style="display:contents">M</span>b'));
  testing.expectEqual('aMb', read('a<span style="display:ruby">M</span>b'));
  testing.expectEqual('ab', read('a<span style="display:none">M</span>b'));

  // And the override goes the other way: a block tag turned inline-level does
  // not break, where the same tag with no declaration does.
  testing.expectEqual('a\nM\nb', read('a<div>M</div>b'));
  testing.expectEqual('aMb', read('a<div style="display:inline">M</div>b'));
  testing.expectEqual('aMb', read('a<div style="display:inline-block">M</div>b'));
  testing.expectEqual('aMb', read('a<li style="display:inline">M</li>b'));
  // <p> is the exception, and a measured one: its blank line comes from the UA
  // margin rather than from its display, and survives display:inline.
  testing.expectEqual('a\n\nM\n\nb', read('a<p style="display:inline">M</p>b'));

  // Blockification: a flex or grid container turns its child *elements*
  // block-level, so they break even though the container does not.
  testing.expectEqual('a\nM\nb', read('a<span style="display:inline-flex"><span>M</span></span>b'));
  testing.expectEqual('a\nM\nN\nb', read('a<span style="display:inline-flex"><span>M</span><span>N</span></span>b'));
  testing.expectEqual('a\nM\nN\nb', read('a<div style="display:grid"><span>M</span><span>N</span></div>b'));
  // Bare text in the same container does not: it gets an anonymous flex item,
  // and innerText has no node to break at. This is the row that says the break
  // belongs to the child and not to the container.
  testing.expectEqual('aMb', read('a<span style="display:inline-flex">M</span>b'));
  // Only a direct child is a flex item.
  testing.expectEqual('a\nM\nb', read('a<span style="display:inline-flex"><span><span>M</span></span></span>b'));
  // display:contents generates no box, so it is exempt from blockification.
  testing.expectEqual('aMb', read('a<span style="display:inline-flex"><span style="display:contents">M</span></span>b'));
  // An inline-block container blockifies nothing.
  testing.expectEqual('aMb', read('a<span style="display:inline-block"><span>M</span></span>b'));

  // An atomic inline box is its own formatting context, so a break inside it
  // does not collapse the whitespace of the run around it -- where a real block
  // boundary collapses both sides. Chrome 151, probes d4-space{,2,3}.
  testing.expectEqual('a\nM\nb', read('a <span style="display:block">M</span> b'));
  testing.expectEqual('a\nM\nb', read('a <span><span style="display:block">M</span></span> b'));
  testing.expectEqual('a \nM\n b', read('a <span style="display:inline-flex"><span>M</span></span> b'));
  testing.expectEqual('a\nM\n b', read('a<span style="display:inline-flex"><span>M</span></span> b'));
  testing.expectEqual('a \nM\nb', read('a <span style="display:inline-flex"><span>M</span></span>b'));
  testing.expectEqual('a \nM\n b',
    read('a <span style="display:inline-block"><span style="display:block">M</span></span> b'));
  testing.expectEqual('a \nM\nN\n b',
    read('a <span style="display:inline-flex"><span>M</span></span><span style="display:inline-flex"><span>N</span></span> b'));
  // A real block after the box asserts its own boundary again.
  testing.expectEqual('a \nM\nN\nc',
    read('a <span style="display:inline-flex"><span>M</span></span> <div>N</div> c'));
  // Even an empty box keeps both spaces -- Chrome reads two, not one.
  testing.expectEqual('a  b', read('a <span style="display:inline-block"></span> b'));
  testing.expectEqual('a  b', read('a <span style="display:inline-block"> </span> b'));
  testing.expectEqual('a \n b', read('a <span style="display:inline-flex"><span></span></span> b'));
  // The box's own leading and trailing whitespace still collapses inside it.
  testing.expectEqual('a x b', read('a <span style="display:inline-block">x</span> b'));
  testing.expectEqual('a x b', read('a <span style="display:inline-block">x </span> b'));
  testing.expectEqual('a x b', read('a <span style="display:inline-block"> x</span> b'));
  testing.expectEqual('a x\nM\ny b', read('a <span style="display:inline-block">x<div>M</div>y</span> b'));
  // inline-table is an atomic inline too, but it blockifies nothing.
  testing.expectEqual('a M b', read('a <span style="display:inline-table"><span>M</span></span> b'));

  // iphey's headline, verbatim. It read "Looks Trustworthy" on one line before.
  testing.expectEqual('Looks \nTrustworthy',
    read('Looks <span style="display:inline-flex"> <span>Trustworthy</span> </span>'));

  cd.remove();
</script>

<script id=innerTextVisibility>
  // Text is rendered only when its nearest element ancestor computes to
  // `visible`. Chrome's reading is in the comment on every line; all of them
  // were measured on Chrome 151 against about:blank (probes w1-visibility and
  // w1b-visibility, tabulated in tools/fingerprint/README.md).
  const cv = document.createElement('div');
  document.body.appendChild(cv);
  const readv = (html) => { cv.innerHTML = html; return cv.innerText; };

  // `hidden` and `collapse` both hide the text.
  testing.expectEqual('ab', readv('a<span style="visibility:hidden">M</span>b'));
  testing.expectEqual('ab', readv('a<span style="visibility:collapse">M</span>b'));
  // It inherits, so a descendant with no declaration of its own stays hidden...
  testing.expectEqual('ab', readv('a<span style="visibility:hidden"><span>M</span></span>b'));
  // ...and one that declares `visible` turns it back on. This is why the rule
  // is not "skip the subtree".
  testing.expectEqual('aMb',
    readv('a<span style="visibility:hidden"><span style="visibility:visible">M</span></span>b'));
  testing.expectEqual('aMb',
    readv('a<span style="visibility:hidden"><span style="visibility:visible"><span>M</span></span></span>b'));
  testing.expectEqual('ab',
    readv('a<span style="visibility:hidden"><span style="visibility:visible">' +
          '<span style="visibility:hidden">M</span></span></span>b'));
  // opacity is not visibility: a transparent element still renders its text.
  testing.expectEqual('aMb', readv('a<span style="opacity:0">M</span>b'));

  // A hidden block box contributes no line break, but a visible one does even
  // when it is empty.
  testing.expectEqual('a\nb', readv('a<div></div>b'));
  testing.expectEqual('a\nb', readv('a<div> </div>b'));
  testing.expectEqual('ab', readv('a<div style="visibility:hidden">M</div>b'));
  testing.expectEqual('ab', readv('a<div style="visibility:hidden"></div>b'));
  // Not even <p>'s blank line.
  testing.expectEqual('ab', readv('a<p style="visibility:hidden">M</p>b'));
  // A hidden <br> is silent too.
  testing.expectEqual('ab', readv('a<div style="visibility:hidden"><br></div>b'));
  testing.expectEqual('ab', readv('a<span style="visibility:hidden"><div>M</div></span>b'));
  testing.expectEqual('a\nM\nP\nb',
    readv('a<div>M</div><div style="visibility:hidden">N</div><div>P</div>b'));
  testing.expectEqual('aN\nP\nb',
    readv('a<div style="visibility:hidden">M</div>N<div>P</div>b'));
  // The outer hidden block never contributes a break; whether one appears
  // depends only on whether the visible content inside is block-level.
  testing.expectEqual('a\nM\nb',
    readv('a<div style="visibility:hidden"><div style="visibility:visible">M</div></div>b'));
  testing.expectEqual('aMb',
    readv('a<div style="visibility:hidden"><span style="visibility:visible">M</span></div>b'));

  // Hidden text is zero-width but still a run in the inline flow: the
  // collapsible spaces on either side of it do not merge across it. A hidden
  // block still trims both sides.
  testing.expectEqual('a  b', readv('a <span style="visibility:hidden">M</span> b'));
  testing.expectEqual('a b', readv('a <span style="visibility:hidden">M</span>b'));
  testing.expectEqual('a  N b',
    readv('a <span style="visibility:hidden">M</span> <span>N</span> b'));
  testing.expectEqual('ab', readv('a <div style="visibility:hidden">M</div> b'));
  // The control worth keeping: display:none is *absent*, so the two collapsible
  // spaces around it merge into one. The two cannot share an implementation.
  testing.expectEqual('a b', readv('a <div style="display:none">M</div> b'));
  // And it really is the run and not the box that separates them: an *empty*
  // hidden inline merges the two spaces, where an empty inline-block keeps both
  // (probe w2-boundary). So the hidden box itself contributes nothing at all.
  testing.expectEqual('a b', readv('a <span style="visibility:hidden"></span> b'));
  testing.expectEqual('a b', readv('a <span style="visibility:hidden"> </span> b'));
  testing.expectEqual('a  b', readv('a <span style="display:inline-block"></span> b'));
  // display:contents generates no box to be hidden, and the run inside it still
  // separates the spaces -- which is the row that rules the box out as the cause.
  testing.expectEqual('a  b', readv('a <span style="visibility:hidden;display:contents">M</span> b'));
  testing.expectEqual('ab', readv('a<span style="visibility:hidden;display:contents">M</span>b'));
  testing.expectEqual('aMb',
    readv('a<span style="visibility:hidden;display:contents"><span style="visibility:visible">M</span></span>b'));
  // A visible block inside a hidden inline asserts a real block boundary, so it
  // trims the space the hidden run would otherwise have kept.
  testing.expectEqual('a\nM\nb',
    readv('a <span style="visibility:hidden"><div style="visibility:visible">M</div></span> b'));
  // A hidden atomic inline keeps both spaces -- as a box, not as a run.
  testing.expectEqual('a  b', readv('a <span style="visibility:hidden;display:inline-block">M</span> b'));
  testing.expectEqual('a  b',
    readv('a <span style="visibility:hidden;display:inline-flex"><span>M</span></span> b'));

  // A hidden cell or row contributes no separator, and does not count as one for
  // the next sibling either -- the table analogue of the missing line break.
  testing.expectEqual('a\nM\tP\nb',
    readv('a<table><tr><td>M</td><td style="visibility:hidden">N</td><td>P</td></tr></table>b'));
  testing.expectEqual('a\nM\nP\nb',
    readv('a<table><tr><td>M</td></tr><tr style="visibility:hidden"><td>N</td></tr>' +
          '<tr><td>P</td></tr></table>b'));
  testing.expectEqual('ab', readv('a<table style="visibility:hidden"><tr><td>M</td></tr></table>b'));

  // <pre> keeps its whitespace for the visible part and still contributes no
  // break while hidden.
  testing.expectEqual('ab', readv('a<pre style="visibility:hidden">M  N</pre>b'));
  testing.expectEqual('aM  Nb',
    readv('a<pre style="visibility:hidden"><span style="visibility:visible">M  N</span></pre>b'));

  // The same through a stylesheet rule rather than an inline style, including
  // the !important ordering: the rule loses to the style attribute unless it is
  // !important too.
  const vsheet = document.createElement('style');
  vsheet.textContent = '.vh { visibility: hidden }';
  document.head.appendChild(vsheet);
  testing.expectEqual('ab', readv('a<span class=vh>M</span>b'));
  testing.expectEqual('aMb', readv('a<span class=vh style="visibility:visible">M</span>b'));
  testing.expectEqual('aMb', readv('a<span class=vh><span style="visibility:visible">M</span></span>b'));
  vsheet.remove();
  const vsheetImp = document.createElement('style');
  vsheetImp.textContent = '.vh { visibility: hidden !important }';
  document.head.appendChild(vsheetImp);
  testing.expectEqual('ab', readv('a<span class=vh style="visibility:visible">M</span>b'));
  vsheetImp.remove();

  // Reading innerText off a hidden element itself, which is the shape a
  // detector uses on a hidden honeypot.
  cv.innerHTML = 'M';
  cv.style.visibility = 'hidden';
  testing.expectEqual('', cv.innerText);
  cv.innerHTML = '<span style="visibility:visible">M</span>';
  testing.expectEqual('M', cv.innerText);
  cv.style.visibility = '';

  cv.remove();
</script>
