<!DOCTYPE html>
<script src="../testing.js"></script>

<div id="test1">Test Element</div>
<div id="test2">Another Element</div>

<script id="clientDimensions">
{
  const test1 = $('#test1');

  // clientWidth/Height - default is 5px in dummy layout
  testing.expectEqual('number', typeof test1.clientWidth);
  testing.expectEqual('number', typeof test1.clientHeight);
  testing.expectTrue(test1.clientWidth >= 0);
  testing.expectTrue(test1.clientHeight >= 0);

  // clientTop/Left should be 0 (no borders in dummy layout)
  testing.expectEqual(0, test1.clientTop);
  testing.expectEqual(0, test1.clientLeft);
}
</script>

<script id="scrollDimensions">
{
  const test1 = $('#test1');

  // Both scroll dimensions are approximated from the content, so neither falls
  // below the element's own box but either may exceed it.
  testing.expectTrue(test1.scrollWidth >= test1.clientWidth);
  testing.expectTrue(test1.scrollHeight >= test1.clientHeight);

  // test1 holds only a text node and no element children, so its own box is
  // already exactly as wide as its text and there is nothing to overflow it.
  // Height is still the placeholder on both sides, so that axis agrees too.
  testing.expectEqual(test1.clientWidth, test1.scrollWidth);
  testing.expectEqual(test1.clientHeight, test1.scrollHeight);
}
</script>

<script id="scrollWidthFromContent">
{
  // An empty element has no content to overflow its box.
  const empty = document.createElement('div');
  document.body.appendChild(empty);
  testing.expectEqual(empty.clientWidth, empty.scrollWidth);

  // An unsized BLOCK does not shrink-wrap: it is as wide as its containing
  // block, so adding children moves neither its clientWidth nor its
  // scrollWidth. Measured in both arms with
  // tools/fingerprint/scratch/expr-position-assertions.js -- Chrome and this
  // engine both report 1904 for one child and for two, on a 1904px body.
  // These assertions used to say the opposite, from the days when every
  // unsized box measured its own text.
  const box = document.createElement('div');
  document.body.appendChild(box);
  box.appendChild(document.createElement('span'));
  const oneChild = box.scrollWidth;
  testing.expectEqual(box.clientWidth, oneChild);

  box.appendChild(document.createElement('span'));
  testing.expectEqual(oneChild, box.scrollWidth);
  testing.expectEqual(box.scrollWidth, box.clientWidth);

  // Text does not widen a block either, for the same reason: it wraps inside a
  // box whose width was already decided. Both runs read the body's width.
  const short = document.createElement('div');
  const long = document.createElement('div');
  short.textContent = 'ab';
  long.textContent = 'abcdefghijklmnop';
  document.body.appendChild(short);
  document.body.appendChild(long);
  testing.expectEqual(short.clientWidth, short.scrollWidth);
  testing.expectEqual(long.clientWidth, long.scrollWidth);
  testing.expectEqual(short.scrollWidth, long.scrollWidth);

  // A box that DOES shrink to fit still measures its content, and that is the
  // property the marquee idioms below rely on. Chrome grows 28 -> 142 over
  // five items and this engine 28 -> 140, so the assertion is the growth.
  const shrink = document.createElement('div');
  shrink.style.display = 'inline-block';
  document.body.appendChild(shrink);
  const item = document.createElement('span');
  item.textContent = 'item';
  shrink.appendChild(item);
  const shrinkOne = shrink.clientWidth;
  for (let i = 0; i < 4; i++) shrink.appendChild(item.cloneNode(true));
  testing.expectTrue(shrink.clientWidth > shrinkOne * 4);

  // Comments are not rendered, so they contribute nothing.
  const commented = document.createElement('div');
  commented.innerHTML = '<!-- a very long comment that renders as nothing -->';
  document.body.appendChild(commented);
  testing.expectEqual(commented.clientWidth, commented.scrollWidth);

  // A display:none child takes up no space.
  const withHidden = document.createElement('div');
  const hiddenChild = document.createElement('span');
  hiddenChild.style.display = 'none';
  withHidden.appendChild(hiddenChild);
  document.body.appendChild(withHidden);
  testing.expectEqual(withHidden.clientWidth, withHidden.scrollWidth);

  // A hidden element reports 0, matching clientWidth/offsetWidth.
  const hidden = document.createElement('div');
  hidden.style.display = 'none';
  hidden.appendChild(document.createElement('span'));
  document.body.appendChild(hidden);
  testing.expectEqual(0, hidden.scrollWidth);

  // A visible width:0 box (an off-screen measurement container) is not hidden:
  // content overflows it. Content, though -- an EMPTY <span> is not any of it,
  // and Chrome answers 0 for that case, measured with
  // tools/fingerprint/scratch/expr-zero-width-span.js. This used to assert the
  // opposite, from the days when an empty inline box still had a 5px one of
  // its own.
  const zeroWidth = document.createElement('div');
  zeroWidth.style.width = '0';
  zeroWidth.appendChild(document.createElement('span'));
  document.body.appendChild(zeroWidth);
  testing.expectEqual(0, zeroWidth.clientWidth);
  testing.expectEqual(0, zeroWidth.scrollWidth);

  // Give the span something to lay out and it does overflow, by the 8px its
  // text takes -- Chrome's answer for the same page.
  zeroWidth.firstChild.textContent = 'x';
  testing.expectEqual(8, zeroWidth.scrollWidth);

  // The root containers keep their synthetic size rather than summing
  // children, so horizontal page-overflow checks stay stable. In standards
  // mode the root element's clientWidth is the viewport (CSSOM View), not
  // its box; offsetWidth and scrollWidth still report the box.
  testing.expectEqual(document.body.clientWidth, document.body.scrollWidth);
  testing.expectEqual(window.innerWidth, document.documentElement.clientWidth);
  testing.expectEqual(
    document.documentElement.offsetWidth,
    document.documentElement.scrollWidth,
  );
}
</script>

<script id="scrollWidthMarqueeLoop">
{
  // The infinite-marquee idiom duplicates content until it is twice the width
  // of its container. Run against a real browser with
  // tools/fingerprint/scratch/expr-marquee-loop.js, and this engine now
  // answers what Chrome answers at every step:
  //
  //   a block lane is its container's width (1904) and stays there when its
  //   markup is doubled once -- so `before * 2` is not what scrollWidth
  //   becomes, in Chrome either;
  //   but the lane's content is one unbreakable run of <span>s with no space
  //   between them, so it overflows rather than wrapping, and scrollWidth does
  //   climb: seven doublings take it past twice the track, in Chrome at 7280
  //   and here at 7168. The loop terminates, and it terminates on the same
  //   iteration.
  const track = document.createElement('div');
  const lane = document.createElement('div');
  lane.innerHTML = '<span>item</span>';
  track.appendChild(lane);
  document.body.appendChild(track);

  const before = lane.scrollWidth;
  testing.expectEqual(lane.clientWidth, before);
  lane.innerHTML += lane.innerHTML;
  testing.expectEqual(before, lane.scrollWidth);

  let guard = 0;
  while (lane.scrollWidth < track.offsetWidth * 2 && guard < 50) {
    lane.innerHTML += lane.innerHTML;
    guard++;
  }
  testing.expectTrue(guard < 50);
  testing.expectEqual(7, guard);
}
</script>

<script id="clientWidthMarqueeLoop">
{
  // The clientWidth variant of the marquee idiom (amivoice.com): clone items
  // into a wrap until it is twice the width of its container.
  //
  // With an unsized BLOCK wrap this loop does not terminate -- and it does not
  // terminate in Chrome either. Run verbatim with
  // tools/fingerprint/scratch/expr-clientwidth-marquee.js, all six variants
  // (empty span or text span, block or inline-block wrap, clientWidth or
  // getComputedStyle) hit the 50-iteration guard in Chrome exactly as they do
  // here. A block wrap IS its container's width, so `wrap.clientWidth <
  // container.clientWidth * 2` is true forever. The reduction as written can
  // only end under the shrink-wrap model this engine used to have, which is
  // why it is asserted the other way round now.
  //
  // What the sites actually rely on is the shrink-to-fit case below, where
  // clientWidth does answer the content.
  const container = document.createElement('div');
  const wrap = document.createElement('div');
  const item = document.createElement('span');
  item.textContent = 'item';
  wrap.appendChild(item);
  container.appendChild(wrap);
  document.body.appendChild(container);

  const containerBefore = container.clientWidth;
  testing.expectEqual(containerBefore, wrap.clientWidth);
  for (let i = 0; i < 4; i++) wrap.appendChild(item.cloneNode(true));
  testing.expectEqual(containerBefore, wrap.clientWidth);
  testing.expectEqual(containerBefore, container.clientWidth);

  // The same loop over a wrap that shrinks to fit, which is the shape that
  // terminates: five items are five times as wide as one.
  const shrinkWrap = document.createElement('div');
  shrinkWrap.style.display = 'inline-block';
  shrinkWrap.appendChild(item.cloneNode(true));
  container.appendChild(shrinkWrap);
  const oneItem = shrinkWrap.clientWidth;
  let guard = 0;
  while (shrinkWrap.clientWidth < oneItem * 4 && guard < 50) {
    shrinkWrap.appendChild(item.cloneNode(true));
    guard++;
  }
  testing.expectTrue(guard < 50);

  // An explicit inline size pins the box regardless of content.
  const pinned = document.createElement('div');
  pinned.style.width = '40px';
  pinned.appendChild(document.createElement('span'));
  pinned.appendChild(document.createElement('span'));
  pinned.appendChild(document.createElement('span'));
  document.body.appendChild(pinned);
  testing.expectEqual(40, pinned.clientWidth);
}
</script>

<script id="recycleTickerLoop">
{
  // The recycle variant of the marquee idiom (lseo.com): slide the track with
  // translateX and, whenever the last card has left the shell on one side,
  // move it to the other end of the track and offset the translation by its
  // width so the remaining cards stay put. The loop is bounded only because
  // the translation is honored: ignore it and each rotation pushes the cards
  // further out of the shell.
  const shell = document.createElement('div');
  const track = document.createElement('div');
  for (let i = 0; i < 4; i++) {
    track.appendChild(document.createElement('div'));
  }
  shell.appendChild(track);
  document.body.appendChild(shell);

  const sRect = shell.getBoundingClientRect();
  const recycle = (x, reverse) => {
    let guard = 0;
    while (guard < 50) {
      const el = reverse ? track.lastElementChild : track.firstElementChild;
      const r = el.getBoundingClientRect();
      if (reverse ? r.left < sRect.right : r.right > sRect.left) break;
      const w = el.offsetWidth;
      if (reverse) {
        track.insertBefore(el, track.firstElementChild);
        x -= w;
      } else {
        track.appendChild(el);
        x += w;
      }
      track.style.transform = `translateX(${x}px)`;
      guard++;
    }
    return guard;
  };

  // Right-to-left: the track has slid 60px; every card is out on the right.
  track.style.transform = 'translateX(60px)';
  testing.expectTrue(recycle(60, true) < 50);
  testing.expectTrue(track.firstElementChild.getBoundingClientRect().left < sRect.right);

  // Left-to-right, from the same shifted state.
  track.style.transform = 'translateX(-60px)';
  testing.expectTrue(recycle(-60, false) < 50);
  testing.expectTrue(track.lastElementChild.getBoundingClientRect().right > sRect.left);
}
</script>

<script id="translateX">
{
  const shell = document.createElement('div');
  const track = document.createElement('div');
  const card = document.createElement('div');
  track.appendChild(card);
  shell.appendChild(track);
  document.body.appendChild(shell);

  card.style.width = '40px';
  card.style.height = '10px';

  // A row starts at its parent's left edge.
  const base = shell.getBoundingClientRect().x;
  testing.expectEqual(base, card.getBoundingClientRect().x);
  testing.expectEqual(base, card.offsetLeft);

  // The X translation of the element and of its ancestors moves the rect --
  // and moves offsetLeft not at all. Measured on Chrome 152 over thirteen
  // transforms (probes/expr-transform-rect.js): a box at `left:-9999px`
  // reports -9999 for offsetLeft under every one of them, translations
  // included, while its rect moves under all of them.
  track.style.transform = 'translateX(-12px)';
  testing.expectEqual(base - 12, card.getBoundingClientRect().x);
  testing.expectEqual(base, card.offsetLeft);
  card.style.transform = 'translate3d(2px, 100px, 0) matrix(1, 0, 0, 1, 3, 9)';
  testing.expectEqual(base - 7, card.getBoundingClientRect().x);
  testing.expectEqual(base, card.offsetLeft);

  // The rect keeps the fraction.
  card.style.transform = 'translateX(0.5px)';
  testing.expectEqual(base - 11.5, card.getBoundingClientRect().x);

  // A percentage translation is a percentage of the element's own border box,
  // which is the card's 40px and not the track's width.
  card.style.transform = 'translateX(-50%)';
  testing.expectEqual(base - 32, card.getBoundingClientRect().x);
}
</script>

<!--
  The rest of the transform list, not just its X translation. iphey's
  `dom-element-geometry` check puts a 100x100 box at `left:-9999px`, rotates it
  45 degrees and sends all three readings it takes; a rect that ignores the
  rotation answers a 100x100 square where every browser answers 141.42 on both
  axes, which is one number away from a tell.

  Expected values are this engine's own: the matrix comes from the COMPUTED
  `transform`, which keeps six significant digits, so a rotation's cosine is
  0.707107 and the 141.4214 below is Chrome's 141.421875 to within a
  hundredth. Chrome's last digits are its layout grid (1/64 px) and are not
  something to reproduce here. Everything else -- which corner, which origin,
  which composition order -- is measured, with
  tools/fingerprint/probes/expr-transform-rect.js on Chrome 152.
-->
<script id="transformRectMatrix">
{
  const host = document.createElement('div');
  host.setAttribute('style', 'position:absolute; top:0; left:0; width:400px; height:200px;');
  const el = document.createElement('div');
  el.setAttribute('style', 'position:absolute; top:0; left:0; width:100px; height:100px;');
  host.appendChild(el);
  document.body.appendChild(host);

  const hostBox = host.getBoundingClientRect();
  testing.expectEqual(400, hostBox.width);
  testing.expectEqual(200, hostBox.height);
  const base = el.getBoundingClientRect();
  testing.expectEqual(100, base.width);
  testing.expectEqual(100, base.height);

  // Two decimals: the third is the six-digit matrix above.
  const at = (value, origin) => {
    el.style.transformOrigin = origin ?? '';
    el.style.transform = value;
    const r = el.getBoundingClientRect();
    const round = (n) => Math.round(n * 100) / 100;
    return [round(r.x - base.x), round(r.y - base.y), round(r.width), round(r.height)];
  };

  // A rotation turns about the box's centre, so the rect is the bounding box
  // of the turned square: 100 * sqrt(2) on both axes, centred where it was.
  testing.expectEqual([-20.71, -20.71, 141.42, 141.42], at('rotate(45deg)'));

  // The `.shift` class iphey adds on top of the rotation.
  testing.expectEqual([-29.44, -29.44, 158.88, 158.88], at('rotate(45deg) scale(1.123456789)'));

  // A scale grows about the centre too, per axis.
  testing.expectEqual([-50, -50, 200, 200], at('scale(2)'));
  testing.expectEqual([-50, 25, 200, 50], at('scale(2, 0.5)'));

  // A translation moves the box and leaves its size alone; a percentage is of
  // the element's own border box.
  testing.expectEqual([50, 10, 100, 100], at('translate(50%, 10%)'));
  testing.expectEqual([-12.5, 0, 100, 100], at('translateX(-12.5px)'));

  // A skew leans one axis: tan(30deg) * 100 of extra width, no extra height.
  testing.expectEqual([-28.87, 0, 157.74, 100], at('skewX(30deg)'));
  testing.expectEqual([-15, -5, 150, 150], at('matrix(1, 0.5, -0.5, 1, 10, 20)'));

  // `transform-origin` moves the point it all turns about.
  testing.expectEqual([-70.71, 0, 141.42, 141.42], at('rotate(45deg)', '0 0'));
  testing.expectEqual([29.29, -41.42, 141.42, 141.42], at('rotate(45deg)', 'bottom right'));

  // The list composes left to right: the last function applies first, in the
  // space the ones before it have already turned.
  testing.expectEqual([0, 10, 100, 100], at('rotate(90deg) translateX(10px)'));
  testing.expectEqual([10, 0, 100, 100], at('translateX(10px) rotate(90deg)'));

  // An ancestor's transform applies to the descendant's already-transformed
  // box, about the ANCESTOR's own centre: 200,100 into a 400x200 host.
  host.style.transform = 'translateX(30px) scale(2)';
  testing.expectEqual([-211.42, -141.42, 282.84, 282.84], at('rotate(45deg)'));
  host.style.transform = '';

  // getClientRects reports the same box, and offsetLeft/offsetWidth report the
  // untransformed one.
  el.style.transform = 'rotate(45deg)';
  const list = el.getClientRects();
  testing.expectEqual(1, list.length);
  testing.expectEqual(Math.round(el.getBoundingClientRect().x * 100), Math.round(list[0].x * 100));
  testing.expectEqual(100, el.offsetWidth);
  testing.expectEqual(100, el.offsetHeight);
  testing.expectEqual(base.x, el.offsetLeft);

  host.remove();
}
</script>

<script id="computedWidthMarqueeLoop">
{
  // The getComputedStyle variant of the marquee idiom (inchurch.com.br's
  // dynamic-marquee-widget via jQuery .width()): the computed value has to
  // answer whatever clientWidth answers, or a page reading one and laying out
  // by the other sees a contradiction.
  const container = document.createElement('div');
  const wrap = document.createElement('div');
  const item = document.createElement('span');
  item.textContent = 'item';
  wrap.appendChild(item);
  container.appendChild(wrap);
  document.body.appendChild(container);

  // Same story through getComputedStyle, and the same in Chrome: the computed
  // width of a block wrap is its container's, so it never reaches twice it.
  // What has to hold is that the computed value and clientWidth agree -- a
  // guard reading both in one expression sees any disagreement.
  const width = (el) => parseFloat(getComputedStyle(el).width);
  const containerWidth = width(container);
  testing.expectEqual(containerWidth, width(wrap));
  testing.expectEqual(width(wrap), wrap.clientWidth);
  for (let i = 0; i < 4; i++) wrap.appendChild(item.cloneNode(true));
  testing.expectEqual(containerWidth, width(wrap));

  // And the shrink-to-fit wrap grows through the computed value too.
  const shrinkWrap = document.createElement('div');
  shrinkWrap.style.display = 'inline-block';
  shrinkWrap.appendChild(item.cloneNode(true));
  container.appendChild(shrinkWrap);
  const oneItem = width(shrinkWrap);
  let guard = 0;
  while (width(shrinkWrap) < oneItem * 4 && guard < 50) {
    shrinkWrap.appendChild(item.cloneNode(true));
    guard++;
  }
  testing.expectTrue(guard < 50);

  // An explicit inline size still wins over the content sum.
  const pinned = document.createElement('div');
  pinned.style.width = '40px';
  pinned.appendChild(document.createElement('span'));
  pinned.appendChild(document.createElement('span'));
  document.body.appendChild(pinned);
  testing.expectEqual('40px', getComputedStyle(pinned).width);
}
</script>

<script id="scrollHeightFromContent">
{
  // An empty element has no content to overflow its box.
  const empty = document.createElement('div');
  document.body.appendChild(empty);
  testing.expectEqual(empty.clientHeight, empty.scrollHeight);

  // Children stack, so each one that has a height of its own increases
  // scrollHeight. An EMPTY child does not, and this assertion used to say it
  // did -- which was only true while every empty element was 5px tall.
  // Measured on Chrome 151 with tools/fingerprint/scratch/expr-scroll-stack.js:
  // a box with one empty child and a box with two are both 0 of clientHeight
  // and 0 of scrollHeight, and a stack of 7px children is 7 then 14.
  const box = document.createElement('div');
  document.body.appendChild(box);
  box.appendChild(document.createElement('div'));
  testing.expectEqual(0, box.scrollHeight);
  box.appendChild(document.createElement('div'));
  testing.expectEqual(0, box.scrollHeight);
  testing.expectEqual(0, box.clientHeight);

  const stack = document.createElement('div');
  document.body.appendChild(stack);
  const sized = () => {
    const d = document.createElement('div');
    d.style.height = '7px';
    return d;
  };
  stack.appendChild(sized());
  testing.expectEqual(7, stack.scrollHeight);
  stack.appendChild(sized());
  testing.expectEqual(14, stack.scrollHeight);
  // An unsized box shrink-wraps: clientHeight tracks the same content sum.
  testing.expectEqual(stack.scrollHeight, stack.clientHeight);

  // Text contributes no height, as it contributes no width: a text child's
  // line box is what the element's own size already stands in for.
  const short = document.createElement('div');
  const long = document.createElement('div');
  short.textContent = 'ab';
  long.textContent = 'abcdefghijklmnop';
  document.body.appendChild(short);
  document.body.appendChild(long);
  testing.expectEqual(short.clientHeight, short.scrollHeight);
  testing.expectEqual(long.clientHeight, long.scrollHeight);
  testing.expectEqual(short.scrollHeight, long.scrollHeight);

  // A display:none child takes up no space.
  const withHidden = document.createElement('div');
  const hiddenChild = document.createElement('div');
  hiddenChild.style.display = 'none';
  withHidden.appendChild(hiddenChild);
  document.body.appendChild(withHidden);
  testing.expectEqual(withHidden.clientHeight, withHidden.scrollHeight);

  // A hidden element reports 0, matching clientHeight/offsetHeight.
  const hidden = document.createElement('div');
  hidden.style.display = 'none';
  hidden.appendChild(document.createElement('div'));
  document.body.appendChild(hidden);
  testing.expectEqual(0, hidden.scrollHeight);

  // The collapse/expand idiom: scrollHeight is read while the panel is
  // collapsed at height:0 to know how far to open it. A zero-height box is
  // not hidden; its content is still measured.
  // The children have to hold something: two EMPTY children sum to 0, which
  // this used to assert was more than 0 on the strength of the 5px placeholder.
  // Measured on Chrome 151 with
  // tools/fingerprint/scratch/expr-collapsed-panel.js: a collapsed panel holding
  // two empty divs is 0 of scrollHeight, two lines of text 37, and two 9px
  // children 18. Two lines are 37 and not 36 because a line is 18.5 at the
  // device pixel ratio this engine claims, re-measured with
  // scratch/expr-fractional-line-consumers.js.
  const panel = document.createElement('div');
  panel.style.height = '0';
  panel.innerHTML = '<div>a</div><div>b</div>';
  document.body.appendChild(panel);
  testing.expectEqual(0, panel.clientHeight);
  testing.expectEqual(37, panel.scrollHeight);

  const emptyPanel = document.createElement('div');
  emptyPanel.style.height = '0';
  emptyPanel.innerHTML = '<div></div><div></div>';
  document.body.appendChild(emptyPanel);
  testing.expectEqual(0, emptyPanel.scrollHeight);

  // The root containers keep their synthetic size rather than summing
  // children. The root element's clientHeight is the viewport (CSSOM View):
  // jstracker tiles clientWidth/10 cells over clientHeight and calls
  // elementFromPoint per cell, which the 100M px box turned into ~5M walks.
  testing.expectEqual(document.body.clientHeight, document.body.scrollHeight);
  testing.expectEqual(window.innerHeight, document.documentElement.clientHeight);
  testing.expectEqual(
    document.documentElement.offsetHeight,
    document.documentElement.scrollHeight,
  );
  // No `scrollHeight > clientHeight` here: that is a claim about this page's
  // content, not about the API. Chrome's root scrollHeight is
  // max(content, clientHeight), and the boxes this fixture builds are mostly
  // empty, so the document does not outgrow the viewport.
}
</script>

<script id="scrollHeightMarqueeLoop">
{
  // The vertical counterpart of scrollWidthMarqueeLoop: a ticker that grows
  // its lane until it is twice the height of its container.
  const track = document.createElement('div');
  const lane = document.createElement('div');
  lane.innerHTML = '<div>item</div>';
  track.appendChild(lane);
  document.body.appendChild(track);

  // Doubling the markup doubles the measured content height -- but scrollHeight
  // is an integer and a line is 18.5, so the doubled box is 37 where twice the
  // rounded single line is 38. Chrome answers 19 and 37 to the same pair
  // (scratch/expr-fractional-line-consumers.js), so `before * 2` is the wrong
  // assertion to make: the two lines are asserted directly instead.
  const before = lane.scrollHeight;
  testing.expectEqual(19, before);
  lane.innerHTML += lane.innerHTML;
  testing.expectEqual(37, lane.scrollHeight);

  // And the loop itself does NOT terminate -- in Chrome either, which is the
  // reason this is asserted the other way round now.
  //
  // `track` is an unsized block holding `lane`, so a parent that counts what
  // its child holds grows in step with it: `track.offsetHeight` IS
  // `lane.scrollHeight` at every iteration and the target is always twice it.
  // Measured verbatim on Chrome 151 with
  // scratch/b72/expr-scrollheight-marquee.js -- twelve doublings, the two
  // numbers equal at every one of them (19/37, 74, 148, 296, ... 151552), and
  // `terminated=false`.
  //
  // It used to assert `guard < 50`, and it passed only because a parent here
  // does NOT count its child's content (`content-height-child-box`): the lane
  // grew, the track did not, and the metric eventually cleared a target that
  // was standing still. So this assertion pinned the defect, and any change
  // that fixes the defect turns the loop into a 2^50-node builder and hangs the
  // whole binary on a 30-second watchdog -- which is what
  // `content-height-memoised-subtree` read as "the suite is worse: 373
  // ExecutionTerminated". One stall, not 373 failures.
  //
  // Its width-axis sibling `clientWidthMarqueeLoop` below already carries this
  // same finding for its own axis, measured the same way. This is the half that
  // was missed.
  //
  // The guard is 4 rather than 50 because doubling the markup 50 times is 2^50
  // nodes: a non-terminating loop has to be affordable to assert. Four
  // doublings is 16 nodes and settles it -- the condition is structurally
  // always true, `track.offsetHeight` BEING `lane.scrollHeight` at every step --
  // and the probe above ran twelve of them against Chrome for the longer look.
  // At twelve here the test's own 4096 nodes cost `WebApi: Element` three
  // seconds; at four it costs 0.2, which is the engine's actual share.
  let guard = 0;
  while (lane.scrollHeight < track.offsetHeight * 2 && guard < 4) {
    lane.innerHTML += lane.innerHTML;
    guard++;
  }
  testing.expectEqual(4, guard);
}
</script>

<script id="scrollMethods">
{
  const test3 = $('#test2');
  test3.scrollTop = 0;
  test3.scrollLeft = 0;

  // scroll()/scrollTo() with (x, y) positional args
  test3.scrollTo(30, 40);
  testing.expectEqual(30, test3.scrollLeft);
  testing.expectEqual(40, test3.scrollTop);

  test3.scroll(5, 6);
  testing.expectEqual(5, test3.scrollLeft);
  testing.expectEqual(6, test3.scrollTop);

  // scrollTo() with an options dictionary; omitted axes are left unchanged
  test3.scrollTo({left: 11, top: 22});
  testing.expectEqual(11, test3.scrollLeft);
  testing.expectEqual(22, test3.scrollTop);

  test3.scrollTo({top: 99});
  testing.expectEqual(11, test3.scrollLeft); // unchanged
  testing.expectEqual(99, test3.scrollTop);

  // Negative values clamp to 0
  test3.scrollTo(-10, -10);
  testing.expectEqual(0, test3.scrollLeft);
  testing.expectEqual(0, test3.scrollTop);

  // scrollBy() is relative to the current position
  test3.scrollTo(10, 10);
  test3.scrollBy(5, 7);
  testing.expectEqual(15, test3.scrollLeft);
  testing.expectEqual(17, test3.scrollTop);

  test3.scrollBy({left: -3, top: -2});
  testing.expectEqual(12, test3.scrollLeft);
  testing.expectEqual(15, test3.scrollTop);

  // scrollBy() clamps to 0 and never goes negative
  test3.scrollBy(-1000, -1000);
  testing.expectEqual(0, test3.scrollLeft);
  testing.expectEqual(0, test3.scrollTop);
}
</script>

<script id="offsetVsBounding">
{
  const test1 = $('#test1');

  // offsetTop/Left should match getBoundingClientRect
  const rect = test1.getBoundingClientRect();
  testing.expectEqual(rect.y, test1.offsetTop);
  testing.expectEqual(rect.x, test1.offsetLeft);
  testing.expectEqual(rect.width, test1.offsetWidth);
  // ...and offsetHeight is the ROUNDED rect height, which for one line of text
  // is 19 against 18.5. They were the same number only while a line box was a
  // whole pixel; Chrome answers 18.5 and 19 to this same pair
  // (scratch/expr-fractional-line-consumers.js).
  testing.expectEqual(18.5, rect.height);

<script id="offsetParent">
{
  const test1 = $('#test1');

  // Default offset ancestor is the body.
  testing.expectEqual(document.body, test1.offsetParent);

  // The root and body elements have no offsetParent.
  testing.expectEqual(null, document.documentElement.offsetParent);
  testing.expectEqual(null, document.body.offsetParent);

  // A positioned ancestor wins over the body.
  const wrap = document.createElement('div');
  wrap.style.position = 'relative';
  const inner = document.createElement('span');
  wrap.appendChild(inner);
  document.body.appendChild(wrap);
  testing.expectEqual(wrap, inner.offsetParent);

  // A position:fixed element has no offsetParent.
  inner.style.position = 'fixed';
  testing.expectEqual(null, inner.offsetParent);
  inner.style.position = '';

  // Static elements offset from table machinery: content → cell, cell → table.
  const table = document.createElement('table');
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  const cellContent = document.createElement('span');
  td.appendChild(cellContent);
  tr.appendChild(td);
  table.appendChild(tr);
  document.body.appendChild(table);
  testing.expectEqual(td, cellContent.offsetParent);
  testing.expectEqual(table, td.offsetParent);

  // ...but a positioned element ignores the td/th/table rule.
  cellContent.style.position = 'absolute';
  testing.expectEqual(document.body, cellContent.offsetParent);

  // display:none (own or inherited) → null.
  const hidden = document.createElement('div');
  hidden.style.display = 'none';
  const hiddenChild = document.createElement('span');
  hidden.appendChild(hiddenChild);
  document.body.appendChild(hidden);
  testing.expectEqual(null, hidden.offsetParent);
  testing.expectEqual(null, hiddenChild.offsetParent);

  // Detached elements → null.
  testing.expectEqual(null, document.createElement('div').offsetParent);

  // Shadow-tree elements hop the boundary to the host's offset ancestor.
  const host = document.createElement('div');
  document.body.appendChild(host);
  const shadow = host.attachShadow({mode: 'open'});
  const shadowChild = document.createElement('div');
  shadow.appendChild(shadowChild);
  testing.expectEqual(document.body, shadowChild.offsetParent);

  // A positioned host is itself the offsetParent.
  host.style.position = 'relative';
  testing.expectEqual(host, shadowChild.offsetParent);
}
</script>

<script id="scrollIntoView">
{
  // Add an element deep in the document so its position is non-zero.
  const deep = document.createElement('div');
  deep.id = 'deep';
  document.body.appendChild(deep);

  const targetY = deep.getBoundingClientRect().y;
  testing.expectTrue(targetY > 0);

  // scrollIntoView() always brings the element's top to the scroll offset.
  window.scrollTo(0, 999999);
  deep.scrollIntoView();
  testing.expectEqual(targetY, window.scrollY);

  // scrollIntoViewIfNeeded() is a no-op when the element is already within the
  // viewport band [scrollY, scrollY + innerHeight]. Sit just below the
  // element's top so a stray scroll would visibly move scrollY.
  const inView = Math.max(0, targetY - 1);
  window.scrollTo(0, inView);
  deep.scrollIntoViewIfNeeded();
  testing.expectEqual(inView, window.scrollY);

  // ...but it does scroll when the element is outside the band.
  window.scrollTo(0, targetY + window.innerHeight + 100);
  deep.scrollIntoViewIfNeeded();
  testing.expectEqual(targetY, window.scrollY);
}
</script>
