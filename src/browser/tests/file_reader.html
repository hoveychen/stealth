<!DOCTYPE html>
<meta charset="UTF-8">
<script src="./testing.js"></script>

<script id=basic>
  {
    const reader = new FileReader();
    testing.expectEqual(0, reader.readyState);
    testing.expectEqual(null, reader.result);
    testing.expectEqual(null, reader.error);
  }

  // Constants
  testing.expectEqual(0, FileReader.EMPTY);
  testing.expectEqual(1, FileReader.LOADING);
  testing.expectEqual(2, FileReader.DONE);
</script>

<script id=readAsText type=module>
  const state = await testing.async();
  const reader = new FileReader();
  const blob = new Blob(["Hello, World!"], { type: "text/plain" });

  let loadstartFired = false;
  let progressFired = false;
  let loadFired = false;
  let loadendFired = false;

  let loadstartType = null;
  let loadstartReadyState = null;
  let progressLoaded = null;
  let progressTotal = null;
  let loadReadyState = null;
  let loadResult = null;

  reader.onloadstart = function(e) {
    loadstartFired = true;
    loadstartType = e.type;
    loadstartReadyState = reader.readyState;
  };

  reader.onprogress = function(e) {
    progressFired = true;
    progressLoaded = e.loaded;
    progressTotal = e.total;
  };

  reader.onload = function(e) {
    loadFired = true;
    loadReadyState = reader.readyState;
    loadResult = reader.result;
  };

  reader.onloadend = function(e) {
    loadendFired = true;
    state.resolve();
  };

  reader.readAsText(blob);

  await state.done(() => {
    testing.expectEqual(true, loadstartFired);
    testing.expectEqual("loadstart", loadstartType);
    testing.expectEqual(1, loadstartReadyState);

    testing.expectEqual(true, progressFired);
    testing.expectEqual(13, progressLoaded);
    testing.expectEqual(13, progressTotal);

    testing.expectEqual(true, loadFired);
    testing.expectEqual(2, loadReadyState);
    testing.expectEqual("Hello, World!", loadResult);

    testing.expectEqual(true, loadendFired);
  });
</script>

<script id=readAsDataURL type=module>
  const state = await testing.async();

  const reader1 = new FileReader();
  const blob1 = new Blob(["test"], { type: "text/plain" });
  const result1 = await new Promise((resolve) => {
    reader1.onload = function() { resolve(reader1.result); };
    reader1.readAsDataURL(blob1);
  });

  // Empty MIME type
  const reader2 = new FileReader();
  const blob2 = new Blob(["test"]);
  const result2 = await new Promise((resolve) => {
    reader2.onload = function() { resolve(reader2.result); };
    reader2.readAsDataURL(blob2);
  });

  state.resolve();
  await state.done(() => {
    testing.expectEqual("data:text/plain;base64,dGVzdA==", result1);
    testing.expectEqual("data:application/octet-stream;base64,dGVzdA==", result2);
  });
</script>

<script id=readAsArrayBuffer type=module>
  const state = await testing.async();
  const reader = new FileReader();
  const blob = new Blob([new Uint8Array([65, 66, 67])]);
  const result = await new Promise((resolve) => {
    reader.onload = function() { resolve(reader.result); };
    reader.readAsArrayBuffer(blob);
  });
  const view = new Uint8Array(result);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, result instanceof ArrayBuffer);
    testing.expectEqual(3, result.byteLength);
    testing.expectEqual(65, view[0]);
    testing.expectEqual(66, view[1]);
    testing.expectEqual(67, view[2]);
  });
</script>

<script id=listenerRegisteredAfterRead type=module>
  // The read answers on a task, not before the call returns. Real pages count
  // on it: browserscan.net's canvas check calls readAsDataURL(blob) and then
  // registers its load listener on the *next* line, inside a promise that only
  // that listener resolves. Reading synchronously fires load before the
  // listener exists, and the page waits on that promise forever.
  const state = await testing.async();
  const reader = new FileReader();
  const blob = new Blob(["test"], { type: "text/plain" });

  reader.readAsDataURL(blob);
  const readyStateAfterCall = reader.readyState;
  const resultAfterCall = reader.result;

  // Raced against a timer so a synchronous implementation fails an assertion
  // here rather than hanging the runner on a promise nothing will resolve.
  const result = await Promise.race([
    new Promise((resolve) => reader.addEventListener("load", () => resolve(reader.result))),
    new Promise((resolve) => setTimeout(() => resolve("(load never reached a listener registered after the call)"), 100)),
  ]);

  state.resolve();
  await state.done(() => {
    testing.expectEqual(1, readyStateAfterCall);
    testing.expectEqual(null, resultAfterCall);
    testing.expectEqual("data:text/plain;base64,dGVzdA==", result);
  });
</script>

<script id=abort>
  // Test aborting when not loading (should do nothing)
  {
    const reader = new FileReader();
    reader.abort(); // Should not throw
    testing.expectEqual(0, reader.readyState);
  }
</script>

<script id=abortDuringRead type=module>
  // The read is a task, so abort() can land before it runs -- and then the
  // read must deliver nothing at all.
  const state = await testing.async();
  const reader = new FileReader();
  const blob = new Blob(["test"]);

  let loadFired = false;
  let abortFired = false;
  reader.addEventListener("load", () => { loadFired = true; });
  reader.addEventListener("abort", () => { abortFired = true; });

  reader.readAsText(blob);
  reader.abort();
  const readyStateAfterAbort = reader.readyState;

  await new Promise((resolve) => setTimeout(resolve, 100));

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, abortFired);
    testing.expectEqual(false, loadFired);
    testing.expectEqual(2, readyStateAfterAbort);
    testing.expectEqual(null, reader.result);
  });
</script>

<script id=multipleReads type=module>
  const state = await testing.async();
  const reader = new FileReader();
  const blob1 = new Blob(["first"]);
  const blob2 = new Blob(["second"]);

  // First read
  const result1 = await new Promise((resolve) => {
    reader.onload = function() { resolve(reader.result); };
    reader.readAsText(blob1);
  });

  // Second read - should work after first completes
  const result2 = await new Promise((resolve) => {
    reader.onload = function() { resolve(reader.result); };
    reader.readAsText(blob2);
  });

  state.resolve();
  await state.done(() => {
    testing.expectEqual("first", result1);
    testing.expectEqual("second", result2);
  });
</script>

<script id=addEventListener type=module>
  const state = await testing.async();
  const reader = new FileReader();
  const blob = new Blob(["test"]);

  let loadFired = false;
  await new Promise((resolve) => {
    reader.addEventListener("load", function() {
      loadFired = true;
      resolve();
    });
    reader.readAsText(blob);
  });

  state.resolve();
  await state.done(() => {
    testing.expectEqual(true, loadFired);
  });
</script>
