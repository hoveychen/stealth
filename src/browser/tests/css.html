<!DOCTYPE html>
<script src="testing.js"></script>

<script id="exists">
  testing.expectEqual('object', typeof CSS);
  testing.expectEqual('function', typeof CSS.escape);
  testing.expectEqual('function', typeof CSS.supports);
</script>

<script id="window_property">
  // How `CSS` is hung off the window. It is a WebIDL *namespace* object, and
  // WebIDL §3.2 hangs one as a plain data property that does not enumerate —
  // measured on Chrome 151 with
  // tools/fingerprint/scratch/expr-chrome-css-descriptor.js:
  // {writable: true, enumerable: false, configurable: true}, own, with nothing
  // named CSS on Window.prototype.
  //
  // An accessor is one expression away from being read, and the enumerable bit
  // is another: `for (const k in window)` lists it here and does not in a real
  // browser.
  const d = Object.getOwnPropertyDescriptor(window, 'CSS');
  testing.expectEqual('object', typeof d.value);
  testing.expectEqual(undefined, d.get);
  testing.expectEqual(undefined, d.set);
  testing.expectEqual(true, d.writable);
  testing.expectEqual(false, d.enumerable);
  testing.expectEqual(true, d.configurable);
  testing.expectEqual(undefined, Object.getOwnPropertyDescriptor(Window.prototype, 'CSS'));
  // Same object on every read, which the accessor already got right.
  testing.expectEqual(true, window.CSS === window.CSS);
</script>

<script id="entries">
  const entries = Object.entries(CSS);
  testing.expectEqual(true, entries.length >= 2);
</script>

<script id="escape_basic">
  {
    testing.expectEqual('hello', CSS.escape('hello'));
    testing.expectEqual('world123', CSS.escape('world123'));
    testing.expectEqual('foo-bar', CSS.escape('foo-bar'));
    testing.expectEqual('_test', CSS.escape('_test'));
  }
</script>

<script id="escape_first_character">
  {
    testing.expectEqual('\\30 abc', CSS.escape('0abc'));
    testing.expectEqual('\\31 23', CSS.escape('123'));
    testing.expectEqual('\\-', CSS.escape('-'));
    testing.expectEqual('-test', CSS.escape('-test'));
    testing.expectEqual('--test', CSS.escape('--test'));
    testing.expectEqual('-\\33 ', CSS.escape('-3'));
  }
</script>

<script id="escape_special_characters">
  {
    testing.expectEqual('hello\\ world', CSS.escape('hello world'));
    testing.expectEqual('test\\!', CSS.escape('test!'));
    testing.expectEqual('foo\\#bar', CSS.escape('foo#bar'));
    testing.expectEqual('a\\(b\\)', CSS.escape('a(b)'));
    testing.expectEqual('test\\@example', CSS.escape('test@example'));
    testing.expectEqual('a\\[b\\]', CSS.escape('a[b]'));
    testing.expectEqual('a\\{b\\}', CSS.escape('a{b}'));
    testing.expectEqual('test\\:value', CSS.escape('test:value'));
    testing.expectEqual('a\\.b', CSS.escape('a.b'));
    testing.expectEqual('a\\,b', CSS.escape('a,b'));
  }
</script>

<script id="escape_quotes">
  {
    testing.expectEqual('test\\"value', CSS.escape('test"value'));
    testing.expectEqual('test\\\'value', CSS.escape("test'value"));
  }
</script>

<script id="supports_basic">
  {
    testing.expectEqual(true, CSS.supports('display', 'block'));
    testing.expectEqual(true, CSS.supports('position', 'relative'));
    testing.expectEqual(true, CSS.supports('width', '100px'));
    testing.expectEqual(true, CSS.supports('color', 'red'));
  }
</script>

<script id="supports_common_properties">
  {
    testing.expectEqual(true, CSS.supports('margin', '10px'));
    testing.expectEqual(true, CSS.supports('padding', '5px'));
    testing.expectEqual(true, CSS.supports('border', '1px solid black'));
    testing.expectEqual(true, CSS.supports('background-color', 'blue'));
    testing.expectEqual(true, CSS.supports('font-size', '16px'));
    testing.expectEqual(true, CSS.supports('opacity', '0.5'));
    testing.expectEqual(true, CSS.supports('z-index', '10'));
  }
</script>

<script id="escape_null_character">
  {
    testing.expectEqual('\uFFFD', CSS.escape('\x00'));
    testing.expectEqual('test\uFFFDvalue', CSS.escape('test\x00value'));
    testing.expectEqual('\uFFFDabc', CSS.escape('\x00abc'));
  }
</script>

<script id="static_no_this_binding">
  // react-jss extracts CSS.escape and calls it with no `this`. Per spec these
  // are static namespace methods, so the call must not throw Illegal invocation.
  {
    const escape = CSS.escape;
    testing.expectEqual('foo\\#bar', escape('foo#bar'));
    testing.expectEqual('foo\\#bar', escape.call(null, 'foo#bar'));
    testing.expectEqual('foo\\#bar', escape.call(undefined, 'foo#bar'));
    testing.expectEqual('foo\\#bar', escape.call({}, 'foo#bar'));

    const supports = CSS.supports;
    testing.expectEqual(true, supports('display', 'block'));
  }
</script>
