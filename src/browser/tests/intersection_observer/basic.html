<!DOCTYPE html>
<script src="../testing.js"></script>
<div id="target" style="width: 100px; height: 100px;">Target Element</div>

<script id="basic">
    const target = document.getElementById('target');
    let callbackCalled = false;
    let entries = null;

    const observer = new IntersectionObserver((observerEntries, obs) => {
        callbackCalled = true;
        entries = observerEntries;
    });

    observer.observe(target);

    testing.onload(() => {
        testing.expectEqual(true, callbackCalled);
        testing.expectEqual(1, entries.length);

        const entry = entries[0];

        testing.expectEqual(target, entry.target);
        testing.expectEqual('boolean', typeof entry.isIntersecting);
        testing.expectEqual('number', typeof entry.intersectionRatio);
        testing.expectEqual('object', typeof entry.boundingClientRect);
        testing.expectEqual('object', typeof entry.intersectionRect);
        testing.expectEqual('number', typeof entry.time);
        testing.expectEqual(true, entry.time > 0);

        observer.disconnect();
    });
</script>

<script id=detached>
  {
    // never attached
    let count = 0;
    const div = document.createElement('div');
    new IntersectionObserver((entries) => {
      count += 1;
    }).observe(div);

    testing.onload(() => {
      testing.expectEqual(0, count);
    });
  }

  {
    // not connected, but has parent
    let count = 0;
    const div1 = document.createElement('div');
    const div2 = document.createElement('div');
    new IntersectionObserver((entries) => {
      count += 1;
    }).observe(div1);

    div2.appendChild(div1);
    testing.onload(() => {
      testing.expectEqual(1, count);
    });
  }
</script>

<script id=intersectionObserver_callback_brand>
  // Same sentence every observer constructor writes for a non-callable
  // callback (measured on Chrome 151).
  let err = null;
  try { new IntersectionObserver(1); } catch (e) { err = `${e.name}: ${e.message}`; }
  testing.expectEqual(
    "TypeError: Failed to construct 'IntersectionObserver': parameter 1 is not of type 'Function'.",
    err,
  );
</script>

<script id=intersectionObserver_dictionary_refusal>
  // The second argument names its dictionary, and unlike the callback brand
  // sentence above it carries no parameter position (measured on Chrome 151).
  {
    let err = null;
    try { new IntersectionObserver(() => {}, 1); } catch (e) { err = `${e.name}: ${e.message}`; }
    testing.expectEqual(
      "TypeError: Failed to construct 'IntersectionObserver': The provided value is not of type 'IntersectionObserverInit'.",
      err,
    );
  }
</script>

<!-- The six attributes, against a headed Chrome 151
     (tools/fingerprint/probes/expr-misc-family-semantics.js). -->
<script id="observer_attributes">
{
  const bare = new IntersectionObserver(() => {});
  testing.expectEqual(null, bare.root);
  // A margin reads back in its four-sided form, whatever was passed in.
  testing.expectEqual('0px 0px 0px 0px', bare.rootMargin);
  testing.expectEqual('0px 0px 0px 0px', bare.scrollMargin);
  testing.expectEqual('0', bare.thresholds.join(','));
  testing.expectEqual(0, bare.delay);
  testing.expectEqual(false, bare.trackVisibility);

  const configured = new IntersectionObserver(() => {}, {
    root: document.body,
    rootMargin: '10px 20px',
    scrollMargin: '5px',
    threshold: [0.25, 0.75],
    delay: 100,
    trackVisibility: true,
  });
  testing.expectEqual(document.body, configured.root);
  testing.expectEqual('10px 20px 10px 20px', configured.rootMargin);
  testing.expectEqual('5px 5px 5px 5px', configured.scrollMargin);
  testing.expectEqual('0.25,0.75', configured.thresholds.join(','));
  testing.expectEqual(100, configured.delay);
  testing.expectEqual(true, configured.trackVisibility);

  testing.expectEqual('1px 2px 3px 2px', new IntersectionObserver(() => {}, { rootMargin: '1px 2px 3px' }).rootMargin);
  // A document root means the viewport, which reads back as null.
  testing.expectEqual(null, new IntersectionObserver(() => {}, { root: document }).root);
}
</script>
