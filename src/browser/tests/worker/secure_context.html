<!DOCTYPE html>
<script src="../testing.js"></script>

<!--
A worker's secure-context state is its owner's, not a constant. Measured on a
headed Chrome 151 with the same page served twice: from http://localhost:8777
the worker answers true, from http://192.168.68.78:8777 it answers false, and
the worker global surface follows (336 own names vs 243). This test page is on
127.0.0.1, which is loopback, so the owner here is secure.
-->

<script id=inherits_owner type=module>
  {
    const state = await testing.async();
    const worker = new Worker('./secure-context-worker.js');
    worker.onmessage = (e) => state.resolve(e.data);
    setTimeout(() => worker.postMessage(0), 100);

    await state.done((data) => {
      testing.expectEqual(true, window.isSecureContext);
      testing.expectEqual(true, data.secure);

      // Chrome puts it on WorkerGlobalScope.prototype as an enumerable,
      // configurable getter -- so a page that reads the descriptor rather than
      // the value sees the same shape it sees in Chrome. It used to be a
      // read-only, non-configurable data property holding a constant false.
      testing.expectEqual('WorkerGlobalScope', data.holder);
      testing.expectEqual(true, data.on_prototype.is_getter);
      testing.expectEqual(false, data.on_prototype.has_setter);
      testing.expectEqual(true, data.on_prototype.enumerable);
      testing.expectEqual(true, data.on_prototype.configurable);

      // Chrome's worker global owns no copy -- `self` there answers through the
      // prototype -- and neither does this one now: [Global] is a per-interface
      // annotation, and WorkerGlobalScope is the interface a dedicated worker
      // *inherits*, not the one that carries [Global]. See
      // worker/global_member_home.html for the whole shape.
      testing.expectEqual(null, data.on_self);

      // A secure owner, so nothing is gated away. 230 after EventTarget came
      // off the flattening, 231 since ReportBody went on, 233 with Origin and
      // WebGLObject -- exactly the three names of the 47-name window-surface cut
      // that a Chrome worker carries too (measured, probe-shapes-worker) -- and
      // back to 230 once the two WebGL extensions and the ReadableStream async
      // iterator stopped being named, which are the three of that group of five
      // reachable from a worker (WebGLRenderingContext.zig and ReadableStream.zig
      // are both in worker_common_apis; the SVG and cross-origin-window ones are
      // window-only). Then 23 fewer, once WorkerGlobalScope's 24 members
      // stopped being mirrored onto the global they do not belong to -- Chrome's
      // worker owns none of them either. `console` is the one that stays: it is
      // an own data property of every global, put there per context by Env.zig,
      // the way Chrome has it. The remaining gap to Chrome's 243 is interface
      // objects this engine does not have, not member copies.
      // Then five more, once the File System Access handles went on: OPFS is
      // only usable from a worker, so Chrome's worker carries all five and this
      // one now does too (worker/opfs.html).
      //
      // 211 since the realm stopped borrowing the window's surface
      // (worker/realm_surface.html): out went Navigator, CookieStore,
      // CookieChangeEvent and the own copy of cookieStore -- none of which a
      // Chrome worker has -- and in came WorkerNavigator plus the three members
      // of the global that were missing, `name`, `origin` and
      // `crossOriginIsolated`.
      //
      // 207 once the last four window-only interface objects stopped riding in
      // on a type list: PerformanceTiming, PerformanceNavigation,
      // WebKitCSSMatrix and webkitURL (worker/realm_surface.html).
      //
      // 264 with the 57 interface objects this engine already had for the page
      // realm and a Chrome worker carries too: WebCodecs, ImageBitmap, the
      // scheduler, the cache storage, NetworkInformation, resource and server
      // timing, the USB/HID/Serial families, the service-worker client surface,
      // and the locks, media capabilities and user activation
      // (worker/realm_surface.html). 46 of the 57 are [SecureContext], which is
      // why the insecure-owner count in frames/secure_context_gate.html falls
      // further behind this one than it used to.
      //
      // 269 with the five Trusted Types interfaces, which stopped needing the
      // owner's Frame once the factory started taking an Execution
      // (worker/realm_surface.html). `trustedTypes` itself is a
      // WorkerGlobalScope.prototype member, so it is not one of these five.
      //
      // 309 with the 40 WebGPU interface objects, which travelled the same way
      // Trusted Types did: `GPU.wgslLanguageFeatures` wanted a Frame for its
      // object factory alone, and an Execution has one (worker/realm_surface
      // .html). All 40 are [SecureContext], so an insecure owner sees none of
      // them and frames/secure_context_gate.html holds at its old count.
      //
      // 313 with the four MSE interface objects, which travelled the same way
      // again. None of the four is [SecureContext], so the insecure count moves
      // with this one for these.
      //
      // 315 with StorageBucket and StorageBucketManager, whose one Frame reach
      // was `StorageBucket.indexedDB` looking past the global union. Both are
      // [SecureContext].
      //
      // 317 with FontFace and FontFaceSet, neither [SecureContext]. What they
      // wanted the Frame for was an arena, the factory, and a listener list to
      // dispatch `loading`/`loadingdone` into -- and the listener list a set
      // exposed in two realms needs is the asking realm's.
      //
      // 319 with the two sandboxed-filesystem operations, which are own members
      // of the global rather than interface objects -- `forKind` kept its two
      // filesystems on `exec.js.global.frame.window`, and a realm's
      // filesystems have to be the realm's. Neither is [SecureContext].
      //
      // 320 with `__moduleCache`, which is not a member of anything: it is the
      // text Cloudflare's collector walks, installed per realm and therefore
      // here too (collector_pad.html). Every step above moved this surface
      // towards Chrome's; this one moves it away, and knowingly.
      testing.expectEqual(13, data.gated.length);
      testing.expectEqual(6, data.ungated.length);
      testing.expectEqual(320, data.count);
    });
  }
</script>
