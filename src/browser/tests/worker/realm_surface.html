<!DOCTYPE html>
<script src="../testing.js"></script>

<!--
The realm a Cloudflare challenge asks its questions in is a blob worker, not the
page. Everything asserted here was read off a headless Chrome 151 blob worker on
a loopback http origin (tools/fingerprint/probes/expr-worker-surface.js, readings
in results/probes/expr-worker-surface.chrome.json).
-->

<script id=worker_realm_surface type=module>
  {
    const state = await testing.async();
    const worker = new Worker('./realm-surface-worker.js');
    worker.onmessage = (e) => state.resolve(e.data);
    // No delay: a dedicated worker buffers messages posted before its script
    // has finished evaluating, and this block has to report before the two
    // below finish or its failures never get printed.
    worker.postMessage(0);

    await state.done((data) => {
      // A worker's navigator is a WorkerNavigator. Chrome has no `Navigator`
      // interface object in this realm at all.
      testing.expectEqual('[object WorkerNavigator]', data.navigator_brand);
      testing.expectEqual('WorkerNavigator', data.navigator_ctor_name);
      testing.expectEqual(true, data.navigator_proto_is_wn);
      testing.expectEqual('function', data.typeof_WorkerNavigator);
      testing.expectEqual('undefined', data.typeof_Navigator);

      // None of these exist on a Chrome WorkerNavigator. `webdriver` least of
      // all: it is absent, not false.
      testing.expectEqual('', data.window_only_in_navigator);

      // Chrome's WorkerNavigator.prototype, whole. The six that used to be
      // missing here -- connection, hid, mediaCapabilities, serial, usb, locks
      // -- wanted a Frame only for the object factory, which every Execution
      // carries, same as `gpu` and `storageBuckets` before them.
      testing.expectEqual(
        'appCodeName,appName,appVersion,connection,constructor,deviceMemory,gpu,' +
        'hardwareConcurrency,hid,language,languages,locks,mediaCapabilities,onLine,' +
        'permissions,platform,product,serial,storage,storageBuckets,usb,userAgent,' +
        'userAgentData',
        data.wn_proto_own);

      // And in Chrome's own declaration order, which is not alphabetical.
      // `constructor` is filtered out on both sides: Chrome puts it between
      // `connection` and `hid`, this engine's bridge puts it after the declared
      // members, and that is a property of every interface here rather than of
      // this one.
      testing.expectEqual(
        'hardwareConcurrency,appCodeName,appName,appVersion,platform,product,userAgent,' +
        'language,languages,onLine,connection,hid,mediaCapabilities,permissions,' +
        'serial,usb,deviceMemory,userAgentData,locks,storage,gpu,storageBuckets',
        data.wn_proto_order);

      // Each answers with the same interface it does in a Window realm.
      testing.expectEqual(
        'connection=[object NetworkInformation] hid=[object HID] ' +
        'mediaCapabilities=[object MediaCapabilities] serial=[object Serial] ' +
        'usb=[object USB] locks=[object LockManager]',
        data.wn_services);
      // The same four values the Window realm reports: one network, one reading.
      testing.expectEqual('4g/100/1.45/false', data.wn_connection);
      testing.expectEqual(true, data.wn_connection_stable);
      testing.expectEqual(true, data.wn_connection_is_event_target);

      // An unnamed worker's name is the empty string, and it is own on the
      // global because `name` is DedicatedWorkerGlobalScope's own member.
      testing.expectEqual('', data.self_name);
      testing.expectEqual('self', data.holder_name);

      // origin and crossOriginIsolated are WorkerGlobalScope's, so they answer
      // from its prototype. Chrome holds origin as a [Replaceable] accessor:
      // enumerable, configurable, with both halves.
      testing.expectEqual('accessor/get/set e c', data.kind_origin);
      testing.expectEqual('WorkerGlobalScope.prototype', data.holder_origin);
      testing.expectEqual('http://127.0.0.1:9582', data.origin);
      testing.expectEqual('WorkerGlobalScope.prototype', data.holder_crossOriginIsolated);
      testing.expectEqual('boolean', data.typeof_crossOriginIsolated);

      // The cookie store is Window and ServiceWorker; a dedicated worker has
      // neither the interface objects nor the member.
      testing.expectEqual('undefined', data.typeof_CookieStore);
      testing.expectEqual('undefined', data.typeof_CookieChangeEvent);
      testing.expectEqual(false, data.has_cookieStore);

      // Neither legacy navigation-timing interface is exposed in a worker, and
      // Chrome's worker realm carries no vendor-prefixed constructor alias at
      // all: all 14 of the webkit-prefixed names its Window has are absent
      // there, and the four webkit* names its worker does carry are
      // WorkerGlobalScope operations rather than interface objects.
      testing.expectEqual('', data.window_only_interfaces);

      // And the other direction: the interface objects this engine already had
      // for the page realm and a Chrome worker carries too.
      testing.expectEqual('', data.missing_families);

      // Still missing, and not by an oversight in a list: see the comment on
      // getGlobalArg in js/Caller.zig.
      testing.expectEqual('', data.frame_bound);

      // WebGPU. All 40 interface objects, and a live round trip through the
      // realm's own factory: `navigator.gpu` and the set behind
      // wgslLanguageFeatures are created here, by this context's Execution.
      testing.expectEqual('', data.gpu_family);
      testing.expectEqual('object,object,object,object,object', data.gpu_namespaces);
      testing.expectEqual('', data.gpu_interfaces);
      testing.expectEqual('[object GPU]', data.nav_gpu_brand);
      testing.expectEqual('bgra8unorm', data.gpu_canvas_format);
      testing.expectEqual('[object WGSLLanguageFeatures]', data.wgsl_brand);
      testing.expectEqual(true, data.wgsl_identity);
      testing.expectEqual(true, data.wgsl_has_f16);

      // MSE-in-Worker, which is the whole point of the feature: a dedicated
      // worker is where Chrome lets a MediaSource be constructed at all.
      testing.expectEqual('', data.mse_family);
      testing.expectEqual(true, data.mse_can_construct);
      testing.expectEqual('[object SourceBufferList]', data.mse_buffers_brand);
      testing.expectEqual(true, data.mse_buffers_identity);
      testing.expectEqual(0, data.mse_buffers_length);

      // Storage buckets, and the bucket's IDB factory being this realm's rather
      // than the owner window's.
      testing.expectEqual('', data.bucket_family);
      testing.expectEqual('[object StorageBucketManager]', data.bucket_manager_brand);
      testing.expectEqual('[object StorageBucket]', data.bucket_brand);
      testing.expectEqual('kssz-bucket', data.bucket_name);
      testing.expectEqual('[object IDBFactory]', data.bucket_idb_brand);
      testing.expectEqual(true, data.bucket_idb_is_realms);

      // The font families, and `self.fonts` dispatching its `loading` event
      // into this realm's own listener list.
      testing.expectEqual('', data.font_family);
      testing.expectEqual('undefined', data.typeof_FontFaceSetLoadEvent);
      testing.expectEqual('WorkerGlobalScope.prototype', data.fonts_holder);
      testing.expectEqual('[object FontFaceSet]', data.fonts_brand);
      testing.expectEqual(true, data.fonts_identity);
      testing.expectEqual('loaded', data.fonts_status);
      testing.expectEqual(0, data.fonts_size);
      testing.expectEqual('ok:loading', data.fonts_loaded);
      testing.expectEqual('Kssz', data.font_face_family);
      testing.expectEqual('normal', data.font_face_style);

      // The sandboxed filesystem. Both operations are own enumerable
      // configurable functions of the worker global, and Chrome's arity for
      // `webkitRequestFileSystem` there is 2 where the window's is 3 (measured
      // -- the error callback is optional in both, so this is Chrome's own
      // inconsistency, not ours). The name is built from this realm's origin.
      testing.expectEqual('function e c function e c', data.webkit_fs);
      testing.expectEqual('2,2', data.webkit_fs_arity);
      testing.expectEqual('http_127_0_0_1_9582:Temporary', data.webkit_fs_name);
      testing.expectEqual(true, data.webkit_fs_identity);
      testing.expectEqual('/:true', data.webkit_fs_resolved);

      // Trusted Types. Chrome holds `trustedTypes` on WorkerGlobalScope
      // .prototype, and everything the factory does in a worker it also does on
      // a page: createPolicy answers a named policy, createScript runs the
      // page's own callback and boxes the result, and emptyScript keeps its
      // identity across reads.
      testing.expectEqual('WorkerGlobalScope.prototype', data.tt_holder);
      testing.expectEqual('[object TrustedTypePolicyFactory]', data.tt_brand);
      testing.expectEqual('', data.tt_interfaces);
      testing.expectEqual('Kssz2', data.tt_policy_name);
      testing.expectEqual('x/ok', data.tt_created);
      testing.expectEqual('[object TrustedScript]', data.tt_created_brand);
      testing.expectEqual(true, data.tt_empty_identity);
      // Nothing here enforces a CSP, so no policy ever becomes the default one.
      testing.expectEqual(null, data.tt_default_policy);

      // console is an own data property of the global and is not on the
      // interface prototype behind it.
      testing.expectEqual('self', data.holder_console);
      testing.expectEqual(false, data.console_on_wgs_proto);

      // [Global] moves operations and attributes onto the global; constants
      // stay behind. Chrome's own order.
      testing.expectEqual('TEMPORARY,PERSISTENT,constructor', data.dwgs_proto_own);
    });
  }
</script>

<script id=blob_worker_location type=module>
  {
    // A blob URL has an opaque path -- the whole inner URL -- and no host of
    // its own, while its origin is the inner URL's. Measured on Chrome 151:
    // location.host/hostname/port are empty and pathname is the inner URL.
    const state = await testing.async();
    const src = `postMessage({
      href: location.href, origin: location.origin, protocol: location.protocol,
      host: location.host, hostname: location.hostname, port: location.port,
      pathname: location.pathname, search: location.search, hash: location.hash,
    })`;
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const worker = new Worker(url);
    worker.onmessage = (e) => state.resolve(e.data);

    await state.done((data) => {
      testing.expectEqual(true, data.href.startsWith('blob:http://127.0.0.1:9582/'));
      testing.expectEqual('http://127.0.0.1:9582', data.origin);
      testing.expectEqual('blob:', data.protocol);
      testing.expectEqual('', data.host);
      testing.expectEqual('', data.hostname);
      testing.expectEqual('', data.port);
      testing.expectEqual(data.href.slice('blob:'.length), data.pathname);
      testing.expectEqual('', data.search);
      testing.expectEqual('', data.hash);
    });
  }
</script>

<script id=blob_url_object type=module>
  {
    // The same parse, reached through the URL constructor rather than a
    // worker's location. Chrome 151, measured.
    const u = new URL('blob:http://127.0.0.1:9701/8e0e0a1a-1111-2222-3333-444455556666');
    testing.expectEqual('http://127.0.0.1:9701', u.origin);
    testing.expectEqual('blob:', u.protocol);
    testing.expectEqual('', u.host);
    testing.expectEqual('', u.hostname);
    testing.expectEqual('', u.port);
    testing.expectEqual('http://127.0.0.1:9701/8e0e0a1a-1111-2222-3333-444455556666', u.pathname);

    // A data URL is the same opaque-path shape, but nothing inside it is an
    // origin, so it stays "null".
    const d = new URL('data:text/plain,hi');
    testing.expectEqual('null', d.origin);
    testing.expectEqual('data:', d.protocol);
    testing.expectEqual('', d.host);
    testing.expectEqual('text/plain,hi', d.pathname);
  }
</script>
