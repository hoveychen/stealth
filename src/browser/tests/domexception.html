<!DOCTYPE html>
<head>
  <title>DOMException Test</title>
  <script src="testing.js"></script>
</head>

<body>
</body>

<script id=constructor_no_args>
  {
    const ex = new DOMException();
    testing.expectEqual('Error', ex.toString());
    testing.expectEqual('Error', ex.name);
    testing.expectEqual('', ex.message);
    testing.expectEqual(0, ex.code);
  }
</script>

<script id=constructor_with_message>
  {
    const ex = new DOMException('Something went wrong');
    testing.expectEqual('Error', ex.name);
    testing.expectEqual('Something went wrong', ex.message);
    testing.expectEqual(0, ex.code);
  }
</script>

<script id=constructor_with_message_and_name>
  {
    const ex = new DOMException('Custom error message', 'NotFoundError');
    testing.expectEqual('NotFoundError', ex.name);
    testing.expectEqual('Custom error message', ex.message);
    testing.expectEqual(8, ex.code);
  }
</script>

<script id=legacy_error_codes>
  {
    // Test standard errors with legacy codes
    const errors = [
      { name: 'IndexSizeError', code: 1 },
      { name: 'HierarchyRequestError', code: 3 },
      { name: 'WrongDocumentError', code: 4 },
      { name: 'InvalidCharacterError', code: 5 },
      { name: 'NoModificationAllowedError', code: 7 },
      { name: 'NotFoundError', code: 8 },
      { name: 'NotSupportedError', code: 9 },
      { name: 'InUseAttributeError', code: 10 },
      { name: 'InvalidStateError', code: 11 },
      { name: 'SyntaxError', code: 12 },
      { name: 'InvalidModificationError', code: 13 },
      { name: 'NamespaceError', code: 14 },
      { name: 'InvalidAccessError', code: 15 },
      { name: 'SecurityError', code: 18 },
      { name: 'NetworkError', code: 19 },
      { name: 'AbortError', code: 20 },
      { name: 'URLMismatchError', code: 21 },
      { name: 'QuotaExceededError', code: 22 },
      { name: 'TimeoutError', code: 23 },
      { name: 'InvalidNodeTypeError', code: 24 },
      { name: 'DataCloneError', code: 25 },
    ];

    for (const { name, code } of errors) {
      const ex = new DOMException('test', name);
      testing.expectEqual(name, ex.name);
      testing.expectEqual(code, ex.code);
      testing.expectEqual('test', ex.message);
    }
  }
</script>

<script id=custom_error_name>
  {
    // Non-standard error names should have code 0
    const ex = new DOMException('Custom message', 'MyCustomError');
    testing.expectEqual('MyCustomError', ex.name);
    testing.expectEqual('Custom message', ex.message);
    testing.expectEqual(0, ex.code);
  }
</script>

<script id=modern_errors_no_code>
  {
    // Modern errors that don't have legacy codes
    const modernErrors = [
      'EncodingError',
      'NotReadableError',
      'UnknownError',
      'ConstraintError',
      'DataError',
      'TransactionInactiveError',
      'ReadOnlyError',
      'VersionError',
      'OperationError',
      'NotAllowedError'
    ];

    for (const name of modernErrors) {
      const ex = new DOMException('test', name);
      testing.expectEqual(name, ex.name);
      testing.expectEqual(0, ex.code);
    }
  }
</script>

<script id=thrown_exception>
  {
    try {
      throw new DOMException('Operation failed', 'InvalidStateError');
    } catch (e) {
      testing.expectEqual('InvalidStateError', e.name);
      testing.expectEqual('Operation failed', e.message);
      testing.expectEqual(11, e.code);
    }
  }
</script>

<div id="content">
  <a id="link" href="foo" class="ok">OK</a>
</div>

<script id=custom_name_outlives_call>
  // The constructor's strings come from the call arena: they must be copied.
  window.__custom_exception = new DOMException('took too ' + 'long', 'Timeout' + 'Error');
  testing.expectEqual('TimeoutError', window.__custom_exception.name);
</script>

<script id=custom_name_outlives_call_2>
  const e = window.__custom_exception;
  testing.expectEqual('TimeoutError', e.name);
  testing.expectEqual('took too long', e.message);
  testing.expectEqual(23, e.code);
  testing.expectEqual('TimeoutError: took too long', e.toString());
</script>

<script id=hierarchy_error>
  let link = $('#link');
  let content = $('#content');

  testing.withError((err) => {
    testing.expectEqual(3, err.code);
    testing.expectEqual('HierarchyRequestError', err.name);
    testing.expectEqual(true, err instanceof DOMException);
    testing.expectEqual(true, err instanceof Error);
  }, () => link.appendChild(content));
</script>

<script id=message_outlives_later_strings>
  {
    // The message and the name are the script's, and they have to keep saying
    // what the script said however many strings cross the bridge afterwards.
    // They used to be slices of a shared scratch buffer, so the next string
    // argument -- any string argument -- wrote over them in place:
    // `new CustomEvent('yy')` turned a "boom" message into "yyom".
    const e = new DOMException('boom', 'NotAllowedError');
    new CustomEvent('yy');
    document.createElement('xx');
    new URL('http://example.com/');
    testing.expectEqual('boom', e.message);
    testing.expectEqual('NotAllowedError', e.name);
    testing.expectEqual('NotAllowedError: boom', String(e));

    // The name matters just as much: it is what the legacy code is read from.
    const named = new DOMException('a longer message', 'InvalidStateError');
    new CustomEvent('zzzzzzzzzzzzzzzzzzzzz');
    testing.expectEqual('a longer message', named.message);
    testing.expectEqual('InvalidStateError', named.name);
    testing.expectEqual(11, named.code);
  }
</script>

<script id=thrown_message_outlives_later_calls>
  {
    // The other half of the same hazard. A DOMException the engine throws
    // carries a message built on the per-call arena, and the exception object
    // kept the slice rather than a copy -- so a script that caught one and read
    // `.message` after any further call read whatever had since been written
    // there. The constructor above copies; this path did not.
    const messages = [];
    const collect = (fn) => {
      try {
        fn();
        testing.expectEqual('should have thrown', 'did not throw');
      } catch (e) {
        // Deliberately not read yet: the whole point is that it survives.
        messages.push(e);
      }
    };

    collect(() => document.querySelector('###'));
    collect(() => document.createElement('canvas').getContext('2d')
      .createLinearGradient(0, 0, 1, 1).addColorStop(0, 'notacolour'));
    collect(() => document.createElement('canvas').getContext('2d')
      .createLinearGradient(0, 0, 1, 1).addColorStop(2, '#fff'));

    // Churn the arena the messages were built on. Without the copy the first
    // of these three reads back as "#fffFailed to execute 'addColorStop' on
    // 'CanvasGradient': The provided value (2" -- the head of its own message
    // overwritten by the two that were thrown after it, and by their arguments.
    const churn = 'y'.repeat(400);
    for (let i = 0; i < 8; i++) {
      new CustomEvent(churn);
      document.createElement('canvas').getContext('2d').measureText(churn);
      new URL('http://example.com/' + churn);
    }

    testing.expectEqual(
      "Failed to execute 'querySelector' on 'Document': '###' is not a valid selector.",
      messages[0].message);
    testing.expectEqual(
      "Failed to execute 'addColorStop' on 'CanvasGradient': " +
      "The value provided ('notacolour') could not be parsed as a color.",
      messages[1].message);
    testing.expectEqual(
      "Failed to execute 'addColorStop' on 'CanvasGradient': " +
      'The provided value (2) is outside the range (0.0, 1.0).',
      messages[2].message);
  }
</script>

<script id=a_caught_message_survives_the_next_task type=module>
{
  // The block above churns the arena inside one task, which the three paths it
  // names survive. This is the shape that a borrowed message does not: catch in
  // one task, read in the next, with one short string crossing the bridge in
  // between so the allocation lands where the message started rather than
  // running past it.
  //
  // It is not a corner. A guard catches exceptions and reads them back later --
  // Kasada rejects twenty-five promises in a row on x-hyatt just to collect the
  // messages -- and what it got here was a message no browser writes:
  // "currentScriptcute 'start' on 'TimeRanges': ..." (measured on main,
  // scratch/b80/q12.js, before the copy below existed).
  //
  // `DOMException.init` borrows both of its strings; `TimeRanges` builds its
  // message on the per-call arena. Every other path through `Context.fail`
  // copies as it throws, which is why the block above is green.
  const state = await testing.async();

  let caught = null;
  try {
    document.createElement('video').buffered.start(0);
  } catch (e) {
    caught = e;
  }

  await new Promise((resolve) => setTimeout(resolve, 0));
  document.getElementById('aVeryLongIdNobodyHasAtAll');
  const message = caught && caught.message;
  const name = caught && caught.name;

  state.resolve();
  await state.done(() => {
    testing.expectEqual(
      "Failed to execute 'start' on 'TimeRanges': The index provided (0) is " +
      'greater than or equal to the maximum bound (0).',
      message);
    // Both strings are one question: a borrowed name goes the same way.
    testing.expectEqual('IndexSizeError', name);
  });
}
</script>
