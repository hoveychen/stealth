<!DOCTYPE html>
<script src="../testing.js"></script>

<div id="host1"></div>
<div id="host2"></div>
<div id="host3"></div>

<script id="attachShadow_open">
{
    const host = $('#host1');
    const shadow = host.attachShadow({ mode: 'open' });

    testing.expectEqual('open', shadow.mode);
    testing.expectEqual(host, shadow.host);
    testing.expectEqual(shadow, host.shadowRoot);
}
</script>

<script id="attachShadow_closed">
{
    const host = $('#host2');
    const shadow = host.attachShadow({ mode: 'closed' });

    testing.expectEqual('closed', shadow.mode);
    testing.expectEqual(host, shadow.host);
    testing.expectEqual(null, host.shadowRoot);
}
</script>

<script id="innerHTML">
{
    const host = $('#host3');
    const shadow = host.attachShadow({ mode: 'open' });

    shadow.innerHTML = '<p>Hello</p><span>World</span>';
    testing.expectEqual('<p>Hello</p><span>World</span>', shadow.innerHTML);

    const p = shadow.querySelector('p');
    testing.expectEqual('Hello', p.textContent);

    const span = shadow.querySelector('span');
    testing.expectEqual('World', span.textContent);
}
</script>

<script id="querySelector">
{
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = '<div class="test"><p id="para">Text</p></div>';

    const para = shadow.querySelector('#para');
    testing.expectEqual('Text', para.textContent);

    const div = shadow.querySelector('.test');
    testing.expectEqual('DIV', div.tagName);

    testing.expectEqual(null, shadow.querySelector('.nonexistent'));
}
</script>

<script id="querySelectorAll">
{
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = '<p>One</p><p>Two</p><p>Three</p>';

    const paras = shadow.querySelectorAll('p');
    testing.expectEqual(3, paras.length);
    testing.expectEqual('One', paras[0].textContent);
    testing.expectEqual('Two', paras[1].textContent);
    testing.expectEqual('Three', paras[2].textContent);
}
</script>

<script id="children">
{
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = '<div>A</div><span>B</span><p>C</p>';

    const children = shadow.children;
    testing.expectEqual(3, children.length);
    testing.expectEqual('DIV', children[0].tagName);
    testing.expectEqual('SPAN', children[1].tagName);
    testing.expectEqual('P', children[2].tagName);
}
</script>

<script id="firstLastChild">
{
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = '<div>First</div><span>Last</span>';

    testing.expectEqual('DIV', shadow.firstElementChild.tagName);
    testing.expectEqual('First', shadow.firstElementChild.textContent);

    testing.expectEqual('SPAN', shadow.lastElementChild.tagName);
    testing.expectEqual('Last', shadow.lastElementChild.textContent);
}
</script>

<script id="appendChild">
{
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });

    const p = document.createElement('p');
    p.textContent = 'Test';
    shadow.appendChild(p);

    testing.expectEqual(1, shadow.childElementCount);
    testing.expectEqual(p, shadow.firstElementChild);
    testing.expectEqual('Test', shadow.firstElementChild.textContent);
}
</script>

<script id="append_prepend">
{
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });

    shadow.append('text1');
    testing.expectEqual('text1', shadow.innerHTML);

    shadow.prepend('text0');
    testing.expectEqual('text0text1', shadow.innerHTML);
}
</script>

<script id="replaceChildren">
{
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = '<div>Old</div>';

    testing.expectEqual(1, shadow.childElementCount);

    shadow.replaceChildren('New content');
    testing.expectEqual('New content', shadow.innerHTML);
}
</script>

<script id="getElementById">
{
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = '<div id="test">Content</div>';

    const el = shadow.getElementById('test');
    testing.expectEqual('Content', el.textContent);

    testing.expectEqual(null, shadow.getElementById('nonexistent'));
}
</script>


<script id=adoptedStyleSheets>
  {
    const host = document.createElement('div');
    const shadow = host.attachShadow({ mode: 'open' });

    const acss = shadow.adoptedStyleSheets;
    testing.expectEqual(0, acss.length);
    acss.push(new CSSStyleSheet());
    testing.expectEqual(1, acss.length);
  }
</script>

<script id=attachShadow_enum_member_refusal>
{
  // The same nested sentence an operation's dictionary gets: the execute
  // prefix, the member and its dictionary, then the value and the enum type
  // unquoted (measured on Chrome 151).
  let err = null;
  try {
    document.createElement('div').attachShadow({ mode: 'nope' });
  } catch (e) { err = `${e.name}: ${e.message}`; }
  testing.expectEqual(
    "TypeError: Failed to execute 'attachShadow' on 'Element': Failed to read the 'mode' property from " +
      "'ShadowRootInit': The provided value 'nope' is not a valid enum value of type ShadowRootMode.",
    err,
  );
}
</script>

<script id="styleSheets">
{
    // A shadow root carries its own StyleSheetList, separate from the
    // document's: a <style> inside the tree lands here and not in
    // document.styleSheets. `adoptedStyleSheets` was already here; this is the
    // other half of DocumentOrShadowRoot, and Kasada reads it while scoring
    // x-hyatt (before this, reading `.styleSheets` on a shadow root threw).
    const host = document.createElement('div');
    document.documentElement.appendChild(host);
    const shadow = host.attachShadow({ mode: 'open' });

    testing.expectEqual('StyleSheetList', shadow.styleSheets.constructor.name);
    testing.expectEqual(0, shadow.styleSheets.length);
    testing.expectEqual(true, shadow.styleSheets === shadow.styleSheets);

    const before = document.styleSheets.length;
    const sheet = document.createElement('style');
    sheet.textContent = ':host { color: red }';
    shadow.appendChild(sheet);

    testing.expectEqual(1, shadow.styleSheets.length);
    testing.expectEqual('CSSStyleSheet', shadow.styleSheets[0].constructor.name);
    testing.expectEqual(1, shadow.styleSheets[0].cssRules.length);

    // A shadow tree's sheet is the shadow root's and nobody else's: the
    // document's list does not move. Measured on Chrome 151 with
    // tools/fingerprint/probes/expr-shadow-stylesheet-scope.js, for both modes.
    testing.expectEqual(before, document.styleSheets.length);
    // ...and its rules are not reachable by walking document.styleSheets.
    let seen = false;
    for (const s of document.styleSheets) {
      for (const r of s.cssRules) seen = seen || r.cssText.indexOf(':host') !== -1;
    }
    testing.expectFalse(seen);

    // Removing the element takes its sheet back out of the root's list.
    sheet.remove();
    testing.expectEqual(0, shadow.styleSheets.length);
    testing.expectEqual(before, document.styleSheets.length);
}
</script>

<script id="closed_shadow_sheets_stay_out_of_the_document">
{
    // The Cloudflare widget builds its UI in a closed shadow root with a
    // <style> in it, and B59 measured our CSS-rule-text span in its payload
    // coming out at exactly twice Chrome's length: 41393 = 2 x 20696 + 1, the
    // rules counted once through the document and once through the root.
    // Chrome's document list does not move for either mode, and does not move
    // back when the host goes -- there was nothing in it to take out.
    const before = document.styleSheets.length;
    for (const mode of ['open', 'closed']) {
      const host = document.createElement('div');
      document.documentElement.appendChild(host);
      const root = host.attachShadow({ mode });
      const style = document.createElement('style');
      style.textContent = '.' + mode + '-marker { color: rgb(1, 2, 3) }';
      root.appendChild(style);

      testing.expectEqual(1, root.styleSheets.length);
      testing.expectEqual(before, document.styleSheets.length);
      host.remove();
      testing.expectEqual(before, document.styleSheets.length);
    }
}
</script>
