<!DOCTYPE html>
<script>
(async () => {
  const out = {};
  const err = (e) => e.name + ': ' + e.message;
  const settle = async (k, f) => { try { out[k] = await f(); } catch (e) { out[k] = err(e); } };
  const sync = (k, f) => { try { out[k] = f(); } catch (e) { out[k] = err(e); } };
  await settle('layoutMap', async () => (await navigator.keyboard.getLayoutMap()).size);
  await settle('lock', async () => String(await navigator.keyboard.lock()));
  for (const p of ['geolocation', 'notifications', 'camera', 'clipboard-write', 'screen-wake-lock', 'background-fetch', 'storage-access', 'accelerometer']) {
    await settle('perm ' + p, async () => (await navigator.permissions.query({ name: p })).state);
  }
  sync('allowedFeatures', () => document.featurePolicy.allowedFeatures().length);
  sync('allowsKeyboardMap', () => document.featurePolicy.allowsFeature('keyboard-map'));
  sync('allowlistSyncXhr', () => document.featurePolicy.getAllowlistForFeature('sync-xhr').join(','));
  sync('allowlistCamera', () => document.featurePolicy.getAllowlistForFeature('camera').join(','));
  await settle('summarizer', () => Summarizer.availability());
  await settle('wakeLock', async () => (await navigator.wakeLock.request('screen')).type);
  sync('accelerometer', () => { new Accelerometer(); return 'ok'; });
  sync('gyroscope', () => { new Gyroscope(); return 'ok'; });
  await settle('usb', async () => (await navigator.usb.getDevices()).length);
  await settle('bluetooth', () => navigator.bluetooth.getAvailability());
  sync('notification', () => Notification.permission);
  sync('fullscreenEnabled', () => document.fullscreenEnabled);
  sync('canShare', () => navigator.canShare({ text: 'x' }));
  await settle('relatedApps', async () => (await navigator.getInstalledRelatedApps()).length);
  sync('payment', () => { new PaymentRequest([{ supportedMethods: 'https://example.com/pay' }], { total: { label: 't', amount: { currency: 'USD', value: '1' } } }); return 'ok'; });
  await settle('geolocation', () => new Promise((resolve) => {
    navigator.geolocation.getCurrentPosition(() => resolve('position'), (e) => resolve(e.code + ' ' + e.message));
    setTimeout(() => resolve('pending'), 100);
  }));
  parent.postMessage(out, '*');
})();
</script>
