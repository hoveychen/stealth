<!DOCTYPE html>
<body>
<script src="../testing.js"></script>

<!--
  Two realms must not hand out the same object.

  Measured on the Cloudflare widget (README, "Reading the same two files record
  by record"): a recorder installed in ten realms wrapped `crypto.subtle.digest`
  ten times over, because every realm's `crypto.subtle` was one object. Chrome
  shares none of these — a same-origin iframe gets its own wrapper over the same
  underlying state — so a patch applied in one realm reaching another is a tell
  that needs no cleverness to read.
-->

<script id="realm_crypto_subtle_is_per_realm">
{
    const f = document.createElement('iframe');
    document.body.appendChild(f);
    const w = f.contentWindow;

    // The realms themselves are distinct, which is the premise of the rest.
    testing.expectTrue(w !== window);
    testing.expectTrue(w.document !== document);
    testing.expectTrue(w.Object !== Object);
    testing.expectTrue(w.crypto !== crypto);

    // And so is the object hanging off it.
    testing.expectTrue(w.crypto.subtle !== crypto.subtle);
    testing.expectTrue(w.crypto.subtle.digest !== crypto.subtle.digest);

    f.remove();
}
</script>

<script id="realm_crypto_subtle_patch_does_not_leak">
{
    const f = document.createElement('iframe');
    document.body.appendChild(f);
    const w = f.contentWindow;

    const before = crypto.subtle.digest;
    w.crypto.subtle.digest = function () { return 'patched'; };
    testing.expectTrue(crypto.subtle.digest === before);
    testing.expectEqual('patched', w.crypto.subtle.digest());

    f.remove();
}
</script>

<script id="realm_storage_is_per_realm_over_one_store">
{
    const f = document.createElement('iframe');
    document.body.appendChild(f);
    const w = f.contentWindow;

    // Same origin, so the same store -- but not the same object. Chrome draws
    // that line and so does this engine now: the Storage handle is per-Window,
    // the data behind it is per-origin.
    testing.expectTrue(w.localStorage !== localStorage);
    testing.expectTrue(w.sessionStorage !== sessionStorage);
    testing.expectTrue(w.localStorage.getItem !== localStorage.getItem);

    localStorage.setItem('realm-probe', 'parent');
    testing.expectEqual('parent', w.localStorage.getItem('realm-probe'));
    w.localStorage.setItem('realm-probe', 'child');
    testing.expectEqual('child', localStorage.getItem('realm-probe'));
    testing.expectEqual(localStorage.length, w.localStorage.length);
    localStorage.removeItem('realm-probe');
    testing.expectEqual(null, w.localStorage.getItem('realm-probe'));

    // localStorage and sessionStorage are two stores, not one.
    sessionStorage.setItem('realm-probe', 'session');
    testing.expectEqual(null, localStorage.getItem('realm-probe'));
    sessionStorage.removeItem('realm-probe');

    f.remove();
}
</script>

<script id="realm_screen_and_viewport_are_per_realm">
{
    const f = document.createElement('iframe');
    document.body.appendChild(f);
    const w = f.contentWindow;

    // Chrome gives every realm its own Screen, VisualViewport and
    // ScreenOrientation. They read the same numbers because the numbers belong
    // to the page, not to the realm.
    testing.expectTrue(w.screen !== screen);
    testing.expectTrue(w.visualViewport !== visualViewport);
    testing.expectTrue(w.screen.orientation !== screen.orientation);

    testing.expectEqual(screen.width, w.screen.width);
    testing.expectEqual(screen.height, w.screen.height);
    testing.expectEqual(screen.availWidth, w.screen.availWidth);
    testing.expectEqual(screen.orientation.type, w.screen.orientation.type);
    testing.expectEqual(visualViewport.width, w.visualViewport.width);
    testing.expectEqual(visualViewport.height, w.visualViewport.height);
    testing.expectEqual(visualViewport.scale, w.visualViewport.scale);

    f.remove();
}
</script>

<script id="realm_screen_and_viewport_listeners_do_not_cross">
{
    const f = document.createElement('iframe');
    document.body.appendChild(f);
    const w = f.contentWindow;

    // Both are EventTargets, so one shared instance is one shared listener
    // list: a resize handler installed in the child would hear the parent's
    // event. Two instances each keep their own.
    let parent_resize = 0;
    let child_resize = 0;
    visualViewport.addEventListener('resize', () => parent_resize++);
    w.visualViewport.addEventListener('resize', () => child_resize++);
    visualViewport.dispatchEvent(new Event('resize'));
    testing.expectEqual(1, parent_resize);
    testing.expectEqual(0, child_resize);

    let parent_change = 0;
    let child_change = 0;
    screen.orientation.addEventListener('change', () => parent_change++);
    w.screen.orientation.addEventListener('change', () => child_change++);
    screen.orientation.dispatchEvent(new Event('change'));
    testing.expectEqual(1, parent_change);
    testing.expectEqual(0, child_change);

    // And the reverse direction, which is the one a widget in an iframe would
    // notice: the parent must not hear what the child dispatches.
    w.visualViewport.dispatchEvent(new Event('resize'));
    testing.expectEqual(1, parent_resize);
    testing.expectEqual(1, child_resize);

    f.remove();
}
</script>

<script id="realm_screen_patch_does_not_leak">
{
    const f = document.createElement('iframe');
    document.body.appendChild(f);
    const w = f.contentWindow;

    // An expando put on the child's instance must not appear on the parent's.
    w.screen.probe = 'child';
    w.visualViewport.probe = 'child';
    testing.expectEqual(undefined, screen.probe);
    testing.expectEqual(undefined, visualViewport.probe);
    testing.expectEqual('child', w.screen.probe);

    f.remove();
}
</script>

<script id="realm_crypto_wrappers_are_stable">
{
    // The check above is only meaningful if a wrapper is stable within one
    // realm: a getter minting a fresh object per read would read as "distinct"
    // across realms for the wrong reason.
    testing.expectTrue(crypto === crypto);
    testing.expectTrue(crypto.subtle === crypto.subtle);
    testing.expectTrue(crypto.subtle.digest === crypto.subtle.digest);
}
</script>

</body>
</html>
