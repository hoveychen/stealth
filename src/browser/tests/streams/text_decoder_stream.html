<!DOCTYPE html>
<script src="../testing.js"></script>

<script id=text_decoder_stream_encoding>
  {
    const tds = new TextDecoderStream();
    testing.expectEqual('utf-8', tds.encoding);
    testing.expectEqual('object', typeof tds.readable);
    testing.expectEqual('object', typeof tds.writable);
    testing.expectEqual(false, tds.fatal);
    testing.expectEqual(false, tds.ignoreBOM);
  }
</script>

<script id=text_decoder_stream_with_label>
  {
    const tds = new TextDecoderStream('utf-8');
    testing.expectEqual('utf-8', tds.encoding);
  }
</script>

<script id=text_decoder_stream_with_opts>
  {
    const tds = new TextDecoderStream('utf-8', { fatal: true, ignoreBOM: true });
    testing.expectEqual(true, tds.fatal);
    testing.expectEqual(true, tds.ignoreBOM);
  }
</script>

<script id=text_decoder_stream_invalid_label>
  {
    // Same sentence as TextDecoder's, with this interface's name and the label
    // echoed verbatim -- not trimmed, not lowercased, the empty string included
    // (measured on Chrome 151, probes/probe-encoding-label.js). It used to be a
    // RangeError with an empty message, which no browser has.
    const msg = (fn) => { try { fn(); return 'no throw'; } catch (e) { return `${e.name}: ${e.message}`; } };
    const invalid = (label) => 'RangeError: ' +
      `Failed to construct 'TextDecoderStream': The encoding label provided ('${label}') is invalid.`;

    testing.expectEqual(invalid('invalid-encoding'), msg(() => new TextDecoderStream('invalid-encoding')));
    testing.expectEqual(invalid('Invalid-Encoding'), msg(() => new TextDecoderStream('Invalid-Encoding')));
    testing.expectEqual(invalid(''), msg(() => new TextDecoderStream('')));
    testing.expectEqual(invalid('replacement'), msg(() => new TextDecoderStream('replacement')));

    // Not Chrome's reading: this stream only decodes utf-8, so it refuses labels
    // Chrome accepts (windows-1252 gives a stream whose encoding is
    // "windows-1252" there -- measured, same probe). The wording is Blink's; the
    // refusal itself is this engine's own gap, and a wider one than a message.
    testing.expectEqual(invalid('windows-1252'), msg(() => new TextDecoderStream('windows-1252')));
  }
</script>

<script id=text_decoder_stream_decode>
  (async function() {
    const tds = new TextDecoderStream();

    const writer = tds.writable.getWriter();
    const reader = tds.readable.getReader();

    // 'hello' in UTF-8 bytes
    const bytes = new Uint8Array([104, 101, 108, 108, 111]);
    await writer.write(bytes);
    await writer.close();

    const result = await reader.read();
    testing.expectEqual(false, result.done);
    testing.expectEqual('hello', result.value);

    const result2 = await reader.read();
    testing.expectEqual(true, result2.done);
  })();
</script>

<script id=text_decoder_stream_empty_chunk>
  (async function() {
    const tds = new TextDecoderStream();
    const writer = tds.writable.getWriter();
    const reader = tds.readable.getReader();

    // Write an empty chunk followed by real data
    await writer.write(new Uint8Array([]));
    await writer.write(new Uint8Array([104, 105]));
    await writer.close();

    // Empty chunk should be filtered out; first read gets "hi"
    const result = await reader.read();
    testing.expectEqual(false, result.done);
    testing.expectEqual('hi', result.value);

    const result2 = await reader.read();
    testing.expectEqual(true, result2.done);
  })();
</script>
