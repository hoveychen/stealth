<!DOCTYPE html>
<script src="./testing.js"></script>

<script id=speech_synthesis>
{
  // Every shape here is measured off Chrome 150 — see speech/SpeechSynthesis.zig.
  testing.expectEqual('object', typeof speechSynthesis);
  testing.expectEqual('function', typeof SpeechSynthesis);
  testing.expectEqual('[object SpeechSynthesis]', Object.prototype.toString.call(speechSynthesis));
  testing.expectEqual(true, speechSynthesis instanceof SpeechSynthesis);
  testing.expectEqual(true, speechSynthesis instanceof EventTarget);
  testing.expectEqual(false, speechSynthesis.pending);
  testing.expectEqual(false, speechSynthesis.speaking);
  testing.expectEqual(false, speechSynthesis.paused);
  testing.expectEqual(null, speechSynthesis.onvoiceschanged);

  // Same object on every read, and not constructible.
  testing.expectEqual(true, speechSynthesis === window.speechSynthesis);
  let threw = null;
  try { new SpeechSynthesis(); } catch (e) { threw = e.name; }
  testing.expectEqual('TypeError', threw);

  testing.expectEqual(
    ['cancel', 'constructor', 'getVoices', 'onvoiceschanged', 'pause', 'paused', 'pending', 'resume', 'speak', 'speaking'],
    Object.getOwnPropertyNames(SpeechSynthesis.prototype).sort(),
  );
  testing.expectEqual(1, SpeechSynthesis.prototype.speak.length);
  testing.expectEqual(0, SpeechSynthesis.prototype.getVoices.length);

  speechSynthesis.pause();
  testing.expectEqual(true, speechSynthesis.paused);
  speechSynthesis.resume();
  testing.expectEqual(false, speechSynthesis.paused);
}
</script>

<script id=speech_voices_first_read>
{
  // Chrome's timing, not just its values: the first synchronous getVoices() is
  // empty, and the list arrives ~665ms later with a voiceschanged event —
  // measured on a headed Chrome, three runs. See SpeechSynthesis.zig.
  //
  // A classic script, deliberately: module scripts are deferred, so a module here
  // would run after some other block had already triggered the fill.
  // The listener goes on before the first read so it cannot miss the event.
  window.__voicesChanged = false;
  speechSynthesis.addEventListener('voiceschanged', () => { window.__voicesChanged = true; });
  testing.expectEqual(0, speechSynthesis.getVoices().length);
  // A second synchronous read is still empty: the fill is on a timer, not on the
  // next task, so both of Chrome's observable windows are reproduced.
  testing.expectEqual(0, speechSynthesis.getVoices().length);
}
</script>

<script id=speech_voices type=module>
{
  const state = await testing.async();
  // Chrome's measured fill latency is ~665ms; wait past it.
  await new Promise((r) => setTimeout(r, 800));
  const voices = speechSynthesis.getVoices();
  state.resolve();
  await state.done(() => runVoiceChecks(voices));

  function runVoiceChecks(voices) {
  testing.expectEqual(true, window.__voicesChanged);
  testing.expectEqual(199, voices.length);
  testing.expectEqual('[object SpeechSynthesisVoice]', Object.prototype.toString.call(voices[0]));
  // The default voice comes first, and on macOS that is a local one.
  testing.expectEqual('Samantha', voices[0].name);
  testing.expectEqual('Samantha', voices[0].voiceURI);
  testing.expectEqual('en-US', voices[0].lang);
  testing.expectEqual(true, voices[0].localService);
  testing.expectEqual(true, voices[0].default);

  // Exactly one default, and the list is the system's 180 local voices followed
  // by Chrome's 19 remote Google ones. Which of those two blocks exists at all
  // is the platform's answer: the Linux container has no speech-dispatcher and
  // so lists only the 19 remote ones, which CreepJS reads the same way it reads
  // an empty list. The claim is macOS, so the table is the Mac's.
  testing.expectEqual(1, voices.filter((v) => v.default).length);
  testing.expectEqual(180, voices.filter((v) => v.localService).length);
  testing.expectEqual(19, voices.filter((v) => !v.localService).length);
  // The remote block is contiguous and last, the way Chrome orders it.
  testing.expectEqual('Google Deutsch', voices[180].name);
  testing.expectEqual('Google 國語（臺灣）', voices[198].name);
  testing.expectEqual(180, voices.findIndex((v) => !v.localService));
  testing.expectEqual(51, new Set(voices.map((v) => v.lang)).size);

  // Identity is stable across calls: scripts compare voices with ===.
  testing.expectEqual(true, speechSynthesis.getVoices()[3] === voices[3]);

  testing.expectEqual(
    ['constructor', 'default', 'lang', 'localService', 'name', 'voiceURI'],
    Object.getOwnPropertyNames(SpeechSynthesisVoice.prototype).sort(),
  );
  }
}
</script>

<script id=speech_voices_warm_child type=module>
{
  // The wait is per browser, not per document. Measured on headed Chrome 151
  // (tools/fingerprint/voice-warmup-timeline.mjs): the first ask in a process
  // costs ~700ms, and a child document created once that list had arrived
  // answered empty on its own first synchronous read and had all 199 voices
  // 27ms later — b56-voice-chrome-iframe.json. Three navigations of one browser
  // agree: 727/751ms for the first document, 26/27ms for every one after.
  const state = await testing.async();
  // Past the parent's own fill, so the browser is warm before the child asks.
  await new Promise((r) => setTimeout(r, 800));

  const iframe = document.createElement('iframe');
  document.documentElement.appendChild(iframe);
  const doc = iframe.contentDocument;
  doc.write(
    '<!DOCTYPE html><body><script>' +
    'window.__first = speechSynthesis.getVoices().length;' +
    'setTimeout(() => { window.__later = speechSynthesis.getVoices().length; }, 100);' +
    '<\/script></body>'
  );
  doc.close();
  // A separate window means a separate SpeechSynthesis; without that this block
  // would just be re-reading the parent's already-filled list.
  const ownSynthesis = iframe.contentWindow.speechSynthesis !== window.speechSynthesis;

  await new Promise((r) => setTimeout(r, 250));
  const first = iframe.contentWindow.__first;
  const later = iframe.contentWindow.__later;
  state.resolve();

  await state.done(() => {
    testing.expectEqual(true, ownSynthesis);
    testing.expectEqual(0, first);
    testing.expectEqual(199, later);
  });
}
</script>

<script id=speech_utterance type=module>
{
  const state = await testing.async();
  // Waits for the voice list, because it assigns one.
  await new Promise((r) => setTimeout(r, 800));

  const u = new SpeechSynthesisUtterance('hello');
  const fresh = {
    tag: Object.prototype.toString.call(u),
    isEventTarget: u instanceof EventTarget,
    text: u.text,
    lang: u.lang,
    voice: u.voice,
    volume: u.volume,
    rate: u.rate,
    pitch: u.pitch,
    // `text` is optional, so the constructor reports length 0 and defaults to "".
    ctorLength: SpeechSynthesisUtterance.length,
    noArgText: new SpeechSynthesisUtterance().text,
  };

  u.text = 'world';
  u.lang = 'en-GB';
  u.volume = 0.5;
  u.rate = 2;
  u.pitch = 0.25;
  u.voice = speechSynthesis.getVoices()[1];
  const written = [u.text, u.lang, u.volume, u.rate, u.pitch, u.voice.name];
  state.resolve();

  await state.done(() => {
    testing.expectEqual('[object SpeechSynthesisUtterance]', fresh.tag);
    testing.expectEqual(true, fresh.isEventTarget);
    testing.expectEqual('hello', fresh.text);
    testing.expectEqual('', fresh.lang);
    testing.expectEqual(null, fresh.voice);
    testing.expectEqual([1, 1, 1], [fresh.volume, fresh.rate, fresh.pitch]);
    testing.expectEqual(0, fresh.ctorLength);
    testing.expectEqual('', fresh.noArgText);

    testing.expectEqual(['world', 'en-GB', 0.5, 2, 0.25, 'Albert'], written);

    testing.expectEqual(
      ['constructor', 'lang', 'onboundary', 'onend', 'onerror', 'onmark', 'onpause', 'onresume', 'onstart', 'pitch', 'rate', 'text', 'voice', 'volume'],
      Object.getOwnPropertyNames(SpeechSynthesisUtterance.prototype).sort(),
    );
  });
}
</script>

<script id=speech_events>
{
  // SpeechSynthesisErrorEvent -> SpeechSynthesisEvent -> Event, like Chrome,
  // and both constructors take two required arguments.
  testing.expectEqual(2, SpeechSynthesisEvent.length);
  testing.expectEqual(2, SpeechSynthesisErrorEvent.length);
  testing.expectEqual(SpeechSynthesisErrorEvent.prototype.__proto__, SpeechSynthesisEvent.prototype);
  testing.expectEqual(SpeechSynthesisEvent.prototype.__proto__, Event.prototype);

  const u = new SpeechSynthesisUtterance('x');
  const e = new SpeechSynthesisEvent('boundary', { utterance: u, charIndex: 2, charLength: 3, elapsedTime: 1.5, name: 'word' });
  testing.expectEqual('[object SpeechSynthesisEvent]', Object.prototype.toString.call(e));
  testing.expectEqual(true, e instanceof Event);
  testing.expectEqual('boundary', e.type);
  testing.expectEqual(true, e.utterance === u);
  testing.expectEqual([2, 3, 1.5, 'word'], [e.charIndex, e.charLength, e.elapsedTime, e.name]);

  const err = new SpeechSynthesisErrorEvent('error', { utterance: u, error: 'synthesis-failed' });
  testing.expectEqual('[object SpeechSynthesisErrorEvent]', Object.prototype.toString.call(err));
  testing.expectEqual(true, err instanceof SpeechSynthesisEvent);
  testing.expectEqual(true, err instanceof Event);
  testing.expectEqual('synthesis-failed', err.error);
  testing.expectEqual(true, err.utterance === u);
  testing.expectEqual(['constructor', 'error'], Object.getOwnPropertyNames(SpeechSynthesisErrorEvent.prototype).sort());
}
</script>

<script id=speech_speak type=module>
{
  // There is no synthesiser, but speak() still delivers Chrome's success pair
  // (start then end) so a page that waits for onend continues.
  const state = await testing.async();
  const u = new SpeechSynthesisUtterance('hello');
  const seen = [];
  u.onstart = (e) => seen.push(['onstart', e.type, e.utterance === u, speechSynthesis.speaking]);
  u.addEventListener('end', (e) => seen.push(['listener-end', e.type, Object.prototype.toString.call(e)]));
  u.onend = () => seen.push(['onend', speechSynthesis.speaking]);

  speechSynthesis.speak(u);
  const speakingRightAfter = speechSynthesis.speaking;
  await new Promise((r) => setTimeout(r, 50));
  state.resolve();

  await state.done(() => {
    testing.expectEqual(true, speakingRightAfter);
    // start before end, and both the inline handler and the addEventListener
    // one see the end event. Their relative order is deliberately not asserted:
    // this engine runs the inline `on*` handler ahead of registered listeners
    // for every webapi, not just this one.
    testing.expectEqual(3, seen.length);
    testing.expectEqual(['onstart', 'start', true, true], seen[0]);
    testing.expectEqual(['onend', false], seen.find((s) => s[0] === 'onend'));
    testing.expectEqual(['listener-end', 'end', '[object SpeechSynthesisEvent]'], seen.find((s) => s[0] === 'listener-end'));
    testing.expectEqual(false, speechSynthesis.speaking);
  });
}
</script>

<script id=speech_cancel type=module>
{
  // cancel() before the task runs suppresses both events.
  const state = await testing.async();
  const u = new SpeechSynthesisUtterance('hello');
  let fired = 0;
  u.onstart = () => fired++;
  u.onend = () => fired++;
  speechSynthesis.speak(u);
  speechSynthesis.cancel();
  await new Promise((r) => setTimeout(r, 50));
  state.resolve();

  await state.done(() => {
    testing.expectEqual(0, fired);
    testing.expectEqual(false, speechSynthesis.speaking);
  });
}
</script>
