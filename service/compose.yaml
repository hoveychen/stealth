# docker compose -f service/compose.yaml up -d --build
#
# Builds from the repository root (service/Dockerfile); pass mirror build-args
# under build.args if downloads are slow (see the Dockerfile header).
#
# Several containers instead of one big one (see "Scaling" in README.md):
#
#   CRAWL_REPLICAS=4 CRAWL_PORTS=8081-8084 \
#     docker compose -f service/compose.yaml --profile multi up -d crawl-multi
#
# On a host with more than one NUMA node, pin each container to one node's
# cores with CRAWL_CPUSET (one compose project per node; see "NUMA" in
# README.md). Unset, the containers may run on any core.
#
#   CRAWL_CPUSET=$(cat /sys/devices/system/node/node0/cpulist) CRAWL_REPLICAS=2 CRAWL_PORTS=8081-8082 \
#     docker compose -f service/compose.yaml -p crawl-node0 --profile multi up -d crawl-multi
x-crawl-env: &crawl-env
  POOL_SIZE: 4                  # concurrent crawls; for more, add containers (16 each, at most 32)
  QUEUE_MAX: 100                # waiting requests before 503 queue_full
  DEFAULT_TIMEOUT_MS: 30000
  MAX_TIMEOUT_MS: 120000
  PARTIAL_GRACE_MS: 2000        # extra time after a timeout to fetch partial html/markdown
  # PROXY_POOL: "http://user:pass@10.0.0.1:3128,socks5://10.0.0.2:1080"
  # PROXY_POOL_FILE: /etc/lp-crawl/proxies.txt
  # PROXY_POOL_DEFAULT: "true"  # requests without "proxy" use the pool
  # PROXY_MAX_FAILS: 3
  # PROXY_RETRY_AFTER_MS: 60000
  # PROXY_POOL_RETRIES: 2       # pool requests move on to another proxy this many times
  # PROXY_PROBE: "10.0.0.9:443" # a host:port every proxy can reach: tells a dead site from a dead proxy
  # SESSION_TTL_MS: 604800000   # drop sessions idle for 7 days (0: never)
  # LP_CDP_MAX_CONNECTIONS: 12  # default 2*POOL_SIZE+4
  # LP_HTTP_MAX_CONCURRENT: 255 # engine-wide page loads in flight (engine default 40)
  LP_LOG_LEVEL: info

services:
  crawl:
    image: ${CRAWL_IMAGE:-lp-crawl}
    build:
      context: ..
      dockerfile: service/Dockerfile
    restart: unless-stopped
    # The default bridge instead of a compose-made network: one container needs
    # no network of its own, and creating one fails on a daemon whose address
    # pools are used up ("all predefined address pools have been fully subnetted").
    network_mode: bridge
    cpuset: ${CRAWL_CPUSET:-}       # e.g. one NUMA node's cores; empty: any core
    ports:
      - "${CRAWL_PORT:-8080}:8080"   # host port; the engine's CDP port is not published
    volumes:
      - crawl-data:/data             # session cookie jars (SESSION_DIR=/data/sessions)
      # - ./proxies.txt:/etc/lp-crawl/proxies.txt:ro
    environment: *crawl-env

  # CRAWL_REPLICAS containers of 16 slots, each on its own host port from
  # CRAWL_PORTS (a range at least as long as the replica count), with 21 CPUs
  # each (1.3 x POOL_SIZE). Put a load balancer in front and route every
  # session_id to one replica: each keeps its loaded sessions in memory.
  crawl-multi:
    image: ${CRAWL_IMAGE:-lp-crawl}
    profiles: [multi]
    restart: unless-stopped
    network_mode: bridge
    cpuset: ${CRAWL_CPUSET:-}
    ports:
      - "${CRAWL_PORTS:-8081-8084}:8080"
    volumes:
      - crawl-data:/data
    environment:
      <<: *crawl-env
      POOL_SIZE: 16
    deploy:
      replicas: ${CRAWL_REPLICAS:-4}
      resources:
        limits:
          cpus: "21"

volumes:
  crawl-data:
